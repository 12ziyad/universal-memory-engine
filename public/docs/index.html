<tr><td>Did something actually fail, or did I erase it?</td><td><code>failures.other</code> vs <code>failures.cancelled_by_delete</code>. Only the first needs investigating.</td></tr>
<tr><td>Are retries happening?</td><td><code>retries.jobs_with_retries</code> and <code>retries.max_attempts</code>.</td></tr>
<tr><td>Did an erasure converge?</td><td>The tenant's <code>barrier_at</code> is set and its <code>live_nodes</code> is zero.</td></tr>
<tr><td>How slow is it?</td><td><code>latency_ms.p50</code> / <code>p95</code>. Write latency is dominated by the model call.</td></tr>
</table>
<p><b>Metadata only.</b> This endpoint returns counts, states, timestamps and latency. It never returns memory content, labels, or project display names — a project's opaque id is included, the directory name it came from is not. <code>truncated: true</code> means the sub-tenant list was capped; your account's own root row is always present regardless.</p>

<h2>Per-memory-user detail</h2>
${codeBlock(`GET /v1/status?userId=your-user-42                 # counts for one memory user
GET /v1/jobs?userId=your-user-42                   # that user's job ledger
GET /v1/jobs?userId=your-user-42&cancelled=true    # only erasure-cancelled work
GET /v1/packets/<source_packet_id>/status          # one accepted write
GET /v1/requests?userId=your-user-42               # request history, metadata only`)}

<h2>Diagnosing a plugin install</h2>
<p>Both editor plugins ship a diagnostic that checks version, configuration, endpoint, credential presence, connectivity, the local outbox, and the project id the current directory derives. Neither prints your API key.</p>
${codeBlock(`# Claude Code — type it in a session
/itsuki:doctor
/itsuki:doctor --bind-outbox   # after rotating a key, re-key queued captures

# Codex — run it directly
node <plugin-root>/hooks/codex-doctor.mjs
node <plugin-root>/hooks/codex-doctor.mjs --json`)}
<p>Queued captures are never deleted by a diagnostic. If a key rotation stranded them, they are preserved and reported until you rebind deliberately.</p>
` };

PAGES["/privacy"] = { title: "Privacy & limits", html: `
<h1>Privacy &amp; limits</h1>
<p class="lede">What Itsuki keeps, what it never does with it, and the exact engineering bounds your code has to live inside.</p>

${prereq([
	`An API key with <code>memory:read</code>. Most commands here use one — see <a href="#/api/auth">Authentication &amp; keys</a>.`,
	`A terminal with <code>curl</code>. One of the calls below needs no credential at all.`,
	`For the export and erase steps, a role carrying <code>project.export</code> and <code>project.memory.delete</code> — see <a href="#/guides/projects">Projects, organizations, and teams</a>.`,
])}

<h2>What happens to your data</h2>
<p>Four commitments, and the mechanism that makes each one more than a sentence.</p>
<table>
<tr><th>Commitment</th><th>What stands behind it</th></tr>
<tr><td><b>Your memory is not training data.</b></td><td>Every AI call ${PRODUCT.name} makes — extraction, embeddings, reranking, previews — runs on Cloudflare Workers AI, inside the same network that hosts the database. No separate AI vendor receives your content, and under Cloudflare's developer-platform terms inference inputs and outputs are not used to train their models.</td></tr>
<tr><td><b>No selling, no ads, no profiling for third parties.</b></td><td>One purpose: operating your memory service. There is no advertising surface and no third-party data recipient to sell into.</td></tr>
<tr><td><b>No third-party trackers.</b></td><td>Visit counting is first-party and aggregate-only. It sets no cookie and stores no identifier — the mechanism is below, in full.</td></tr>
<tr><td><b>Memory content is not browsed.</b></td><td>Operational account activity — sign-ins, save and recall counts, errors, and security logs holding hashed IPs — is visible to the operator for support and abuse prevention. The content of your memories is not part of that. The <a href="#/operate/observability">operator endpoints available to <i>you</i></a> return counts, states and timings only, never content.</td></tr>
</table>

<p>Every response carries an <code>x-request-id</code> header. It ties one call of yours to the server-side record without anyone reading the memory involved, so quote it when you report a problem rather than pasting the content.</p>

<div class="note"><b>The identifier you choose becomes provenance.</b> A <code>userId</code> you pass for a sub-tenant is kept as part of that write's provenance, so your own account can list its tenants. Pick an opaque, stable internal id rather than an end user's email address. The value is hashed together with the owning account before it becomes a storage key, so two accounts using the same string address completely different memory spaces — but the string you sent is still yours to choose well.</div>

<p>The full documents are on the site: <a href="${ORIGIN}/privacy" target="_blank" rel="noopener">Privacy Policy</a> · <a href="${ORIGIN}/terms" target="_blank" rel="noopener">Terms</a>.</p>

<h2>What the site actually counts</h2>
<p>The landing page and app send one aggregate beacon per real page load. Here is everything that happens to it, so you can judge the claim rather than take it:</p>
<ul>
<li><b>One count per load.</b> Single-page re-routes never double-count, and the counter row is a day plus a page kind — <code>landing</code>, <code>app</code>, or <code>legal</code>.</li>
<li><b>Crawlers and automation are counted nowhere.</b> The user-agent is inspected against a bot pattern and then discarded; it is never stored. A browser reporting <code>navigator.webdriver</code> is dropped the same way.</li>
<li><b>Approximate uniques, not visitors.</b> A truncated hash of IP plus user-agent plus a <i>daily</i> salt goes into a bounded per-day sketch. The raw IP and user-agent are never written, and the salt changes with the day, so yesterday's hash cannot be matched to today's.</li>
<li><b>Dimensions are aggregate.</b> A referrer is reduced to a bare domain and counted; country and a desktop/mobile class are counted. Each is a row of the form day, dimension, value, count. There is no per-visit record to join them back together.</li>
<li><b>Admin traffic is excluded</b> from app counts, so the number means real usage rather than the operator refreshing a console.</li>
</ul>
<p>Signing in does set a session cookie — that is authentication, not analytics, and it is the only cookie in play.</p>

<h2>Secrets are removed before anything durable sees them</h2>
<p>Every save door scrubs incoming text first — before the source row, before the Durable Object's held chunk, before the model, before the vectors. Once a secret reaches a model or an embedding you cannot take it back, so this runs at the front.</p>
<p>The contract is that meaning survives and the secret does not. A sentence about connecting to AuraDB at a <code>neo4j+s://</code> URL keeps the fact that you use AuraDB and loses the credential inside it. Typed placeholders say what <i>was</i> there, so recall can still answer a question about it.</p>

<table>
<tr><th>What it matches</th><th>What is stored instead</th></tr>
<tr><td>PEM private-key blocks</td><td><code>[REDACTED:private-key]</code></td></tr>
<tr><td>Connection URIs carrying a password — <code>postgres://</code>, <code>mongodb+srv://</code>, <code>neo4j+s://</code>, <code>redis://</code></td><td>Scheme, username and host survive; the password becomes <code>[REDACTED:password]</code></td></tr>
<tr><td>Known key shapes: <code>sk-</code>, the GitHub <code>gh</code> family and <code>github_pat_</code>, <code>pypi-</code>, <code>AKIA</code> and <code>ASIA</code>, Slack <code>xox</code> tokens, JWTs, and ${PRODUCT.name}'s own <code>${PRODUCT.tokenPrefix}</code> and <code>uml_live_</code> keys</td><td><code>[REDACTED:api-key]</code></td></tr>
<tr><td>Query-string secrets — <code>?api_key=</code>, <code>&amp;token=</code>, <code>&amp;secret=</code>, <code>&amp;password=</code></td><td>The parameter name survives, the value becomes <code>[REDACTED:secret]</code></td></tr>
<tr><td>A token after the word <code>Bearer</code></td><td><code>[REDACTED:token]</code></td></tr>
<tr><td>A labelled value — a config line, a JSON key, or prose such as "my client secret is …"</td><td>The label survives because it carries the meaning; the value becomes <code>[REDACTED:secret]</code></td></tr>
<tr><td>A generic high-entropy run of 32 or more characters</td><td><code>[REDACTED:secret]</code></td></tr>
</table>

<p>Two things deliberately do <i>not</i> match, because memory exists to keep prose. Pure hex up to 64 characters is treated as a hash, not a secret — a commit SHA pasted into a stack trace stays readable. And a sentence that only <i>describes</i> a secret survives intact: "the token is expired" and "my password is stored in 1Password" are facts worth keeping, and the scrubber requires a contiguous value with a digit or symbol before it will redact one.</p>

<div class="warn"><b>This is a strong net, not a guarantee.</b> An unlabelled high-entropy string under 32 characters, or a labelled passphrase of ordinary words, can still be stored. Treat memory as a store you write to deliberately — not as a place where pasting a credential is safe.</div>

<p>Two later gates back it up. An extracted assertion whose text still trips the scrubber is <b>rejected outright</b> with the reason <code>secret_material</code> rather than promoted into the graph. And evidence lines pulled from stored source text are re-scrubbed on the way out, before they can enter a recall context block.</p>

<h2>Switching capture off for one message</h2>
<p>A person can decline capture in the message itself. The phrases are matched on user text only, in any of the save doors:</p>
${codeBlock(`Ship the release from my laptop tonight. Don't remember this.`, "message")}

<p>Recognised forms are "do not remember / save / store this", "forget this after replying", and "no memory for this". A clear allow <i>after</i> the opt-out in the same text wins — "actually, remember this" restores capture, because the last instruction is the one the person meant.</p>

<p>Nothing durable is written, and the verdict comes back as a receipt the caller can show:</p>
${outputBlock(`{
  "outcome": "no_write",
  "reason": "user_opt_out",
  "durable": false,
  "opt_out": true,
  "savedTotal": 0,
  "skippedReasons": { "user_opt_out": 1 }
}`, "Receipt")}

<div class="note"><b>The receipt itself is transient.</b> An opt-out is a response, not an audit artifact, so no receipt row is stored and its <code>receipt_id</code> is <code>null</code>. Persisting even a content-free receipt once copied the matched phrase into the database, which is precisely the text the person asked us not to keep.</div>

<p>A per-message opt-out is a one-off. For a standing "never remember anything matching this", use rules instead — see <a href="#/guides/rules">Control what gets remembered</a>.</p>

<h2>Audit and take back your own data</h2>
<ol class="steps">
<li><b>Read the enforced limits.</b><p>No credential required. This document is generated from the same constants the enforcement path reads, so the published number cannot drift from the enforced one.</p>
${codeBlock(`curl ${ORIGIN}/v1/limits`, "terminal")}
${outputBlock(`{
  "ok": true,
  "schema": "itsuki.limits/v1",
  "rate": {
    "unit": "requests",
    "buckets": {
      "save": { "limit": 60, "period_s": 60,
                "applies_to": ["POST /v1/save", "POST /v1/turn",
                               "mcp:save_memory", "mcp:save_conversation"] }
    },
    "scope": "per credential, per project",
    "accuracy": "eventually consistent; protection, not accounting",
    "on_exceeded": { "http_status": 429, "headers": ["retry-after", "ratelimit-limit"] }
  },
  "ingest": { "limits": { "maxMessages": 30, "maxMessageCharacters": 4000,
                          "maxTotalCharacters": 120000, "maxRequestBytes": 524288 },
              "character_unit": "unicode_code_points",
              "request_encoding": "utf-8-json" }
}`, "Response (trimmed to one bucket)")}</li>

<li><b>Read your own consumption.</b><p>The limits document is public; your usage is not, so this one takes the key. It is computed live from receipts and content tables — nothing extra is tracked to produce it.</p>
${codeBlock(`curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  "${ORIGIN}/v1/usage?range=30d"`, "terminal")}
${outputBlock(`{
  "ok": true,
  "range": { "from": "2026-07-28", "to": "2026-08-27", "days": 30 },
  "totals": { "memories": 53, "nodes": 41, "pages": 12,
              "slices": 88, "events": 19,
              "saves": 118, "recalls": 402, "requests": 520 },
  "by_source": [ { "source": "mcp", "count": 96, "saved_total": 141 } ],
  "last_activity_at": 1756288462081,
  "ai": { "calls": 214, "input_tokens": 118402, "output_tokens": 20117,
          "neurons_measured": 8241.55, "neurons_derived": 402.18,
          "neurons_total": 8643.73, "neurons_source": "measured+derived" },
  "quota": { "unit": "ai_writes", "used": 118, "limit": 1000,
             "remaining": 882, "period": "calendar_month_utc",
             "resets_at": "2026-09-01T00:00:00.000Z", "capped": false }
}`, "Response (trimmed)")}</li>

<li><b>Download everything you own.</b><p><code>GET /v1/export</code> returns the memory space resolved for that request as one JSON body: live memory objects, receipts, rules, and revision history for objects that still exist. It does not aggregate sibling SDK sub-tenant spaces — each of those is its own space and exports separately.</p>
${codeBlock(`curl -s -H "authorization: Bearer $ITSUKI_API_KEY" \\
  ${ORIGIN}/v1/export -o itsuki-export.json

python -c "import json;d=json.load(open('itsuki-export.json'));[print(k, len(v) if isinstance(v,list) else v) for k,v in d.items()]"`, "terminal")}
${outputBlock(`format uml-export
version 1
exported_at 2026-08-27T09:14:22.081Z
user_id u_3f8a2b…
nodes 41
slices 88
events 19
edges 27
memory_pages 12
candidates 4
receipts 260
memory_rules 3
memory_revisions 17`, "Terminal")}
<p>Revision history is bounded at 50,000 rows. If it is reached the payload carries a <code>history_truncated</code> block naming the limit rather than presenting a partial download as complete — per-object history stays available at <code>GET /v1/memories/&lt;id&gt;/history</code>.</p></li>

<li><b>Preview an erasure before you commit to one.</b><p><code>dry_run</code> is the default: without <code>confirm=true</code> the call counts everything that would go and touches nothing.</p>
${codeBlock(`curl -X DELETE -H "authorization: Bearer $ITSUKI_API_KEY" \\
  ${ORIGIN}/v1/memories`, "terminal")}
${outputBlock(`{
  "ok": true,
  "dry_run": true,
  "would_delete": { "runs": 3, "nodes": 41, "pages": 12,
                    "slices": 88, "events": 19, "edges": 27, "candidates": 4 },
  "sample_labels": ["Kotlin", "Porto depot", "Design review"],
  "pending_jobs": 2,
  "note": "2 accepted save(s) are still processing; a confirmed delete will cancel them."
}`)}
<p>The preview enumerates from the authoritative tables, not from bookkeeping manifests — a row written by extraction that raced an earlier delete is still live, so it is still discoverable and still removable.</p></li>

<li><b>Confirm, then check that it took.</b><p>Only <code>confirm=true</code> destroys. A confirmed unscoped delete installs an erasure barrier: a per-tenant timestamp meaning that work accepted before that instant may never produce durable rows after it. In-flight extraction is cancelled in the same transaction, and the sweep repeats until every table counts zero.</p>
${codeBlock(`curl -X DELETE -H "authorization: Bearer $ITSUKI_API_KEY" \\
  "${ORIGIN}/v1/memories?confirm=true"

curl -H "authorization: Bearer $ITSUKI_API_KEY" ${ORIGIN}/v1/status`, "terminal")}
${outputBlock(`{ "ok": true, "counts": { "memories": 0, "pages": 0, "slices": 0, "events": 0 } }`, "Response from /v1/status")}
<p>Zeros across the board are the verification. If a count is still non-zero, a save accepted before the barrier was mid-flight — re-run the preview, which will now show what is left.</p></li>
</ol>

<div class="warn">Step 5 is irreversible for the memory space that credential resolves to. Take the export in step 3 first if there is any chance you want the data back.</div>

<h2>Every way to remove data</h2>
<table>
<tr><th>Surface</th><th>Covers</th><th>Confirmation</th></tr>
<tr><td><code>DELETE /v1/memories/&lt;id&gt;</code></td><td>One node, page, slice or candidate. The row is soft-deleted; identity and version residue are hard-deleted.</td><td>None. Rate-limited by the tighter delete bucket.</td></tr>
<tr><td><code>DELETE /v1/memories</code></td><td>The whole memory space that credential resolves to, with an erasure barrier and cancellation of in-flight work.</td><td><code>confirm=true</code>. Dry run is the default.</td></tr>
<tr><td>Memories → row menu → <b>Delete</b></td><td>One memory. <b>Archive</b> is the soft alternative: archived memories leave recall but stay available for audit.</td><td>A confirm dialog.</td></tr>
<tr><td>Settings → Project → General → <b>Delete memory…</b></td><td>Every memory in the project — the root space and every SDK subtenant, including sources, vectors, exports and queued work — then the empty project returns to active. Settings, members and keys survive.</td><td>Preview first, then type the project name. Project admin.</td></tr>
<tr><td>Settings → Project → General → <b>Delete project…</b></td><td>The project itself: memory, keys, members and settings. A content-free tombstone remains.</td><td>Preview first, then type the project name. Organization owner only; the default project can never be deleted.</td></tr>
<tr><td>The account itself</td><td>Not self-serve. Account erasure is requested through support and completed after ownership and shared-organization checks.</td><td>—</td></tr>
</table>

<div class="note"><b>Two export paths, two filenames.</b> The <b>Memory exports</b> screen builds an export as a background job and hands you <code>itsuki-export-&lt;date&gt;.json</code>. The one-shot <b>Export current memory space</b> button in Settings → Personal → Profile &amp; security → Data &amp; Privacy calls <code>GET /v1/export</code> directly and saves <code>uml-export-&lt;date&gt;.json</code>, with the pre-rename prefix. Same content, different file name — do not let a script key off the name.</div>

<h2>The limits</h2>
<p>Three different things are bounded, and they have different errors and different recoveries. <b>Rate buckets</b> stop a runaway loop. <b>Input bounds</b> refuse a request the extractor could not use anyway. The <b>context bound</b> caps what recall hands back to a model.</p>

<h3>The six rate buckets</h3>
<table>
<tr><th>Bucket</th><th>Limit</th><th>Applies to</th></tr>
<tr><td><code>auth</code></td><td>10 / 60 s</td><td><code>/auth/*</code> — sign-in, sign-up, email codes, password changes. Keyed per IP as well as per actor.</td></tr>
<tr><td><code>save</code></td><td>60 / 60 s</td><td><code>POST /v1/save</code>, <code>POST /v1/turn</code>, and the MCP save tools.</td></tr>
<tr><td><code>recall</code></td><td>120 / 60 s</td><td><code>POST /v1/recall</code> and the MCP recall tool.</td></tr>
<tr><td><code>delete</code></td><td>30 / 60 s</td><td>Both delete routes and the MCP delete tools. Tighter than saving on purpose: a loop that deletes is worse than a loop that saves.</td></tr>
<tr><td><code>import</code></td><td>300 / 60 s</td><td><code>POST /v1/ingest</code>. Bulk backfill is legitimate burst traffic.</td></tr>
<tr><td><code>read</code></td><td>240 / 60 s</td><td>Listing and fetching memory objects, and the MCP read tools. Reads cost database rows, not inference.</td></tr>
</table>
<p>A bucket is keyed by the authenticated actor and the project it is bound to — never by the caller-selected <code>userId</code>. If the sub-tenant id were part of the key, an SDK could rotate it every request and buy itself a fresh bucket. One key serving a thousand end users shares one bucket.</p>

<div class="note">These counters are protection, not accounting. The underlying limiter is eventually consistent, so the exact request at which a bucket trips is not deterministic. That is also why a <code>429</code> carries <code>ratelimit-limit</code> but no remaining or reset figure — publishing a count that cannot be computed would be a lie.</div>

<h3>Input bounds</h3>
<table>
<tr><th>Boundary</th><th>Limit</th><th>Refusal</th></tr>
<tr><td>Messages in one ingest request</td><td>30</td><td><code>422 ingest_message_count_exceeded</code></td></tr>
<tr><td>One message's content</td><td>4,000 Unicode code points</td><td><code>422 ingest_message_characters_exceeded</code></td></tr>
<tr><td>Combined message content</td><td>120,000 Unicode code points</td><td><code>422 ingest_total_characters_exceeded</code></td></tr>
<tr><td>Serialized ingest request</td><td>512 KiB of UTF-8 JSON</td><td><code>413 ingest_request_too_large</code></td></tr>
<tr><td><code>content</code> on a save</td><td>120,000 characters</td><td><code>400 payload_too_large</code>, naming the field and its actual size</td></tr>
<tr><td><code>query</code> on a recall</td><td>8,000 characters</td><td><code>400 payload_too_large</code> — a recall query is a question, not a document</td></tr>
</table>
<p>Characters are counted as Unicode <i>code points</i> and the byte ceiling is measured on the real serialized body, so neither can be slipped past with multibyte text or JSON escape sequences. Every violation is atomic: nothing was queued, and the response carries the full limits object so a batcher can re-plan in one pass.</p>

<h3>What recall hands back</h3>
<p>The context block is bounded so memory sharpens a prompt rather than flooding it. The budget depends on how deeply recall decided to go:</p>
<table>
<tr><th>Recall mode</th><th>Context budget</th></tr>
<tr><td><code>no_recall</code></td><td>0 — the question did not need personal context</td></tr>
<tr><td><code>light_recall</code>, the targeted default</td><td>1,800 characters</td></tr>
<tr><td>Update mode</td><td>2,400 characters</td></tr>
<tr><td><code>deep_recall</code></td><td>2,800 characters</td></tr>
<tr><td>Raised by an explicit <code>limit</code></td><td>Grows by 220 characters per extra item, to a hard ceiling of 24,000</td></tr>
</table>
<p><code>limit</code> is validated by name and never silently clamped: a value outside 1–200 is a <code>400</code> with code <code>invalid_limit</code> and a message saying so. A line that would overflow the remaining budget is clipped with a trailing ellipsis rather than dropped, because breaking on the first long line used to return an empty context while recall had strong matches.</p>

<div class="note"><b>Read the numbers, do not copy them.</b> <code>GET /v1/limits</code> is the authoritative live document and needs no key; <code>GET /v1/ingest/limits</code> returns the ingest half alone for clients that only batch conversations. <a href="#/api/limits">Rate limits and quotas</a> covers the AI write ceiling, backoff strategy, and the internal engine boundaries in full.</div>

<h2>When it doesn't work</h2>
<table>
<tr><th>What you see</th><th>What it means</th><th>Fix</th></tr>
<tr><td><code>429</code> · <code>"error": "too_many_requests"</code> with a <code>bucket</code> field</td><td>That bucket tripped. Nothing was written.</td><td>Honour <code>retry-after</code> rather than a fixed sleep. <code>bucket</code> tells you which half of your loop to slow down.</td></tr>
<tr><td><code>200</code> · <code>"recall_status": "rate_limited"</code> with an empty context</td><td>Recall degraded instead of failing — a hard error inside somebody's chat loop breaks the turn for no benefit.</td><td>Check <code>recall_status</code> before concluding that a user has no memory.</td></tr>
<tr><td><code>413 ingest_request_too_large</code></td><td>The serialized body passed 512 KiB. Nothing was queued.</td><td>Re-batch using the <code>limits</code> object returned in the body.</td></tr>
<tr><td><code>400 payload_too_large</code> · <i>"content is 240KB — the limit is 120KB."</i></td><td>One save was larger than the extractor can use.</td><td>Split it into separate saves, or send it as <code>messages[]</code>.</td></tr>
<tr><td><code>429</code> · <code>"error": "ai_quota_exhausted"</code></td><td>The account-wide monthly ceiling on writes that need model inference. Recall does not count against it.</td><td>Read <code>usage.resets_at</code> from the body and hold the work. Retrying sooner cannot succeed.</td></tr>
<tr><td><code>503</code> · <code>"error": "ai_quota_unavailable"</code></td><td>The ceiling could not be read, so the write was refused rather than guessed at. Nothing was saved.</td><td>Retry shortly. This path fails closed on purpose — an unreadable budget means unbounded work of unknown size.</td></tr>
<tr><td>A stored fact reads <code>[REDACTED:secret]</code></td><td>The scrubber matched before anything durable saw the text.</td><td>Rewrite the sentence without the value. The original was never written, so there is nothing to recover.</td></tr>
<tr><td><code>DELETE /v1/memories</code> reports counts but nothing disappears</td><td><code>dry_run</code> is the default.</td><td>Add <code>confirm=true</code>. Sending <code>dry_run=false</code> without <code>confirm=true</code> still previews.</td></tr>
<tr><td><code>403 insufficient_scope</code>, or a <code>403</code> naming a capability</td><td>Scopes are the first gate; a key also carries its creator's current project role, resolved fresh on every request.</td><td>Export needs <code>project.export</code>; erasure needs <code>project.memory.delete</code>. See <a href="#/api/auth">Authentication &amp; keys</a>.</td></tr>
</table>

<h2>Where to go next</h2>
${nextSteps([
	["#/api/limits", "Rate limits and quotas", "Every bucket, the input bounds, and how to back off without losing writes."],
	["#/concepts/delete", "Delete & erasure", "The erasure barrier, convergence passes, and what a confirmed delete cancels."],
	["#/guides/export", "Export and delete your data", "Both export paths and the project danger zone, step by step."],
	["#/guides/rules", "Control what gets remembered", "Standing include and exclude rules, instead of a per-message opt-out."],
])}
` };

PAGES["/integrations/langchain"] = { title: "LangChain", html: `
<h1>LangChain</h1>
<p class="lede">LangChain and LangGraph reach Itsuki through the MCP endpoint: connect once with <code>langchain-mcp-adapters</code> and your agent gets save, recall, list, get, delete, and whoami as ordinary LangChain tools.</p>

<h2>What this integration is</h2>
<p>There is no <code>itsuki-langchain</code> package, and there should not be. LangChain already ships an MCP adapter, and Itsuki already serves a Streamable HTTP MCP endpoint, so the connection is four lines of configuration instead of a dependency you would have to keep in step with two moving frameworks. The same client covers LangGraph: <code>get_tools()</code> returns <code>BaseTool</code> instances, which is what both accept.</p>
<p>One property matters before you build on it. <b>The model decides when to call a tool.</b> A connected server is not proof of a save, and an agent that never gets around to calling <code>recall_memory</code> will answer from nothing. If you need memory on every turn regardless of what the model feels like doing, use the direct route below — instead of the tools, or alongside them.</p>

<h2>Before you start</h2>
<p>Create an <b>MCP link</b> — open <b>Get started</b>, pick your client, and click <b>Create link</b>. It is shown once, and it is a credential: the header below carries it, so load it from the environment in anything you commit. An <b>API key</b> works on this door too, in the same header. What does not work is putting either one in the URL path of the header route — see <a href="#/api/auth">Authentication and keys</a>.</p>

<h2>Connect the tools</h2>
<pre><button class="copy">Copy</button><code>pip install langchain-mcp-adapters langgraph</code></pre>
<pre><button class="copy">Copy</button><code>import asyncio
import os

from langchain.chat_models import init_chat_model
from langchain_mcp_adapters.client import MultiServerMCPClient
from langgraph.prebuilt import create_react_agent

client = MultiServerMCPClient({
    "itsuki": {
        "transport": "http",
        "url": "https://itsuki.app/mcp",
        "headers": {"Authorization": f"Bearer {os.environ['ITSUKI_MCP_KEY']}"},
    }
})


async def main():
    tools = await client.get_tools()
    agent = create_react_agent(init_chat_model("openai:gpt-4.1"), tools)

    await agent.ainvoke({"messages": [
        {"role": "user", "content": "Remember that I deploy on Fridays only."}
    ]})

    answer = await agent.ainvoke({"messages": [
        {"role": "user", "content": "When am I allowed to deploy?"}
    ]})
    print(answer["messages"][-1].content)


asyncio.run(main())</code></pre>
<p>The first invocation calls <code>save_memory</code> and gets a receipt back. The second calls <code>recall_memory</code>, whose text result <i>is</i> the recalled context — the model can read it directly, with no post-processing. Extraction runs in the background, so a recall issued in the same second as a save may not see it yet.</p>
<div class="note">Only the client block above is Itsuki's contract, and it is the shape verified against production. The agent wiring is LangChain's own API and moves at LangChain's pace; if <code>create_react_agent</code> has moved in your version, the tools list still goes wherever that version wants tools.</div>

<h2>Scoping memory to one end user</h2>
<p>Over MCP the memory space is fixed by the credential. <b>No memory tool takes a user id</b>, on purpose: every tool argument is written by a model that has just read text somebody else wrote, so tenancy is never expressible as an argument. A personal assistant with one MCP link is therefore already finished — it has exactly one memory space and cannot address another.</p>
<p>An application serving many end users needs the opposite arrangement: the user id comes from your session, and the model never touches it. Call memory directly from your graph with the <a href="#/sdk/python">Python SDK</a>.</p>
<pre><button class="copy">Copy</button><code>import os

from itsuki import MemoryClient
from langchain_core.messages import SystemMessage

memory = MemoryClient(api_key=os.environ["ITSUKI_API_KEY"])


def recall_node(state, config):
    """Runs before the model. Adds context, or adds nothing."""
    user_id = config["configurable"]["user_id"]   # your session, never the model
    result = memory.search(state["messages"][-1].content, user_id=user_id)
    if not result.get("context"):
        return {"messages": []}
    return {"messages": [SystemMessage(content=result["context"])]}


def capture_node(state, config):
    """Runs after the answer has settled."""
    user_id = config["configurable"]["user_id"]
    turns = [
        {"role": "user" if m.type == "human" else "assistant", "content": m.content}
        for m in state["messages"][-2:]
    ]
    memory.add_conversation(
        turns,
        user_id=user_id,
        conversation_id=config["configurable"]["thread_id"],
        idempotency_key=MemoryClient.new_idempotency_key(),
    )
    return {}</code></pre>
<p>Any stable string works as <code>user_id</code> — your user id, a tenant slug, an email. It is hashed with your account id before it becomes a storage key, so two accounts sending the same string still get different spaces. A stable <code>conversation_id</code> converges re-sends of one thread onto a single Conversation page instead of making a new one each time. <a href="#/concepts/scope">Who memory belongs to</a> has the full model.</p>
<div class="warn">Do not mix the two routes in a multi-tenant app. If the MCP tools are attached, every end user of that agent reads and writes the one space the credential owns. Attach the tools only for single-user agents.</div>

<h2>Verify the connection</h2>
<p>Ask the agent to <i>"save that I prefer concise answers, then recall what you know about me"</i>. A working connection reports a receipt for the save and returns the fact on recall. The <code>whoami</code> tool reports identity, scopes, bound project, and live counts at any time, and never echoes the key — it is the fastest way to prove a credential actually reached the server.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>No tools come back from <code>get_tools()</code></b> — the URL must be exactly <code>https://itsuki.app/mcp</code> with no trailing path, and the header must read <code>Authorization: Bearer &lt;key&gt;</code>.</li>
<li><b>401</b> — the key is revoked, or was pasted with whitespace. If you put a key in the URL instead of the header, the server names that mistake rather than pretending the key is bad.</li>
<li><b>Import errors mentioning <code>mcp.shared</code>, <code>RequestContext</code>, or "not enough values to unpack"</b> — an upstream clash between adapters written for the <code>mcp</code> 1.x Python API and an installed <code>mcp</code> 2.x. It affects every MCP server, not just Itsuki. Pin with <code>pip install "mcp&lt;2"</code>.</li>
<li><b>The agent answers without ever calling a tool</b> — tool selection belongs to the model. Put "call recall_memory at the start of a conversation" in the system prompt, or move recall into a node as shown above.</li>
<li><b>The save returned a receipt but recall is empty</b> — extraction is asynchronous. Allow a few seconds, or poll the packet handle the save returned.</li>
<li><b>429</b> — writes are limited to 60 per minute per user. Back off and retry; bulk imports belong on <code>POST /v1/ingest</code>.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/api/mcp">MCP tools</a> — what each tool takes and returns.</li>
<li><a href="#/sdk/python">Python SDK</a> — the direct route in full.</li>
<li><a href="#/integrations/python">Python frameworks</a> — every Python client shape on one page.</li>
<li><a href="#/concepts/scope">Who memory belongs to</a> — sub-tenants, projects, and recall scope.</li>
</ul>
` };

PAGES["/integrations/llamaindex"] = { title: "LlamaIndex", html: `
<h1>LlamaIndex</h1>
<p class="lede">Itsuki becomes the long-term half of LlamaIndex's own <code>Memory</code> class: install one package, pass it where the agent expects memory, and short-term chat history keeps working exactly as the host intends.</p>

<h2>Two routes, and which one you want</h2>
<p><b>The native memory block</b> — <code>llama-index-memory-itsuki</code> — is the route to start with. It is a <code>BaseMemoryBlock</code>, so recall and capture happen inside the agent's normal memory lifecycle and the model never has to decide to look something up.</p>
<p><b>The MCP route</b> gives the model memory <i>tools</i> instead, which it may or may not call. Use it when you want an explicit "save that for later" rather than an automatic layer, or when you already have an MCP-based tool setup.</p>
<div class="note">LlamaIndex has deprecated the <code>BaseMemory</code> generation older third-party integrations target — <code>ChatMemoryBuffer</code>, <code>SimpleComposableMemory</code> and friends. The current architecture is <code>Memory</code> composing <code>BaseMemoryBlock</code> subclasses, so that is what this package ships.</div>

<h2>Install the memory block</h2>
<pre><button class="copy">Copy</button><code>pip install llama-index-memory-itsuki</code></pre>
<p>Create an <b>API key</b> in <b>API Keys</b> — a server credential, not an MCP link — and set it as <code>ITSUKI_API_KEY</code>. The package reads it from the environment; <code>ITSUKI_BASE_URL</code> overrides the service origin if you need it to.</p>

<h2>A complete example</h2>
<pre><button class="copy">Copy</button><code>import asyncio
import os

from llama_index.core.agent.workflow import FunctionAgent
from llama_index.llms.openai import OpenAI
from llama_index.memory.itsuki import itsuki_memory

assert os.environ.get("ITSUKI_API_KEY"), "ITSUKI_API_KEY is not set"

agent = FunctionAgent(llm=OpenAI(model="gpt-4.1"), tools=[])


async def main():
    memory = itsuki_memory(user_id="user_42", session_id="thread_9")

    await agent.run("I am vegetarian and allergic to nuts.", memory=memory)
    answer = await agent.run("What can I cook for dinner?", memory=memory)
    print(answer)


asyncio.run(main())</code></pre>
<p><code>itsuki_memory()</code> builds a host <code>Memory</code> whose long-term block is Itsuki. On each turn the block's <code>_aget</code> supplies the durable memory for that turn — an empty string when there is nothing, which the host skips. Its <code>_aput</code> receives messages <b>as they flush out of short-term memory</b>, not on every turn, and stages them for extraction. That is worth knowing when you test: a fact stated in the very first message becomes durable when the short-term buffer flushes, which <code>token_limit</code> controls (30,000 by default).</p>

<h3>Compose it yourself</h3>
<p>If you want a different arrangement of blocks, take the block rather than the factory.</p>
<pre><button class="copy">Copy</button><code>from llama_index.core.memory import Memory
from llama_index.memory.itsuki import itsuki_memory_block

memory = Memory.from_defaults(
    session_id="thread_9",
    memory_blocks=[itsuki_memory_block("user_42", session_id="thread_9")],
)</code></pre>

<h2>Scoping memory per end user</h2>
<p><code>user_id</code> is the memory space and it is required — there is no default, because there is no safe guess for whose memory this is. Construct one memory object per end user, from your own session, and never from anything a model produced.</p>
<table>
<tr><th>Argument</th><th>Meaning</th></tr>
<tr><td><code>user_id</code></td><td>The isolated memory space. Required; no default.</td></tr>
<tr><td><code>session_id</code></td><td>The conversation, and the de-duplication anchor for capture.</td></tr>
<tr><td><code>agent_id</code>, <code>run_id</code></td><td>Attribution only. Neither selects a tenant.</td></tr>
<tr><td><code>project_id</code></td><td>Attribution, and enables project-scoped recall.</td></tr>
<tr><td><code>recall_scope</code></td><td>Defaults to <code>project_then_global</code> when <code>project_id</code> is set, otherwise <code>global</code>.</td></tr>
<tr><td><code>search_msg_limit</code></td><td>How many recent turns inform the recall query. Default 5.</td></tr>
<tr><td><code>max_items</code>, <code>max_context_chars</code></td><td>Hard ceilings on what recall may inject.</td></tr>
</table>
<p>The block is async-first because <code>BaseMemoryBlock</code> is: it uses the SDK's <code>AsyncMemoryClient</code>, so it does not block the event loop your agent runs on once per step for the length of an HTTP round trip.</p>

<h2>The MCP route</h2>
<p>LlamaIndex's MCP client documents OAuth but <b>no custom headers</b>, so a header-only memory service cannot connect there at all. Itsuki's path-token door carries the credential in the URL itself, which makes <code>BasicMCPClient</code> work unchanged. Create an <b>MCP link</b> for this route and treat the config file as a secret — the URL <i>is</i> the key.</p>
<pre><button class="copy">Copy</button><code>pip install "llama-index-tools-mcp==0.4.0"

from llama_index.tools.mcp import BasicMCPClient, McpToolSpec

client = BasicMCPClient("https://itsuki.app/mcp/YOUR_MCP_KEY")
tools = McpToolSpec(client=client)</code></pre>
<p>The version pin is not decoration: newer releases of that adapter clash with <code>mcp</code> 2.x. This is the version the route was verified against.</p>

<h2>Behaviour under failure</h2>
<p><code>_aget</code> returns an empty string and <code>_aput</code> returns quietly. A memory outage costs the agent context, never the answer. The API key is held as a private attribute, so it never appears in <code>model_dump()</code>, an export, or serialized agent state. A replayed flush stores one memory rather than two, because the idempotency key is derived from the content.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>"The Itsuki API key is not configured"</b> — <code>ITSUKI_API_KEY</code> is not visible to the process. Set it in the environment that launches your app, or pass <code>api_key=</code> explicitly.</li>
<li><b><code>user_id is required</code></b> — deliberate. Pass your own stable id for the end user; the package refuses to invent one.</li>
<li><b>Nothing was captured after a short test</b> — capture happens when messages flush out of short-term memory. Run enough turns to reach <code>token_limit</code>, or lower it in <code>itsuki_memory(..., token_limit=...)</code>.</li>
<li><b>Recall is empty right after a save</b> — extraction is asynchronous. Allow a few seconds and query again.</li>
<li><b>Import errors mentioning <code>mcp.shared</code> or <code>RequestContext</code> on the MCP route</b> — pin both <code>llama-index-tools-mcp==0.4.0</code> and <code>"mcp&lt;2"</code>.</li>
<li><b>401 on the MCP route</b> — an API key was pasted into the URL. Only a token created as an <b>MCP link</b> works in a path; the server says so by name.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/integrations/native">Native packages</a> — the other frameworks with their own memory interface.</li>
<li><a href="#/api/mcp">MCP tools</a> — what the tool route exposes.</li>
<li><a href="#/concepts/scope">Who memory belongs to</a> — sub-tenants and project scope.</li>
<li><a href="#/sdk/python">Python SDK</a> — the client underneath this package.</li>
</ul>
` };

PAGES["/integrations/crewai"] = { title: "CrewAI", html: `
<h1>CrewAI</h1>
<p class="lede">CrewAI reaches Itsuki through <code>MCPServerAdapter</code>: one server block, and every agent in the crew can save, recall, list, get, and delete memory as ordinary CrewAI tools.</p>

<h2>What this integration is</h2>
<p>There is no <code>itsuki-crewai</code> package. CrewAI already ships an MCP adapter in <code>crewai-tools</code>, and Itsuki already serves a Streamable HTTP MCP endpoint, so the integration is a server-parameters dict — nothing to install from us, nothing to keep in step with two release trains.</p>
<p>What you get is <b>shared memory across a crew</b>. Every agent handed the same tools reads and writes the same memory space, so a researcher's finding is available to a writer in a later task without either of them passing it explicitly. That is usually what you want. It also means the crew has exactly one memory space, which matters for the scoping section below.</p>

<h2>Install</h2>
<p>MCP support lives in an extra. Install <code>crewai-tools[mcp]</code>, not plain <code>crewai-tools</code>, or <code>MCPServerAdapter</code> will not be exported and the import will fail with a name error that looks like a version problem.</p>
<pre><button class="copy">Copy</button><code>pip install "crewai-tools[mcp]"</code></pre>
<p>Then create an <b>MCP link</b> — open <b>Get started</b>, pick your client, and click <b>Create link</b>. It is shown once. The header below carries it, so read it from the environment rather than committing it.</p>

<h2>A complete example</h2>
<pre><button class="copy">Copy</button><code>import os

from crewai import Agent, Crew, Task
from crewai_tools import MCPServerAdapter

server_params = {
    "url": "https://itsuki.app/mcp",
    "transport": "streamable-http",
    "headers": {"Authorization": f"Bearer {os.environ['ITSUKI_MCP_KEY']}"},
}

with MCPServerAdapter(server_params) as tools:
    assistant = Agent(
        role="Personal assistant",
        goal="Answer using what is already known about the user.",
        backstory=(
            "You recall before you answer, and you save durable facts "
            "the moment the user states one."
        ),
        tools=tools,
    )

    remember = Task(
        description="Save this durable fact: the user deploys on Fridays only.",
        expected_output="The receipt returned by the save tool.",
        agent=assistant,
    )
    answer = Task(
        description="Recall what you know, then say when the user may deploy.",
        expected_output="One sentence naming the day.",
        agent=assistant,
    )

    print(Crew(agents=[assistant], tasks=[remember, answer]).kickoff())</code></pre>
<p>The context manager matters. <code>MCPServerAdapter</code> holds the connection open for its block and closes it on exit; building a crew with tools from a closed adapter fails at the first tool call, not at construction.</p>
<p>The first task calls <code>save_memory</code> and gets a receipt. The second calls <code>recall_memory</code>, whose text result <i>is</i> the recalled context. Extraction runs in the background, so a two-task crew that saves and recalls in the same breath may not see its own write yet — which is the single most common "it doesn't work" report on this route.</p>

<h2>Scoping memory per end user</h2>
<p>Over MCP the memory space is fixed by the credential, and <b>no memory tool takes a user id</b>. That is deliberate: every tool argument is filled in by a model that has just read text somebody else wrote, so tenancy is never something a model can name.</p>
<p>For a crew that works on one person's behalf, one MCP link is the whole answer. For a product where each end user gets their own memory, do not route memory through tools at all — call the <a href="#/sdk/python">Python SDK</a> from your own code, where the user id comes from your session.</p>
<pre><button class="copy">Copy</button><code>import os

from itsuki import MemoryClient

memory = MemoryClient(api_key=os.environ["ITSUKI_API_KEY"])


def run_for(user_id: str, question: str) -> str:
    # Recall before the crew runs; inject as ordinary task context.
    context = memory.search(question, user_id=user_id).get("context", "")

    assistant = Agent(
        role="Personal assistant",
        goal="Answer using what is already known about this user.",
        backstory=f"What you already know:\\n{context}" if context else "You know nothing yet.",
    )
    task = Task(description=question, expected_output="A direct answer.", agent=assistant)
    result = str(Crew(agents=[assistant], tasks=[task]).kickoff())

    # Capture after the crew settles.
    memory.add_conversation(
        [{"role": "user", "content": question},
         {"role": "assistant", "content": result}],
        user_id=user_id,
        idempotency_key=MemoryClient.new_idempotency_key(),
    )
    return result</code></pre>
<p>Any stable string works as <code>user_id</code>. It is hashed with your account id before it becomes a storage key, so two accounts using the same string still get different spaces. <a href="#/concepts/scope">Who memory belongs to</a> has the full model.</p>
<div class="warn">Attaching the MCP tools to a multi-tenant crew puts every end user's memories into the one space the credential owns. Pick one route per deployment.</div>

<h2>Verify</h2>
<p>Give a one-task crew the instruction <i>"use the whoami tool and report exactly what it says"</i>. It returns identity, scopes, bound project, whether deletion is allowed, and live counts, and it never echoes the key. If whoami works and your save does not, the problem is the model's tool choice, not the connection.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b><code>ImportError: cannot import name 'MCPServerAdapter'</code></b> — you installed plain <code>crewai-tools</code>. Reinstall with the extra: <code>pip install "crewai-tools[mcp]"</code>.</li>
<li><b>Tools list is empty</b> — the URL must be exactly <code>https://itsuki.app/mcp</code>, the transport <code>streamable-http</code>, and the header <code>Authorization: Bearer &lt;key&gt;</code>.</li>
<li><b>401</b> — revoked key, or whitespace in the pasted value. Mint a fresh MCP link.</li>
<li><b>Errors mentioning <code>mcp.shared</code>, <code>RequestContext</code>, or "not enough values to unpack"</b> — an upstream clash with <code>mcp</code> 2.x that affects every MCP server. Pin <code>pip install "mcp&lt;2"</code>.</li>
<li><b>Tool calls fail after the first task</b> — the crew was built or run outside the <code>with MCPServerAdapter(...)</code> block. Keep the whole run inside it.</li>
<li><b>Recall returns nothing straight after a save</b> — extraction is asynchronous; allow a few seconds.</li>
<li><b>429</b> — writes are capped at 60 per minute per user. A crew looping over saves will hit that; back off and honour the retry hint.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/api/mcp">MCP tools</a> — the exact input each tool takes.</li>
<li><a href="#/integrations/python">Python frameworks</a> — every Python client shape side by side.</li>
<li><a href="#/sdk/python">Python SDK</a> — the direct route.</li>
<li><a href="#/concepts/receipts">Receipts and rules</a> — what a save actually returns.</li>
</ul>
` };

PAGES["/integrations/autogen"] = { title: "AutoGen", html: `
<h1>AutoGen</h1>
<p class="lede">AutoGen reaches Itsuki through <code>autogen-ext</code>'s MCP support: one call to <code>mcp_server_tools()</code> wraps every memory tool as an AutoGen tool, ready for an <code>AssistantAgent</code> or a whole team.</p>

<h2>What this integration is</h2>
<p>There is no <code>itsuki-autogen</code> package. AutoGen's extension library already speaks MCP over Streamable HTTP, and that is the same door Itsuki serves, so the integration is a parameters object and one await. <code>mcp_server_tools()</code> connects, lists what the server advertises, and returns an AutoGen tool per entry — save, recall, list, get, delete, and whoami.</p>
<p>Because these are tools, <b>the model decides when to use them</b>. In a multi-agent team that cuts both ways: any agent holding the tools can write memory, and none of them is obliged to read it. Give the tools to the agent whose job is actually to remember, not to all of them by reflex.</p>

<h2>Install</h2>
<pre><button class="copy">Copy</button><code>pip install autogen-ext "mcp&lt;2"</code></pre>
<p>The <code>mcp</code> pin is not optional here. AutoGen's adapter targets the <code>mcp</code> 1.x Python API, and an installed 2.x produces import errors about <code>mcp.shared</code>, <code>RequestContext</code>, or "not enough values to unpack". This is an upstream clash that affects every MCP server, not just Itsuki, and 1.x is the line this route was verified against.</p>
<p>Then create an <b>MCP link</b> in <b>API Keys</b>. It is shown once; keep it in the environment.</p>

<h2>A complete example</h2>
<pre><button class="copy">Copy</button><code>import asyncio
import os

from autogen_agentchat.agents import AssistantAgent
from autogen_ext.models.openai import OpenAIChatCompletionClient
from autogen_ext.tools.mcp import StreamableHttpServerParams, mcp_server_tools

params = StreamableHttpServerParams(
    url="https://itsuki.app/mcp",
    headers={"Authorization": f"Bearer {os.environ['ITSUKI_MCP_KEY']}"},
)


async def main():
    tools = await mcp_server_tools(params)

    assistant = AssistantAgent(
        name="assistant",
        model_client=OpenAIChatCompletionClient(model="gpt-4.1"),
        tools=tools,
        system_message=(
            "Call recall_memory at the start of a conversation. "
            "Call save_memory the moment the user states one durable fact, "
            "in the user's own words. Never claim a save without a receipt."
        ),
        reflect_on_tool_use=True,
    )

    await assistant.run(task="Remember that I deploy on Fridays only.")
    answer = await assistant.run(task="When am I allowed to deploy?")
    print(answer.messages[-1].content)


asyncio.run(main())</code></pre>
<p><code>reflect_on_tool_use=True</code> matters for recall. Without it the agent returns the raw tool output; with it, the model reads the recalled context and answers in prose. The tool's text result <i>is</i> the memory — Itsuki puts the recalled context in the content block rather than a summary of it, precisely so a client that surfaces only <code>content</code> to the model still gets something to read.</p>

<h2>Sharing memory across a team</h2>
<p>Hand the same <code>tools</code> list to more than one agent and they share one memory space, so a fact one agent saved is recallable by another later in the run. Nothing further is needed — the space belongs to the credential, not to the agent.</p>
<p>If you would rather one agent own memory, give the tools to that agent alone and let the others ask it. That also keeps the write path narrow, which is easier to reason about when a run goes wrong.</p>

<h2>Scoping memory per end user</h2>
<p>Over MCP the memory space is fixed by the credential, and <b>no memory tool takes a user id</b> — by design, since every tool argument is written by a model that has just read attacker-influenced text. One AutoGen application serving many end users therefore cannot separate them through the tools.</p>
<p>Do it in your own code instead, with the <a href="#/sdk/python">Python SDK</a>, where the id comes from your session.</p>
<pre><button class="copy">Copy</button><code>import os

from itsuki import MemoryClient

memory = MemoryClient(api_key=os.environ["ITSUKI_API_KEY"])


async def answer_for(user_id: str, question: str) -> str:
    context = memory.search(question, user_id=user_id).get("context", "")

    assistant = AssistantAgent(
        name="assistant",
        model_client=OpenAIChatCompletionClient(model="gpt-4.1"),
        system_message=f"What you already know about this user:\\n{context}",
    )
    result = await assistant.run(task=question)
    reply = result.messages[-1].content

    memory.add_conversation(
        [{"role": "user", "content": question},
         {"role": "assistant", "content": reply}],
        user_id=user_id,
        idempotency_key=MemoryClient.new_idempotency_key(),
    )
    return reply</code></pre>
<p>Any stable string works as <code>user_id</code>; it is hashed with your account id before it becomes a storage key. <a href="#/concepts/scope">Who memory belongs to</a> has the full model.</p>
<div class="warn">Attaching the MCP tools to a multi-tenant deployment puts every end user into the one space the credential owns. Choose one route per deployment.</div>

<h2>Verify</h2>
<p>Run the agent with <code>task="use the whoami tool and report exactly what it says"</code>. It returns identity, scopes, bound project, whether deletion is allowed, and live counts, without echoing the key. If whoami works but your save does not, the connection is fine and the model's tool choice is the problem.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>Import errors naming <code>mcp.shared</code>, <code>RequestContext</code>, or "not enough values to unpack"</b> — <code>mcp</code> 2.x is installed. <code>pip install "mcp&lt;2"</code>.</li>
<li><b><code>mcp_server_tools()</code> returns nothing</b> — check the URL is exactly <code>https://itsuki.app/mcp</code> and the header reads <code>Authorization: Bearer &lt;key&gt;</code>.</li>
<li><b>401</b> — revoked key, or whitespace in the value. A key pasted into the URL rather than the header is reported by name.</li>
<li><b>Recall returns a tool blob instead of an answer</b> — set <code>reflect_on_tool_use=True</code>.</li>
<li><b>Saves succeed, recall is empty</b> — extraction is asynchronous. Allow a few seconds before recalling a brand-new fact.</li>
<li><b>429 during a long team run</b> — writes are capped at 60 per minute per user. Back off; bulk loading belongs on <code>POST /v1/ingest</code>.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/api/mcp">MCP tools</a> — every tool's input and output.</li>
<li><a href="#/integrations/python">Python frameworks</a> — the other Python client shapes.</li>
<li><a href="#/sdk/python">Python SDK</a> — the direct route.</li>
<li><a href="#/concepts/memory">How memory works</a> — why a save is not instantly recallable.</li>
</ul>
` };

PAGES["/integrations/agno"] = { title: "Agno", html: `
<h1>Agno</h1>
<p class="lede">Agno gets Itsuki as a native toolkit — <code>agno-itsuki</code> — with search, save, list, and get registered as Agno tools, plus deletion that is off until you turn it on.</p>

<h2>Two routes</h2>
<p><b>The native toolkit</b> is <code>agno-itsuki</code>. It registers typed Agno tools, ships instructions telling the model when to use them, resolves identity from the run rather than from a tool argument, and returns JSON error objects instead of raising through your agent. Start here.</p>
<p><b>The MCP route</b> uses Agno's own <code>MCPTools</code> against the same endpoint. It exposes the full tool set including the safe-update tools, at the cost of an extra dependency pin and a connection you have to hold open.</p>
<div class="note">Both routes are <b>model-called</b> memory: the model decides when to search and when to save. That is the same shape Agno's own Mem0 toolkit has, and it is deliberately not an automatic lifecycle — nothing here fires on every turn. Agno's built-in memory remains the automatic layer, and this runs alongside it.</div>

<h2>Install the toolkit</h2>
<pre><button class="copy">Copy</button><code>pip install agno-itsuki</code></pre>
<p>Create an <b>API key</b> in <b>API Keys</b> — a server credential, not an MCP link — and set it as <code>ITSUKI_API_KEY</code>.</p>

<h2>A complete example</h2>
<pre><button class="copy">Copy</button><code>import os

from agno.agent import Agent
from agno.models.openai import OpenAIChat
from agno_itsuki import ItsukiTools

assert os.environ.get("ITSUKI_API_KEY"), "ITSUKI_API_KEY is not set"

agent = Agent(
    model=OpenAIChat(id="gpt-4.1"),
    tools=[ItsukiTools()],          # no user_id here: taken from each run
)

agent.print_response("I deploy on Fridays only.", user_id="user_42")
agent.print_response("When am I allowed to deploy?", user_id="user_42")</code></pre>
<p>The first call should produce a <code>itsuki_save_memory</code> call and a receipt; the second an <code>itsuki_search_memory</code> call whose result is the prompt-ready context. Extraction is asynchronous, so back-to-back save and search in a script may not see each other yet — insert a short wait when you are testing by hand.</p>

<h2>The tools, and which are on</h2>
<table>
<tr><th>Tool</th><th>Enabled by default</th></tr>
<tr><td><code>itsuki_search_memory</code></td><td>yes</td></tr>
<tr><td><code>itsuki_save_memory</code></td><td>yes</td></tr>
<tr><td><code>itsuki_list_memories</code></td><td>yes</td></tr>
<tr><td><code>itsuki_get_memory</code></td><td>yes</td></tr>
<tr><td><code>itsuki_delete_memory</code></td><td>no — <code>enable_delete=True</code></td></tr>
<tr><td><code>itsuki_delete_all_memories</code></td><td>no — <code>enable_delete_all=True</code></td></tr>
</table>
<p>Deletion is off because a model that can delete is a model that can be talked into deleting. When enabled, both tools additionally require an explicit <code>confirmed=True</code> argument and are registered in Agno's <code>requires_confirmation_tools</code>, so the host asks as well. <code>itsuki_delete_all_memories</code> previews by default and is scoped to memories this adapter wrote.</p>
<p>The toolkit also ships instructions telling the model to search at the start of a conversation and to save the moment the user states a durable fact. Pass <code>add_instructions=False</code> if you would rather write your own.</p>

<h2>Scoping memory per end user</h2>
<p>Identity resolves in one order: the constructor's <code>user_id</code>, then the run's <code>run_context.user_id</code>, then a readable refusal. <b>No tool takes a user id.</b> Every tool argument is filled in by a model that has read attacker-influenced text, so tenancy is never expressible as an argument.</p>
<pre><button class="copy">Copy</button><code># Multi-tenant: leave the toolkit unbound, pass the id on each run.
agent = Agent(model=OpenAIChat(id="gpt-4.1"), tools=[ItsukiTools()])
agent.run("What am I working on?", user_id="user_42", session_id="thread_9")

# Single-tenant: bind once. A run's user_id can no longer change it.
agent = Agent(model=OpenAIChat(id="gpt-4.1"), tools=[ItsukiTools(user_id="alex")])</code></pre>
<p>Other constructor options worth knowing: <code>project_id</code> for project attribution (which also switches recall to <code>project_then_global</code>), <code>recall_scope</code> to set that explicitly, and <code>max_items</code> and <code>max_context_chars</code> as hard ceilings on what a recall may return into the model's context.</p>

<h2>The MCP route</h2>
<pre><button class="copy">Copy</button><code>pip install agno "mcp&lt;2"

from agno.tools.mcp import MCPTools, StreamableHTTPClientParams

params = StreamableHTTPClientParams(
    url="https://itsuki.app/mcp",
    headers={"Authorization": "Bearer YOUR_MCP_KEY"},
)
async with MCPTools(transport="streamable-http", server_params=params) as mcp:
    agent = Agent(tools=[mcp])</code></pre>
<p>The <code>mcp</code> pin is required: Agno's MCP support targets the 1.x Python API and breaks against 2.x with import errors about <code>mcp.shared</code> or <code>RequestContext</code>. Use an <b>MCP link</b> here, not an API key in the URL. On this route the memory space is fixed by the credential — there is no per-run user id.</p>

<h2>Behaviour under failure</h2>
<p>Tools return a JSON error object rather than raising, because a raised exception would break the agent run. Credentials are scrubbed from content before storage and redacted from every error surface, since a tool result goes straight into the model's context.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>Every tool returns an identity refusal</b> — no <code>user_id</code> anywhere: not on the toolkit, not on the run. The package refuses rather than guessing whose memory to write.</li>
<li><b>A run's <code>user_id</code> seems to be ignored</b> — the constructor wins. Leave <code>ItsukiTools(user_id=...)</code> unset for multi-tenant use.</li>
<li><b>Delete tools are missing</b> — they are off by default. Construct with <code>enable_delete=True</code> or <code>enable_delete_all=True</code>, and expect a confirmation prompt.</li>
<li><b>The model never calls a tool</b> — you passed <code>add_instructions=False</code>, or your own instructions do not mention memory. Say when to search and when to save.</li>
<li><b>Search is empty right after a save</b> — extraction is asynchronous. Wait a few seconds.</li>
<li><b>MCP route fails on import</b> — <code>pip install "mcp&lt;2"</code>.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/integrations/native">Native packages</a> — the other frameworks with their own memory interface.</li>
<li><a href="#/api/mcp">MCP tools</a> — the full tool surface.</li>
<li><a href="#/concepts/scope">Who memory belongs to</a> — sub-tenants and project scope.</li>
<li><a href="#/sdk/python">Python SDK</a> — the client underneath the toolkit.</li>
</ul>
` };

PAGES["/integrations/openai-agents"] = { title: "OpenAI Agents SDK", html: `
<h1>OpenAI Agents SDK</h1>
<p class="lede">The OpenAI Agents SDK attaches MCP servers per agent, so Itsuki becomes a memory server one agent holds: <code>MCPServerStreamableHttp</code> in, save and recall out.</p>

<h2>What this integration is</h2>
<p>There is no <code>itsuki-openai-agents</code> package. The Agents SDK has first-class MCP support and Itsuki serves a Streamable HTTP MCP endpoint, so the integration is a server object passed to <code>Agent(mcp_servers=[...])</code>. Tools are discovered at run time, which means a tool added on our side appears in your agent without a release on yours.</p>
<p>The attachment is <b>per agent</b>, not global. In a handoff or agents-as-tools setup, only the agents that list the server can touch memory. That is a useful boundary: give it to the agent whose job is to remember, and the rest of the graph cannot write.</p>

<h2>Install</h2>
<pre><button class="copy">Copy</button><code>pip install openai-agents</code></pre>
<p>Create an <b>MCP link</b> in <b>API Keys</b>. It is shown once, and the header below carries it — read it from the environment.</p>

<h2>A complete example</h2>
<pre><button class="copy">Copy</button><code>import asyncio
import os

from agents import Agent, Runner
from agents.mcp import MCPServerStreamableHttp


async def main():
    async with MCPServerStreamableHttp(
        name="itsuki",
        params={
            "url": "https://itsuki.app/mcp",
            "headers": {"Authorization": f"Bearer {os.environ['ITSUKI_MCP_KEY']}"},
        },
        cache_tools_list=True,
    ) as server:
        agent = Agent(
            name="Assistant",
            instructions=(
                "Call recall_memory at the start of a conversation. "
                "Call save_memory the moment the user states one durable fact, "
                "in their own words. Never say you saved something without a receipt."
            ),
            mcp_servers=[server],
        )

        await Runner.run(agent, "Remember that I deploy on Fridays only.")
        result = await Runner.run(agent, "When am I allowed to deploy?")
        print(result.final_output)


asyncio.run(main())</code></pre>
<p>Two details in that block earn their place. <code>cache_tools_list=True</code> stops the SDK re-listing tools on every run, which is worth doing against a remote server. And the <code>async with</code> is load-bearing: the server connection lives for the block, so a <code>Runner.run</code> outside it fails at the first tool call rather than at construction.</p>
<p>The save returns a receipt. The recall's text result <i>is</i> the recalled context, so the model reads it directly. Extraction is asynchronous — a recall issued a second after a save may legitimately come back empty.</p>

<h2>Instructions decide whether memory happens</h2>
<p>Tool descriptions and your instructions are the only two levers on whether a model calls a tool at all. The instructions above are the short version of what works: recall at the start, save on a durable fact, and never claim a save you did not get a receipt for. Without something like them, an agent with a memory server attached will often answer from nothing and never write.</p>

<h2>Scoping memory per end user</h2>
<p>Over MCP the memory space is fixed by the credential, and <b>no memory tool takes a user id</b> — deliberately, because every tool argument is produced by a model that has just read text somebody else wrote. One agent process serving many end users cannot separate them through the tools.</p>
<p>Separate them in your own code with the <a href="#/sdk/python">Python SDK</a>, where the id comes from your session and never from the model.</p>
<pre><button class="copy">Copy</button><code>import os

from agents import Agent, Runner
from itsuki import MemoryClient

memory = MemoryClient(api_key=os.environ["ITSUKI_API_KEY"])


async def answer_for(user_id: str, question: str) -> str:
    context = memory.search(question, user_id=user_id).get("context", "")

    agent = Agent(
        name="Assistant",
        instructions=(
            "Answer using what is already known about this user.\\n\\n"
            f"Known:\\n{context}" if context else "Answer the user."
        ),
    )
    result = await Runner.run(agent, question)

    memory.add_conversation(
        [{"role": "user", "content": question},
         {"role": "assistant", "content": result.final_output}],
        user_id=user_id,
        idempotency_key=MemoryClient.new_idempotency_key(),
    )
    return result.final_output</code></pre>
<p>Any stable string works as <code>user_id</code> — it is hashed with your account id before it becomes a storage key, so two accounts sending the same string get different spaces. You can also mix the routes safely if the tools go only to a single-user agent. <a href="#/concepts/scope">Who memory belongs to</a> has the full model.</p>
<div class="warn">Do not attach the MCP server to an agent that serves multiple end users. Every one of them would read and write the single space the credential owns.</div>

<h2>Verify</h2>
<p>Run the agent with <code>"use the whoami tool and tell me exactly what it reports"</code>. It returns identity, scopes, bound project, whether deletion is allowed, and live counts, and it never echoes the key. A working whoami plus a silent save means the connection is fine and the instructions need work.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>No tools discovered</b> — the URL must be exactly <code>https://itsuki.app/mcp</code>, with the credential in <code>Authorization: Bearer &lt;key&gt;</code>, not in the path.</li>
<li><b>401</b> — revoked key or stray whitespace. If a key ended up in the URL, the server names that specific mistake instead of blaming the key.</li>
<li><b>Tool call fails outside the context manager</b> — keep every <code>Runner.run</code> inside the <code>async with</code> block that owns the server.</li>
<li><b>Stale tool list after a change</b> — <code>cache_tools_list=True</code> caches for the server's lifetime. Recreate the server to refresh.</li>
<li><b>Saves succeed but recall is empty</b> — extraction is asynchronous; allow a few seconds.</li>
<li><b>429</b> — writes are capped at 60 per minute per user. Back off and retry.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/api/mcp">MCP tools</a> — every tool's input and output.</li>
<li><a href="#/integrations/python">Python frameworks</a> — the other Python client shapes.</li>
<li><a href="#/sdk/python">Python SDK</a> — the direct route.</li>
<li><a href="#/api/auth">Authentication and keys</a> — MCP links versus API keys.</li>
</ul>
` };

PAGES["/integrations/google-adk"] = { title: "Google ADK", html: `
<h1>Google ADK</h1>
<p class="lede">ADK has a memory interface and nothing that fills it. <code>adk-itsuki</code> is a native <code>BaseMemoryService</code> plus the automatic capture ADK does not ship, wired at the one place that fires once per invocation.</p>

<h2>Why the plugin exists</h2>
<p>Search ADK for <code>add_session_to_memory</code> and you find exactly two call sites: a convenience method your own callback can call, and an HTTP endpoint a client must invoke. The dev UI never calls either. So an ADK app gets retrieval for free and remembers nothing unless the application writes the plumbing itself.</p>
<p><code>ItsukiMemoryPlugin</code> is that plumbing. It sits at the app level, so it fires once per invocation rather than once per agent — which is what keeps a multi-agent run from writing the same turn several times.</p>

<h2>Requirements</h2>
<table>
<tr><th>Component</th><th>Supported</th></tr>
<tr><td><code>google-adk</code></td><td>2.5.0 – 2.7.x</td></tr>
<tr><td>Python</td><td>3.10 – 3.13</td></tr>
<tr><td>Runtime dependencies</td><td><code>itsuki</code>, <code>google-adk</code></td></tr>
</table>
<p>The floor is 2.5.0 for a specific reason: it is the first release whose normal run path invokes <code>after_run_callback</code> under a <code>run_error</code> guard <i>and</i> exposes <code>on_run_error_callback</code>. Below that, automatic capture and identity cleanup cannot work at all. The ceiling is the highest minor actually tested, because ADK ships breaking changes in minor releases. ADK 1.x is not supported.</p>

<h2>Install and wire it in</h2>
<pre><button class="copy">Copy</button><code>pip install adk-itsuki</code></pre>
<p>Create an <b>API key</b> in <b>API Keys</b> and export it. The service reads <code>ITSUKI_API_KEY</code> from the environment.</p>
<pre><button class="copy">Copy</button><code># bash/zsh
export ITSUKI_API_KEY=itsuki_live_xxx

# PowerShell
$env:ITSUKI_API_KEY = "itsuki_live_xxx"</code></pre>
<pre><button class="copy">Copy</button><code>from google.adk.agents import LlmAgent
from google.adk.apps.app import App
from google.adk.runners import Runner
from google.adk.sessions import InMemorySessionService
from google.adk.tools import preload_memory
from adk_itsuki import ItsukiMemoryService, ItsukiMemoryPlugin

memory = ItsukiMemoryService()          # reads ITSUKI_API_KEY
agent = LlmAgent(name="assistant", model="gemini-2.0-flash", tools=[preload_memory])

app = App(name="my_app", root_agent=agent, plugins=[ItsukiMemoryPlugin(service=memory)])
runner = Runner(app=app, app_name="my_app",
                session_service=InMemorySessionService(), memory_service=memory)</code></pre>
<p>Two halves, and you want both. <code>preload_memory</code> recalls before every model call. The plugin captures after every settled turn. Install one without the other and you get an agent that reads and never writes, or writes and never reads.</p>

<h2>Running a turn</h2>
<pre><button class="copy">Copy</button><code>from google.genai import types

session = await runner.session_service.create_session(
    app_name="my_app", user_id="user_42", session_id="s-1"
)

async for event in runner.run_async(
    user_id="user_42",
    session_id="s-1",
    new_message=types.Content(role="user", parts=[types.Part(text="I deploy on Fridays only.")]),
):
    pass

async for event in runner.run_async(
    user_id="user_42",
    session_id="s-1",
    new_message=types.Content(role="user", parts=[types.Part(text="When am I allowed to deploy?")]),
):
    print(event)</code></pre>
<p>Capture is staged in the background. In a test or a script that exits immediately, call <code>await memory.drain()</code> before you assert on anything, or the process ends before the write leaves it.</p>

<h2>What gets remembered</h2>
<p>Only the user's message and the <b>root agent's</b> final answer. Specifically excluded: tool calls and their results, code execution, inline and file data, sub-agent intermediate output, partial streaming events, and anything from an invocation that errored or is still waiting on a long-running tool.</p>
<p>Attribution is by author name rather than by branch, because a <code>SequentialAgent</code> child can keep the root branch. The root agent's name is recorded once per invocation in session state — content-free — so a restart, a delta import and an explicit re-import all reach the same verdict. An invocation with no marker is skipped rather than guessed at. A root <code>SequentialAgent</code>'s children are not captured unless they author under the root's name: guessing which sub-agent output a person actually saw would be worse than remembering less.</p>

<h2>Scoping memory per end user</h2>
<p>You do not pass an Itsuki user id. The service derives an isolated memory space from ADK's <code>(app_name, user_id)</code> pair, length-prefixed and hashed so that <code>("ab","c")</code> and <code>("a","bc")</code> cannot collide and neither can be smuggled through a delimiter. Pass a different ADK <code>user_id</code> and you get a different space; keep the same one and memory follows that person across sessions.</p>
<p>Two apps under one Itsuki key therefore get separate memory automatically. If you want two deployments of the <i>same</i> app kept apart — staging and production, say — construct with <code>ItsukiMemoryService(user_namespace="staging")</code>.</p>
<div class="warn">Hashing prevents encoding and delimiter attacks. It cannot prevent impersonation. ADK's <code>app_name</code> and <code>user_id</code> are plain strings with no validation, so bind <code>user_id</code> to an authenticated principal in your own auth layer — no library can do that for you.</div>

<h2>Honest limits</h2>
<ul>
<li><b>Capture is durable to process life, not across restarts.</b> Pending chunks live in memory. Recovery is an explicit <code>add_session_to_memory(session)</code>, which regenerates identical idempotency keys — so re-importing costs nothing and duplicates nothing.</li>
<li><b><code>add_memory</code> is not implemented.</b> Direct memory writes are a surface that has not been audited yet.</li>
<li><b>The <code>itsuki://</code> URI route is partial.</b> <code>import adk_itsuki; adk_itsuki.register()</code> in a <code>services.py</code> lets <code>adk web --memory_service_uri=itsuki://</code> <i>construct</i> the service, but ADK has no mechanism for a service to attach <code>preload_memory</code> or the capture plugin. Treat it as a partial installation, not an automatic one.</li>
</ul>

<h2>The MCP route</h2>
<pre><button class="copy">Copy</button><code>pip install google-adk

from google.adk.tools.mcp_tool import McpToolset
from google.adk.tools.mcp_tool.mcp_session_manager import StreamableHTTPConnectionParams

toolset = McpToolset(
    connection_params=StreamableHTTPConnectionParams(
        url="https://itsuki.app/mcp",
        headers={"Authorization": "Bearer YOUR_MCP_KEY"},
    )
)</code></pre>
<p>This gives the model memory tools it may or may not call, and one memory space fixed by the credential — no per-user derivation. Use an <b>MCP link</b> here, not an API key.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>Nothing is ever captured</b> — the plugin is missing from <code>App(plugins=[...])</code>, or you are on <code>google-adk</code> below 2.5.0 where the callbacks it needs do not exist.</li>
<li><b>Recall never appears in the prompt</b> — <code>preload_memory</code> is not in the agent's <code>tools</code>, or the runner was built without <code>memory_service=</code>.</li>
<li><b>Captures vanish in a short script</b> — the process exited first. <code>await memory.drain()</code>.</li>
<li><b>The dev UI remembers nothing</b> — the <code>itsuki://</code> route constructs the service only. Wire the tool and plugin yourself.</li>
<li><b>Sub-agent output is missing from memory</b> — that is the design. Only the root agent's final answer is captured.</li>
<li><b>Recall is empty right after a turn</b> — extraction is asynchronous; allow a few seconds.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/integrations/native">Native packages</a> — the other frameworks with their own memory interface.</li>
<li><a href="#/concepts/scope">Who memory belongs to</a> — how derived spaces are isolated.</li>
<li><a href="#/api/mcp">MCP tools</a> — the tool route in detail.</li>
<li><a href="#/sdk/python">Python SDK</a> — the client underneath the service.</li>
</ul>
` };

PAGES["/integrations/camel"] = { title: "CAMEL", html: `
<h1>CAMEL</h1>
<p class="lede">CAMEL gets Itsuki as a storage backend — <code>camel-itsuki</code> — that keeps a lossless local history and mirrors durable memory to the service, so an agent survives a restart without its history quietly rewriting itself.</p>

<h2>Two jobs, kept apart</h2>
<p>CAMEL's <code>BaseKeyValueStorage</code> promises to store records "without any loss of information", and <code>ChatHistoryMemory</code> expects to read back exactly what it wrote. Extracted semantic memory cannot satisfy that — reconstructing history from extracted facts gives you an agent whose past changes between turns, which is a genuinely hard bug to find.</p>
<p>So the package does two things and does not confuse them:</p>
<ul>
<li><b><code>save</code>, <code>load</code>, <code>clear</code> are a lossless local mirror.</b> Byte-for-byte what went in comes out. Nothing is reconstructed from extracted memories.</li>
<li><b>Durable semantic memory is mirrored to Itsuki</b> in the same <code>save</code> call, and read back through <code>ItsukiContextBlock</code> — CAMEL's own abstraction for context from elsewhere.</li>
</ul>
<p>The mirror file is written with an atomic replace <i>before</i> the network is touched, so an Itsuki outage costs durable memory but never the agent's own history. The file is bounded by <code>max_records</code> (default 5,000), and a truncated file is discarded rather than served as fact.</p>

<h2>Install</h2>
<pre><button class="copy">Copy</button><code>pip install camel-itsuki</code></pre>
