<p>Every accepted write mints exactly one job row <i>before</i> the <code>200</code> leaves the door &mdash; a failed insert fails the request rather than accepting invisible work. That row is what these two routes read. Only two job types are ever listed: <code>extract</code>, the ordinary write path behind <a href="#/api/save">POST /v1/save</a> and <code>POST /v1/ingest</code>, and <code>mcp_enrich</code>, the MCP save lane.</p>

<h2>The status vocabulary</h2>
<p>These seven strings are the complete set the <code>status</code> field can hold. Poll until you see a terminal one.</p>

<table>
<tr><th>Status</th><th>Terminal</th><th>Meaning</th></tr>
<tr><td><code>awaiting_source</code></td><td>No</td><td>The job row exists and the raw source rows for this write are being made durable. Nothing has been handed to the memory coordinator yet &mdash; this state is the fence between the two, because the database and the coordinator cannot share a transaction.</td></tr>
<tr><td><code>queued</code></td><td>No</td><td>Runnable. The coordinator has the work and will drain it.</td></tr>
<tr><td><code>staged</code></td><td>No</td><td>MCP lane only (<code>type: "mcp_enrich"</code>). The facts are recorded and enrichment is still to come. The <code>extract</code> lane never uses this state.</td></tr>
<tr><td><code>processing</code></td><td>No</td><td>At least one accepted message has been attempted.</td></tr>
<tr><td><code>enriched</code></td><td>Yes</td><td>Every message this job accepted has settled. <code>counts</code> is final.</td></tr>
<tr><td><code>failed</code></td><td>Yes</td><td>The job stopped without settling the rest of its messages. Also where cancelled work lands &mdash; see below.</td></tr>
<tr><td><code>completed</code></td><td>Yes</td><td>Present in the terminal set for compatibility. No code path sets it on the <code>extract</code> lane; treat it as reserved, but accept it as terminal if you see it.</td></tr>
</table>

<h3>Accepted, enriched, failed</h3>
<p><b>Accepted</b> is not a status.</p>
<p>Acceptance is the <code>200</code> from the write endpoint plus the durable job row it created, in <code>awaiting_source</code> or <code>queued</code>. It says the write will be attempted and can be followed. It says nothing about what was remembered.</p>
<p><b><code>enriched</code></b> means the ledger emptied: every accepted message settled and no work remains. It is not a claim that something was stored. A job that legitimately stored nothing &mdash; chatter, a question, a duplicate &mdash; goes <code>enriched</code> with every entry in <code>counts</code> at zero, and a packet of pure noise can be <code>enriched</code> before the caller has even read its response.</p>
<p><b><code>failed</code></b> means the job stopped instead. Read <code>error</code> and <code>outcome_reason</code> to tell the three causes apart: a genuine processing failure, a cancellation caused by your own delete, or a cancellation caused by a project archive.</p>

<h2>Request</h2>
<h3>One packet</h3>
<p>The usual case: you have a <code>source_packet_id</code> from a save response or a receipt, and you want that write&rsquo;s current state.</p>
${codeBlock(`curl "${ORIGIN}/v1/packets/src_9f2c1d4a-6b41-4a2e-9c0e-2b7f5d8a3c11/status" \\
  -H "authorization: Bearer $ITSUKI_API_KEY"`, "terminal")}
<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td>path segment</td><td>string</td><td>Yes</td><td>The <code>source_packet_id</code>. It is URL-decoded before use, so a percent-encoded id works. The path must match exactly &mdash; nothing else under <code>/v1/packets/</code> is routed.</td></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>Reads one of your end users&rsquo; isolated memory spaces instead of the account&rsquo;s own.</td></tr>
</table>

<h3>The ledger</h3>
${codeBlock(`curl "${ORIGIN}/v1/jobs?status=failed&cancelled=false&limit=20" \\
  -H "authorization: Bearer $ITSUKI_API_KEY"`, "terminal")}
<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>As above. Without it you get the memory space the credential itself resolves to.</td></tr>
<tr><td><code>status</code></td><td>string</td><td>No</td><td>Exact match against the stored status. One of the seven values above; it is not validated, so an unrecognised value returns an empty list rather than an error.</td></tr>

<p>Results are ordered newest first by creation time. There is no project filter &mdash; where you use the <code>x-itsuki-project</code> header it decides which memory space is resolved, and each row then reports its own <code>project_id</code>.</p>

<h2>Behaviour worth knowing</h2>

<div class="warn"><b>Cancelled work is reported as <code>failed</code>.</b> There is no separate cancelled status, and this is deliberate: shipped SDKs carry a closed set of terminal statuses, so a new terminal word would hang every existing poller instead of finishing it. The distinction is published as its own fields. Check <code>cancelled_by_delete</code> and <code>outcome_reason</code> before you treat a <code>failed</code> job as a defect.</div>

<div class="warn"><b><code>cancelled</code> is not a boolean.</b> Only the exact string <code>true</code> selects cancelled work. Every other value &mdash; <code>false</code>, <code>1</code>, <code>yes</code>, an empty string &mdash; takes the other branch and <i>excludes</i> it. The filter also only recognises delete cancellations, so work cancelled by a project archive still appears under <code>cancelled=false</code>.</div>

<div class="note"><b>Nothing in the query string is refused.</b> An unknown <code>status</code> returns an empty list, an unparseable <code>since</code> is dropped, and <code>limit</code> is clamped into 1&ndash;200. None of them produce a <code>400</code>. This is the opposite of <a href="#/api/recall">POST /v1/recall</a>, where <code>limit</code> is refused by name rather than clamped &mdash; do not carry an assumption across from one to the other.</div>

<div class="note"><b><code>failed</code> is not always the last word.</b> An exact retry of the same write &mdash; same content, same idempotency key &mdash; can reopen the very same job row from <code>failed</code> back to <code>queued</code>, up to five times, restoring its unsettled message ledger. After that the door stops pretending and answers <code>422 extraction_failed_terminal</code> instead of an acceptance, so a queueing client quarantines the item rather than discarding its own copy. On the MCP lane a failed enrichment can likewise be re-staged back to <code>staged</code>.</div>

<div class="note"><b>A transient failure is retried before it is published.</b> A model or write error inside the coordinator is retried with backoff up to three attempts; the job sits in <code>processing</code> meanwhile and only becomes <code>failed</code> when the last attempt is spent. A single poll returning <code>processing</code> is not evidence of a stall.</div>

<div class="note"><b>The packet route returns the most recent job for that packet</b> &mdash; the newest <code>extract</code> or <code>mcp_enrich</code> row, not a list. An id that names no accepted write in this memory space is a <code>404</code>, which is also what you get if you look up a packet belonging to a different memory space.</div>

<div class="note"><b>Both routes are scoped to one memory space.</b> If you run sub-tenants, a per-user listing will not show you account-wide backlog or cancellations; <code>GET /v1/ops/overview</code> is the account-level view.</div>

<div class="note"><b>One client-side gap.</b> The JavaScript SDK validates the <code>status</code> filter against a closed set that omits <code>awaiting_source</code>, so passing that value through the SDK raises an argument error before a request is made. The REST route accepts it.</div>

<h2>How a delete cancels queued work</h2>
<p>A confirmed erasure records a per-account deletion barrier meaning <i>work accepted before this instant may never produce durable rows after it</i>, then closes the work that could otherwise land behind it. Installing the barrier and revoking the work happen together, and all of it settles as <code>failed</code>:</p>
<table>
<tr><th>What was in flight</th><th>What happens to it</th></tr>
<tr><td>Jobs in <code>awaiting_source</code></td><td>Closed directly. Such a job has no coordinator entry yet by design, so nothing else could ever settle it. The <code>error</code> records that source preservation was fenced before acceptance.</td></tr>
<tr><td>Jobs in <code>queued</code> or <code>staged</code></td><td>The memory coordinator is reset, which discards their queue entries and any held raw messages. Nothing would ever drain those rows, so they are closed terminally in the same pass.</td></tr>
<tr><td>Extraction runs already running or committing</td><td>Cancelled by name. The guarded running-to-committing transition and the commit fence both read that status, so a run that is mid-model-call can never publish its rows afterwards.</td></tr>
</table>
<p>Archiving or deleting a project does the same to every non-terminal job in that project&rsquo;s memory space &mdash; <code>awaiting_source</code>, <code>queued</code>, <code>staged</code> and <code>processing</code> alike &mdash; and reports <code>cancelled_by_archive</code> instead. A retention sweep can also cancel an accepted write; that case settles as <code>failed</code> with the cancellation named in <code>error</code>, but <code>outcome_reason</code> only distinguishes delete and archive, so read <code>error</code> for it.</p>

<div class="warn"><b>A cancelled write cannot be retried into existence.</b> Replaying a job whose <code>error</code> begins <code>cancelled_by_delete</code> or <code>cancelled_by_retention</code> is refused with <code>409 source_write_erased</code> rather than accepted as a duplicate. If you still want that content remembered, send it as a genuinely new write.</div>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>userId is required</code></td><td>The legacy <code>x-api-key</code> lane was used without an explicit <code>userId</code>.</td></tr>
<tr><td>400</td><td>project scope code</td><td>The <code>x-itsuki-project</code> header named a project that could not be resolved. The code is echoed in both <code>error</code> and <code>code</code>.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential. The message hints at what kind of secret was sent instead.</td></tr>
<tr><td>403</td><td><code>insufficient_scope</code></td><td>The token lacks <code>memory:read</code>.</td></tr>
<tr><td>403</td><td><code>forbidden</code></td><td>Your role in this project cannot read it. The response names the capability.</td></tr>
<tr><td>404</td><td><code>not_found</code></td><td>Packet route only: no accepted write with that <code>source_packet_id</code> in this memory space. The ledger route returns an empty list instead of a 404.</td></tr>
<tr><td>500</td><td><code>something_went_wrong</code></td><td>Reported automatically on our side. Quote the <code>x-request-id</code>.</td></tr>
</table>
<p>Branch on <code>error</code>, never on <code>message</code> &mdash; the codes are contractual and the wording is not. Every response carries an <code>x-request-id</code>.</p>

<h1>GET /v1/status</h1>
<p class="lede">A one-line inventory of a memory space: how many live objects it holds and where the write pipeline last got to.</p>

<table>
<tr><th>Method</th><td><code>GET</code></td></tr>
<tr><th>Path</th><td><code>${ORIGIN}/v1/status</code></td></tr>
<tr><th>Auth</th><td>API key or MCP link as <code>Authorization: Bearer</code>, or a signed-in session</td></tr>
<tr><th>Scope</th><td><code>memory:read</code> (also satisfied by <code>memory:write</code>)</td></tr>
<tr><th>Rate bucket</th><td>None. This route is attached to no limiter.</td></tr>
<tr><th>Timing</th><td>Fully synchronous — six <code>COUNT</code> queries issued as one batch. No body, no inference.</td></tr>
</table>

<h2>Request</h2>
${codeBlock(`curl ${ORIGIN}/v1/status \\
  -H "authorization: Bearer $ITSUKI_API_KEY"

# the same check against one of your end users' spaces
curl "${ORIGIN}/v1/status?userId=user-8842" \\
  -H "authorization: Bearer $ITSUKI_API_KEY"`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>userId</code></td><td>query string</td><td>No</td><td>Counts one of your end users' isolated spaces instead of the account's own. The value is hashed together with your account before it becomes a storage key, so you cannot address an arbitrary space and two accounts using the same value never collide. Omit it for the account's own space.</td></tr>
</table>

<div class="note"><b>Unknown query parameters are ignored here, not refused.</b> The handler reads <code>userId</code> and nothing else. That is the opposite of <code>POST /v1/save</code> and <code>POST /v1/recall</code>, which reject an unrecognised field with <code>400 unknown_parameter</code>. A misspelled <code>user_id</code> on this route therefore returns <code>200</code> — with the counts for your own space, not your end user's.</div>

<h2>Response</h2>
${outputBlock(`{
  "nodes": 128,
  "pages": 31,
  "slices": 402,
  "events": 96,
  "candidates": 7,
  "lastCheckpoint": "msg_3f9c1a04b7e25d8613ac9f42"
}`)}

<p>The body is flat. There is no <code>ok</code> wrapper and no envelope — a <code>200</code> is the success signal.</p>

<table>
<tr><th>Field</th><th>Counts</th><th>Excludes</th></tr>
<tr><td><code>nodes</code></td><td>Memories — the durable entities, <code>node_…</code>.</td><td>Deleted, archived <b>and</b> suppressed rows.</td></tr>
<tr><td><code>pages</code></td><td>Conversation pages, <code>page_…</code>.</td><td>Deleted, archived <b>and</b> suppressed rows.</td></tr>
<tr><td><code>slices</code></td><td>Details hanging off memories, <code>slice_…</code>.</td><td>Deleted rows only.</td></tr>
<tr><td><code>events</code></td><td>Dated events hanging off memories, <code>event_…</code>.</td><td>Deleted rows only.</td></tr>
<tr><td><code>candidates</code></td><td>Suggested memories still awaiting review — the queue behind <code>GET /v1/candidates</code>.</td><td>Deleted and suppressed rows, and anything whose status is not <code>pending</code>.</td></tr>
<tr><td><code>lastCheckpoint</code></td><td>The id of the last message the write pipeline finalized for this space — processed, or ignored as noise. Your own id when you supplied one on the message, otherwise a derived <code>msg_…</code> value.</td><td><code>null</code> until the first message has been through.</td></tr>
</table>

<div class="warn"><b>The five counts are not filtered the same way.</b> Archiving or suppressing a memory removes it from <code>nodes</code>, but leaves its details and events untouched in the tables — so <code>slices</code> and <code>events</code> keep counting rows belonging to memories that <code>nodes</code> no longer counts. Deleting a memory does cascade: the delete marks its slices and events deleted too, and all four counts fall together. Do not compute a ratio between the two halves and expect it to mean anything.</div>

<div class="note"><b>There is no total.</b> Add <code>nodes</code> and <code>pages</code> yourself — that sum is what the MCP <code>whoami</code> tool reports as its memory count. <code>slices</code> and <code>events</code> are parts of those memories, not additional memories, so adding all four double-counts.</div>

<div class="note"><b>Counts are per memory space, never per project.</b> Every query binds the memory space and nothing else, so a memory written under a <code>projectId</code> and an account-global one land in the same number. Recall can narrow to a project; this endpoint cannot. The <code>x-itsuki-project</code> header still decides <i>which</i> space a managed-project credential reads, but it does not partition the counts inside it.</div>

<p>Only committed writes are counted. A save that came back with <code>processing: true</code> has been accepted but has not landed yet, and will not appear here until it does — follow that particular write with <code>GET /v1/packets/&lt;id&gt;/status</code> rather than watching these numbers move.</p>

<h2>Why this is the connection check</h2>
<ul>
<li>It runs the full credential path every other memory endpoint runs: Bearer resolution, the <code>memory:read</code> scope check, a fresh project-role check, and the derivation of the memory space. A <code>200</code> means the credential is usable for reads, not merely well-formed.</li>
<li>It carries no request body, makes no model call, and consumes no rate bucket — so a retry loop or a deploy-time probe cannot eat the <code>save</code> or <code>recall</code> allowance the application needs.</li>
<li>It answers the question a failing integration actually has. All zeros with a <code>200</code> means the key works and nothing has been written to <i>that space</i> yet, which is the usual explanation for recall returning an empty context. A <code>401</code> or <code>403</code> means the credential itself, and the error names which.</li>
</ul>
<p>Cheap is not free: each call is six counting queries over your own tables. It suits a startup probe, a health check on an interval, or a support diagnostic — not a call on every request.</p>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>userId is required</code></td><td>The legacy <code>x-api-key</code> lane was used without an explicit <code>userId</code>. That lane has no identity of its own, so it cannot pick a space for you.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential. The <code>message</code> often names what kind of secret was sent instead.</td></tr>
<tr><td>403</td><td><code>insufficient_scope</code></td><td>The token holds neither <code>memory:read</code> nor <code>memory:write</code>.</td></tr>
<tr><td>403</td><td>capability refusal</td><td>The credential's current project role does not allow <code>project.memory.read</code>. The body carries the <code>capability</code> that was missing. Roles are resolved fresh on every request, so this can appear for a key that worked yesterday.</td></tr>
<tr><td>403</td><td><code>project_scope_mismatch</code></td><td>An <code>x-itsuki-project</code> header named a project this credential is not bound to. A key cannot switch projects.</td></tr>
<tr><td>404</td><td><code>not found</code></td><td>The path did not match exactly. There is no trailing-slash tolerance, and any method other than <code>GET</code> lands here rather than on a <code>405</code>. Note this code is lowercase with a space, unlike the <code>not_found</code> used by the object endpoints.</td></tr>
<tr><td>500</td><td><code>something_went_wrong</code></td><td>Reported automatically on our side. Quote the <code>x-request-id</code>.</td></tr>
</table>

<h2>Where to go next</h2>

])}

<tr><th>Key</th><th>Contains</th></tr>

<h3>What the layout adds</h3>
<p>Nodes, pages and candidates are passed through a layout pass before they are returned. These fields do not exist in storage &mdash; they are computed fresh on every request.</p>
<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>cluster</code>, <code>cluster_id</code></td><td>One of twelve fixed cluster ids: <code>identity_career</code>, <code>career_applications</code>, <code>active_goals</code>, <code>projects_systems</code>, <code>software_product</code>, <code>business_product</code>, <code>skills_tech</code>, <code>fitness_habits</code>, <code>health_fitness</code>, <code>preferences_research</code>, <code>life_family</code>, <code>general_memory</code>. Nothing is ever unclustered; the fallback is <code>general_memory</code>.</td></tr>
<tr><td><code>cluster_name</code>, <code>cluster_label</code>, <code>cluster_color</code></td><td>Display name and hex colour for that cluster.</td></tr>
<tr><td><code>x</code>, <code>y</code></td><td>Integer coordinates in an abstract space centred on the origin. Both go negative. There is no viewport and no bounding box &mdash; scale and translate them yourself.</td></tr>
<tr><td><code>radius</code></td><td>Drawing radius by kind: 44 for a page, 18 for a node, 13 for a candidate.</td></tr>
<tr><td><code>visual_type</code></td><td><code>page</code>, <code>node</code> or <code>candidate</code>. The reliable way to tell the three apart after you merge the arrays.</td></tr>
<tr><td><code>importance_rank</code></td><td>1-based position within its own cluster, most important first.</td></tr>
<tr><td><code>importance_score</code></td><td>The heuristic behind that rank &mdash; heat, importance class, and how many details and events hang off the item.</td></tr>

<p>Cluster objects additionally carry <code>display_label</code> (label plus count), an elliptical hull as <code>radius_x</code> and <code>radius_y</code>, a label anchor as <code>label_x</code> and <code>label_y</code>, and three counts: <code>count</code> excludes candidates, <code>total_count</code> includes them, <code>candidate_count</code> is the difference.</p>

<h2>The vocabularies</h2>
<p>A node has no separate type column. Its type <b>is</b> its <code>category</code>, drawn from eighteen canonical values: <code>person</code>, <code>family</code>, <code>relationship</code>, <code>project</code>, <code>system</code>, <code>tool</code>, <code>skill</code>, <code>habit</code>, <code>health</code>, <code>goal</code>, <code>preference</code>, <code>identity</code>, <code>life_event</code>, <code>place</code>, <code>organization</code>, <code>possession</code>, <code>interest</code>, <code>other</code>. A category the extractor invents is mapped onto one of these or kept as <code>other</code>; it is never dropped, so you can treat the list as closed when you build a legend.</p>

<tr><th>Vocabulary</th><th>Values</th></tr>

<h3>Two edge vocabularies coexist</h3>
<p>Do not write a switch statement over one of them.</p>
<table>
<tr><th>Vocabulary</th><th>Shape</th></tr>
<tr><td>Legacy</td><td>A closed lowercase list of ten: <code>part_of</code>, <code>uses</code>, <code>depends_on</code>, <code>drives</code>, <code>supports</code>, <code>improves</code>, <code>blocked_by</code>, <code>caused</code>, <code>replaced_by</code>, <code>related_to</code>.</td></tr>
<tr><td>Current</td><td>An open SCREAMING_SNAKE vocabulary matching <code>^[A-Z][A-Z0-9_]{1,63}$</code> &mdash; <code>MARRIED_TO</code>, <code>SIBLING_OF</code>, <code>REPORTS_TO</code>, <code>WORKS_AT</code> and whatever else the relation pass proposes.</td></tr>
</table>
<p>Both are validated on write, so an edge <code>type</code> is always one shape or the other. Render an unrecognised type by humanising the string rather than dropping the edge.</p>

<h2>Behaviour worth knowing before you render</h2>

<div class="warn"><b>Superseded details are included, and nothing marks them for you except one integer.</b> The details query filters only on deletion, so a node's <code>slices</code> array holds both current and outdated facts, each carrying <code>is_current</code>. Recall reads <code>is_current = 1</code> only. A renderer that prints every slice will show the reader a fact and its correction side by side, with no visual difference between them. Filter on <code>is_current</code> unless you are deliberately building a history view.</div>

<div class="warn"><b>Edges can dangle.</b> Nodes are filtered to live rows &mdash; not deleted, not archived, not suppressed &mdash; but edges are filtered on deletion alone. An edge whose <code>from_node</code> or <code>to_node</code> was archived or suppressed is still in <code>edges</code>, pointing at an id that is not in <code>nodes</code>. Skip any edge whose endpoints you cannot resolve, or your layout will draw lines into empty space.</div>

<div class="note"><b><code>stats</code> counts rows, not what you received.</b> <code>stats.slices</code> and <code>stats.events</code> are the totals of every live detail and event row in the space, including those hanging off nodes that were archived or suppressed and therefore never appeared in <code>nodes</code>. Summing the embedded arrays can legitimately give you a smaller number. <code>stats.nodes</code>, <code>stats.pages</code>, <code>stats.clusters</code> and <code>stats.candidates</code> do match the arrays.</div>

<div class="note"><b>Coordinates are not stable across calls.</b> The layout is recomputed on every request from the items present in that request. Ranking within a cluster depends on how many details and events an item has, so saving a memory can move an unrelated node. If you need positions that hold still between refreshes, persist them on your side and treat the returned <code>x</code> and <code>y</code> as a first-load suggestion.</div>

<div class="note"><b><code>importance_score</code> is not a relevance score.</b> It exists to decide drawing order and ring placement inside a cluster. It has nothing to do with the scores <a href="#/api/recall">recall</a> returns, and the two are not comparable.</div>

<h2>Size</h2>
<p>There is no cap. One request returns every live node with all of its details and events inline, every live page, every live edge, and every pending candidate. Payload size grows linearly with the memory space &mdash; roughly a kilobyte of JSON per stored row once every column is serialised, so a well-used space returns a body measured in megabytes.</p>
<p>Nothing here is paginated and nothing here is rate limited, which makes this the easiest endpoint in the API to misuse. Fetch it when a view opens or when the user asks for a refresh. Do not poll it, and do not call it to answer a question &mdash; that is what <a href="#/api/recall">recall</a> is for.</p>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>userId is required</code></td><td>The legacy <code>x-api-key</code> lane was used without <code>?userId</code>. The sentence is the <code>error</code> value itself on this one.</td></tr>
<tr><td>400</td><td>project scope code</td><td><code>x-itsuki-project</code> names a project that cannot be bound. The same code appears in both <code>error</code> and <code>code</code>.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential. The <code>message</code> hints at what kind of secret was pasted.</td></tr>
<tr><td>403</td><td><code>forbidden</code> / <code>insufficient_scope</code></td><td>The Bearer token holds neither <code>memory:read</code> nor <code>memory:write</code>.</td></tr>
<tr><td>403</td><td><code>forbidden</code></td><td>Your role in the bound project lacks <code>project.memory.read</code>. The body names the capability.</td></tr>
<tr><td>404</td><td><code>not found</code></td><td>Wrong method or path. Only <code>GET /v1/graph</code> is dispatched, matched exactly &mdash; <code>/v1/graph/</code> is a <code>404</code>.</td></tr>
<tr><td>500</td><td><code>something_went_wrong</code></td><td>Reported automatically on our side. Quote the <code>x-request-id</code>.</td></tr>
</table>
<p>There is no <code>429</code> row because there is no bucket. Branch on <code>error</code>, never on <code>message</code>.</p>

<h2>The AI write quota</h2>
<p>AI-processed writes are bounded per calendar month. The <code>quota</code> block reports the position against that bound, and nothing else on this page is affected by it.</p>

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>unit</code></td><td>Always <code>ai_writes</code>. The unit is a write, not a token or a model call: one save is one write however many model calls it took.</td></tr>
<tr><td><code>used</code></td><td>Distinct AI-processed writes so far this UTC month.</td></tr>
<tr><td><code>limit</code></td><td>The monthly bound for this deployment. The same number is published unauthenticated at <code>GET /v1/limits</code> as <code>ai.monthly_writes</code>.</td></tr>
<tr><td><code>remaining</code></td><td><code>limit</code> minus <code>used</code>, floored at zero.</td></tr>
<tr><td><code>period</code></td><td>Always <code>calendar_month_utc</code>.</td></tr>
<tr><td><code>resets_at</code></td><td>ISO timestamp of 00:00:00 UTC on the first day of the next month, when <code>used</code> returns to zero. It is a fixed calendar boundary, not a rolling window from your first write.</td></tr>
<tr><td><code>capped</code></td><td><code>true</code> once <code>used</code> has reached <code>limit</code>.</td></tr>
</table>

<p>Only two kinds of work count: saves and Playground chat. Recall is deliberately excluded and never moves <code>used</code>, so a read-heavy workload cannot exhaust the bound.</p>

<p>When <code>capped</code> is <code>true</code>, the write endpoints refuse with <code>429</code> and <code>error: "ai_quota_exhausted"</code>, carrying <code>retry-after</code> and a <code>usage</code> object with the same <code>used</code>, <code>limit</code> and <code>resets_at</code> fields. <code>POST /v1/turn</code> behaves differently: it stays <code>200</code> and still answers from recall, reporting <code>collect.capped: "monthly_ai"</code> instead of failing the whole turn.</p>

<div class="warn"><b><code>quota</code> ignores <code>range</code>, and <code>userId</code> does not move it.</b> The quota is always the current UTC month, whatever window you asked for. Both <code>ai</code> and <code>quota</code> are attributed to the authenticated account, not to the memory space being read — so passing a sub-tenant <code>userId</code> narrows the activity half of the response while <code>ai</code> and <code>quota</code> keep reporting the account&rsquo;s figures.</div>

<div class="note"><b><code>ai</code> and <code>quota</code> can both be <code>null</code>.</b> If the AI accounting store cannot be read, the endpoint still answers <code>200</code> with the activity half intact and both blocks set to <code>null</code>, rather than failing the whole request. Treat <code>null</code> as &ldquo;unknown right now&rdquo;, not as zero.</div>

	["#/concepts/receipts", "Receipts & rules", "What a receipt records and why a save can store nothing."],

PAGES["/api/export"] = { title: "GET /v1/export", html: `
<h1>GET /v1/export</h1>
<p class="lede">Get everything in one memory space out as JSON — either streamed in the request, or built as a job you poll and download.</p>

<h2>Two lanes, four routes</h2>
<p>The one-shot route builds the file while you wait and streams it back. The job lane creates a row, builds the file inside your memory space's Durable Object, and hands you something to poll — so a large graph cannot hold an HTTP response open. They read the same tables and produce nearly the same file, but they are not byte-identical and the differences are called out below.</p>

<table>
<tr><th>Route</th><th>What it does</th><th>Returns</th></tr>
<tr><td><code>GET ${ORIGIN}/v1/export</code></td><td>Builds and streams the whole file now.</td><td>Raw JSON download</td></tr>
<tr><td><code>POST ${ORIGIN}/v1/exports</code></td><td>Queues a build job.</td><td><code>201</code> with the queued row</td></tr>
<tr><td><code>GET ${ORIGIN}/v1/exports</code></td><td>Lists your recent jobs and their status.</td><td>JSON</td></tr>
<tr><td><code>GET ${ORIGIN}/v1/exports/download</code></td><td>Streams a finished job's stored file.</td><td>Raw JSON download</td></tr>
</table>

<h3>Shared contract</h3>
<table>
<tr><th>Auth</th><td>API key or MCP link as <code>Authorization: Bearer</code>, or a signed-in session</td></tr>
<tr><th>Scope</th><td><code>memory:read</code> (also satisfied by <code>memory:write</code>)</td></tr>
<tr><th>Capability</th><td><code>project.export</code> — checked fresh on every request, in addition to the scope</td></tr>
<tr><th>Project selection</th><td>From the credential's own binding, or the <code>x-itsuki-project</code> header when the credential is not bound to one</td></tr>
<tr><th>Rate bucket</th><td>None. These four routes call no rate limiter.</td></tr>
<tr><th>Max body</th><td>16,384 bytes on <code>POST /v1/exports</code>. The other three take no body.</td></tr>
<tr><th>Timing</th><td><code>GET /v1/export</code> is synchronous. The job lane is deferred.</td></tr>
</table>

<div class="note"><b><code>memory:read</code> alone is not enough.</b> Exporting needs the <code>project.export</code> capability, which a project <i>viewer</i> does not hold. A viewer can call <code>POST /v1/recall</code> and read the memories workspace, then get <code>403</code> here. The check runs against the caller's current role on every request, so a role change narrows an existing key immediately, without revoking it.</div>

<h2>GET /v1/export — the one-shot download</h2>
${codeBlock(`# the space this credential resolves to
curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  ${ORIGIN}/v1/export -o itsuki-export.json

# one end user's isolated space
curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  "${ORIGIN}/v1/export?userId=alex" -o alex-export.json`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>userId</code></td><td>query string</td><td>No</td><td>Selects one of your end users' isolated spaces. Omit it for the account or project space itself. This is the only parameter the handler reads — any other query string is ignored, not rejected.</td></tr>
</table>

<h3>Response</h3>
<p>Not a JSON-API envelope — a raw attachment. <code>content-type: application/json; charset=utf-8</code> and <code>content-disposition: attachment; filename="uml-export-YYYY-MM-DD.json"</code>, where the date is today in UTC. The body is pretty-printed with a two-space indent.</p>

${outputBlock(`{
  "format": "uml-export",
  "version": 1,
  "exported_at": "2026-08-27T09:14:02.113Z",
  "user_id": "mem_9c41a7f0e35b48d2ac6f1b7e2d0a5c83",
  "nodes": [ … ],
  "slices": [ … ],
  "events": [ … ],
  "edges": [ … ],
  "memory_pages": [ … ],
  "candidates": [ … ],
  "receipts": [ … ],
  "memory_rules": [ … ],
  "memory_revisions": [ … ]
}`, "Response body (arrays abridged)")}

<table>
<tr><th>Key</th><th>Meaning</th></tr>
<tr><td><code>format</code></td><td>The literal string <code>uml-export</code> on this route. Pre-rebrand naming, still emitted verbatim.</td></tr>
<tr><td><code>version</code></td><td>Payload schema version. Currently <code>1</code>.</td></tr>
<tr><td><code>user_id</code></td><td>The resolved memory space id, not the <code>userId</code> you sent. End-user spaces are hashed, so this is a <code>mem_</code> value you will not recognise.</td></tr>
<tr><td><code>nodes</code>, <code>slices</code>, <code>events</code>, <code>edges</code>, <code>memory_pages</code>, <code>candidates</code></td><td>The graph. Live rows only — anything soft-deleted is excluded.</td></tr>
<tr><td><code>receipts</code></td><td>The write receipts for this space.</td></tr>
<tr><td><code>memory_rules</code></td><td>The space's saved rules.</td></tr>
<tr><td><code>memory_revisions</code></td><td>Prior wording, ordered by object then revision number, and only for objects that still exist. A deleted memory's earlier text does not come back through here.</td></tr>
<tr><td><code>history_truncated</code></td><td>Present <i>only</i> when revision history hit its bound. See below.</td></tr>
</table>

<p>The nine collection keys always appear, in that order, even when empty.</p>

<div class="note"><b>Revision history is bounded at 50,000 rows.</b> If the export reaches that bound the payload gains a tenth key, <code>history_truncated</code>, carrying <code>table</code>, <code>limit</code> and a note pointing at <code>GET /v1/memories/&lt;id&gt;/history</code> for complete per-object history. The file says so rather than presenting a partial download as complete. This key is added on the one-shot route only — the job lane does not add it, so a very long history is silently bounded there.</div>

<h2>POST /v1/exports — queue a job</h2>
${codeBlock(`curl -X POST ${ORIGIN}/v1/exports \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"entity": "All memories"}'`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>Same meaning as the query parameter above.</td></tr>
<tr><td><code>entity</code></td><td>string</td><td>No</td><td>Defaults to <code>"All memories"</code>. Stored truncated to 80 characters.</td></tr>
</table>

<p>Those are the only two accepted fields. Any other key is a <code>400</code> naming the first one it found. Authorization runs <i>before</i> the body is read, so an unauthorized or oversized request never creates a row.</p>

<div class="note"><b><code>entity</code> is a label, not a filter.</b> It is stored and shown back to you, and nothing else. Every job exports the same nine collections for the whole memory space regardless of what you put there. Sending <code>{"entity": "decisions only"}</code> produces a full export with a misleading caption on it.</div>

${outputBlock(`{
  "ok": true,
  "export": {
    "id": "export_1b0a5b8e-4c1e-4d3a-9f2b-8a7d6c5e4f31",
    "status": "queued",
    "format": "json",
    "entity": "All memories",
    "created_at": 1756289642113
  }
}`, "201 Created")}

<p>The <code>201</code> echoes the <code>entity</code> you sent, un-truncated. The value stored and returned by <code>GET /v1/exports</code> is the 80-character version, so the two can differ. <code>created_at</code> is epoch milliseconds.</p>
<p>The build itself is dispatched to your memory space's Durable Object after the response is written. A queued job is not a promise that it succeeded — poll for the row.</p>

<h2>GET /v1/exports — poll</h2>
${codeBlock(`curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  ${ORIGIN}/v1/exports`, "terminal")}

${outputBlock(`{
  "ok": true,
  "exports": [
    {
      "id": "export_1b0a5b8e-4c1e-4d3a-9f2b-8a7d6c5e4f31",
      "status": "complete",
      "format": "json",
      "entity": "All memories",
      "object_count": 812,
      "size_bytes": 431022,
      "error": null,
      "created_at": 1756289642113,
      "started_at": 1756289642390,
      "completed_at": 1756289644018
    }
  ]
}`, "Response")}

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>status</code></td><td><code>queued</code> → <code>running</code> → <code>complete</code> or <code>failed</code>. There is no cancelled state.</td></tr>
<tr><td><code>format</code></td><td>Always <code>json</code> on a row. This is the storage format, and it is a different string from the <code>format</code> key <i>inside</i> the file.</td></tr>
<tr><td><code>object_count</code></td><td>Total rows across all nine collections. <code>null</code> until the job completes.</td></tr>
<tr><td><code>size_bytes</code></td><td>UTF-8 byte length of the stored file. <code>null</code> until the job completes.</td></tr>
<tr><td><code>error</code></td><td><code>null</code> unless <code>status</code> is <code>failed</code>, in which case it is a sentence you can act on.</td></tr>
<tr><td><code>started_at</code>, <code>completed_at</code></td><td>Epoch milliseconds, <code>null</code> until reached.</td></tr>
</table>

<p>Rows come back newest first, capped at 50. There is no paging and no <code>limit</code> parameter — the 51st-oldest job is simply not addressable through this route, though its id still downloads. The stored file itself is never included in a listing; only <code>GET /v1/exports/download</code> returns it.</p>

<div class="note"><b>The job lane has a size ceiling the one-shot route does not.</b> A finished file larger than the export row can hold (1,500,000 bytes by default) is not stored and not truncated: the job goes to <code>failed</code> with an error naming the size and pointing at the direct download. <code>GET /v1/export</code> streams and has no such bound, so that is the route to use for a large space.</div>

<h2>GET /v1/exports/download</h2>
${codeBlock(`curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  "${ORIGIN}/v1/exports/download?id=export_1b0a5b8e-4c1e-4d3a-9f2b-8a7d6c5e4f31" \\
  -o itsuki-export.json`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>id</code></td><td>query string</td><td>Yes</td><td>The export id from the job row. An absent <code>id</code> is treated the same as an unknown one — <code>404</code>, not <code>400</code>.</td></tr>
<tr><td><code>userId</code></td><td>query string</td><td>No</td><td>Must resolve to the same space the job was created in. An export is only visible to the space that owns it.</td></tr>
</table>

<p>On success the response is the stored file, byte for byte, with <code>content-type: application/json; charset=utf-8</code> and <code>content-disposition: attachment; filename="itsuki-export-YYYY-MM-DD.json"</code>, where the date comes from the job's <code>created_at</code> — not from when you downloaded it.</p>

<div class="warn"><b>The two lanes disagree about the word "format", three ways.</b> The file from <code>GET /v1/export</code> starts with <code>"format": "uml-export"</code> and downloads as <b>uml-export-</b>YYYY-MM-DD.json. The file from the job lane starts with <code>"format": "itsuki-export"</code> and downloads as <b>itsuki-export-</b>YYYY-MM-DD.json. The job <i>row</i> reports <code>"format": "json"</code>, meaning neither of those. If you are matching on the format string, match both spellings; if you are matching on the filename, do not assume a stable prefix. Everything else about the two payloads — <code>version</code>, key order, row selection — is the same.</p></div>

<h2>What an export covers</h2>
<p>Exactly one memory space, resolved from the credential and the request in the usual way, and exactly the nine collections listed above.</p>
<table>
<tr><th>In the file</th><th>Not in the file</th></tr>
<tr><td>Live memories, details, events, edges, conversation pages and candidates for one space</td><td>Any other space — a second project, or an end user you did not name in <code>userId</code></td></tr>
<tr><td>Write receipts and saved rules for that space</td><td>Raw source packets and episodes, job and extraction records, playground transcripts</td></tr>
<tr><td>Prior wording for objects that still exist, up to 50,000 revisions</td><td>Webhook configuration and deliveries, credentials, audit records, account and project metadata</td></tr>
</table>
<p>No route iterates spaces. An account with a default project and three others, each with end users of its own, needs one export call per space — and because end-user spaces are stored under hashed ids, you must supply the same <code>userId</code> strings you wrote with. There is no way to enumerate them from an export route.</p>

<h2>Expiry</h2>
<p>Nothing here expires on a timer. A completed export row and its stored file stay until one of these happens:</p>
<ul>
<li>A managed project sets a retention policy for the <code>export_blobs</code> class. When it runs, the stored file is cleared — <code>data</code> removed and <code>size_bytes</code> set to <code>0</code> — and the row survives.</li>
<li>The project is permanently deleted, which removes the rows outright.</li>
</ul>

<div class="warn"><b>A cleared export still reports <code>status: "complete"</code>.</b> Retention removes the file but leaves the row, and <code>GET /v1/exports/download</code> decides readiness by looking for the stored bytes. So a scrubbed export lists as complete with <code>size_bytes: 0</code>, and downloading it returns <code>409 not_ready</code> with a message about the export still being built. It is not being built; the file is gone. Treat <code>size_bytes: 0</code> on a complete row as "download this again from scratch".</div>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>unknown_export_field</code></td><td><code>POST /v1/exports</code> received a body key other than <code>userId</code> or <code>entity</code>. The message names the first one.</td></tr>
<tr><td>400</td><td><code>invalid_json</code></td><td>The body is not one JSON object.</td></tr>
<tr><td>400</td><td><code>userId is required</code></td><td>A legacy <code>x-api-key</code> with no <code>userId</code> to scope it to.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential. The message hints when you pasted the wrong kind of secret.</td></tr>
<tr><td>403</td><td><code>forbidden</code>, <code>code: insufficient_scope</code></td><td>The token's declared scopes do not include <code>memory:read</code>.</td></tr>
<tr><td>403</td><td><code>forbidden</code>, <code>capability: project.export</code></td><td>Your current role in the project cannot export. Viewers land here.</td></tr>
<tr><td>403</td><td><code>project_scope_mismatch</code></td><td><code>x-itsuki-project</code> names a project the credential is not bound to.</td></tr>
<tr><td>404</td><td><code>project_not_found</code></td><td>The selected project does not exist.</td></tr>
<tr><td>404</td><td><code>not_found</code></td><td>Download: no export with that id in this space, or no <code>id</code> given.</td></tr>
<tr><td>409</td><td><code>not_ready</code></td><td>Download: the job is not <code>complete</code>, or its stored file has been cleared.</td></tr>
<tr><td>413</td><td><code>request_too_large</code></td><td><code>POST /v1/exports</code> body over 16,384 bytes.</td></tr>
</table>
<p>Branch on <code>error</code> and <code>code</code>; the wording of <code>message</code> is not contractual. Inside a managed project, creating and downloading an export both write an audit record, including the attempts that came back <code>404</code> or <code>409</code>.</p>

<h2>Where to go next</h2>
${nextSteps([
	[`#/guides/export`, `Export and delete your data`, `The task guide, and the four removal operations.`],
	[`#/concepts/scope`, `Who memory belongs to`, `How a credential resolves to one memory space.`],
	[`#/concepts/delete`, `Delete & erasure`, `What deletion removes, and what an export no longer sees.`],
	[`#/api/errors`, `Errors`, `Every code and what to do about it.`],
])}
` };

PAGES["/api/rules"] = { title: "GET /v1/rules", html: `
<h1>GET /v1/rules</h1>
<p class="lede">Read the extraction policy that decides what may become memory, write a new version of it under an optimistic-concurrency check, and dry-run a change before saving it.</p>

<table>
<tr><th>Routes</th><td><code>GET /v1/rules</code>, <code>PUT /v1/rules</code>, <code>POST /v1/rules</code> (a byte-identical alias for clients that cannot send <code>PUT</code>), <code>POST /v1/settings/rules/preview</code></td></tr>
<tr><th>Path</th><td><code>${ORIGIN}/v1/rules</code></td></tr>
<tr><th>Auth</th><td>API key or MCP link as <code>Authorization: Bearer</code>, or a signed-in session. The preview route is <b>session only</b>.</td></tr>
<tr><th>Scope</th><td><code>memory:read</code> to read, <code>memory:write</code> to write. <code>memory:write</code> satisfies a read requirement; <code>memory:read</code> never satisfies a write.</td></tr>
<tr><th>Capability</th><td>Read needs <code>project.memory.read</code>. Every write needs <code>project.rules.edit</code> — organization owner or admin, or project admin. A project member who can write memory still cannot edit the rules.</td></tr>
<tr><th>Rate bucket</th><td>None on <code>/v1/rules</code>. Preview counts against <code>save</code> — 60 requests per 60 seconds, keyed to the signed-in user and project.</td></tr>
<tr><th>Max body</th><td>16,384 bytes of serialized UTF-8 JSON on every write, preview included.</td></tr>
<tr><th>Timing</th><td>Fully synchronous. Nothing is deferred.</td></tr>
</table>

<h2>The rule document</h2>
<p>One document per account, or per project when the project is organization-managed. Every field is always present in a response, normalized and clamped.</p>

<table>
<tr><th>Field</th><th>Type</th><th>Default</th><th>Notes</th></tr>
<tr><td><code>customInstructions</code></td><td>string</td><td><code>""</code></td><td>Free-text guidance injected into extraction prompts. Trimmed, truncated to 2,000 characters.</td></tr>
<tr><td><code>includes</code></td><td>string[]</td><td><code>[]</code></td><td>Allow-list. When non-empty, only content matching at least one term may become memory. Maximum 32 terms, each truncated to 80 characters; whitespace is collapsed and terms are de-duplicated case-insensitively. Terms past the 32nd are dropped.</td></tr>
<tr><td><code>excludes</code></td><td>string[]</td><td><code>[]</code></td><td>Deny-list, same bounds. An exclude always wins over an include.</td></tr>
<tr><td><code>customCategories</code></td><td>object[]</td><td><code>[]</code></td><td>Maximum 16. Each entry is a string or <code>{ name, description }</code>. <code>name</code> is lower-cased with non-alphanumerics folded to underscores and truncated to 40 characters; <code>description</code> to 160.</td></tr>
<tr><td><code>projectCategories</code></td><td>object[]</td><td><code>[]</code></td><td>Governed filing categories, <code>{ id, slug, name, description }</code>, maximum 32. Injected at the write door for a managed project — this field is always empty in a <code>/v1/rules</code> response and cannot be set here.</td></tr>
<tr><td><code>captureDefault</code></td><td>string</td><td><code>"auto"</code></td><td><code>auto</code> or <code>graph_only</code>. <code>graph_only</code> never builds whole-chat capture pages. Any other value normalizes to <code>auto</code>.</td></tr>
<tr><td><code>captureDensity</code></td><td>string</td><td><code>"standard"</code></td><td><code>standard</code> (selective, high precision) or <code>dense</code> (exhaustive, lower gate floor). Anything that is not exactly <code>dense</code> normalizes to <code>standard</code>.</td></tr>
<tr><td><code>autoCollect</code></td><td>boolean</td><td><code>true</code></td><td>Whether <code>POST /v1/turn</code> feeds the turn into the auto-collect lane.</td></tr>
<tr><td><code>retentionDays</code></td><td>integer or null</td><td><code>null</code></td><td>Positive integer, floored. Zero, a negative number or a non-number becomes <code>null</code>, meaning no retention limit.</td></tr>
</table>

<div class="note"><b>The prompt gets guidance; the filters are the enforcement.</b> <code>customInstructions</code> is advice to the extractor and a model can ignore it. <code>includes</code> and <code>excludes</code> are applied in code, before anything is written, so a model that ignores the guidance still cannot store excluded content.</div>

<h2>Read the current policy</h2>
${codeBlock(`curl ${ORIGIN}/v1/rules \\
  -H "authorization: Bearer $ITSUKI_API_KEY"`, "terminal")}

<p>The only parameter is <code>userId</code>, as a query string value.</p>

${outputBlock(`{
  "ok": true,
  "rules": {
    "customInstructions": "Never save anything about my salary.",
    "includes": [],
    "excludes": ["salary", "compensation"],
    "customCategories": [],
    "projectCategories": [],
    "captureDefault": "auto",
    "captureDensity": "standard",
    "autoCollect": true,
    "retentionDays": null
  },
  "rules_version": "rules_v1_4f9c2a1d7b83e0c45a6f19d2e8b70c3a5d41f96b28e7c0a3"
}`)}

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>rules</code></td><td>The stored document, normalized. Not the composed effective policy a write door uses — see <a href="#/api/rules">how the layers stack</a> below.</td></tr>
<tr><td><code>rules_version</code></td><td>An opaque generation token, <code>rules_v1_</code> followed by 48 hex characters. Required on the next write. It is present even when no rules row exists yet, in which case it is the version meaning <i>absent</i>.</td></tr>
</table>

<div class="note"><b><code>userId</code> does not select an end user's rules.</b> On session and Bearer-key auth the document is keyed to the project's root memory space, so a sub-tenant selected with <code>userId</code> shares the same policy rather than owning one. Only the legacy operator door, which addresses a target identity directly, reads a document per target.</div>

<div class="warn"><b>A read can show defaults it did not actually read.</b> If the rules store is briefly unreadable, <code>GET</code> answers with the defaults rather than failing, because a settings page that returns <code>500</code> over a transient read is worse than one showing defaults. A write in the same condition does the opposite and refuses with <code>503 memory_rules_unavailable</code>, so nothing is saved on top of a policy that was never seen. Do not treat a defaults-shaped <code>GET</code> as proof the account has no rules.</div>

<h2>Write a new version</h2>
${codeBlock(`curl -X PUT ${ORIGIN}/v1/rules \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -H "if-match: rules_v1_4f9c2a1d7b83e0c45a6f19d2e8b70c3a5d41f96b28e7c0a3" \\
  -d '{
    "rules": {
      "excludes": ["salary", "compensation", "medical"],
      "captureDensity": "dense"
    }
  }'`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>rules</code></td><td>object</td><td>No</td><td>The patch. May also be sent at the top level of the body — the handler uses <code>rules</code> when present and otherwise treats the whole body as the patch.</td></tr>
<tr><td><code>expected_version</code></td><td>string</td><td>Conditional</td><td>The <code>rules_version</code> you last read. Required unless you send <code>If-Match</code>.</td></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>Selects a memory space. As on the read, it does not select a different rules document except on the legacy operator door.</td></tr>
</table>

<p>Inside the patch, every field of the rule document is accepted, plus snake_case aliases for the camelCase names: <code>custom_instructions</code>, <code>custom_categories</code>, <code>capture_default</code>, <code>capture_density</code>, <code>auto_collect</code>, <code>retention_days</code>. <code>includes</code> and <code>excludes</code> have no alias.</p>

<h3>The precondition is mandatory</h3>
<p>Send the version you last read, as an <code>If-Match</code> header or as <code>expected_version</code> in the body. Surrounding quotes and a leading <code>W/</code> on the header are stripped, so both quoted and bare forms work.</p>
<table>
<tr><th>You send</th><th>Result</th></tr>
<tr><td>Neither</td><td><code>428 precondition_required</code>. There is no unconditional write.</td></tr>
<tr><td>Both, agreeing</td><td>Accepted.</td></tr>
<tr><td>Both, disagreeing</td><td><code>400 invalid_precondition</code>.</td></tr>
<tr><td>A version that is no longer current</td><td><code>409 settings_conflict</code>, with the current document and version in the body so you can reload from the error itself.</td></tr>
</table>

<h3>Response</h3>
${outputBlock(`{
  "ok": true,
  "rules": {
    "customInstructions": "Never save anything about my salary.",
    "includes": [],
    "excludes": ["salary", "compensation", "medical"],
    "customCategories": [],
    "projectCategories": [],
    "captureDefault": "auto",
    "captureDensity": "dense",
    "autoCollect": true,
    "retentionDays": null
  },
  "rules_version": "rules_v1_b70c3a5d41f96b28e7c0a34f9c2a1d7b83e0c45a6f19d2e8",
  "rules_metadata": {
    "version": "rules_v1_b70c3a5d41f96b28e7c0a34f9c2a1d7b83e0c45a6f19d2e8",
    "updated_at": 1756310400000,
    "updated_by": { "id": "usr_7c1f", "name": "Dana", "email": "dana@example.com" }
  },
  "changed": true
}`)}

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>rules</code></td><td>The document as stored, after normalization. This is the authoritative answer to what you just saved — read it rather than assuming your request survived intact.</td></tr>
<tr><td><code>rules_version</code></td><td>The new version. Use it as the <code>If-Match</code> for your next write.</td></tr>
<tr><td><code>rules_metadata.updated_at</code></td><td>Epoch milliseconds.</td></tr>
<tr><td><code>rules_metadata.updated_by</code></td><td>The account behind the credential, or <code>null</code> on the legacy operator door.</td></tr>
<tr><td><code>changed</code></td><td>Whether the stored document actually differs from the previous one.</td></tr>
</table>

<div class="warn"><b>A write is a merge, not a replacement, and it always advances the version.</b> Fields you omit keep their current values — to clear a list send an empty array, and to clear retention send <code>null</code>. And even a write where <code>changed</code> is <code>false</code> writes a new generation, so the version you held is stale afterwards. Always take the next <code>If-Match</code> from the response you just received.</div>

<div class="note"><b>Unknown fields are ignored here, not refused.</b> Unlike <code>/v1/save</code> and <code>/v1/recall</code>, this endpoint has no unknown-parameter check. A patch of <code>{"exclude": ["salary"]}</code> — singular, a typo — returns <code>200</code> with <code>changed: false</code> and nothing saved. Check <code>changed</code> and the echoed <code>rules</code>, not the status code.</div>

<p>Authorization runs before the body is buffered, so a request that is both unauthorized and oversized gets <code>401</code> or <code>403</code> rather than <code>413</code>. On an organization-managed project a successful write records a <code>project.rules.updated</code> audit entry, with outcome <code>ok</code> or <code>noop</code> and a count-level diff rather than the rule text.</p>

<h2>Preview a change before saving it</h2>
<p><code>POST /v1/settings/rules/preview</code> runs the real deterministic admission filter over sample text and writes nothing — no source packets, jobs, receipts, usage rows or graph state. It is what lets a settings screen show a truthful kept/not-kept instead of a promise.</p>

${codeBlock(`curl -X POST ${ORIGIN}/v1/settings/rules/preview \\
  -H "content-type: application/json" \\
  --cookie "$ITSUKI_SESSION" \\
  -d '{
    "samples": ["My knee surgery is on the 12th.", "lol ok thanks"],
    "rules": { "excludes": ["medical"] }
  }'`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>samples</code></td><td>string[]</td><td>No</td><td>At most 10. Extra entries are sliced off silently rather than rejected. Each sample is truncated to 400 characters, and the truncated text is what comes back in <code>text</code>.</td></tr>
<tr><td><code>rules</code></td><td>object</td><td>No</td><td>An override merged over the stored document for this preview only. Must be a non-array JSON object. Only six keys are permitted: <code>customInstructions</code>, <code>includes</code>, <code>excludes</code>, <code>captureDefault</code>, <code>captureDensity</code>, <code>autoCollect</code>.</td></tr>
</table>
<p>Any other top-level field is a <code>400 unknown_preview_field</code> naming the first offender; any other key inside <code>rules</code> is a <code>400 unknown_preview_rule</code>.</p>

${outputBlock(`{
  "ok": true,
  "results": [
    {
      "text": "My knee surgery is on the 12th.",
      "kept": false,
      "reason": "excluded_by_rule",
      "project_category": null,
      "project_category_reason": "not_evaluated_blocked",
      "assessment": "not_evaluated_blocked",
      "assessment_reason": null
    },
    {
      "text": "lol ok thanks",
      "kept": true,
      "reason": null,
      "project_category": null,
      "project_category_reason": "no_active_categories",
      "assessment": "not_durable",
      "assessment_reason": "greeting, nothing durable"
    }
  ],
  "active_category_count": 0,
  "category_preview": "not_needed",
  "assessment_preview": "evaluated"
}`)}

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>kept</code></td><td>Whether the sample passes the rules. Decided in code, never by a model.</td></tr>
<tr><td><code>reason</code></td><td><code>excluded_by_rule</code>, <code>outside_include_rules</code>, or <code>null</code> when kept.</td></tr>
<tr><td><code>assessment</code></td><td>Whether a kept sample would actually survive extraction: <code>durable</code>, <code>not_durable</code>, <code>uncertain</code>, or <code>not_evaluated_blocked</code> on a sample the filter already rejected.</td></tr>
<tr><td><code>project_category_reason</code></td><td><code>model_proposed</code>, <code>no_clear_category</code>, <code>no_active_categories</code>, <code>preview_unavailable</code>, or <code>not_evaluated_blocked</code>.</td></tr>
<tr><td><code>category_preview</code>, <code>assessment_preview</code></td><td>Per-stage state: <code>evaluated</code>, <code>unavailable</code>, or the literal string <code>not_needed</code> when no sample was eligible and no model was called.</td></tr>
</table>

<div class="note"><b>Passing the rules is not the same as being stored.</b> A kept sample is separately judged for extraction worthiness, so chatter the pipeline would drop still comes back <code>kept: true</code> with <code>assessment: "not_durable"</code>. An unreachable or unsure model reports <code>uncertain</code> with reason <i>model review unavailable</i>; it is never guessed around. Text from a rejected sample is never sent to a model at all.</div>

<div class="note"><b>Preview needs a browser session.</b> A Bearer key on this route gets <code>401 unauthorized</code>, not a scope error — the session lookup simply finds nothing. The same is true of the app's own settings writer, <code>PUT /v1/settings/rules</code>. Key-based clients use <code>PUT /v1/rules</code>.</div>

<h2>How the layers stack</h2>
<p>At a write door — <code>POST /v1/save</code>, <code>POST /v1/turn</code>, <code>POST /v1/ingest</code> — the effective policy is composed from up to three layers, in this order.</p>
<table>
<tr><th>Layer</th><th>Where it lives</th><th>How it is set</th></tr>
<tr><td>Account or project</td><td>The rule document above</td><td><code>PUT /v1/rules</code>, or the Rules screen.</td></tr>
<tr><td>Per key</td><td>On the credential</td><td>A <code>rules</code> object supplied when the key is created. It cannot be edited afterwards and is not returned by <code>GET /v1/rules</code>.</td></tr>
<tr><td>Per request</td><td>The request body</td><td>A <code>rules</code> object on the write call, applied to that call only.</td></tr>
</table>

<p>Two composition modes, chosen by whether the project is organization-managed.</p>
<table>
<tr><th></th><th>Unmanaged account</th><th>Managed project</th></tr>
<tr><td>Terms</td><td>Replacement, field by field. <code>excludes: ["health"]</code> means exactly that list, and the account's own excludes are gone for that request.</td><td>Denies accumulate. Excludes are the union of every layer, plus deny terms read out of each layer's <code>customInstructions</code>.</td></tr>
<tr><td>Allow-lists</td><td>The narrowest layer that names <code>includes</code> replaces the others.</td><td>Each non-empty <code>includes</code> list becomes an additional AND-ed layer (up to three), so content must match a term in every layer.</td></tr>
<tr><td>Switches</td><td>The later layer wins.</td><td>The stricter value wins: <code>graph_only</code> over <code>auto</code>, <code>standard</code> over <code>dense</code>, <code>autoCollect</code> false over true, and the shortest positive <code>retentionDays</code>.</td></tr>
<tr><td>Instructions</td><td>Replaced.</td><td>Concatenated, capped at 2,000 characters.</td></tr>
<tr><td>Categories</td><td>Replaced.</td><td>Accumulate as extraction vocabulary. Categories are filing metadata and never an authorization rule.</td></tr>
</table>

<div class="warn"><b>On a managed project, a request can only narrow.</b> A key's rules and a request's <code>rules</code> object can add denies, add another allow-list layer, turn capture off or shorten retention. Neither can erase a deny the account or project set, and neither can widen an allow-list. If the composed policy cannot be read at a managed write door, the write is refused rather than admitted under an unknown policy.</div>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>invalid_json</code></td><td>The body is not one JSON object, or is not valid UTF-8.</td></tr>
<tr><td>400</td><td><code>invalid_precondition</code></td><td><code>If-Match</code> and <code>expected_version</code> were both sent and name different versions.</td></tr>
<tr><td>400</td><td><code>unknown_preview_field</code></td><td>A preview body field other than <code>samples</code> or <code>rules</code>. The message names the first one.</td></tr>
<tr><td>400</td><td><code>invalid_preview_rules</code></td><td>Preview <code>rules</code> is not a JSON object.</td></tr>
<tr><td>400</td><td><code>unknown_preview_rule</code></td><td>A key inside preview <code>rules</code> outside the six permitted.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential — including a Bearer key on the session-only preview route.</td></tr>
<tr><td>403</td><td><code>forbidden</code>, <code>code: insufficient_scope</code></td><td>The key lacks <code>memory:write</code> on a write.</td></tr>
<tr><td>403</td><td><code>forbidden</code>, <code>capability: project.rules.edit</code></td><td>The role cannot edit rules. The body names the missing capability and nothing about who holds it.</td></tr>
<tr><td>409</td><td><code>settings_conflict</code></td><td>The policy changed elsewhere. The body carries the current <code>rules</code> and <code>rules_version</code>.</td></tr>
<tr><td>413</td><td><code>request_too_large</code></td><td>The serialized body exceeds 16,384 bytes. The body reports <code>limit</code> and <code>actual</code>.</td></tr>
<tr><td>428</td><td><code>precondition_required</code></td><td>Neither <code>If-Match</code> nor <code>expected_version</code> was sent.</td></tr>
<tr><td>429</td><td><code>too_many_requests</code></td><td>Preview only. The <code>save</code> bucket tripped; the body reports <code>retry_after_s</code> and <code>bucket</code>.</td></tr>
<tr><td>503</td><td><code>memory_rules_unavailable</code></td><td>The current policy could not be verified, so no change was saved. Retry.</td></tr>
</table>
<p>Branch on <code>error</code>, never on <code>message</code> — the codes are contractual and the wording is not. Every response carries an <code>x-request-id</code>.</p>

<h1>Playground</h1>
<p class="lede">Save and recall memory from inside the app without writing any code: run a read-only example to watch capture happen, then open a chat that writes to your project's real memory.</p>

${prereq([
	`A project role of <b>admin</b> or <b>member</b>. A viewer has no Playground at all — see <a href="#/guides/projects">Projects, organizations, and teams</a>.`,

])}

<h2>What it is</h2>
<p>In the left rail, under <b>Setup</b>, choose <b>Playground</b>. It is a split screen — a graph on the left, a chat on the right — and it runs in one of two modes. The difference between them is the only thing about this screen worth memorising.</p>

<table>
<tr><th></th><th>An example</th><th>A chat</th></tr>
<tr><td>How you get there</td><td><b>Pick example</b>. This is the mode the Playground opens in.</td><td><b>Threads</b> → a chat, or <b>+ New chat</b></td></tr>
<tr><td>How you know which one you are in</td><td>A bar across the chat: <i>Preview — a sample world, so you can see how memory behaves. Nothing here is saved to your account.</i></td><td>No bar. The Threads menu is headed <i>Your chats — these capture for real</i>.</td></tr>
<tr><td>The graph on the left</td><td>A hand-built world seeded for that scenario</td><td>What this chat has captured, arranged around a hub node reading <b>This chat</b></td></tr>
<tr><td>The reply</td><td>Scripted, for the suggested lines</td><td>From a chat model, handed the context recall assembled. It is a smaller, separate model from the one that extracts.</td></tr>
<tr><td>A sentence you type yourself</td><td>Runs extraction for real and shows what it would keep. Nothing is written: no source packet, no memory, no receipt.</td><td>Recall and capture run through the same two commands every other door uses. There is no second extraction path here.</td></tr>
<tr><td>What is left behind</td><td>Nothing</td><td>Memories in this project, and a receipt on the <b>History</b> page</td></tr>
</table>

<div class="note"><b>Both modes spend real model calls, which is why the gate is stricter than plain memory access.</b> Reading project memory is not enough to open the Playground: a viewer can inspect memory, the graph and history, and still has no Playground tab.</div>

<h2>1 · Run an example</h2>
<ol class="steps">
<li><b>Open the Playground.</b><p>Left rail, group <b>Setup</b>, item <b>Playground</b>. What you should see: the split screen on the first example, <b>Thesis research assistant</b>, with the preview bar above the chat and an opening exchange already in the transcript. On a first visit the guided tour starts by itself; you can re-launch it any time with <b>Take the tour</b> at the bottom of the graph.</p></li>
<li><b>Switch example.</b><p>Click the chip in the chat header — in an example it shows the scenario's name rather than the words <b>Pick example</b> — and choose one of the five listed under <b>Read-only examples</b>. What you should see: the graph is replaced, the transcript resets to that scenario's opening exchange, and the check mark moves to the row you picked.</p></li>
<li><b>Send a suggested line.</b><p>Directly above the composer sit up to two buttons carrying the scenario's next scripted lines. Click one. What you should see, in order: your message; a chip reading <b>Extracting…</b>; then the outcome — <b>Captured · N facts</b> or <b>Nothing durable to capture</b> — followed by a <b>Context block</b> and the reply. Every assistant turn is labelled <i>Assistant turns are not captured</i>.</p></li>
<li><b>Expand the context block.</b><p>Its header reads <b>Context block</b> with the sub-line <i>used in the reply · N facts · N entities</i>, and the control on the right reads <b>Expand</b>. Inside are the facts and entities assembled for that turn, which is exactly the material a connected model would be handed. A validity range ending in <b>present</b> is currently true; one with an end date used to be true and no longer is.</p></li>
<li><b>Type a sentence of your own.</b><p>The composer placeholder reads <i>Say something to this example…</i>. Enter sends, Shift+Enter starts a new line. Anything that is not one of the scripted lines goes to the preview extractor: one real model call that stores nothing. What you should see: the entities it named arrive as new nodes ringing the outside of the graph, and the reply says what it would have kept. If nothing in the sentence would still be true next month, it says that too.</p></li>
</ol>

<p>The <b>JSON</b> toggle in the chat header prints the example the way the API would describe it — the world as it stands, then each turn's extraction underneath:</p>

<h2>The five examples</h2>
<p>Each is a hand-built world: a clustered graph of uneven density, an opening exchange already in progress, and three follow-up lines carrying the exact facts and entities the reader was shown. None of them touch your memory.</p>
<table>
<tr><th>Example</th><th>What it holds</th></tr>
<tr><td>Thesis research assistant</td><td>A doctoral project tracked across months</td></tr>
<tr><td>Engineering team copilot</td><td>Architecture decisions across a platform team</td></tr>
