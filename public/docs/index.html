	/* Same self-hosted faces the app uses, same three subsets. The docs sat on
	   the system stack, so the product and the documentation for it were set in
	   two different typefaces. Subsets are unicode-range scoped so a stray glyph
	   cannot pull down a whole second file. */

		font-family: "Fustat";
		src: url("/assets/fustat-latin-variable.woff2") format("woff2");
		font-weight: 200 800;
		font-style: normal;
		font-display: swap;
		unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC,

			U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
	}
	@font-face {
		font-family: "Fustat";
		src: url("/assets/fustat-latin-ext-variable.woff2") format("woff2");
		font-weight: 200 800;
		font-style: normal;

		unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
			U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
			U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,

	}

<script>
const PRODUCT = { name: "Itsuki", pkg: "itsuki", tokenPrefix: "itsuki_live_" };
const ORIGIN = location.origin;

/* ---------------------------------------------------------------- nav */
const NAV = [

	{ sec: "Connect a tool", items: [

	]},
	{ sec: "Frameworks & tools", items: [

		["/integrations/typescript", "TypeScript frameworks"],
		["/integrations/n8n", "n8n"],

	]},

	{ sec: "Concepts", items: [

		["/concepts/scope", "Who memory belongs to"],
		["/concepts/delete", "Delete & erasure"],
	]},
	{ sec: "Operate", items: [
		["/operate/observability", "Monitoring & diagnostics"],
	]},
	{ sec: "Trust", items: [
		["/privacy", "Privacy & limits"],
	]},
];

/* ---------------------------------------------------------------- helpers */
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const codeBlock = (text) => `<pre><button class="copy">Copy</button><code>${esc(text)}</code></pre>`;

/* ---------------------------------------------------------------- pages */
const PAGES = {};

PAGES["/"] = { title: "What is Itsuki?", html: `
<h1>What is Itsuki?</h1>
<p class="lede">A private, structured memory service that supported tools can save to and recall from through MCP, REST, and the dashboard.</p>
<p>Itsuki (樹, "tree") is a personal memory engine. Tools you connect can <b>save</b> durable facts about you and <b>recall</b> them later. Memory is stored as a structured graph — memories, details, events, and the connections between them — that you can see, edit, and delete from your dashboard. Nothing is hidden inside an app you don't control.</p>
<h2>One service, three interfaces</h2>
<table>
<tr><th>Door</th><th>Who it's for</th><th>How</th></tr>
<tr><td><b>MCP</b></td><td>AI chats &amp; editors (Claude, ChatGPT, Cursor…)</td><td>One private URL pasted into the client's connector settings</td></tr>
<tr><td><b>REST API</b></td><td>Your own apps, agents, and scripts</td><td>Bearer key + two main endpoints: save and recall</td></tr>
<tr><td><b>Dashboard</b></td><td>You</td><td>See the graph, review suggestions, set rules, read receipts</td></tr>
</table>
<p>All three interfaces route through the same account and scope model. The connected client or host model decides when to call MCP tools, so an installed connector is not by itself proof of a save or recall.</p>
<h2>What makes it different</h2>
<ul>
<li><b>You can see it.</b> Your memory is a living graph in your dashboard, not a black box.</li>
<li><b>Receipts for every write.</b> Each save produces a receipt: what was stored, what was skipped, and why.</li>
<li><b>Selective by design.</b> Itsuki stores durable facts, not chat logs. Your rules decide what's worth remembering.</li>
<li><b>Private by default.</b> No trackers, no ads, no training on your memory. <a href="#/privacy">Read the privacy page</a>.</li>
</ul>
<p>Ready? The <a href="#/quickstart">quickstart</a> takes about five minutes.</p>
` };

PAGES["/quickstart"] = { title: "Quickstart", html: `
<h1>Quickstart</h1>
<p class="lede">From zero to a working memory in about five minutes.</p>
<h2>1 · Create an account</h2>
<p>Sign up at <a href="${ORIGIN}" target="_blank" rel="noopener">${ORIGIN}</a> (free, email or Google).</p>
<h2>2 · Create a key</h2>
<p>In the app: <b>API Keys → Create API key</b>. The full key (<code>${PRODUCT.tokenPrefix}…</code>) is shown once — copy it somewhere safe.</p>
<h2>3 · Save a memory</h2>
${codeBlock(`curl -X POST ${ORIGIN}/v1/save \\
  -H "authorization: Bearer YOUR_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"content": "I started learning Kotlin this week."}'`)}
<p>The response distinguishes acceptance from background enrichment and includes a packet handle when work continues asynchronously. Inspect packet/job status before treating enrichment as terminal.</p>
<h2>4 · Recall it</h2>
${codeBlock(`curl -X POST ${ORIGIN}/v1/recall \\
  -H "authorization: Bearer YOUR_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"query": "what am I learning?"}'`)}
<p>The <code>context</code> field of the response is a compact text block — exactly what a connected AI receives.</p>
<h2>4b · Serving many end users</h2>
<p>Your API key is your account. Add <code>userId</code> and each of <i>your</i> end users gets an
<b>isolated memory space inside it</b> — nothing saved under one value is reachable from another,
on save or on recall.</p>
${codeBlock(`curl -X POST ${ORIGIN}/v1/save \\
  -H "authorization: Bearer YOUR_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"content": "Ada'"'"'s depot is in Porto.", "userId": "ada"}'`)}
<p>The SDKs take it per call — <code>memory.add("…", user_id="ada")</code> in Python,
<code>memory.add("…", { userId: "ada" })</code> in JavaScript — or once on the client.
The value is yours to pick (a user id, a tenant slug, an email); it is hashed with your account id
before it becomes a storage key, so two different API keys using the same string still get
different spaces.</p>
<div class="note"><b>Unknown parameters are rejected, not ignored.</b> A misspelled
<code>usr_id</code> returns <code>400</code> naming the offending key. Silently dropping it is how
somebody ships a multi-tenant app believing isolation worked.</div>
<h2>5 · Connect an AI chat</h2>
<p>Follow the guide for <a href="#/install/claude">Claude</a> or <a href="#/install/chatgpt">ChatGPT</a>. You can then explicitly ask the host to save or recall through the connector; actual tool selection remains controlled by that host.</p>
<div class="note">Prefer clicking to curling? The <b>Playground</b> in the app does steps 3–4 with buttons.</div>
` };

PAGES["/install/claude"] = { title: "Connect Claude", html: `
<h1>Connect Claude</h1>
<p class="lede">Claude remote custom connectors are currently a beta on Free, Pro, Max, Team, and Enterprise. Free accounts are limited to one custom connector.</p>
<div class="note"><b>Set up on a computer, not your phone.</b> The Claude mobile apps can't add connectors — configure once in a computer browser and it syncs to your phone automatically.</div>
<h2>Steps</h2>
<ol>
<li>In the Itsuki app, open <b>API Keys → Create MCP link</b> and copy your private URL (shown once): <code>${ORIGIN}/mcp/${PRODUCT.tokenPrefix}…</code></li>
<li>Open Claude's <b>Customize → Connectors</b>, click <b>+</b>, then <b>Add custom connector</b>. This <a href="https://claude.ai/settings/connectors?modal=add-custom-connector" target="_blank" rel="noopener">direct link</a> may open the same dialog. On Team or Enterprise, an Owner or Primary Owner must add it for the organization.</li>
<li>Name it <code>${PRODUCT.name.toLowerCase()}</code>, paste the URL, click <b>Add</b>.</li>
<li>In any chat: click the <b>+</b> (bottom-left) → <b>Connectors</b> → switch on <code>${PRODUCT.name.toLowerCase()}</code>. A saved connector stays off until you enable it in a chat — this step is the one everyone misses.</li>
</ol>
<h2>Try it</h2>
<p>Say: <i>"Save to ${PRODUCT.name.toLowerCase()}: I'm training for a half marathon."</i> Then in a new chat: <i>"What do you know about my training?"</i></p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Connector missing in a chat</b> — enable it via <b>+</b> → Connectors (per-chat switch).</li>
<li><b>"Unauthorized"</b> — the key was revoked or rotated; create a fresh MCP link and update the URL.</li>
<li><b>Claude doesn't save automatically</b> — by design. The model decides when to call tools; ask it explicitly, or call the API from your own runtime and inspect the receipt and packet status.</li>
</ul>
<p>Plan and UI details can change while the feature is in beta; verify them in <a href="https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp" target="_blank" rel="noopener">Anthropic's current custom-connector guide</a>.</p>
` };

PAGES["/install/chatgpt"] = { title: "Connect ChatGPT", html: `
<h1>Connect ChatGPT</h1>
<p class="lede">Itsuki needs full MCP write actions for save and recall. OpenAI currently limits that beta to ChatGPT Business and Enterprise/Edu on the web; Pro custom apps are read/fetch only.</p>
<div class="note">This is a workspace-admin flow on the web. Availability, UI, and permissions may change during the beta.</div>
<h2>Steps</h2>
<ol>
<li>A Business admin/owner enables Developer mode from <b>Settings → Apps → Advanced settings</b> or starts at <b>Workspace settings → Apps → Create</b>. Enterprise/Edu admins first grant developer access under Permissions &amp; Roles.</li>
<li>Create a custom MCP app. Name it <code>${PRODUCT.name.toLowerCase()}</code> and use the MCP link from <b>API Keys → Create MCP link</b>. Review the server's three tools and write permissions before publishing it to the workspace.</li>
<li>After the workspace approves/publishes the app, enable it in a new web chat. The host may request confirmation before a save action.</li>
</ol>
<h2>Limits worth knowing</h2>
<ul>
<li>Full MCP write actions are not currently available to Free, Plus, or Pro accounts.</li>
<li>Custom MCP apps are currently web-only. Agent mode does not use them.</li>
</ul>
<p>Follow <a href="https://help.openai.com/en/articles/12584461-developer-mode-and-full-mcp-connectors-in-chatgpt-beta" target="_blank" rel="noopener">OpenAI's current developer-mode and full-MCP guide</a>; it is the authority for plan and workspace controls.</p>
` };

PAGES["/install/claude-code"] = { title: "Claude Code (MCP)", html: `
<h1>Connect Claude Code</h1>
<p class="lede">One command. Your coding agent gets save, recall, and conversation capture.</p>
${codeBlock(`claude mcp add --transport http ${PRODUCT.name.toLowerCase()} ${ORIGIN}/mcp/YOUR_MCP_KEY`)}
<p>Replace <code>YOUR_MCP_KEY</code> with a fresh MCP link from <b>API Keys</b> (the full <code>${PRODUCT.tokenPrefix}…</code> value is shown once at creation).</p>
<div class="note"><b>MCP link ≠ API key.</b> Both start with <code>${PRODUCT.tokenPrefix}</code>, but only a token created as an <b>MCP link</b> works in the URL. An <b>API key</b> goes in a header instead — <code>${ORIGIN}/mcp</code> with <code>Authorization: Bearer &lt;key&gt;</code> — which is exactly what the <a href="#/install/plugin">Claude Code plugin</a> does for you. Paste an API key into the URL and the server will tell you so by name.</div>
<h2>What it gets</h2>
<table>
<tr><th>Tool</th><th>What it does</th></tr>
<tr><td><code>save_memory</code></td><td>Saves one explicit durable fact, returns a receipt</td></tr>
<tr><td><code>save_conversation</code></td><td>Creates or advances the conversation's Conversation page and extracts facts from several turns</td></tr>
<tr><td><code>recall_memory</code></td><td>Returns a compact context block of what's already known</td></tr>
</table>
<p>Then just tell it: <i>"save that decision to ${PRODUCT.name.toLowerCase()}"</i> or <i>"check ${PRODUCT.name.toLowerCase()} for context about this project"</i>.</p>
` };

PAGES["/install/plugin"] = { title: "Claude Code plugin", html: `
<h1>Claude Code plugin</h1>
<p class="lede">Lifecycle hooks attempt bounded recall at session start and queue scrubbed durable outcomes locally at session end.</p>
<h2>1. Install</h2>
<p>Claude Code itself can run without Node, but Itsuki's lifecycle hooks require a maintained <b>Node 22 or 24 LTS</b> runtime. Find its absolute executable path with <code>(Get-Command node).Source</code> in PowerShell or <code>command -v node</code> on macOS/Linux, and create an API key in <b>API Keys</b>.</p>
${codeBlock(`claude plugin marketplace add 12ziyad/universal-memory-engine
claude plugin install ${PRODUCT.pkg}@itsuki-plugins`)}
<p>In a Claude Code session, run <code>/plugin configure ${PRODUCT.pkg}@itsuki-plugins</code>. Select the absolute Node executable and paste the full <code>${PRODUCT.tokenPrefix}…</code> value only into the masked key prompt, then run <code>/reload-plugins</code>. You do not need to put the key in a shell profile or settings file, and hooks never resolve Node through a workspace-controlled <code>PATH</code>. The interactive configuration flow also avoids command-line quoting differences for Windows executable paths containing spaces.</p>
<h2>2. Verify</h2>
<p>In any Claude Code session, run <code>/itsuki:doctor</code>. It checks the installed files and hook configuration, protected local outbox, key, network path, REST door, and real MCP tools, then prints the exact fix for whichever fails.</p>
<h2>What you get</h2>
<p>The three memory tools (<code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code>) plus two lifecycle hooks: SessionEnd scrubs and queues what the session learned <b>locally, with no network wait</b>; the next SessionStart attempts up to four due batches in order, then loads project memory.</p>
<p>New writes use ordered v2 delivery groups. Each ingest request holds at most 30 messages, 4,000 Unicode code points per message, 120,000 code points across message content, and 512 KiB for the complete serialized UTF-8 JSON body. Oversized logical messages are split at natural Unicode boundaries where possible and every segment is position-labelled; no content is silently dropped from the captured-and-scrubbed set.</p>
<div class="note"><b>The capture boundary is reported separately.</b> SessionEnd reads a bounded snapshot of the newest 80 eligible transcript records. If an older, malformed, or oversized record is omitted, or the transcript changes during the snapshot, each batch records <code>captureTruncated</code> / <code>truncationReason</code> metadata and the hook says so. This is different from the lossless splitting performed after capture.</div>
<div class="note"><b>Delivery states are explicit.</b> “Queued locally” means the protected local write completed. “Accepted” means the service durably created the source packet/job for that batch. Neither means terminal enrichment; packet/job status eventually reports <code>enriched</code> or <code>failed</code>. Offline and retryable failures stay queued with content-bound idempotency; later batches cannot overtake an earlier batch; rejected credentials pause delivery; permanent failures are retained for <code>/itsuki:doctor</code>.</div>
<p>The protected outbox is capped at 128 raw batch envelopes / 64 MiB total / 2 MiB each and never evicts undelivered content. Existing v1 spool files remain drainable under their former 2 MiB raw-envelope cap and bounded legacy request contract; those responses carry <code>x-itsuki-ingest-contract: legacy-claude-outbox-v1</code> and the server emits content-free migration telemetry. This dual contract exists only to avoid stranding already-protected local data; all new writes use the v2 limits above. Downstream, each extraction queue entry is capped at 20 messages and 12,000 Unicode code points. Every complete serialized chat-model input is guarded at no more than 24,576 UTF-8 bytes; any model-bound omission is labelled, and an unfit fixed prompt fails before inference. Claude deletes plugin data on final uninstall unless you use its <code>--keep-data</code> option.</p>
<div class="note">Two plugin settings: an absolute Node executable and one sensitive API key; there is no MCP URL to configure. Claude stores the key in its credential store, exports it only to plugin subprocesses, and interpolates it into the bundled MCP Bearer header. If either setting is missing or the key is rejected, the plugin tells you at session start instead of failing quietly.</div>
` };

PAGES["/install/cursor"] = { title: "Cursor & other editors", html: `
<h1>Cursor &amp; other MCP editors</h1>
<p class="lede">Any MCP-capable client connects with the same URL.</p>
<h2>Cursor</h2>
<p>Add to <code>.cursor/mcp.json</code> (project) or <code>~/.cursor/mcp.json</code> (global):</p>
${codeBlock(`{
  "mcpServers": {
    "${PRODUCT.name.toLowerCase()}": { "url": "${ORIGIN}/mcp/YOUR_MCP_KEY" }
  }
}`)}
<h2>Verify</h2>
<p>Start a new session and say: <i>use the ${PRODUCT.name.toLowerCase()} whoami tool and tell me what it reports</i>. A healthy connection answers with the memory space, scopes, and live counts.</p>
<h2>Other MCP clients</h2>
<p>Where a client supports Streamable HTTP MCP, point its documented remote-server configuration at the same generated URL. Client-specific lifecycle hooks and transcript capture require separate tested adapters and are not implied by this MCP connection.</p>
<p>If your client prefers a fixed URL with header auth, that works too: point it at <code>${ORIGIN}/mcp</code> with no path token and send <code>Authorization: Bearer</code> plus an API key. Same server, same tools.</p>
<div class="note">Treat the MCP URL like a password: it IS your key. One key per tool means you can revoke one tool without touching the rest. And it must be an <b>MCP link</b>, created as such in API Keys — an API key in the URL is refused (API keys belong in the <code>Authorization: Bearer</code> header at <code>${ORIGIN}/mcp</code>).</div>
<div class="note">Some clients' MCP configs cannot send custom headers (LlamaIndex's <code>BasicMCPClient</code>, for example, documents only OAuth). The path-token URL works there unchanged — the credential travels in the URL, no header required.</div>
` };

PAGES["/install/opencode"] = { title: "OpenCode", html: `
<h1>OpenCode</h1>
<p class="lede">Persistent memory for OpenCode: a native plugin that joins the turn itself, with the remote MCP route as a fallback.</p>

<h2>Native plugin</h2>
<p>Published on npm as <code>opencode-itsuki</code>, built and signed by this repository&rsquo;s GitHub Actions workflow with npm provenance. Requires OpenCode <b>1.18.18 or newer</b> and Node 22+. Zero runtime dependencies.</p>
<h3>1. Create an API key</h3>
<p>In <b>API Keys</b>, create an <b>API key</b> &mdash; a server credential, not an MCP link.</p>
<h3>2. Install the plugin</h3>
${codeBlock(`npm install opencode-itsuki`)}
<h3>3. Point opencode.json at it</h3>
<p>Project-level <code>opencode.json</code>, or global at <code>~/.config/opencode/opencode.json</code>:</p>
${codeBlock(`{
  "plugin": ["opencode-itsuki"]
}`)}
<h3>4. Export the key</h3>
<p>The key is read <b>only</b> from the environment that starts OpenCode &mdash; never from <code>opencode.json</code>. That file expands <code>{env:VAR}</code> before it parses, so a key referenced there is resolved into the options object that config validation and other plugins can read. A secret-shaped option value is refused with a readable message rather than used.</p>
${codeBlock(`export ITSUKI_API_KEY=your_api_key`)}
<h3>5. Verify</h3>
<p>Restart OpenCode and say: <i>use the ${PRODUCT.name.toLowerCase()} status tool and tell me what it reports</i>.</p>

<h3>What it does</h3>
<p>Recall runs once per genuinely new human turn and is injected on the system channel, so it reaches the model without entering your transcript or your session titles. Capture runs only after a turn that settled successfully &mdash; never on retries, errors, cancellations, tool-only turns, or subagent sessions. Work is staged to disk before any network call, so a crash mid-save loses nothing.</p>
<p>Five tools are available to the agent: <code>itsuki_recall</code>, <code>itsuki_save</code>, <code>itsuki_memories</code>, <code>itsuki_memory</code>, <code>itsuki_status</code>.</p>
<p><b>Deliberately absent:</b> updating a memory in place, memory history, and entity operations &mdash; none exist on the server, and no tool here fakes them. Destructive tools are also absent by design: deletion needs a confirmation surface a tool call cannot provide. Use the MCP route below or the dashboard to delete.</p>
<p>Recalled memories are wrapped in explicit markers and bounded before they reach the model. That is structural delimitation, not a guarantee: no wrapper can force a model to treat remembered text as inert, and that residual risk is inherent to memory injection.</p>

<h2>MCP route</h2>
<p>Still supported, and the route that carries deletion and the full eight-tool surface.</p>
<h3>1. Create your link</h3>
<p>In <b>API Keys</b>, create an <b>MCP link</b>. It is shown once &mdash; the URL itself is the credential.</p>
<h3>2. Add the remote server</h3>
${codeBlock(`{
  "mcp": {
    "${PRODUCT.name.toLowerCase()}": {
      "type": "remote",
      "url": "${ORIGIN}/mcp/YOUR_MCP_KEY",
      "enabled": true
    }
  }
}`)}
<h3>3. Verify</h3>
<p>Restart OpenCode and say: <i>use the ${PRODUCT.name.toLowerCase()} whoami tool and tell me what it reports</i>. You should see the connected memory space, scopes, and live counts.</p>
<h3>What you get</h3>
<p>All eight memory tools: <code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code>, <code>list_memories</code>, <code>get_memory</code>, <code>delete_memory</code>, <code>delete_all_memories</code>, and <code>whoami</code>. For recall and save without prompting, add the proactive-use instructions from the dashboard&rsquo;s Get started page to your OpenCode rules.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>Plugin not loading</b> &mdash; check your OpenCode version is 1.18.18 or newer; the plugin declares that floor and older hosts will refuse it.</li>
<li><b>Memory inactive</b> &mdash; run the status tool. An unset <code>ITSUKI_API_KEY</code> is reported there rather than failing silently.</li>
<li><b>No tools appearing (MCP route)</b> &mdash; restart OpenCode after editing the config, and check the JSON parses.</li>
<li><b>401 unauthorized</b> &mdash; the link is revoked or was an API key. Create an MCP link in API Keys; API keys go in an <code>Authorization: Bearer</code> header at <code>${ORIGIN}/mcp</code> instead.</li>
<li><b>Wrong or missing memories</b> &mdash; say <i>use the whoami tool</i> and check which memory space and project the connection reports.</li>
</ul>
<div class="note">On the MCP route the URL carries your credential &mdash; treat <code>opencode.json</code> as a secret, and keep it out of version control unless the key is meant to be shared with that repository&rsquo;s collaborators. The native plugin has no such problem: its key never enters the config file.</div>
` };
PAGES["/install/antigravity"] = { title: "Antigravity", html: `
<h1>Antigravity</h1>
<p class="lede">Persistent memory for Google Antigravity: a native plugin for the CLI, and the MCP route everywhere else.</p>
<h2>Native plugin — Antigravity CLI only</h2>
<p>Published on npm as <code>antigravity-itsuki</code>, built and signed from this repository&rsquo;s GitHub Actions workflow with npm provenance. Supported on the <b>Antigravity CLI (<code>agy</code>) 1.1.13 or newer</b>, with Node 22+.</p>
${codeBlock(`npx antigravity-itsuki install
export ITSUKI_API_KEY=your_api_key
npx antigravity-itsuki doctor`)}
<p>The installer checks your host version first, writes the plugin into <code>~/.gemini/config/plugins/itsuki/</code> with a manifest of exactly what it created, and refuses to overwrite a directory it did not create. Uninstall removes only what that manifest lists and keeps anything still queued unless you pass <code>--purge</code>. The doctor reports what is configured, what is queued and what is held — and never prints your key.</p>
<p>Recall runs at <code>PreInvocation</code>, before the model sees your turn. <b>Automatic capture is currently held</b>: Antigravity has not published a transcript contract that this package can safely verify, so the CLI plugin does not upload a turn at <code>Stop</code>. Save explicitly through the MCP tools below until that host contract is proven.</p>
<p><b>The Antigravity desktop app and the Antigravity IDE are not supported.</b> Hook execution on those surfaces is undocumented and unverified, so the plugin detects them and stays inactive rather than appearing to work. Use the MCP route below there.</p>
<p><b>Deliberately absent:</b> updating a memory in place, memory history, entity operations, and any destructive tool. Deletion needs a confirmation surface a hook cannot provide — use the MCP route or the dashboard.</p>
<h2>MCP route — any Antigravity surface</h2>
<h3>1. Create your link</h3>
<p>In <b>API Keys</b>, create an <b>MCP link</b>. It is shown once — the URL itself is the credential.</p>
<h3>2. Add the MCP server</h3>
<p>In the agent panel: <b>MCP servers → Manage → open the raw config</b>, then add:</p>
${codeBlock(`{
  "mcpServers": {
    "${PRODUCT.name.toLowerCase()}": { "serverUrl": "${ORIGIN}/mcp/YOUR_MCP_KEY" }
  }
}`)}
<h3>3. Verify</h3>
<p>Restart the Antigravity session and say: <i>use the ${PRODUCT.name.toLowerCase()} whoami tool and tell me what it reports</i>.</p>
<h3>What you get</h3>
<p>All eight memory tools: <code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code>, <code>list_memories</code>, <code>get_memory</code>, <code>delete_memory</code>, <code>delete_all_memories</code>, and <code>whoami</code>.</p>
<h3>Troubleshooting</h3>
<ul>
<li><b>No tools appearing</b> — restart the session after saving the config.</li>
<li><b>401 unauthorized</b> — the pasted URL must be an MCP link created in API Keys, not an API key.</li>
</ul>
<div class="note">Antigravity's config file does not interpolate environment variables, so the URL you paste carries the credential in plain text. Treat the file as a secret. This is also why the path-token URL is the recommended route here — there is no header for a variable to fail to reach.</div>
` };

PAGES["/install/openclaw"] = { title: "OpenClaw", html: `
<h1>OpenClaw</h1>
<p class="lede">The <b>native plugin</b> joins OpenClaw's own agent lifecycle: relevant memory is recalled before each turn reaches the model, and what you decide is captured after the turn settles — running <b>alongside</b> OpenClaw's built-in memory (<code>MEMORY.md</code>, daily notes, <code>memory_search</code>), never replacing it. The MCP routes remain as fallbacks.</p>
<h2>Route A — native plugin (recommended)</h2>
<p>Published on npm as <code>openclaw-itsuki</code>, built and signed from this repository's GitHub Actions workflow with npm provenance. Zero runtime dependencies. Needs Node 22.22.3+, 24.15+, or 25.9+ — OpenClaw's own engine range (validated against OpenClaw 2026.7.1-2).</p>
${codeBlock(`openclaw plugins install openclaw-itsuki`)}
<p><b>Then grant conversation access.</b> OpenClaw blocks conversation-reading hooks for installed plugins until you opt in — without this the plugin loads, registers its tools, and captures nothing. Merge into <code>openclaw.json</code>:</p>
${codeBlock(`{
  "plugins": {
    "allow": ["itsuki"],
    "entries": {
      "itsuki": {
        "enabled": true,
        "hooks": { "allowConversationAccess": true }
      }
    }
  }
}`)}
<p>Create an <b>MCP link</b> under <b>API Keys</b> (shown once), set it as <code>ITSUKI_API_KEY</code> in the Gateway's environment, restart the Gateway, and verify — <code>diagnostics</code> must be empty:</p>
${codeBlock(`openclaw plugins inspect itsuki --runtime --json`)}
<p>Memory then recalls before every user-originated turn and saves after each settled one, exactly once — across Gateway restarts, compaction, and subagents. Cron and heartbeat runs are never captured. Recalled context is injected behind an explicit stored-context-not-instructions label, every message is scrubbed for credentials locally before it leaves the machine, and undeliverable saves wait in a crash-safe local spool rather than being lost. There is no delete surface of any kind in the plugin.</p>
<p>Optional <b>per-sender tenancy</b> (<code>"tenancy": "per-sender"</code> in the plugin config) gives each channel-scoped sender an isolated memory space derived as a one-way hash of channel + sender id. A turn without derivable sender identity skips memory entirely rather than falling back to the owner's space. Turning this on means storing per-person memory for the people who talk to your agent — tell them.</p>
<p>Deliberately absent, because the backend has no honest contract for them: update/edit of a stored memory, multimodal memory, automatic consolidation — and the plugin never claims OpenClaw's exclusive memory slot, which would disable built-in memory for every agent in the install.</p>
<h2>Route B — prompt install (MCP)</h2>
<p>Create an <b>MCP link</b> in API Keys, open the dashboard's <b>Get started → Agents → OpenClaw</b> tab, and copy the installation prompt. Paste it into OpenClaw. The agent adds the memory server to its own configuration, imports your workspace files (<code>SOUL.md</code>, <code>IDENTITY.md</code>, <code>USER.md</code>, <code>MEMORY.md</code>, and the last 30 days of <code>memory/YYYY-MM-DD.md</code>) through the bounded ingest door, and verifies the round trip with <code>whoami</code> and <code>recall_memory</code>. Every accepted batch returns a receipt you can inspect under <b>Requests</b>.</p>
<h2>Route C — manual config (MCP)</h2>
${codeBlock(`openclaw mcp add ${PRODUCT.name.toLowerCase()} --url ${ORIGIN}/mcp/YOUR_MCP_KEY --transport streamable-http`)}
<p>Reload OpenClaw, then confirm the connection by asking it to call the <code>whoami</code> tool. To import existing workspace notes, batch them through <code>POST ${ORIGIN}/v1/ingest</code> — check <code>GET ${ORIGIN}/v1/ingest/limits</code> first (at most 30 messages per request, 4,000 characters per message).</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Plugin loads but nothing is captured</b> — <code>hooks.allowConversationAccess</code> is not set; <code>plugins inspect itsuki --runtime --json</code> names the block in <code>diagnostics</code>.</li>
<li><b>Saves say "queued" rather than "saved"</b> — ${PRODUCT.name} is unreachable or rate-limited; the span is spooled under <code>$OPENCLAW_STATE_DIR/itsuki</code> and delivers automatically.</li>
<li><b>Tools missing after MCP install</b> — reload OpenClaw so its MCP server list refreshes, then re-ask for <code>whoami</code>.</li>
<li><b>401 unauthorized</b> — the key is revoked; create a fresh one under API Keys.</li>
</ul>
` };

PAGES["/install/hermes"] = { title: "Hermes Agent", html: `
<h1>Hermes Agent</h1>
<p class="lede">A native memory provider for Hermes: bounded recall before every real turn, exactly-once capture after each settled one. An MCP route remains for setups that cannot install packages.</p>
<h2>Native provider (recommended)</h2>
<p>Needs <b>Hermes 0.19.0 or newer</b>. One runtime dependency, no postinstall.</p>
${codeBlock(`pip install hermes-itsuki
hermes-itsuki install
hermes memory setup      # choose itsuki, paste your key`)}
<p><code>hermes-itsuki install</code> places the provider in <code>$HERMES_HOME/plugins/itsuki/</code> and makes sure the SDK is importable by Hermes. That location is not incidental: Hermes 0.19.0 has no entry-point discovery, and the official installer's update path prunes anything not in its own lockfile — deploying outside the virtualenv is what makes the provider survive <code>hermes update</code>.</p>
<p>Check it any time with <code>hermes-itsuki doctor</code>, which reports queue depth, breaker state and anything held back — never your key. <code>hermes-itsuki uninstall</code> removes the provider and keeps pending memories; add <code>--purge</code> to delete the local state and config too.</p>
<h3>What it remembers, and what it never does</h3>
<p>Only your message and the assistant's answer. Tool calls, tool results, system prompts and sub-agent work are excluded by construction, not by filtering afterwards. Recalled memories arrive inside <code>&lt;itsuki-recalled-context-v1&gt;</code> markers as untrusted data — never instructions — and the agent gets two read-only tools, <code>itsuki_recall</code> and <code>itsuki_status</code>. There is deliberately no memory-writing tool: automatic capture already stores what you actually saw.</p>
<h3>Honest limits</h3>
<p>Echo suppression is byte-exact within 512 entries or 30 minutes, then fails open. The local spool holds 64 envelopes / 8 MiB / 14 days, and past that the oldest is dropped and counted — durable within documented bounds, not lossless. Rotating your key orphans anything still pending under the old one, on purpose: envelopes are partitioned by credential so a re-keyed install can never deliver one project's conversations into another. Hermes runs delegated subagents with memory off, so their work is not captured.</p>
<h2>MCP route</h2>
<h2>1. Create your link</h2>
<p>In <b>API Keys</b>, create an <b>MCP link</b>. It is shown once — the URL itself is the credential.</p>
<h2>2. Add the MCP server</h2>
<p>In <code>~/.hermes/config.yaml</code>:</p>
${codeBlock(`mcp_servers:
  ${PRODUCT.name.toLowerCase()}:
    url: "${ORIGIN}/mcp/YOUR_MCP_KEY"`)}
<p>Or interactively — Hermes prompts for the URL:</p>
${codeBlock(`hermes mcp add ${PRODUCT.name.toLowerCase()}`)}
<h2>3. Verify</h2>
<p>Restart Hermes and say: <i>use the ${PRODUCT.name.toLowerCase()} whoami tool and tell me what it reports</i>.</p>
<h2>How this sits beside Hermes's own memory</h2>
<p>Hermes keeps its built-in <code>MEMORY.md</code> and <code>USER.md</code> files; external memory runs alongside them, never replacing them. Through this MCP connection Hermes gets all eight ${PRODUCT.name} tools — <code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code>, <code>list_memories</code>, <code>get_memory</code>, <code>delete_memory</code>, <code>delete_all_memories</code>, <code>whoami</code> — so memory persists across sessions, machines, and every other connected tool.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Tools missing</b> — restart Hermes after editing <code>config.yaml</code>, and check the YAML indentation.</li>
<li><b>401 unauthorized</b> — the link is revoked or was an API key; create an MCP link in API Keys. Hermes also supports header auth: url <code>${ORIGIN}/mcp</code> with a <code>headers:</code> mapping carrying <code>Authorization: Bearer</code> and an API key.</li>
</ul>
<div class="note">A native ${PRODUCT.name} memory provider for Hermes's external-provider ecosystem is planned — prefetch before each response, background sync after it. The MCP route above stays supported either way.</div>
` };

PAGES["/install/pi"] = { title: "Pi Agent", html: `
<h1>Pi Agent</h1>
<p class="lede">The <b>native extension</b> joins Pi's own lifecycle: relevant memory is recalled before each turn's first model call, and what you decide is captured after the turn settles — the agent never has to choose to look, or remember to write down. The <b>REST route</b> remains as a fallback.</p>
<h2>Route A — native extension (recommended)</h2>
<p>Published on npm as <code>pi-itsuki</code>, built and signed from this repository's GitHub Actions workflow with npm provenance. Zero runtime dependencies. Needs Node 22.19+, Pi's own floor.</p>
${codeBlock(`pi install npm:pi-itsuki`)}
<p>Create an <b>MCP link</b> under <b>API Keys</b> (shown once), set it as <code>ITSUKI_API_KEY</code> in your environment, and restart pi. The key is read from the environment only — the extension refuses keys placed in config files, and it travels only as an <code>Authorization</code> header.</p>
${codeBlock(`export ITSUKI_API_KEY=YOUR_MCP_KEY`)}
<p>Then, inside pi:</p>
${codeBlock(`/itsuki status`)}
<p><code>/itsuki doctor</code> shows the connection, spool depth, last receipt, and circuit-breaker state — never the key. <code>/itsuki recall &lt;query&gt;</code> does a one-off lookup, and the model itself gets <code>itsuki_recall</code> and <code>itsuki_save</code> tools. There is deliberately no delete tool: nothing in the extension can destroy memory.</p>
<p>Capture is exactly-once: each settled turn is staged to a durable local spool under a content-derived idempotency key before any network call, so retries, crashes, <code>/resume</code> and <code>/fork</code> cannot double-write — and if Itsuki is unreachable, the turn waits on disk and is delivered later. Recalled memory is injected behind an explicit stored-context-not-instructions label. Every message is scrubbed for credentials locally before it leaves your machine.</p>
<p>Deliberately absent, because the backend has no honest contract for them: update/edit of a stored memory, multimodal memory, and automatic consolidation.</p>
<h2>Route B — REST fallback</h2>
<p>Pi has no MCP support, so the fallback uses the shell tool Pi already has. Copy the installation prompt from the dashboard's <b>Get started → Agents → Pi Agent → REST fallback</b> tab and paste it into Pi. The agent verifies the connection (<code>GET /v1/status</code>), saves a first memory (<code>POST /v1/save</code>), and proves recall (<code>POST /v1/recall</code>) — reporting receipts. Then add the standing instructions from the same tab so recall and save happen every session.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b><code>/itsuki status</code> says the key is not configured</b> — <code>ITSUKI_API_KEY</code> is not visible to the pi process. Set it in the profile of the shell that launches pi, then restart pi.</li>
<li><b>Saves say "queued" rather than "saved"</b> — Itsuki is unreachable or rate-limited; the span is spooled and delivers automatically. <code>/itsuki doctor</code> names the reason.</li>
<li><b>Saves succeed but recall is empty</b> — extraction is asynchronous; allow a few seconds, then recall again.</li>
</ul>
` };

PAGES["/integrations/native"] = { title: "Native packages", html: `
<h1>Native packages</h1>
<p class="lede">Five frameworks can reach ${PRODUCT.name} through their own memory interface instead of MCP: install one package, pass it where the framework expects memory, and the agent gets recall and capture without learning a tool.</p>
<p>These need an <b>API key</b> from <b>API Keys</b> — a server credential, not an MCP link. Every package reads <code>ITSUKI_API_KEY</code> from the environment.</p>
<h2 id="native-agno">Agno</h2>
${codeBlock(`pip install agno-itsuki

from agno.agent import Agent
from agno_itsuki import ItsukiTools

agent = Agent(tools=[ItsukiTools(user_id="alex")])`)}
<p>Model-called memory: the agent decides when to search and when to save.</p>
<h2 id="native-llamaindex">LlamaIndex</h2>
${codeBlock(`pip install llama-index-memory-itsuki

from llama_index.memory.itsuki import itsuki_memory

memory = itsuki_memory(user_id="alex", session_id="thread_9")
response = await agent.run("What am I working on?", memory=memory)`)}
<p>A memory <i>block</i>, so it composes with the rest of LlamaIndex's memory rather than replacing it.</p>
<h2 id="native-camel">CAMEL</h2>
${codeBlock(`pip install camel-itsuki

from camel.memories import ChatHistoryMemory
from camel_itsuki import ItsukiStorage

memory = ChatHistoryMemory(
    context_creator,
    storage=ItsukiStorage(user_id="alex", agent_id="researcher"),
)`)}
<p>Agent history persists to ${PRODUCT.name} and to a local mirror, so a run survives a restart.</p>
<h2 id="native-vercel-ai">Vercel AI SDK</h2>
${codeBlock(`npm install ai-sdk-itsuki

import { openai } from "@ai-sdk/openai";
import { generateText } from "ai";
import { withItsuki } from "ai-sdk-itsuki";

const model = withItsuki(openai("gpt-5.2"), { userId: "alex" });

const { text } = await generateText({
  model,
  prompt: "What am I learning at the moment?",
});`)}
<p>A middleware around the model, so recall and capture ride along with every call.</p>
<h2 id="native-mastra">Mastra</h2>
${codeBlock(`npm install mastra-itsuki

import { Agent } from "@mastra/core/agent";
import { createItsuki } from "mastra-itsuki";

const itsuki = createItsuki({ defaultUserId: "alex" });

const agent = new Agent({
  id: "support",
  model: "openai/gpt-5.2",
  instructions: "You help customers.",
  inputProcessors: [itsuki.recall],
  outputProcessors: [itsuki.capture],
  tools: itsuki.tools,
});`)}
<p>Recall on the way in, capture on the way out, plus the tools for when the model should decide.</p>
<h2 id="native-notes">What to expect</h2>
<ul>
<li><b>Writes are asynchronous.</b> A save is accepted immediately and finishes processing in the background, so a recall issued in the same breath may not see it yet.</li>
<li><b>Every write is scoped to one end user.</b> <code>user_id</code> selects an isolated memory space; there is no shared default.</li>
<li><b>Deleting by source is exact.</b> Pass the same <code>source</code> you wrote with, and only those memories go.</li>
</ul>
<div class="note">Every package on this page was published with signed build provenance and exercised against <code>${ORIGIN}</code> from its registry bytes — installed from PyPI or npm, run against production, and cleaned up to zero.</div>
` };

PAGES["/integrations/python"] = { title: "Python frameworks", html: `
<h1>Python frameworks</h1>
<p class="lede">One MCP endpoint, every framework's own client. Each shape below is taken from that framework's current documentation — connect once and your agent gets save, recall, list, get, delete, and whoami as tools.</p>
<p>Every route needs an <b>MCP link</b> from <b>API Keys</b> (shown once). The URL or header carrying it is a credential — treat the file that holds it as a secret.</p>
<h2 id="langchain">LangChain &amp; LangGraph</h2>
${codeBlock(`pip install langchain-mcp-adapters

from langchain_mcp_adapters.client import MultiServerMCPClient

client = MultiServerMCPClient({
    "itsuki": {
        "transport": "http",
        "url": "${ORIGIN}/mcp",
        "headers": {"Authorization": "Bearer YOUR_MCP_KEY"},
    }
})
tools = await client.get_tools()  # hand these to your LangGraph agent`)}
<h2 id="crewai">CrewAI</h2>
<p>The MCP support lives in an extra — install <code>crewai-tools[mcp]</code>, not plain <code>crewai-tools</code>, or <code>MCPServerAdapter</code> will not be exported.</p>
${codeBlock(`pip install "crewai-tools[mcp]"

from crewai_tools import MCPServerAdapter

server_params = {
    "url": "${ORIGIN}/mcp",
    "transport": "streamable-http",
    "headers": {"Authorization": "Bearer YOUR_MCP_KEY"},
}

with MCPServerAdapter(server_params) as tools:
    agent = Agent(tools=tools, role="...", goal="...")`)}
<h2 id="autogen">AutoGen</h2>
${codeBlock(`pip install autogen-ext

from autogen_ext.tools.mcp import StreamableHttpServerParams, mcp_server_tools

params = StreamableHttpServerParams(
    url="${ORIGIN}/mcp",
    headers={"Authorization": "Bearer YOUR_MCP_KEY"},
)
tools = await mcp_server_tools(params)`)}
<h2 id="agno">Agno</h2>
${codeBlock(`pip install agno

from agno.tools.mcp import MCPTools, StreamableHTTPClientParams

params = StreamableHTTPClientParams(
    url="${ORIGIN}/mcp",
    headers={"Authorization": "Bearer YOUR_MCP_KEY"},
)
async with MCPTools(transport="streamable-http", server_params=params) as mcp:
    agent = Agent(tools=[mcp])`)}
<h2 id="openai-agents">OpenAI Agents SDK</h2>
${codeBlock(`pip install openai-agents

from agents.mcp import MCPServerStreamableHttp

async with MCPServerStreamableHttp(
    name="itsuki",
    params={
        "url": "${ORIGIN}/mcp",
        "headers": {"Authorization": "Bearer YOUR_MCP_KEY"},
    },
    cache_tools_list=True,
) as server:
    agent = Agent(name="Assistant", mcp_servers=[server])`)}
<h2 id="google-adk">Google ADK</h2>
<p>A native <code>BaseMemoryService</code> plus the automatic capture ADK does not ship. Needs <code>google-adk</code> 2.5–2.7.</p>
${codeBlock(`pip install adk-itsuki

from google.adk.agents import LlmAgent
from google.adk.apps.app import App
from google.adk.runners import Runner
from google.adk.sessions import InMemorySessionService
from google.adk.tools import preload_memory
from adk_itsuki import ItsukiMemoryService, ItsukiMemoryPlugin

memory = ItsukiMemoryService()          # reads ITSUKI_API_KEY
agent = LlmAgent(name="assistant", model="gemini-2.0-flash", tools=[preload_memory])

app = App(name="my_app", root_agent=agent, plugins=[ItsukiMemoryPlugin(service=memory)])
runner = Runner(app=app, app_name="my_app",
                session_service=InMemorySessionService(), memory_service=memory)`)}
<p><code>preload_memory</code> recalls before every model call; the plugin captures each settled turn. ADK itself never calls <code>add_session_to_memory</code> — that gap is exactly what the plugin fills. Only your message and the <i>root</i> agent's final answer are stored: tool traffic and sub-agent output are excluded, and an invocation that errored, streamed only partials, or is still waiting on a long-running tool is not captured at all.</p>
<p>Registering the URI scheme (<code>import adk_itsuki; adk_itsuki.register()</code> in a <code>services.py</code>) lets <code>adk web --memory_service_uri=itsuki://</code> construct the service, but it cannot attach the tool or the plugin — treat that route as a partial install. Pending captures live in memory, so recovery after a restart is an explicit <code>add_session_to_memory(session)</code>, which regenerates identical idempotency keys and therefore duplicates nothing.</p>
<h3>MCP route</h3>
${codeBlock(`pip install google-adk

from google.adk.tools.mcp_tool import McpToolset
from google.adk.tools.mcp_tool.mcp_session_manager import StreamableHTTPConnectionParams

toolset = McpToolset(
    connection_params=StreamableHTTPConnectionParams(
        url="${ORIGIN}/mcp",
        headers={"Authorization": "Bearer YOUR_MCP_KEY"},
    )
)`)}
<h2 id="llamaindex">LlamaIndex</h2>
<p>LlamaIndex's MCP client documents OAuth but <b>no custom headers</b> — a header-only memory service cannot connect there at all. ${PRODUCT.name}'s path-token door carries the credential in the URL itself, so <code>BasicMCPClient</code> works as-is:</p>
${codeBlock(`pip install llama-index-tools-mcp

from llama_index.tools.mcp import BasicMCPClient, McpToolSpec

client = BasicMCPClient("${ORIGIN}/mcp/YOUR_MCP_KEY")
tools = McpToolSpec(client=client)`)}
<h2>Verify any of them</h2>
<p>Run the agent and ask it to <i>"save that I prefer concise answers, then recall what you know about me"</i>. A working connection reports a receipt for the save and returns the fact on recall. The <code>whoami</code> tool reports identity and health at any time.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Tools don't appear</b> — confirm the URL is exactly <code>${ORIGIN}/mcp</code> (header route) and the header reads <code>Authorization: Bearer &lt;key&gt;</code>.</li>
<li><b>401</b> — the key is revoked or pasted with whitespace. Create a fresh MCP link.</li>
<li><b>Saves report queued, recall is empty</b> — extraction is asynchronous; allow a few seconds.</li>
<li><b>Import errors mentioning <code>mcp.shared</code>, <code>RequestContext</code>, or "not enough values to unpack"</b> — several framework adapters still target the <code>mcp 1.x</code> Python API and break against <code>mcp 2.x</code>. This is an upstream clash that affects every MCP server, not just ${PRODUCT.name}. AutoGen and Agno both need <code>pip install "mcp&lt;2"</code>; LlamaIndex additionally needs <code>pip install "llama-index-tools-mcp==0.4.0"</code>. These are the exact versions each route above was verified against.</li>
</ul>
<div class="note">Every route on this page was executed end to end against <code>${ORIGIN}</code> — tools listed and called with a real key — not transcribed from a vendor's README.</div>
` };

PAGES["/integrations/typescript"] = { title: "TypeScript frameworks", html: `
<h1>TypeScript frameworks</h1>
<p class="lede">The same MCP endpoint, TypeScript clients. Create an <b>MCP link</b> in <b>API Keys</b> first — it is shown once.</p>
<h2 id="mastra">Mastra</h2>
${codeBlock(`npm install @mastra/mcp

import { MCPClient } from "@mastra/mcp";

const mcp = new MCPClient({
  servers: {
    itsuki: {
      url: new URL("${ORIGIN}/mcp"),
      requestInit: { headers: { Authorization: "Bearer YOUR_MCP_KEY" } },
    },
  },
});
const tools = await mcp.listTools();`)}
<h2 id="vercel-ai">Vercel AI SDK</h2>
${codeBlock(`npm install @ai-sdk/mcp

import { createMCPClient } from "@ai-sdk/mcp";

const mcpClient = await createMCPClient({
  transport: {
    type: "http",
    url: "${ORIGIN}/mcp",

  },
});
const tools = await mcpClient.tools(); // pass to generateText / streamText`)}
<h2>Verify</h2>
<p>Ask the agent to save a fact and recall it back; the save must report a receipt. Building your own loop instead? The <a href="#/sdk/js">JavaScript SDK</a> talks to the same memory without MCP.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Connection refused in the browser</b> — connect from your server side; the credential must not ship to clients.</li>
<li><b>401</b> — revoked or malformed key; mint a fresh MCP link.</li>
</ul>
` };

PAGES["/integrations/n8n"] = { title: "n8n", html: `
<h1>n8n</h1>
<p class="lede">Three routes. The <b>native Itsuki node</b> is a real installable package with typed operations and a credential — self-hosted n8n only. The <b>HTTP Request node</b> and <b>MCP Client Tool</b> are built into n8n, need no install, and work on n8n Cloud too.</p>
<h2 id="native">Route A — native Itsuki node (self-hosted)</h2>
<p>Published on npm as <code>n8n-nodes-itsuki</code>, built and signed from this repository's GitHub Actions workflow with npm provenance. Install it in n8n under <b>Settings → Community Nodes → Install</b>; only instance owners can install community nodes, and n8n Cloud carries only nodes n8n has verified, so Cloud users should use Route B or C below.</p>
${codeBlock(`n8n-nodes-itsuki`)}
<p>Then create an <b>Itsuki API</b> credential (API key from <b>API Keys</b> in the dashboard, base URL <code>${ORIGIN}</code>) and press <b>Test</b> — it verifies the connection against an endpoint that returns counts only, never memory content. The key travels as a header and is never written into workflow exports.</p>
<p>The node exposes nine operations:</p>
<ul>
<li><b>Save Memory</b> and <b>Save Conversation</b> — store a durable fact, or a batch of chat messages for extraction. Both <b>wait for completion by default</b>, so the next node sees settled state; if the wait times out the output says the save was accepted and is still processing, which is not a failure.</li>
<li><b>Recall Memory</b> — prompt-ready context plus structured items. Zero results is a result, not an error.</li>
<li><b>List Memories</b> — one page, or Return All with a hard item cap and pagination-loop detection.</li>
<li><b>Get Memory</b> · <b>Delete Memory</b> — by prefixed ID. A missing ID is reported as an error, never as a silent success.</li>
<li><b>Delete All Memories</b> — <b>previews by default</b>; it reports what would be removed and changes nothing until you tick Confirm Destruction.</li>
<li><b>Who Am I</b> — identity, project scope, connection health and plan usage.</li>
<li><b>Wait for Packet</b> — poll a save receipt to a terminal state on its own.</li>
</ul>
<p>The node is usable as an AI Agent tool. On self-hosted n8n that additionally requires <code>N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true</code>. Recall and the save operations are the sensible tools to expose; destructive operations are deliberately unattractive as tools, since Delete All previews unless a human enables confirmation.</p>
<p>There is no Update operation. ${PRODUCT.name} has no safe versioned-correction contract yet, and this node does not pretend otherwise — correct a memory by deleting it and saving the corrected fact.</p>
<h2 id="http">Route B — HTTP Request node (any workflow, incl. Cloud)</h2>
<p>The deterministic route: "form submitted → save to memory", "nightly digest → recall". Create an <b>MCP link</b> in <b>API Keys</b> (it doubles as a REST Bearer credential).</p>
${codeBlock(`Node: HTTP Request
Method: POST
URL: ${ORIGIN}/v1/save
Authentication: Generic Credential Type -> Header Auth
  Name: authorization    Value: Bearer YOUR_MCP_KEY
Body (JSON): { "content": "{{ $json.textToRemember }}" }`)}
<p>Recall is the same node against <code>${ORIGIN}/v1/recall</code> with <code>{ "query": "..." }</code> — the response's <code>context</code> field is prompt-ready. Saves return a <b>receipt</b>; extraction finishes asynchronously.</p>
<h2 id="mcp">Route C — MCP Client Tool (AI Agent workflows, incl. Cloud)</h2>
${codeBlock(`Node: MCP Client Tool  (attach to an AI Agent node)
Endpoint: ${ORIGIN}/mcp
Server Transport: HTTP Streamable
Authentication: Bearer -> YOUR_MCP_KEY`)}
<p>The agent then decides when to call <code>save_memory</code> / <code>recall_memory</code> / <code>list_memories</code> itself.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>429 with retry-after</b> — the workflow is bursting past a rate bucket; add a Wait node honouring the header. Bulk imports belong on <code>POST /v1/ingest</code> (300/min).</li>
<li><b>Credential test fails</b> — the header name must be exactly <code>authorization</code> and the value must start with <code>Bearer </code>.</li>
</ul>
` };

PAGES["/integrations/dify"] = { title: "Dify", html: `
<h1>Dify</h1>
<p class="lede">Dify consumes remote MCP servers natively — no plugin, no marketplace, no review. Two minutes in the Tools screen.</p>
<h2>Connect</h2>
<p>Create an <b>MCP link</b> in <b>API Keys</b>, then in Dify:</p>
${codeBlock(`Dify -> Tools -> MCP -> Add server (HTTP transport)
Server URL: ${ORIGIN}/mcp
Headers: authorization = Bearer YOUR_MCP_KEY`)}
<p>Dify connects and imports the tools (save, recall, list, get, delete, whoami). Enable them for your app under its Agent settings; only HTTP-transport MCP servers are supported, which is exactly what ${PRODUCT.name} serves.</p>
<h2>Verify</h2>
<p>Chat with the app: <i>"remember that I prefer morning meetings, then recall what you know about me"</i>. The save must report a receipt.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Authorization errors on connect</b> — Dify's Dynamic Client Registration expects OAuth by default; use the custom-header route above instead.</li>
<li><b>Tools imported but never called</b> — enable them for the specific app, and give the agent instructions to recall at conversation start.</li>
</ul>
` };

PAGES["/integrations/convex"] = { title: "Convex", html: `
<h1>Convex</h1>
<p class="lede">Not an MCP integration — the published <code>itsuki</code> npm SDK running inside your Convex backend. Memory becomes two Convex actions any client or function can call.</p>
<h2>1. Install</h2>
${codeBlock(`npm install itsuki convex`)}
<h2>2. Create an API key</h2>
<p>In <b>API Keys</b>, create an <b>API key</b> and set it in your Convex deployment environment as <code>ITSUKI_API_KEY</code>. Server-side only — never in client code.</p>
<h2>3. Write the memory actions</h2>
${codeBlock(`// convex/memory.ts
import { MemoryClient } from "itsuki";
import { action } from "./_generated/server";
import { v } from "convex/values";

const memory = new MemoryClient({ apiKey: process.env.ITSUKI_API_KEY! });

export const remember = action({
  args: { content: v.string(), userId: v.string() },
  handler: async (_ctx, args) => memory.add(args.content, { userId: args.userId }),
});

export const recall = action({
  args: { query: v.string(), userId: v.string() },
  handler: async (_ctx, args) => memory.search(args.query, { userId: args.userId }),
});`)}
<p><code>userId</code> scopes each end user to an isolated memory space under your one key — the same sub-tenant model as the <a href="#/sdk/js">JavaScript SDK</a>, because it IS the JavaScript SDK.</p>
<h2>Verify</h2>
${codeBlock(`npx convex run memory:remember '{ "content": "Prefers dark mode", "userId": "user_1" }'
npx convex run memory:recall '{ "query": "preferences", "userId": "user_1" }'`)}
<p>The first call returns a receipt; the second returns the fact in <code>context</code> after extraction settles.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Missing API key</b> — set <code>ITSUKI_API_KEY</code> with <code>npx convex env set</code>, then redeploy.</li>
<li><b>Recall empty right after save</b> — extraction is asynchronous; allow a few seconds.</li>
</ul>
` };

PAGES["/api/rest"] = { title: "REST API reference", html: `
<h1>REST API reference</h1>
<p class="lede">Base URL: <code>${ORIGIN}</code> · JSON in, JSON out · Bearer auth.</p>
<h2>The two calls that matter</h2>
<h3>POST /v1/save — write memory</h3>
${codeBlock(`POST /v1/save
{ "content": "I started learning Kotlin this week." }

// or conversation mode:
{ "mode": "conversation",
  "conversationId": "chat-42",
  "messages": [
    { "role": "user", "content": "We decided on Postgres for the new service." },
    { "role": "assistant", "content": "Noted — Postgres it is." }
  ] }`)}
<p>Returns a <b>receipt</b>: <code>summary</code>, counts of what was written/updated/skipped, and a <code>receipt_id</code>. Extraction is asynchronous — allow a few seconds before recalling brand-new facts.</p>
<h3>POST /v1/recall — read memory</h3>
${codeBlock(`POST /v1/recall
{ "query": "what am I learning?" }

// one coding project plus account-global memory:
{ "query": "how does this project deploy?",
  "memoryScope": { "projectId": "atlas", "projectName": "Atlas" },
  "recallScope": "project_then_global" }

// response (abridged)
{ "count": 2,
  "context": "Kotlin (skill, state: active) - started learning this week…",
  "items": [ { "type": "node", "label": "Kotlin", "score": 7.9 } ] }`)}
<p><code>context</code> is the compact text block a connected AI receives. Empty string + <code>count: 0</code> means nothing relevant is stored.</p>
<h2>Everything else</h2>
<table>
<tr><th>Endpoint</th><th>What it does</th></tr>
<tr><td><code>POST /v1/turn</code></td><td>Recall + auto-capture in one call — send the latest chat messages, get context back while durable facts are collected. Needs write scope.</td></tr>
<tr><td><code>POST /v1/ingest</code></td><td>Bounded message ingestion with optional <code>flush: true</code> to force digestion.</td></tr>
<tr><td><code>GET /v1/ingest/limits</code></td><td>Authoritative machine-readable limits, character unit, request encoding, and ordered-delivery schema.</td></tr>
<tr><td><code>GET /v1/graph</code></td><td>The full laid-out memory graph (nodes, details, events, edges, clusters).</td></tr>
<tr><td><code>GET /v1/status</code></td><td>Counts: memories, conversation pages, details, events, pending suggestions.</td></tr>
<tr><td><code>GET /v1/memories</code></td><td>Read-only inventory, newest first: <code>kind</code> (all | node | page), <code>limit</code> (1–200), keyset <code>cursor</code>, <code>q</code> substring filter.</td></tr>
<tr><td><code>GET /v1/memories/&lt;id&gt;</code></td><td>One object by id — a memory with its history and events, a page with its markdown. Serves the object's <code>revision</code> and a revision ETag (<code>"r3"</code>; may surface as <code>W/"r3"</code> through content encoding — <code>If-Match</code> accepts both) for safe updates.</td></tr>
<tr><td><code>PATCH /v1/memories/&lt;id&gt;</code></td><td>Deterministic correction of editable fields (node label/category/summary · page title/short_summary/full_markdown · detail text/kind · event text/importance/happened_at). Requires <code>If-Match: "r&lt;revision&gt;"</code> or body <code>expectedRevision</code> plus an <code>idempotencyKey</code>; missing precondition → 428, stale → 412 with <code>current_revision</code>, wildcard refused. Previous content is retained as an immutable revision.</td></tr>
<tr><td><code>GET /v1/memories/&lt;id&gt;/history</code></td><td>Keyset-paginated revision history (baselines, captured automatic changes, edits, rollbacks) with snapshots and projection convergence state. Page size is bounded (max 50); stored history is <em>not</em> pruned — every revision is retained until the object is deleted, purged, retention-expired, or the account is erased, so anything offered as rollbackable stays rollbackable. <code>total_revisions</code> reports the retained count.</td></tr>
<tr><td><code>POST /v1/memories/&lt;id&gt;/rollback</code></td><td>Restore an earlier revision's content as a NEW forward revision (<code>toRevision</code> + current <code>expectedRevision</code> + <code>idempotencyKey</code>). History is never rewound; erased revisions cannot be restored.</td></tr>
<tr><td><code>GET /v1/usage?range=30d</code></td><td>Activity rollups: saves/recalls per day, by source, totals. Ranges 1d/7d/30d/all.</td></tr>
<tr><td><code>GET /v1/receipts?limit=50</code></td><td>Latest save/recall receipts.</td></tr>
<tr><td><code>GET /v1/export</code></td><td>Complete JSON export of the memory space resolved by the current credential and request. It does not aggregate sibling SDK sub-tenant spaces in the project.</td></tr>
<tr><td><code>GET/PUT /v1/rules</code></td><td>Read or update the project's memory-extraction inclusion and exclusion policy.</td></tr>
</table>
<h2>Conversation-ingest boundaries</h2>
<table>
<tr><th>Boundary</th><th>Current limit</th></tr>
<tr><td>Messages in one <code>POST /v1/ingest</code></td><td>30</td></tr>
<tr><td>One message's <code>content</code></td><td>4,000 Unicode code points</td></tr>
<tr><td>Combined message content</td><td>120,000 Unicode code points</td></tr>
<tr><td>Complete serialized request</td><td>512 KiB of actual UTF-8 JSON</td></tr>
</table>
<p>Those four wire limits are exactly what <a href="/v1/ingest/limits"><code>GET /v1/ingest/limits</code></a> returns. The engine also enforces these separate downstream safeguards:</p>
<table>
<tr><th>Internal boundary</th><th>Limit</th></tr>
<tr><td>One downstream extraction queue entry</td><td>20 messages and 12,000 Unicode code points</td></tr>
<tr><td>Complete serialized chat-model input</td><td>At most 24,576 UTF-8 bytes</td></tr>
</table>
<p>The configured model context windows are 32,768 tokens for Qwen3 extraction, 32,000 for Llama 3.1 summary/digest, and 60,000 for Llama 3.2 playground chat. After output/template reserves and the global byte ceiling, their maximum serialized inputs are 24,576, 23,808, and 24,576 bytes respectively; unknown model overrides use the conservative 32,000-token profile.</p>
<p>Fetch the limits endpoint instead of copying wire constants into a client. A body over the byte limit receives a machine-readable <code>413</code>; count, character, or delivery-metadata violations receive a machine-readable <code>422</code>. Retry an unchanged request with the same <code>idempotencyKey</code>; reusing that key for different content is a <code>409</code>.</p>
<h2>Useful request fields</h2>
<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>idempotencyKey</code></td><td>Safe retries: the same key is processed at most once.</td></tr>
<tr><td><code>delivery</code></td><td>Ordered-batch metadata: schema, stable group ID, batch index/count, source/segment counts, and explicit capture-omission state.</td></tr>
<tr><td><code>conversationId</code>, <code>threadId</code>, <code>sourceId</code></td><td>Provenance tracking; also used for de-duplication of re-sent chats.</td></tr>
<tr><td><code>userId</code></td><td><b>Sub-tenant selector.</b> Omit it to use the key owner's own memory. Pass any string to read/write a separate memory space derived from it — useful when your app serves multiple end users under one key.</td></tr>
<tr><td><code>memoryScope.projectId</code>, <code>projectName</code></td><td><b>Project metadata, not tenancy.</b> Project memories remain in the authenticated account graph with explicit provenance. Omit <code>projectId</code> for account-global writes.</td></tr>
<tr><td><code>recallScope</code></td><td><code>global</code> (default) searches the whole account; <code>project_only</code> searches exactly <code>memoryScope.projectId</code>; <code>project_then_global</code> searches that project plus rows without a project. Project modes never include another project.</td></tr>
</table>
<h2>Rate limits</h2>
<p>Writes (<code>/v1/save</code>, <code>/v1/turn</code>, <code>/v1/ingest</code>): 60/minute per user — a <code>429</code> includes a friendly message; honor <code>Retry-After</code> style backoff. Reads are not currently rate limited.</p>
<h2>Errors</h2>
<p>Errors are JSON: <code>{ "error": "code_or_message" }</code> with conventional status codes (400 invalid body, 401 unauthenticated, 403 wrong scope, 429 slow down, 5xx our fault — automatically reported on our side).</p>
` };

PAGES["/api/auth"] = { title: "Authentication & keys", html: `
<h1>Authentication &amp; keys</h1>
<p class="lede">Two kinds of key, one rule: secrets are shown once.</p>
<h2>API keys (Bearer)</h2>
${codeBlock(`authorization: Bearer ${PRODUCT.tokenPrefix}XXXXXXXX`)}
<p>Create in <b>API Keys → Create API key</b>. Use for the REST API and SDKs. Also accepted via the <code>x-uml-token</code> header (legacy name kept for compatibility).</p>
<h2>MCP links</h2>
<p><code>${ORIGIN}/mcp/&lt;key&gt;</code> — the key rides in the URL because that's what chat clients can carry. An MCP link IS a secret; treat it like a password.</p>
<h2>Scopes</h2>
<table>
<tr><th>Scope</th><th>Grants</th></tr>
<tr><td><code>memory:read</code></td><td>recall, graph, status, usage, receipts, export, read rules</td></tr>
<tr><td><code>memory:write</code></td><td>save, turn, ingest, write rules — implies read</td></tr>
</table>
<p>Default keys carry both. Create a read-only key by passing <code>"scopes": ["memory:read"]</code> when creating the token.</p>
<h2>Lifecycle</h2>
<ul>
<li><b>Shown once</b> — only a hash is stored server-side. Lose it → rotate.</li>
<li><b>Rotate</b> — revokes the old key and mints a fresh one with the same name.</li>
<li><b>Revoke</b> — immediate; revoked keys stay listed for audit and can never be used again.</li>
<li>Keys minted before the Itsuki rename (<code>uml_live_…</code>) keep working forever.</li>
</ul>
` };

PAGES["/api/mcp"] = { title: "MCP tools", html: `
<h1>MCP tools</h1>
<p class="lede">Server: <code>itsuki-memory</code> · Transport: Streamable HTTP · URL: <code>${ORIGIN}/mcp/&lt;key&gt;</code></p>
<h2>Write &amp; recall</h2>
<h3>save_memory</h3>
<p>Saves exactly one explicitly submitted durable fact. Input: <code>content</code> (required, the user's words), optional <code>recentContext</code> for resolving references like "it". Returns a final receipt — <i>Saved: 1 memory (Kotlin)…</i> — only after the write completes.</p>
<h3>save_conversation</h3>
<p>Captures several chat turns at once. Input: <code>messages[]</code> (oldest first), optional <code>scope</code> (<code>full</code> | <code>lastN</code> | <code>topic</code> | <code>summary</code>) and <code>contentScope.subject</code> for strict subject filtering. Attribution rules require user adoption or supported request/outcome evidence; unsupported assistant prose is not treated as a user fact. A stable <code>conversationId</code> converges re-sends of the same conversation onto one Conversation page, advanced as a forward revision; without it each explicit save makes its own page.</p>
<h3>recall_memory</h3>
<p>Input: <code>query</code>, optional <code>memoryScope</code> project metadata, and optional <code>recallScope</code> (<code>global</code> | <code>project_only</code> | <code>project_then_global</code>). The tool's text result IS the recalled context — the model can use it directly. Structured details ride along for clients that read them.</p>
<h2>Management</h2>
<p>The half a client needs to inspect and clean up its own memory without opening the dashboard. All of it is read-only except the two delete tools, which are guarded.</p>
<h3>list_memories</h3>
<p>Browse stored memories newest-first. Input: optional <code>kind</code> (<code>all</code> | <code>node</code> | <code>page</code>), <code>limit</code> (1–200), <code>cursor</code> for the next page, and <code>q</code> substring filter. Returns ids that <code>get_memory</code> and <code>delete_memory</code> accept. For meaning-based lookup use <code>recall_memory</code>.</p>
<h3>get_memory</h3>
<p>Fetch one object by id (<code>node_…</code>, <code>page_…</code>, <code>slice_…</code>, or a candidate id) with its current text, bounded history, and dated events.</p>
<h3>delete_memory</h3>
<p>Permanently delete one object by id. Same effect as <code>DELETE /v1/memories/:id</code>, including the deletion tombstone. In managed projects this needs the distinct delete permission, not just write.</p>
<h3>delete_all_memories</h3>
<p>Safe by default: without <code>confirm: true</code> it only previews what would be deleted (counts and sample labels). Only an explicit <code>confirm: true</code> destroys, matching the REST bulk-delete contract.</p>
<h3>whoami</h3>
<p>Reports the connection's identity and health: memory space, scopes, bound project, whether deletion is allowed, and live counts. The verify step of every install guide is "ask for <code>whoami</code>".</p>
<h2>Safe updates</h2>
<p>Deterministic correction with immutable history. These tools are advertised only when the connection's effective scopes permit them — a read-only key never sees the write tools.</p>
<h3>update_memory</h3>
<p>Correct one memory's editable fields. Input: <code>id</code>, <code>fields</code> (node: label/category/summary · page: title/short_summary/full_markdown · detail: text/kind · event: text/importance/happened_at), required <code>expectedRevision</code> (the revision you read) and <code>idempotencyKey</code>, optional <code>reason</code>. A stale revision is refused with the fresh revision — never overwritten. The previous content is retained as history.</p>
<h3>memory_history</h3>
<p>One memory's revision history, newest first: baselines, captured automatic changes, edits, and rollbacks, each with its snapshot, actor class, optional reason, and content hash. Paginated by <code>cursor</code>, max 50 per page. Stored history is retained (never auto-pruned) until the object is deleted, purged, retention-expired, or the account is erased.</p>
<h3>rollback_memory</h3>
<p>Restore the content of an earlier revision as a <em>new forward revision</em>. Input: <code>id</code>, <code>toRevision</code>, current <code>expectedRevision</code>, <code>idempotencyKey</code>. History is never rewound or deleted; a revision removed by deletion or retention cannot be restored.</p>
<h2>Design guarantees</h2>
<ul>
<li>Itsuki's write responses distinguish locally queued work, server acceptance, and a backend receipt; asynchronous enrichment has separate packet status.</li>
<li>The host model decides <i>when</i> to call tools — if you need guaranteed per-turn invocation, call <code>POST /v1/turn</code> from your own code and inspect its collect receipt and packet status.</li>
</ul>
` };
