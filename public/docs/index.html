PAGES["/api/ingest"] = { title: "POST /v1/ingest", html: `
<h1>POST /v1/ingest</h1>
<p class="lede">Hand a batch of conversation messages to ${PRODUCT.name} and let it decide what is worth keeping — the bulk import door, with published bounds and ordered-delivery metadata.</p>

<table>
<tr><th>Method</th><td><code>POST</code></td></tr>
<tr><th>Path</th><td><code>${ORIGIN}/v1/ingest</code></td></tr>
<tr><th>Auth</th><td>API key or MCP link as <code>Authorization: Bearer</code>, or a signed-in session</td></tr>
<tr><th>Scope</th><td><code>memory:write</code></td></tr>
<tr><th>Rate bucket</th><td><code>import</code> — 300 requests per 60 seconds, the roomiest bucket on the API</td></tr>
<tr><th>Max body</th><td>524,288 bytes of serialized UTF-8 JSON</td></tr>
<tr><th>Timing</th><td>Deferred. Extraction runs after the response; the body reports acceptance, not results.</td></tr>
<tr><th>Atomicity</th><td>All or nothing. One bad message refuses the whole batch, and nothing is written.</td></tr>
</table>

<p>Use this endpoint when you already have transcript in hand — a session that just ended, a file of chat logs, a backfill. Use <a href="#/api/save">POST /v1/save</a> when you have one fact, or one small exchange you want a synchronous answer about.</p>

<h2>Request</h2>
${codeBlock(`curl -X POST ${ORIGIN}/v1/ingest \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{
    "conversationId": "chat-42",
    "source": "support-desk",
    "messages": [
      { "role": "user", "content": "We are moving the reporting service to Postgres." },
      { "role": "assistant", "content": "Noted - Postgres for reporting." },
      { "role": "user", "content": "Cutover is the week of the 14th." }
    ]
  }'`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>messages</code></td><td>array</td><td>Yes</td><td>Oldest first. An empty array is accepted; a missing or non-array value is a <code>400</code>. See the contract below.</td></tr>
<tr><td><code>flush</code></td><td>boolean</td><td>No</td><td>Default <code>false</code>. Forces extraction now instead of letting the learning trigger accumulate more context first. Coerced with <code>Boolean()</code>, so any truthy value counts.</td></tr>
<tr><td><code>delivery</code></td><td>object</td><td>No</td><td>Ordered-batch metadata for a conversation split across several requests. Validated as a whole object — see below.</td></tr>
<tr><td><code>conversationId</code></td><td>string</td><td>No</td><td>Groups the batch. Re-sends with the same value converge onto one conversation page instead of making a new one each time. Also feeds the default idempotency key.</td></tr>
<tr><td><code>threadId</code>, <code>sourceId</code></td><td>string</td><td>No</td><td>Your own provenance identifiers. <code>sourceId</code>, when present, becomes part of the default idempotency key.</td></tr>
<tr><td><code>idempotencyKey</code></td><td>string</td><td>No</td><td>Safe retries. Derived from the batch when you omit it.</td></tr>
<tr><td><code>source</code></td><td>string</td><td>No</td><td>Your own label, 1–64 characters, no control characters. This is the value <code>DELETE /v1/memories?source=…</code> filters on. <code>null</code> is allowed and means no label.</td></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>Writes into an isolated memory space for one of your end users. See <a href="#/api/auth">Authentication &amp; keys</a>.</td></tr>
<tr><td><code>memoryScope</code></td><td>object</td><td>No</td><td><code>projectId</code> (at most 160 characters, no control characters, no surrounding whitespace) and <code>projectName</code> for provenance. Omit <code>projectId</code> for account-global writes.</td></tr>
<tr><td><code>sourceScope</code></td><td>object</td><td>No</td><td>Read as a fallback source for the same object when <code>memoryScope</code> is absent.</td></tr>
<tr><td><code>captureDensity</code></td><td>string</td><td>No</td><td>Exactly <code>"dense"</code> or <code>"standard"</code>. Any other value is ignored without an error.</td></tr>
<tr><td><code>rules</code></td><td>object</td><td>No</td><td>Per-request admission-rule override, layered account &lt; key &lt; request. On an organization-managed project the layering narrows only: a request can make policy stricter, never broader. See <a href="#/guides/rules">Memory rules</a>.</td></tr>
<tr><td><code>sourceTime</code></td><td>string or number</td><td>No</td><td>The time the content was written, as opposed to when you sent it. Accepted at the batch level and per message. Only honoured on accounts where the timestamp contract is enabled; otherwise it is refused by name with <code>400 source_time_not_enabled</code> rather than quietly becoming &ldquo;now&rdquo;.</td></tr>
</table>

<div class="note"><b>An unknown field is refused, never ignored.</b> A misspelled key returns <code>400 unknown_parameter</code> naming it and suggesting the nearest accepted field; if nothing is close, the message lists every field this endpoint accepts. Common alternate spellings such as <code>user_id</code> and <code>conversation_id</code> are accepted as aliases — but sending both an alias and its canonical name is <code>400 conflicting_parameters</code>, because the two could disagree. Note this check is top-level only: keys inside <code>memoryScope</code>, <code>delivery</code> and <code>messages[]</code> are validated by their own rules.</div>

<h3>The messages[] contract</h3>
<p>Each element is either a bare string — legacy shorthand, treated as a <code>user</code> message — or an object with these fields.</p>
<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>content</code></td><td>string</td><td>Yes</td><td>Must be a string. A number, <code>null</code> or a missing value is <code>422 invalid_ingest_message</code> naming <code>messages[i].content</code>.</td></tr>
<tr><td><code>role</code></td><td>string</td><td>No</td><td>Default <code>"user"</code>. One of <code>user</code>, <code>assistant</code>, <code>system</code>, <code>tool</code>, compared case-insensitively. Anything else is a <code>422</code>.</td></tr>
<tr><td><code>id</code></td><td>string</td><td>No</td><td>Your own message id. Non-empty after trimming, at most 200 Unicode code points, and unique within the batch. A repeat is <code>422</code> with <code>actual: "duplicate"</code>.</td></tr>
<tr><td><code>sourceTime</code></td><td>string or number</td><td>No</td><td>Per-message write time, overriding the batch-level value. Same gate and same parse rules.</td></tr>
</table>
<p>An element that is neither a string nor an object — <code>null</code>, an array, a number — is <code>422 invalid_ingest_message</code> with the message <i>&ldquo;messages[3] must be a string or a message object.&rdquo;</i> Every contract error names the offending index in both <code>field</code> and <code>messageIndex</code>, so you do not have to guess which message broke the batch.</p>

<div class="note"><b>Two identical messages without ids collide, and the collision is refused at the door.</b> A message you do not give an <code>id</code> is assigned a stable one derived from its role and normalized text. So two messages in one batch with the same role and the same trimmed content — a duplicated line in a log file, say — produce the same identity, and you get <code>422 invalid_ingest_message</code> with <code>actual: "duplicate_generated_id"</code>. This is deliberate: refusing it up front keeps the request atomic instead of accepting the batch and failing later with work already held. Give the messages explicit <code>id</code> values if they really are distinct.</div>

<h2>Size bounds</h2>
<table>
<tr><th>Bound</th><th>Value</th><th>Violation</th></tr>
<tr><td>Messages per request</td><td>30</td><td><code>422 ingest_message_count_exceeded</code></td></tr>
<tr><td>Characters in one message</td><td>4,000</td><td><code>422 ingest_message_characters_exceeded</code></td></tr>
<tr><td>Characters across the batch</td><td>120,000</td><td><code>422 ingest_total_characters_exceeded</code></td></tr>
<tr><td>Serialized request body</td><td>524,288 bytes</td><td><code>413 ingest_request_too_large</code></td></tr>
<tr><td>Characters in a message <code>id</code></td><td>200</td><td><code>422 invalid_ingest_message</code></td></tr>
<tr><td>Batches in one delivery group</td><td>128</td><td><code>422 invalid_ingest_delivery_metadata</code></td></tr>
</table>

<p>Characters are counted as <b>Unicode code points, not UTF-16 units</b>. An emoji counts as one character here; in JavaScript, <code>"emoji".length</code> would report two. If you split batches using a naive string length you will send batches the server considers smaller than you did, which is safe, but your own capacity planning will be wrong.</p>

<p>Every contract refusal has the same shape, so a queueing client can decide what to do without parsing prose.</p>
${outputBlock(`{
  "error": "ingest_message_characters_exceeded",
  "code": "ingest_message_characters_exceeded",
  "message": "messages[3].content exceeds 4000 Unicode characters.",
  "limit": 4000,
  "actual": 6120,
  "retryable": false,
  "limits": {
    "maxMessages": 30,
    "maxMessageCharacters": 4000,
    "maxTotalCharacters": 120000,
    "maxRequestBytes": 524288
  },
  "unit": "unicode_code_points",
  "field": "messages[3].content",
  "messageIndex": 3
}`, "422 Unprocessable Entity")}

<div class="warn"><b>Oversize is a <code>413</code>; every other batch violation is a <code>422</code> — and which one you get for a large body depends on what else is in it.</b> The transport reads up to 2,097,152 bytes before it cancels the stream, four times the contract limit. That headroom exists to drain an older on-disk queue format, not for you. The consequences:
<ul>
<li>A body between 524,288 and 2,097,152 bytes is fully read, decoded and parameter-checked <i>before</i> the contract refuses it. So a 600 KiB request that also misspells a field name comes back <code>400 unknown_parameter</code>, not <code>413</code>.</li>
<li>A body over 2,097,152 bytes has its stream cancelled and receives the same <code>413 ingest_request_too_large</code> payload, reporting the same <code>limit</code> of 524,288. The 2 MiB figure never appears in an error, so you cannot infer it from a response.</li>
</ul>
Size and shape are checked against 524,288 bytes either way. Treat that as the only number that exists.</div>

<div class="warn"><b>Contract errors are decided before authentication.</b> The order is: read body, parse JSON, check parameter names, check the ingest contract, <i>then</i> authenticate, then rate-limit. A request carrying 40 messages and an invalid key returns <code>422 ingest_message_count_exceeded</code>, not <code>401</code>. Fix the body first; a <code>401</code> only appears once the body is valid.</div>

<h2>GET /v1/ingest/limits</h2>
<p>The bounds above are published as a document. Fetch it at startup and cache it rather than hard-coding the numbers into your batching code.</p>

<table>
<tr><th>Method</th><td><code>GET</code></td></tr>
<tr><th>Path</th><td><code>${ORIGIN}/v1/ingest/limits</code></td></tr>
<tr><th>Auth</th><td>None. No credential is read.</td></tr>
<tr><th>Scope</th><td>None</td></tr>
<tr><th>Rate bucket</th><td>None</td></tr>
<tr><th>Timing</th><td>Static. It takes no body and no query parameters, and has no failure mode — always <code>200</code>.</td></tr>
</table>

${codeBlock(`curl ${ORIGIN}/v1/ingest/limits`, "terminal")}

${outputBlock(`{
  "ok": true,
  "schema": "itsuki.ingest-limits/v1",
  "limits": {
    "maxMessages": 30,
    "maxMessageCharacters": 4000,
    "maxTotalCharacters": 120000,
    "maxRequestBytes": 524288
  },
  "character_unit": "unicode_code_points",
  "request_encoding": "utf-8-json",
  "delivery_schema": "itsuki.ingest.delivery/v1"
}`, "Response")}

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>limits.maxMessages</code></td><td>Most elements allowed in one <code>messages[]</code>.</td></tr>
<tr><td><code>limits.maxMessageCharacters</code></td><td>Most code points in a single message's <code>content</code>.</td></tr>
<tr><td><code>limits.maxTotalCharacters</code></td><td>Most code points across the whole batch.</td></tr>
<tr><td><code>limits.maxRequestBytes</code></td><td>Most serialized UTF-8 bytes in the request body.</td></tr>
<tr><td><code>character_unit</code></td><td><code>unicode_code_points</code>. This is the field that stops your splitter from drifting away from what the server counts.</td></tr>
<tr><td><code>request_encoding</code></td><td><code>utf-8-json</code>. A body that is not valid UTF-8 is <code>400 invalid_json</code>, not a mojibake save.</td></tr>
<tr><td><code>delivery_schema</code></td><td>The exact string a <code>delivery.schema</code> field must equal.</td></tr>
</table>

<p>Only <code>GET</code> is routed here — <code>POST /v1/ingest/limits</code> is a <code>404</code>, as is <code>/v1/ingest/limits/</code> with a trailing slash. The broader document at <code>GET /v1/limits</code> carries these same ingest bounds plus every rate bucket; see <a href="#/api/limits">Limits</a>.</p>

<div class="note"><b>One migration lane exists, and you cannot enter it by accident.</b> A body whose <code>source</code> is exactly <code>"plugin"</code>, whose <code>idempotencyKey</code> matches an older outbox key format, and which carries no <code>delivery</code> key is measured against a wider, unpublished set of bounds, and every response to it — success or error — carries the header <code>x-itsuki-ingest-contract: legacy-claude-outbox-v1</code>. It exists only to drain spools written before ordered batching shipped. Those wider bounds are deliberately absent from <code>GET /v1/ingest/limits</code>. If you see that header on a request you wrote, you have collided with the lane by accident — change your idempotency key format.</div>

<h2>Ordered delivery</h2>
<p>When one conversation does not fit in a single request, split it and stamp each request with a <code>delivery</code> object. That lets the server tell a complete, ordered group apart from a stream of unrelated batches, and record honestly that capture was truncated when it was.</p>
<p>The object is validated as a unit. Any unknown key, any wrong type, any broken invariant makes the whole thing invalid and the request returns <code>422 invalid_ingest_delivery_metadata</code>. There is no partial acceptance and no field-level message — check every field below.</p>

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>schema</code></td><td>string</td><td>Yes</td><td>Exactly <code>"itsuki.ingest.delivery/v1"</code>.</td></tr>
<tr><td><code>groupId</code></td><td>string</td><td>Yes</td><td>Must match <code>^(?:claude|codex)_delivery_v1_[a-f0-9]{40}$</code>.</td></tr>
<tr><td><code>batchIndex</code></td><td>integer</td><td>Yes</td><td>Zero-based, non-negative, and strictly less than <code>batchCount</code>.</td></tr>
<tr><td><code>batchCount</code></td><td>integer</td><td>Yes</td><td>1 to 128.</td></tr>
<tr><td><code>sourceMessageCount</code></td><td>integer</td><td>Yes</td><td>At least 1. How many original messages this batch came from.</td></tr>
<tr><td><code>segmentCount</code></td><td>integer</td><td>Yes</td><td>At least <code>sourceMessageCount</code> — splitting can only increase the count.</td></tr>
<tr><td><code>splitSourceMessages</code></td><td>integer</td><td>Yes</td><td>Non-negative, at most <code>sourceMessageCount</code>.</td></tr>
<tr><td><code>captureTruncated</code></td><td>boolean</td><td>Yes</td><td>Strictly a boolean. <code>"true"</code> as a string is invalid.</td></tr>
<tr><td><code>truncationReason</code></td><td>string or null</td><td>Conditional</td><td>Required and non-empty when <code>captureTruncated</code> is <code>true</code>: lowercase letters and underscores, 1–40 characters, at most 160 code points. Must be absent, <code>null</code> or empty when <code>captureTruncated</code> is <code>false</code> — a reason without a truncation is rejected.</td></tr>
<tr><td><code>captureEvidence</code></td><td>object</td><td>No</td><td>A fixed counter schema. When present it must carry exactly 25 keys, no more and no fewer.</td></tr>
</table>

<div class="note"><b><code>captureEvidence</code> is content-free by construction.</b> Every one of its 25 keys is either the schema string, a non-negative integer counter bounded at 67,108,864, or the <code>redactions</code> map — whose keys may only be <code>private_key</code>, <code>connection_credentials</code>, <code>query_secret</code>, <code>api_key</code>, <code>bearer_token</code>, <code>high_entropy</code> or <code>named_secret</code>, each with an integer count of at least 1. Arbitrary strings, file paths, commands and transcript text cannot cross this boundary. The counters must also be self-consistent — returned events cannot exceed captured events, omitted must equal captured minus returned, and row-level counters cannot exceed <code>inputRows</code> — or the object is rejected.</div>

<p>Ingest does not wait for extraction. You get a receipt saying the batch was accepted and queued, with the handles you need to follow it.</p>

<p>A fuller <code>receipt</code> object rides along in the same body, carrying <code>outcome</code>, <code>status</code>, <code>final</code>, the <code>idempotency_key</code> that was used, and a <code>saved</code> breakdown that is still zeroed at this point. The outcome vocabulary on this door is <code>accepted</code>, <code>accumulating</code> (some messages held), <code>duplicate</code> (an idempotent replay) and <code>ignored</code> (no durable learning signal found).</p>

<div class="note"><b>An ingest that stores nothing is still a successful ingest.</b> Chatter, questions and repeats settle as <code>ignored</code> with <code>savedTotal: 0</code>. Branch on the counts and the receipt outcome, never on the status code alone.</div>

<h3>Following the batch to completion</h3>
<p>Two reads, both needing <code>memory:read</code>:</p>
<ul>
<li><code>GET /v1/packets/&lt;source_packet_id&gt;/status</code> — one row for this write, with its job status, counts and outcome reason. An unknown id is a <code>404</code>.</li>
<li><code>GET /v1/jobs</code> — the same shaped rows for the account, newest first.</li>
</ul>
<p>Active job states are <code>awaiting_source</code>, <code>queued</code>, <code>staged</code> and <code>processing</code>; terminal states are <code>enriched</code>, <code>failed</code> and <code>completed</code>. Work cancelled by a confirmed erasure or a project archive settles as terminal <code>failed</code> — no new status word was added, because shipped SDKs poll against a closed set of terminal states and a new one would hang them. The distinction is published as the separate fields <code>cancelled_by_delete</code> and <code>outcome_reason</code> instead.</p>

<h3>Replays</h3>
<p>Resending an identical batch under the same idempotency key returns <code>200</code> with <code>"duplicate": true</code> and an honest summary of what the <i>original</i> attempt did — including &ldquo;not saved&rdquo; if the first attempt ignored it. Reusing a key for different content is <code>409 idempotency_conflict</code>; mint a new one. If the original write was erased, the replay is <code>409 source_write_erased</code> rather than a silent re-save.</p>

<h3>The revision ETag, and why you need it</h3>
<p>Every successful single-object read carries a strong ETag whose value is the revision: <code>etag: "r3"</code>. It is served unconditionally, on every object kind.</p>

<div class="warn"><b>You cannot correct a memory without reading it first.</b> <code>PATCH /v1/memories/&lt;id&gt;</code> and <code>POST /v1/memories/&lt;id&gt;/rollback</code> refuse to write without an exact revision precondition — there is no blind-write mode. Send <code>If-Match: "r3"</code>, or <code>expectedRevision: 3</code> in the body. Neither present, or a header that is not revision-ETag shaped, is <code>428 precondition_required</code>. <code>If-Match: *</code> is refused with <code>400 wildcard_rejected</code> rather than being treated as consent. Both forms present and disagreeing is <code>400 precondition_mismatch</code>. If someone moved the object between your read and your write you get <code>412 stale_revision</code>, whose body carries <code>current_revision</code> so you can re-read, re-apply and retry.</div>

<p>Only the strong form is ever emitted. The weak form <code>W/&quot;r3&quot;</code> is accepted on input, so a client that adds the prefix still works.</p>

<div class="note"><b>The ETag is a version handle, not a cache handle.</b> This endpoint does not implement conditional GET: send <code>If-None-Match</code> and you still get <code>200</code> with the full body, never a <code>304</code>. And a suggestion carries no revision of its own — its header still reads <code>&quot;r1&quot;</code>, which is not usable as a precondition, because suggestions cannot be updated through that door at all.</div>

<h3>Revision history</h3>
<p><code>GET /v1/memories/&lt;id&gt;/history</code> returns the recorded revisions of one object, newest first. It needs <code>memory:read</code>, the same as the reads above: whoever could read the value while it was current may read it as history.</p>

<tr><td><code>cursor</code></td><td>string</td><td>No</td><td>Unlike the inventory cursor this one is not opaque: it is the plain revision number to read below, and <code>next_cursor</code> hands you the right value.</td></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>As on the reads above.</td></tr>
</table>

<h1>PATCH /v1/memories/:id</h1>
<p class="lede">Correct one stored memory in place, read everything it used to say, and restore an earlier version — all without ever losing a revision.</p>

<p>Three routes share one contract and are documented together: <code>PATCH /v1/memories/&lt;id&gt;</code> corrects an object, <code>GET /v1/memories/&lt;id&gt;/history</code> reads its revisions, and <code>POST /v1/memories/&lt;id&gt;/rollback</code> restores an earlier one. The two write doors take the same preconditions, the same body limit and the same error codes.</p>

<table>
<tr><th>Method</th><td><code>PATCH</code> (update) · <code>POST .../rollback</code> · <code>GET .../history</code></td></tr>
<tr><th>Path</th><td><code>${ORIGIN}/v1/memories/&lt;id&gt;</code></td></tr>
<tr><th>Auth</th><td>API key or MCP link as <code>Authorization: Bearer</code>, or a signed-in session</td></tr>
<tr><th>Scope</th><td>Writes: <code>memory:write</code> plus the <code>project.memory.write</code> capability. History: <code>memory:read</code> plus <code>project.memory.read</code>.</td></tr>
<tr><th>Rate bucket</th><td>Writes: <code>save</code> — 60 requests per 60 seconds. History: <code>read</code> — 240 requests per 60 seconds.</td></tr>
<tr><th>Max body</th><td>65,536 bytes on the two write doors</td></tr>
<tr><th>Precondition</th><td>Required on both write doors: <code>If-Match</code> or <code>expectedRevision</code></td></tr>
<tr><th>Timing</th><td>The canonical write is synchronous. The derived search and vector indexes are rebuilt after the response.</td></tr>
</table>

<p>Editable objects carry a <code>revision</code> integer. Every accepted change writes <code>revision + 1</code> and appends a history row. No operation in this API decrements a revision, rewrites a recorded one, or removes one.</p>

<h2>Step 1 — read the revision you are about to overwrite</h2>
<p>The revision arrives two ways: in the body of the object, and as a strong <code>ETag</code> on the single-object read.</p>
${codeBlock(`curl -i -H "authorization: Bearer $ITSUKI_API_KEY" \\
  ${ORIGIN}/v1/memories/node_abc123`, "terminal")}
${outputBlock(`ETag: "r1"

{
  "ok": true,
  "kind": "node",
  "memory": {
    "id": "node_abc123",
    "revision": 1,
    "label": "Kotln",
    "category": "skill",
    "summary": "Learning since August."
  }
}`, "Response (abridged)")}

<div class="note"><b>The server only ever emits the strong form.</b> The <code>ETag</code> is always <code>"r&lt;revision&gt;"</code> — a weak <code>W/"r1"</code> is never produced by ${PRODUCT.name}. The <code>If-Match</code> parser accepts both forms on the way in, so an intermediary that weakens the validator will not break your update. Anything else — <code>"v7"</code>, an unquoted <code>r1</code>, a hash — is rejected.</div>

<h2>Step 2 — the precondition</h2>
<p>A write is refused unless it names the exact revision it read. There are two equivalent ways to say it.</p>
<table>
<tr><th>Where</th><th>Form</th><th>Notes</th></tr>
<tr><td><code>If-Match</code> header</td><td><code>If-Match: "r1"</code></td><td>Also accepts <code>W/"r1"</code>. Must match <code>"r&lt;digits&gt;"</code> exactly.</td></tr>
<tr><td><code>expectedRevision</code> body field</td><td><code>"expectedRevision": 1</code></td><td>A positive integer. Useful for clients that cannot set request headers.</td></tr>
</table>
<p>Sending both is allowed and they must agree; disagreement is <code>400 precondition_mismatch</code>. Sending neither is <code>428 precondition_required</code>.</p>

<div class="warn"><b><code>If-Match: *</code> is refused, and it is a <code>400</code>, not a <code>412</code>.</b> The wildcard means &ldquo;whatever is there now&rdquo;, which is exactly the blind overwrite this door exists to prevent. The error is <code>wildcard_rejected</code>. There is no way to opt out of the precondition.</div>

<h3>428 versus 412</h3>
<table>
<tr><th>Status</th><th>Meaning</th><th>What to do</th></tr>
<tr><td>428 <code>precondition_required</code></td><td>You did not prove which version you read: no precondition at all, or an <code>If-Match</code> that is not a revision ETag, or an <code>expectedRevision</code> that is not a positive integer.</td><td>Fix the request. Re-reading the object is not required, but it is the easiest way to get a valid value.</td></tr>
<tr><td>412 <code>stale_revision</code></td><td>You named a real revision and it is no longer the head — something changed the object first. Nothing was written.</td><td>Re-read, review the new content against the change you wanted, then retry with the new revision. Do not retry blindly.</td></tr>
</table>
<p>The <code>412</code> body carries <code>current_revision</code>, and on the pre-commit path also <code>expected_revision</code>, so a client can diff without a second round trip.</p>

<h2>Step 3 — PATCH the object</h2>
${codeBlock(`curl -X PATCH ${ORIGIN}/v1/memories/node_abc123 \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -H 'If-Match: "r1"' \\
  -d '{
    "label": "Kotlin",
    "reason": "typo in the label",
    "idempotencyKey": "fix-kotlin-label-01"
  }'`, "terminal")}

<h3>Body fields</h3>
<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td>editable fields</td><td>varies</td><td>Yes</td><td>At least one, from the frozen set for that object kind (below). An empty patch is <code>400 invalid_content</code>.</td></tr>
<tr><td><code>idempotencyKey</code></td><td>string</td><td>Yes</td><td>8&ndash;120 characters. There is no default and no derivation — omitting it is <code>400 invalid_idempotency_key</code>.</td></tr>
<tr><td><code>expectedRevision</code></td><td>integer</td><td>Conditional</td><td>Required unless you sent <code>If-Match</code>.</td></tr>
<tr><td><code>reason</code></td><td>string</td><td>No</td><td>Up to 500 characters. Stored on the revision and returned by history. It is part of the idempotency fingerprint, so changing only the reason is a different operation.</td></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>Selects one of your end users&rsquo; isolated memory spaces. Also accepted as <code>?userId=</code>.</td></tr>
<tr><td><code>memoryScope</code></td><td>object</td><td>No</td><td>Carries <code>projectId</code>. <code>sourceScope</code> is accepted as an alias.</td></tr>
</table>

<div class="note"><b>Every other key in the body is treated as an editable field.</b> Only <code>userId</code>, <code>memoryScope</code>, <code>sourceScope</code>, <code>expectedRevision</code>, <code>reason</code>, <code>idempotencyKey</code> and <code>toRevision</code> are stripped before validation. A typo such as <code>lable</code> comes back as <code>400 invalid_field</code>, and the message lists the fields that kind does accept. This door does not use the <code>unknown_parameter</code> mechanism the write endpoints use.</div>

<h3>Editable fields per kind</h3>
<p>Four kinds support explicit updates. The id prefix selects the kind; the field set is frozen per kind.</p>
<table>
<tr><th>Kind</th><th>Id prefix</th><th>Field</th><th>Type and bounds</th></tr>
<tr><td rowspan="3">Memory (node)</td><td rowspan="3"><code>node_</code></td><td><code>label</code></td><td>string, non-empty, &le; 200 characters</td></tr>

<tr><td rowspan="3">Conversation page</td><td rowspan="3"><code>page_</code></td><td><code>title</code></td><td>string, non-empty, &le; 200 characters</td></tr>
<tr><td><code>short_summary</code></td><td>string or <code>null</code>, &le; 4,000 characters</td></tr>
<tr><td><code>full_markdown</code></td><td>string or <code>null</code>, &le; 20,000 characters</td></tr>
<tr><td rowspan="2">Detail (slice)</td><td rowspan="2"><code>slice_</code></td><td><code>text</code></td><td>string, non-empty, &le; 4,000 characters</td></tr>
<tr><td><code>kind</code></td><td>string, lowercased, one of: <code>feature_detail</code>, <code>technical_detail</code>, <code>progress</code>, <code>blocker</code>, <code>fix</code>, <code>decision</code>, <code>preference</code>, <code>other</code></td></tr>
<tr><td rowspan="3">Event</td><td rowspan="3"><code>event_</code></td><td><code>text</code></td><td>string, non-empty, &le; 4,000 characters</td></tr>
<tr><td><code>importance</code></td><td>one of <code>ordinary</code>, <code>important</code>, <code>life_significant</code></td></tr>
<tr><td><code>happened_at</code></td><td>integer, unix <b>milliseconds</b>, from 1900-01-01 to roughly a century ahead</td></tr>
</table>
<p>Strings are normalized to NFC, stripped of control characters other than newline and tab, then trimmed — the length caps apply to the trimmed value. Suggestions (<code>cand…</code>) and edges (<code>edge_</code>) are not editable and return <code>422 unsupported_kind</code>; any other prefix is <code>400 unrecognized_id</code>.</p>

<h3>Response</h3>
${outputBlock(`{
  "ok": true,
  "id": "node_abc123",
  "kind": "node",
  "action": "update",
  "revision": 2,
  "previous_revision": 1,
  "projections": { "search": "pending", "vector": "pending" }
}`)}
<p>The response carries the new revision as an <code>ETag</code> header too — <code>"r2"</code> here — so a client that edits twice in a row never needs an intervening read.</p>
<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>revision</code></td><td>The new head revision. Use it as the precondition for your next write.</td></tr>
<tr><td><code>previous_revision</code></td><td>What it was before. Absent on a no-op.</td></tr>
<tr><td><code>action</code></td><td><code>update</code> or <code>rollback</code>.</td></tr>
<tr><td><code>rolled_back_to</code></td><td>Only on a rollback: the revision whose content was restored.</td></tr>
<tr><td><code>projections</code></td><td>Derived indexes queued for rebuild — <code>search</code> always, <code>vector</code> for memories. The canonical text is already correct; recall catches up shortly after.</td></tr>
<tr><td><code>noop</code></td><td>Present and <code>true</code> when the values you sent already matched.</td></tr>
<tr><td><code>replayed</code></td><td>Present and <code>true</code> when this idempotency key already committed this exact operation. The rest of the body is the original result.</td></tr>
</table>

<div class="note"><b>A no-op is not a free pass.</b> When your values match what is stored, the revision does not move and no history row is appended — but the request still claims the idempotency key and still takes every fence, so a no-op can legitimately come back <code>412</code>, <code>409</code> or <code>403</code>.</div>

<div class="note"><b>An edit pins that text against automatic rewriting.</b> While a node&rsquo;s <code>summary</code>, or a page&rsquo;s <code>title</code> or <code>full_markdown</code>, still holds the exact text a person wrote, the background passes that would normally regenerate it defer instead. The pin releases on its own once the text legitimately changes — including when you roll back to machine-written text.</div>

<h2>GET /v1/memories/:id/history</h2>
${codeBlock(`curl -H "authorization: Bearer $ITSUKI_API_KEY" \\

<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>limit</code></td><td>integer</td><td>No</td><td>1&ndash;50, default 20. A non-numeric value or <code>0</code> falls back to 20; a negative value clamps to 1.</td></tr>
<tr><td><code>cursor</code></td><td>string</td><td>No</td><td>Not opaque: it is the plain decimal revision number from <code>next_cursor</code>, and the next page is the revisions strictly below it. A value that is not a positive integer is <code>400 invalid_cursor</code>.</td></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>The end-user memory space to read.</td></tr>
</table>

${outputBlock(`{
  "ok": true,
  "id": "node_abc123",
  "kind": "node",
  "current_revision": 2,
  "total_revisions": 2,
  "retention": "retained_until_object_deleted",
  "revisions": [
    {
      "revision": 2,
      "parent_revision": 1,
      "action": "update",
      "snapshot": { "category": "skill", "label": "Kotlin", "summary": "Learning since August." },
      "content_hash": "6b1f0c9d4e2a7f31",
      "actor": "token",

      "actor": "system",
      "created_at": 1785539673072,
      "captured": true
    }

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>revisions</code></td><td>Newest first. Each row carries the full editable-field <code>snapshot</code> as of that revision, not a diff.</td></tr>
<tr><td><code>action</code></td><td><code>baseline</code>, <code>system</code>, <code>update</code> or <code>rollback</code>. See below.</td></tr>
<tr><td><code>actor</code></td><td><code>user</code>, <code>token</code> or <code>system</code> — the class of writer, never a secret or a key value.</td></tr>
<tr><td><code>captured</code></td><td><code>true</code> on <code>baseline</code> and <code>system</code> rows: recorded by the system rather than by a person.</td></tr>

<tr><td><code>total_revisions</code></td><td>The full count, not the page count.</td></tr>
<tr><td><code>projections</code></td><td>Per-index status and the revision each has caught up to.</td></tr>
</table>

<h3>Why your first edit produces two rows</h3>
<p>History is written lazily. The first explicit change to an object that has no history appends a synthetic <code>baseline</code> row at the current revision, capturing what the object said before you touched it, and then the <code>update</code> row. If automatic writers had moved the revision forward without recording rows, one <code>system</code> row is appended to account for that drift honestly rather than attributing it to a person. Nothing invents historical authors or timestamps.</p>

<div class="warn"><b>&ldquo;Never pruned&rdquo; means never pruned in place — not that history outlives its object.</b> The page size is a transport bound, not a retention policy: every recorded revision is retained while the object lives, so a revision offered as restorable stays restorable. Deleting the object, retention expiry, a project purge, or account erasure removes its revisions along with it, and history for a deleted object returns <code>404</code>.</div>

<p>History is a read: <code>memory:read</code> and <code>project.memory.read</code> are enough. Anyone who could read a value while it was current can read it as history. Responses are sent <code>cache-control: private, no-store</code>.</p>

<h2>POST /v1/memories/:id/rollback</h2>
<p>Same door, same auth, same preconditions, same body limit. The difference is what you send and what it means.</p>
${codeBlock(`curl -X POST ${ORIGIN}/v1/memories/node_abc123/rollback \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -H 'If-Match: "r2"' \\
  -d '{
    "toRevision": 1,
    "reason": "the original label was right after all",
    "idempotencyKey": "restore-kotlin-label-01"
  }'`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>toRevision</code></td><td>integer</td><td>Yes</td><td>A positive integer that exists in this object&rsquo;s history. It must not equal the current revision — that is <code>400 invalid_content</code> with <code>current_revision</code> in the body.</td></tr>
<tr><td><code>idempotencyKey</code></td><td>string</td><td>Yes</td><td>8&ndash;120 characters, as on PATCH.</td></tr>
<tr><td><code>expectedRevision</code></td><td>integer</td><td>Conditional</td><td>The <b>current</b> head, not the target. Required unless you sent <code>If-Match</code>.</td></tr>
<tr><td><code>reason</code></td><td>string</td><td>No</td><td>Up to 500 characters, stored on the new revision.</td></tr>
</table>
<p>Unlike PATCH, a rollback body has no editable fields to validate, so stray keys are ignored rather than refused. The restore is bound to this user and this object, so a revision number belonging to some other object cannot be reached.</p>

${outputBlock(`{
  "ok": true,
  "id": "node_abc123",
  "kind": "node",
  "action": "rollback",
  "revision": 3,
  "previous_revision": 2,
  "rolled_back_to": 1,
  "projections": { "search": "pending", "vector": "pending" }
}`)}

<div class="warn"><b>Rollback writes a NEW forward revision. It never rewinds and never erases.</b> After the call above the object is at revision 3 carrying revision 1&rsquo;s content. Revision 2 is still recorded, still readable, and still restorable. History now reads <code>3 rollback</code>, <code>2 update</code>, <code>1 baseline</code>, and the new row carries <code>rollback_of: 1</code>. Two consequences worth designing around: rolling back a rollback is just another rollback, and an undo button in your product is an ordinary forward write, not a special case.</div>
<p>Restoring copies the recorded snapshot of the editable fields over the current values. Fields that are not part of that kind&rsquo;s editable set — relations, timestamps, state — are not touched.</p>

<h2>Retries and concurrency</h2>
<p>Both write doors are idempotent on <code>idempotencyKey</code>. The fingerprint covers the whole normalized operation: memory space, object, kind, action, precondition, field values, target revision and reason. Key order, padding and Unicode form are normalized away first, so a re-serialized retry of the same intent still matches.</p>
<ul>
<li>Same key, same operation — <code>200</code> with <code>replayed: true</code> and the original result.</li>
<li>Same key, different operation — <code>409 idempotency_conflict</code>, with <code>idempotency_key_reused: true</code>. Mint a new key.</li>
</ul>
<p>An accepted change commits as a single guarded transaction: the idempotency claim, a compare-and-set on the revision, the history rows, the projection reset, and re-checks of the project&rsquo;s lifecycle state, your role and the exact credential you authenticated with. A token revoked, a role downgraded, or a project archived between the moment the request was accepted and the moment it committed aborts the whole write — surfacing as <code>401 credential_invalid</code>, <code>403 forbidden</code>, <code>409 project_state_changed</code> or <code>412 stale_revision</code> rather than a partial result.</p>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>wildcard_rejected</code></td><td><code>If-Match: *</code>. Send the exact revision.</td></tr>
<tr><td>400</td><td><code>precondition_mismatch</code></td><td><code>If-Match</code> and <code>expectedRevision</code> were both sent and disagree.</td></tr>
<tr><td>400</td><td><code>invalid_idempotency_key</code></td><td>Missing, or outside 8&ndash;120 characters.</td></tr>
<tr><td>400</td><td><code>invalid_field</code></td><td>A key that is not editable for that kind. The message names the editable set.</td></tr>
<tr><td>400</td><td><code>invalid_content</code></td><td>Empty patch, a value that is empty, too long, wrongly typed, or outside its allowed set; a <code>toRevision</code> that is not a positive integer or is already current.</td></tr>
<tr><td>400</td><td><code>unrecognized_id</code></td><td>The id prefix is not <code>node_</code>, <code>page_</code>, <code>slice_</code> or <code>event_</code>.</td></tr>
<tr><td>400</td><td><code>invalid_cursor</code></td><td>History <code>cursor</code> is not a revision number.</td></tr>
<tr><td>400</td><td><code>invalid_json</code></td><td>The body is not one JSON object.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential.</td></tr>
<tr><td>401</td><td><code>credential_invalid</code></td><td>The token or session stopped being valid while the write was committing. Carries <code>credential_kind</code>.</td></tr>
<tr><td>403</td><td><code>forbidden</code></td><td>Code <code>insufficient_scope</code> when the key lacks the scope; otherwise a role that lacks <code>project.memory.write</code> (or <code>project.memory.read</code> for history). Carries <code>capability</code>.</td></tr>
<tr><td>404</td><td><code>not_found</code></td><td>No live object with that id in this memory space. Deleted and never-existed are deliberately indistinguishable.</td></tr>
<tr><td>404</td><td><code>revision_unavailable</code></td><td>The rollback target was never recorded, or was removed with the object. Carries <code>revision</code>.</td></tr>
<tr><td>404</td><td><code>feature_disabled</code></td><td>Safe updates are not enabled on that deployment. All three doors answer this way, so a <code>404</code> here is not a statement about your memory.</td></tr>
<tr><td>409</td><td><code>object_archived</code></td><td>The memory is archived. Restore it before editing.</td></tr>
<tr><td>409</td><td><code>unsupported_state</code></td><td>The object is suppressed, or the detail has been superseded — edit the current detail instead.</td></tr>
<tr><td>409</td><td><code>project_archived</code></td><td>The project is not active.</td></tr>
<tr><td>409</td><td><code>idempotency_conflict</code></td><td>That key is already bound to a different operation.</td></tr>
<tr><td>409</td><td><code>project_state_changed</code></td><td>A lifecycle or deletion fence was lost at commit time. Reload and retry.</td></tr>
<tr><td>412</td><td><code>stale_revision</code></td><td>The precondition named a revision that is no longer the head. Carries <code>current_revision</code>. Nothing was written.</td></tr>

<tr><td>422</td><td><code>unsupported_kind</code></td><td>A suggestion or edge id. Carries <code>kind</code>.</td></tr>

</table>
<p>Every error from this family carries the code in both <code>error</code> and <code>code</code>, with the human-readable text in <code>message</code>. Branch on the code; the wording is not contractual.</p>

PAGES["/api/memories-delete"] = { title: "DELETE /v1/memories", html: `
<h1>DELETE /v1/memories</h1>
<p class="lede">Remove one memory object by id, or everything in a memory space — with a preview you get by default and a destruction you have to ask for explicitly.</p>

<table>
<tr><th>Method</th><td><code>DELETE</code></td></tr>
<tr><th>Paths</th><td><code>${ORIGIN}/v1/memories/&lt;id&gt;</code> for one object, <code>${ORIGIN}/v1/memories</code> for a filtered bulk delete</td></tr>
<tr><th>Auth</th><td>API key or MCP link as <code>Authorization: Bearer</code>, or a signed-in session</td></tr>
<tr><th>Scope</th><td><code>memory:write</code>, <b>plus</b> the project capability <code>project.memory.delete</code></td></tr>
<tr><th>Rate bucket</th><td><code>delete</code> — 30 requests per 60 seconds</td></tr>
<tr><th>Request body</th><td>None. Every option is a query parameter.</td></tr>
<tr><th>Timing</th><td>Fully synchronous. The response describes work already done.</td></tr>
</table>

<div class="note"><b>Deleting is a separate permission from writing.</b> Holding <code>memory:write</code> is necessary but not sufficient — the credential's current project role must also carry <code>project.memory.delete</code>, which is checked fresh on every call. A key that has been writing happily for months will get a <code>403</code> naming the capability the moment it tries to remove something, and that is the design: a token that may write must not automatically be able to erase.</div>

<div class="warn"><b>The <code>delete</code> bucket is half the <code>save</code> bucket, on purpose.</b> Thirty requests per minute against sixty for saving — a loop that deletes is worse than a loop that saves. The bucket is keyed on the authenticated actor and project, <b>not</b> on the <code>userId</code> you pass, so rotating <code>userId</code> across your end users does not buy a fresh allowance.</div>

<h2>Delete one object</h2>
${codeBlock(`curl -X DELETE "${ORIGIN}/v1/memories/node_7c4a1e" \\
  -H "authorization: Bearer $ITSUKI_API_KEY"`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td>path id</td><td>string</td><td>Yes</td><td>URI-decoded. The prefix decides what is deleted — see the table below.</td></tr>
<tr><td><code>suppress</code></td><td>string</td><td>No</td><td>Suppression is on unless the value is literally <code>false</code>. Any other value, including <code>0</code> and <code>no</code>, leaves it on.</td></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>Selects one of your end users' isolated memory spaces instead of the account's own.</td></tr>
</table>

<h3>What each id prefix removes</h3>
<table>
<tr><th>Prefix</th><th>Removes</th></tr>
<tr><td><code>node_</code></td><td>The memory and everything hanging off it: its details, its dated events, and every connection touching it.</td></tr>
<tr><td><code>page_</code></td><td>One page, plus the source links that named it.</td></tr>
<tr><td><code>slice_</code></td><td>One detail. The memory it belongs to survives — this is how you remove a single wrong fact without destroying the memory around it.</td></tr>
<tr><td><code>cand</code>…</td><td>One pending suggestion.</td></tr>
</table>

<div class="note"><b>An <code>event_</code> id is refused, even though the error message lists it.</b> The message reads <i>&ldquo;Unrecognized memory id — expected a node_, page_, slice_, event_, or candidate id.&rdquo;</i>, but the prefix dispatch has no <code>event_</code> branch, so an event id returns <code>400</code>. Delete the event's node, or correct it with <code>PATCH</code>.</div>

${outputBlock(`{
  "ok": true,
  "deleted": true,
  "kind": "node",
  "id": "node_7c4a1e"
}`)}

<p><code>kind</code> comes back normalized: <code>node</code>, <code>memory_page</code>, <code>slice</code> or <code>candidate</code>. A slice carries one extra field, <code>node_id</code>, naming the memory that kept its place.</p>

<h3>Deleting a memory also stops it coming back</h3>
<p>A node or page delete records a suppression rule keyed on the normalized label, with no expiry. A later save proposing the same subject is rejected at the admission gate rather than re-learned, so the thing you deleted does not quietly reappear the next time it is mentioned. Pass <code>suppress=false</code> to delete the object without arming that rule. A slice delete never records one — you are removing one detail, not banning a subject — and neither does the bulk route.</p>

<h2>Delete in bulk</h2>
<p>With no id in the path, the same route deletes by filter. It previews by default.</p>
${codeBlock(`# Preview. This is the default and it changes nothing.
curl -X DELETE "${ORIGIN}/v1/memories?source=crm-import&after=1786000000000" \\
  -H "authorization: Bearer $ITSUKI_API_KEY"

# Then commit it.
curl -X DELETE "${ORIGIN}/v1/memories?source=crm-import&after=1786000000000&confirm=true&dry_run=false" \\
  -H "authorization: Bearer $ITSUKI_API_KEY"`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>source</code></td><td>string</td><td>No</td><td>The label your writes were stamped with. Same rule as on the write doors: 1–64 characters, no control characters. A value that fails it is a <code>400</code>, never a silent no-op. Matches a write whose engine lane, tool name, <i>or</i> client <code>source</code> equals it.</td></tr>
<tr><td><code>before</code></td><td>unix ms</td><td>No</td><td>Exclusive: written strictly before this instant. A value that is not a positive finite number is ignored without an error.</td></tr>
<tr><td><code>after</code></td><td>unix ms</td><td>No</td><td>Exclusive: written strictly after this instant. Same silent-ignore rule.</td></tr>
<tr><td><code>dry_run</code></td><td>string</td><td>No</td><td>Anything except literally <code>false</code> forces a preview. Absent means &ldquo;preview unless confirmed&rdquo;.</td></tr>
<tr><td><code>confirm</code></td><td>string</td><td>No</td><td>Must be literally <code>true</code>. Nothing is destroyed without it.</td></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>Selects the memory space to act on, exactly as on the single-object path.</td></tr>
</table>

<p>There is no project filter. The filters are source and time, and nothing else, so a bulk delete addresses the whole resolved memory space — every project inside it.</p>

<h3>Which combination actually destroys anything</h3>
<table>
<tr><th>Query</th><th>Result</th></tr>
<tr><td>no parameters</td><td>Preview</td></tr>
<tr><td><code>dry_run=false</code></td><td>Preview — <code>confirm</code> is still missing</td></tr>
<tr><td><code>confirm=true</code></td><td><b>Destructive</b></td></tr>
<tr><td><code>confirm=true&amp;dry_run=true</code></td><td>Preview — an explicit <code>dry_run</code> wins</td></tr>
<tr><td><code>confirm=true&amp;dry_run=false</code></td><td><b>Destructive</b></td></tr>
</table>

<h3>Preview response</h3>
${outputBlock(`{
  "ok": true,
  "dry_run": true,
  "would_delete": {
    "runs": 3, "nodes": 41, "pages": 2,
    "slices": 55, "events": 7, "edges": 63, "candidates": 0
  },
  "sample_labels": ["Postgres", "Service rewrite", "Ana Ruiz"],
  "pending_jobs": 1,
  "note": "1 accepted save(s) are still processing and will finish AFTER this delete; preview again afterwards to remove their output."
}`, "Response — preview")}

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>would_delete</code></td><td>Row counts per kind, plus <code>runs</code> — the extraction runs this cleanup would retire. <code>pages_rewritten</code> appears only when a page would survive in rebuilt form because it also has out-of-scope sources.</td></tr>
<tr><td><code>sample_labels</code></td><td>Up to 30 labels, so you can see what you are about to lose before you commit.</td></tr>
<tr><td><code>pending_jobs</code></td><td>Saves already accepted and still processing. The <code>note</code> says what will happen to them, which differs between the two contracts below.</td></tr>
</table>

<h3>Confirmed response</h3>
${outputBlock(`{
  "ok": true,
  "dry_run": false,
  "deleted": {
    "runs": 3, "nodes": 41, "pages": 2,
    "slices": 55, "events": 7, "edges": 63, "candidates": 0
  },
  "summaries_regenerated": 6,
  "staged_settled": 0,
  "source_episodes_deleted": 12,
  "semantic_atom_candidates_deleted": 0,
  "semantic_atom_capture_runs_deleted": 0,
  "semantic_atom_projections_deleted": 0,
  "convergence_passes": 1,
  "cancelled_runs": 1,
  "cancelled_source_jobs": 1,
  "cancelled_atomic_runs": 0,
  "cancelled_shadow_jobs": 0,
  "source_packets_minimized": 4,
  "pending_jobs": 1,
  "note": "1 accepted save(s) were cancelled by this delete."
}`, "Response — confirmed erasure")}

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>deleted</code></td><td>What was actually swept. <code>runs</code> is the number the preview promised; the rest are real row totals.</td></tr>
<tr><td><code>summaries_regenerated</code></td><td>Surviving memories whose summary was rebuilt because it had been written partly from a fact that just died.</td></tr>
<tr><td><code>source_episodes_deleted</code></td><td>Captured source text removed, not merely the structure derived from it.</td></tr>
<tr><td><code>convergence_passes</code></td><td><code>1</code> means the first sweep was enough. Higher means rows arrived mid-operation and were swept too.</td></tr>
<tr><td><code>cancelled_*</code></td><td>Present only on an erasure. In-flight work that was stopped rather than allowed to land.</td></tr>
<tr><td><code>source_packets_minimized</code></td><td>Write receipts stripped of their stored previews and provenance snippets, keeping only the replay fence.</td></tr>
</table>

<h2>Two operations share this route</h2>
<p>The filters do not merely narrow the same operation — they select between two different contracts.</p>
<table>
<tr><th></th><th>Scoped (a source or a time bound)</th><th>Unscoped (neither)</th></tr>
<tr><td>What it is</td><td>Curation</td><td>Erasure of the whole memory space</td></tr>
<tr><td>In-flight saves</td><td>Finish, and their output lands <i>after</i> your delete</td><td>Cancelled, and refused at commit time</td></tr>
<tr><td>Erasure barrier</td><td>Not recorded</td><td>Recorded</td></tr>
<tr><td>Repeating it</td><td>Converges — preview again after in-flight work settles</td><td>Converges within the call, up to three passes</td></tr>
</table>

<div class="warn"><b>An ignored filter turns a curation into an erasure.</b> <code>source</code> is validated and a bad value is refused, but <code>before</code> and <code>after</code> are not: a non-numeric value such as <code>before=2026-08-01</code> is dropped silently, and a request with no surviving filter <i>is</i> the unscoped case. Send <code>?before=2026-08-01&amp;confirm=true&amp;dry_run=false</code> and you will erase the entire space, successfully, with a <code>200</code>. Two habits prevent it: preview first and read <code>would_delete</code>, and send epoch milliseconds as digits. The same trap sits behind an empty value — <code>?source=</code> — and behind a trailing slash, since <code>DELETE /v1/memories/</code> carries no id and falls through to the bulk path.</div>

<h3>The erasure barrier</h3>
<p>A confirmed unscoped delete records a timestamp for that memory space, and the rule attached to it is: work accepted <i>before</i> this instant may never produce durable rows after it. Queued saves are cancelled in the same transaction that installs the barrier, and any that were already mid-flight are refused by a fence carried in every write commit. Enumeration then repeats — up to three passes — until the live tables, the source episodes and the derived candidate stores all come back empty.</p>
<p>Cancelled saves are terminal and appear in <code>GET /v1/jobs</code> with status <code>failed</code> and an error prefixed <code>cancelled_by_delete:</code>; <code>GET /v1/jobs?cancelled=true</code> separates them from genuine failures. Do not retry one — the barrier applies to the original work. Write the content again as a new save instead: work submitted after the barrier is ordinary work and lands normally.</p>
<p>The barrier only ever moves forward, and it does not lock the space.</p>

<div class="note"><b>An erasure that races a bounded provider call aborts instead of half-succeeding.</b> If a model call for this space is genuinely in flight when you confirm, the barrier stays armed, no content row is touched, and the request fails rather than reporting an erasure it did not complete. It surfaces as a generic <code>500</code> today. Retry once the call settles; deletion is safe to repeat.</p></div>

<h2>What a delete actually removes</h2>
<table>
<tr><th>What</th><th>What happens to it</th></tr>
<tr><td>The object itself</td><td>Marked deleted and invisible to every read path. The row remains as the marker.</td></tr>
<tr><td>Its revision history</td><td>Deleted outright, with its update idempotency records and projection state. History is never allowed to become an undeletable copy of what you deleted.</td></tr>
<tr><td>Identity keys</td><td>Deleted outright, freeing the canonical key — so saving that same fact later counts as new rather than as a duplicate.</td></tr>
<tr><td>Search rows and vectors</td><td>Removed, including every revision-qualified vector artifact ever submitted for that object, not only the current one.</td></tr>
<tr><td>Neighbouring summaries</td><td>Any summary built partly from a deleted fact is rebuilt from the survivors in the same operation, not on a later pass.</td></tr>
<tr><td>A deletion tombstone</td><td>Written and kept: a receipt naming the kind, up to 200 ids, the count, who asked, and the project scope. Readable from <code>GET /v1/receipts</code>.</td></tr>
<tr><td>Jobs and the extraction ledger</td><td>Kept for audit. Consumed runs are marked retired, and enumeration never trusts those marks again — a row whose run was marked deleted is still discoverable if it is still live.</td></tr>
</table>
<p>What survives is bookkeeping that carries no memory content. That is what lets a later preview honestly answer &ldquo;nothing left&rdquo;.</p>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>bad_request</code></td><td>The path id has no recognised prefix.</td></tr>
<tr><td>400</td><td>a sentence in <code>error</code>, with <code>field: "source"</code></td><td><code>source</code> is not 1–64 characters, or contains control characters. This one door reports the problem as a sentence in <code>error</code> rather than a code.</td></tr>
<tr><td>400</td><td><code>userId is required</code></td><td>A legacy operator credential with no memory space named.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential. The message hints at what kind of secret you actually sent.</td></tr>
<tr><td>403</td><td><code>insufficient_scope</code></td><td>The token does not carry <code>memory:write</code>.</td></tr>
<tr><td>403</td><td><code>forbidden</code> with <code>capability: "project.memory.delete"</code></td><td>The scope was fine; the project role was not.</td></tr>
<tr><td>404</td><td><code>not_found</code></td><td>Single delete only: the object does not exist, is not in this memory space, or is already deleted. All three answer the same way, so deleting twice is a <code>404</code>, not a second <code>200</code>.</td></tr>
<tr><td>429</td><td><code>too_many_requests</code></td><td>The <code>delete</code> bucket tripped. The body names the bucket; honour <code>retry-after</code>.</td></tr>
<tr><td>500</td><td><code>something_went_wrong</code></td><td>Reported automatically on our side. Quote the <code>x-request-id</code>.</td></tr>
</table>
<p>Bulk deletes never 404 and never report a partial failure: a filter that matches nothing is a successful delete of zero rows.</p>

<h2>Where to go next</h2>
${nextSteps([
	["#/concepts/delete", "Delete & erasure", "The two contracts, and what a cancelled save looks like."],
	["#/guides/versions", "Corrections, history, and rollback", "Correcting a wrong memory keeps history; deleting it does not."],
	["#/guides/export", "Export and delete your data", "Take a copy before you erase one."],
	["#/api/errors", "Errors", "Every code and what to do about it."],
])}
` };

PAGES["/api/receipts"] = { title: "GET /v1/receipts", html: `
<h1>GET /v1/receipts</h1>
<p class="lede">The ledger of what every accepted write and lookup actually did, newest first — the endpoint you call to answer &ldquo;did that really save?&rdquo;.</p>

<table>
<tr><th>Method</th><td><code>GET</code></td></tr>
<tr><th>Path</th><td><code>${ORIGIN}/v1/receipts</code></td></tr>
<tr><th>Auth</th><td>API key or MCP link as <code>Authorization: Bearer</code>, or a signed-in session</td></tr>
<tr><th>Scope</th><td><code>memory:read</code> (also satisfied by <code>memory:write</code>)</td></tr>
<tr><th>Rate bucket</th><td>None. This route has no bucket of its own.</td></tr>
<tr><th>Ordering</th><td><code>created_at</code> descending. Newest first, always.</td></tr>
<tr><th>Pagination</th><td>None. <code>limit</code> is the whole model &mdash; no cursor, no total, no offset.</td></tr>
</table>

<p>A receipt is the durable record of one operation: which door it came through, what it wrote, what it refused, and what it cost. This page is the transport contract. For what the fields <i>mean</i> &mdash; the refusal vocabulary, the merge audit, what a receipt deliberately never contains &mdash; see <a href="#/concepts/receipts">Receipts &amp; rules</a>.</p>

<h2>Request</h2>
${codeBlock(`curl "${ORIGIN}/v1/receipts?limit=20" \\
  -H "authorization: Bearer $ITSUKI_API_KEY"`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>userId</code></td><td>query string</td><td>No</td><td>Reads the ledger of one of your end users' isolated memory spaces instead of the account's own. Required when you authenticate with the legacy <code>x-api-key</code> header, which has no memory space of its own.</td></tr>
<tr><td><code>limit</code></td><td>query integer</td><td>No</td><td>Default <code>50</code>, capped at <code>200</code>. Rows are taken from the newest end.</td></tr>
</table>
<p>There are no other parameters. In particular there is no filter on <code>outcome</code>, <code>source</code>, <code>source_packet_id</code> or date range, and no project filter &mdash; filter client-side after you fetch.</p>

<div class="note"><b><code>limit</code> is clamped at the top only.</b> Values above 200 become 200. Below that the value is passed through without validation: there is no lower bound and no rejection of a non-numeric value, so <code>limit=abc</code> is not a <code>400</code> &mdash; it produces an unspecified result rather than an error. Send a whole number between 1 and 200.</div>

<h2>Response</h2>
${outputBlock(`{
  "receipts": [
    {
      "id": "receipt_9d3f21ac",
      "user_id": "acct_7ba91f",
      "source": "save_memory",
      "source_mode": "manual_direct",
      "outcome": "wrote",
      "summary": "Saved: 1 node (Postgres), 2 slices, 1 event. Skipped: 2 (weak maybe, pronoun/filler). Receipt: run_1c9d40e2.",
      "saved_total": 4,
      "saved_nodes": 1,
      "saved_slices": 2,
      "saved_events": 1,
      "saved_edges": 0,
      "saved_pages": 0,
      "saved_candidates": 0,
      "updated_nodes": 0,
      "skipped": 2,
      "received": 1,
      "digested": 1,
      "matched": null,
      "latency_ms": 3410,
      "source_packet_id": "src_4f3a8c21",
      "idempotency_key": "message:manual_direct:default:uml:chat-42:8c1d…",
      "extraction_run_id": "run_1c9d40e2",
      "scope_json": null,
      "ai_calls": 3,
      "ai_input_tokens": 1840,
      "ai_output_tokens": 216,
      "ai_neurons": 12.4,
      "created_at": 1756300800000,
      "detail": "{\\"outcome\\":\\"wrote\\",\\"saved\\":{…},\\"skippedReasons\\":{…},\\"actions\\":{…}}"
    },
    {
      "id": "receipt_door_src_2b70e455",
      "source": "recall",
      "source_mode": "bounded_recall",
      "outcome": "recalled",
      "summary": "Memory lookup completed — recalled context was returned to the caller.",
      "saved_total": 0,
      "matched": 2,
      "latency_ms": 214,
      "source_packet_id": "src_2b70e455",
      "created_at": 1756300712000,
      "detail": "{…}"
    }
  ]
}`)}
<p>Every row carries the same column set; the second row above is abridged for length.</p>

<div class="warn"><b>The envelope is not the usual one.</b> The body is <code>{ "receipts": [ … ] }</code> with no <code>ok: true</code> and no <code>count</code>, and the rows are the stored ledger rows verbatim &mdash; flat <code>snake_case</code> columns, not the nested camel-case receipt object a save returns. Nothing is reshaped for you, and <code>detail</code> is a <b>string</b>: call <code>JSON.parse</code> on it before reading anything inside.</div>

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>outcome</code></td><td>The verdict. This is the field to branch on; every value is listed below.</td></tr>
<tr><td><code>summary</code></td><td>The human one-liner the save tool returned. Safe to display, not contractual &mdash; never parse it.</td></tr>
<tr><td><code>source</code> · <code>source_mode</code></td><td>Which door and which mode produced the row.</td></tr>
<tr><td><code>saved_total</code></td><td>Everything the write changed: new objects, reinforced objects and superseded ones. Not a count of new rows.</td></tr>
<tr><td><code>saved_nodes</code> · <code>saved_slices</code> · <code>saved_events</code> · <code>saved_edges</code> · <code>saved_pages</code> · <code>saved_candidates</code> · <code>updated_nodes</code></td><td>The per-kind breakdown behind <code>saved_total</code>.</td></tr>
<tr><td><code>skipped</code></td><td>How many proposed objects the gates refused. The reason histogram is in <code>detail.skippedReasons</code>, not in a column.</td></tr>
<tr><td><code>received</code> · <code>digested</code></td><td>Messages taken in, and messages that reached the extractor.</td></tr>
<tr><td><code>matched</code></td><td>On a lookup row, how many items recall returned. Null on writes.</td></tr>
<tr><td><code>latency_ms</code></td><td>How long the memory work took. Null when the caller did not measure it.</td></tr>
<tr><td><code>source_packet_id</code></td><td>The handle a write returned. This is what ties a ledger row back to your <code>POST /v1/save</code> call and to <code>GET /v1/packets/&lt;id&gt;/status</code>.</td></tr>
<tr><td><code>extraction_run_id</code></td><td>The extraction run behind a <code>wrote</code> row, prefixed <code>run_</code>. Null when no extraction ran.</td></tr>
<tr><td><code>idempotency_key</code></td><td>The key this write was deduplicated on &mdash; yours if you sent one, otherwise the derived form shown above.</td></tr>
<tr><td><code>scope_json</code></td><td>The resolved memory scope, serialized. <b>This is where the project lives</b> &mdash; there is no <code>project_id</code> column on the ledger.</td></tr>
<tr><td><code>ai_calls</code> · <code>ai_input_tokens</code> · <code>ai_output_tokens</code> · <code>ai_neurons</code></td><td>Model rollups for this one operation. Null when nothing was metered.</td></tr>
<tr><td><code>detail</code></td><td>The complete receipt object, serialized as a JSON string. Everything not flattened into a column is here: <code>saved.newNodeLabels</code>, <code>skippedReasons</code>, <code>merges</code>, and the full <code>actions</code> audit with the id of every object created.</td></tr>
<tr><td><code>created_at</code></td><td>Unix milliseconds. The sort key.</td></tr>
</table>

<div class="note"><b>Reads are in the ledger too.</b> This is not a save log. Lookups are recorded here as <code>source: "recall"</code> with outcome <code>recalled</code> or <code>no_recall</code>, deletions as <code>source: "delete"</code> with outcome <code>deleted</code>. If you are counting saves, filter on <code>source</code> or <code>outcome</code> rather than counting rows. The recall rows are content-free: the query text itself is never stored.</div>

<h2>Every outcome, and what it means for you</h2>
<p>Group these into four decisions: memory landed, memory did not land and that is fine, memory did not land and you may retry, memory will never land.</p>

<h3>Memory landed</h3>
<table>
<tr><th>Outcome</th><th>What it means for the caller</th></tr>
<tr><td><code>wrote</code></td><td>A plan was approved and committed. Read <code>saved_total</code> for how much &mdash; it can be small, but it is never zero on this outcome.</td></tr>
<tr><td><code>promoted_from_candidate</code></td><td>Something previously held in the waiting room was confirmed into memory.</td></tr>
<tr><td><code>deleted</code></td><td>An audit tombstone for a deletion. <code>detail</code> names the kind, the ids and the credential that asked.</td></tr>
<tr><td><code>recalled</code> · <code>no_recall</code></td><td>Lookup rows. Never phrased as a save, and <code>saved_total</code> is always 0.</td></tr>
</table>

<h3>Accepted, verdict still coming</h3>
<p>These are door rows, written the moment a write is taken in and before extraction finishes. They are not final.</p>
<table>
<tr><th>Outcome</th><th>What it means for the caller</th></tr>
<tr><td><code>accepted</code></td><td>The write is durable and extraction is processing. Poll the packet for the terminal state.</td></tr>
<tr><td><code>accumulating</code></td><td>Taken in but held &mdash; the trigger is waiting for more context before it fires. Not a rejection.</td></tr>
<tr><td><code>staged</code></td><td>The same idea on the MCP lane: receipt first, enrichment after.</td></tr>
<tr><td><code>duplicate</code></td><td>An exact idempotent replay. The original verdict stands and nothing new was written.</td></tr>
</table>

<h3>Nothing written, and that is a real answer</h3>
<table>
<tr><th>Outcome</th><th>What it means for the caller</th></tr>
<tr><td><code>meaningful_no_write</code></td><td>Extraction ran, looked, and found nothing durable. A verdict, not a failure.</td></tr>
<tr><td><code>ignored</code></td><td>No durable learning signal &mdash; chatter, a question, or a repeat.</td></tr>
<tr><td><code>no_write</code></td><td>With reason <code>user_opt_out</code>: the content asked not to be remembered.</td></tr>
<tr><td><code>excluded_by_rule</code></td><td>Your admission rules refused it. Deterministic, and it cannot be overridden by the model.</td></tr>
<tr><td><code>suppressed</code></td><td>You rejected this label before, so it is not offered again.</td></tr>
</table>

<h3>Failed or cancelled</h3>
<table>
<tr><th>Outcome</th><th>What it means for the caller</th></tr>
<tr><td><code>llm_failed</code></td><td>The extractor returned nothing readable. Retryable.</td></tr>
<tr><td><code>db_write_failed</code></td><td>A storage error interrupted the save. Retryable.</td></tr>
<tr><td><code>interrupted_unknown</code></td><td>The provider outcome is unknown and the model was <b>not</b> called again. Terminal on purpose: a blind replay could double-write.</td></tr>
<tr><td><code>provider_terminal</code></td><td>The provider refused a safe retry; the model was not called again.</td></tr>
<tr><td><code>extraction_failed_terminal</code> · <code>enrich_failed</code></td><td>Terminal extraction or MCP-enrichment failure.</td></tr>
<tr><td><code>too_large</code> · <code>queue_full</code></td><td>The MCP lane refused the work on size or backpressure. Resend smaller, or later.</td></tr>
<tr><td><code>cancelled_by_delete</code> · <code>cancelled_by_retention</code></td><td>A confirmed deletion or a retention boundary superseded accepted work. Terminal, never retried &mdash; the erasure wins.</td></tr>
</table>

<div class="note"><b><code>outcome</code> and <code>status</code> are different fields.</b> <code>outcome</code> is the verdict and is always present. A <code>status</code> field appears inside <code>detail</code> only on door and MCP-lane rows, where it mirrors the job status. A normal <code>wrote</code> row has no <code>status</code>, so treat its absence as normal rather than as missing data.</div>

<h2>The two closed dimensions</h2>
<table>
<tr><th>Field</th><th>Values</th></tr>
<tr><td><code>source</code></td><td><code>save_memory</code>, <code>save_conversation</code>, <code>ingest</code>, <code>recall</code>, <code>delete</code>, <code>candidate_review</code>, <code>plugin</code>, <code>ui_test</code></td></tr>
<tr><td><code>source_mode</code></td><td><code>manual_direct</code>, <code>manual_collect</code>, <code>conversation</code>, <code>conversation_collect</code>, <code>turn</code>, <code>ingest</code>, <code>auto_ingest</code>, <code>mcp_save</code>, <code>plugin_auto</code>, <code>playground</code>, <code>scope_observe</code>, <code>recall</code>, <code>bounded_recall</code></td></tr>
</table>
<p>The ledger table is older than these lists and carries no database constraint on either column, so an old or internal row can hold a value outside them. Treat both as strings and have a fallback branch.</p>

<h2>Did that actually save?</h2>
<p>The ledger is the end of a four-step answer, not the whole of it.</p>
<ul>
<li><b>1.</b> <code>POST /v1/save</code> hands you <code>source_packet_id</code> and <code>receipt_id</code>. If <code>processing</code> came back <code>false</code>, the counts in that response are already the final answer and you do not need this endpoint.</li>
<li><b>2.</b> If <code>processing</code> was <code>true</code>, the durable row at that moment is a door receipt with outcome <code>accepted</code>. Reading the ledger immediately tells you the write was taken in, not what became of it.</li>
<li><b>3.</b> Poll <code>GET /v1/packets/&lt;source_packet_id&gt;/status</code> until the job reaches a terminal status &mdash; <code>enriched</code>, <code>failed</code> or <code>completed</code>.</li>
<li><b>4.</b> Then fetch <code>/v1/receipts</code> and match rows on <code>source_packet_id</code> yourself. <code>outcome: "wrote"</code> with <code>saved_total</code> above zero is the only combination that means memory exists.</li>
</ul>

<div class="warn"><b>Do not count rows to count attempts.</b> Door receipt ids are derived from the source packet (<code>receipt_door_&lt;source_packet_id&gt;</code>) and a conflicting id is never overwritten, so an exact retry converges on the first verdict instead of appending a second row. That is what makes the verdict immutable &mdash; and it means a replayed operation reports the <i>original</i> row's <code>latency_ms</code>, which is audit history rather than the timing of your latest call.</div>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>userId is required</code></td><td>A valid legacy <code>x-api-key</code> with no <code>userId</code> query parameter. That credential owns no memory space of its own.</td></tr>
<tr><td>400</td><td><code>invalid_project</code></td><td>The <code>x-itsuki-project</code> header names a project that cannot be resolved. The specific code varies with the failure.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential. The <code>message</code> names the <i>kind</i> of secret you pasted, which is usually the fastest clue.</td></tr>
<tr><td>403</td><td><code>insufficient_scope</code></td><td>The token does not carry <code>memory:read</code> or <code>memory:write</code>.</td></tr>
<tr><td>403</td><td><code>forbidden</code></td><td>Your project role lacks <code>project.memory.read</code>. The body names the capability.</td></tr>
<tr><td>500</td><td><code>something_went_wrong</code></td><td>Reported automatically on our side. Quote the <code>x-request-id</code>.</td></tr>
</table>
<p>There is no <code>404</code> for an empty ledger and no <code>429</code> from this route. A memory space with no history answers <code>200</code> with <code>{ "receipts": [] }</code>.</p>

<h1>GET /v1/jobs</h1>
<p class="lede">Follow an accepted write to its terminal state &mdash; either as a ledger of recent jobs, or as a single lookup on the packet id your save response handed back.</p>

<table>
<tr><th>Method</th><td><code>GET</code></td></tr>
<tr><th>Paths</th><td><code>${ORIGIN}/v1/jobs</code> &mdash; the ledger for one memory space<br><code>${ORIGIN}/v1/packets/&lt;id&gt;/status</code> &mdash; the one job behind one accepted write</td></tr>

<tr><th>Scope</th><td><code>memory:read</code></td></tr>
