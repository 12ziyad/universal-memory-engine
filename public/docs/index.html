<p>Paging is keyset-based and newest-first: pass the <code>next_cursor</code> you were handed back as <code>cursor=</code>. A <code>None</code> cursor means you are on the last page.</p>

<div class="note"><b>Capture rules are account-wide.</b> <code>get_rules()</code> and <code>set_rules()</code> govern every end-user memory space under the key, even when you pass <code>user_id</code>. There is no per-tenant rule set.</div>

<h2>Correcting a memory</h2>
<p>Every edit is a revision, and every edit must name the revision it expects. That is why <code>expected_revision</code> is a mandatory keyword argument here rather than an option — the signature makes the precondition unskippable, so you cannot reach the server's <code>428 precondition_required</code> from this client.</p>

<table>
<tr><th>Method</th><th>Sends</th></tr>
<tr><td><code>update(memory_id, fields, *, expected_revision, reason=None, idempotency_key=None)</code></td><td><code>PATCH /v1/memories/&lt;id&gt;</code></td></tr>
<tr><td><code>history(memory_id, *, cursor=None, limit=None)</code></td><td><code>GET /v1/memories/&lt;id&gt;/history</code></td></tr>
<tr><td><code>rollback(memory_id, to_revision, *, expected_revision, reason=None, idempotency_key=None)</code></td><td><code>POST /v1/memories/&lt;id&gt;/rollback</code></td></tr>
</table>

<p>Which fields you may set depends on what kind of object you are editing:</p>
<table>
<tr><th>Kind</th><th>Editable fields</th></tr>
<tr><td><code>node</code></td><td><code>label</code>, <code>category</code>, <code>summary</code></td></tr>
<tr><td><code>page</code></td><td><code>title</code>, <code>short_summary</code>, <code>full_markdown</code></td></tr>
<tr><td><code>slice</code></td><td><code>text</code>, <code>kind</code></td></tr>
<tr><td><code>event</code></td><td><code>text</code>, <code>importance</code>, <code>happened_at</code></td></tr>
</table>
<p>Anything else is refused by name with a <code>400 invalid_field</code> that lists what was allowed. Candidates and edges cannot be updated at all.</p>

${codeBlock(`current = memory.get_memory("node_7c…")
revision = current["memory"]["revision"]

result = memory.update(
    "node_7c…",
    {"summary": "learning Kotlin for an Android side project"},
    expected_revision=revision,
    reason="added the why",
)
print(result)`, "Python")}
${outputBlock(`{'ok': True, 'id': 'node_7c…', 'kind': 'node', 'action': 'update',
 'revision': 2, 'previous_revision': 1,
 'projections': {'search': 'pending', 'vector': 'pending'}}`, "Output")}

<p>If the object moved under you, nothing is overwritten: the call raises <code>MemoryAPIError</code> with <code>status 412</code>, <code>code "stale_revision"</code>, and a <code>body</code> carrying <code>current_revision</code> so you can re-read and decide. A patch whose values are already correct returns <code>{'ok': True, 'noop': True, …}</code> rather than inventing a revision.</p>

<p><code>rollback()</code> restores a historical revision <b>as a new forward revision</b> — history is appended to, never rewound. Rolling an object at revision 3 back to revision 1 lands you on revision 4 with <code>rolled_back_to: 1</code>. <code>expected_revision</code> must be the current head, not the revision you are restoring.</p>

${codeBlock(`past = memory.history("node_7c…", limit=10)
print([(r["revision"], r["action"]) for r in past["revisions"]])

memory.rollback("node_7c…", to_revision=1, expected_revision=past["current_revision"])`, "Python")}
${outputBlock(`[(3, 'update'), (2, 'update'), (1, 'baseline')]`, "Output")}

<div class="note"><b>Both of these mint an idempotency key for you.</b> If you omit <code>idempotency_key</code>, the client generates one — which is what makes <code>update</code> and <code>rollback</code> the only writes that retry safely without you doing anything. Pass your own key when a retry must be a true replay across a process restart, not a second edit.</div>

<h2>Deleting</h2>
<table>
<tr><th>Method</th><th>Sends</th><th>Notes</th></tr>
<tr><td><code>delete(memory_id)</code></td><td><code>DELETE /v1/memories/&lt;id&gt;</code></td><td>One object. Its revision history goes with it.</td></tr>
<tr><td><code>delete_by_source(source=None, before=None, after=None, confirm=False)</code></td><td><code>DELETE /v1/memories</code></td><td><b>A dry run unless <code>confirm=True</code>.</b> <code>before</code> and <code>after</code> are unix-millisecond bounds.</td></tr>
</table>

${codeBlock(`preview = memory.delete_by_source(source="slack-import")
print(preview)`, "Python")}
${outputBlock(`{'ok': True, 'dry_run': True,
 'would_delete': {'nodes': 3, 'pages': 1, 'slices': 6, 'events': 2}}`, "Output")}

<p>Read the preview, then repeat the identical call with <code>confirm=True</code>. A scoped delete (by source, by window, or both) is curation and leaves accepted-but-unfinished writes alone. An unscoped confirmed delete is an erasure: it records a barrier and cancels work already in flight, which is where those <code>cancelled_by_delete</code> jobs come from.</p>

<h2>Options, and how they reach the wire</h2>
<p>You write snake_case; the API speaks camelCase. The client translates, which is what stops <code>add(..., user_id="alice")</code> from arriving as an unrecognised key and being silently dropped.</p>

<table>
<tr><th>Python option</th><th>Wire field</th></tr>
<tr><td><code>user_id</code>, <code>external_user_id</code>, <code>end_user_id</code>, <code>tenant_id</code></td><td><code>userId</code></td></tr>
<tr><td><code>conversation_id</code> · <code>thread_id</code> · <code>source_id</code> · <code>run_id</code></td><td><code>conversationId</code> · <code>threadId</code> · <code>sourceId</code> · <code>runId</code></td></tr>
<tr><td><code>idempotency_key</code> · <code>capture_density</code> · <code>recent_context</code> · <code>metadata_only</code></td><td><code>idempotencyKey</code> · <code>captureDensity</code> · <code>recentContext</code> · <code>metadataOnly</code></td></tr>
<tr><td><code>memory_scope</code> · <code>recall_scope</code> · <code>source_scope</code> · <code>content_scope</code></td><td><code>memoryScope</code> · <code>recallScope</code> · <code>sourceScope</code> · <code>contentScope</code></td></tr>
</table>

<p>Sending two spellings of the same thing is an error, not a coin flip: <i>"'user_id' and 'userId' mean the same thing — pass only one."</i></p>

<h3>Common options</h3>
<p>Accepted by every write and by <code>search</code>: <code>user_id</code>, <code>memory_scope</code>, <code>source_scope</code>, <code>conversation_id</code>, <code>thread_id</code>, <code>source_id</code>, <code>idempotency_key</code>, <code>source</code>, <code>capture_density</code>, <code>rules</code>. Beyond those:</p>
<table>
<tr><th>Method</th><th>Also accepts</th></tr>
<tr><td><code>add</code>, <code>add_conversation</code></td><td><code>scope</code> (<code>"full"</code>, <code>"lastN"</code>, <code>"topic"</code>, <code>"summary"</code>), <code>n</code>, <code>topic</code>, <code>recent_context</code>, <code>content_scope</code></td></tr>
<tr><td><code>search</code></td><td><code>topic</code>, <code>limit</code>, <code>recall_scope</code></td></tr>
<tr><td><code>turn</code></td><td><code>query</code>, <code>recall_scope</code></td></tr>
<tr><td><code>ingest</code></td><td><code>flush</code>, <code>delivery</code></td></tr>
</table>
<p>A key the method owns cannot be passed as an option — <code>content</code>, <code>messages</code>, <code>mode</code> and <code>query</code> are rejected rather than smuggled into the body.</p>

<h3>Scoping to a project</h3>
<p>Projects are metadata inside one account, not separate end users. <code>recall_scope</code> is one of <code>"global"</code> (the server default), <code>"project_only"</code> or <code>"project_then_global"</code>.</p>
${codeBlock(`scope = {"projectId": "atlas", "projectName": "Atlas"}

memory.add("Atlas deploys from main.", memory_scope=scope)
memory.search("How does Atlas deploy?", memory_scope=scope, recall_scope="project_then_global")`, "Python")}

<h2>One key, many end users</h2>
<p>Your key is your account. <code>user_id</code> partitions isolated memory spaces inside it — nothing written under one value is reachable from another, on write or on read. Set it once on the client, or per call:</p>

${codeBlock(`alice = MemoryClient(api_key=os.environ["ITSUKI_API_KEY"], user_id="alice")
alice.add("Prefers dark mode.")

memory.add("Prefers dark mode.", user_id="alice")   # same destination
memory.status(user_id="alice")                       # reads use it too`, "Python")}

<p>The argument is a sentinel, not a plain default, and the difference matters:</p>
<table>
<tr><th>What you pass</th><th>What it addresses</th></tr>
<tr><td>Nothing</td><td>The client's own <code>user_id</code>, or the API key owner's root space if the client has none.</td></tr>
<tr><td><code>user_id="alice"</code></td><td>That tenant, overriding the client default for this call.</td></tr>
<tr><td><code>user_id=None</code> explicitly</td><td>The API key owner's root space — even on a client that carries a default tenant.</td></tr>
</table>

<p>On a body endpoint the tenant is resolved once, from one authority. Setting it both as a keyword and inside the options raises <i>"user_id was provided twice"</i> rather than sending contradictory ids. The value you send is hashed with the owning account before it becomes a storage key, so <code>alice</code> under your account and <code>alice</code> under someone else's are different spaces.</p>

<h2>Errors</h2>
<p>There is exactly one exception class, and it covers all three kinds of failure: a non-2xx response, a transport failure, and a local argument that never left your process. There are no subclasses — branch on the attributes.</p>

<table>
<tr><th>Attribute</th><th>Holds</th></tr>
<tr><td><code>.status</code></td><td>The HTTP status, or <code>0</code> for a transport or local failure.</td></tr>
<tr><td><code>.code</code></td><td>The stable error code — the server's, or a local one. May be <code>None</code>.</td></tr>
<tr><td><code>.body</code></td><td>The parsed response JSON, including non-object JSON. This is where <code>current_revision</code>, <code>retry_after_s</code> and friends live.</td></tr>
<tr><td><code>.retry_after</code></td><td>Seconds, parsed from the <code>Retry-After</code> header — both the numeric form and the HTTP-date form.</td></tr>
</table>

<table>
<tr><th>Local code</th><th>Status</th><th>Raised when</th></tr>
<tr><td><code>invalid_argument</code></td><td><code>0</code></td><td>Any argument the client validated and refused. No request was sent.</td></tr>
<tr><td><code>timeout</code></td><td><code>0</code></td><td>The operation budget ran out. Message reads <i>request timed out after 30s</i>.</td></tr>
<tr><td><code>transport_error</code></td><td><code>0</code></td><td>The connection failed. Message reads <i>request failed:</i> followed by the underlying exception.</td></tr>
</table>

${codeBlock(`from ${PRODUCT.pkg} import MemoryAPIError

try:
    memory.add(text, idempotency_key=key)
except MemoryAPIError as error:
    if error.status == 429:
        sleep_for = error.retry_after or 30
        ...
    elif error.status == 0:
        # never reached the service — safe to retry with the same key
        ...
    else:
        print(error.status, error.code, error.body)
    raise`, "Python")}

<p>For an API error the message is the response <code>message</code> field, falling back to <code>error</code>, falling back to a constructed line naming the method, path and status. <a href="#/api/errors">Errors</a> lists every code the service returns.</p>

<h2>Retries, timeouts and idempotency</h2>
<p>Both clients share one decision core, so sync and async cannot drift on any of this.</p>

<table>
<tr><th>Call</th><th>Retried?</th></tr>
<tr><td>Any <code>GET</code> — every read method</td><td>Yes, always.</td></tr>
<tr><td>A <code>POST</code> or <code>PATCH</code> carrying <code>idempotencyKey</code></td><td>Yes. <code>update</code> and <code>rollback</code> always qualify, because the client mints a key when you omit one.</td></tr>
<tr><td>A write without an idempotency key</td><td><b>No.</b> Attempted exactly once.</td></tr>
<tr><td>Any <code>DELETE</code></td><td>No. Deletes carry no body and are never replayed for you.</td></tr>
</table>

<p>When a call is retryable it gets <code>max_retries + 1</code> attempts. Only <code>429</code>, any status of 500 or above, transport failures and per-attempt timeouts are retried; every other non-2xx raises straight away.</p>

<table>
<tr><th>Attempt</th><th>Sleep before it</th></tr>
<tr><td>Retry 1</td><td>0.25–0.35 s</td></tr>
<tr><td>Retry 2</td><td>0.5–0.6 s</td></tr>
<tr><td>Retry 3</td><td>1.0–1.1 s</td></tr>
</table>

<p>That is 0.25 seconds doubled per attempt plus up to 100 ms of jitter. A parseable <code>Retry-After</code> from the server overrides the computed delay entirely. Every sleep is clamped to what is left of the client <code>timeout</code>, and the loop stops when the budget is gone — so <code>timeout</code> is a hard ceiling on the whole operation, not a per-attempt allowance. Size it accordingly: <code>max_retries=10</code> on a 30-second budget will run out of time long before it runs out of attempts.</p>

<h2>Async</h2>
<p><code>AsyncMemoryClient</code> exposes the same methods with the same signatures, each as <code>async def</code>. It is not a wrapper — both drivers execute the same plan and differ only in transport.</p>

${codeBlock(`import asyncio
import os

from ${PRODUCT.pkg} import AsyncMemoryClient

async def main():
    async with AsyncMemoryClient(api_key=os.environ["ITSUKI_API_KEY"]) as memory:
        result = await memory.search("what am I learning?")
        print(result["context"])

asyncio.run(main())`, "Python")}

<p>Lifecycle differs only in the close call: the sync client has <code>.close()</code> and works as <code>with MemoryClient(key) as memory:</code>; the async client has <code>await .aclose()</code> and <code>async with</code>.</p>

<div class="note"><b>Import the async names explicitly.</b> <code>AsyncMemoryClient</code> and <code>AsyncMemory</code> are public and documented, but they are not listed in the module's <code>__all__</code> — so <code>from ${PRODUCT.pkg} import *</code> will not bring them in. <code>from ${PRODUCT.pkg} import AsyncMemoryClient</code> works fine.</div>

<h2>Known gaps</h2>
<ul>
<li><code>jobs()</code> has a fixed signature and does not accept the server's <code>cancelled</code> filter — passing it raises <code>TypeError</code>. Filter locally on <code>cancelled_by_delete</code>, or call <code>GET /v1/jobs?cancelled=true</code> directly with httpx.</li>
<li>The two SDKs are not symmetric. Python has <code>list_memories()</code> and <code>get_memory()</code>; the <a href="#/sdk/js">JavaScript client</a> does not. JavaScript ships long-form <code>updateMemory</code> / <code>memoryHistory</code> / <code>rollbackMemory</code> aliases; Python ships only the short <code>update</code> / <code>history</code> / <code>rollback</code>.</li>
<li>The bundled README's final section describes an older release preparation and does not match the version you install. <code>${PRODUCT.pkg}.VERSION</code> is the authority.</li>
</ul>

<h2>When it doesn't work</h2>
<table>
<tr><th>What you see</th><th>What it means</th><th>Fix</th></tr>
<tr><td><code>ModuleNotFoundError: No module named '${PRODUCT.pkg}'</code></td><td>Installed into a different interpreter than the one running your script.</td><td>Install through the same Python: <code>python -m pip install ${PRODUCT.pkg}</code>.</td></tr>
<tr><td><code>MemoryAPIError: api_key is required</code></td><td>Empty, <code>None</code>, or not a string. <code>.status</code> is <code>0</code> — nothing was sent.</td><td>Check the environment variable actually reached the process.</td></tr>
<tr><td><code>base_url must be an origin without a path, query, or fragment</code></td><td>You passed a full endpoint rather than an origin.</td><td>Pass <code>${ORIGIN}</code>, not <code>${ORIGIN}/v1</code>.</td></tr>
<tr><td><code>base_url must use HTTPS (HTTP is allowed only for loopback development)</code></td><td>Plain HTTP to a non-loopback host.</td><td>Use HTTPS. <code>http://localhost:8787</code> is accepted for local work.</td></tr>
<tr><td><code>'user_id' and 'userId' mean the same thing — pass only one.</code></td><td>Both spellings of one field in the same call.</td><td>Keep the snake_case one and drop the other.</td></tr>
<tr><td><code>add() needs content='…' or messages=[…]</code></td><td><code>add()</code> was called with no primary argument.</td><td>Pass a sentence positionally, or a message list as <code>messages=</code>.</td></tr>
<tr><td><code>.status == 401</code></td><td>The key is wrong, revoked, or is not the key you think it is.</td><td>Confirm it starts <code>${PRODUCT.tokenPrefix}</code>. See <a href="#/api/auth">Authentication &amp; keys</a>.</td></tr>
<tr><td><code>.status == 403</code>, <code>.code == "insufficient_scope"</code></td><td>Valid key, wrong scope. Deletion is the usual one — <code>memory:write</code> does not imply <code>memory:delete</code>.</td><td>Use a key that carries the scope, or ask a project admin.</td></tr>
<tr><td><code>.status == 412</code>, <code>.code == "stale_revision"</code></td><td>The object changed between your read and your write. Nothing was overwritten.</td><td>Read <code>error.body["current_revision"]</code>, re-read the object, decide, retry.</td></tr>
<tr><td><code>.status == 429</code></td><td>A rate bucket tripped.</td><td>Sleep for <code>error.retry_after</code>, not a fixed guess. See <a href="#/api/limits">Rate limits</a>.</td></tr>
<tr><td><code>.status == 409</code>, <code>.code == "idempotency_conflict"</code></td><td>An idempotency key reused for different content or a different operation.</td><td>Mint a new key. The same key with the same content is a safe replay and returns the original result.</td></tr>
<tr><td><code>MemoryAPIError: request timed out after 30s</code></td><td>The whole-operation budget expired, retries and sleeps included.</td><td>Raise <code>timeout</code>, or lower <code>max_retries</code> so the attempts fit inside it.</td></tr>
</table>

<h1>JavaScript SDK</h1>
<p class="lede">Install the client, save a fact from a Node script, wait for it to settle, and read it back — then keep this page for the full method surface, the real retry numbers, and the one error class behind every failure.</p>

<h2>Install and make the first call</h2>
<ol class="steps">
<li><b>Install the package.</b>

${outputBlock(`added 1 package in 1s`, "npm")}
<p>One package. The client declares no runtime dependencies at all, so nothing else is pulled in with it.</p></li>

<li><b>Make the entry point ESM.</b>

${codeBlock(`{
  "type": "module"
}`, "package.json")}
<p>Or skip this and name the script in step 4 <code>memory.mjs</code>, which is what the rest of this page does.</p></li>

<li><b>Put the key in your environment.</b>

${codeBlock(`export ITSUKI_API_KEY=${PRODUCT.tokenPrefix}your_key_here`, "terminal")}
<p>The SDK itself reads no environment variables. <code>process.env.ITSUKI_API_KEY</code> in the next step is your code's convention, not the client's — you can pass the key from anywhere.</p></li>

<li><b>Write the script.</b>
<p>This is the whole first program: save, wait, read back.</p>
${codeBlock(`import { MemoryClient } from "${PRODUCT.pkg}";

const memory = new MemoryClient({ apiKey: process.env.ITSUKI_API_KEY });

const receipt = await memory.add("I started learning Kotlin this week.", {
  idempotencyKey: memory.newIdempotencyKey(),
});
console.log("summary:", receipt.summary);
console.log("counts: ", receipt.counts);

if (receipt.source_packet_id) {
  const terminal = await memory.waitFor(receipt.source_packet_id);

}

const found = await memory.search("what am I learning?");
console.log("count:  ", found.count);
console.log(found.context);`, "memory.mjs")}</li>

${codeBlock(`node memory.mjs`, "terminal")}
${outputBlock(`summary: Saved: 1 fact(s) across 1 page.
counts:  { received: 1, savedTotal: 2, nodes: 1, slices: 1, skipped: 0 }
status:  enriched

Kotlin — skill
- started learning this week`, "Console")}</li>
</ol>

<h2>Reading that output</h2>
<table>
<tr><th>Line</th><th>What it proves</th></tr>
<tr><td><code>summary</code></td><td>The write was accepted and a receipt came back. It never claims an acceptance that did not happen.</td></tr>
<tr><td><code>counts.savedTotal</code></td><td>How many objects were written. <b>Zero is a legitimate answer</b> — a question, small talk, or a duplicate stores nothing and still returns <code>ok: true</code>.</td></tr>
<tr><td><code>status</code></td><td>The terminal state of the background enrichment: <code>enriched</code>, <code>failed</code>, or the compatibility value <code>completed</code>. Those three are the complete terminal set.</td></tr>
<tr><td><code>context</code></td><td>The prompt-ready block. This is exactly what a connected AI receives, so paste it into a prompt as-is.</td></tr>
</table>

<div class="note"><b>A write returning is not the same as a write finishing.</b> <code>add()</code>, <code>ingest()</code> and <code>addConversation()</code> can be accepted before extraction settles. That is why the script does not go straight to <code>search()</code>: it takes <code>receipt.source_packet_id</code> to <code>waitFor()</code> first. If you skip the wait, an empty recall a second after a save is normal, not an error.</div>

<h2>Constructing the client</h2>
${codeBlock(`const memory = new MemoryClient({
  apiKey: process.env.ITSUKI_API_KEY,
  baseUrl: "${ORIGIN}",
  userId: null,
  timeoutMs: 30000,
  maxRetries: 2,
});`, "JavaScript")}

<table>
<tr><th>Option</th><th>Type</th><th>Default</th><th>Rules the constructor enforces</th></tr>
<tr><td><code>apiKey</code></td><td>string</td><td><b>required</b></td><td>Non-empty, no surrounding whitespace, no control characters.</td></tr>
<tr><td><code>baseUrl</code></td><td>string</td><td><code>${ORIGIN}</code></td><td>Must parse as a URL and use HTTPS, except plain HTTP to a loopback host (<code>localhost</code>, <code>127.x.x.x</code>, <code>::1</code>) for local development. No username, password, path beyond <code>/</code>, query string or fragment. Trailing slashes are stripped.</td></tr>
<tr><td><code>userId</code></td><td>string or <code>null</code></td><td><code>null</code></td><td>The default end-user memory space. A per-call <code>userId</code> overrides it.</td></tr>
<tr><td><code>timeoutMs</code></td><td>number</td><td><code>30000</code></td><td>Finite, at least 1 and at most <code>2147483647</code>. Bounds the <i>whole</i> operation, retry backoff included.</td></tr>
<tr><td><code>maxRetries</code></td><td>number</td><td><code>2</code></td><td>A safe integer from 0 through 10.</td></tr>
</table>

<p>All five survive as readonly public fields on the instance, so <code>memory.baseUrl</code> tells you the origin you are actually talking to. Alongside <code>MemoryClient</code> the package exports <code>Memory</code> as an alias, <code>MemoryClient</code> as the default export, plus <code>MemoryAPIError</code> and a <code>VERSION</code> string. First-party TypeScript declarations ship in the package — no <code>@types</code> install.</p>

<h2>The complete surface</h2>
<p>Every network method returns a promise. Argument and option validation happens <i>synchronously</i>, before any request is sent, so a bad call throws in the same tick rather than after a round trip.</p>

<table>
<tr><th>Method</th><th>HTTP</th><th>Worth knowing</th></tr>
<tr><td><code>add(content, options)</code><br>alias <code>save()</code></td><td>POST /v1/save</td><td><code>content</code> must be a non-empty string.</td></tr>
<tr><td><code>addConversation(messages, options)</code></td><td>POST /v1/save</td><td>Sends <code>mode: "conversation"</code>. The array must not be empty. Messages are oldest first, each a string or an object with <code>content</code> and an optional <code>role</code>.</td></tr>
<tr><td><code>search(query, options)</code><br>alias <code>recall()</code></td><td>POST /v1/recall</td><td><code>result.context</code> is the prompt-ready block; <code>result.items</code> is the ranked shortlist behind it.</td></tr>
<tr><td><code>turn(messages, options)</code></td><td>POST /v1/turn</td><td>Recall and, when your rules allow it, auto-capture in one call. An empty array is rejected unless <code>options.query</code> is a non-empty string.</td></tr>
<tr><td><code>ingest(messages, options)</code></td><td>POST /v1/ingest</td><td>An empty array <i>is</i> allowed here, which is how <code>flush: true</code> flushes held context.</td></tr>
<tr><td><code>packetStatus(id, options)</code></td><td>GET /v1/packets/&lt;id&gt;/status</td><td>The current state of one accepted write. An unknown id is a <code>404</code>, not an empty result.</td></tr>
<tr><td><code>jobs(options)</code></td><td>GET /v1/jobs</td><td><code>status</code> must be one of <code>queued</code>, <code>staged</code>, <code>processing</code>, <code>enriched</code>, <code>failed</code>, <code>completed</code>. Also takes <code>since</code> and <code>limit</code>.</td></tr>
<tr><td><code>waitFor(id, options)</code></td><td>polls packet status</td><td><code>timeoutMs</code> defaults to <code>60000</code>, <code>intervalMs</code> to <code>1500</code>. Each poll runs with retries disabled. See the note below on how it ends.</td></tr>
<tr><td><code>update(id, fields, options)</code><br>alias <code>updateMemory()</code></td><td>PATCH /v1/memories/&lt;id&gt;</td><td><code>options.expectedRevision</code> is <b>required</b>. <code>fields</code> must be a non-empty object.</td></tr>
<tr><td><code>history(id, options)</code><br>alias <code>memoryHistory()</code></td><td>GET /v1/memories/&lt;id&gt;/history</td><td>Newest revision first. Takes <code>cursor</code> and <code>limit</code>.</td></tr>
<tr><td><code>rollback(id, toRevision, options)</code><br>alias <code>rollbackMemory()</code></td><td>POST /v1/memories/&lt;id&gt;/rollback</td><td>Both <code>toRevision</code> and <code>options.expectedRevision</code> must be integers of at least 1.</td></tr>
<tr><td><code>delete(id, options)</code></td><td>DELETE /v1/memories/&lt;id&gt;</td><td>One <code>node_</code>, <code>page_</code>, <code>slice_</code>, <code>event_</code> or candidate id.</td></tr>
<tr><td><code>deleteBySource(options)</code></td><td>DELETE /v1/memories</td><td><b>Dry run unless you pass <code>confirm: true</code>.</b></td></tr>
<tr><td><code>graph()</code> · <code>status()</code> · <code>usage()</code> · <code>receipts()</code> · <code>exportAll()</code></td><td>GET /v1/graph · /v1/status · /v1/usage · /v1/receipts · /v1/export</td><td><code>usage()</code> takes <code>range</code>, one of <code>1d</code>, <code>7d</code>, <code>30d</code>, <code>all</code>, defaulting to <code>30d</code>. <code>receipts()</code> takes <code>limit</code>, defaulting to <code>50</code>.</td></tr>
<tr><td><code>getRules()</code> · <code>setRules(rules)</code></td><td>GET · PUT /v1/rules</td><td>Capture rules are <b>account-wide</b>. They govern every end-user memory under the key, even when the client carries a default <code>userId</code>.</td></tr>
<tr><td><code>newIdempotencyKey()</code></td><td>local</td><td>Returns <code>idem_</code> followed by a random UUID. Available both as a static on <code>MemoryClient</code> and as an instance method.</td></tr>
</table>

<div class="note"><b>Two methods the Python client has and this one does not.</b> There is no <code>listMemories()</code> and no <code>getMemory()</code> here. To read one object by id, call <code>GET /v1/memories/&lt;id&gt;</code> directly — its response carries a strong <code>etag</code> header of the form <code>"r3"</code>, which is that object's current revision. If a method described on this page throws <code>TypeError: memory.rollback is not a function</code>, you have an older build than this page: <code>npm install ${PRODUCT.pkg}</code> resolves whatever the registry currently serves, and the exported <code>VERSION</code> string tells you which one you got.</div>

<h2>Account, end user, and project scope</h2>
<p>The API key identifies the account. <code>userId</code> selects an isolated memory space for one end user of <i>your</i> application — nothing saved under one value is reachable from another, on write or on recall. Omit it and the write lands on the account's own memory.</p>

<p>Set a default on the client, or choose per call:</p>
${codeBlock(`const ada = new MemoryClient({ apiKey: process.env.ITSUKI_API_KEY, userId: "ada" });
await ada.add("Ada's depot is in Porto.");

// or, from the shared client
await memory.add("Grace's depot is in Faro.", { userId: "grace" });
await memory.search("Where is my depot?", { userId: "grace" });
await memory.jobs({ userId: "grace", status: "failed" });`, "JavaScript")}

<p>A per-call value beats the constructor default. Passing <code>userId: null</code> explicitly selects the account root even from a client that normally targets a sub-tenant. On <code>GET</code> and <code>DELETE</code> calls the value travels as a query parameter; on writes it travels in the JSON body.</p>

<h3>Projects are metadata, not tenants</h3>
<p>A project narrows memory <i>inside</i> one memory space. It is not a second tenancy and it does not replace <code>userId</code>.</p>
${codeBlock(`const memoryScope = { projectId: "atlas", projectName: "Atlas" };

await memory.add("Atlas deploys from main.", { memoryScope });

const found = await memory.search("How does Atlas deploy?", {
  memoryScope,
  recallScope: "project_then_global",
});`, "JavaScript")}

<p>Recall defaults to <code>global</code>. <code>project_only</code> reads that one project; <code>project_then_global</code> reads that project plus rows with no project attached. Both non-global modes require <code>memoryScope.projectId</code> and return a <code>400</code> without it.</p>

<div class="note"><b>A scoped recall is a narrower search, not the same search filtered.</b> Full-text and vector matching carry no project attribution, so when <code>recallScope</code> is anything other than <code>global</code> those two lanes are skipped rather than filtered afterwards — the query runs on exact and alias matching, keyword matching, and graph expansion. Filtering a globally-limited list would let a busy project starve the one you asked for. Expect scoped recall to be sharper and narrower.</div>

<h2>Correcting a memory without clobbering anyone</h2>
<p>Updates are optimistic-concurrency only: you must send the revision you read as <code>expectedRevision</code>, and a stale value is refused with the current one rather than overwritten. Because this client has no <code>getMemory()</code>, the revision comes from <code>history()</code>.</p>

${codeBlock(`const past = await memory.history("node_7c1e");
console.log(past.current_revision, past.revisions[0].action);

const updated = await memory.update("node_7c1e", { label: "Kotlin (JVM)" }, {
  expectedRevision: past.current_revision,
  reason: "Disambiguate from the language family",
});
console.log(updated);`, "JavaScript")}

${outputBlock(`3 update
{
  ok: true,
  id: 'node_7c1e',
  kind: 'node',
  action: 'update',
  revision: 4,
  previous_revision: 3,
  projections: { search: 'pending', vector: 'pending' }
}`, "Console")}

<p><code>projections</code> reports the derived indexes catching up to the canonical row — the row is already correct, search and vector converge behind it. A patch that produced identical values comes back <code>noop: true</code> with the revision unchanged.</p>

<p>Rollback restores an old revision as a <b>new forward revision</b>. History is never rewound, so <code>expectedRevision</code> here is the current head, not the target:</p>
${codeBlock(`await memory.rollback("node_7c1e", 2, { expectedRevision: 4, reason: "Bad edit" });
// → revision 5, rolled_back_to: 2`, "JavaScript")}

<p>The server requires an idempotency key on both <code>update()</code> and <code>rollback()</code>; the client mints one for you when you omit <code>idempotencyKey</code>. Editable fields depend on the object: <code>label</code>, <code>category</code>, <code>summary</code> on a node; <code>title</code>, <code>short_summary</code>, <code>full_markdown</code> on a page; <code>text</code>, <code>kind</code> on a slice; <code>text</code>, <code>importance</code>, <code>happened_at</code> on an event.</p>

<h2>Retries, timeouts, and idempotency</h2>
<table>
<tr><th>Behaviour</th><th>What the client actually does</th></tr>
<tr><td>What retries</td><td>Any <code>GET</code>, and any write whose body carries a string <code>idempotencyKey</code>. <b>A write without one is attempted exactly once.</b></td></tr>
<tr><td>How many attempts</td><td><code>maxRetries + 1</code> when retryable, otherwise 1.</td></tr>
<tr><td>What is retried</td><td><code>429</code>, any status of 500 or above, an aborted attempt, and any other transport failure. Every other non-2xx throws immediately.</td></tr>
<tr><td>Backoff</td><td><code>250 * 2 ** (attempt - 1)</code> milliseconds plus up to 100 ms of jitter: 250–350, then 500–600, then 1000–1100.</td></tr>
<tr><td><code>Retry-After</code></td><td>A parsed value on the last error replaces the computed backoff entirely. It is read as seconds, or as an HTTP date.</td></tr>
<tr><td>The budget</td><td><code>timeoutMs</code> is a deadline for the whole operation. Every sleep is clamped to what is left of it, and if a proposed delay would meet or exceed the remainder the loop stops instead of overrunning — so a large server-supplied <code>Retry-After</code> cannot extend your budget.</td></tr>
<tr><td>Redirects</td><td><code>fetch</code> is called with <code>redirect: "error"</code>, so a Bearer key is never followed to a redirect target.</td></tr>
<tr><td>Headers sent</td><td><code>authorization: Bearer &lt;key&gt;</code>, <code>user-agent: itsuki-js/&lt;version&gt;</code>, and <code>content-type: application/json</code> only when there is a body.</td></tr>
</table>

<p>Mint one key per logical write and reuse it only when retrying the <i>same</i> content — the same key with different content is a <code>409</code>:</p>
${codeBlock(`const idempotencyKey = MemoryClient.newIdempotencyKey();
const receipt = await memory.ingest(messages, { flush: true, idempotencyKey });
const terminal = await memory.waitFor(receipt.source_packet_id, {
  timeoutMs: 60000,
  intervalMs: 1500,
});`, "JavaScript")}

<div class="note"><b><code>waitFor()</code> does not throw when it runs out of time.</b> It returns the last packet state it saw with <code>timed_out: true</code> added, so a polling timeout is never mistaken for a job failure. Check that field before you read <code>status</code>. A <code>timeoutMs</code> of <code>0</code> is legal and means exactly one immediate check.</div>

<h2>Deleting</h2>
<p>One known object:</p>
${codeBlock(`await memory.delete("slice_123", { userId: "ada" });`, "JavaScript")}

<p>Bulk deletion is a preview until you say otherwise. Look at the preview before you send the confirmed call:</p>
${codeBlock(`const preview = await memory.deleteBySource({ source: "ingest", userId: "ada" });
console.log(preview.dry_run, "pending jobs:", preview.pending_jobs);
console.log(preview.would_delete);`, "JavaScript")}

${outputBlock(`true pending jobs: 0
{
  runs: 2,
  nodes: 3,
  pages: 1,
  slices: 4,
  events: 6,
  edges: 2,
  candidates: 0
}`, "Console")}

${codeBlock(`if (preview.dry_run) {
  const removed = await memory.deleteBySource({ source: "ingest", userId: "ada", confirm: true });
  console.log(removed.deleted);
}`, "JavaScript")}

<div class="warn"><b><code>deleteBySource()</code> with no filters and <code>confirm: true</code> is an erasure of the whole selected memory space.</b> A filtered delete is curation: saves already in flight are not cancelled and their output lands afterwards, which is why the preview reports <code>pending_jobs</code>. An unfiltered confirmed delete records a barrier and cancels accepted work that has not yet committed, so nothing you erased can reappear.</div>

<p>A save that your own erasure cancelled settles as <code>status: "failed"</code> carrying <code>cancelled_by_delete: true</code> and <code>outcome_reason: "cancelled_by_delete"</code>. It stays <code>failed</code> rather than becoming a fourth terminal word, because every released client treats <code>enriched</code>, <code>failed</code> and <code>completed</code> as the complete terminal set and a new value would make an older client poll forever. <b>Do not retry a cancelled save</b> — the barrier applies to that original work, so the retry is cancelled the same way. Submit it as a new save instead.</p>

<p>Separate real failures from your own erasures on the field:</p>
${codeBlock(`const failed = await memory.jobs({ userId: "ada", status: "failed" });
const broken = failed.jobs.filter((job) => !job.cancelled_by_delete);  // investigate
const erased = failed.jobs.filter((job) => job.cancelled_by_delete);   // expected`, "JavaScript")}

<p>The API also accepts a server-side filter, <code>GET /v1/jobs?cancelled=true</code>. This client cannot send it: <code>jobs()</code> validates its options against a fixed list and rejects <code>cancelled</code> as unsupported. That is a client limitation, not a server one — filter locally as above, or call the endpoint with plain <code>fetch</code>.</p>

<h2>Errors</h2>
<p>There is exactly one error class. Every HTTP failure, timeout, transport failure and local validation failure throws <code>MemoryAPIError</code>.</p>
${codeBlock(`import { MemoryAPIError } from "${PRODUCT.pkg}";

try {
  await memory.packetStatus("missing-packet");
} catch (error) {
  if (error instanceof MemoryAPIError) {
    console.error(error.status, error.code, error.message);
  }
}`, "JavaScript")}

${outputBlock(`404 not_found No accepted write with that source_packet_id.`, "Console")}

<table>
<tr><th>Field</th><th>What is in it</th></tr>
<tr><td><code>status</code></td><td>The HTTP status, or <code>0</code> for anything that never reached a response — local validation, a timeout, a transport failure.</td></tr>
<tr><td><code>code</code></td><td>The response's machine-readable <code>code</code>, else its <code>error</code> value, else <code>null</code>. Locally: <code>invalid_argument</code>, <code>timeout</code>, or <code>transport_error</code>.</td></tr>
<tr><td><code>body</code></td><td>The parsed error response when there was one, otherwise <code>null</code>.</td></tr>
<tr><td><code>retryAfterMs</code></td><td>A parsed <code>Retry-After</code> delay in milliseconds when the server sent one, otherwise <code>null</code>. You do not have to act on it for a retryable call — the client already has.</td></tr>
</table>

<p>The message is the response's <code>message</code>, else its <code>error</code>, else a constructed fallback such as <code>GET /v1/jobs failed with 503</code>.</p>

<h2>When it doesn't work</h2>
<table>
<tr><th>What you see</th><th>What it means</th><th>Fix</th></tr>
<tr><td><code>apiKey must be a non-empty string</code></td><td>Thrown by the constructor. <code>process.env.ITSUKI_API_KEY</code> was undefined.</td><td>Export the key in the same shell that runs <code>node</code>.</td></tr>
<tr><td><code>apiKey must not have surrounding whitespace or control characters</code></td><td>Usually a trailing newline from reading the key out of a file.</td><td>Trim the value before passing it.</td></tr>
<tr><td><code>Cannot use import statement outside a module</code></td><td>The package is ESM only and your file is being parsed as CommonJS.</td><td>Add <code>"type": "module"</code> to <code>package.json</code>, rename the file to <code>.mjs</code>, or load it with <code>await import(...)</code>.</td></tr>
<tr><td><code>baseUrl must use HTTPS except for loopback development</code></td><td>Plain HTTP to a remote host is refused so a Bearer key cannot be sent in cleartext.</td><td>Use HTTPS, or point at <code>localhost</code> / <code>127.0.0.1</code> for local work.</td></tr>
<tr><td><code>baseUrl must not contain credentials, a path, a query string, or a fragment</code></td><td>You passed something like <code>${ORIGIN}/v1</code>.</td><td>Pass the bare origin. The client appends the paths itself.</td></tr>
<tr><td><code>jobs options.cancelled is not supported</code></td><td>An unknown option key. Each option-taking method validates against a fixed list, so a typo cannot silently select the wrong memory space.</td><td>Check the spelling against the surface table. For <code>cancelled</code> specifically, filter locally.</td></tr>
<tr><td><code>add options.content is set by the method argument</code></td><td>You put a method-owned key (<code>content</code>, <code>messages</code>, <code>mode</code>, <code>query</code>) in the options object.</td><td>Pass it as the positional argument instead.</td></tr>
<tr><td><code>request timed out after 30000ms</code>, <code>code: "timeout"</code></td><td>The whole budget elapsed — attempts and backoff together, not one attempt.</td><td>Raise <code>timeoutMs</code>, or lower <code>maxRetries</code> so a single attempt gets more of the budget.</td></tr>
<tr><td><code>expectedRevision must be a safe integer greater than or equal to 1</code></td><td>You called <code>update()</code> or <code>rollback()</code> without the revision you read.</td><td>Read <code>current_revision</code> from <code>history()</code> first.</td></tr>
<tr><td><code>401</code> with a message guessing at the credential you sent</td><td>The key was not usable. The server recognises a URL, an OpenAI-style key and a webhook secret by shape and says so.</td><td>Check the value starts with <code>${PRODUCT.tokenPrefix}</code>. See <a href="#/api/auth">Authentication &amp; keys</a>.</td></tr>
<tr><td><code>429 too_many_requests</code></td><td>A rate bucket tripped and the client exhausted its retries on it.</td><td><code>error.retryAfterMs</code> holds the parsed delay — wait that long rather than a fixed amount. See <a href="#/api/limits">Rate limits</a>.</td></tr>
<tr><td><code>412 stale_revision</code></td><td>Someone wrote to that object between your read and your update. Nothing was overwritten.</td><td>The body carries <code>current_revision</code>. Re-read, reapply your change on top, retry.</td></tr>
<tr><td><code>409 idempotency_conflict</code></td><td>The same <code>idempotencyKey</code> was reused for different content.</td><td>Mint a new key. The same key with the same content is a safe replay and returns the original receipt.</td></tr>
<tr><td><code>404 feature_disabled</code> — <i>"Memory updates are not enabled on this deployment yet."</i></td><td>Only on a deployment where the safe-update doors are switched off. It covers <code>update()</code>, <code>history()</code> and <code>rollback()</code> together.</td><td>Check the <code>baseUrl</code> you pointed the client at.</td></tr>
<tr><td><code>TypeError: memory.update is not a function</code></td><td>An installed build older than this page describes.</td><td>Print the exported <code>VERSION</code>, then reinstall.</td></tr>
</table>

<p>Every response carries an <code>x-request-id</code> header that ties your call to the server-side record without exposing memory content. Quote it if you report a problem.</p>

${nextSteps([
	["#/sdk/python", "Python SDK", "The same surface, with list and get methods this client lacks."],

PAGES["/concepts/memory"] = { title: "How memory works", html: `
<h1>How memory works</h1>
<p class="lede">One message becomes durable memory by two independent steps: your words are preserved exactly, then a model proposes structure that deterministic gates approve or refuse.</p>
<p>Chat history is not memory. A transcript grows without bound, answers nothing on its own, and cannot be corrected. Itsuki turns messages into a small set of typed objects that can be ranked, edited, superseded and deleted one at a time. This page follows a message all the way through.</p>

<h2>Preservation and promotion are separate</h2>
<p>Two things happen to an accepted write, and they are deliberately independent.</p>
<ul>
<li><b>Preservation</b> runs at accept time, before any model is consulted. Every permitted message is scrubbed of secrets and written as a <b>source episode</b>. It is bounded per batch, bound to one memory space, and hard-deleted on erasure.</li>
<li><b>Promotion</b> runs afterwards. A model proposes structure; deterministic gates decide what becomes a memory, a detail, an event or a connection. Promotion is allowed to decline.</li>
</ul>
<p>The reason for the split is measurable. Most recall misses are facts that were never stored at all, and once extraction declined a fact there was nothing left to find. Separating the two means a conservative extraction pass can no longer make your own words unrecoverable.</p>
<div class="note">Source episodes are not an unscrubbed archive. Secrets are removed before anything durable sees the text, your exclude rules are enforced again at this layer, and if the rules cannot be read <b>nothing</b> is written. Failing closed costs recoverability; failing open would keep content you asked never to keep.</div>

<h2>The object types</h2>
<p>Everything in your graph is one of these. Every id is prefixed, so an id tells you what you are holding.</p>
<table>
<tr><th>Object</th><th>Id</th><th>What it is</th></tr>
<tr><td><b>Memory</b> (node)</td><td><code>node_…</code></td><td>A durable thing: Kotlin, Grandmother, your project, your employer. Carries a <code>label</code>, a <code>category</code>, a <code>state</code> (active · paused · inactive · completed) and a rolled-up <code>summary</code>.</td></tr>
<tr><td><b>Detail</b> (slice)</td><td><code>slice_…</code></td><td>A current truth about one memory — "trains three days a week". Has a <code>kind</code> (feature_detail, technical_detail, progress, blocker, fix, decision, preference, other) and an <code>is_current</code> flag.</td></tr>
<tr><td><b>Event</b></td><td><code>event_…</code></td><td>Something that happened to one memory, with an <code>action</code> (started, stopped, diagnosed, passed_away, moved, married…), an <code>importance</code> (ordinary · important · life_significant) and a <code>happened_at</code>.</td></tr>
<tr><td><b>Connection</b> (edge)</td><td><code>edge_…</code></td><td>A directed relation between two memories, with a plain-sentence <code>fact</code> and a validity window (<code>valid_at</code>, <code>invalid_at</code>).</td></tr>
<tr><td><b>Conversation page</b></td><td><code>page_…</code></td><td>One condensed, searchable page per conversation — title, short summary, key points, decisions, next steps. Keeps whole-chat captures out of the fact graph.</td></tr>
<tr><td><b>Suggestion</b> (candidate)</td><td><code>candidate_…</code></td><td>A weak or unclear signal parked for your review instead of being written or lost. Carries a <code>strength</code> (weak · medium · strong), a mention count and the evidence message.</td></tr>
<tr><td><b>Source episode</b></td><td><code>episode_…</code></td><td>One preserved, scrubbed user message, written at accept time.</td></tr>
</table>
<p>Two bookkeeping objects come back in API responses: the <b>source packet</b> (<code>src_…</code>) that identifies one accepted write, and the <b>receipt</b> that says what that write did. See <a href="#/concepts/receipts">Receipts &amp; rules</a>.</p>

<h2>The admission path</h2>
<p>Every representation that can later be recalled, exported, indexed, embedded or displayed passes the same sequence before it is written. There is no shortcut lane.</p>
<pre><button class="copy">Copy</button><code>identity / scope
  -&gt; secret scrub            (deterministic, no model, before anything durable)
  -&gt; opt-out check           ("don't remember this" ends the write here)
  -&gt; memory rules            (your includes / excludes / instructions)
  -&gt; bounds + normalization  (envelope caps, model-input caps)
  -&gt; immutable context snapshot
  -&gt; storage and indexing</code></pre>
<p>The scrub is first because a secret that has reached a model or an embedding cannot be taken back. It is pattern-based and keeps meaning: <code>neo4j+s://neo4j:hunter2@host</code> becomes <code>neo4j+s://neo4j:[REDACTED:password]@host</code>, so the fact that you use that database survives and the credential does not.</p>
<p>Rules belong to the <b>account</b>, not to a derived sub-tenant id. The door resolves them once and hands the same object to every enforcement point, and an unreadable rules store fails the write closed rather than quietly applying defaults.</p>

<h2>What makes something durable</h2>
<p>The model proposes; it never writes final truth. The backend independently decides keep, downgrade or reject for each proposed object, in a fixed order — memories first, so events, details and connections can attach to memories created in the same batch.</p>
<ul>
<li><b>Meaning, not a whitelist.</b> An unrecognised category is mapped onto the canonical set ("relative" becomes family, "database" becomes tool) or kept as <code>other</code>. It is never dropped for being off-list.</li>
<li><b>A memory needs a detail.</b> A bare label with no detail, event or connection attached to it is not a memory. It is refused as <code>node_without_detail</code> and parked as a suggestion instead.</li>
<li><b>Anti-orphan.</b> An event or detail whose subject the model forgot creates that subject. "My grandmother passed away" still lands as Grandmother (family) plus a <code>passed_away</code> event, even when the model emitted only the event.</li>
<li><b>Confidence floors.</b> The automatic lane keeps proposals at 0.5 and above. A user-commanded save through the API is more lenient (0.25) because you asked for it explicitly. An MCP save is user-commanded but host-mediated, so it sits back on the stricter floor — the host model may have rewritten what "the user said".</li>
<li><b>Lifecycle events move state.</b> A <code>completed</code> event marks its memory completed; <code>stopped</code>, <code>left</code> and <code>passed_away</code> mark it inactive; <code>paused</code> pauses it.</li>
</ul>

<h2>What gets discarded, and where it goes instead</h2>
<p>Refusals are named, counted and returned on the receipt. These are the common ones.</p>
<table>
<tr><th>Reason</th><th>What triggered it</th><th>Where the content goes</th></tr>
<tr><td><code>junk_label</code></td><td>A pronoun or filler proposed as a memory ("I", "this", "stuff")</td><td>Dropped</td></tr>
<tr><td><code>node_is_status</code></td><td>A status phrase proposed as a thing ("started boxing" as a label)</td><td>Dropped; the same content usually lands as an event</td></tr>
<tr><td><code>node_without_detail</code></td><td>A label with nothing attached</td><td>Parked as a suggestion</td></tr>
<tr><td><code>low_confidence_downgraded</code></td><td>Below the lane's confidence floor</td><td>Parked as a suggestion</td></tr>
<tr><td><code>excluded_by_rule</code> · <code>outside_include_rules</code></td><td>Your rules refused it</td><td>Dropped, and named on the receipt</td></tr>
<tr><td><code>ungrounded_fact</code></td><td>An MCP save whose words are mostly absent from what was actually sent</td><td>Dropped — that is the host model talking, not you</td></tr>
<tr><td><code>batch_text_blob</code></td><td>Text stitched from several messages rather than paraphrased from one</td><td>Dropped</td></tr>
<tr><td><code>file_path_node</code> · <code>tool_chatter</code> · <code>stack_trace_discarded</code></td><td>Editor-plugin captures: paths, diffs, raw traces</td><td>Dropped, unless a trace resolved into an error-and-fix pair</td></tr>
</table>
<p>Nothing here is silent. Repetition is explicit too: re-sending a fact you already stored reinforces the existing row and is reported as <code>duplicates_noop</code> rather than counted as a new save.</p>

<h2>Corrections and supersession</h2>
<p>New information does not delete old information. When a statement carries explicit revision language — "actually", "no longer", "we switched X to Y", "it's now Z" — the pipeline enters update mode and retires the specific fact whose value was named obsolete. Retirement is keyed on the <b>value being replaced</b>, not on the detail's kind, so "now uses canary, not blue-green" retires only the blue-green fact and leaves your other current facts alone.</p>
<p>Retired details are marked non-current, never deleted. Connections close their validity window instead: a new <code>WORKS_AT</code> closes the old employer's window, and the old row stays queryable as history and renders as "(until 2026-05-01)" when you ask about the past.</p>

<h2>Following one save</h2>
<pre><button class="copy">Copy</button><code>curl -X POST https://itsuki.app/v1/save \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"content": "I started boxing this week, three sessions."}'</code></pre>
<p>What happens, in order: the text is scrubbed; a source packet is created and deduplicated by content hash; a job row is written <i>before</i> the response, so accepted work always has a durable record; permitted messages become source episodes; the scrubbed text is staged so a recall seconds later can answer with it; then the message is handed to your account's queue for extraction.</p>
<p>The response separates acceptance from completion and carries a packet handle. Poll it rather than assuming:</p>
<pre><button class="copy">Copy</button><code>GET /v1/packets/&lt;source_packet_id&gt;/status
GET /v1/jobs?limit=20</code></pre>
<p>Job status passes through <code>awaiting_source</code>, <code>queued</code>, <code>staged</code> and <code>processing</code>, and settles on <code>enriched</code> or <code>failed</code>. Those terminal words are fixed; a cancellation caused by your own erasure settles as <code>failed</code> with <code>cancelled_by_delete: true</code> rather than inventing a fourth state that older clients would poll forever.</p>

<h2>Reading and changing what landed</h2>
<p><code>GET /v1/graph</code> returns the whole thing: memories with all their details and events, connections, and the suggestions still waiting. <code>GET /v1/memories</code> lists newest-first and <code>GET /v1/memories/&lt;id&gt;</code> returns one object with its history. A wrong fact is corrected with <code>PATCH /v1/memories/&lt;id&gt;</code>, which keeps the previous content as a revision rather than overwriting it — see the <a href="#/api/rest">REST reference</a>.</p>
<div class="note">Reviewing suggestions — <code>GET /v1/candidates</code> and the promote / merge / reject actions — is a signed-in operation. Those routes refuse API keys, so use the <b>Memories → Suggestions</b> view in the app.</div>

<h2>Where to go next</h2>
<ul>
<li><a href="#/concepts/extraction">How extraction works</a> — chunking, the proposing model, the gates, idempotency.</li>
<li><a href="#/concepts/graph">The memory graph</a> — how connections form and what they do at recall time.</li>
<li><a href="#/concepts/retrieval">How recall works</a> — query to bounded context.</li>
<li><a href="#/concepts/receipts">Receipts &amp; rules</a> — proof of what happened, and control over what may happen.</li>
<li><a href="#/concepts/delete">Delete &amp; erasure</a> — how any of this is removed.</li>
</ul>
` };

PAGES["/concepts/receipts"] = { title: "Receipts & rules", html: `
<h1>Receipts &amp; rules</h1>
<p class="lede">A receipt is the record of what one write actually did. Rules are the policy that decided it. Together they answer "what happened?" and "what am I allowing?" without either being a matter of trust.</p>
<p>Refusals are named rather than silent, and policy is enforced in code rather than requested of a model in a prompt. This page covers how to read one receipt, and how to write rules that do what you meant.</p>

<h2>What a receipt records</h2>
<p>Every authenticated, valid save returns either an error or a receipt. A receipt covers four things:</p>
<ul>
<li><b>Provenance</b> — which door and mode, the source packet, the extraction run, the idempotency key, the resolved project.</li>
<li><b>What was written</b> — counts per object type, plus the labels of new memories and the ids of everything created.</li>
<li><b>What was refused</b> — a total, a reason histogram, and the individual refused objects.</li>
<li><b>What it cost</b> — latency, and for recall, model call and token rollups.</li>
</ul>
<p>Receipts are stored. Read them with <code>GET /v1/receipts?limit=50</code>, or in <b>History</b> in the app.</p>

<h2>Reading one</h2>
<pre><button class="copy">Copy</button><code>{
  "outcome": "wrote",
  "source": "save_memory",
  "source_mode": "manual_direct",
  "source_packet_id": "src_…",
  "extraction_run_id": "run_…",
  "project_id": null,
  "saved": {
    "nodes": 1, "newNodeLabels": ["Boxing"], "autoCreated": [],
    "updatedNodes": 0, "slices": 2, "supersededSlices": 0,
    "events": 1, "edges": 0, "candidates": 1, "pages": 0,
    "reinforcedSlices": 0, "reinforcedEvents": 0, "reinforcedEdges": 0
  },
  "savedTotal": 5,
  "duplicates_noop": 0,
  "skipped": 2,
  "skippedReasons": { "low_confidence_downgraded": 1, "junk_label": 1 },
  "actions": { "createdNodes": [ { "id": "node_…", "label": "Boxing" } ], "…": "…" },
  "latency_ms": 3410
}</code></pre>
<p>Four fields carry most of the meaning:</p>
<table>
<tr><th>Field</th><th>Read it as</th></tr>
<tr><td><code>savedTotal</code></td><td>Everything the write changed — new objects, reinforced objects and superseded ones. It is not a count of new rows.</td></tr>
<tr><td><code>duplicates_noop</code></td><td>Rows that already existed and were refreshed rather than re-inserted. Repetition is deliberately visible; it changes the arithmetic of "saves in" versus "memories out".</td></tr>
<tr><td><code>autoCreated</code></td><td>Memories synthesized because the model emitted an event or detail without its subject. These are inside <code>newNodeLabels</code> too.</td></tr>
<tr><td><code>merges</code></td><td>Present only when a proposal was folded into an existing memory by something other than an exact label match. Each entry names the target and the basis, so wrong merges are auditable.</td></tr>
</table>
<p>The one-line summary a save tool returns is rendered from the same object:</p>
<pre><button class="copy">Copy</button><code>Saved: 1 node (Boxing), 2 slices, 1 event, 1 candidate. Skipped: 2 (weak maybe, pronoun/filler).</code></pre>

<h2>Outcomes</h2>
<table>
<tr><th>Outcome</th><th>Meaning</th></tr>
<tr><td><code>wrote</code></td><td>A plan was approved and committed.</td></tr>
<tr><td><code>meaningful_no_write</code></td><td>The pass ran and found nothing durable. A real answer, with a reason.</td></tr>
<tr><td><code>accepted</code> · <code>accumulating</code></td><td>The write was taken in; enrichment is still running, or the trigger is holding for more context. Check the packet status.</td></tr>
<tr><td><code>opted_out</code></td><td>The content contained a "don't remember this" instruction and was not stored.</td></tr>
<tr><td><code>llm_failed</code> · <code>db_write_failed</code> · <code>interrupted_unknown</code></td><td>Nothing was written. The reason field says which.</td></tr>
<tr><td><code>cancelled_by_delete</code> · <code>cancelled_by_retention</code></td><td>Terminal. A confirmed erasure or a retention boundary cancelled the accepted work.</td></tr>
<tr><td><code>recalled</code> · <code>no_recall</code></td><td>Lookup receipts. Never phrased as "Saved: 0" — they are not saves.</td></tr>
</table>
<p>Re-sending identical content answers with the <b>original</b> verdict. Content accepted earlier replays as "Already saved"; content the gates refused earlier replays as "Not saved — this exact content was sent before and skipped", with the reason. If the original verdict cannot be read, the reply says only that the content was seen before. Claiming an acceptance that did not happen is the one thing this path will not do.</p>

<h2>The refusal vocabulary</h2>
<p><code>skippedReasons</code> is machine-readable; the summary renders each as a short phrase.</p>
<table>
<tr><th>Reason</th><th>Phrase</th></tr>
<tr><td><code>excluded_by_rule</code></td><td>blocked by your rules</td></tr>
<tr><td><code>outside_include_rules</code></td><td>outside your include rules</td></tr>
<tr><td><code>low_confidence</code> · <code>low_confidence_downgraded</code></td><td>weak maybe</td></tr>
<tr><td><code>junk_label</code> · <code>node_is_status</code></td><td>pronoun/filler · status phrase</td></tr>
<tr><td><code>node_without_detail</code></td><td>node without durable detail</td></tr>
<tr><td><code>ungrounded_fact</code></td><td>not grounded in what was sent</td></tr>
<tr><td><code>edge_evidence_not_verbatim</code></td><td>evidence quote not found in the messages</td></tr>
<tr><td><code>edge_type_pair_mismatch</code></td><td>impossible relation for these kinds of things</td></tr>
<tr><td><code>suppressed_blocked</code></td><td>suppressed (you rejected this label before)</td></tr>
</table>

<h2>What a receipt never contains</h2>
<p>Receipts outlive the messages that produced them, so the audit fields are strictly content-free. Extraction tracing carries hashes and counts — how many messages, how many bytes, when the context was captured — and never snippets, message ids or scope labels; invalid audit data is dropped as a unit rather than partly kept with misleading counts. Secret redaction is reported the same way: the receipt says how many credentials were removed and of what type, never their values.</p>

<h2>Rules: three controls</h2>
<p>Rules live in <b>Settings → Memory extraction</b> and on <code>GET</code>/<code>PUT /v1/rules</code>.</p>
<table>
<tr><th>Control</th><th>What it does</th><th>Bounds</th></tr>
<tr><td><b>Custom instructions</b></td><td>Free text injected into extraction prompts as guidance — <i>"Always save exam progress. Never save jokes."</i></td><td>2,000 characters</td></tr>
<tr><td><b>Includes</b></td><td>When non-empty, only content matching at least one term may become memory.</td><td>32 terms, 80 characters each</td></tr>
<tr><td><b>Excludes</b></td><td>Content matching any term never becomes memory. Excludes always win.</td><td>32 terms, 80 characters each</td></tr>
</table>
<p>Alongside them: <b>custom categories</b> offered to the extractor as filing names; <b>capture default</b> (<code>auto</code> allows whole-chat pages, <code>graph_only</code> never builds them); <b>capture density</b> (<code>standard</code> is selective, <code>dense</code> keeps every durable detail by lowering the automatic confidence floor to the lenient one); and <b>auto-collect</b>, which decides whether <code>POST /v1/turn</code> feeds the turn into background capture.</p>

<h2>How rules decide admission</h2>
<p>The prompt gets your rules as <b>guidance</b>. The filters are the <b>enforcement</b> — a model that ignores the guidance still cannot write excluded content.</p>
<ol>
<li>Deny terms are assembled from your excludes plus terms parsed out of your instructions. "Never save anything about my salary or my landlord" yields <code>salary</code> and <code>landlord</code>.</li>
<li>If any deny term matches, the content is refused as <code>excluded_by_rule</code>. This check runs first and cannot be overridden.</li>
<li>If includes are non-empty, the content must match at least one term to survive; otherwise it is refused as <code>outside_include_rules</code>. Where a managed project adds its own include layer, the content must satisfy <b>every</b> layer — a narrowing operation, never a widening one.</li>
</ol>
<p>Matching is whole-word and accent-insensitive, so "salary" matches <i>Salary</i> and <i>salário</i> but not <i>salaryman</i>. Terms so broad they would disable memory entirely — "anything", "everything", "data", "stuff" — are ignored when parsed out of instructions, because silently switching memory off is not what that sentence means.</p>
<div class="warn">Rules belong to the <b>account</b>. A derived sub-tenant id owns no rules row, so any lane that loaded rules for the id it was writing under would silently get defaults. The door resolves account rules once and hands the same object to every enforcement point — the graph gates, the staging index, extraction, and the write-path recall door. An unreadable rules store fails the write closed rather than converting "never keep my salary" into "keep everything".</div>
<p>An administrator's later policy edit reaches queued work that has not written memory yet: server-owned policy is re-resolved when extraction actually begins. Credential and request layers stay fixed at acceptance time.</p>

<h2>The no-write preview</h2>
<p>Rules are easy to get wrong, and the honest way to find out is not to save something and check. <code>POST /v1/settings/rules/preview</code> runs samples through the real deterministic admission check and writes nothing at all — no source packets, no jobs, no receipts, no usage rows, no graph state.</p>
<pre><button class="copy">Copy</button><code>POST /v1/settings/rules/preview
{ "samples": [
    "I moved to Porto in March.",
    "My salary is 62k."
  ],
  "rules": { "excludes": ["salary"] } }</code></pre>
<pre><button class="copy">Copy</button><code>{ "ok": true,
  "results": [
    { "text": "I moved to Porto in March.", "kept": true,
      "assessment": "durable", "assessment_reason": "life change: relocation" },
    { "text": "My salary is 62k.", "kept": false, "reason": "excluded_by_rule",
      "assessment": "not_evaluated_blocked" }
  ],
  "category_preview": "evaluated", "assessment_preview": "evaluated" }</code></pre>
<p>Two things make the preview trustworthy. First, <code>kept</code> is decided in code by the same function the pipeline uses — the two bounded model calls only annotate rows that already passed and can never flip a policy decision. Second, "passed the rules" is not "will be stored", so a separate judgement reports whether the sample would survive extraction at all: <code>durable</code>, <code>not_durable</code>, or <code>uncertain</code>. An unreachable or unsure model reports <code>uncertain</code> rather than guessing. Text your rules denied never reaches either model payload.</p>
<p>Send up to 10 samples; each is truncated to 400 characters. The <code>rules</code> field is optional — omit it to preview your stored rules, or pass a partial override to test a change before saving it. This route requires a signed-in session with rules-edit permission.</p>

<h2>Updating rules safely</h2>
<pre><button class="copy">Copy</button><code>GET /v1/rules
# -&gt; { "ok": true, "rules": { … }, "rules_version": "…" }

PUT /v1/rules
If-Match: "&lt;rules_version&gt;"
{ "rules": { "excludes": ["salary", "landlord"], "captureDensity": "dense" } }</code></pre>
<p>An update without a precondition is refused with <code>428</code> and the message "reload these settings before saving so a newer policy is not overwritten". You may send the version as an <code>If-Match</code> header or as <code>expected_version</code> in the body; sending both with different values is a <code>400</code>. <code>POST /v1/rules</code> is an alias for clients that cannot send <code>PUT</code>. The response reports <code>changed</code>, so a no-op edit is distinguishable from a real one.</p>

<h2>Related</h2>
<ul>
<li><a href="#/concepts/memory">How memory works</a> — where rules sit in the admission path.</li>
<li><a href="#/concepts/extraction">How extraction works</a> — the gates that produce the refusal reasons above.</li>
<li><a href="#/operate/observability">Monitoring &amp; diagnostics</a> — jobs, packets and account-wide health.</li>
<li><a href="#/concepts/delete">Delete &amp; erasure</a> — what is retained after content is removed.</li>
</ul>
` };

PAGES["/concepts/scope"] = { title: "Who memory belongs to", html: `
<h1>Who memory belongs to</h1>
<p class="lede">Every memory is stored under exactly one <b>memory user</b>, and optionally tagged with a <b>project</b>. Isolation is the point — so nothing crosses a boundary just because it would be convenient.</p>

<h2>The three levels</h2>
<ul>
<li><b>Account root</b> — your own memory. This is where writes land when you send no <code>userId</code>.</li>
<li><b>Sub-tenant</b> — one memory space per end user of <i>your</i> product. You create it by sending <code>userId</code> (any stable string you choose). The server derives an opaque id from your account plus that string, so two different accounts sending the same <code>userId</code> never touch the same memory.</li>
<li><b>Project</b> — a tag <i>within</i> a memory user, not a separate store. It narrows what recall returns; it does not create a new tenant.</li>
</ul>
<p>Sub-tenants are isolated from each other and from your root. There is no query that reads across them, and no setting that merges them.</p>

<h2>Project scope, and the thing that surprises people</h2>
<p>When the Claude Code or Codex plugin captures something while you work in a directory, it tags that memory with a <b>project id</b> derived from the directory path — an opaque hash like <code>local_3f2a…</code>, never the path itself.</p>
<div class="callout"><b>The rule:</b> memory a plugin saved in a project is reachable from the SDK or REST <b>only when the caller carries that same project scope</b>. It does not automatically become account-global, and a caller that sends no project scope will not see it.</div>
<p>This is deliberate — the whole value of project scope is that opening one repo does not surface another repo's decisions. But it does mean "I saved it in Claude Code and my script can't find it" is normally a scope question, not a bug.</p>
<p>To find the project id a directory derives, run the plugin's own diagnostic. It prints the id (never the path):</p>
${codeBlock(`# Claude Code plugin — type this in a session
/itsuki:doctor

# Codex plugin
node <plugin-root>/hooks/codex-doctor.mjs`)}
<p>Both plugins derive the <b>same</b> id for the same directory, so a project captured in one is reachable in the other.</p>

<h2>How recall chooses what to read</h2>
<table>
<tr><th>Mode</th><th>What it reads</th></tr>
<tr><td><code>global</code> (default)</td><td>The memory user's whole store, project tags ignored.</td></tr>
<tr><td><code>project_only</code></td><td>Only memory tagged with the project id you send. Returns nothing if the project has nothing — which is a real answer, not an error.</td></tr>
<tr><td><code>project_then_global</code></td><td>Project memory first, then account-global to fill the remaining budget. This is what the plugins use, so a session opened in a project always leads with that project's context.</td></tr>
</table>
<p>The first three are the <code>recallScope</code> option in the JavaScript client and <code>recall_scope</code> in Python. There is a fourth, <code>project_bootstrap</code>, sent as a separate <code>recallMode</code> field on <code>POST /v1/recall</code>: a deterministic listing for session start — no similarity search, just this project's most salient and recent memory. Both editor plugins send it when a session opens, because an opening query like "project decisions and conventions" is not something any ranker answers well. Neither SDK exposes it as a typed option today; send it in the request body if you are building your own session-start flow.</p>

<h2>Reaching plugin project memory from your own code</h2>
${codeBlock(`import { Memory } from "itsuki";
const memory = new Memory({ apiKey: process.env.ITSUKI_API_KEY });

// Carry the project scope the plugin used, or you will not see its memory.
await memory.recall("deployment decisions", {
  memoryScope: { projectId: "local_3f2a…" },
  recallScope: "project_then_global",
});`)}
<p>The Python client spells the same two options <code>memory_scope={"project_id": …}</code> and <code>recall_scope=…</code>.</p>

<h2>What does NOT happen</h2>
<ul>
<li>Project memory does not become account-global over time.</li>
<li>A sub-tenant's memory is never visible to another sub-tenant, or to your root.</li>
<li>Your account never sees another account's tenants, projects, or counts.</li>
<li>Nothing you save is used to train a model.</li>
</ul>
` };

PAGES["/concepts/delete"] = { title: "Delete & erasure", html: `
<h1>Delete &amp; erasure</h1>
<p class="lede">Two different operations share one route. Knowing which one you asked for is the difference between tidying up and erasing everything.</p>

<h2>Scoped delete is curation</h2>
<p>A delete that names a source lane or a time window removes what matched, and nothing else:</p>
${codeBlock(`# Preview first — this is the default, and it changes nothing
DELETE /v1/memories?source=ingest&after=1786000000000

# Then confirm
DELETE /v1/memories?source=ingest&after=1786000000000&confirm=true&dry_run=false`)}
<p>Work you already submitted that is <i>still processing</i> is not cancelled by a scoped delete. It finishes, and its output lands after the delete — because you asked to remove what exists, not to stop what is running. The preview tells you how many such saves are in flight so the number is never a surprise.</p>

<h2>Unscoped confirmed delete is an erasure</h2>
<p>A confirmed delete with no source and no window means "remove everything in this memory space". That is a stronger promise, so it does more:</p>
<ul>
<li>It records an <b>erasure barrier</b> — a timestamp for that memory user.</li>
<li>It removes everything currently live, then re-checks and sweeps again, so anything that landed mid-operation is caught too.</li>
<li>It <b>cancels accepted work that had not yet committed</b>. Any save accepted <i>before</i> the barrier is refused at commit time, so it cannot reappear after you erased.</li>
</ul>
${codeBlock(`DELETE /v1/memories?confirm=true&dry_run=false`)}
<p>The confirmed response tells you what happened, including how many in-flight saves were cancelled:</p>
${codeBlock(`{
  "ok": true,
  "dry_run": false,
  "deleted": { "runs": 3, "nodes": 41, "pages": 2, "slices": 55, "events": 7, "edges": 63, "candidates": 0 },
  "cancelled_runs": 1,
  "pending_jobs": 1,
  "convergence_passes": 1,
  "note": "1 accepted save(s) were cancelled by this delete."
}`)}
<p><code>convergence_passes: 1</code> means the first sweep was enough. A higher number means work arrived while the erasure ran and was swept too.</p>

<h2>What a cancelled save looks like</h2>
<p>A cancelled save is <b>terminal</b>. It is reported through the job status you already poll:</p>
${codeBlock(`{
  "status": "failed",
  "cancelled_by_delete": true,
  "outcome_reason": "cancelled_by_delete",
  "error": "cancelled_by_delete: a confirmed delete erased this scope while the save was processing"
}`)}
<div class="callout"><b>Why <code>failed</code> and not a new status?</b> Because every already-released SDK treats <code>enriched</code>, <code>failed</code> and <code>completed</code> as the complete set of terminal states. Inventing a fourth word would make an older client poll forever on a job that is finished. The state stays in the vocabulary every client knows, and the <i>reason</i> is published as its own field.</div>
<p><b>Do not retry a cancelled save.</b> It is not a transient error. The barrier applies to the original work, so a retry is cancelled the same way — it just costs you another round trip. If you still want that content stored, write it again as a <b>new</b> save: work submitted <i>after</i> the barrier is ordinary work and lands normally. Erasure clears the past; it does not lock the memory space.</p>
<p>To separate cancellations from genuine failures:</p>
${codeBlock(`GET /v1/jobs?cancelled=true    # only work your own erasure cancelled
GET /v1/jobs?cancelled=false   # only work that actually failed`)}

<h2>Which route to use</h2>
<p>There are two compatibility surfaces for erasing one resolved memory space. Neither one is project-wide:</p>
<table>
<tr><th>Route</th><th>Who</th><th>Behaviour</th></tr>
<tr><td><code>DELETE /v1/memories</code></td><td>API keys and sessions</td><td>Preview-first, addresses the one memory space resolved for the request (including a specifically addressed sub-tenant), and carries the erasure barrier described above. <b>This is the route to build on.</b></td></tr>
<tr><td><code>POST /v1/actions/delete-all</code></td><td>Signed-in sessions only</td><td>Legacy compatibility route for the session's one resolved memory space. It refuses API keys with <code>token_not_allowed</code> and is intentionally not exposed in Settings.</td></tr>
</table>
<p>A project may contain a primary space plus registered SDK sub-tenant spaces. These routes never claim to iterate all of them. True project-wide deletion is self-serve from Settings via the verified lifecycle workflow: it previews first, requires a typed confirmation bound to your session, then converges across every registered project space, index, queue, artifact, and retry path — and reports completion only after a residual scan proves every store empty.</p>

<h2>What is kept</h2>
<p>Erasure removes your memory. It retains the bookkeeping that proves the deletion happened — deletion records, job and receipt history, and the timestamps above. That audit trail carries no memory content, and it is what lets a later preview honestly answer "nothing left".</p>
` };

PAGES["/operate/observability"] = { title: "Monitoring & diagnostics", html: `
<h1>Monitoring &amp; diagnostics</h1>
<p class="lede">If you run Itsuki behind your own product, this page is the answer to "is it healthy, and if not, which part?"</p>

<h2>One call for the whole account</h2>
<p>Every other read endpoint is scoped to a single memory user. <code>GET /v1/ops/overview</code> is the account view: it rolls up your root and your sub-tenants together, and lists each one.</p>
${codeBlock(`curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  "https://itsuki.app/v1/ops/overview?range=7d"`)}
${codeBlock(`{
  "ok": true,
  "account": {
    "owner_user_id": "user_…",
    "range": { "days": 7, "from": 1785539673072, "to": 1786144473072 },
    "tenants": 12,
    "truncated": false,
    "live_nodes": 94,
    "jobs": { "queued": 0, "staged": 0, "processing": 0, "enriched": 150, "failed": 11, "completed": 0 },
    "backlog": { "depth": 0, "oldest_age_ms": null },
    "stuck": { "non_terminal": 0, "older_than_ms": 900000 },
    "cancelled_by_delete": 14,
    "failures": { "total": 25, "cancelled_by_delete": 14, "other": 11 },
    "retries": { "jobs_with_retries": 3, "max_attempts": 2 },
    "erasures": { "tenants_with_barrier": 2, "latest_barrier_at": 1786144705593 },
    "latency_ms": { "p50": 973, "p95": 3363, "samples": 962 }
  },
  "tenants": [ { "memory_user_id": "mem_…", "external_user_id": "your-user-42", "is_root": false, "live_nodes": 12, "…": "…" } ]
}`)}
<p>Needs a Bearer API token or a signed-in session. The legacy <code>x-api-key</code> lane is refused with <code>account_scope_required</code>, because it writes under raw identifiers and has no account relationship to roll up.</p>

<h2>Reading it</h2>
<table>
<tr><th>Question</th><th>Where to look</th></tr>
<tr><td>Is it healthy?</td><td><code>backlog.depth</code> near zero and <code>stuck.non_terminal</code> at zero.</td></tr>
<tr><td>Is backlog building?</td><td><code>backlog.depth</code> rising, or <code>backlog.oldest_age_ms</code> growing between polls.</td></tr>
<tr><td>Are there stuck jobs?</td><td><code>stuck.non_terminal</code> — work still not terminal after <code>stuck.older_than_ms</code>.</td></tr>
<tr><td>Which tenant is affected?</td><td>The <code>tenants</code> array. <code>external_user_id</code> is the id <i>you</i> sent.</td></tr>
