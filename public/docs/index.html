<tr><td><code>PATCH /v1/memories/&lt;id&gt;</code></td><td>Deterministic correction of editable fields (node label/category/summary · page title/short_summary/full_markdown · detail text/kind · event text/importance/happened_at). Requires <code>If-Match: "r&lt;revision&gt;"</code> or body <code>expectedRevision</code> plus an <code>idempotencyKey</code>; missing precondition → 428, stale → 412 with <code>current_revision</code>, wildcard refused. Previous content is retained as an immutable revision.</td></tr>
<tr><td><code>GET /v1/memories/&lt;id&gt;/history</code></td><td>Keyset-paginated revision history (baselines, captured automatic changes, edits, rollbacks) with snapshots and projection convergence state. Page size is bounded (max 50); stored history is <em>not</em> pruned — every revision is retained until the object is deleted, purged, retention-expired, or the account is erased, so anything offered as rollbackable stays rollbackable. <code>total_revisions</code> reports the retained count.</td></tr>
<tr><td><code>POST /v1/memories/&lt;id&gt;/rollback</code></td><td>Restore an earlier revision's content as a NEW forward revision (<code>toRevision</code> + current <code>expectedRevision</code> + <code>idempotencyKey</code>). History is never rewound; erased revisions cannot be restored.</td></tr>
<tr><td><code>GET /v1/usage?range=30d</code></td><td>Activity rollups: saves/recalls per day, by source, totals. Ranges 1d/7d/30d/all.</td></tr>
<tr><td><code>GET /v1/receipts?limit=50</code></td><td>Latest save/recall receipts.</td></tr>
<tr><td><code>GET /v1/export</code></td><td>Complete JSON export of the memory space resolved by the current credential and request. It does not aggregate sibling SDK sub-tenant spaces in the project.</td></tr>
<tr><td><code>GET/PUT /v1/rules</code></td><td>Read or update the project's memory-extraction inclusion and exclusion policy.</td></tr>
</table>
<h2>Conversation-ingest boundaries</h2>
<table>
<tr><th>Boundary</th><th>Current limit</th></tr>
<tr><td>Messages in one <code>POST /v1/ingest</code></td><td>30</td></tr>
<tr><td>One message's <code>content</code></td><td>4,000 Unicode code points</td></tr>
<tr><td>Combined message content</td><td>120,000 Unicode code points</td></tr>
<tr><td>Complete serialized request</td><td>512 KiB of actual UTF-8 JSON</td></tr>
</table>
<p>Those four wire limits are exactly what <a href="/v1/ingest/limits"><code>GET /v1/ingest/limits</code></a> returns. The engine also enforces these separate downstream safeguards:</p>
<table>
<tr><th>Internal boundary</th><th>Limit</th></tr>
<tr><td>One downstream extraction queue entry</td><td>20 messages and 12,000 Unicode code points</td></tr>
<tr><td>Complete serialized chat-model input</td><td>At most 24,576 UTF-8 bytes</td></tr>
</table>
<p>The configured model context windows are 32,768 tokens for Qwen3 extraction, 32,000 for Llama 3.1 summary/digest, and 60,000 for Llama 3.2 playground chat. After output/template reserves and the global byte ceiling, their maximum serialized inputs are 24,576, 23,808, and 24,576 bytes respectively; unknown model overrides use the conservative 32,000-token profile.</p>
<p>Fetch the limits endpoint instead of copying wire constants into a client. A body over the byte limit receives a machine-readable <code>413</code>; count, character, or delivery-metadata violations receive a machine-readable <code>422</code>. Retry an unchanged request with the same <code>idempotencyKey</code>; reusing that key for different content is a <code>409</code>.</p>
<h2>Useful request fields</h2>
<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>idempotencyKey</code></td><td>Safe retries: the same key is processed at most once.</td></tr>
<tr><td><code>delivery</code></td><td>Ordered-batch metadata: schema, stable group ID, batch index/count, source/segment counts, and explicit capture-omission state.</td></tr>
<tr><td><code>conversationId</code>, <code>threadId</code>, <code>sourceId</code></td><td>Provenance tracking; also used for de-duplication of re-sent chats.</td></tr>
<tr><td><code>userId</code></td><td><b>Sub-tenant selector.</b> Omit it to use the key owner's own memory. Pass any string to read/write a separate memory space derived from it — useful when your app serves multiple end users under one key.</td></tr>
<tr><td><code>memoryScope.projectId</code>, <code>projectName</code></td><td><b>Project metadata, not tenancy.</b> Project memories remain in the authenticated account graph with explicit provenance. Omit <code>projectId</code> for account-global writes.</td></tr>
<tr><td><code>recallScope</code></td><td><code>global</code> (default) searches the whole account; <code>project_only</code> searches exactly <code>memoryScope.projectId</code>; <code>project_then_global</code> searches that project plus rows without a project. Project modes never include another project.</td></tr>
</table>
<h2>Rate limits</h2>
<p>There are six buckets, all per 60 seconds, keyed per credential and project: <code>auth</code> 10, <code>save</code> 60 (<code>POST /v1/save</code> and <code>POST /v1/turn</code>), <code>recall</code> 120, <code>delete</code> 30, <code>import</code> 300 (<code>POST /v1/ingest</code>), and <code>read</code> 240. Reads <i>are</i> limited — just loosely, because they cost database rows rather than inference. A <code>429</code> carries <code>retry-after</code>; back off on it rather than on a fixed sleep. Read the live numbers from <code>GET /v1/limits</code> instead of copying them: see <a href="#/api/limits">Rate limits and quotas</a>.</p>
<h2>Errors</h2>
<p>Errors are JSON: <code>{ "error": "code_or_message" }</code> with conventional status codes (400 invalid body, 401 unauthenticated, 403 wrong scope, 429 slow down, 5xx our fault — automatically reported on our side).</p>
` };

PAGES["/api/auth"] = { title: "Authentication & keys", html: `
<h1>Authentication &amp; keys</h1>
<p class="lede">Two kinds of credential, one rule: a secret is shown once. This page covers which one to use where, what happens when you mix them up, and how scopes and project roles combine to decide what a key can do.</p>

<h2>The two credentials</h2>
<table>
<tr><th></th><th>API key</th><th>MCP link</th></tr>
<tr><td><b>Looks like</b></td><td><code>${PRODUCT.tokenPrefix}\u2026</code></td><td><code>${ORIGIN}/mcp/${PRODUCT.tokenPrefix}\u2026</code></td></tr>
<tr><td><b>Travels in</b></td><td>An <code>Authorization: Bearer</code> header</td><td>The URL itself</td></tr>
<tr><td><b>Use it for</b></td><td>The REST API, the SDKs, and any client that can send headers</td><td>Chat clients and connectors that accept only a URL</td></tr>
<tr><td><b>Create it from</b></td><td><b>API Keys</b> \u2192 <b>Create API key</b></td><td><b>Get started</b> \u2192 pick your client \u2192 <b>Create link</b></td></tr>
</table>

<div class="note"><b>The secret is the same shape either way.</b> Both are 32 random bytes behind an <code>${PRODUCT.tokenPrefix}</code> prefix, so you cannot tell them apart by looking. What differs is a stored <code>type</code> field, fixed at creation. That is why the app labels them in its key table with a <b>Type</b> column reading <code>API</code> or <code>MCP</code> \u2014 it is the only way to know.</div>

<h2>Using an API key</h2>
${codeBlock(`curl ${ORIGIN}/v1/status \\
  -H "authorization: Bearer ${PRODUCT.tokenPrefix}your_key_here"`, "terminal")}

<p>The legacy header <code>x-uml-token</code> is still accepted everywhere the <code>Authorization</code> header is, kept working for clients written before the rename. New code should use <code>Authorization</code>.</p>

<h2>Using an MCP link</h2>
<p>Point the client at the whole URL. The credential is the last path segment, so treat the URL exactly as you would a password.</p>
${codeBlock(`${ORIGIN}/mcp/${PRODUCT.tokenPrefix}your_link_here`, "MCP server URL")}

<p>There is also a header form of the same door, for MCP clients that <i>can</i> send headers: point them at <code>${ORIGIN}/mcp</code> with no path token and an <code>Authorization: Bearer</code> header. That door accepts either credential type.</p>

<h2>What happens if you mix them up</h2>
<p>This is the most common setup mistake, so the server names it rather than returning a bare failure.</p>

<h3>An API key in the MCP URL</h3>
<p>Refused. The path door accepts MCP links only, and the message says so:</p>
${outputBlock(`HTTP/2 401

{
  "error": "unauthorized mcp token",
  "message": "That is an API key, not an MCP link. API keys authenticate at POST /mcp with an 'Authorization: Bearer <key>' header \u2014 only MCP links (created as MCP in the app) go in the URL."
}`, "Response")}

<h3>An MCP link in a Bearer header</h3>
<p>This one <b>works</b>. The asymmetry is deliberate and one-way: only the URL-path door is restricted to MCP links. An MCP-type credential sent as <code>Authorization: Bearer</code> authenticates anywhere an API key does. Note that the credential is the token, not the whole URL \u2014 if you paste the full <code>https://\u2026</code> string into a Bearer header you get a 401 telling you the key is the last path segment.</p>

<h3>Some other kind of secret entirely</h3>
<p>A <code>401</code> here carries a hint keyed to the shape of what you sent, because the fastest fix is usually knowing which secret you grabbed:</p>
<table>
<tr><th>What you sent</th><th>What the message tells you</th></tr>
<tr><td>Starts <code>whsec_</code></td><td>That is a webhook signing secret. It only verifies incoming deliveries.</td></tr>
<tr><td>Starts <code>sk-</code> or <code>sk_</code></td><td>That looks like an OpenAI or Stripe key.</td></tr>
<tr><td>Starts <code>http://</code> or <code>https://</code></td><td>That looks like a URL. If you copied an MCP link, the key is the last path segment.</td></tr>
<tr><td>Anything else</td><td>Keys start with <code>${PRODUCT.tokenPrefix}</code>.</td></tr>
</table>

<h2>Scopes</h2>
<table>
<tr><th>Scope</th><th>Grants</th></tr>
<tr><td><code>memory:read</code></td><td>Recall, status, usage, receipts, jobs, export, and reading rules.</td></tr>
<tr><td><code>memory:write</code></td><td>Save, turn, ingest, and writing rules. <b>Implies <code>memory:read</code>.</b></td></tr>
<tr><td><code>memory:delete</code></td><td>Erasure. Deliberately <b>not</b> implied by <code>memory:write</code> \u2014 a credential that may write must not be able to erase.</td></tr>
</table>

<p>Keys carry <code>memory:read</code> and <code>memory:write</code> by default. The app has no scope selector, so a narrower key is made through the API:</p>
${codeBlock(`curl -X POST ${ORIGIN}/auth/tokens \\
  -H "content-type: application/json" \\
  --cookie "your signed-in session" \\
  -d '{"type": "api", "label": "Read-only reporting", "scopes": ["memory:read"]}'`, "terminal")}

${outputBlock(`{
  "token": "${PRODUCT.tokenPrefix}\u2026",
  "tokenRecord": { "id": "tok_\u2026", "label": "Read-only reporting", "type": "api", "status": "active" }
}`, "Response")}

<p>The plaintext <code>token</code> appears in this response and nowhere else, ever. Creating a key is a signed-in operation: this route does not accept an API key, which is what stops one key from minting another.</p>

<div class="note">Two wildcard scopes are honoured if you hold them: <code>*</code> and <code>memory:*</code>. A request for a scope the key lacks returns <code>403</code> with <code>code: "insufficient_scope"</code>.</div>

<h2>Scopes are only the first gate</h2>
<p>A key also carries the project role of whoever created it, resolved fresh on every request. So a key's real power is its declared scope <i>intersected with</i> its creator's current role \u2014 which means a role change narrows an existing key on its very next request, with nothing to revoke.</p>

<table>
<tr><th>Capability</th><th>Project admin</th><th>Member</th><th>Viewer</th></tr>
<tr><td>Read memory</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Write memory</td><td>Yes</td><td>Yes</td><td>\u2014</td></tr>
<tr><td>Export</td><td>Yes</td><td>Yes</td><td>\u2014</td></tr>
<tr><td>Create and view keys</td><td>Yes</td><td>Yes</td><td>\u2014</td></tr>
<tr><td>Delete memory</td><td>Yes</td><td>\u2014</td><td>\u2014</td></tr>
<tr><td>Edit rules</td><td>Yes</td><td>\u2014</td><td>\u2014</td></tr>
</table>
<p>Organization owners and admins hold every capability in every project underneath them. A capability failure returns <code>403</code> naming the capability, rather than the scope.</p>

<h2>One key, many end users</h2>
<p>A key is bound to one project and cannot read or write another. Inside that project, pass <code>userId</code> to give each of your own end users an isolated space:</p>
${codeBlock(`{ "content": "Ada's depot is in Porto.", "userId": "ada" }`, "request body")}

<p>The value you send never becomes a storage key directly. It is hashed together with the owning account, so two different accounts both using <code>ada</code> address completely different memory spaces, and the id you chose is not recoverable from the id we store. Omit <code>userId</code> and the write lands on the account's own memory.</p>

<div class="note"><b>Pick an opaque, stable id.</b> The value is kept as provenance so your account can list its own tenants, so prefer an internal user id over an email address.</div>

<h2>Key lifecycle</h2>
<ul>
<li><b>Shown once.</b> Only a hash is stored. A lost key cannot be recovered \u2014 create a new one and delete the old.</li>
<li><b>Delete</b> is the only per-key control: the trash icon on the key's row in <b>API Keys</b>, labelled <b>Delete key</b>. It confirms first, then the key stops working immediately.</li>
<li><b>One key per tool.</b> That is the whole rotation story \u2014 because each tool holds its own key, you can cut one off without touching the others.</li>
<li><b>Older keys keep working.</b> Keys minted before the rename carry a <code>uml_live_</code> prefix and are still accepted; new keys always mint as <code>${PRODUCT.tokenPrefix}</code>.</li>
</ul>

PAGES["/api/mcp"] = { title: "MCP tools", html: `
<h1>MCP tools</h1>
<p class="lede">Every tool an MCP client can call against ${PRODUCT.name}, with its exact parameters, the result it really returns, and the reason some of them are missing from your connection.</p>

${prereq([
	`A credential. An <b>MCP link</b> from <b>Get started</b> → pick your client → <b>Create link</b>, or an <b>API key</b> from <b>API Keys</b> → <b>Create API key</b>. See <a href="#/api/auth">Authentication &amp; keys</a>.`,
	`An MCP client that speaks Streamable HTTP, or <code>curl</code> for the raw examples on this page.`,
	`A credential carrying <code>memory:write</code> if you want the save tools to exist at all — a read-only connection is not shown them. Keys carry read and write by default.`,
])}

<h2>The server</h2>
<table>
<tr><td><b>Name</b></td><td><code>itsuki-memory</code>, version <code>0.7.0</code> (reported in the initialize result and by <code>whoami</code>)</td></tr>
<tr><td><b>Transport</b></td><td>Streamable HTTP. POST JSON-RPC 2.0; responses come back as an SSE stream, not a plain JSON body.</td></tr>
<tr><td><b>Endpoint</b></td><td><code>${ORIGIN}/mcp/&lt;mcp-link-token&gt;</code> or <code>${ORIGIN}/mcp</code> with a Bearer header</td></tr>
<tr><td><b>Required request headers</b></td><td><code>content-type: application/json</code> and <code>accept: application/json, text/event-stream</code>. Both are enforced.</td></tr>
<tr><td><b>Request size ceiling</b></td><td>524,288 bytes (512 KiB) of UTF-8 per request, bounded before the transport parses anything</td></tr>
<tr><td><b>Tools</b></td><td>11 on a connection that can read, write and delete. Fewer otherwise — the gating table below says which.</td></tr>
</table>

<p>The server also ships an <code>instructions</code> block in its initialize result, which most hosts prepend to the model's context. It tells the model to recall at the start of a conversation, to send conversation turns verbatim rather than pre-summarised, and — the load-bearing sentence — to <i>"report exactly what the receipt says, and never claim something was saved without a receipt."</i></p>

<h2>Two ways to authenticate</h2>
<table>
<tr><th></th><th>Path door</th><th>Header door</th></tr>
<tr><td><b>URL</b></td><td><code>${ORIGIN}/mcp/${PRODUCT.tokenPrefix}…</code></td><td><code>${ORIGIN}/mcp</code></td></tr>
<tr><td><b>Credential travels in</b></td><td>The last path segment</td><td><code>Authorization: Bearer</code></td></tr>
<tr><td><b>Accepts</b></td><td>MCP links only</td><td>API keys, MCP links, and OAuth access tokens</td></tr>
<tr><td><b>For</b></td><td>Clients that take a URL and nothing else</td><td>Clients that ship a fixed URL and hold the key in their own config</td></tr>
</table>

<div class="note"><b>The asymmetry is deliberate and one-way.</b> An API key pasted into the URL path is refused by name: <i>"That is an API key, not an MCP link."</i> An MCP link sent as a Bearer header works fine. Only the path door is restricted.</div>

<p>There is a third door for clients that do their own authorization: OAuth 2.1 at <code>${ORIGIN}/mcp</code>, discoverable from the <code>WWW-Authenticate</code> challenge the header door returns on a rejected Bearer token. The consent screen asks for a subset of <code>memory:read</code>, <code>memory:write</code> and <code>memory:delete</code>, and an OAuth connection is held to the strict rule: <b>deleting requires the explicitly consented <code>memory:delete</code></b>. API keys and MCP links keep their historical contract instead — write scope plus a live delete permission on the project.</p>

<h2>Connect and confirm the door is open</h2>
<ol class="steps">
<li><b>Create the credential in the app.</b><p>For a chat client, open <b>Get started</b>, pick your client, and click <b>Create link</b>. For anything you write yourself, open <b>API Keys</b> and click <b>Create API key</b>. Either secret is shown once.</p></li>
<li><b>Keep it in your shell for the rest of this page.</b>
${codeBlock(`export ITSUKI_API_KEY=${PRODUCT.tokenPrefix}your_key_here`, "terminal")}
</li>
<li><b>Ask the server what it exposes.</b><p>No handshake is needed first — the door is stateless, so <code>tools/list</code> answers on its own.</p>
${codeBlock(`curl -N -X POST ${ORIGIN}/mcp \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -H "accept: application/json, text/event-stream" \\
  -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'`, "terminal")}
${outputBlock(`event: message
data: {"result":{"tools":[{"name":"save_memory","description":"Save a single durable fact about the user…","inputSchema":{"type":"object","properties":{"content":{"type":"string"}},"required":["content"]}}, …]},"jsonrpc":"2.0","id":1}`, "Raw response")}
<p>A connection with read, write and delete sees exactly these eleven names: <code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code>, <code>list_memories</code>, <code>get_memory</code>, <code>update_memory</code>, <code>rollback_memory</code>, <code>memory_history</code>, <code>delete_memory</code>, <code>delete_all_memories</code>, <code>whoami</code>.</p></li>
<li><b>Call whoami.</b><p>This is the verification step in every install guide, because it proves the credential, the memory space it resolves to, the scopes it actually carries, and that there is data behind it — in one call.</p>
${codeBlock(`curl -N -X POST ${ORIGIN}/mcp \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -H "accept: application/json, text/event-stream" \\
  -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"whoami","arguments":{}}}'`, "terminal")}
${outputBlock(`Connected to Itsuki memory (server 0.7.0). Scopes: memory:read, memory:write.
Stored: 34 memories (28 facts, 6 pages), 12 events, 3 pending candidates.`, "The text the model sees")}
<p>If those counts come back, the door is open. If the scope list is shorter than you expected, that is the answer to why a tool is missing.</p></li>
</ol>

<div class="note"><b>About the frames.</b> Every response is SSE-framed: one <code>event: message</code> line, then the whole JSON-RPC object on a single <code>data:</code> line. The samples from here on show that object decoded and pretty-printed, because the wire form is unreadable.</div>

<h2>Every tool result has two halves</h2>
<p>Each result carries a <code>content</code> array and a <code>structuredContent</code> object. They are not redundant — most MCP clients surface only <code>content</code> to the model, so the text half has to be usable on its own.</p>
<table>
<tr><th>Half</th><th>What is in it</th></tr>
<tr><td><code>content[0].text</code></td><td>The readable answer. For <code>recall_memory</code> this is <b>the recalled memory itself</b>, not a receipt — returning only a summary handed the model a success message with nothing to read, and recall looked broken while working perfectly. For every other tool it is the summary line.</td></tr>
<tr><td><code>structuredContent</code></td><td>The full payload: <code>ok</code>, <code>command_mode</code>, <code>source</code>, <code>summary</code>, plus whatever the tool produced. Clients that read structured output get the receipt, the ids and the counts.</td></tr>
</table>

<div class="note"><b>Refusals are tool results, not transport errors.</b> A scope refusal, a rate-limit trip, or a quota refusal comes back as <code>isError: true</code> with <code>ok: false</code> and the reason as readable text. An HTTP error would tear down the MCP connection and the model would never learn why — so the door answers 200 with an honest failure instead.</div>

<h2>Which tools a connection is shown</h2>
<p>Tools are registered per request, against the credential presented. A connection is never advertised a tool it could only be refused: a read-only key that could see <code>save_memory</code> would make the model propose saves that can never land.</p>
<table>
<tr><th>Tool</th><th>Advertised when the connection carries</th></tr>
<tr><td><code>recall_memory</code>, <code>list_memories</code>, <code>get_memory</code>, <code>whoami</code></td><td>Always registered; each call still requires <code>memory:read</code>.</td></tr>
<tr><td><code>save_memory</code>, <code>save_conversation</code></td><td><code>memory:write</code></td></tr>
<tr><td><code>update_memory</code>, <code>rollback_memory</code></td><td><code>memory:write</code></td></tr>
<tr><td><code>memory_history</code></td><td><code>memory:read</code></td></tr>
<tr><td><code>delete_memory</code>, <code>delete_all_memories</code></td><td>OAuth: <code>memory:delete</code>. API key or MCP link: <code>memory:write</code> <b>and</b> the project's delete permission.</td></tr>
</table>

<p>Two further facts about that table:</p>
<ul>
<li><b>Advertisement is usability; enforcement is separate.</b> Calling an unadvertised tool anyway is still refused per call, and destructive commits re-prove the credential and the permission <i>inside the deleting database batch</i> — so a key revoked, or a role downgraded, between the check and the commit aborts the write rather than landing it.</li>
<li><b>A role change narrows a live key with nothing to revoke.</b> Effective scope is the credential's declared scopes intersected with the creator's current project role, resolved fresh on every request. Demote someone to viewer and their existing MCP connection keeps recalling and stops saving, on the very next call.</li>
</ul>

<h2>The shared memoryScope object</h2>
<p>Four tools — <code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code> and <code>list_memories</code> — accept an optional <code>memoryScope</code> object for attribution. It is <b>strict</b> — an unrecognised key is rejected rather than ignored — and every field is an optional string.</p>
<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>projectId</code></td><td>Stable opaque project id. <b>Required</b> for <code>recallScope</code> values other than <code>global</code>, and used by <code>list_memories</code> as a filter. Max 160 characters, no control characters, no surrounding whitespace.</td></tr>
<tr><td><code>projectName</code></td><td>Human-readable name. Display metadata only — it can never turn an otherwise-global write into a project write.</td></tr>
<tr><td><code>workspaceId</code>, <code>appId</code>, <code>agentId</code>, <code>sessionId</code>, <code>threadId</code>, <code>topic</code>, <code>sourceScope</code></td><td>Caller attribution, carried into source provenance.</td></tr>
</table>

<div class="warn"><b>You cannot address someone else's memory with these fields.</b> Tenant ownership is always derived from the authenticated connection and applied last, over anything the caller sent. That is what stops a forged owner or external-user id from entering provenance, webhook routing, or project inventory.</div>

<h2>Tool reference</h2>
<p>Every tool below returns the two-part result described above. The samples show the fields that matter; the real <code>structuredContent</code> carries more.</p>

<h3>save_memory</h3>
<p>One explicitly stated durable fact. Registered only on a connection carrying <code>memory:write</code>.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>content</code></td><td>string</td><td>Yes</td><td>"The durable fact, in the user's words." Trimmed, at least one character.</td></tr>
<tr><td><code>recentContext</code></td><td>string</td><td>No</td><td>Surrounding conversation used to resolve references like "it" or "that". <b>Not itself memorised.</b></td></tr>
<tr><td><code>conversationId</code></td><td>string</td><td>No</td><td>Stable conversation id, for source tracking.</td></tr>
<tr><td><code>threadId</code></td><td>string</td><td>No</td><td>Host or client thread id, for source tracking.</td></tr>
<tr><td><code>sourceId</code></td><td>string</td><td>No</td><td>Caller source id, for idempotency and source tracking.</td></tr>
<tr><td><code>idempotencyKey</code></td><td>string</td><td>No</td><td>Safe retries. The same key with the same content replays the original receipt; with different content it conflicts.</td></tr>
<tr><td><code>memoryScope</code></td><td>object</td><td>No</td><td>See above. Strict.</td></tr>
</table>

${outputBlock(`{
  "content": [{ "type": "text", "text": "Saved: 1 node (Kotlin), 1 slice." }],
  "structuredContent": {
    "ok": true,
    "command_mode": "direct_save",
    "source": "save_memory",
    "fired": true,
    "processing": false,
    "summary": "Saved: 1 node (Kotlin), 1 slice.",
    "source_packet_id": "sp_9f2c1d4a…",
    "receipt_id": "receipt_door_sp_9f2c1d4a…",
    "counts": { "received": 1, "savedTotal": 2, "nodes": 1, "slices": 1, "skipped": 0 }
  }
}`, "Tool result")}

<p>Two behaviours worth knowing before you read a result:</p>
<ul>
<li><b>It waits for the real verdict, up to about nine seconds.</b> If the extraction receipt has not landed by then the result is still <code>ok: true</code>, with <code>processing: true</code> and a receipt whose outcome is <code>accepted</code>. That is an accepted write, not a failure — poll <code>GET /v1/packets/&lt;source_packet_id&gt;/status</code> for the settled verdict.</li>
<li><b>Zero is a legitimate answer.</b> A question, small talk, or a duplicate returns <code>ok: true</code> with <code>Saved: 0. Reason: nothing durable here (chatter, a question, or a duplicate).</code></li>
</ul>

<p>Single facts take a light path: when the fact resolves fewer than two co-mentioned entities, the relation and reflexion passes are skipped, because there is nothing for them to draw an edge between. The skip is named on the receipt rather than hidden.</p>

<h3>save_conversation</h3>
<p>Several chat turns at once, sent verbatim. Registered only on a connection carrying <code>memory:write</code>.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>messages</code></td><td>array</td><td>Yes</td><td>At least one. Oldest first. Each item: <code>content</code> (string, required, trimmed, non-empty), <code>role</code> (<code>user</code> or <code>assistant</code>, defaults to <code>user</code>), <code>id</code> (string), <code>ts</code> (number). <b>Ceiling: 200 messages or 60,000 characters per call.</b></td></tr>
<tr><td><code>conversationId</code></td><td>string</td><td>No</td><td>The convergence key. Re-sends de-duplicate against it, and every save of the same conversation lands on <b>one</b> Conversation page, advanced as a forward revision. Omit it and each save makes its own page.</td></tr>
<tr><td><code>scope</code></td><td>enum</td><td>No</td><td><code>full</code> (default), <code>lastN</code>, <code>topic</code>, or <code>summary</code> (declaring the payload is already condensed). Narrowing happens deterministically at the door, before anything is staged — but only <code>lastN</code> and <code>topic</code> actually filter; <code>summary</code> changes nothing here.</td></tr>
<tr><td><code>n</code></td><td>number</td><td>No</td><td>With <code>scope: "lastN"</code>: how many of the most recent messages to keep.</td></tr>
<tr><td><code>topic</code></td><td>string</td><td>No</td><td>With <code>scope: "topic"</code>: keep only user messages mentioning it. Assistant turns are kept as context regardless.</td></tr>
<tr><td><code>contentScope</code></td><td>object</td><td>No</td><td>Optional strict content selection: <code>subject</code>, <code>speakerScope</code> (only <code>user_only</code> is supported), <code>includeAssistantFacts</code>, <code>excludeOtherPeople</code>, <code>includeContextForReferenceResolution</code>.</td></tr>
<tr><td><code>threadId</code>, <code>sourceId</code>, <code>idempotencyKey</code>, <code>memoryScope</code></td><td>string / object</td><td>No</td><td>As for <code>save_memory</code>.</td></tr>
</table>

<div class="note"><code>contentScope</code> is accepted for schema compatibility, but subject narrowing now happens inside the shared engine's gates rather than in a second extraction lane. Send it if your client already does; do not expect it to be the mechanism.</div>

${outputBlock(`{
  "content": [{ "type": "text", "text": "Staged ✓ \\"Kotlin Study Plan\\" — 6 message(s) captured. Facts and relationships are being extracted now (~1 min); this save is final only when its page shows enriched." }],
  "structuredContent": {
    "ok": true,
    "command_mode": "conversation_collect",
    "source": "save_conversation",
    "fired": true,
    "processing": true,
    "source_packet_id": "sp_4b81e07c…",
    "receipt_id": "receipt_mcp_stage_job_7fd2…",
    "page_id": "page_2a55d1…",
    "title": "Kotlin Study Plan",
    "staged_facts": 6,
    "job_id": "job_7fd2…",
    "job_status": "staged",
    "counts": { "received": 6, "savedTotal": 0, "skipped": 0 }
  }
}`, "Tool result")}

<p>This tool is receipt-first: it stages deterministically with no model calls, answers in well under a second, and lets the background engine do the extraction. That is why <code>counts.savedTotal</code> is <code>0</code> here and the receipt says <b>staged</b>, never <i>saved</i>. Attribution rules still apply when the engine runs — assistant prose is context, and becomes a user fact only when a later user turn explicitly adopts it.</p>

<p>Over the ceiling, the refusal is explicit rather than a silent truncation:</p>
${outputBlock(`Saved: 0. This conversation is too large for one save (limit 200 messages / 60k characters) — send the part that matters.`, "content[0].text")}

<h3>recall_memory</h3>
<p>The read tool. Registered on every connection; each call requires <code>memory:read</code>.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>query</code></td><td>string</td><td>Yes</td><td>"What to look up about the user, e.g. 'boxing' or 'what are my projects'."</td></tr>
<tr><td><code>recallScope</code></td><td>enum</td><td>No</td><td><code>global</code> (default), <code>project_only</code>, or <code>project_then_global</code>. The two project modes <b>require</b> <code>memoryScope.projectId</code>; without it the call is refused with <code>project_id_required</code>.</td></tr>
<tr><td><code>topic</code></td><td>string</td><td>No</td><td>Topic hint, for source tracking.</td></tr>
<tr><td><code>conversationId</code>, <code>threadId</code>, <code>sourceId</code>, <code>idempotencyKey</code>, <code>memoryScope</code></td><td>string / object</td><td>No</td><td>Source tracking and attribution.</td></tr>
</table>

<p>The text half is the memory itself, prefixed so the model knows what it is looking at:</p>
${outputBlock(`Relevant memory for this user:

Kotlin — skill
- started learning this week`, "content[0].text")}

${outputBlock(`{
  "ok": true,
  "command_mode": "recall",
  "source": "recall",
  "fired": false,
  "processing": false,
  "summary": "Found relevant memory.",
  "context": "Kotlin — skill\\n- started learning this week\\n",
  "items": [{ "type": "node", "id": "node_7c1e…", "label": "Kotlin", "category": "skill", "score": 0.8421 }],
  "count": 1,
  "recall_status": "light_recall",
  "recall_scope": "global",
  "processing_note": null
}`, "structuredContent")}

<p>An empty result is an honest success: <code>context: ""</code>, <code>count: 0</code>, and the text half falls back to <i>"No relevant memory found."</i> If a recent save is still settling, <code>processing_note</code> says so.</p>

<div class="note"><b>Project-scoped recall is a different retrieval, not a filtered one.</b> When <code>recallScope</code> is not <code>global</code>, the full-text and vector lanes are skipped entirely rather than post-filtered — neither index carries project attribution, and post-filtering a globally ranked list lets one project starve another. Scoped recall runs on exact and alias matching, keywords, and graph expansion. <a href="#/concepts/retrieval">How recall works</a> has the full path.</div>

<h3>list_memories</h3>
<p>Inventory, newest first. This is the tool for "what do you remember" and for cleanup; for meaning-based lookup use <code>recall_memory</code>.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>kind</code></td><td>enum</td><td>No</td><td><code>all</code> (default), <code>node</code>, or <code>page</code>. Slices, events and candidates are not listable.</td></tr>
<tr><td><code>limit</code></td><td>number</td><td>No</td><td>1 to 200, default 50. Outside the range the call is refused with <code>invalid_limit</code>, never silently clamped.</td></tr>
<tr><td><code>cursor</code></td><td>string</td><td>No</td><td>Opaque keyset cursor, taken from a previous call's <code>next_cursor</code>. <code>null</code> means you are on the last page.</td></tr>
<tr><td><code>q</code></td><td>string</td><td>No</td><td>Substring filter on labels and summaries, truncated at 200 characters. <b>Not semantic search.</b></td></tr>
<tr><td><code>memoryScope</code></td><td>object</td><td>No</td><td>Only <code>projectId</code> has an effect here: it restricts the listing to that project.</td></tr>
</table>

${outputBlock(`{
  "content": [{ "type": "text", "text": "2 memories:\\n\\n1. node_7c1e… [node/skill] Kotlin — started learning this week\\n2. page_2a55… [page/interest] Kotlin Study Plan — a six-week plan with weekly checkpoints" }],
  "structuredContent": {
    "ok": true,
    "command_mode": "list",
    "items": [
      { "id": "node_7c1e…", "kind": "node", "revision": 3, "label": "Kotlin", "category": "skill", "state": "active", "summary": "started learning this week", "created_at": 1756300000000, "updated_at": 1756386400000 },
      { "id": "page_2a55…", "kind": "page", "revision": 1, "title": "Kotlin Study Plan", "category": "interest", "summary": "a six-week plan with weekly checkpoints", "created_at": 1756299000000, "updated_at": 1756299000000 }
    ],
    "count": 2,
    "next_cursor": null
  }
}`, "Tool result")}

<p>The ids in <code>items</code> are exactly what <code>get_memory</code>, <code>update_memory</code>, <code>memory_history</code> and <code>delete_memory</code> accept.</p>

<h3>get_memory</h3>
<p>One object in full.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>id</code></td><td>string</td><td>Yes</td><td>Advertised as a <code>node_</code>, <code>page_</code>, <code>slice_</code> or candidate id. An <code>event_</code> id also resolves, though the tool description does not name it.</td></tr>
</table>

${outputBlock(`{
  "content": [{ "type": "text", "text": "node_7c1e… [node/skill] Kotlin — started learning this week\\n\\nCurrent: started learning Kotlin this week\\n\\n2 dated event(s); newest: finished the coroutines chapter" }],
  "structuredContent": {
    "ok": true,
    "command_mode": "get",
    "kind": "node",
    "memory": {
      "id": "node_7c1e…",
      "label": "Kotlin",
      "category": "skill",
      "state": "active",
      "revision": 3,
      "summary": "started learning this week",
      "slices": [{ "id": "slice_11ab…", "text": "started learning Kotlin this week", "kind": "progress", "is_current": 1 }],
      "events": [{ "id": "event_90cd…", "action": "completed", "text": "finished the coroutines chapter", "importance": "ordinary", "happened_at": 1756300000000 }]
    }
  }
}`, "Tool result")}

<p>A node carries up to 10 slices (current first) and up to 20 events (newest first). A page carries its <code>full_markdown</code>, capped at 20,000 characters with <code>full_markdown_truncated: true</code> when it was cut. The <code>revision</code> in the result is the value <code>update_memory</code> wants as <code>expectedRevision</code>.</p>
<p>Two refusals: <code>unrecognized_id</code> ("expected a node_, page_, slice_, or candidate id") and <code>not_found</code> ("No live memory with id …").</p>

<h3>update_memory</h3>
<p>Deterministic correction with immutable history. Registered only on a connection carrying <code>memory:write</code>.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>id</code></td><td>string</td><td>Yes</td><td>A <code>node_</code>, <code>page_</code>, <code>slice_</code> or <code>event_</code> id. Candidates and edges are not updatable — they return <code>unsupported_kind</code>.</td></tr>
<tr><td><code>expectedRevision</code></td><td>integer</td><td>Yes</td><td>At least 1. "The current revision you read." A stale value is refused with the fresh one, never overwritten.</td></tr>
<tr><td><code>fields</code></td><td>object</td><td>Yes</td><td>The editable fields to change, e.g. <code>{"summary": "corrected text"}</code>. Values are strings, numbers or null. At least one field; any key outside the allowed set is refused by name.</td></tr>
<tr><td><code>idempotencyKey</code></td><td>string</td><td>Yes</td><td>8 to 120 characters. Required, not optional — a retried correction must not apply twice.</td></tr>
<tr><td><code>reason</code></td><td>string</td><td>No</td><td>Short correction reason, kept in the revision history.</td></tr>
</table>

<p>Which fields are editable depends entirely on the kind:</p>
<table>
<tr><th>Kind</th><th>Editable fields</th><th>Constraints</th></tr>
<tr><td>node</td><td><code>label</code>, <code>category</code>, <code>summary</code></td><td>label at most 200 characters and non-empty; category must be one of person, family, relationship, project, system, tool, skill, habit, health, goal, preference, identity, life_event, place, organization, possession, interest, other; summary at most 4,000 characters or null</td></tr>
<tr><td>page</td><td><code>title</code>, <code>short_summary</code>, <code>full_markdown</code></td><td>title at most 200 and non-empty; short_summary at most 4,000; full_markdown at most 20,000; the last two accept null</td></tr>
<tr><td>slice (a detail)</td><td><code>text</code>, <code>kind</code></td><td>text at most 4,000 and non-empty; kind one of feature_detail, technical_detail, progress, blocker, fix, decision, preference, other</td></tr>
<tr><td>event</td><td><code>text</code>, <code>importance</code>, <code>happened_at</code></td><td>text at most 4,000 and non-empty; importance one of ordinary, important, life_significant; happened_at a unix-millisecond timestamp, not in the future</td></tr>
</table>

${outputBlock(`{
  "content": [{ "type": "text", "text": "Updated. The memory is now revision 4; the previous content is retained as history." }],
  "structuredContent": {
    "ok": true,
    "command_mode": "update",
    "id": "node_7c1e…",
    "kind": "node",
    "action": "update",
    "revision": 4,
    "previous_revision": 3,
    "projections": { "search": "pending", "vector": "pending" }
  }
}`, "Tool result")}

<p>A patch that changes nothing is a no-op, not an error: <i>"No change — the memory already reads exactly like that (revision 4)."</i> A stale <code>expectedRevision</code> is refused with the fresh number in the payload, so the caller can re-read and retry:</p>
${outputBlock(`{
  "ok": false,
  "command_mode": "update",
  "error": "stale_revision",
  "summary": "The memory changed since you read it. Reload, review, and retry with the new revision.",
  "current_revision": 5
}`, "structuredContent on refusal")}

<p><code>projections</code> is honest about a real property of the system: the canonical row is updated immediately, while the search and vector indexes catch up afterwards and must earn <code>ready</code>. A correction is true the moment it returns; it becomes <i>findable</i> by that new wording shortly after.</p>

<h3>rollback_memory</h3>
<p>Restore an earlier revision's content as a <b>new forward revision</b>. Nothing in history is rewound or removed. Registered only on a connection carrying <code>memory:write</code>.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>id</code></td><td>string</td><td>Yes</td><td>The memory id.</td></tr>
<tr><td><code>toRevision</code></td><td>integer</td><td>Yes</td><td>The historical revision to restore, from <code>memory_history</code>. Naming the current revision is refused; a revision that was never recorded, or has been removed, returns <code>revision_unavailable</code>.</td></tr>
<tr><td><code>expectedRevision</code></td><td>integer</td><td>Yes</td><td>The <b>current</b> head revision. A stale value is refused.</td></tr>
<tr><td><code>idempotencyKey</code></td><td>string</td><td>Yes</td><td>8 to 120 characters.</td></tr>
<tr><td><code>reason</code></td><td>string</td><td>No</td><td>Kept in the revision history.</td></tr>
</table>

${outputBlock(`{
  "content": [{ "type": "text", "text": "Restored revision 1 as new revision 5. Nothing was deleted." }],
  "structuredContent": {
    "ok": true,
    "command_mode": "rollback",
    "id": "node_7c1e…",
    "kind": "node",
    "action": "rollback",
    "revision": 5,
    "previous_revision": 4,
    "rolled_back_to": 1
  }
}`, "Tool result")}

<h3>memory_history</h3>
<p>One memory's revision history, newest first. Registered on a connection carrying <code>memory:read</code>.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>id</code></td><td>string</td><td>Yes</td><td>A node, page, slice or event id.</td></tr>
<tr><td><code>limit</code></td><td>integer</td><td>No</td><td>1 to 50, default 20.</td></tr>
<tr><td><code>cursor</code></td><td>string</td><td>No</td><td>From a previous call's <code>next_cursor</code>.</td></tr>
</table>

${outputBlock(`{
  "content": [{ "type": "text", "text": "Revision 5 is current. 5 recorded:\\nr5 rollback — restoring the original wording\\nr4 update\\nr3 system (captured)\\nr2 update — fixed the spelling\\nr1 baseline (captured)" }],
  "structuredContent": {
    "ok": true,
    "command_mode": "history",
    "id": "node_7c1e…",
    "kind": "node",
    "current_revision": 5,
    "total_revisions": 5,
    "retention": "retained_until_object_deleted",
    "revisions": [
      { "revision": 5, "parent_revision": 4, "action": "rollback", "rollback_of": 1, "actor": "token", "reason": "restoring the original wording", "content_hash": "b91f…", "created_at": 1756386400000 }
    ],
    "next_cursor": null
  }
}`, "Tool result")}

<p><code>action</code> is one of <code>baseline</code>, <code>system</code>, <code>update</code> or <code>rollback</code>; <code>captured: true</code> marks the rows the system wrote for you rather than a person. Read <code>retention</code> literally: history is never auto-pruned, and it is also never a shadow copy — deleting the object, purging the project, retention expiry, or erasing the account destroys the history with it.</p>

<h3>delete_memory</h3>
<p>Permanently delete one object. Advertised only to a connection that can actually delete.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>id</code></td><td>string</td><td>Yes</td><td>A <code>node_</code>, <code>page_</code>, <code>slice_</code> or candidate id. An <code>event_</code> id is refused here with <code>unrecognized_id</code> even though <code>get_memory</code> resolves one.</td></tr>
</table>

${outputBlock(`{
  "content": [{ "type": "text", "text": "Deleted node_7c1e…. This memory will no longer be recalled." }],
  "structuredContent": {
    "ok": true,
    "command_mode": "delete",
    "id": "node_7c1e…",
    "kind": "node",
    "deleted": true
  }
}`, "Tool result")}

<p>Same effect as <code>DELETE /v1/memories/&lt;id&gt;</code>, including the deletion tombstone. Deleting a node cascades to its slices, events and touching edges; deleting a single slice is how you remove one wrong fact without destroying the memory around it. Identity keys, search-index rows, vectors and the object's whole revision history are removed outright. <a href="#/concepts/delete">What deletion removes</a> has the full list.</p>

<h3>delete_all_memories</h3>
<p>Erasure, safe by default. Advertised only to a connection that can delete.</p>
<table>
<tr><th>Parameter</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>confirm</code></td><td>boolean</td><td>No</td><td>Absent or <code>false</code>: dry-run preview only, nothing is touched. <code>true</code>: irreversible erasure.</td></tr>
<tr><td><code>source</code></td><td>string</td><td>No</td><td>Restrict to memories written by one source or tool instead of everything. Must be 1 to 64 characters with no control characters — an invalid filter is refused loudly rather than silently matching nothing.</td></tr>
</table>

${outputBlock(`{
  "content": [{ "type": "text", "text": "Dry run only — nothing deleted. 41 object(s) would be removed. Ask the user to confirm, then call again with confirm=true." }],
  "structuredContent": {
    "ok": true,
    "command_mode": "delete_all",
    "confirmed": false,
    "dry_run": true,
    "would_delete": { "nodes": 28, "pages": 6, "slices": 4, "events": 3, "candidates": 0 },
    "sample_labels": ["Kotlin", "Porto depot", "Rahul"],
    "pending_jobs": 0
  }
}`, "Tool result")}

<p>A confirmed erasure answers <code>Erasure complete: 41 object(s) removed.</code> and cancels in-flight extraction jobs, which then settle as failed with a <code>cancelled_by_delete:</code> reason rather than landing memories after the erasure.</p>

<h3>whoami</h3>
<p>Identity and health. No parameters. Registered on every connection.</p>

${outputBlock(`{
  "content": [{ "type": "text", "text": "Connected to Itsuki memory (server 0.7.0). Project: Acme production. Scopes: memory:read, memory:write. Stored: 34 memories (28 facts, 6 pages), 12 events, 3 pending candidates." }],
  "structuredContent": {
    "ok": true,
    "command_mode": "whoami",
    "server": { "name": "itsuki-memory", "version": "0.7.0" },
    "user_id": "usr_5c30…",
    "scopes": ["memory:read", "memory:write"],
    "can_delete": true,
    "project": { "id": "prj_18ae…", "name": "Acme production" },
    "counts": { "memories": 34, "nodes": 28, "pages": 6, "slices": 61, "events": 12, "candidates": 3 }
  }
}`, "Tool result")}

<p><code>scopes</code> is the <i>effective</i> set for this connection, after the credential's declared scopes have been intersected with the current project role — so it is the direct answer to "why can this client not save". <code>can_delete</code> is resolved the same way and is the reason the delete tools are or are not in the list.</p>

<h2>Design guarantees</h2>
<ul>
<li><b>The host model decides when to call tools.</b> Nothing here fires on a schedule. If you need a guaranteed invocation on every turn, do not rely on the model choosing to call <code>save_memory</code> — call <code>POST /v1/turn</code> from your own runtime and inspect its collect receipt and packet status. See <a href="#/api/rest">the REST reference</a>.</li>
<li><b>Write results distinguish three different things:</b> work queued locally, a write the server accepted, and a backend receipt that says what was actually stored. Asynchronous enrichment has its own packet status on top of that. A tool never reports an acceptance that did not happen.</li>
<li><b>Rate limits are per credential and project, not per <code>memoryScope</code>.</b> The bucket key comes from the authenticated credential and its bound project, so rotating attribution fields does not buy a fresh allowance. The save lane (<code>save_memory</code>, <code>save_conversation</code>, <code>update_memory</code>, <code>rollback_memory</code>) allows 60 calls per minute, the read lane (<code>list_memories</code>, <code>get_memory</code>, <code>memory_history</code>, <code>whoami</code>) 240, and the delete tools 30. <code>recall_memory</code> is in none of them — it is bounded separately at 120 lookups per minute, per memory space.</li>
<li><b>Nothing in this door enters the extraction pipeline except the two save tools.</b> The management tools wrap the same rows the REST surface reads and writes; there is no second, MCP-only copy of your memory.</li>
</ul>

<h2>When it doesn't work</h2>
<table>
<tr><th>What you see</th><th>What it means</th><th>Fix</th></tr>
<tr><td><code>406 Not Acceptable: Client must accept both application/json and text/event-stream</code></td><td>The POST did not advertise both media types.</td><td>Send <code>accept: application/json, text/event-stream</code>. Every real MCP client already does; hand-written curl usually does not.</td></tr>
<tr><td><code>415 Unsupported Media Type: Content-Type must be application/json</code></td><td>Missing or wrong content type.</td><td>Add <code>content-type: application/json</code>.</td></tr>
<tr><td><code>401 unauthorized mcp token</code> — <i>"That is an API key, not an MCP link."</i></td><td>An API key was pasted into the URL path.</td><td>Move it to an <code>Authorization: Bearer</code> header against <code>${ORIGIN}/mcp</code>, or create an MCP link instead.</td></tr>
<tr><td><code>401</code> — <i>"That MCP link is revoked, expired, or not an MCP token."</i></td><td>The link was deleted, or the last path segment is not a credential.</td><td>Create a fresh link in <b>Get started</b> and update the client's URL.</td></tr>
<tr><td><code>403 {"error":"forbidden","code":"insufficient_scope","required_scope":"memory:read"}</code></td><td>The connection cannot read at all, so no server was built. This one is a plain HTTP body, not a JSON-RPC error.</td><td>Use a credential with <code>memory:read</code>, and check the creator's project role has not been reduced to nothing.</td></tr>
<tr><td>Tool result <i>"Forbidden: token lacks required scope."</i></td><td>A per-call scope refusal, <code>code: insufficient_scope</code>, with <code>required_scope</code> naming what was missing.</td><td>Use a credential carrying that scope. If the tool was not in <code>tools/list</code> either, this is the same cause.</td></tr>
<tr><td>Tool result <i>"Forbidden: your project role does not allow deleting memories."</i></td><td><code>insufficient_capability</code>, <code>required_capability: project.memory.delete</code>. The scope was fine; the role was not.</td><td>Deletion is a project-admin capability. See <a href="#/guides/projects">Projects &amp; teams</a>.</td></tr>
<tr><td>Tool result <i>"You're sending requests very quickly — wait a few seconds and try again."</i></td><td>A rate bucket tripped. Delivered as a tool result with <code>http_status: 429</code> and <code>retry_after_s: 60</code> inside the payload — the HTTP response is still 200 so the connection survives.</td><td>Back off for the stated interval. <a href="#/api/limits">Rate limits</a> lists every bucket.</td></tr>
<tr><td><code>recall_status: "rate_limited"</code> with an empty context</td><td>The per-user recall limiter (120 per minute) tripped. Recall answers <code>ok: true</code> with nothing in it rather than failing.</td><td>Treat an empty context from this status as "try again", not as "no memory".</td></tr>
<tr><td><code>-32001</code> — <i>"The MCP request exceeds 524288 UTF-8 bytes."</i></td><td>HTTP 413. The whole JSON-RPC envelope was too large.</td><td>Send fewer messages per <code>save_conversation</code> call. The staging ceiling of 200 messages / 60k characters usually bites first.</td></tr>
<tr><td><code>unrecognized_id</code></td><td>The id prefix is not one the tool accepts.</td><td>Take ids from <code>list_memories</code>, a receipt, or recall. Remember <code>delete_memory</code> does not accept <code>event_</code> ids.</td></tr>
<tr><td><code>stale_revision</code></td><td>Someone or something advanced the memory between your read and your write.</td><td>Re-read with <code>get_memory</code>, then retry with the <code>current_revision</code> the refusal gave you.</td></tr>
<tr><td>The model never calls anything</td><td>By design — tool choice belongs to the host.</td><td>Ask it explicitly ("save that to ${PRODUCT.name.toLowerCase()}"), or drive the write from your own code.</td></tr>
</table>

<h2>Where to go next</h2>
${nextSteps([
	["#/install/claude", "Connect a client", "The per-client setup steps, including the switch everyone forgets."],
	["#/api/auth", "Authentication & keys", "Scopes, project roles, and what a credential can actually do."],

	["#/api/rest", "REST API reference", "The same operations from your own runtime, on your own schedule."],
])}
` };

PAGES["/sdk/python"] = { title: "Python SDK", html: `
<h1>Python SDK</h1>
<p class="lede">Install the client, save and recall a memory from a script, and know for every method which endpoint it calls, what it returns, and whether it will retry.</p>

${prereq([
	`Python 3.9 or newer. The package declares <code>requires-python &gt;=3.9</code>, so pip refuses an older interpreter rather than installing something that will fail at import.`,
	`An API key from <b>API Keys</b> in the app. It starts <code>${PRODUCT.tokenPrefix}</code> and is shown once — see <a href="#/api/auth">Authentication &amp; keys</a>.`,
	`A key whose scopes cover what you intend to call: recall and the diagnostic reads need <code>memory:read</code>, writes need <code>memory:write</code>, and <code>delete()</code> needs <code>memory:delete</code>, which write does not imply.`,
])}

<h2>Get running</h2>
<ol class="steps">

<li><b>Install the package.</b>
<p>One dependency comes with it: <code>httpx</code>, which pulls its own.</p>
${codeBlock(`pip install ${PRODUCT.pkg}`, "terminal")}
${outputBlock(`Collecting ${PRODUCT.pkg}
  Downloading ${PRODUCT.pkg}-…-py3-none-any.whl
Collecting httpx>=0.24
  Downloading httpx-…-py3-none-any.whl
Successfully installed anyio-… certifi-… h11-… httpcore-… httpx-… idna-… ${PRODUCT.pkg}-… sniffio-…`, "terminal output")}
<p>The wheel ships a <code>py.typed</code> marker, so mypy and Pyright read the bundled annotations directly — there is no separate stubs package to install.</p>
</li>

<li><b>Confirm which build you got.</b>
<p>Installing from the registry resolves whatever is currently published, which is not necessarily what you read about. The module carries two constants worth printing.</p>
${codeBlock(`python -c "import ${PRODUCT.pkg}; print(${PRODUCT.pkg}.VERSION, ${PRODUCT.pkg}.DEFAULT_BASE_URL)"`, "terminal")}
${outputBlock(`<the version that resolved> ${ORIGIN}`, "terminal output")}
<p>Check <code>${PRODUCT.pkg}.VERSION</code> before relying on a method you have only just learned about. If the import itself fails, see the table at the end of this page.</p>
</li>

<li><b>Put the key where your script will read it.</b>
${codeBlock(`export ITSUKI_API_KEY=${PRODUCT.tokenPrefix}your_key_here`, "terminal")}
<p>Nothing is printed, and nothing happens automatically. <b>This SDK reads no environment variables at all</b> — <code>os.environ</code> does not appear anywhere in the module. <code>ITSUKI_API_KEY</code> is a convention your code applies, not one the client implements.</p>
</li>

<li><b>Save a memory.</b>
<p>Write a durable fact, not a chat line. <code>new_idempotency_key()</code> is a static method on the client; supplying its result is what makes this write retry-safe.</p>
${codeBlock(`import os

from ${PRODUCT.pkg} import MemoryClient

memory = MemoryClient(api_key=os.environ["ITSUKI_API_KEY"])

receipt = memory.add(
    "I started learning Kotlin this week.",
    idempotency_key=MemoryClient.new_idempotency_key(),
)
print(receipt["summary"])
print(receipt["counts"]["savedTotal"], "object(s) written")
print(receipt["source_packet_id"])`, "first_memory.py")}
${outputBlock(`Saved: 1 fact(s) across 1 page.
2 object(s) written
sp_9f2c1d4a…`, "python first_memory.py")}
<div class="note"><b><code>savedTotal: 0</code> is a working save.</b> Questions, small talk and duplicates come back <code>ok: True</code> having stored nothing, with a summary that says why. Branch on the counts, never on the presence of a response.</div>
</li>

<li><b>Read it back.</b>
<p><code>search()</code> is fully synchronous server-side — no background work, no polling.</p>
${codeBlock(`result = memory.search("what am I learning?")
print(result["count"])
print(result["context"])`, "Python")}
${outputBlock(`1
Kotlin — skill
- started learning this week`, "Output")}
<p><code>context</code> is the prompt-ready block: paste it into a model call as-is. <code>items</code>, <code>nodes</code> and <code>pages</code> hold the ranked shortlist behind it if you would rather render your own.</p>
<p>Extraction after a save runs in the background, so a very fresh fact can miss the first recall. If you need certainty before reading, wait for the packet:</p>
${codeBlock(`if receipt.get("source_packet_id"):
    memory.wait_for(receipt["source_packet_id"])`, "Python")}
</li>

<li><b>Verify the round trip.</b>
<p>One call proves the credential works, resolves the memory space it points at, and reports what is in it.</p>
${codeBlock(`print(memory.status())`, "Python")}
${outputBlock(`{'nodes': 1, 'pages': 1, 'slices': 1, 'events': 0, 'candidates': 0, 'lastCheckpoint': None}`, "Output")}

</li>

</ol>

<h2>Constructing a client</h2>
<p>Two classes share one signature. <code>api_key</code> is positional; everything else is keyword-only.</p>
${codeBlock(`MemoryClient(api_key, *, base_url="${ORIGIN}", user_id=None, timeout=30.0, max_retries=2)
AsyncMemoryClient(api_key, *, base_url="${ORIGIN}", user_id=None, timeout=30.0, max_retries=2)`, "Python")}

<table>
<tr><th>Option</th><th>Type · default</th><th>Accepted values</th></tr>
<tr><td><code>api_key</code></td><td><code>str</code> · required</td><td>A non-empty string with no surrounding whitespace and no control characters.</td></tr>
<tr><td><code>base_url</code></td><td><code>str</code> · <code>${ORIGIN}</code></td><td>A bare origin: no embedded credentials, no path, no query, no fragment. HTTPS, with plain HTTP allowed only for loopback (<code>localhost</code>, <code>127.0.0.0/8</code>, <code>::1</code>). A trailing slash is stripped.</td></tr>
<tr><td><code>user_id</code></td><td><code>Optional[str]</code> · <code>None</code></td><td>The default sub-tenant for every call this client makes. Non-empty, trimmed, no control characters.</td></tr>
<tr><td><code>timeout</code></td><td><code>float</code> · <code>30.0</code></td><td>Seconds. Finite, greater than zero, no greater than 2147483.647. It bounds the <b>whole operation</b>, retries and backoff sleeps included — not one attempt.</td></tr>
<tr><td><code>max_retries</code></td><td><code>int</code> · <code>2</code></td><td>An integer from 0 to 10 inclusive. <code>bool</code> is rejected explicitly, so <code>max_retries=True</code> raises rather than quietly meaning 1.</td></tr>
</table>

<p>Every one of these is checked in the constructor. A bad value raises <code>MemoryAPIError</code> with <code>code: "invalid_argument"</code> and <code>status: 0</code> before any socket is opened — for example <i>"base_url must use HTTPS (HTTP is allowed only for loopback development)"</i>.</p>

<p>Two module-level aliases exist for readability: <code>Memory = MemoryClient</code> and <code>AsyncMemory = AsyncMemoryClient</code>.</p>

<h3>What goes on the wire</h3>
<p>Three headers, on every request, from both clients:</p>
${outputBlock(`authorization: Bearer <your api key>
content-type: application/json
user-agent: ${PRODUCT.pkg}-python/<version>`, "Request headers")}
<p>Redirects are not followed. That is deliberate: a followed redirect would replay your Bearer key to whatever host the redirect named.</p>

<h2>Writing</h2>
<table>
<tr><th>Method</th><th>Sends</th><th>Notes</th></tr>
<tr><td><code>add(content, **opts)</code></td><td><code>POST /v1/save</code></td><td>Aliased as <code>save</code>. The content may be positional or <code>content=</code>. Passing <code>messages=[…]</code> instead routes the call to <code>add_conversation</code>.</td></tr>
<tr><td><code>add_conversation(messages, **opts)</code></td><td><code>POST /v1/save</code> with <code>mode: "conversation"</code></td><td>At least one message required.</td></tr>
<tr><td><code>turn(messages, **opts)</code></td><td><code>POST /v1/turn</code></td><td>Recall and capture in one round trip. <code>turn([])</code> is valid only when you also pass a non-empty <code>query=</code>.</td></tr>
<tr><td><code>ingest(messages, **opts)</code></td><td><code>POST /v1/ingest</code></td><td>Fire-and-forget capture. <code>ingest([])</code> stays valid on purpose, so you can flush held context with <code>flush=True</code>.</td></tr>
</table>

<p>A message is either a plain string or a dict with a required <code>content</code> and optional <code>role</code> (<code>"user"</code>, <code>"assistant"</code>, <code>"system"</code>, <code>"tool"</code>), <code>id</code>, <code>ts</code> and <code>source_event</code>.</p>

${codeBlock(`from ${PRODUCT.pkg} import Message

messages: list[Message] = [
    {"role": "user", "content": "My preferred editor is Helix."},
    {"role": "assistant", "content": "Noted."},
]

receipt = memory.add_conversation(
    messages,
    conversation_id="onboarding-42",
    idempotency_key=MemoryClient.new_idempotency_key(),
)
turn = memory.turn(messages, thread_id="support-42")`, "Python")}

<p>All four writes return the same envelope. <code>add()</code> returns a <code>WriteResult</code>:</p>
${outputBlock(`{'ok': True,
 'mode': 'direct_save',
 'summary': 'Saved: 1 fact(s) across 1 page.',
 'processing': False,
 'source_packet_id': 'sp_9f2c1d4a…',
 'receipt_id': 'receipt_door_sp_9f2c1d4a…',
 'counts': {'received': 1, 'savedTotal': 2, 'nodes': 1, 'slices': 1, 'skipped': 0},
 'memory_scope': {'project_id': None, 'project_name': None, 'workspace_id': 'default'}}`, "WriteResult")}

<p><code>turn()</code> returns a <code>TurnResult</code> instead — the recall half and the capture half, each reporting for itself:</p>
${outputBlock(`{'ok': True,
 'recall': {'ok': True, 'count': 1, 'context': 'Postgres — tool\\n- chosen for the project\\n', 'items': [...]},
 'collect': {'enabled': True, 'ok': True, 'processing': True,
             'source_packet_id': 'sp_5d1e…', 'job_id': 'job_8f…'},
 'rules': {'autoCollect': True}}`, "TurnResult")}

<div class="note"><b><code>collect</code> can report a failure inside a successful turn.</b> When capture is switched off by your rules, or no messages were sent, it comes back <code>{'enabled': False}</code>. When the write half is refused it comes back <code>ok: False</code> with a reason — and the call still returned, because recall answered. Read <code>collect</code>, do not assume it.</div>

<h3>Where the write goes next</h3>
<p><code>/v1/save</code> waits a bounded time for real extraction before answering, so its counts are usually final. <code>/v1/ingest</code> and the capture half of <code>/v1/turn</code> do not wait at all: they return <code>processing: True</code> and hand you a <code>source_packet_id</code> and a <code>job_id</code>. That handle is how you find out what happened.</p>

<table>
<tr><th>Method</th><th>Sends</th><th>Notes</th></tr>
<tr><td><code>packet_status(source_packet_id)</code></td><td><code>GET /v1/packets/&lt;id&gt;/status</code></td><td>One accepted write, right now.</td></tr>
<tr><td><code>jobs(status=None, since=None, limit=None)</code></td><td><code>GET /v1/jobs</code></td><td><code>status</code> must be one of <code>queued</code>, <code>staged</code>, <code>processing</code>, <code>enriched</code>, <code>failed</code>, <code>completed</code>.</td></tr>
<tr><td><code>wait_for(id, timeout=60.0, interval=1.5)</code></td><td>polls the packet route</td><td>Returns when the packet reaches a terminal status, or when the budget runs out.</td></tr>
<tr><td><code>new_idempotency_key()</code></td><td>nothing</td><td>A static method returning <code>idem_</code> plus a fresh UUID4.</td></tr>
</table>

${codeBlock(`receipt = memory.ingest(messages, flush=True)
done = memory.wait_for(receipt["source_packet_id"], timeout=60, interval=1.5)
print(done["status"], done.get("timed_out", False))`, "Python")}
${outputBlock(`enriched False`, "Output")}

<p><b>A polling timeout is not an exception.</b> <code>wait_for</code> returns the last snapshot it saw with <code>timed_out: True</code> added, so a slow queue never becomes a crash. <code>timeout=0</code> still performs exactly one check. The terminal set is exported as <code>TERMINAL_JOB_STATUSES</code>, a frozenset of <code>enriched</code>, <code>failed</code> and <code>completed</code>.</p>

<div class="warn"><b>A job that failed because you erased it must not be retried.</b> Work cancelled by a confirmed erasure settles as <code>status: "failed"</code> — the same word, deliberately, so older pollers do not hang on a status they have never heard of. The distinction is published in two separate fields: <code>cancelled_by_delete: True</code> and <code>outcome_reason: "cancelled_by_delete"</code>. Check them before you re-send anything.</div>

${codeBlock(`page = memory.list_memories(kind="node", q="kotlin", limit=20)
print(page["count"], page["next_cursor"])
print(page["items"][0])`, "Python")}
${outputBlock(`1 None
{'id': 'node_7c…', 'kind': 'node', 'revision': 1, 'label': 'Kotlin',
 'category': 'skill', 'state': 'active', 'summary': 'started learning this week',
 'project_id': None, 'project_name': None,
