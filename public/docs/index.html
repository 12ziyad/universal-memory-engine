` };

PAGES["/integrations/n8n"] = { title: "n8n", html: `
<h1>n8n</h1>
<p class="lede">Three routes. The <b>native Itsuki node</b> is a real installable package with typed operations and a credential — self-hosted n8n only. The <b>HTTP Request node</b> and <b>MCP Client Tool</b> are built into n8n, need no install, and work on n8n Cloud too.</p>
<h2 id="native">Route A — native Itsuki node (self-hosted)</h2>
<p>Published on npm as <code>n8n-nodes-itsuki</code>, built and signed from this repository's GitHub Actions workflow with npm provenance. Install it in n8n under <b>Settings → Community Nodes → Install</b>; only instance owners can install community nodes, and n8n Cloud carries only nodes n8n has verified, so Cloud users should use Route B or C below.</p>
${codeBlock(`n8n-nodes-itsuki`)}
<p>Then create an <b>Itsuki API</b> credential (API key from <b>API Keys</b> in the dashboard, base URL <code>${ORIGIN}</code>) and press <b>Test</b> — it verifies the connection against an endpoint that returns counts only, never memory content. The key travels as a header and is never written into workflow exports.</p>
<p>The node exposes twelve operations:</p>
<ul>
<li><b>Save Memory</b> and <b>Save Conversation</b> — store a durable fact, or a batch of chat messages for extraction. Both <b>wait for completion by default</b>, so the next node sees settled state; if the wait times out the output says the save was accepted and is still processing, which is not a failure.</li>
<li><b>Recall Memory</b> — prompt-ready context plus structured items. Zero results is a result, not an error.</li>
<li><b>List Memories</b> — one page, or Return All with a hard item cap and pagination-loop detection.</li>
<li><b>Get Memory</b> · <b>Delete Memory</b> — by prefixed ID. A missing ID is reported as an error, never as a silent success.</li>
<li><b>Delete All Memories</b> — <b>previews by default</b>; it reports what would be removed and changes nothing until you tick Confirm Destruction.</li>
<li><b>Who Am I</b> — identity, project scope, connection health and current write counts.</li>
<li><b>Update Memory</b> — correct one memory with optimistic concurrency. It needs the revision you read, so a stale edit is refused rather than silently overwriting a newer one.</li>
<li><b>Memory History</b> — one memory's bounded revision history, newest first.</li>
<li><b>Rollback Memory</b> — restore an earlier revision as a new forward revision. History is never rewound.</li>
<li><b>Wait for Packet</b> — poll a save receipt to a terminal state on its own.</li>
</ul>
<p>The node is usable as an AI Agent tool. On self-hosted n8n that additionally requires <code>N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true</code>. Recall and the save operations are the sensible tools to expose; destructive operations are deliberately unattractive as tools, since Delete All previews unless a human enables confirmation.</p>
<p>To correct a memory, use <b>Update Memory</b> rather than deleting and re-saving. An update keeps the previous wording as an immutable revision you can read with <b>Memory History</b> and restore with <b>Rollback Memory</b>; deleting destroys that history instead. See <a href="#/guides/versions">Corrections, history, and rollback</a>.</p>
<h2 id="http">Route B — HTTP Request node (any workflow, incl. Cloud)</h2>
<p>The deterministic route: "form submitted → save to memory", "nightly digest → recall". Create an <b>MCP link</b> — open <b>Get started</b>, pick your client, and click <b>Create link</b> — which doubles as a REST Bearer credential.</p>
${codeBlock(`Node: HTTP Request
Method: POST
URL: ${ORIGIN}/v1/save
Authentication: Generic Credential Type -> Header Auth
  Name: authorization    Value: Bearer YOUR_MCP_KEY
Body (JSON): { "content": "{{ $json.textToRemember }}" }`)}
<p>Recall is the same node against <code>${ORIGIN}/v1/recall</code> with <code>{ "query": "..." }</code> — the response's <code>context</code> field is prompt-ready. Saves return a <b>receipt</b>; extraction finishes asynchronously.</p>
<h2 id="mcp">Route C — MCP Client Tool (AI Agent workflows, incl. Cloud)</h2>
${codeBlock(`Node: MCP Client Tool  (attach to an AI Agent node)
Endpoint: ${ORIGIN}/mcp
Server Transport: HTTP Streamable
Authentication: Bearer -> YOUR_MCP_KEY`)}
<p>The agent then decides when to call <code>save_memory</code> / <code>recall_memory</code> / <code>list_memories</code> itself.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>429 with retry-after</b> — the workflow is bursting past a rate bucket; add a Wait node honouring the header. Bulk imports belong on <code>POST /v1/ingest</code> (300/min).</li>
<li><b>Credential test fails</b> — the header name must be exactly <code>authorization</code> and the value must start with <code>Bearer </code>.</li>
</ul>
` };

PAGES["/integrations/dify"] = { title: "Dify", html: `
<h1>Dify</h1>
<p class="lede">Dify consumes remote MCP servers natively — no plugin, no marketplace, no review. Two minutes in the Tools screen.</p>
<h2>Connect</h2>
<p>Create an <b>MCP link</b> — open <b>Get started</b>, pick your client, and click <b>Create link</b> — then in Dify:</p>
${codeBlock(`Dify -> Tools -> MCP -> Add server (HTTP transport)
Server URL: ${ORIGIN}/mcp
Headers: authorization = Bearer YOUR_MCP_KEY`)}
<p>Dify connects and imports the tools (save, recall, list, get, delete, whoami). Enable them for your app under its Agent settings; only HTTP-transport MCP servers are supported, which is exactly what ${PRODUCT.name} serves.</p>
<h2>Verify</h2>
<p>Chat with the app: <i>"remember that I prefer morning meetings, then recall what you know about me"</i>. The save must report a receipt.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Authorization errors on connect</b> — Dify's Dynamic Client Registration expects OAuth by default; use the custom-header route above instead.</li>
<li><b>Tools imported but never called</b> — enable them for the specific app, and give the agent instructions to recall at conversation start.</li>
</ul>
` };

PAGES["/integrations/convex"] = { title: "Convex", html: `
<h1>Convex</h1>
<p class="lede">Not an MCP integration — the published <code>itsuki</code> npm SDK running inside your Convex backend. Memory becomes two Convex actions any client or function can call.</p>
<h2>1. Install</h2>
${codeBlock(`npm install itsuki convex`)}
<h2>2. Create an API key</h2>
<p>In <b>API Keys</b>, create an <b>API key</b> and set it in your Convex deployment environment as <code>ITSUKI_API_KEY</code>. Server-side only — never in client code.</p>
<h2>3. Write the memory actions</h2>
${codeBlock(`// convex/memory.ts
import { MemoryClient } from "itsuki";
import { action } from "./_generated/server";
import { v } from "convex/values";

const memory = new MemoryClient({ apiKey: process.env.ITSUKI_API_KEY! });

export const remember = action({
  args: { content: v.string(), userId: v.string() },
  handler: async (_ctx, args) => memory.add(args.content, { userId: args.userId }),
});

export const recall = action({
  args: { query: v.string(), userId: v.string() },
  handler: async (_ctx, args) => memory.search(args.query, { userId: args.userId }),
});`)}
<p><code>userId</code> scopes each end user to an isolated memory space under your one key — the same sub-tenant model as the <a href="#/sdk/js">JavaScript SDK</a>, because it IS the JavaScript SDK.</p>
<h2>Verify</h2>
${codeBlock(`npx convex run memory:remember '{ "content": "Prefers dark mode", "userId": "user_1" }'
npx convex run memory:recall '{ "query": "preferences", "userId": "user_1" }'`)}
<p>The first call returns a receipt; the second returns the fact in <code>context</code> after extraction settles.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Missing API key</b> — set <code>ITSUKI_API_KEY</code> with <code>npx convex env set</code>, then redeploy.</li>
<li><b>Recall empty right after save</b> — extraction is asynchronous; allow a few seconds.</li>
</ul>
` };

PAGES["/api/rest"] = { title: "REST API reference", html: `
<h1>REST API reference</h1>
<p class="lede">Base URL: <code>${ORIGIN}</code> · JSON in, JSON out · Bearer auth.</p>
<h2>The two calls that matter</h2>
<h3>POST /v1/save — write memory</h3>
${codeBlock(`POST /v1/save
{ "content": "I started learning Kotlin this week." }

// or conversation mode:
{ "mode": "conversation",
  "conversationId": "chat-42",
  "messages": [
    { "role": "user", "content": "We decided on Postgres for the new service." },
    { "role": "assistant", "content": "Noted — Postgres it is." }
  ] }`)}
<p>Returns a <b>receipt</b>: <code>summary</code>, counts of what was written/updated/skipped, and a <code>receipt_id</code>. Extraction is asynchronous — allow a few seconds before recalling brand-new facts.</p>
<h3>POST /v1/recall — read memory</h3>
${codeBlock(`POST /v1/recall
{ "query": "what am I learning?" }

// one coding project plus account-global memory:
{ "query": "how does this project deploy?",
  "memoryScope": { "projectId": "atlas", "projectName": "Atlas" },
  "recallScope": "project_then_global" }

// response (abridged)
{ "count": 2,
  "context": "Kotlin (skill, state: active) - started learning this week…",
  "items": [ { "type": "node", "label": "Kotlin", "score": 7.9 } ] }`)}
<p><code>context</code> is the compact text block a connected AI receives. Empty string + <code>count: 0</code> means nothing relevant is stored.</p>
<h2>Everything else</h2>
<table>
<tr><th>Endpoint</th><th>What it does</th></tr>
<tr><td><code>POST /v1/turn</code></td><td>Recall + auto-capture in one call — send the latest chat messages, get context back while durable facts are collected. Needs write scope.</td></tr>
<tr><td><code>POST /v1/ingest</code></td><td>Bounded message ingestion with optional <code>flush: true</code> to force digestion.</td></tr>
<tr><td><code>GET /v1/ingest/limits</code></td><td>Authoritative machine-readable limits, character unit, request encoding, and ordered-delivery schema.</td></tr>
<tr><td><code>GET /v1/graph</code></td><td>The full laid-out memory graph (nodes, details, events, edges, clusters).</td></tr>
<tr><td><code>GET /v1/status</code></td><td>Counts: memories, conversation pages, details, events, pending suggestions.</td></tr>
<tr><td><code>GET /v1/memories</code></td><td>Read-only inventory, newest first: <code>kind</code> (all | node | page), <code>limit</code> (1–200), keyset <code>cursor</code>, <code>q</code> substring filter.</td></tr>
<tr><td><code>GET /v1/memories/&lt;id&gt;</code></td><td>One object by id — a memory with its history and events, a page with its markdown. Serves the object's <code>revision</code> and a revision ETag (<code>"r3"</code>; may surface as <code>W/"r3"</code> through content encoding — <code>If-Match</code> accepts both) for safe updates.</td></tr>
<tr><td><code>PATCH /v1/memories/&lt;id&gt;</code></td><td>Deterministic correction of editable fields (node label/category/summary · page title/short_summary/full_markdown · detail text/kind · event text/importance/happened_at). Requires <code>If-Match: "r&lt;revision&gt;"</code> or body <code>expectedRevision</code> plus an <code>idempotencyKey</code>; missing precondition → 428, stale → 412 with <code>current_revision</code>, wildcard refused. Previous content is retained as an immutable revision.</td></tr>
<tr><td><code>GET /v1/memories/&lt;id&gt;/history</code></td><td>Keyset-paginated revision history (baselines, captured automatic changes, edits, rollbacks) with snapshots and projection convergence state. Page size is bounded (max 50); stored history is <em>not</em> pruned — every revision is retained until the object is deleted, purged, retention-expired, or the account is erased, so anything offered as rollbackable stays rollbackable. <code>total_revisions</code> reports the retained count.</td></tr>
<tr><td><code>POST /v1/memories/&lt;id&gt;/rollback</code></td><td>Restore an earlier revision's content as a NEW forward revision (<code>toRevision</code> + current <code>expectedRevision</code> + <code>idempotencyKey</code>). History is never rewound; erased revisions cannot be restored.</td></tr>
<tr><td><code>GET /v1/usage?range=30d</code></td><td>Activity rollups: saves/recalls per day, by source, totals. Ranges 1d/7d/30d/all.</td></tr>
<tr><td><code>GET /v1/receipts?limit=50</code></td><td>Latest save/recall receipts.</td></tr>
<tr><td><code>GET /v1/export</code></td><td>Complete JSON export of the memory space resolved by the current credential and request. It does not aggregate sibling SDK sub-tenant spaces in the project.</td></tr>
<tr><td><code>GET/PUT /v1/rules</code></td><td>Read or update the project's memory-extraction inclusion and exclusion policy.</td></tr>
</table>
<h2>Conversation-ingest boundaries</h2>
<table>
<tr><th>Boundary</th><th>Current limit</th></tr>
<tr><td>Messages in one <code>POST /v1/ingest</code></td><td>30</td></tr>
<tr><td>One message's <code>content</code></td><td>4,000 Unicode code points</td></tr>
<tr><td>Combined message content</td><td>120,000 Unicode code points</td></tr>
<tr><td>Complete serialized request</td><td>512 KiB of actual UTF-8 JSON</td></tr>
</table>
<p>Those four wire limits are exactly what <a href="/v1/ingest/limits"><code>GET /v1/ingest/limits</code></a> returns. The engine also enforces these separate downstream safeguards:</p>
<table>
<tr><th>Internal boundary</th><th>Limit</th></tr>
<tr><td>One downstream extraction queue entry</td><td>20 messages and 12,000 Unicode code points</td></tr>
<tr><td>Complete serialized chat-model input</td><td>At most 24,576 UTF-8 bytes</td></tr>
</table>
<p>The configured model context windows are 32,768 tokens for Qwen3 extraction, 32,000 for Llama 3.1 summary/digest, and 60,000 for Llama 3.2 playground chat. After output/template reserves and the global byte ceiling, their maximum serialized inputs are 24,576, 23,808, and 24,576 bytes respectively; unknown model overrides use the conservative 32,000-token profile.</p>
<p>Fetch the limits endpoint instead of copying wire constants into a client. A body over the byte limit receives a machine-readable <code>413</code>; count, character, or delivery-metadata violations receive a machine-readable <code>422</code>. Retry an unchanged request with the same <code>idempotencyKey</code>; reusing that key for different content is a <code>409</code>.</p>
<h2>Useful request fields</h2>
<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>idempotencyKey</code></td><td>Safe retries: the same key is processed at most once.</td></tr>
<tr><td><code>delivery</code></td><td>Ordered-batch metadata: schema, stable group ID, batch index/count, source/segment counts, and explicit capture-omission state.</td></tr>
<tr><td><code>conversationId</code>, <code>threadId</code>, <code>sourceId</code></td><td>Provenance tracking; also used for de-duplication of re-sent chats.</td></tr>
<tr><td><code>userId</code></td><td><b>Sub-tenant selector.</b> Omit it to use the key owner's own memory. Pass any string to read/write a separate memory space derived from it — useful when your app serves multiple end users under one key.</td></tr>
<tr><td><code>memoryScope.projectId</code>, <code>projectName</code></td><td><b>Project metadata, not tenancy.</b> Project memories remain in the authenticated account graph with explicit provenance. Omit <code>projectId</code> for account-global writes.</td></tr>
<tr><td><code>recallScope</code></td><td><code>global</code> (default) searches the whole account; <code>project_only</code> searches exactly <code>memoryScope.projectId</code>; <code>project_then_global</code> searches that project plus rows without a project. Project modes never include another project.</td></tr>
</table>
<h2>Rate limits</h2>
<p>There are six buckets, all per 60 seconds, keyed per credential and project: <code>auth</code> 10, <code>save</code> 60 (<code>POST /v1/save</code> and <code>POST /v1/turn</code>), <code>recall</code> 120, <code>delete</code> 30, <code>import</code> 300 (<code>POST /v1/ingest</code>), and <code>read</code> 240. Reads <i>are</i> limited — just loosely, because they cost database rows rather than inference. A <code>429</code> carries <code>retry-after</code>; back off on it rather than on a fixed sleep. Read the live numbers from <code>GET /v1/limits</code> instead of copying them: see <a href="#/api/limits">Rate limits and quotas</a>.</p>
<h2>Errors</h2>
<p>Errors are JSON: <code>{ "error": "code_or_message" }</code> with conventional status codes (400 invalid body, 401 unauthenticated, 403 wrong scope, 429 slow down, 5xx our fault — automatically reported on our side).</p>
` };

PAGES["/api/auth"] = { title: "Authentication & keys", html: `
<h1>Authentication &amp; keys</h1>
<p class="lede">Two kinds of credential, one rule: a secret is shown once. This page covers which one to use where, what happens when you mix them up, and how scopes and project roles combine to decide what a key can do.</p>

<h2>The two credentials</h2>
<table>
<tr><th></th><th>API key</th><th>MCP link</th></tr>
<tr><td><b>Looks like</b></td><td><code>${PRODUCT.tokenPrefix}\u2026</code></td><td><code>${ORIGIN}/mcp/${PRODUCT.tokenPrefix}\u2026</code></td></tr>
<tr><td><b>Travels in</b></td><td>An <code>Authorization: Bearer</code> header</td><td>The URL itself</td></tr>
<tr><td><b>Use it for</b></td><td>The REST API, the SDKs, and any client that can send headers</td><td>Chat clients and connectors that accept only a URL</td></tr>
<tr><td><b>Create it from</b></td><td><b>API Keys</b> \u2192 <b>Create API key</b></td><td><b>Get started</b> \u2192 pick your client \u2192 <b>Create link</b></td></tr>
</table>

<div class="note"><b>The secret is the same shape either way.</b> Both are 32 random bytes behind an <code>${PRODUCT.tokenPrefix}</code> prefix, so you cannot tell them apart by looking. What differs is a stored <code>type</code> field, fixed at creation. That is why the app labels them in its key table with a <b>Type</b> column reading <code>API</code> or <code>MCP</code> \u2014 it is the only way to know.</div>

<h2>Using an API key</h2>
${codeBlock(`curl ${ORIGIN}/v1/status \\
  -H "authorization: Bearer ${PRODUCT.tokenPrefix}your_key_here"`, "terminal")}

<p>The legacy header <code>x-uml-token</code> is still accepted everywhere the <code>Authorization</code> header is, kept working for clients written before the rename. New code should use <code>Authorization</code>.</p>

<h2>Using an MCP link</h2>
<p>Point the client at the whole URL. The credential is the last path segment, so treat the URL exactly as you would a password.</p>
${codeBlock(`${ORIGIN}/mcp/${PRODUCT.tokenPrefix}your_link_here`, "MCP server URL")}

<p>There is also a header form of the same door, for MCP clients that <i>can</i> send headers: point them at <code>${ORIGIN}/mcp</code> with no path token and an <code>Authorization: Bearer</code> header. That door accepts either credential type.</p>

<h2>What happens if you mix them up</h2>
<p>This is the most common setup mistake, so the server names it rather than returning a bare failure.</p>

<h3>An API key in the MCP URL</h3>
<p>Refused. The path door accepts MCP links only, and the message says so:</p>
${outputBlock(`HTTP/2 401

{
  "error": "unauthorized mcp token",
  "message": "That is an API key, not an MCP link. API keys authenticate at POST /mcp with an 'Authorization: Bearer <key>' header \u2014 only MCP links (created as MCP in the app) go in the URL."
}`, "Response")}

<h3>An MCP link in a Bearer header</h3>
<p>This one <b>works</b>. The asymmetry is deliberate and one-way: only the URL-path door is restricted to MCP links. An MCP-type credential sent as <code>Authorization: Bearer</code> authenticates anywhere an API key does. Note that the credential is the token, not the whole URL \u2014 if you paste the full <code>https://\u2026</code> string into a Bearer header you get a 401 telling you the key is the last path segment.</p>

<h3>Some other kind of secret entirely</h3>
<p>A <code>401</code> here carries a hint keyed to the shape of what you sent, because the fastest fix is usually knowing which secret you grabbed:</p>
<table>
<tr><th>What you sent</th><th>What the message tells you</th></tr>
<tr><td>Starts <code>whsec_</code></td><td>That is a webhook signing secret. It only verifies incoming deliveries.</td></tr>
<tr><td>Starts <code>sk-</code> or <code>sk_</code></td><td>That looks like an OpenAI or Stripe key.</td></tr>
<tr><td>Starts <code>http://</code> or <code>https://</code></td><td>That looks like a URL. If you copied an MCP link, the key is the last path segment.</td></tr>
<tr><td>Anything else</td><td>Keys start with <code>${PRODUCT.tokenPrefix}</code>.</td></tr>
</table>

<h2>Scopes</h2>
<table>
<tr><th>Scope</th><th>Grants</th></tr>
<tr><td><code>memory:read</code></td><td>Recall, status, usage, receipts, jobs, export, and reading rules.</td></tr>
<tr><td><code>memory:write</code></td><td>Save, turn, ingest, and writing rules. <b>Implies <code>memory:read</code>.</b></td></tr>
<tr><td><code>memory:delete</code></td><td>Erasure. Deliberately <b>not</b> implied by <code>memory:write</code> \u2014 a credential that may write must not be able to erase.</td></tr>
</table>

<p>Keys carry <code>memory:read</code> and <code>memory:write</code> by default. The app has no scope selector, so a narrower key is made through the API:</p>
${codeBlock(`curl -X POST ${ORIGIN}/auth/tokens \\
  -H "content-type: application/json" \\
  --cookie "your signed-in session" \\
  -d '{"type": "api", "label": "Read-only reporting", "scopes": ["memory:read"]}'`, "terminal")}

${outputBlock(`{
  "token": "${PRODUCT.tokenPrefix}\u2026",
  "tokenRecord": { "id": "tok_\u2026", "label": "Read-only reporting", "type": "api", "status": "active" }
}`, "Response")}

<p>The plaintext <code>token</code> appears in this response and nowhere else, ever. Creating a key is a signed-in operation: this route does not accept an API key, which is what stops one key from minting another.</p>

<div class="note">Two wildcard scopes are honoured if you hold them: <code>*</code> and <code>memory:*</code>. A request for a scope the key lacks returns <code>403</code> with <code>code: "insufficient_scope"</code>.</div>

<h2>Scopes are only the first gate</h2>
<p>A key also carries the project role of whoever created it, resolved fresh on every request. So a key's real power is its declared scope <i>intersected with</i> its creator's current role \u2014 which means a role change narrows an existing key on its very next request, with nothing to revoke.</p>

<table>
<tr><th>Capability</th><th>Project admin</th><th>Member</th><th>Viewer</th></tr>
<tr><td>Read memory</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Write memory</td><td>Yes</td><td>Yes</td><td>\u2014</td></tr>
<tr><td>Export</td><td>Yes</td><td>Yes</td><td>\u2014</td></tr>
<tr><td>Create and view keys</td><td>Yes</td><td>Yes</td><td>\u2014</td></tr>
<tr><td>Delete memory</td><td>Yes</td><td>\u2014</td><td>\u2014</td></tr>
<tr><td>Edit rules</td><td>Yes</td><td>\u2014</td><td>\u2014</td></tr>
</table>
<p>Organization owners and admins hold every capability in every project underneath them. A capability failure returns <code>403</code> naming the capability, rather than the scope.</p>

<h2>One key, many end users</h2>
<p>A key is bound to one project and cannot read or write another. Inside that project, pass <code>userId</code> to give each of your own end users an isolated space:</p>
${codeBlock(`{ "content": "Ada's depot is in Porto.", "userId": "ada" }`, "request body")}

<p>The value you send never becomes a storage key directly. It is hashed together with the owning account, so two different accounts both using <code>ada</code> address completely different memory spaces, and the id you chose is not recoverable from the id we store. Omit <code>userId</code> and the write lands on the account's own memory.</p>

<div class="note"><b>Pick an opaque, stable id.</b> The value is kept as provenance so your account can list its own tenants, so prefer an internal user id over an email address.</div>

<h2>Key lifecycle</h2>
<ul>
<li><b>Shown once.</b> Only a hash is stored. A lost key cannot be recovered \u2014 create a new one and delete the old.</li>
<li><b>Delete</b> is the only per-key control: the trash icon on the key's row in <b>API Keys</b>, labelled <b>Delete key</b>. It confirms first, then the key stops working immediately.</li>
<li><b>One key per tool.</b> That is the whole rotation story \u2014 because each tool holds its own key, you can cut one off without touching the others.</li>
<li><b>Older keys keep working.</b> Keys minted before the rename carry a <code>uml_live_</code> prefix and are still accepted; new keys always mint as <code>${PRODUCT.tokenPrefix}</code>.</li>
</ul>

<h2>Where to go next</h2>
${nextSteps([
	["#/api/rest", "REST API reference", "Every endpoint these credentials open."],
	["#/api/mcp", "MCP tools", "What an MCP link exposes to a connected client."],
	["#/api/errors", "Errors", "Every code the API returns, and what to do about it."],
	["#/guides/projects", "Projects & teams", "Roles, invitations, and how a project scopes a key."],
])}
` };

PAGES["/api/mcp"] = { title: "MCP tools", html: `
<h1>MCP tools</h1>
<p class="lede">Server: <code>itsuki-memory</code> · Transport: Streamable HTTP · URL: <code>${ORIGIN}/mcp/&lt;key&gt;</code></p>
<h2>Write &amp; recall</h2>
<h3>save_memory</h3>
<p>Saves exactly one explicitly submitted durable fact. Input: <code>content</code> (required, the user's words), optional <code>recentContext</code> for resolving references like "it". Returns a final receipt — <i>Saved: 1 memory (Kotlin)…</i> — only after the write completes.</p>
<h3>save_conversation</h3>
<p>Captures several chat turns at once. Input: <code>messages[]</code> (oldest first), optional <code>scope</code> (<code>full</code> | <code>lastN</code> | <code>topic</code> | <code>summary</code>) and <code>contentScope.subject</code> for strict subject filtering. Attribution rules require user adoption or supported request/outcome evidence; unsupported assistant prose is not treated as a user fact. A stable <code>conversationId</code> converges re-sends of the same conversation onto one Conversation page, advanced as a forward revision; without it each explicit save makes its own page.</p>
<h3>recall_memory</h3>
<p>Input: <code>query</code>, optional <code>memoryScope</code> project metadata, and optional <code>recallScope</code> (<code>global</code> | <code>project_only</code> | <code>project_then_global</code>). The tool's text result IS the recalled context — the model can use it directly. Structured details ride along for clients that read them.</p>
<h2>Management</h2>
<p>The half a client needs to inspect and clean up its own memory without opening the dashboard. All of it is read-only except the two delete tools, which are guarded.</p>
<h3>list_memories</h3>
<p>Browse stored memories newest-first. Input: optional <code>kind</code> (<code>all</code> | <code>node</code> | <code>page</code>), <code>limit</code> (1–200), <code>cursor</code> for the next page, and <code>q</code> substring filter. Returns ids that <code>get_memory</code> and <code>delete_memory</code> accept. For meaning-based lookup use <code>recall_memory</code>.</p>
<h3>get_memory</h3>
<p>Fetch one object by id (<code>node_…</code>, <code>page_…</code>, <code>slice_…</code>, or a candidate id) with its current text, bounded history, and dated events.</p>
<h3>delete_memory</h3>
<p>Permanently delete one object by id. Same effect as <code>DELETE /v1/memories/:id</code>, including the deletion tombstone. In managed projects this needs the distinct delete permission, not just write.</p>
<h3>delete_all_memories</h3>
<p>Safe by default: without <code>confirm: true</code> it only previews what would be deleted (counts and sample labels). Only an explicit <code>confirm: true</code> destroys, matching the REST bulk-delete contract.</p>
<h3>whoami</h3>
<p>Reports the connection's identity and health: memory space, scopes, bound project, whether deletion is allowed, and live counts. The verify step of every install guide is "ask for <code>whoami</code>".</p>
<h2>Safe updates</h2>
<p>Deterministic correction with immutable history. These tools are advertised only when the connection's effective scopes permit them — a read-only key never sees the write tools.</p>
<h3>update_memory</h3>
<p>Correct one memory's editable fields. Input: <code>id</code>, <code>fields</code> (node: label/category/summary · page: title/short_summary/full_markdown · detail: text/kind · event: text/importance/happened_at), required <code>expectedRevision</code> (the revision you read) and <code>idempotencyKey</code>, optional <code>reason</code>. A stale revision is refused with the fresh revision — never overwritten. The previous content is retained as history.</p>
<h3>memory_history</h3>
<p>One memory's revision history, newest first: baselines, captured automatic changes, edits, and rollbacks, each with its snapshot, actor class, optional reason, and content hash. Paginated by <code>cursor</code>, max 50 per page. Stored history is retained (never auto-pruned) until the object is deleted, purged, retention-expired, or the account is erased.</p>
<h3>rollback_memory</h3>
<p>Restore the content of an earlier revision as a <em>new forward revision</em>. Input: <code>id</code>, <code>toRevision</code>, current <code>expectedRevision</code>, <code>idempotencyKey</code>. History is never rewound or deleted; a revision removed by deletion or retention cannot be restored.</p>
<h2>Design guarantees</h2>
<ul>
<li>Itsuki's write responses distinguish locally queued work, server acceptance, and a backend receipt; asynchronous enrichment has separate packet status.</li>
<li>The host model decides <i>when</i> to call tools — if you need guaranteed per-turn invocation, call <code>POST /v1/turn</code> from your own code and inspect its collect receipt and packet status.</li>
</ul>
` };

PAGES["/concepts/memory"] = { title: "How memory works", html: `
<h1>How memory works</h1>
<p class="lede">One message becomes durable memory by two independent steps: your words are preserved exactly, then a model proposes structure that deterministic gates approve or refuse.</p>
<p>Chat history is not memory. A transcript grows without bound, answers nothing on its own, and cannot be corrected. Itsuki turns messages into a small set of typed objects that can be ranked, edited, superseded and deleted one at a time. This page follows a message all the way through.</p>

<h2>Preservation and promotion are separate</h2>
<p>Two things happen to an accepted write, and they are deliberately independent.</p>
<ul>
<li><b>Preservation</b> runs at accept time, before any model is consulted. Every permitted message is scrubbed of secrets and written as a <b>source episode</b>. It is bounded per batch, bound to one memory space, and hard-deleted on erasure.</li>
<li><b>Promotion</b> runs afterwards. A model proposes structure; deterministic gates decide what becomes a memory, a detail, an event or a connection. Promotion is allowed to decline.</li>
</ul>
<p>The reason for the split is measurable. Most recall misses are facts that were never stored at all, and once extraction declined a fact there was nothing left to find. Separating the two means a conservative extraction pass can no longer make your own words unrecoverable.</p>
<div class="note">Source episodes are not an unscrubbed archive. Secrets are removed before anything durable sees the text, your exclude rules are enforced again at this layer, and if the rules cannot be read <b>nothing</b> is written. Failing closed costs recoverability; failing open would keep content you asked never to keep.</div>

<h2>The object types</h2>
<p>Everything in your graph is one of these. Every id is prefixed, so an id tells you what you are holding.</p>
<table>
<tr><th>Object</th><th>Id</th><th>What it is</th></tr>
<tr><td><b>Memory</b> (node)</td><td><code>node_…</code></td><td>A durable thing: Kotlin, Grandmother, your project, your employer. Carries a <code>label</code>, a <code>category</code>, a <code>state</code> (active · paused · inactive · completed) and a rolled-up <code>summary</code>.</td></tr>
<tr><td><b>Detail</b> (slice)</td><td><code>slice_…</code></td><td>A current truth about one memory — "trains three days a week". Has a <code>kind</code> (feature_detail, technical_detail, progress, blocker, fix, decision, preference, other) and an <code>is_current</code> flag.</td></tr>
<tr><td><b>Event</b></td><td><code>event_…</code></td><td>Something that happened to one memory, with an <code>action</code> (started, stopped, diagnosed, passed_away, moved, married…), an <code>importance</code> (ordinary · important · life_significant) and a <code>happened_at</code>.</td></tr>
<tr><td><b>Connection</b> (edge)</td><td><code>edge_…</code></td><td>A directed relation between two memories, with a plain-sentence <code>fact</code> and a validity window (<code>valid_at</code>, <code>invalid_at</code>).</td></tr>
<tr><td><b>Conversation page</b></td><td><code>page_…</code></td><td>One condensed, searchable page per conversation — title, short summary, key points, decisions, next steps. Keeps whole-chat captures out of the fact graph.</td></tr>
<tr><td><b>Suggestion</b> (candidate)</td><td><code>candidate_…</code></td><td>A weak or unclear signal parked for your review instead of being written or lost. Carries a <code>strength</code> (weak · medium · strong), a mention count and the evidence message.</td></tr>
<tr><td><b>Source episode</b></td><td><code>episode_…</code></td><td>One preserved, scrubbed user message, written at accept time.</td></tr>
</table>
<p>Two bookkeeping objects come back in API responses: the <b>source packet</b> (<code>src_…</code>) that identifies one accepted write, and the <b>receipt</b> that says what that write did. See <a href="#/concepts/receipts">Receipts &amp; rules</a>.</p>

<h2>The admission path</h2>
<p>Every representation that can later be recalled, exported, indexed, embedded or displayed passes the same sequence before it is written. There is no shortcut lane.</p>
<pre><button class="copy">Copy</button><code>identity / scope
  -&gt; secret scrub            (deterministic, no model, before anything durable)
  -&gt; opt-out check           ("don't remember this" ends the write here)
  -&gt; memory rules            (your includes / excludes / instructions)
  -&gt; bounds + normalization  (envelope caps, model-input caps)
  -&gt; immutable context snapshot
  -&gt; storage and indexing</code></pre>
<p>The scrub is first because a secret that has reached a model or an embedding cannot be taken back. It is pattern-based and keeps meaning: <code>neo4j+s://neo4j:hunter2@host</code> becomes <code>neo4j+s://neo4j:[REDACTED:password]@host</code>, so the fact that you use that database survives and the credential does not.</p>
<p>Rules belong to the <b>account</b>, not to a derived sub-tenant id. The door resolves them once and hands the same object to every enforcement point, and an unreadable rules store fails the write closed rather than quietly applying defaults.</p>

<h2>What makes something durable</h2>
<p>The model proposes; it never writes final truth. The backend independently decides keep, downgrade or reject for each proposed object, in a fixed order — memories first, so events, details and connections can attach to memories created in the same batch.</p>
<ul>
<li><b>Meaning, not a whitelist.</b> An unrecognised category is mapped onto the canonical set ("relative" becomes family, "database" becomes tool) or kept as <code>other</code>. It is never dropped for being off-list.</li>
<li><b>A memory needs a detail.</b> A bare label with no detail, event or connection attached to it is not a memory. It is refused as <code>node_without_detail</code> and parked as a suggestion instead.</li>
<li><b>Anti-orphan.</b> An event or detail whose subject the model forgot creates that subject. "My grandmother passed away" still lands as Grandmother (family) plus a <code>passed_away</code> event, even when the model emitted only the event.</li>
<li><b>Confidence floors.</b> The automatic lane keeps proposals at 0.5 and above. A user-commanded save through the API is more lenient (0.25) because you asked for it explicitly. An MCP save is user-commanded but host-mediated, so it sits back on the stricter floor — the host model may have rewritten what "the user said".</li>
<li><b>Lifecycle events move state.</b> A <code>completed</code> event marks its memory completed; <code>stopped</code>, <code>left</code> and <code>passed_away</code> mark it inactive; <code>paused</code> pauses it.</li>
</ul>

<h2>What gets discarded, and where it goes instead</h2>
<p>Refusals are named, counted and returned on the receipt. These are the common ones.</p>
<table>
<tr><th>Reason</th><th>What triggered it</th><th>Where the content goes</th></tr>
<tr><td><code>junk_label</code></td><td>A pronoun or filler proposed as a memory ("I", "this", "stuff")</td><td>Dropped</td></tr>
<tr><td><code>node_is_status</code></td><td>A status phrase proposed as a thing ("started boxing" as a label)</td><td>Dropped; the same content usually lands as an event</td></tr>
<tr><td><code>node_without_detail</code></td><td>A label with nothing attached</td><td>Parked as a suggestion</td></tr>
<tr><td><code>low_confidence_downgraded</code></td><td>Below the lane's confidence floor</td><td>Parked as a suggestion</td></tr>
<tr><td><code>excluded_by_rule</code> · <code>outside_include_rules</code></td><td>Your rules refused it</td><td>Dropped, and named on the receipt</td></tr>
<tr><td><code>ungrounded_fact</code></td><td>An MCP save whose words are mostly absent from what was actually sent</td><td>Dropped — that is the host model talking, not you</td></tr>
<tr><td><code>batch_text_blob</code></td><td>Text stitched from several messages rather than paraphrased from one</td><td>Dropped</td></tr>
<tr><td><code>file_path_node</code> · <code>tool_chatter</code> · <code>stack_trace_discarded</code></td><td>Editor-plugin captures: paths, diffs, raw traces</td><td>Dropped, unless a trace resolved into an error-and-fix pair</td></tr>
</table>
<p>Nothing here is silent. Repetition is explicit too: re-sending a fact you already stored reinforces the existing row and is reported as <code>duplicates_noop</code> rather than counted as a new save.</p>

<h2>Corrections and supersession</h2>
<p>New information does not delete old information. When a statement carries explicit revision language — "actually", "no longer", "we switched X to Y", "it's now Z" — the pipeline enters update mode and retires the specific fact whose value was named obsolete. Retirement is keyed on the <b>value being replaced</b>, not on the detail's kind, so "now uses canary, not blue-green" retires only the blue-green fact and leaves your other current facts alone.</p>
<p>Retired details are marked non-current, never deleted. Connections close their validity window instead: a new <code>WORKS_AT</code> closes the old employer's window, and the old row stays queryable as history and renders as "(until 2026-05-01)" when you ask about the past.</p>

<h2>Following one save</h2>
<pre><button class="copy">Copy</button><code>curl -X POST https://itsuki.app/v1/save \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"content": "I started boxing this week, three sessions."}'</code></pre>
<p>What happens, in order: the text is scrubbed; a source packet is created and deduplicated by content hash; a job row is written <i>before</i> the response, so accepted work always has a durable record; permitted messages become source episodes; the scrubbed text is staged so a recall seconds later can answer with it; then the message is handed to your account's queue for extraction.</p>
<p>The response separates acceptance from completion and carries a packet handle. Poll it rather than assuming:</p>
<pre><button class="copy">Copy</button><code>GET /v1/packets/&lt;source_packet_id&gt;/status
GET /v1/jobs?limit=20</code></pre>
<p>Job status passes through <code>awaiting_source</code>, <code>queued</code>, <code>staged</code> and <code>processing</code>, and settles on <code>enriched</code> or <code>failed</code>. Those terminal words are fixed; a cancellation caused by your own erasure settles as <code>failed</code> with <code>cancelled_by_delete: true</code> rather than inventing a fourth state that older clients would poll forever.</p>

<h2>Reading and changing what landed</h2>
<p><code>GET /v1/graph</code> returns the whole thing: memories with all their details and events, connections, and the suggestions still waiting. <code>GET /v1/memories</code> lists newest-first and <code>GET /v1/memories/&lt;id&gt;</code> returns one object with its history. A wrong fact is corrected with <code>PATCH /v1/memories/&lt;id&gt;</code>, which keeps the previous content as a revision rather than overwriting it — see the <a href="#/api/rest">REST reference</a>.</p>
<div class="note">Reviewing suggestions — <code>GET /v1/candidates</code> and the promote / merge / reject actions — is a signed-in operation. Those routes refuse API keys, so use the <b>Memories → Suggestions</b> view in the app.</div>

<h2>Where to go next</h2>
<ul>
<li><a href="#/concepts/extraction">How extraction works</a> — chunking, the proposing model, the gates, idempotency.</li>
<li><a href="#/concepts/graph">The memory graph</a> — how connections form and what they do at recall time.</li>
<li><a href="#/concepts/retrieval">How recall works</a> — query to bounded context.</li>
<li><a href="#/concepts/receipts">Receipts &amp; rules</a> — proof of what happened, and control over what may happen.</li>
<li><a href="#/concepts/delete">Delete &amp; erasure</a> — how any of this is removed.</li>
</ul>
` };

PAGES["/concepts/receipts"] = { title: "Receipts & rules", html: `
<h1>Receipts &amp; rules</h1>
<p class="lede">A receipt is the record of what one write actually did. Rules are the policy that decided it. Together they answer "what happened?" and "what am I allowing?" without either being a matter of trust.</p>
<p>Refusals are named rather than silent, and policy is enforced in code rather than requested of a model in a prompt. This page covers how to read one receipt, and how to write rules that do what you meant.</p>

<h2>What a receipt records</h2>
<p>Every authenticated, valid save returns either an error or a receipt. A receipt covers four things:</p>
<ul>
<li><b>Provenance</b> — which door and mode, the source packet, the extraction run, the idempotency key, the resolved project.</li>
<li><b>What was written</b> — counts per object type, plus the labels of new memories and the ids of everything created.</li>
<li><b>What was refused</b> — a total, a reason histogram, and the individual refused objects.</li>
<li><b>What it cost</b> — latency, and for recall, model call and token rollups.</li>
</ul>
<p>Receipts are stored. Read them with <code>GET /v1/receipts?limit=50</code>, or in <b>History</b> in the app.</p>

<h2>Reading one</h2>
<pre><button class="copy">Copy</button><code>{
  "outcome": "wrote",
  "source": "save_memory",
  "source_mode": "manual_direct",
  "source_packet_id": "src_…",
  "extraction_run_id": "run_…",
  "project_id": null,
  "saved": {
    "nodes": 1, "newNodeLabels": ["Boxing"], "autoCreated": [],
    "updatedNodes": 0, "slices": 2, "supersededSlices": 0,
    "events": 1, "edges": 0, "candidates": 1, "pages": 0,
    "reinforcedSlices": 0, "reinforcedEvents": 0, "reinforcedEdges": 0
  },
  "savedTotal": 5,
  "duplicates_noop": 0,
  "skipped": 2,
  "skippedReasons": { "low_confidence_downgraded": 1, "junk_label": 1 },
  "actions": { "createdNodes": [ { "id": "node_…", "label": "Boxing" } ], "…": "…" },
  "latency_ms": 3410
}</code></pre>
<p>Four fields carry most of the meaning:</p>
<table>
<tr><th>Field</th><th>Read it as</th></tr>
<tr><td><code>savedTotal</code></td><td>Everything the write changed — new objects, reinforced objects and superseded ones. It is not a count of new rows.</td></tr>
<tr><td><code>duplicates_noop</code></td><td>Rows that already existed and were refreshed rather than re-inserted. Repetition is deliberately visible; it changes the arithmetic of "saves in" versus "memories out".</td></tr>
<tr><td><code>autoCreated</code></td><td>Memories synthesized because the model emitted an event or detail without its subject. These are inside <code>newNodeLabels</code> too.</td></tr>
<tr><td><code>merges</code></td><td>Present only when a proposal was folded into an existing memory by something other than an exact label match. Each entry names the target and the basis, so wrong merges are auditable.</td></tr>
</table>
<p>The one-line summary a save tool returns is rendered from the same object:</p>
<pre><button class="copy">Copy</button><code>Saved: 1 node (Boxing), 2 slices, 1 event, 1 candidate. Skipped: 2 (weak maybe, pronoun/filler).</code></pre>

<h2>Outcomes</h2>
<table>
<tr><th>Outcome</th><th>Meaning</th></tr>
<tr><td><code>wrote</code></td><td>A plan was approved and committed.</td></tr>
<tr><td><code>meaningful_no_write</code></td><td>The pass ran and found nothing durable. A real answer, with a reason.</td></tr>
<tr><td><code>accepted</code> · <code>accumulating</code></td><td>The write was taken in; enrichment is still running, or the trigger is holding for more context. Check the packet status.</td></tr>
<tr><td><code>opted_out</code></td><td>The content contained a "don't remember this" instruction and was not stored.</td></tr>
<tr><td><code>llm_failed</code> · <code>db_write_failed</code> · <code>interrupted_unknown</code></td><td>Nothing was written. The reason field says which.</td></tr>
<tr><td><code>cancelled_by_delete</code> · <code>cancelled_by_retention</code></td><td>Terminal. A confirmed erasure or a retention boundary cancelled the accepted work.</td></tr>
<tr><td><code>recalled</code> · <code>no_recall</code></td><td>Lookup receipts. Never phrased as "Saved: 0" — they are not saves.</td></tr>
</table>
<p>Re-sending identical content answers with the <b>original</b> verdict. Content accepted earlier replays as "Already saved"; content the gates refused earlier replays as "Not saved — this exact content was sent before and skipped", with the reason. If the original verdict cannot be read, the reply says only that the content was seen before. Claiming an acceptance that did not happen is the one thing this path will not do.</p>

<h2>The refusal vocabulary</h2>
<p><code>skippedReasons</code> is machine-readable; the summary renders each as a short phrase.</p>
<table>
<tr><th>Reason</th><th>Phrase</th></tr>
<tr><td><code>excluded_by_rule</code></td><td>blocked by your rules</td></tr>
<tr><td><code>outside_include_rules</code></td><td>outside your include rules</td></tr>
<tr><td><code>low_confidence</code> · <code>low_confidence_downgraded</code></td><td>weak maybe</td></tr>
<tr><td><code>junk_label</code> · <code>node_is_status</code></td><td>pronoun/filler · status phrase</td></tr>
<tr><td><code>node_without_detail</code></td><td>node without durable detail</td></tr>
<tr><td><code>ungrounded_fact</code></td><td>not grounded in what was sent</td></tr>
<tr><td><code>edge_evidence_not_verbatim</code></td><td>evidence quote not found in the messages</td></tr>
<tr><td><code>edge_type_pair_mismatch</code></td><td>impossible relation for these kinds of things</td></tr>
<tr><td><code>suppressed_blocked</code></td><td>suppressed (you rejected this label before)</td></tr>
</table>

<h2>What a receipt never contains</h2>
<p>Receipts outlive the messages that produced them, so the audit fields are strictly content-free. Extraction tracing carries hashes and counts — how many messages, how many bytes, when the context was captured — and never snippets, message ids or scope labels; invalid audit data is dropped as a unit rather than partly kept with misleading counts. Secret redaction is reported the same way: the receipt says how many credentials were removed and of what type, never their values.</p>

<h2>Rules: three controls</h2>
<p>Rules live in <b>Settings → Memory extraction</b> and on <code>GET</code>/<code>PUT /v1/rules</code>.</p>
<table>
<tr><th>Control</th><th>What it does</th><th>Bounds</th></tr>
<tr><td><b>Custom instructions</b></td><td>Free text injected into extraction prompts as guidance — <i>"Always save exam progress. Never save jokes."</i></td><td>2,000 characters</td></tr>
<tr><td><b>Includes</b></td><td>When non-empty, only content matching at least one term may become memory.</td><td>32 terms, 80 characters each</td></tr>
<tr><td><b>Excludes</b></td><td>Content matching any term never becomes memory. Excludes always win.</td><td>32 terms, 80 characters each</td></tr>
</table>
<p>Alongside them: <b>custom categories</b> offered to the extractor as filing names; <b>capture default</b> (<code>auto</code> allows whole-chat pages, <code>graph_only</code> never builds them); <b>capture density</b> (<code>standard</code> is selective, <code>dense</code> keeps every durable detail by lowering the automatic confidence floor to the lenient one); and <b>auto-collect</b>, which decides whether <code>POST /v1/turn</code> feeds the turn into background capture.</p>

<h2>How rules decide admission</h2>
<p>The prompt gets your rules as <b>guidance</b>. The filters are the <b>enforcement</b> — a model that ignores the guidance still cannot write excluded content.</p>
<ol>
<li>Deny terms are assembled from your excludes plus terms parsed out of your instructions. "Never save anything about my salary or my landlord" yields <code>salary</code> and <code>landlord</code>.</li>
<li>If any deny term matches, the content is refused as <code>excluded_by_rule</code>. This check runs first and cannot be overridden.</li>
<li>If includes are non-empty, the content must match at least one term to survive; otherwise it is refused as <code>outside_include_rules</code>. Where a managed project adds its own include layer, the content must satisfy <b>every</b> layer — a narrowing operation, never a widening one.</li>
</ol>
<p>Matching is whole-word and accent-insensitive, so "salary" matches <i>Salary</i> and <i>salário</i> but not <i>salaryman</i>. Terms so broad they would disable memory entirely — "anything", "everything", "data", "stuff" — are ignored when parsed out of instructions, because silently switching memory off is not what that sentence means.</p>
<div class="warn">Rules belong to the <b>account</b>. A derived sub-tenant id owns no rules row, so any lane that loaded rules for the id it was writing under would silently get defaults. The door resolves account rules once and hands the same object to every enforcement point — the graph gates, the staging index, extraction, and the write-path recall door. An unreadable rules store fails the write closed rather than converting "never keep my salary" into "keep everything".</div>
<p>An administrator's later policy edit reaches queued work that has not written memory yet: server-owned policy is re-resolved when extraction actually begins. Credential and request layers stay fixed at acceptance time.</p>

<h2>The no-write preview</h2>
<p>Rules are easy to get wrong, and the honest way to find out is not to save something and check. <code>POST /v1/settings/rules/preview</code> runs samples through the real deterministic admission check and writes nothing at all — no source packets, no jobs, no receipts, no usage rows, no graph state.</p>
<pre><button class="copy">Copy</button><code>POST /v1/settings/rules/preview
{ "samples": [
    "I moved to Porto in March.",
    "My salary is 62k."
  ],
  "rules": { "excludes": ["salary"] } }</code></pre>
<pre><button class="copy">Copy</button><code>{ "ok": true,
  "results": [
    { "text": "I moved to Porto in March.", "kept": true,
      "assessment": "durable", "assessment_reason": "life change: relocation" },
    { "text": "My salary is 62k.", "kept": false, "reason": "excluded_by_rule",
      "assessment": "not_evaluated_blocked" }
  ],
  "category_preview": "evaluated", "assessment_preview": "evaluated" }</code></pre>
<p>Two things make the preview trustworthy. First, <code>kept</code> is decided in code by the same function the pipeline uses — the two bounded model calls only annotate rows that already passed and can never flip a policy decision. Second, "passed the rules" is not "will be stored", so a separate judgement reports whether the sample would survive extraction at all: <code>durable</code>, <code>not_durable</code>, or <code>uncertain</code>. An unreachable or unsure model reports <code>uncertain</code> rather than guessing. Text your rules denied never reaches either model payload.</p>
<p>Send up to 10 samples; each is truncated to 400 characters. The <code>rules</code> field is optional — omit it to preview your stored rules, or pass a partial override to test a change before saving it. This route requires a signed-in session with rules-edit permission.</p>

<h2>Updating rules safely</h2>
<pre><button class="copy">Copy</button><code>GET /v1/rules
# -&gt; { "ok": true, "rules": { … }, "rules_version": "…" }

PUT /v1/rules
If-Match: "&lt;rules_version&gt;"
{ "rules": { "excludes": ["salary", "landlord"], "captureDensity": "dense" } }</code></pre>
<p>An update without a precondition is refused with <code>428</code> and the message "reload these settings before saving so a newer policy is not overwritten". You may send the version as an <code>If-Match</code> header or as <code>expected_version</code> in the body; sending both with different values is a <code>400</code>. <code>POST /v1/rules</code> is an alias for clients that cannot send <code>PUT</code>. The response reports <code>changed</code>, so a no-op edit is distinguishable from a real one.</p>

<h2>Related</h2>
<ul>
<li><a href="#/concepts/memory">How memory works</a> — where rules sit in the admission path.</li>
<li><a href="#/concepts/extraction">How extraction works</a> — the gates that produce the refusal reasons above.</li>
<li><a href="#/operate/observability">Monitoring &amp; diagnostics</a> — jobs, packets and account-wide health.</li>
<li><a href="#/concepts/delete">Delete &amp; erasure</a> — what is retained after content is removed.</li>
</ul>
` };

PAGES["/concepts/scope"] = { title: "Who memory belongs to", html: `
<h1>Who memory belongs to</h1>
<p class="lede">Every memory is stored under exactly one <b>memory user</b>, and optionally tagged with a <b>project</b>. Isolation is the point — so nothing crosses a boundary just because it would be convenient.</p>

<h2>The three levels</h2>
<ul>
<li><b>Account root</b> — your own memory. This is where writes land when you send no <code>userId</code>.</li>
<li><b>Sub-tenant</b> — one memory space per end user of <i>your</i> product. You create it by sending <code>userId</code> (any stable string you choose). The server derives an opaque id from your account plus that string, so two different accounts sending the same <code>userId</code> never touch the same memory.</li>
<li><b>Project</b> — a tag <i>within</i> a memory user, not a separate store. It narrows what recall returns; it does not create a new tenant.</li>
</ul>
<p>Sub-tenants are isolated from each other and from your root. There is no query that reads across them, and no setting that merges them.</p>

<h2>Project scope, and the thing that surprises people</h2>
<p>When the Claude Code or Codex plugin captures something while you work in a directory, it tags that memory with a <b>project id</b> derived from the directory path — an opaque hash like <code>local_3f2a…</code>, never the path itself.</p>
<div class="callout"><b>The rule:</b> memory a plugin saved in a project is reachable from the SDK or REST <b>only when the caller carries that same project scope</b>. It does not automatically become account-global, and a caller that sends no project scope will not see it.</div>
<p>This is deliberate — the whole value of project scope is that opening one repo does not surface another repo's decisions. But it does mean "I saved it in Claude Code and my script can't find it" is normally a scope question, not a bug.</p>
<p>To find the project id a directory derives, run the plugin's own diagnostic. It prints the id (never the path):</p>
${codeBlock(`# Claude Code plugin — type this in a session
/itsuki:doctor

# Codex plugin
node <plugin-root>/hooks/codex-doctor.mjs`)}
<p>Both plugins derive the <b>same</b> id for the same directory, so a project captured in one is reachable in the other.</p>

<h2>How recall chooses what to read</h2>
<table>
<tr><th>Mode</th><th>What it reads</th></tr>
<tr><td><code>global</code> (default)</td><td>The memory user's whole store, project tags ignored.</td></tr>
<tr><td><code>project_only</code></td><td>Only memory tagged with the project id you send. Returns nothing if the project has nothing — which is a real answer, not an error.</td></tr>
<tr><td><code>project_then_global</code></td><td>Project memory first, then account-global to fill the remaining budget. This is what the plugins use, so a session opened in a project always leads with that project's context.</td></tr>
</table>
<p>The first three are the <code>recallScope</code> option in the JavaScript client and <code>recall_scope</code> in Python. There is a fourth, <code>project_bootstrap</code>, sent as a separate <code>recallMode</code> field on <code>POST /v1/recall</code>: a deterministic listing for session start — no similarity search, just this project's most salient and recent memory. Both editor plugins send it when a session opens, because an opening query like "project decisions and conventions" is not something any ranker answers well. Neither SDK exposes it as a typed option today; send it in the request body if you are building your own session-start flow.</p>

<h2>Reaching plugin project memory from your own code</h2>
${codeBlock(`import { Memory } from "itsuki";
const memory = new Memory({ apiKey: process.env.ITSUKI_API_KEY });

// Carry the project scope the plugin used, or you will not see its memory.
await memory.recall("deployment decisions", {
  memoryScope: { projectId: "local_3f2a…" },
  recallScope: "project_then_global",
});`)}
<p>The Python client spells the same two options <code>memory_scope={"project_id": …}</code> and <code>recall_scope=…</code>.</p>

<h2>What does NOT happen</h2>
<ul>
<li>Project memory does not become account-global over time.</li>
<li>A sub-tenant's memory is never visible to another sub-tenant, or to your root.</li>
<li>Your account never sees another account's tenants, projects, or counts.</li>
<li>Nothing you save is used to train a model.</li>
</ul>
` };

PAGES["/concepts/delete"] = { title: "Delete & erasure", html: `
<h1>Delete &amp; erasure</h1>
<p class="lede">Two different operations share one route. Knowing which one you asked for is the difference between tidying up and erasing everything.</p>

<h2>Scoped delete is curation</h2>
<p>A delete that names a source lane or a time window removes what matched, and nothing else:</p>
${codeBlock(`# Preview first — this is the default, and it changes nothing
DELETE /v1/memories?source=ingest&after=1786000000000

# Then confirm
DELETE /v1/memories?source=ingest&after=1786000000000&confirm=true&dry_run=false`)}
<p>Work you already submitted that is <i>still processing</i> is not cancelled by a scoped delete. It finishes, and its output lands after the delete — because you asked to remove what exists, not to stop what is running. The preview tells you how many such saves are in flight so the number is never a surprise.</p>

<h2>Unscoped confirmed delete is an erasure</h2>
<p>A confirmed delete with no source and no window means "remove everything in this memory space". That is a stronger promise, so it does more:</p>
<ul>
<li>It records an <b>erasure barrier</b> — a timestamp for that memory user.</li>
<li>It removes everything currently live, then re-checks and sweeps again, so anything that landed mid-operation is caught too.</li>
<li>It <b>cancels accepted work that had not yet committed</b>. Any save accepted <i>before</i> the barrier is refused at commit time, so it cannot reappear after you erased.</li>
</ul>
${codeBlock(`DELETE /v1/memories?confirm=true&dry_run=false`)}
<p>The confirmed response tells you what happened, including how many in-flight saves were cancelled:</p>
${codeBlock(`{
  "ok": true,
  "dry_run": false,
  "deleted": { "runs": 3, "nodes": 41, "pages": 2, "slices": 55, "events": 7, "edges": 63, "candidates": 0 },
  "cancelled_runs": 1,
  "pending_jobs": 1,
  "convergence_passes": 1,
  "note": "1 accepted save(s) were cancelled by this delete."
}`)}
<p><code>convergence_passes: 1</code> means the first sweep was enough. A higher number means work arrived while the erasure ran and was swept too.</p>

<h2>What a cancelled save looks like</h2>
<p>A cancelled save is <b>terminal</b>. It is reported through the job status you already poll:</p>
${codeBlock(`{
  "status": "failed",
  "cancelled_by_delete": true,
  "outcome_reason": "cancelled_by_delete",
  "error": "cancelled_by_delete: a confirmed delete erased this scope while the save was processing"
}`)}
<div class="callout"><b>Why <code>failed</code> and not a new status?</b> Because every already-released SDK treats <code>enriched</code>, <code>failed</code> and <code>completed</code> as the complete set of terminal states. Inventing a fourth word would make an older client poll forever on a job that is finished. The state stays in the vocabulary every client knows, and the <i>reason</i> is published as its own field.</div>
<p><b>Do not retry a cancelled save.</b> It is not a transient error. The barrier applies to the original work, so a retry is cancelled the same way — it just costs you another round trip. If you still want that content stored, write it again as a <b>new</b> save: work submitted <i>after</i> the barrier is ordinary work and lands normally. Erasure clears the past; it does not lock the memory space.</p>
<p>To separate cancellations from genuine failures:</p>
${codeBlock(`GET /v1/jobs?cancelled=true    # only work your own erasure cancelled
GET /v1/jobs?cancelled=false   # only work that actually failed`)}

<h2>Which route to use</h2>
<p>There are two compatibility surfaces for erasing one resolved memory space. Neither one is project-wide:</p>
<table>
<tr><th>Route</th><th>Who</th><th>Behaviour</th></tr>
<tr><td><code>DELETE /v1/memories</code></td><td>API keys and sessions</td><td>Preview-first, addresses the one memory space resolved for the request (including a specifically addressed sub-tenant), and carries the erasure barrier described above. <b>This is the route to build on.</b></td></tr>
<tr><td><code>POST /v1/actions/delete-all</code></td><td>Signed-in sessions only</td><td>Legacy compatibility route for the session's one resolved memory space. It refuses API keys with <code>token_not_allowed</code> and is intentionally not exposed in Settings.</td></tr>
</table>
<p>A project may contain a primary space plus registered SDK sub-tenant spaces. These routes never claim to iterate all of them. True project-wide deletion is self-serve from Settings via the verified lifecycle workflow: it previews first, requires a typed confirmation bound to your session, then converges across every registered project space, index, queue, artifact, and retry path — and reports completion only after a residual scan proves every store empty.</p>

<h2>What is kept</h2>
<p>Erasure removes your memory. It retains the bookkeeping that proves the deletion happened — deletion records, job and receipt history, and the timestamps above. That audit trail carries no memory content, and it is what lets a later preview honestly answer "nothing left".</p>
` };

PAGES["/operate/observability"] = { title: "Monitoring & diagnostics", html: `
<h1>Monitoring &amp; diagnostics</h1>
<p class="lede">If you run Itsuki behind your own product, this page is the answer to "is it healthy, and if not, which part?"</p>

<h2>One call for the whole account</h2>
<p>Every other read endpoint is scoped to a single memory user. <code>GET /v1/ops/overview</code> is the account view: it rolls up your root and your sub-tenants together, and lists each one.</p>
${codeBlock(`curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  "https://itsuki.app/v1/ops/overview?range=7d"`)}
${codeBlock(`{
  "ok": true,
  "account": {
    "owner_user_id": "user_…",
    "range": { "days": 7, "from": 1785539673072, "to": 1786144473072 },
    "tenants": 12,
    "truncated": false,
    "live_nodes": 94,
    "jobs": { "queued": 0, "staged": 0, "processing": 0, "enriched": 150, "failed": 11, "completed": 0 },
    "backlog": { "depth": 0, "oldest_age_ms": null },
    "stuck": { "non_terminal": 0, "older_than_ms": 900000 },
    "cancelled_by_delete": 14,
    "failures": { "total": 25, "cancelled_by_delete": 14, "other": 11 },
    "retries": { "jobs_with_retries": 3, "max_attempts": 2 },
    "erasures": { "tenants_with_barrier": 2, "latest_barrier_at": 1786144705593 },
    "latency_ms": { "p50": 973, "p95": 3363, "samples": 962 }
  },
  "tenants": [ { "memory_user_id": "mem_…", "external_user_id": "your-user-42", "is_root": false, "live_nodes": 12, "…": "…" } ]
}`)}
<p>Needs a Bearer API token or a signed-in session. The legacy <code>x-api-key</code> lane is refused with <code>account_scope_required</code>, because it writes under raw identifiers and has no account relationship to roll up.</p>

<h2>Reading it</h2>
<table>
<tr><th>Question</th><th>Where to look</th></tr>
<tr><td>Is it healthy?</td><td><code>backlog.depth</code> near zero and <code>stuck.non_terminal</code> at zero.</td></tr>
<tr><td>Is backlog building?</td><td><code>backlog.depth</code> rising, or <code>backlog.oldest_age_ms</code> growing between polls.</td></tr>
<tr><td>Are there stuck jobs?</td><td><code>stuck.non_terminal</code> — work still not terminal after <code>stuck.older_than_ms</code>.</td></tr>
<tr><td>Which tenant is affected?</td><td>The <code>tenants</code> array. <code>external_user_id</code> is the id <i>you</i> sent.</td></tr>
<tr><td>Did something actually fail, or did I erase it?</td><td><code>failures.other</code> vs <code>failures.cancelled_by_delete</code>. Only the first needs investigating.</td></tr>
<tr><td>Are retries happening?</td><td><code>retries.jobs_with_retries</code> and <code>retries.max_attempts</code>.</td></tr>
<tr><td>Did an erasure converge?</td><td>The tenant's <code>barrier_at</code> is set and its <code>live_nodes</code> is zero.</td></tr>
<tr><td>How slow is it?</td><td><code>latency_ms.p50</code> / <code>p95</code>. Write latency is dominated by the model call.</td></tr>
</table>
<p><b>Metadata only.</b> This endpoint returns counts, states, timestamps and latency. It never returns memory content, labels, or project display names — a project's opaque id is included, the directory name it came from is not. <code>truncated: true</code> means the sub-tenant list was capped; your account's own root row is always present regardless.</p>

<h2>Per-memory-user detail</h2>
${codeBlock(`GET /v1/status?userId=your-user-42                 # counts for one memory user
GET /v1/jobs?userId=your-user-42                   # that user's job ledger
GET /v1/jobs?userId=your-user-42&cancelled=true    # only erasure-cancelled work
GET /v1/packets/<source_packet_id>/status          # one accepted write
GET /v1/requests?userId=your-user-42               # request history, metadata only`)}

<h2>Diagnosing a plugin install</h2>
<p>Both editor plugins ship a diagnostic that checks version, configuration, endpoint, credential presence, connectivity, the local outbox, and the project id the current directory derives. Neither prints your API key.</p>
${codeBlock(`# Claude Code — type it in a session
/itsuki:doctor
/itsuki:doctor --bind-outbox   # after rotating a key, re-key queued captures

# Codex — run it directly
node <plugin-root>/hooks/codex-doctor.mjs
node <plugin-root>/hooks/codex-doctor.mjs --json`)}
<p>Queued captures are never deleted by a diagnostic. If a key rotation stranded them, they are preserved and reported until you rebind deliberately.</p>
` };

PAGES["/privacy"] = { title: "Privacy & limits", html: `
<h1>Privacy &amp; limits</h1>
<p class="lede">The short version we hold ourselves to: no selling data, no ads, no third-party trackers, no training on your memory.</p>
<h2>Privacy</h2>
<ul>
<li>Your memory belongs to you. <code>GET /v1/export</code> exports the memory space resolved for that request, and a confirmed unscoped <code>DELETE /v1/memories</code> erases that same resolved space with an erasure barrier. Settings has no delete-all button, and true project-wide export or deletion must not be inferred from these scoped operations. Project-wide deletion is not self-serve until convergent lifecycle cleanup covers every primary and SDK sub-tenant path — see <a href="#/concepts/delete">Delete &amp; erasure</a>.</li>
<li>Site analytics are aggregate-only: no cookies, no visitor IDs, bot-filtered counts.</li>
<li>Operational metadata (sign-ins, save/recall counts, errors) is visible to the operator for support; memory <i>content</i> is not browsed. The <a href="#/operate/observability">operator endpoints</a> available to <i>you</i> return counts, states and timings only — never content.</li>
<li>The identifier you pass as <code>userId</code> for a sub-tenant is stored as part of that write's provenance, so your own account can list its tenants. Use an opaque, stable id of your own rather than an end user's email address.</li>
<li>Secret redaction before storage covers labelled credentials (<i>"api key is …"</i>, <i>"password: …"</i>) and common key formats. It is a strong safety net, not a guarantee: an unlabelled high-entropy string, or a labelled passphrase of ordinary words, can still be stored. Treat memory as you would any store you write to deliberately.</li>
<li>Full details: <a href="${ORIGIN}/privacy" target="_blank" rel="noopener">Privacy Policy</a> · <a href="${ORIGIN}/terms" target="_blank" rel="noopener">Terms</a>.</li>
</ul>
<h2>Limits</h2>
<table>
<tr><th>Thing</th><th>Limit</th></tr>
<tr><td>Saves (<code>/v1/save</code>, <code>/v1/turn</code>)</td><td>60 per minute</td></tr>
<tr><td>Recall</td><td>120 per minute</td></tr>
<tr><td>Conversation ingest (<code>/v1/ingest</code>)</td><td>300 per minute</td></tr>
<tr><td>Reads (list, get)</td><td>240 per minute</td></tr>
<tr><td>Deletes</td><td>30 per minute</td></tr>
<tr><td>One ingest request</td><td>30 messages; 4,000 Unicode code points/message; 120,000 total; 512 KiB serialized UTF-8 JSON</td></tr>
<tr><td>Auth attempts</td><td>10 per minute per IP</td></tr>
<tr><td>Recall context</td><td>Bounded (~1,800 chars) by design — memory should sharpen prompts, not flood them</td></tr>
<tr><td>Extraction</td><td>Asynchronous; allow a few seconds before recalling brand-new facts</td></tr>
</table>
<p>Keep exports of anything critical, and report anything odd — every server error is auto-reported to the operator already.</p>
` };

PAGES["/integrations/langchain"] = { title: "LangChain", html: `
<h1>LangChain</h1>
<p class="lede">LangChain and LangGraph reach Itsuki through the MCP endpoint: connect once with <code>langchain-mcp-adapters</code> and your agent gets save, recall, list, get, delete, and whoami as ordinary LangChain tools.</p>

<h2>What this integration is</h2>
<p>There is no <code>itsuki-langchain</code> package, and there should not be. LangChain already ships an MCP adapter, and Itsuki already serves a Streamable HTTP MCP endpoint, so the connection is four lines of configuration instead of a dependency you would have to keep in step with two moving frameworks. The same client covers LangGraph: <code>get_tools()</code> returns <code>BaseTool</code> instances, which is what both accept.</p>
<p>One property matters before you build on it. <b>The model decides when to call a tool.</b> A connected server is not proof of a save, and an agent that never gets around to calling <code>recall_memory</code> will answer from nothing. If you need memory on every turn regardless of what the model feels like doing, use the direct route below — instead of the tools, or alongside them.</p>

<h2>Before you start</h2>
<p>Create an <b>MCP link</b> — open <b>Get started</b>, pick your client, and click <b>Create link</b>. It is shown once, and it is a credential: the header below carries it, so load it from the environment in anything you commit. An <b>API key</b> works on this door too, in the same header. What does not work is putting either one in the URL path of the header route — see <a href="#/api/auth">Authentication and keys</a>.</p>

<h2>Connect the tools</h2>
<pre><button class="copy">Copy</button><code>pip install langchain-mcp-adapters langgraph</code></pre>
<pre><button class="copy">Copy</button><code>import asyncio
import os

from langchain.chat_models import init_chat_model
from langchain_mcp_adapters.client import MultiServerMCPClient
from langgraph.prebuilt import create_react_agent

client = MultiServerMCPClient({
    "itsuki": {
        "transport": "http",
        "url": "https://itsuki.app/mcp",
        "headers": {"Authorization": f"Bearer {os.environ['ITSUKI_MCP_KEY']}"},
    }
})


async def main():
    tools = await client.get_tools()
    agent = create_react_agent(init_chat_model("openai:gpt-4.1"), tools)

    await agent.ainvoke({"messages": [
        {"role": "user", "content": "Remember that I deploy on Fridays only."}
    ]})

    answer = await agent.ainvoke({"messages": [
        {"role": "user", "content": "When am I allowed to deploy?"}
    ]})
    print(answer["messages"][-1].content)


asyncio.run(main())</code></pre>
<p>The first invocation calls <code>save_memory</code> and gets a receipt back. The second calls <code>recall_memory</code>, whose text result <i>is</i> the recalled context — the model can read it directly, with no post-processing. Extraction runs in the background, so a recall issued in the same second as a save may not see it yet.</p>
<div class="note">Only the client block above is Itsuki's contract, and it is the shape verified against production. The agent wiring is LangChain's own API and moves at LangChain's pace; if <code>create_react_agent</code> has moved in your version, the tools list still goes wherever that version wants tools.</div>

<h2>Scoping memory to one end user</h2>
<p>Over MCP the memory space is fixed by the credential. <b>No memory tool takes a user id</b>, on purpose: every tool argument is written by a model that has just read text somebody else wrote, so tenancy is never expressible as an argument. A personal assistant with one MCP link is therefore already finished — it has exactly one memory space and cannot address another.</p>
<p>An application serving many end users needs the opposite arrangement: the user id comes from your session, and the model never touches it. Call memory directly from your graph with the <a href="#/sdk/python">Python SDK</a>.</p>
<pre><button class="copy">Copy</button><code>import os

from itsuki import MemoryClient
from langchain_core.messages import SystemMessage

memory = MemoryClient(api_key=os.environ["ITSUKI_API_KEY"])


def recall_node(state, config):
    """Runs before the model. Adds context, or adds nothing."""
    user_id = config["configurable"]["user_id"]   # your session, never the model
    result = memory.search(state["messages"][-1].content, user_id=user_id)
    if not result.get("context"):
        return {"messages": []}
    return {"messages": [SystemMessage(content=result["context"])]}


def capture_node(state, config):
    """Runs after the answer has settled."""
    user_id = config["configurable"]["user_id"]
    turns = [
        {"role": "user" if m.type == "human" else "assistant", "content": m.content}
        for m in state["messages"][-2:]
    ]
    memory.add_conversation(
        turns,
        user_id=user_id,
        conversation_id=config["configurable"]["thread_id"],
        idempotency_key=MemoryClient.new_idempotency_key(),
    )
    return {}</code></pre>
<p>Any stable string works as <code>user_id</code> — your user id, a tenant slug, an email. It is hashed with your account id before it becomes a storage key, so two accounts sending the same string still get different spaces. A stable <code>conversation_id</code> converges re-sends of one thread onto a single Conversation page instead of making a new one each time. <a href="#/concepts/scope">Who memory belongs to</a> has the full model.</p>
<div class="warn">Do not mix the two routes in a multi-tenant app. If the MCP tools are attached, every end user of that agent reads and writes the one space the credential owns. Attach the tools only for single-user agents.</div>

<h2>Verify the connection</h2>
<p>Ask the agent to <i>"save that I prefer concise answers, then recall what you know about me"</i>. A working connection reports a receipt for the save and returns the fact on recall. The <code>whoami</code> tool reports identity, scopes, bound project, and live counts at any time, and never echoes the key — it is the fastest way to prove a credential actually reached the server.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>No tools come back from <code>get_tools()</code></b> — the URL must be exactly <code>https://itsuki.app/mcp</code> with no trailing path, and the header must read <code>Authorization: Bearer &lt;key&gt;</code>.</li>
<li><b>401</b> — the key is revoked, or was pasted with whitespace. If you put a key in the URL instead of the header, the server names that mistake rather than pretending the key is bad.</li>
<li><b>Import errors mentioning <code>mcp.shared</code>, <code>RequestContext</code>, or "not enough values to unpack"</b> — an upstream clash between adapters written for the <code>mcp</code> 1.x Python API and an installed <code>mcp</code> 2.x. It affects every MCP server, not just Itsuki. Pin with <code>pip install "mcp&lt;2"</code>.</li>
<li><b>The agent answers without ever calling a tool</b> — tool selection belongs to the model. Put "call recall_memory at the start of a conversation" in the system prompt, or move recall into a node as shown above.</li>
<li><b>The save returned a receipt but recall is empty</b> — extraction is asynchronous. Allow a few seconds, or poll the packet handle the save returned.</li>
<li><b>429</b> — writes are limited to 60 per minute per user. Back off and retry; bulk imports belong on <code>POST /v1/ingest</code>.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/api/mcp">MCP tools</a> — what each tool takes and returns.</li>
<li><a href="#/sdk/python">Python SDK</a> — the direct route in full.</li>
<li><a href="#/integrations/python">Python frameworks</a> — every Python client shape on one page.</li>
<li><a href="#/concepts/scope">Who memory belongs to</a> — sub-tenants, projects, and recall scope.</li>
</ul>
` };

PAGES["/integrations/llamaindex"] = { title: "LlamaIndex", html: `
<h1>LlamaIndex</h1>
<p class="lede">Itsuki becomes the long-term half of LlamaIndex's own <code>Memory</code> class: install one package, pass it where the agent expects memory, and short-term chat history keeps working exactly as the host intends.</p>

<h2>Two routes, and which one you want</h2>
<p><b>The native memory block</b> — <code>llama-index-memory-itsuki</code> — is the route to start with. It is a <code>BaseMemoryBlock</code>, so recall and capture happen inside the agent's normal memory lifecycle and the model never has to decide to look something up.</p>
