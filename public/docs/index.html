<p>The protected outbox is capped at 128 raw batch envelopes / 64 MiB total / 2 MiB each and never evicts undelivered content. Existing v1 spool files remain drainable under their former 2 MiB raw-envelope cap and bounded legacy request contract; those responses carry <code>x-itsuki-ingest-contract: legacy-claude-outbox-v1</code> and the server emits content-free migration telemetry. This dual contract exists only to avoid stranding already-protected local data; all new writes use the v2 limits above. Downstream, each extraction queue entry is capped at 20 messages and 12,000 Unicode code points. Every complete serialized chat-model input is guarded at no more than 24,576 UTF-8 bytes; any model-bound omission is labelled, and an unfit fixed prompt fails before inference. Claude deletes plugin data on final uninstall unless you use its <code>--keep-data</code> option.</p>
<div class="note">Two plugin settings: an absolute Node executable and one sensitive API key; there is no MCP URL to configure. Claude stores the key in its credential store, exports it only to plugin subprocesses, and interpolates it into the bundled MCP Bearer header. If either setting is missing or the key is rejected, the plugin tells you at session start instead of failing quietly.</div>
` };

PAGES["/install/cursor"] = { title: "Cursor & other editors", html: `
<h1>Cursor &amp; other editors</h1>
<p class="lede">Cursor connected to your memory over MCP, verified by a tool call that names the memory space it actually reached — plus the exact config file for every other editor we can verify.</p>

${prereq([
	`An <a href="#/api/auth">MCP link</a> — a credential created with type <b>MCP</b>. An API key does not work in the URL, and the two are indistinguishable by sight: both are 32 random bytes behind an <code>${PRODUCT.tokenPrefix}</code> prefix.`,
	`A role that can create project keys. Without it every credential step in <b>Get started</b> collapses to one line: <i>"Your role cannot create project keys."</i> See <a href="#/guides/projects">Projects, organizations, and teams</a>.`,
	`Cursor, or another editor that can connect a <b>remote MCP server over Streamable HTTP</b>. An editor that only launches local stdio servers cannot reach this one.`,
])}

<h2>Connect Cursor</h2>
<ol class="steps">
<li><b>Open the Cursor card in Get started.</b><p>Left rail, under <b>Setup</b>, choose <b>Get started</b>. On the <b>Coding Agents</b> tab, open the card labelled <b>Cursor</b>. The four steps on that card are generated with your real link once you make one, which is why it is worth starting here rather than hand-copying from this page.</p></li>

<li><b>Create your link.</b><p>Step 01 is titled <i>Create your link</i> with the body <i>"Shown once. Save it."</i> Press <b>Create link</b>. A banner appears above the steps while the secret is live: <i>"This one-time MCP link is visible in the setup below. Copy it before leaving this project; it cannot be retrieved again."</i> Once the link exists, step 01 changes to <i>"Link created. It's in every block below."</i> and every code block on the card becomes copyable.</p></li>

<li><b>Press Add to Cursor.</b><p>Step 02 renders a button, <b>Add to Cursor</b>. It is a Cursor deeplink carrying the whole server config, base64-encoded, so Cursor writes the entry for you and asks you to confirm the install.</p>
${codeBlock(`cursor://anysphere.cursor-deeplink/mcp/install?name=Itsuki&config=<base64 of {"type":"http","url":"${ORIGIN}/mcp/YOUR_MCP_KEY"}>`, "what the button opens")}
<p>Your credential is inside that URL. Do not paste the button's link into a chat, an issue, or a shared note.</p></li>

<li><b>Or write the config yourself.</b><p>Step 03 is titled <i>Or paste the config</i> — use it if the deeplink handler is not registered on your machine, or if you would rather see what gets written. Put it in <code>.cursor/mcp.json</code> for one project, or <code>~/.cursor/mcp.json</code> to reach every project.</p>
${codeBlock(`{
  "mcpServers": {
    "${PRODUCT.name.toLowerCase()}": { "url": "${ORIGIN}/mcp/YOUR_MCP_KEY" }
  }
}`, "mcp.json")}
<p>There is no headers block, and that is deliberate: the credential is the last path segment of the URL, so nothing here depends on the editor being able to interpolate an environment variable. The flip side is that the file <i>is</i> a secret. Keep a project-level <code>.cursor/mcp.json</code> out of version control unless the link is genuinely meant to be shared with everyone who can clone the repository.</p></li>

<li><b>Restart Cursor and open a new chat.</b><p>The config is read at startup, so an editor that was already running will not see it. Where Cursor lists its MCP servers has moved between releases — Cursor's own documentation is the authority for that panel. Do not trust a green dot there either way; step 6 is the real check.</p></li>

<li><b>Verify with a tool call.</b><p>In a new chat, say this:</p>
${codeBlock(`use the ${PRODUCT.name.toLowerCase()} whoami tool and tell me what it reports`, "say this")}
<p>A healthy connection answers with the server version, the bound project, the scopes the credential carries, and live counts of what is stored:</p>
${outputBlock(`Connected to Itsuki memory (server 0.7.0). Project: Depot API. Scopes: memory:read, memory:write. Stored: 24 memories (18 facts, 6 pages), 61 events, 2 pending candidates.`, "What the assistant reports")}
<p>Alongside that sentence the tool returns a machine payload — <code>server</code>, <code>user_id</code>, <code>scopes</code>, <code>can_delete</code>, <code>project</code> and <code>counts</code> — for clients that surface structured tool output. If the counts are zero on a brand-new project, the connection is still healthy; there is simply nothing saved yet.</p></li>
</ol>

<h2>What the connection exposes</h2>
<p>Eleven tools, when the link carries read, write and delete:</p>
<table>
<tr><th>Group</th><th>Tools</th></tr>
<tr><td>Write</td><td><code>save_memory</code>, <code>save_conversation</code></td></tr>
<tr><td>Read</td><td><code>recall_memory</code>, <code>list_memories</code>, <code>get_memory</code></td></tr>
<tr><td>Correct</td><td><code>update_memory</code>, <code>memory_history</code>, <code>rollback_memory</code></td></tr>
<tr><td>Erase</td><td><code>delete_memory</code>, <code>delete_all_memories</code></td></tr>
<tr><td>Diagnose</td><td><code>whoami</code></td></tr>
</table>
<p>A connection is never shown a tool it cannot call: the correction and deletion tools are registered per request, only when the deployment has those doors open <i>and</i> this credential's scopes and project role permit the operation. So a shorter tool list is a scope answer, not a broken install — run <code>whoami</code> and read the <code>scopes</code> and <code>can_delete</code> fields. <a href="#/api/mcp">MCP tools</a> documents every input.</p>

<div class="note"><b>An MCP connection is tools, not lifecycle.</b> Recall before the model sees your turn, and capture after a turn settles, come from a tested per-host adapter — the <a href="#/install/plugin">Claude Code plugin</a>, <a href="#/install/opencode">OpenCode</a>, <a href="#/install/openclaw">OpenClaw</a>. Connecting over MCP does not imply either. Here the model calls a tool or nothing happens, which is why the standing-instructions block on the Get started card is worth adding to your editor's rules.</div>

<h2>Three doors, one server</h2>
<table>
<tr><th>Door</th><th>URL</th><th>Credential</th></tr>
<tr><td><b>Path token</b></td><td><code>${ORIGIN}/mcp/&lt;link&gt;</code></td><td>An MCP link, in the URL. Nothing else is accepted here.</td></tr>
<tr><td><b>Header</b></td><td><code>${ORIGIN}/mcp</code></td><td><code>Authorization: Bearer</code>. Accepts an API key <i>or</i> an MCP link.</td></tr>
<tr><td><b>OAuth</b></td><td><code>${ORIGIN}/mcp</code></td><td>Nothing pasted. The client registers itself and you approve in a browser.</td></tr>
</table>

<h3>Header auth</h3>
<p>If your editor can send headers, point it at <code>${ORIGIN}/mcp</code> with no path token and send <code>Authorization: Bearer</code> plus a key. Same server, same tools. The asymmetry is one-way and intentional: only the URL-path door is restricted to MCP links, so an MCP link also works in a Bearer header, while an API key in the URL is refused by name.</p>

<div class="note">Some clients' MCP configuration cannot send custom headers at all — LlamaIndex's <code>BasicMCPClient</code>, for example, documents only OAuth. The path-token URL works there unchanged, because the credential travels in the URL and no header is required.</div>

<h3>OAuth</h3>
<p>The server publishes RFC 9728 protected-resource metadata at <code>/.well-known/oauth-protected-resource</code> and RFC 8414 authorization-server metadata at <code>/.well-known/oauth-authorization-server</code>, supports RFC 7591 dynamic client registration, and requires PKCE with <code>S256</code>. A client that offers to <i>sign in</i> to a remote MCP server can therefore use the bare <code>${ORIGIN}/mcp</code> URL with no secret in any config file. Whether your editor offers that flow is the editor's decision, not ours.</p>
<p>The consent screen reuses your signed-in dashboard session, so be signed in at <a href="${ORIGIN}" target="_blank" rel="noopener">${ORIGIN}</a> in the same browser before you start. One difference matters afterwards: on the OAuth lane, deletion requires the explicitly consented <code>memory:delete</code> scope, so an OAuth connection that was granted only read and write will not show the deletion tools.</p>

<h2>Other editors</h2>
<p>These are the config locations we can verify, because we generate the snippet for each one:</p>
<table>
<tr><th>Client</th><th>Config file</th><th>Server entry</th></tr>
<tr><td><b>Cursor</b></td><td><code>.cursor/mcp.json</code> (project) or <code>~/.cursor/mcp.json</code> (global)</td><td><code>mcpServers.${PRODUCT.name.toLowerCase()}.url</code></td></tr>
<tr><td><b>OpenCode</b></td><td><code>opencode.json</code> (project) or <code>~/.config/opencode/opencode.json</code> (global)</td><td><code>mcp.${PRODUCT.name.toLowerCase()}</code> with <code>"type": "remote"</code> and <code>"enabled": true</code> — see <a href="#/install/opencode">OpenCode</a></td></tr>
<tr><td><b>Antigravity</b></td><td>The agent panel's raw MCP config (<code>mcp_config.json</code>): <b>MCP servers → Manage → open the raw config</b></td><td><code>mcpServers.${PRODUCT.name.toLowerCase()}.serverUrl</code> — note the key is <code>serverUrl</code>, not <code>url</code>. See <a href="#/install/antigravity">Antigravity</a></td></tr>
<tr><td><b>Claude Code</b></td><td>No file to edit</td><td><code>claude mcp add --transport http ${PRODUCT.name.toLowerCase()} ${ORIGIN}/mcp/YOUR_MCP_KEY</code> — see <a href="#/install/claude-code">Claude Code (MCP)</a></td></tr>
</table>
<p>Those paths belong to the editors, not to us: where a client's own documentation names a different location or a different key, that document wins. For any editor not listed above, we will not guess. Read its remote-MCP-server instructions and give it two things — the URL <code>${ORIGIN}/mcp/YOUR_MCP_KEY</code>, and Streamable HTTP as the transport. Everything on this page after that is identical.</p>

<h2>When it doesn't work</h2>
<p>Before you debug the editor, prove the server is reachable from this machine. Any HTTP method reaches the MCP door, so an empty request is enough:</p>
${codeBlock(`curl -i -X POST ${ORIGIN}/mcp`, "terminal")}
${outputBlock(`HTTP/2 401
www-authenticate: Bearer realm="itsuki", error="invalid_request", error_description="No credential. Authorize with OAuth, send Authorization: Bearer <your API key> to /mcp, or connect an MCP link URL.", resource_metadata="${ORIGIN}/.well-known/oauth-protected-resource"

{"error":"unauthorized mcp token","message":"No credential. Authorize with OAuth, send Authorization: Bearer <your API key> to /mcp, or connect an MCP link URL."}`, "Response")}
<p>That 401 is the healthy answer to a credential-less request: it proves DNS, TLS and routing all work, and the challenge header is how an OAuth-capable client discovers where to authorize. If you get a connection error instead, the problem is between you and the network, not in <code>mcp.json</code>.</p>

<table>
<tr><th>What you see</th><th>What it means</th><th>Fix</th></tr>
<tr><td><i>"That is an API key, not an MCP link…"</i></td><td>You pasted an API key into the URL. The server re-checks the token as an API key purely so it can name the mistake instead of sending you off to regenerate a link that was never the problem.</td><td>Create an MCP link from <b>Get started</b>, or move the API key to an <code>Authorization: Bearer</code> header at <code>${ORIGIN}/mcp</code>.</td></tr>
<tr><td><i>"That MCP link is revoked, expired, or not an MCP token."</i></td><td>The link was deleted in <b>API Keys</b>, or the paste was truncated.</td><td>Compare the tail of the URL against the key's row in <b>API Keys</b>. If it is gone, create a new link — a lost secret cannot be recovered, only replaced.</td></tr>
<tr><td><i>"That key is revoked or not valid…"</i></td><td>The header door received a key that no longer resolves.</td><td>Create a fresh credential and update the client config.</td></tr>
<tr><td><i>"No credential. Authorize with OAuth…"</i></td><td>The client reached <code>${ORIGIN}/mcp</code> with no token and no header — usually the placeholder <code>YOUR_MCP_KEY</code> was never replaced, or the URL lost its last path segment.</td><td>Put the real link back in the URL, or configure header auth.</td></tr>
<tr><td>No tools at all, no error</td><td>The editor is still running the config it read at startup, or the JSON does not parse.</td><td>Validate the file, then fully restart the editor. A reloaded window is not always a restarted MCP client.</td></tr>
<tr><td>Fewer tools than expected</td><td>Scope or role, not a broken install. Correction and deletion tools are registered per request.</td><td>Run <code>whoami</code> and read <code>scopes</code> and <code>can_delete</code>. Deleting memory is an admin capability — see <a href="#/api/auth">Authentication &amp; keys</a>.</td></tr>
<tr><td><i>"You're sending requests very quickly — wait a few seconds and try again."</i></td><td>A rate bucket tripped. The tool answers with <code>code: "rate_limited"</code> and <code>retry_after_s: 60</code> rather than failing the connection.</td><td>Wait, then retry. See <a href="#/api/limits">Rate limits</a>.</td></tr>
<tr><td>The right tools, the wrong memories</td><td>The link is bound to a different project than you assumed. A credential cannot read or write outside the project it was minted in.</td><td>Run <code>whoami</code> and check the <code>project</code> it reports.</td></tr>
</table>

<h2>Where to go next</h2>
${nextSteps([
	["#/api/mcp", "MCP tools", "Every tool this connection exposes, with its inputs and receipts."],
	["#/api/auth", "Authentication & keys", "What separates an MCP link from an API key, and what happens when you swap them."],
	["#/install/opencode", "OpenCode", "A native plugin that joins the turn itself, with the same MCP route as a fallback."],
	["#/guides/rules", "Control what gets remembered", "Decide what a connected editor is allowed to save."],
])}
` };

PAGES["/install/opencode"] = { title: "OpenCode", html: `
<h1>OpenCode</h1>
<p class="lede">Persistent memory for OpenCode: a native plugin that joins the turn itself, with the remote MCP route as a fallback.</p>

<h2>Native plugin</h2>
<p>Published on npm as <code>opencode-itsuki</code>, built and signed by this repository&rsquo;s GitHub Actions workflow with npm provenance. Requires OpenCode <b>1.18.18 or newer</b> and Node 22+. Zero runtime dependencies.</p>
<h3>1. Create an API key</h3>
<p>In <b>API Keys</b>, create an <b>API key</b> &mdash; a server credential, not an MCP link.</p>
<h3>2. Install the plugin</h3>
${codeBlock(`npm install opencode-itsuki`)}
<h3>3. Point opencode.json at it</h3>
<p>Project-level <code>opencode.json</code>, or global at <code>~/.config/opencode/opencode.json</code>:</p>
${codeBlock(`{
  "plugin": ["opencode-itsuki"]
}`)}
<h3>4. Export the key</h3>
<p>The key is read <b>only</b> from the environment that starts OpenCode &mdash; never from <code>opencode.json</code>. That file expands <code>{env:VAR}</code> before it parses, so a key referenced there is resolved into the options object that config validation and other plugins can read. A secret-shaped option value is refused with a readable message rather than used.</p>
${codeBlock(`export ITSUKI_API_KEY=your_api_key`)}
<h3>5. Verify</h3>
<p>Restart OpenCode and say: <i>use the ${PRODUCT.name.toLowerCase()} status tool and tell me what it reports</i>.</p>

<h3>What it does</h3>
<p>Recall runs once per genuinely new human turn and is injected on the system channel, so it reaches the model without entering your transcript or your session titles. Capture runs only after a turn that settled successfully &mdash; never on retries, errors, cancellations, tool-only turns, or subagent sessions. Work is staged to disk before any network call, so a crash mid-save loses nothing.</p>
<p>Five tools are available to the agent: <code>itsuki_recall</code>, <code>itsuki_save</code>, <code>itsuki_memories</code>, <code>itsuki_memory</code>, <code>itsuki_status</code>.</p>
<p><b>Deliberately absent from this package:</b> updating a memory in place, memory history, and entity operations. The five tools above stay on the save-and-read path, and no tool here fakes the rest. Destructive tools are absent by design too: deletion needs a confirmation surface a tool call cannot provide. Use the MCP route below or the dashboard to delete.</p>
<div class="note"><b>Corrections exist, just not here.</b> The service supports <code>update_memory</code>, <code>memory_history</code> and <code>rollback_memory</code>, each keeping an immutable revision. They are simply not wired into this package &mdash; reach them over the MCP route below, from the dashboard, or through the API. See <a href="#/guides/versions">Corrections, history, and rollback</a>.</div>
<p>Recalled memories are wrapped in explicit markers and bounded before they reach the model. That is structural delimitation, not a guarantee: no wrapper can force a model to treat remembered text as inert, and that residual risk is inherent to memory injection.</p>

<h2>MCP route</h2>
<p>Still supported, and the route that carries deletion and the full eight-tool surface.</p>
<h3>1. Create your link</h3>
<p>In <b>API Keys</b>, create an <b>MCP link</b>. It is shown once &mdash; the URL itself is the credential.</p>
<h3>2. Add the remote server</h3>
${codeBlock(`{
  "mcp": {
    "${PRODUCT.name.toLowerCase()}": {
      "type": "remote",
      "url": "${ORIGIN}/mcp/YOUR_MCP_KEY",
      "enabled": true
    }
  }
}`)}
<h3>3. Verify</h3>
<p>Restart OpenCode and say: <i>use the ${PRODUCT.name.toLowerCase()} whoami tool and tell me what it reports</i>. You should see the connected memory space, scopes, and live counts.</p>
<h3>What you get</h3>
<p>The full memory tool set — save, recall, browse, inspect, correct and delete. <a href="#/api/mcp">MCP tools</a> lists every tool with its inputs. For recall and save without prompting, add the proactive-use instructions from the dashboard&rsquo;s Get started page to your OpenCode rules.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>Plugin not loading</b> &mdash; check your OpenCode version is 1.18.18 or newer; the plugin declares that floor and older hosts will refuse it.</li>
<li><b>Memory inactive</b> &mdash; run the status tool. An unset <code>ITSUKI_API_KEY</code> is reported there rather than failing silently.</li>
<li><b>No tools appearing (MCP route)</b> &mdash; restart OpenCode after editing the config, and check the JSON parses.</li>
<li><b>401 unauthorized</b> &mdash; the link is revoked or was an API key. Create an MCP link in API Keys; API keys go in an <code>Authorization: Bearer</code> header at <code>${ORIGIN}/mcp</code> instead.</li>
<li><b>Wrong or missing memories</b> &mdash; say <i>use the whoami tool</i> and check which memory space and project the connection reports.</li>
</ul>
<div class="note">On the MCP route the URL carries your credential &mdash; treat <code>opencode.json</code> as a secret, and keep it out of version control unless the key is meant to be shared with that repository&rsquo;s collaborators. The native plugin has no such problem: its key never enters the config file.</div>
` };
PAGES["/install/antigravity"] = { title: "Antigravity", html: `
<h1>Antigravity</h1>
<p class="lede">Persistent memory for Google Antigravity: a native plugin for the CLI, and the MCP route everywhere else.</p>
<h2>Native plugin — Antigravity CLI only</h2>
<p>Published on npm as <code>antigravity-itsuki</code>, built and signed from this repository&rsquo;s GitHub Actions workflow with npm provenance. Supported on the <b>Antigravity CLI (<code>agy</code>) 1.1.13 or newer</b>, with Node 22+.</p>
${codeBlock(`npx antigravity-itsuki install
export ITSUKI_API_KEY=your_api_key
npx antigravity-itsuki doctor`)}
<p>The installer checks your host version first, writes the plugin into <code>~/.gemini/config/plugins/itsuki/</code> with a manifest of exactly what it created, and refuses to overwrite a directory it did not create. Uninstall removes only what that manifest lists and keeps anything still queued unless you pass <code>--purge</code>. The doctor reports what is configured, what is queued and what is held — and never prints your key.</p>
<p>Recall runs at <code>PreInvocation</code>, before the model sees your turn. <b>Automatic capture is currently held</b>: Antigravity has not published a transcript contract that this package can safely verify, so the CLI plugin does not upload a turn at <code>Stop</code>. Save explicitly through the MCP tools below until that host contract is proven.</p>
<p><b>The Antigravity desktop app and the Antigravity IDE are not supported.</b> Hook execution on those surfaces is undocumented and unverified, so the plugin detects them and stays inactive rather than appearing to work. Use the MCP route below there.</p>
<p><b>Deliberately absent:</b> updating a memory in place, memory history, entity operations, and any destructive tool. Deletion needs a confirmation surface a hook cannot provide — use the MCP route or the dashboard.</p>
<h2>MCP route — any Antigravity surface</h2>
<h3>1. Create your link</h3>
<p>In <b>API Keys</b>, create an <b>MCP link</b>. It is shown once — the URL itself is the credential.</p>
<h3>2. Add the MCP server</h3>
<p>In the agent panel: <b>MCP servers → Manage → open the raw config</b>, then add:</p>
${codeBlock(`{
  "mcpServers": {
    "${PRODUCT.name.toLowerCase()}": { "serverUrl": "${ORIGIN}/mcp/YOUR_MCP_KEY" }
  }
}`)}
<h3>3. Verify</h3>
<p>Restart the Antigravity session and say: <i>use the ${PRODUCT.name.toLowerCase()} whoami tool and tell me what it reports</i>.</p>
<h3>What you get</h3>
<p>The full memory tool set — save, recall, browse, inspect, correct and delete. <a href="#/api/mcp">MCP tools</a> lists every tool with its inputs.</p>
<h3>Troubleshooting</h3>
<ul>
<li><b>No tools appearing</b> — restart the session after saving the config.</li>
<li><b>401 unauthorized</b> — the pasted URL must be an MCP link created in API Keys, not an API key.</li>
</ul>
<div class="note">Antigravity's config file does not interpolate environment variables, so the URL you paste carries the credential in plain text. Treat the file as a secret. This is also why the path-token URL is the recommended route here — there is no header for a variable to fail to reach.</div>
` };

PAGES["/install/openclaw"] = { title: "OpenClaw", html: `
<h1>OpenClaw</h1>
<p class="lede">The <b>native plugin</b> joins OpenClaw's own agent lifecycle: relevant memory is recalled before each turn reaches the model, and what you decide is captured after the turn settles — running <b>alongside</b> OpenClaw's built-in memory (<code>MEMORY.md</code>, daily notes, <code>memory_search</code>), never replacing it. The MCP routes remain as fallbacks.</p>
<h2>Route A — native plugin (recommended)</h2>
<p>Published on npm as <code>openclaw-itsuki</code>, built and signed from this repository's GitHub Actions workflow with npm provenance. Zero runtime dependencies. Needs Node 22.22.3+, 24.15+, or 25.9+ — OpenClaw's own engine range (validated against OpenClaw 2026.7.1-2).</p>
${codeBlock(`openclaw plugins install openclaw-itsuki`)}
<p><b>Then grant conversation access.</b> OpenClaw blocks conversation-reading hooks for installed plugins until you opt in — without this the plugin loads, registers its tools, and captures nothing. Merge into <code>openclaw.json</code>:</p>
${codeBlock(`{
  "plugins": {
    "allow": ["itsuki"],
    "entries": {
      "itsuki": {
        "enabled": true,
        "hooks": { "allowConversationAccess": true }
      }
    }
  }
}`)}
<p>Create an <b>API key</b> under <b>API keys</b> (shown once), set it as <code>ITSUKI_API_KEY</code> in the Gateway's environment, restart the Gateway, and verify — <code>diagnostics</code> must be empty:</p>
<div class="note"><b>An API key, not an MCP link.</b> This plugin sends the credential as an <code>Authorization: Bearer</code> header and checks its shape first, so a full <code>/mcp/…</code> URL is refused before a request is made. MCP links belong in the URL of routes B and C below.</div>
${codeBlock(`openclaw plugins inspect itsuki --runtime --json`)}
<p>Memory then recalls before every user-originated turn and saves after each settled one, exactly once — across Gateway restarts, compaction, and subagents. Cron and heartbeat runs are never captured. Recalled context is injected behind an explicit stored-context-not-instructions label, every message is scrubbed for credentials locally before it leaves the machine, and undeliverable saves wait in a crash-safe local spool rather than being lost. There is no delete surface of any kind in the plugin.</p>
<p>Optional <b>per-sender tenancy</b> (<code>"tenancy": "per-sender"</code> in the plugin config) gives each channel-scoped sender an isolated memory space derived as a one-way hash of channel + sender id. A turn without derivable sender identity skips memory entirely rather than falling back to the owner's space. Turning this on means storing per-person memory for the people who talk to your agent — tell them.</p>
<p>Deliberately absent from this plugin: in-place editing of a stored memory, multimodal memory, and automatic consolidation — and the plugin never claims OpenClaw's exclusive memory slot, which would disable built-in memory for every agent in the install.</p>
<div class="note"><b>Editing is absent from the plugin, not from the service.</b> Correct a memory over the MCP routes below, in the dashboard, or through the API; every correction keeps an immutable revision you can roll back. See <a href="#/guides/versions">Corrections, history, and rollback</a>.</div>
<h2>Route B — prompt install (MCP)</h2>
<p>In the dashboard, open <b>Get started</b>, choose <b>OpenClaw</b>, click <b>Create link</b> for an MCP link, and copy the installation prompt. Paste it into OpenClaw. The agent adds the memory server to its own configuration, imports your workspace files (<code>SOUL.md</code>, <code>IDENTITY.md</code>, <code>USER.md</code>, <code>MEMORY.md</code>, and the last 30 days of <code>memory/YYYY-MM-DD.md</code>) through the bounded ingest door, and verifies the round trip with <code>whoami</code> and <code>recall_memory</code>. Every accepted batch returns a receipt you can inspect under <b>Requests</b>.</p>
<h2>Route C — manual config (MCP)</h2>
${codeBlock(`openclaw mcp add ${PRODUCT.name.toLowerCase()} --url ${ORIGIN}/mcp/YOUR_MCP_KEY --transport streamable-http`)}
<p>Reload OpenClaw, then confirm the connection by asking it to call the <code>whoami</code> tool. To import existing workspace notes, batch them through <code>POST ${ORIGIN}/v1/ingest</code> — check <code>GET ${ORIGIN}/v1/ingest/limits</code> first (at most 30 messages per request, 4,000 characters per message).</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Plugin loads but nothing is captured</b> — <code>hooks.allowConversationAccess</code> is not set; <code>plugins inspect itsuki --runtime --json</code> names the block in <code>diagnostics</code>.</li>
<li><b>Saves say "queued" rather than "saved"</b> — ${PRODUCT.name} is unreachable or rate-limited; the span is spooled under <code>$OPENCLAW_STATE_DIR/itsuki</code> and delivers automatically.</li>
<li><b>Tools missing after MCP install</b> — reload OpenClaw so its MCP server list refreshes, then re-ask for <code>whoami</code>.</li>
<li><b>401 unauthorized</b> — the key is revoked; create a fresh one under API Keys.</li>
</ul>
` };

PAGES["/install/hermes"] = { title: "Hermes Agent", html: `
<h1>Hermes Agent</h1>
<p class="lede">A native memory provider for Hermes: bounded recall before every real turn, exactly-once capture after each settled one. An MCP route remains for setups that cannot install packages.</p>
<h2>Native provider (recommended)</h2>
<p>Needs <b>Hermes 0.19.0 or newer</b>. One runtime dependency, no postinstall.</p>
${codeBlock(`pip install hermes-itsuki
hermes-itsuki install
hermes memory setup      # choose itsuki, paste your key`)}
<p><code>hermes-itsuki install</code> places the provider in <code>$HERMES_HOME/plugins/itsuki/</code> and makes sure the SDK is importable by Hermes. That location is not incidental: Hermes 0.19.0 has no entry-point discovery, and the official installer's update path prunes anything not in its own lockfile — deploying outside the virtualenv is what makes the provider survive <code>hermes update</code>.</p>
<p>Check it any time with <code>hermes-itsuki doctor</code>, which reports queue depth, breaker state and anything held back — never your key. <code>hermes-itsuki uninstall</code> removes the provider and keeps pending memories; add <code>--purge</code> to delete the local state and config too.</p>
<h3>What it remembers, and what it never does</h3>
<p>Only your message and the assistant's answer. Tool calls, tool results, system prompts and sub-agent work are excluded by construction, not by filtering afterwards. Recalled memories arrive inside <code>&lt;itsuki-recalled-context-v1&gt;</code> markers as untrusted data — never instructions — and the agent gets two read-only tools, <code>itsuki_recall</code> and <code>itsuki_status</code>. There is deliberately no memory-writing tool: automatic capture already stores what you actually saw.</p>
<h3>Honest limits</h3>
<p>Echo suppression is byte-exact within 512 entries or 30 minutes, then fails open. The local spool holds 64 envelopes / 8 MiB / 14 days, and past that the oldest is dropped and counted — durable within documented bounds, not lossless. Rotating your key orphans anything still pending under the old one, on purpose: envelopes are partitioned by credential so a re-keyed install can never deliver one project's conversations into another. Hermes runs delegated subagents with memory off, so their work is not captured.</p>
<h2>MCP route</h2>
<h2>1. Create your link</h2>
<p>In <b>API Keys</b>, create an <b>MCP link</b>. It is shown once — the URL itself is the credential.</p>
<h2>2. Add the MCP server</h2>
<p>In <code>~/.hermes/config.yaml</code>:</p>
${codeBlock(`mcp_servers:
  ${PRODUCT.name.toLowerCase()}:
    url: "${ORIGIN}/mcp/YOUR_MCP_KEY"`)}
<p>Or interactively — Hermes prompts for the URL:</p>
${codeBlock(`hermes mcp add ${PRODUCT.name.toLowerCase()}`)}
<h2>3. Verify</h2>
<p>Restart Hermes and say: <i>use the ${PRODUCT.name.toLowerCase()} whoami tool and tell me what it reports</i>.</p>
<h2>How this sits beside Hermes's own memory</h2>
<p>Hermes keeps its built-in <code>MEMORY.md</code> and <code>USER.md</code> files; external memory runs alongside them, never replacing them. Through this MCP connection Hermes gets the full ${PRODUCT.name} memory tool set — save, recall, browse, inspect, correct and delete, listed in full under <a href="#/api/mcp">MCP tools</a> — so memory persists across sessions, machines, and every other connected tool.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Tools missing</b> — restart Hermes after editing <code>config.yaml</code>, and check the YAML indentation.</li>
<li><b>401 unauthorized</b> — the link is revoked or was an API key; create an MCP link in API Keys. Hermes also supports header auth: url <code>${ORIGIN}/mcp</code> with a <code>headers:</code> mapping carrying <code>Authorization: Bearer</code> and an API key.</li>
</ul>
<div class="note">A native ${PRODUCT.name} memory provider for Hermes's external-provider ecosystem is planned — prefetch before each response, background sync after it. The MCP route above stays supported either way.</div>
` };

PAGES["/install/pi"] = { title: "Pi Agent", html: `
<h1>Pi Agent</h1>
<p class="lede">The <b>native extension</b> joins Pi's own lifecycle: relevant memory is recalled before each turn's first model call, and what you decide is captured after the turn settles — the agent never has to choose to look, or remember to write down. The <b>REST route</b> remains as a fallback.</p>
<h2>Route A — native extension (recommended)</h2>
<p>Published on npm as <code>pi-itsuki</code>, built and signed from this repository's GitHub Actions workflow with npm provenance. Zero runtime dependencies. Needs Node 22.19+, Pi's own floor.</p>
${codeBlock(`pi install npm:pi-itsuki`)}
<p>Open <b>API Keys</b>, click <b>Create API key</b>, and copy it — it is shown once. Set it as <code>ITSUKI_API_KEY</code> in your environment and restart pi. The key is read from the environment only: the extension refuses keys placed in config files, and it travels only as an <code>Authorization</code> header.</p>
<div class="note"><b>An API key, not an MCP link.</b> The extension validates the credential's shape before it makes a request, so a <code>${ORIGIN}/mcp/…</code> URL is rejected outright.</div>
${codeBlock(`export ITSUKI_API_KEY=YOUR_MCP_KEY`)}
<p>Then, inside pi:</p>
${codeBlock(`/itsuki status`)}
<p><code>/itsuki doctor</code> shows the connection, spool depth, last receipt, and circuit-breaker state — never the key. <code>/itsuki recall &lt;query&gt;</code> does a one-off lookup, and the model itself gets <code>itsuki_recall</code> and <code>itsuki_save</code> tools. There is deliberately no delete tool: nothing in the extension can destroy memory.</p>
<p>Capture is exactly-once: each settled turn is staged to a durable local spool under a content-derived idempotency key before any network call, so retries, crashes, <code>/resume</code> and <code>/fork</code> cannot double-write — and if Itsuki is unreachable, the turn waits on disk and is delivered later. Recalled memory is injected behind an explicit stored-context-not-instructions label. Every message is scrubbed for credentials locally before it leaves your machine.</p>
<p>Deliberately absent from this extension: in-place editing of a stored memory, multimodal memory, and automatic consolidation.</p>
<div class="note"><b>Editing is absent from the extension, not from the service.</b> Correct a memory from the dashboard or through the API, and every correction keeps an immutable revision you can roll back. See <a href="#/guides/versions">Corrections, history, and rollback</a>.</div>
<h2>Route B — REST fallback</h2>
<p>Pi has no MCP support, so the fallback uses the shell tool Pi already has. Copy the installation prompt from the dashboard's <b>Get started</b> page — choose <b>Pi Agent</b>, then <b>REST fallback</b> — and paste it into Pi. The agent verifies the connection (<code>GET /v1/status</code>), saves a first memory (<code>POST /v1/save</code>), and proves recall (<code>POST /v1/recall</code>) — reporting receipts. Then add the standing instructions from the same tab so recall and save happen every session.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b><code>/itsuki status</code> says the key is not configured</b> — <code>ITSUKI_API_KEY</code> is not visible to the pi process. Set it in the profile of the shell that launches pi, then restart pi.</li>
<li><b>Saves say "queued" rather than "saved"</b> — Itsuki is unreachable or rate-limited; the span is spooled and delivers automatically. <code>/itsuki doctor</code> names the reason.</li>
<li><b>Saves succeed but recall is empty</b> — extraction is asynchronous; allow a few seconds, then recall again.</li>
</ul>
` };

PAGES["/integrations/native"] = { title: "Native packages", html: `
<h1>Native packages</h1>
<p class="lede">Five frameworks can reach ${PRODUCT.name} through their own memory interface instead of MCP: install one package, pass it where the framework expects memory, and the agent gets recall and capture without learning a tool.</p>
<p>These need an <b>API key</b> from <b>API Keys</b> — a server credential, not an MCP link. Every package reads <code>ITSUKI_API_KEY</code> from the environment.</p>
<h2 id="native-agno">Agno</h2>
${codeBlock(`pip install agno-itsuki

from agno.agent import Agent
from agno_itsuki import ItsukiTools

agent = Agent(tools=[ItsukiTools(user_id="alex")])`)}
<p>Model-called memory: the agent decides when to search and when to save.</p>
<h2 id="native-llamaindex">LlamaIndex</h2>
${codeBlock(`pip install llama-index-memory-itsuki

from llama_index.memory.itsuki import itsuki_memory

memory = itsuki_memory(user_id="alex", session_id="thread_9")
response = await agent.run("What am I working on?", memory=memory)`)}
<p>A memory <i>block</i>, so it composes with the rest of LlamaIndex's memory rather than replacing it.</p>
<h2 id="native-camel">CAMEL</h2>
${codeBlock(`pip install camel-itsuki

from camel.memories import ChatHistoryMemory
from camel_itsuki import ItsukiStorage

memory = ChatHistoryMemory(
    context_creator,
    storage=ItsukiStorage(user_id="alex", agent_id="researcher"),
)`)}
<p>Agent history persists to ${PRODUCT.name} and to a local mirror, so a run survives a restart.</p>
<h2 id="native-vercel-ai">Vercel AI SDK</h2>
${codeBlock(`npm install ai-sdk-itsuki

import { openai } from "@ai-sdk/openai";
import { generateText } from "ai";
import { withItsuki } from "ai-sdk-itsuki";

const model = withItsuki(openai("gpt-5.2"), { userId: "alex" });

const { text } = await generateText({
  model,
  prompt: "What am I learning at the moment?",
});`)}
<p>A middleware around the model, so recall and capture ride along with every call.</p>
<h2 id="native-mastra">Mastra</h2>
${codeBlock(`npm install mastra-itsuki

import { Agent } from "@mastra/core/agent";
import { createItsuki } from "mastra-itsuki";

const itsuki = createItsuki({ defaultUserId: "alex" });

const agent = new Agent({
  id: "support",
  model: "openai/gpt-5.2",
  instructions: "You help customers.",
  inputProcessors: [itsuki.recall],
  outputProcessors: [itsuki.capture],
  tools: itsuki.tools,
});`)}
<p>Recall on the way in, capture on the way out, plus the tools for when the model should decide.</p>
<h2 id="native-notes">What to expect</h2>
<ul>
<li><b>Writes are asynchronous.</b> A save is accepted immediately and finishes processing in the background, so a recall issued in the same breath may not see it yet.</li>
<li><b>Every write is scoped to one end user.</b> <code>user_id</code> selects an isolated memory space; there is no shared default.</li>
<li><b>Deleting by source is exact.</b> Pass the same <code>source</code> you wrote with, and only those memories go.</li>
</ul>
<div class="note">Every package on this page was published with signed build provenance and exercised against <code>${ORIGIN}</code> from its registry bytes — installed from PyPI or npm, run against production, and cleaned up to zero.</div>
` };

PAGES["/integrations/python"] = { title: "Python frameworks", html: `
<h1>Python frameworks</h1>
<p class="lede">One MCP endpoint, every framework's own client. Each shape below is taken from that framework's current documentation — connect once and your agent gets save, recall, list, get, delete, and whoami as tools.</p>
<p>Every route needs an <b>MCP link</b> from <b>API Keys</b> (shown once). The URL or header carrying it is a credential — treat the file that holds it as a secret.</p>
<h2 id="langchain">LangChain &amp; LangGraph</h2>
${codeBlock(`pip install langchain-mcp-adapters

from langchain_mcp_adapters.client import MultiServerMCPClient

client = MultiServerMCPClient({
    "itsuki": {
        "transport": "http",
        "url": "${ORIGIN}/mcp",
        "headers": {"Authorization": "Bearer YOUR_MCP_KEY"},
    }
})
tools = await client.get_tools()  # hand these to your LangGraph agent`)}
<h2 id="crewai">CrewAI</h2>
<p>The MCP support lives in an extra — install <code>crewai-tools[mcp]</code>, not plain <code>crewai-tools</code>, or <code>MCPServerAdapter</code> will not be exported.</p>
${codeBlock(`pip install "crewai-tools[mcp]"

from crewai_tools import MCPServerAdapter

server_params = {
    "url": "${ORIGIN}/mcp",
    "transport": "streamable-http",
    "headers": {"Authorization": "Bearer YOUR_MCP_KEY"},
}

with MCPServerAdapter(server_params) as tools:
    agent = Agent(tools=tools, role="...", goal="...")`)}
<h2 id="autogen">AutoGen</h2>
${codeBlock(`pip install autogen-ext

from autogen_ext.tools.mcp import StreamableHttpServerParams, mcp_server_tools

params = StreamableHttpServerParams(
    url="${ORIGIN}/mcp",
    headers={"Authorization": "Bearer YOUR_MCP_KEY"},
)
tools = await mcp_server_tools(params)`)}
<h2 id="agno">Agno</h2>
${codeBlock(`pip install agno

from agno.tools.mcp import MCPTools, StreamableHTTPClientParams

params = StreamableHTTPClientParams(
    url="${ORIGIN}/mcp",
    headers={"Authorization": "Bearer YOUR_MCP_KEY"},
)
async with MCPTools(transport="streamable-http", server_params=params) as mcp:
    agent = Agent(tools=[mcp])`)}
<h2 id="openai-agents">OpenAI Agents SDK</h2>
${codeBlock(`pip install openai-agents

from agents.mcp import MCPServerStreamableHttp

async with MCPServerStreamableHttp(
    name="itsuki",
    params={
        "url": "${ORIGIN}/mcp",
        "headers": {"Authorization": "Bearer YOUR_MCP_KEY"},
    },
    cache_tools_list=True,
) as server:
    agent = Agent(name="Assistant", mcp_servers=[server])`)}
<h2 id="google-adk">Google ADK</h2>
<p>A native <code>BaseMemoryService</code> plus the automatic capture ADK does not ship. Needs <code>google-adk</code> 2.5–2.7.</p>
${codeBlock(`pip install adk-itsuki

from google.adk.agents import LlmAgent
from google.adk.apps.app import App
from google.adk.runners import Runner
from google.adk.sessions import InMemorySessionService
from google.adk.tools import preload_memory
from adk_itsuki import ItsukiMemoryService, ItsukiMemoryPlugin

memory = ItsukiMemoryService()          # reads ITSUKI_API_KEY
agent = LlmAgent(name="assistant", model="gemini-2.0-flash", tools=[preload_memory])

app = App(name="my_app", root_agent=agent, plugins=[ItsukiMemoryPlugin(service=memory)])
runner = Runner(app=app, app_name="my_app",
                session_service=InMemorySessionService(), memory_service=memory)`)}
<p><code>preload_memory</code> recalls before every model call; the plugin captures each settled turn. ADK itself never calls <code>add_session_to_memory</code> — that gap is exactly what the plugin fills. Only your message and the <i>root</i> agent's final answer are stored: tool traffic and sub-agent output are excluded, and an invocation that errored, streamed only partials, or is still waiting on a long-running tool is not captured at all.</p>
<p>Registering the URI scheme (<code>import adk_itsuki; adk_itsuki.register()</code> in a <code>services.py</code>) lets <code>adk web --memory_service_uri=itsuki://</code> construct the service, but it cannot attach the tool or the plugin — treat that route as a partial install. Pending captures live in memory, so recovery after a restart is an explicit <code>add_session_to_memory(session)</code>, which regenerates identical idempotency keys and therefore duplicates nothing.</p>
<h3>MCP route</h3>
${codeBlock(`pip install google-adk

from google.adk.tools.mcp_tool import McpToolset
from google.adk.tools.mcp_tool.mcp_session_manager import StreamableHTTPConnectionParams

toolset = McpToolset(
    connection_params=StreamableHTTPConnectionParams(
        url="${ORIGIN}/mcp",
        headers={"Authorization": "Bearer YOUR_MCP_KEY"},
    )
)`)}
<h2 id="llamaindex">LlamaIndex</h2>
<p>LlamaIndex's MCP client documents OAuth but <b>no custom headers</b> — a header-only memory service cannot connect there at all. ${PRODUCT.name}'s path-token door carries the credential in the URL itself, so <code>BasicMCPClient</code> works as-is:</p>
${codeBlock(`pip install llama-index-tools-mcp

from llama_index.tools.mcp import BasicMCPClient, McpToolSpec

client = BasicMCPClient("${ORIGIN}/mcp/YOUR_MCP_KEY")
tools = McpToolSpec(client=client)`)}
<h2>Verify any of them</h2>
<p>Run the agent and ask it to <i>"save that I prefer concise answers, then recall what you know about me"</i>. A working connection reports a receipt for the save and returns the fact on recall. The <code>whoami</code> tool reports identity and health at any time.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Tools don't appear</b> — confirm the URL is exactly <code>${ORIGIN}/mcp</code> (header route) and the header reads <code>Authorization: Bearer &lt;key&gt;</code>.</li>
<li><b>401</b> — the key is revoked or pasted with whitespace. Create a fresh MCP link.</li>
<li><b>Saves report queued, recall is empty</b> — extraction is asynchronous; allow a few seconds.</li>
<li><b>Import errors mentioning <code>mcp.shared</code>, <code>RequestContext</code>, or "not enough values to unpack"</b> — several framework adapters still target the <code>mcp 1.x</code> Python API and break against <code>mcp 2.x</code>. This is an upstream clash that affects every MCP server, not just ${PRODUCT.name}. AutoGen and Agno both need <code>pip install "mcp&lt;2"</code>; LlamaIndex additionally needs <code>pip install "llama-index-tools-mcp==0.4.0"</code>. These are the exact versions each route above was verified against.</li>
</ul>
<div class="note">Every route on this page was executed end to end against <code>${ORIGIN}</code> — tools listed and called with a real key — not transcribed from a vendor's README.</div>
` };

PAGES["/integrations/typescript"] = { title: "TypeScript frameworks", html: `
<h1>TypeScript frameworks</h1>
<p class="lede">Pick the route your stack actually wants — middleware, processors, MCP tools, or the SDK — and leave with the page that builds it.</p>

${prereq([
	`A credential. The native packages and the SDK want an <b>API key</b>: <b>API Keys</b> → <b>Create API key</b>. The MCP route wants an <b>MCP link</b>: <b>Get started</b> → your client → <b>Create link</b>. Both are shown once. See <a href="#/api/auth">Authentication &amp; keys</a>.`,
	`Node 22 or newer for <code>ai-sdk-itsuki</code>, 22.13.0 or newer for <code>mastra-itsuki</code>, 18 or newer for the <code>${PRODUCT.pkg}</code> SDK. All three are ESM-only — there is no CommonJS build.`,
	`The framework already in your project: <code>ai</code> 7.x for <code>ai-sdk-itsuki</code>, or <code>@mastra/core</code> 1.59.0 or newer (below 2.0.0) for <code>mastra-itsuki</code>.`,
])}

<h2>Who decides that memory happens</h2>
<p>Every route below writes into the same memory and reads the same index. What differs is who decides a given turn should be remembered — and that one answer eliminates most of the list for you.</p>
<ul>
<li><b>The framework's lifecycle decides.</b> The native packages hook the framework's own before-and-after points, so recall goes in ahead of the model and capture happens once the answer has settled. The model never has to choose to remember.</li>
<li><b>The model decides.</b> Over MCP, memory is a set of tools the model may or may not call. A connected server is not proof of a save, and an agent that never calls <code>recall_memory</code> answers from nothing.</li>
<li><b>Your code decides.</b> The SDK is the REST API with types on it. Nothing happens that you did not call.</li>
</ul>

<h2>The four routes</h2>
<table>
<tr><th>Route</th><th>What it is</th><th>Pick it when</th><th>Page</th></tr>
<tr>
	<td><code>ai-sdk-itsuki</code></td>
	<td>Middleware wrapped around the model you already build with. Relevant memory is added as a system block before the call; the settled exchange is captured after it. Not a provider — your model id, provider SDK and provider keys are untouched.</td>
	<td>You build on the Vercel AI SDK and want memory on every call without a tool round trip.</td>
	<td><a href="#/integrations/vercel-ai">Vercel AI SDK</a></td>
</tr>
<tr>
	<td><code>mastra-itsuki</code></td>
	<td>Two Mastra processors — <code>itsuki.recall</code> on input, <code>itsuki.capture</code> on output — plus typed tools (<code>itsuki-search-memory</code>, <code>itsuki-save-memory</code>, <code>itsuki-list-memories</code>, <code>itsuki-get-memory</code>) for when the model should decide.</td>
	<td>You build Mastra agents and want the run's own <code>resource</code> and <code>thread</code> to select the memory space for you.</td>
	<td><a href="#/integrations/mastra">Mastra</a></td>
</tr>
<tr>
	<td>MCP</td>
	<td>Eight tools over Streamable HTTP — <code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code>, <code>list_memories</code>, <code>get_memory</code>, <code>delete_memory</code>, <code>delete_all_memories</code>, <code>whoami</code> — reached through whatever MCP client your framework already ships.</td>
	<td>Your framework speaks MCP and you are happy with one memory space per credential. This is the route for a personal assistant, not a multi-tenant app.</td>
	<td><a href="#/api/mcp">MCP tools</a></td>
</tr>
<tr>
	<td><code>${PRODUCT.pkg}</code> (npm)</td>
	<td>A typed client for the REST API: <code>add</code>, <code>search</code>, <code>turn</code>, <code>ingest</code>, plus <code>update</code>, <code>history</code>, <code>rollback</code>, <code>delete</code>, and <code>waitFor</code> for polling a write until it settles.</td>
	<td>You own the loop, your framework is not on this list, or you are calling memory from a backend rather than an agent.</td>
	<td><a href="#/sdk/js">JavaScript SDK</a></td>
</tr>
</table>

<h2>Credential, runtime, peer</h2>
<table>
<tr><th>Route</th><th>Credential</th><th>Node</th><th>Peer dependency</th></tr>
<tr><td><code>ai-sdk-itsuki</code></td><td>API key, read from <code>ITSUKI_API_KEY</code> in your server environment</td><td>22 or newer</td><td><code>ai</code> 7.x</td></tr>
<tr><td><code>mastra-itsuki</code></td><td>API key, read from <code>ITSUKI_API_KEY</code></td><td>22.13.0 or newer</td><td><code>@mastra/core</code> 1.59.0 or newer, below 2.0.0; <code>zod</code> 3.25 or 4</td></tr>
<tr><td>MCP</td><td>MCP link in the URL, or either credential in an <code>Authorization: Bearer</code> header at <code>${ORIGIN}/mcp</code></td><td>whatever your MCP client requires</td><td>your framework's own MCP client</td></tr>
<tr><td><code>${PRODUCT.pkg}</code> (npm)</td><td>API key passed to the constructor — the SDK reads no environment variable of its own</td><td>18 or newer</td><td>none</td></tr>
</table>

<div class="note"><b>Zero runtime dependencies, all three.</b> Neither native package bundles a provider SDK. <code>ai-sdk-itsuki</code> additionally uses no Node built-ins, so it runs on Node, edge and Workers alike; the <code>${PRODUCT.pkg}</code> SDK uses <code>node:crypto</code> and needs a Node-compatible runtime.</div>

<h2>Who the memory belongs to</h2>
<p>This is the constraint that most often settles the choice before anything else does. Read the last column first.</p>
<table>
<tr><th>Route</th><th>How the memory space is chosen</th><th>Serves many end users?</th></tr>
<tr><td><code>ai-sdk-itsuki</code></td><td><code>userId</code> is required and has no default. One wrapped model still serves many people: override per call through the AI SDK's <code>providerOptions.itsuki</code> channel, which comes from your server code and is stripped before the provider sees it.</td><td>Yes</td></tr>
<tr><td><code>mastra-itsuki</code></td><td>The run's <code>resource</code> becomes the memory space and <code>thread</code> becomes the de-duplication anchor. <code>defaultUserId</code> covers runs carrying neither. With no identity at all the adapter <b>skips</b> rather than guessing.</td><td>Yes</td></tr>
<tr><td>MCP</td><td>Fixed by the credential. <b>No memory tool takes a user id</b>, deliberately: every tool argument is written by a model that has just read text somebody else wrote.</td><td>No — one link, one memory space</td></tr>
<tr><td><code>${PRODUCT.pkg}</code> (npm)</td><td><code>userId</code> per call, or a default on the client. Passing <code>null</code> explicitly selects the key owner's own space even when the client carries a default.</td><td>Yes</td></tr>
</table>

<h2>Check the credential before you wire anything</h2>
<p>All four routes authenticate against the same door underneath, so one file settles whether what is in your environment works — no install, no framework. It works with an API key or an MCP link, because an MCP credential sent as a Bearer header authenticates anywhere an API key does.</p>

${codeBlock(`// check.mjs
const res = await fetch("${ORIGIN}/v1/status", {
  headers: { authorization: "Bearer " + process.env.ITSUKI_API_KEY },
});
console.log(res.status, await res.json());`, "check.mjs")}

${codeBlock(`node check.mjs`, "terminal")}

${outputBlock(`200 {
  nodes: 3,
  pages: 2,
  slices: 4,
  events: 11,
  candidates: 0,
  lastCheckpoint: null
}`, "Terminal output")}

<p>You should see <code>200</code> and six live counts. Those numbers are the memory space the credential resolves to — if they are all zero on an account you know has memories, you are holding a key for a different project. A <code>401</code> here means no route on this page will work, and it is worth fixing before you install anything.</p>

<h2>What every route does the same way</h2>
<ul>
<li><b>Writes are asynchronous.</b> A save is accepted immediately and finishes processing in the background, so a recall issued in the same second may not see it yet. This trips up every hand-test.</li>
<li><b>The server's ingest ceilings are the same everywhere:</b> 30 messages per call, 4,000 characters per message, 120,000 characters total, 512 KB per request.</li>
<li><b>Writes are rate limited.</b> A <code>429</code> carries <code>Retry-After</code>; the native packages honour it exactly, inside the call's own time budget. A sustained burst still needs backpressure on your side.</li>
<li><b>Recalled memory arrives fenced.</b> The native packages inject it between <code>&lt;itsuki-recalled-context-v1&gt;</code> markers behind a preamble labelling it as stored context, not instructions — the prompt-injection boundary for anything a previous session wrote.</li>
<li><b>Server-side only.</b> A key in a browser bundle is a published key, and <code>ai-sdk-itsuki</code> refuses to construct where both <code>window</code> and <code>document</code> exist.</li>
</ul>

<h2>TypeScript that is not a library</h2>
<p>Three more integrations are written in TypeScript but are installed into a host rather than imported into your code, so they are not on the table above:</p>
<ul>
<li><a href="#/integrations/n8n">n8n</a> — <code>n8n-nodes-itsuki</code> is a community node installed from <b>Settings</b> → <b>Community Nodes</b> on self-hosted n8n, not with <code>npm install</code>.</li>
<li><a href="#/install/opencode">OpenCode</a>, <a href="#/install/antigravity">Antigravity</a> and <a href="#/install/openclaw">OpenClaw</a> — packages that plug into a coding agent or agent runtime and give it memory, with no code of yours involved.</li>
<li><a href="#/integrations/convex">Convex</a> — not a separate integration at all, but the <code>${PRODUCT.pkg}</code> SDK running inside a Convex backend, exposed as two actions.</li>
</ul>

<h2>When the route is wrong</h2>
<table>
<tr><th>What you see</th><th>What went wrong</th><th>Fix</th></tr>
<tr><td><code>401</code> reading <i>"That is an API key, not an MCP link."</i></td><td>You took the MCP route and pasted an API key into the URL path. Only MCP links go in a URL.</td><td>Send API keys as <code>Authorization: Bearer</code> to <code>${ORIGIN}/mcp</code>, or create an MCP link from <b>Get started</b>.</td></tr>
<tr><td><code>401 unauthorized</code> when the credential looks correct</td><td>The whole <code>https://…</code> MCP link went into a Bearer header. The credential is the last path segment, not the URL.</td><td>Send only the <code>${PRODUCT.tokenPrefix}…</code> segment in the header.</td></tr>
<tr><td>A throw at construction, before any model call</td><td><code>ITSUKI_API_KEY</code> is missing or does not match the key shape. Both native packages resolve their config eagerly, on purpose — bad config fails where you can see it.</td><td>Set the variable in the <b>server</b> environment; keys start <code>${PRODUCT.tokenPrefix}</code>.</td></tr>
<tr><td>A throw the moment the module loads in browser code</td><td><code>ai-sdk-itsuki</code> refuses to run in a browser.</td><td>Wrap the model on your server. Never ship the key to a client.</td></tr>
<tr><td><code>npm ERR! ERESOLVE</code> or a peer dependency warning</td><td>A version floor. These are host floors, not package versions.</td><td>Check your <code>ai</code> or <code>@mastra/core</code> version against the runtime table above.</td></tr>
<tr><td><code>count: 0</code> and an empty <code>context</code> right after a save</td><td>Extraction had not settled yet. This is a working save, not a failed one.</td><td>Allow a few seconds, or poll with the SDK's <code>waitFor</code>.</td></tr>
</table>

${nextSteps([
	["#/api/auth", "Authentication & keys", "Which credential each route wants, and what happens when you swap them."],
	["#/concepts/scope", "Who memory belongs to", "What a userId actually keys, and how project scope narrows a recall."],
	["#/integrations/python", "Python frameworks", "The same decision, answered on the Python side."],
	["#/quickstart", "Quickstart", "Save and recall from the command line before wiring a framework."],
])}
` };

PAGES["/integrations/n8n"] = { title: "n8n", html: `
<h1>n8n</h1>
<p class="lede">Three routes. The <b>native Itsuki node</b> is a real installable package with typed operations and a credential — self-hosted n8n only. The <b>HTTP Request node</b> and <b>MCP Client Tool</b> are built into n8n, need no install, and work on n8n Cloud too.</p>
<h2 id="native">Route A — native Itsuki node (self-hosted)</h2>
<p>Published on npm as <code>n8n-nodes-itsuki</code>, built and signed from this repository's GitHub Actions workflow with npm provenance. Install it in n8n under <b>Settings → Community Nodes → Install</b>; only instance owners can install community nodes, and n8n Cloud carries only nodes n8n has verified, so Cloud users should use Route B or C below.</p>
${codeBlock(`n8n-nodes-itsuki`)}
<p>Then create an <b>Itsuki API</b> credential (API key from <b>API Keys</b> in the dashboard, base URL <code>${ORIGIN}</code>) and press <b>Test</b> — it verifies the connection against an endpoint that returns counts only, never memory content. The key travels as a header and is never written into workflow exports.</p>
<p>The node exposes twelve operations:</p>
<ul>
<li><b>Save Memory</b> and <b>Save Conversation</b> — store a durable fact, or a batch of chat messages for extraction. Both <b>wait for completion by default</b>, so the next node sees settled state; if the wait times out the output says the save was accepted and is still processing, which is not a failure.</li>
<li><b>Recall Memory</b> — prompt-ready context plus structured items. Zero results is a result, not an error.</li>
<li><b>List Memories</b> — one page, or Return All with a hard item cap and pagination-loop detection.</li>
<li><b>Get Memory</b> · <b>Delete Memory</b> — by prefixed ID. A missing ID is reported as an error, never as a silent success.</li>
<li><b>Delete All Memories</b> — <b>previews by default</b>; it reports what would be removed and changes nothing until you tick Confirm Destruction.</li>
<li><b>Who Am I</b> — identity, project scope, connection health and current write counts.</li>
<li><b>Update Memory</b> — correct one memory with optimistic concurrency. It needs the revision you read, so a stale edit is refused rather than silently overwriting a newer one.</li>
<li><b>Memory History</b> — one memory's bounded revision history, newest first.</li>
<li><b>Rollback Memory</b> — restore an earlier revision as a new forward revision. History is never rewound.</li>
<li><b>Wait for Packet</b> — poll a save receipt to a terminal state on its own.</li>
</ul>
<p>The node is usable as an AI Agent tool. On self-hosted n8n that additionally requires <code>N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true</code>. Recall and the save operations are the sensible tools to expose; destructive operations are deliberately unattractive as tools, since Delete All previews unless a human enables confirmation.</p>
<p>To correct a memory, use <b>Update Memory</b> rather than deleting and re-saving. An update keeps the previous wording as an immutable revision you can read with <b>Memory History</b> and restore with <b>Rollback Memory</b>; deleting destroys that history instead. See <a href="#/guides/versions">Corrections, history, and rollback</a>.</p>
<h2 id="http">Route B — HTTP Request node (any workflow, incl. Cloud)</h2>
<p>The deterministic route: "form submitted → save to memory", "nightly digest → recall". Create an <b>MCP link</b> — open <b>Get started</b>, pick your client, and click <b>Create link</b> — which doubles as a REST Bearer credential.</p>
${codeBlock(`Node: HTTP Request
Method: POST
URL: ${ORIGIN}/v1/save
Authentication: Generic Credential Type -> Header Auth
  Name: authorization    Value: Bearer YOUR_MCP_KEY
Body (JSON): { "content": "{{ $json.textToRemember }}" }`)}
<p>Recall is the same node against <code>${ORIGIN}/v1/recall</code> with <code>{ "query": "..." }</code> — the response's <code>context</code> field is prompt-ready. Saves return a <b>receipt</b>; extraction finishes asynchronously.</p>
<h2 id="mcp">Route C — MCP Client Tool (AI Agent workflows, incl. Cloud)</h2>
${codeBlock(`Node: MCP Client Tool  (attach to an AI Agent node)
Endpoint: ${ORIGIN}/mcp
Server Transport: HTTP Streamable
Authentication: Bearer -> YOUR_MCP_KEY`)}
<p>The agent then decides when to call <code>save_memory</code> / <code>recall_memory</code> / <code>list_memories</code> itself.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>429 with retry-after</b> — the workflow is bursting past a rate bucket; add a Wait node honouring the header. Bulk imports belong on <code>POST /v1/ingest</code> (300/min).</li>
<li><b>Credential test fails</b> — the header name must be exactly <code>authorization</code> and the value must start with <code>Bearer </code>.</li>
</ul>
` };

PAGES["/integrations/dify"] = { title: "Dify", html: `
<h1>Dify</h1>
<p class="lede">By the end, a Dify app whose agent saves and recalls ${PRODUCT.name} memory through Dify's built-in MCP client — no plugin to install, no marketplace listing, no review.</p>

${prereq([
	`A Dify workspace on a version whose <b>Tools</b> section includes <b>MCP</b>, and the permission to add a tool provider in it. <a href="https://docs.dify.ai" target="_blank" rel="noopener">Dify's own documentation</a> is the authority for where that screen sits in your version — the field labels below have moved between releases.`,
	`An ${PRODUCT.name} project role that can create keys. Where yours cannot, the <b>Create link</b> button is replaced by the sentence <i>"Your role cannot create project keys."</i> — see <a href="#/guides/projects">Projects &amp; teams</a>.`,
	`A terminal with <code>curl</code> for step 2, so you find out a credential is wrong before Dify does.`,
])}

<h2>Connect</h2>
<ol class="steps">
<li><b>Create the MCP link.</b><p>In the ${PRODUCT.name} app, open <b>Get started</b>, choose <b>Dify</b>, and click <b>Create link</b>. The value is shown once and only a hash is kept on the server, so copy it before you leave the page — a lost link is replaced, never recovered.</p></li>

<li><b>Prove the credential before Dify sees it.</b><p>An MCP link also authenticates REST calls in an <code>Authorization</code> header, so one request tells you the key is live and which memory space it opens.</p>
${codeBlock(`curl -H "authorization: Bearer YOUR_MCP_KEY" ${ORIGIN}/v1/status`, "terminal")}
${outputBlock(`{
  "nodes": 9,
  "pages": 3,
  "slices": 14,
  "events": 4,
  "candidates": 0,
  "lastCheckpoint": null
}`)}
<p>Counts only — this endpoint returns no memory content. A <code>401</code> here means the link is wrong, revoked, or was never copied whole; fix it now rather than inside Dify, where the failure arrives as a connection error with less to go on.</p></li>

<li><b>Add the MCP server in Dify.</b><p>Dify's MCP client speaks HTTP transport, which is exactly what ${PRODUCT.name} serves at this URL (Streamable HTTP). Point it at the header door and put the credential in a custom header.</p>
${codeBlock(`Dify -> Tools -> MCP -> Add server (HTTP transport)
Server URL: ${ORIGIN}/mcp
Headers: authorization = Bearer YOUR_MCP_KEY`, "dify config")}
<p>The header name must be exactly <code>authorization</code> and the value must begin with <code>Bearer</code> and a space. That door accepts either credential type — an API key works there too.</p></li>

<li><b>Or put the credential in the URL, if the form has no header field.</b><p>Same server, second door: the whole URL is the credential, so nothing else needs configuring.</p>
${codeBlock(`${ORIGIN}/mcp/YOUR_MCP_KEY`, "MCP server URL")}
<p>This door accepts <b>MCP links only</b>. An API key pasted here is refused by name rather than with a bare failure — see the troubleshooting table. Treat the URL exactly as you would a password: anyone holding it holds the memory space.</p></li>

<li><b>Let Dify import the tools.</b><p>On a successful connect Dify reads the server's tool list and shows the tools it found. You should see <code>recall_memory</code>, <code>save_memory</code>, <code>save_conversation</code>, <code>list_memories</code>, <code>get_memory</code> and <code>whoami</code> at minimum. If the list is empty, the connection did not authenticate.</p></li>

<li><b>Enable the tools on the app that needs them.</b><p>Importing a server does not arm it. Enable the tools for the specific app under its <b>Agent</b> settings — an app with no tool enabled will answer confidently with no memory at all and never tell you why.</p></li>

<li><b>Tell the agent when to call them.</b><p>The host model decides <i>when</i> a tool runs; ${PRODUCT.name} cannot force it. Put the policy in the app's instructions — for example: call <code>recall_memory</code> once at the start of a conversation, and call <code>save_memory</code> the moment the user states one durable fact. If you need a guaranteed call on every turn, drive <code>POST /v1/turn</code> from your own code instead.</p></li>
</ol>

<h2>What Dify imports</h2>
<table>
<tr><th>Tool</th><th>What it does in a Dify app</th></tr>
<tr><td><code>recall_memory</code></td><td>The tool's text result <i>is</i> the recalled context, prefixed <i>Relevant memory for this user:</i> — the model can use it directly with no post-processing.</td></tr>
<tr><td><code>save_memory</code></td><td>One durable fact in the user's words. Optional <code>recentContext</code> resolves references like "it"; that context is not itself memorized.</td></tr>
<tr><td><code>save_conversation</code></td><td>Several turns at once, oldest first. A stable <code>conversationId</code> converges re-sends onto one Conversation page instead of making a new one each time.</td></tr>
<tr><td><code>list_memories</code> · <code>get_memory</code></td><td>Browse newest-first, then fetch one object by id with its history and dated events.</td></tr>
<tr><td><code>update_memory</code> · <code>memory_history</code> · <code>rollback_memory</code></td><td>Correct a memory against the exact revision you read. A stale revision is refused with the fresh one, never overwritten.</td></tr>
<tr><td><code>delete_memory</code> · <code>delete_all_memories</code></td><td>Deletion. <code>delete_all_memories</code> previews and destroys nothing without <code>confirm: true</code>.</td></tr>
<tr><td><code>whoami</code></td><td>Identity, scopes, bound project and live counts. This is the verification step below.</td></tr>
</table>

<div class="note"><b>The imported list is not fixed — it is what your credential can do.</b> Write tools are advertised only to a connection that holds <code>memory:write</code>, and the delete tools only when the credential's current project role permits deletion. A read-only link therefore imports a shorter list <i>by design</i>, so a missing <code>save_memory</code> in Dify is a scope answer, not a bug. Full inputs for every tool: <a href="#/api/mcp">MCP tools</a>.</div>

<h2>One link is one memory space</h2>
<p>MCP tools carry no end-user parameter. Ownership is derived from the authenticated connection, so every visitor to a Dify app wired to one link reads and writes <b>the same</b> memory. That is right for a personal assistant and wrong for a multi-tenant product.</p>
<p>To give each of your own end users an isolated space, reach the REST API directly — from Dify's HTTP request node, or a custom tool — and pass <code>userId</code> on each call. The value is hashed with your account before it becomes a storage key, and nothing saved under one value is reachable from another. See <a href="#/api/rest">REST API</a> and <a href="#/concepts/scope">Scope &amp; isolation</a>.</p>

<h2>Verify</h2>
<p>Chat with the app and ask for identity first, because it is the one check that cannot half-succeed:</p>
${codeBlock(`call whoami`, "say this")}
${outputBlock(`Connected to Itsuki memory (server 0.7.0). Project: Default project. Scopes: memory:read, memory:write. Stored: 12 memories (9 facts, 3 pages), 4 events, 0 pending candidates.`, "Tool result")}

<p>Then write and read back in the same conversation:</p>
${codeBlock(`remember that I prefer morning meetings, then recall what you know about me`, "say this")}
${outputBlock(`Saved: 1 page, 1 node (Morning meetings).`, "save_memory result")}
${outputBlock(`Relevant memory for this user:

Morning meetings — preference
- prefers morning meetings`, "recall_memory result")}

<p>The save must report a receipt line like the one above. A save with no receipt is not a save, and the server instructions tell the model never to claim otherwise — if the app says "saved" while the tool returned nothing, the model is narrating, not reporting.</p>

<h2>When it doesn't work</h2>
<table>
<tr><th>What you see</th><th>What it means</th><th>Fix</th></tr>
<tr><td><code>No credential. Authorize with OAuth, send Authorization: Bearer &lt;your API key&gt; to /mcp, or connect an MCP link URL.</code></td><td>The request reached the server with nothing to authenticate. The header was never sent, was renamed, or was dropped by a proxy.</td><td>Check the header name is exactly <code>authorization</code> and the value starts with <code>Bearer</code> and a space. If the form will not carry headers, use the URL form from step 4.</td></tr>
<tr><td><code>That key is revoked or not valid. Create one at https://itsuki.app under API keys, then configure it in your client (Claude plugin users: use /plugin).</code></td><td>The credential arrived and does not resolve — deleted, mistyped, or truncated on copy.</td><td>Create a fresh link in <b>Get started</b> and re-run the step 2 curl before pasting it back into Dify.</td></tr>
<tr><td><code>That is an API key, not an MCP link. API keys authenticate at POST /mcp with an 'Authorization: Bearer &lt;key&gt;' header — only MCP links (created as MCP in the app) go in the URL.</code></td><td>An API key was pasted into the URL form. The two credential types are the same shape, so this is invisible by eye.</td><td>Either create an MCP link, or keep the key and use the header door at <code>${ORIGIN}/mcp</code>.</td></tr>
<tr><td><code>That MCP link is revoked, expired, or not an MCP token.</code></td><td>The last path segment of the server URL is not a live MCP link.</td><td>Re-copy the whole URL. A link truncated mid-token fails exactly like a revoked one.</td></tr>
<tr><td>Dify starts an OAuth flow instead of using your header</td><td>${PRODUCT.name} publishes OAuth discovery and dynamic client registration, and an unauthenticated <code>/mcp</code> answers with a <code>WWW-Authenticate</code> challenge pointing at its resource metadata — so a client that prefers OAuth will find it.</td><td>Either complete the flow in a browser while signed in to ${PRODUCT.name} and approve the scopes, or supply the credential explicitly with the header or URL form above.</td></tr>
<tr><td>Tools imported, never called</td><td>Two separate causes: the tools are not enabled for that app, or the model saw no reason to call them.</td><td>Enable them under the app's Agent settings, then state the recall-and-save policy in the app's instructions.</td></tr>
<tr><td><code>You're sending requests very quickly — wait a few seconds and try again.</code></td><td>An MCP rate bucket tripped. This arrives as a <b>tool result</b> the model may relay in chat, not as an HTTP 429, so it can look like a refusal to save.</td><td>Retry after about a minute. Bulk loading belongs on <code>POST /v1/ingest</code>, not on an agent loop — see <a href="#/api/limits">Rate limits</a>.</td></tr>
<tr><td><code>Saved: 0. Reason: nothing durable here (chatter, a question, or a duplicate).</code></td><td>The save worked and stored nothing. Questions, small talk and re-saves of known facts are dropped on purpose.</td><td>Nothing. Save a fact that would still be true next month and the receipt changes.</td></tr>
</table>

<h2>Where to go next</h2>
${nextSteps([
	["#/api/mcp", "MCP tools", "Every tool Dify imports, with its exact inputs and guarantees."],
	["#/api/auth", "Authentication & keys", "MCP links versus API keys, and which door accepts which."],
	["#/api/rest", "REST API", "The per-end-user door MCP does not have: userId on every call."],
	["#/guides/rules", "Rules", "Decide what an agent is allowed to write into memory at all."],
])}
` };

PAGES["/integrations/convex"] = { title: "Convex", html: `
<h1>Convex</h1>
<p class="lede">Not an MCP integration — the published <code>itsuki</code> npm SDK running inside your Convex backend. Memory becomes two Convex actions any client or function can call.</p>
<h2>1. Install</h2>
${codeBlock(`npm install itsuki convex`)}
<h2>2. Create an API key</h2>
<p>In <b>API Keys</b>, create an <b>API key</b> and set it in your Convex deployment environment as <code>ITSUKI_API_KEY</code>. Server-side only — never in client code.</p>
<h2>3. Write the memory actions</h2>
${codeBlock(`// convex/memory.ts
import { MemoryClient } from "itsuki";
import { action } from "./_generated/server";
import { v } from "convex/values";

const memory = new MemoryClient({ apiKey: process.env.ITSUKI_API_KEY! });

export const remember = action({
  args: { content: v.string(), userId: v.string() },
  handler: async (_ctx, args) => memory.add(args.content, { userId: args.userId }),
});

export const recall = action({
  args: { query: v.string(), userId: v.string() },
  handler: async (_ctx, args) => memory.search(args.query, { userId: args.userId }),
});`)}
<p><code>userId</code> scopes each end user to an isolated memory space under your one key — the same sub-tenant model as the <a href="#/sdk/js">JavaScript SDK</a>, because it IS the JavaScript SDK.</p>
<h2>Verify</h2>
${codeBlock(`npx convex run memory:remember '{ "content": "Prefers dark mode", "userId": "user_1" }'
npx convex run memory:recall '{ "query": "preferences", "userId": "user_1" }'`)}
<p>The first call returns a receipt; the second returns the fact in <code>context</code> after extraction settles.</p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Missing API key</b> — set <code>ITSUKI_API_KEY</code> with <code>npx convex env set</code>, then redeploy.</li>
<li><b>Recall empty right after save</b> — extraction is asynchronous; allow a few seconds.</li>
</ul>
` };

PAGES["/api/rest"] = { title: "REST API reference", html: `
<h1>REST API reference</h1>
<p class="lede">Base URL: <code>${ORIGIN}</code> · JSON in, JSON out · Bearer auth.</p>
<h2>The two calls that matter</h2>
<h3>POST /v1/save — write memory</h3>
${codeBlock(`POST /v1/save
{ "content": "I started learning Kotlin this week." }

// or conversation mode:
{ "mode": "conversation",
  "conversationId": "chat-42",
  "messages": [
    { "role": "user", "content": "We decided on Postgres for the new service." },
    { "role": "assistant", "content": "Noted — Postgres it is." }
  ] }`)}
<p>Returns a <b>receipt</b>: <code>summary</code>, counts of what was written/updated/skipped, and a <code>receipt_id</code>. Extraction is asynchronous — allow a few seconds before recalling brand-new facts.</p>
<h3>POST /v1/recall — read memory</h3>
${codeBlock(`POST /v1/recall
{ "query": "what am I learning?" }

// one coding project plus account-global memory:
{ "query": "how does this project deploy?",
  "memoryScope": { "projectId": "atlas", "projectName": "Atlas" },
  "recallScope": "project_then_global" }

// response (abridged)
{ "count": 2,
  "context": "Kotlin (skill, state: active) - started learning this week…",
  "items": [ { "type": "node", "label": "Kotlin", "score": 7.9 } ] }`)}
<p><code>context</code> is the compact text block a connected AI receives. Empty string + <code>count: 0</code> means nothing relevant is stored.</p>
<h2>Everything else</h2>
<table>
<tr><th>Endpoint</th><th>What it does</th></tr>
<tr><td><code>POST /v1/turn</code></td><td>Recall + auto-capture in one call — send the latest chat messages, get context back while durable facts are collected. Needs write scope.</td></tr>
<tr><td><code>POST /v1/ingest</code></td><td>Bounded message ingestion with optional <code>flush: true</code> to force digestion.</td></tr>
<tr><td><code>GET /v1/ingest/limits</code></td><td>Authoritative machine-readable limits, character unit, request encoding, and ordered-delivery schema.</td></tr>
<tr><td><code>GET /v1/graph</code></td><td>The full laid-out memory graph (nodes, details, events, edges, clusters).</td></tr>
<tr><td><code>GET /v1/status</code></td><td>Counts: memories, conversation pages, details, events, pending suggestions.</td></tr>
<tr><td><code>GET /v1/memories</code></td><td>Read-only inventory, newest first: <code>kind</code> (all | node | page), <code>limit</code> (1–200), keyset <code>cursor</code>, <code>q</code> substring filter.</td></tr>
<tr><td><code>GET /v1/memories/&lt;id&gt;</code></td><td>One object by id — a memory with its history and events, a page with its markdown. Serves the object's <code>revision</code> and a revision ETag (<code>"r3"</code>; may surface as <code>W/"r3"</code> through content encoding — <code>If-Match</code> accepts both) for safe updates.</td></tr>
