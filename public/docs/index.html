<h1>Projects, organizations, and teams</h1>
<p class="lede">The scope model behind shared memory: what an organization is, what a project is, which role can do what, and how a key inherits its holder's permissions.</p>

<h2>The three things that are not the same</h2>
<p>People conflate these constantly, and every access-control surprise starts there. They are distinct:</p>
<table>
<tr><th>Thing</th><th>What it is</th></tr>
<tr><td><b>Organization</b></td><td>The container people belong to. It holds members and their organization roles, and it owns projects. Every account gets a default organization on first use.</td></tr>
<tr><td><b>Project</b></td><td>A workspace inside an organization: its own memory, extraction rules, categories, API keys, retention policy, and member list. This is the unit almost everything is scoped to.</td></tr>
<tr><td><b>Sub-tenant</b> (<code>userId</code>)</td><td>An isolated memory space <i>inside</i> a project's storage, created by passing <code>userId</code> on a write. One per end user of <i>your</i> product. Not a person with a login, and not a role.</td></tr>
</table>
<p>A person gets access through membership. An end user of your app gets a memory space through <code>userId</code>. Those are separate mechanisms — see <a href="#/concepts/scope">Who memory belongs to</a>.</p>

<h2>Creating organizations and projects</h2>
<pre><button class="copy">Copy</button><code># List what you belong to
GET /auth/organizations
GET /auth/projects

# Create an organization (it comes with a first project)
POST /auth/organizations
{ "name": "Northwind" }

# Create another project inside the selected organization
POST /auth/projects
{ "name": "Atlas", "description": "Migration workspace" }</code></pre>
<p>These are signed-in dashboard calls, not API-key calls. <code>POST /auth/projects</code> needs the <code>project.create</code> capability, which only organization owners and admins hold. Renaming is <code>PATCH /auth/projects/&lt;id&gt;</code> with <code>project.edit</code> and an <code>If-Match</code> revision.</p>
<p>A session works inside one selected project at a time. <code>POST /auth/scope</code> sets the selection; individual requests can override it with the <code>x-itsuki-project</code> header.</p>

<h2>Roles</h2>
<p>There are two role sets, and the words do not overlap the way people expect.</p>
<table>
<tr><th>Scope</th><th>Roles</th></tr>
<tr><td>Organization</td><td><code>owner</code> · <code>admin</code> · <code>member</code></td></tr>
<tr><td>Project</td><td><code>admin</code> · <code>member</code> · <code>viewer</code></td></tr>
</table>
<p><b>There is no "project owner" role.</b> Ownership lives at the organization. An organization owner or admin implicitly holds every project capability inside their organization — administering an organization you own while being locked out of its projects would be a fiction.</p>

<h2>What each role can do</h2>
<p>Authorization is one table in code, not scattered role checks, so this list is exhaustive rather than illustrative. "Org admin" below means organization owner or admin.</p>
<table>
<tr><th>Action</th><th>Org owner</th><th>Org admin</th><th>Project admin</th><th>Project member</th><th>Project viewer</th></tr>
<tr><td>View the project and its members</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td></tr>
<tr><td>Read memory, recall, history</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td></tr>
<tr><td>Write memory, correct, roll back</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td><td>no</td></tr>
<tr><td>Delete memory</td><td>yes</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>Export memory</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td><td>no</td></tr>
<tr><td>View and manage API keys</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td><td>no</td></tr>
<tr><td>Use the Playground</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td><td>no</td></tr>
<tr><td>Edit extraction rules and categories</td><td>yes</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>View and manage retention</td><td>yes</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>View and export the audit log</td><td>yes</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>Manage project members</td><td>yes</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>Archive and restore the project</td><td>yes</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>Edit the organization, manage its members, invite</td><td>yes</td><td>yes</td><td>no</td><td>no</td><td>no</td></tr>
<tr><td>Create projects</td><td>yes</td><td>yes</td><td>no</td><td>no</td><td>no</td></tr>
<tr><td>Transfer or delete a project</td><td>yes</td><td>no</td><td>no</td><td>no</td><td>no</td></tr>
<tr><td>Delete the organization</td><td>yes</td><td>no</td><td>no</td><td>no</td><td>no</td></tr>
</table>
<div class="note">Read the split between <b>member</b> and <b>viewer</b> carefully. A viewer can inspect memory but cannot write it, export it, hold a key, or use the Playground — read-only at the product surface, without bulk portability. A member can write and export but cannot delete, change rules, or see the audit log. Deletion is a distinct permission from writing, deliberately: a project admin can empty a project's memory, and only the organization owner can remove the project itself.</div>

<h2>Inviting people</h2>
<p>Invitations are organization-level: <code>org.members.manage</code>, so an organization owner or admin sends them. A <code>project_role</code> in the body also seats the person in the currently selected project.</p>
<pre><button class="copy">Copy</button><code>POST /v1/settings/invitations
{
  "email": "sam@example.com",
  "org_role": "member",
  "project_role": "member",
  "access_expires_at": 1798761600000
}</code></pre>
<p>The response carries a copy-once link. Invitations expire after seven days; <code>access_starts_at</code> and <code>access_expires_at</code> optionally bound the seat itself, which is how you grant time-limited access to someone outside the team. The recipient signs in and calls <code>POST /v1/settings/invitations/accept</code> with the token — <code>POST /v1/settings/invitations/describe</code> previews what the link grants before accepting. Pending invitations can be resent (<code>POST /v1/settings/invitations/&lt;id&gt;/resend</code>) or revoked (<code>DELETE /v1/settings/invitations/&lt;id&gt;</code>).</p>
<p>For someone already in the organization, seat them directly instead of inviting:</p>
<pre><button class="copy">Copy</button><code># Add a project seat (project.members.manage)
POST /v1/settings/members
{ "user_id": "user_...", "role": "viewer" }

# Change a seat (If-Match carries the member revision)
PATCH /v1/settings/members/&lt;user_id&gt;     { "role": "member" }
DELETE /v1/settings/members/&lt;user_id&gt;

# Organization seats (org.members.manage)
PATCH /v1/settings/org-members/&lt;user_id&gt; { "role": "admin" }
DELETE /v1/settings/org-members/&lt;user_id&gt;</code></pre>
<p>An organization role can be set to <code>admin</code> or <code>member</code> only. The owner's role cannot be changed and the owner cannot be removed — <code>owner_immutable</code> — because an organization with no owner has nobody who can delete or transfer it.</p>

<h2>Leaving</h2>
<p>Leaving is self-service and deliberately behind <b>no</b> capability: a viewer who can manage nothing must still be able to take themselves out.</p>
<pre><button class="copy">Copy</button><code>POST /v1/settings/members/leave          # leave the selected project
POST /v1/settings/org-members/leave      # leave an organization
{ "orgId": "org_..." }                   # optional; defaults to the session's org</code></pre>
<p>Leaving a project removes your seat and revokes the credentials you created in it. Leaving an organization removes your organization seat, every project seat you held inside it, and the credentials bound to them. Both are idempotent: a second call returns <code>already_left: true</code>. The response also reports the scope you land in afterwards, so a UI can re-point itself.</p>
<div class="warn">The organization owner cannot leave. Ownership transfer is not available yet, so deleting the organization is currently the only way to give it up. Likewise, an account that owns an organization with other members in it cannot be erased until those members are removed or the projects transferred.</div>

<h2>Project-bound API keys</h2>
<p>Keys are created inside a project and belong to it. <code>project.keys.manage</code> is required — project admins and members, plus organization owners and admins.</p>
<pre><button class="copy">Copy</button><code>GET  /auth/tokens                        # list this project's keys (project.keys.view)
POST /auth/tokens
{ "type": "api", "label": "Atlas backend", "scopes": ["memory:read"] }

POST   /auth/tokens/&lt;id&gt;/revoke
DELETE /auth/tokens/&lt;id&gt;</code></pre>
<p><code>type</code> is <code>api</code> (a Bearer key) or <code>mcp</code> (a link a chat client can carry). <code>scopes</code> defaults to both <code>memory:read</code> and <code>memory:write</code>. The secret is shown once. A project can hold at most 50 active keys.</p>
<p>Three properties matter when you design around them:</p>
<ul>
<li><b>A key cannot switch projects.</b> Sending an <code>x-itsuki-project</code> header that names a different project is refused with <code>project_scope_mismatch</code>. Keys minted before managed projects existed are permanently bound to their creator's default project — a null binding never means "any project".</li>
<li><b>A key's power is its declared scopes intersected with its creator's current project role.</b> Demote the person who made the key to viewer and the key stops writing, without anyone touching the key. The check is re-proved inside the committing transaction, so a role revoked mid-request loses.</li>
<li><b>An MCP link is a secret.</b> The key rides in the URL because that is what chat clients can carry. Treat it like a password.</li>
</ul>
<p>Full lifecycle details are on <a href="#/api/auth">Authentication &amp; keys</a>.</p>

<h2>Working inside a project from code</h2>
<p>A project-bound key already carries its project, so ordinary saves and recalls need nothing extra. The <code>memoryScope</code> fields are a second, finer tag <i>within</i> a memory space — used by the editor plugins to separate one repository's decisions from another's:</p>
<pre><button class="copy">Copy</button><code>await memory.add("Atlas deploys from main.", {
  memoryScope: { projectId: "atlas", projectName: "Atlas" },
});

await memory.search("how does Atlas deploy?", {
  memoryScope: { projectId: "atlas" },
  recallScope: "project_then_global",
});</code></pre>
<p>Memory saved with a project tag is reachable only by a caller that carries the same tag. That is the point of project scope, and it is also the usual explanation for "I saved it in my editor and my script cannot find it".</p>

<h2>Archive, transfer, delete</h2>
<table>
<tr><th>Action</th><th>Who</th><th>Effect</th></tr>
<tr><td><code>archive</code> / <code>restore</code></td><td>Project admin or org owner/admin</td><td>Takes the project out of circulation and back. Work in flight is settled as cancelled rather than left hanging.</td></tr>
<tr><td><code>memory_purge</code></td><td>Project admin or org owner/admin (<code>project.memory.delete</code>)</td><td>Empties the project's memory across every registered space, keeping the project.</td></tr>
<tr><td><code>project_delete</code></td><td>Organization owner only</td><td>Removes the project itself.</td></tr>
<tr><td>Transfer ownership</td><td>Organization owner only</td><td><code>POST /v1/settings/lifecycle/transfer</code>. Not available for the default project.</td></tr>
</table>
<p>The two destructive actions are preview-first and require a typed confirmation. <a href="#/guides/export">Export and delete your data</a> walks the whole flow.</p>

<h2>Common errors</h2>
<table>
<tr><th>Status</th><th>Error</th><th>What it means</th></tr>
<tr><td>403</td><td><code>forbidden</code></td><td>Your role lacks the named capability. The response names it, so you can map it to the table above.</td></tr>
<tr><td>403</td><td><code>project_scope_mismatch</code></td><td>A credential bound to one project was asked to act in another.</td></tr>
<tr><td>409</td><td><code>owner_immutable</code></td><td>You tried to change, remove, or leave as the organization owner.</td></tr>
<tr><td>409</td><td><code>already_project_member</code></td><td>That person already holds a project seat. Use <code>PATCH</code> to change it.</td></tr>
<tr><td>409</td><td><code>not_a_member</code></td><td>You named an organization you have no seat in.</td></tr>
<tr><td>400</td><td><code>invalid_role</code></td><td>Project roles are admin/member/viewer; organization roles you may assign are admin/member.</td></tr>
<tr><td>400</td><td><code>unknown_member_field</code>, <code>unknown_invitation_field</code>, <code>unknown_project_field</code></td><td>Unknown fields are refused by name rather than ignored.</td></tr>
<tr><td>409</td><td><code>invalid_invitation</code> / expired</td><td>The link is wrong, already used, revoked, or older than seven days.</td></tr>
</table>
<p>Related: <a href="#/concepts/scope">Who memory belongs to</a> · <a href="#/api/auth">Authentication &amp; keys</a> · <a href="#/guides/rules">Control what gets remembered</a>.</p>
` };

PAGES["/guides/export"] = { title: "Export and delete your data", html: `
<h1>Export and delete your data</h1>
<p class="lede">Getting a complete copy of stored memory, and the four different removal operations — which one to reach for, what each actually destroys, and what survives on purpose.</p>

<h2>Export and delete are different promises</h2>
<p>Export answers "give me everything you hold". Delete answers "stop holding it". They are separate surfaces with separate permissions, and it is worth doing them in that order: <b>export before you delete</b>, because none of the deletion paths hand you a copy on the way out.</p>
<p>Both operate on a <b>memory space</b> — the space resolved for the credential and request you sent. A project can contain a primary space plus registered sub-tenant spaces, and no single-space route silently iterates them all. Project-wide operations are their own flow, covered further down.</p>

<h2>Export now: GET /v1/export</h2>
<p>One request, one JSON download, everything in that memory space:</p>
<pre><button class="copy">Copy</button><code>curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  https://itsuki.app/v1/export -o itsuki-export.json

# a specific sub-tenant's space
curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  "https://itsuki.app/v1/export?userId=alex" -o alex-export.json</code></pre>
<pre><button class="copy">Copy</button><code>{
  "format": "uml-export",
  "version": 1,
  "exported_at": "2026-08-27T09:14:02.113Z",
  "user_id": "...",
  "nodes": [...], "slices": [...], "events": [...], "edges": [...],
  "memory_pages": [...], "candidates": [...],
  "receipts": [...], "memory_rules": [...],
  "memory_revisions": [...]
}</code></pre>
<p>Every table holds live rows only — soft-deleted objects are excluded, and <code>memory_revisions</code> carries history only for objects that still exist, so a deleted memory's prior wording never leaks back through a portability download. Revision history is bounded at 50,000 rows; if it hits that bound the payload gains a <code>history_truncated</code> block naming the limit rather than presenting a partial file as complete. Use <code>GET /v1/memories/&lt;id&gt;/history</code> for complete per-object history.</p>
<p>Exporting needs <code>memory:read</code> and the <code>project.export</code> capability — project viewers cannot export.</p>

<h2>Export as a job: POST /v1/exports</h2>
<p>A large graph should not hold an HTTP response open. The job route builds the file in the background and hands you a row to poll:</p>
<pre><button class="copy">Copy</button><code># 1. Queue it
POST /v1/exports
{ "entity": "All memories" }
-&gt; 201 { "ok": true, "export": { "id": "export_...", "status": "queued", "format": "json" } }

# 2. Poll
GET /v1/exports
-&gt; { "ok": true, "exports": [ { "id": "export_...", "status": "complete",
       "object_count": 812, "size_bytes": 431022, "completed_at": ... } ] }

# 3. Download
GET /v1/exports/download?id=export_...</code></pre>
<p>Statuses run <code>queued</code> → <code>running</code> → <code>complete</code> or <code>failed</code>; a failed row carries a sentence you can act on. Downloading before it is ready returns <code>409 not_ready</code>; an expired or unknown id returns <code>404</code>, and the fix is to create a new export.</p>

<h2>Deleting one memory</h2>
<pre><button class="copy">Copy</button><code>curl -X DELETE \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  https://itsuki.app/v1/memories/node_abc123</code></pre>
<p>The id prefix decides what is removed: <code>node_…</code> (a memory and its details, events, and edges), <code>page_…</code> (a conversation page and its source links), <code>slice_…</code> (one detail), or a candidate id (one suggestion). An unrecognized prefix is a <code>400</code>, and a missing object is a <code>404</code>.</p>
<p>Two things happen that are easy to miss:</p>
<ul>
<li><b>The object is also suppressed</b>, so later processing cannot resurrect it. Pass <code>?suppress=false</code> if you deliberately want it left re-creatable.</li>
<li><b>Its revision history is erased with it.</b> History must never become an undeletable shadow copy of content you asked to remove. A deleted object's revisions cannot be restored afterwards — see <a href="#/guides/versions">Corrections, history, and rollback</a>.</li>
</ul>
<p>A deletion tombstone is recorded. That record carries no memory content; it is what lets a later preview honestly answer "nothing left".</p>

<h2>Deleting by source or time window</h2>
<p>This is the curation tool: remove everything one integration wrote, or everything written after a bad deploy. It is <b>preview-first by default</b> — a plain <code>DELETE</code> without <code>confirm=true</code> changes nothing.</p>
<pre><button class="copy">Copy</button><code># Preview (the default; touches nothing)
DELETE /v1/memories?source=ingest&amp;after=1786000000000

{ "ok": true, "dry_run": true,
  "would_delete": { "runs": 4, "nodes": 12, "pages": 1, "slices": 19, "events": 3, "edges": 22 },
  "sample_labels": ["Kotlin", "Atlas", "..."],
  "pending_jobs": 1,
  "note": "1 accepted save(s) are still processing and will finish AFTER this delete; preview again afterwards to remove their output." }

# Confirm
DELETE /v1/memories?source=ingest&amp;after=1786000000000&amp;confirm=true&amp;dry_run=false</code></pre>
<p><code>source</code> matches the label you stamped on the write with the <code>source</code> field, as well as the engine lane and tool name. A value no stamp could ever equal is refused with a <code>400</code> rather than silently deleting nothing. <code>before</code> and <code>after</code> are unix milliseconds.</p>
<div class="note"><b>A scoped delete does not cancel work in flight.</b> A save you already submitted finishes, and its output lands after the delete — you asked to remove what exists, not to stop what is running. The preview's <code>pending_jobs</code> count tells you how many, so the number is never a surprise. Preview again afterwards to sweep the stragglers.</div>

<h2>Erasing one memory space</h2>
<p>A confirmed delete with <b>no</b> source and <b>no</b> window is a different operation with a stronger promise:</p>
<pre><button class="copy">Copy</button><code>DELETE /v1/memories?confirm=true&amp;dry_run=false</code></pre>
<p>It records an <b>erasure barrier</b> — a timestamp for that memory space — then removes everything live, re-checks, and sweeps again so anything that landed mid-operation is caught too. Crucially, it <b>cancels accepted work that had not yet committed</b>: any save accepted before the barrier is refused at commit time, so it cannot reappear after you erased.</p>
<pre><button class="copy">Copy</button><code>{ "ok": true, "dry_run": false,
  "deleted": { "runs": 3, "nodes": 41, "pages": 2, "slices": 55, "events": 7, "edges": 63, "candidates": 0 },
  "cancelled_runs": 1,
  "pending_jobs": 1,
  "convergence_passes": 1,
  "note": "1 accepted save(s) were cancelled by this delete." }</code></pre>
<p>A cancelled save settles as terminal <code>failed</code> with <code>cancelled_by_delete: true</code> and <code>outcome_reason: "cancelled_by_delete"</code>. <b>Do not retry it</b> — the barrier applies to the original work, so a retry is cancelled the same way. If you still want that content stored, write it again as a new save; work submitted after the barrier is ordinary work. Separate the two kinds of failure with <code>GET /v1/jobs?cancelled=true</code> and <code>?cancelled=false</code>. <a href="#/concepts/delete">Delete &amp; erasure</a> covers the mechanics in full.</p>
<p>Deletion needs <code>memory:write</code> plus the distinct <code>project.memory.delete</code> capability — project admins and organization owners/admins, not members or viewers. There is also a legacy <code>POST /v1/actions/delete-all</code> for signed-in sessions only; it refuses API keys and is not exposed in Settings. Build on <code>DELETE /v1/memories</code>.</p>

<h2>Purging or deleting a whole project</h2>
<p>Neither route above claims to cover every registered space in a project. That is what the lifecycle flow is for. It is session-only, preview-first, and requires a typed confirmation bound to your session.</p>
<pre><button class="copy">Copy</button><code># 1. Preview - counts every discovered memory space, mints a confirmation token
POST /v1/settings/lifecycle/preview
{ "projectId": "proj_...", "action": "memory_purge" }

-&gt; { "ok": true, "preview": {
      "action": "memory_purge",
      "project": { "id": "proj_...", "name": "Atlas", "lifecycle_state": "active" },
      "memory_spaces": 4,
      "counts": { "nodes": 812, "pages": 30, "...": "..." },
      "inventory_hash": "...",
      "confirmation": { "token": "lcf_....", "expires_at": ... },
      "confirmation_text": "PURGE MEMORY" } }

# 2. Execute - 202 Accepted, never "deleted"
POST /v1/settings/lifecycle/execute
{ "projectId": "proj_...", "action": "memory_purge",
  "token": "lcf_....", "confirmName": "Atlas",
  "idempotencyKey": "purge-atlas-2026-08-27" }

# 3. Poll until the run is terminal
GET /v1/settings/lifecycle?projectId=proj_...</code></pre>
<table>
<tr><th>Action</th><th>Confirmation phrase</th><th>Who</th><th>Effect</th></tr>
<tr><td><code>memory_purge</code></td><td><code>PURGE MEMORY</code></td><td><code>project.memory.delete</code></td><td>Empties every registered memory space in the project; the project itself stays.</td></tr>
<tr><td><code>project_delete</code></td><td><code>DELETE PROJECT</code></td><td>Organization owner only</td><td>Removes the project.</td></tr>
<tr><td><code>archive</code> / <code>restore</code></td><td>none</td><td>Project admin or org owner/admin</td><td>Reversible. Work in flight is settled as <code>cancelled_by_archive</code>.</td></tr>
</table>
<p>Details that will bite if you script this: <code>confirmName</code> must equal the project's exact name; the confirmation token expires after ten minutes, is single-use, and is invalidated if the project changes after the preview (<code>stale_confirmation</code>); <code>idempotencyKey</code> is 8–120 characters, and replaying the same key returns the same run while a different key against an active run is a stable <code>409</code>.</p>
<div class="warn"><b>The 202 means accepted, not finished.</b> Completion is a status you poll. The run reports <code>status</code> (<code>accepted</code>, <code>running</code>, <code>verifying</code>, <code>failed_retryable</code>, <code>completed</code>, <code>failed</code>), <code>phase</code>, <code>attempts</code>, and running counts. It converges across every registered space, index, queue, artifact, and retry path, and reports completion only after a residual scan proves every store empty. Use <code>POST /v1/settings/lifecycle/retry</code> or <code>/cancel</code> if a run stalls.</div>

<h2>Scheduled deletion: retention</h2>
<p>If you want removal to happen on a clock rather than on demand, set a retention policy instead: <code>GET /v1/settings/retention</code> to read schedules and past runs, <code>POST /v1/settings/retention/preview</code> to see what a shorter window would remove, and <code>PUT /v1/settings/retention</code> to activate it. Preview requires <code>project.retention.view</code>; activation requires <code>project.retention.manage</code> — both project-admin level, because shortening a window is destructive. Retention removes revision history along with the objects it expires.</p>

<h2>Erasing an account</h2>
<p>Account erasure is not a self-serve API call. It is performed by the operator on request, and it is a different scale of operation from the routes above: it tombstones the account, quiesces every credential and provider path first, and only then erases. Two things gate it:</p>
<ul>
<li>An account that owns an organization with other members in it cannot be erased until those members are removed or ownership is dealt with — the request is refused with <code>organization_transfer_required</code>. Governance is not silently discarded.</li>
<li>Once the tombstone is written, the account is inactive for the rest of the operation. It does not return to a writable half-erased state if a later step fails; it stays disabled and retryable.</li>
</ul>
<p>Export first. After erasure there is nothing left to export.</p>

<h2>What deletion actually removes, and what it keeps</h2>
<table>
<tr><th>Operation</th><th>Removes</th><th>Keeps</th></tr>
<tr><td>One object</td><td>The object, its dependents, its revision history, its search and vector artifacts.</td><td>A content-free deletion tombstone.</td></tr>
<tr><td>By source or window</td><td>Objects attributed to the matching extraction runs. Conversation pages with surviving sources are rebuilt, not deleted.</td><td>Everything outside the filter, plus work still in flight.</td></tr>
<tr><td>Unscoped confirmed delete</td><td>Everything live in that memory space, plus accepted-but-uncommitted work.</td><td>The erasure barrier, deletion records, job and receipt history.</td></tr>
<tr><td>Project purge / delete</td><td>Every registered memory space in the project, verified by a residual scan.</td><td>Lifecycle run records and the audit trail.</td></tr>
</table>
<p>What is kept in every case is bookkeeping, not content: deletion records, job and receipt history, and timestamps. That trail carries no memory content, and it is precisely what lets a later preview answer "nothing left" honestly rather than optimistically.</p>
<p>Related: <a href="#/concepts/delete">Delete &amp; erasure</a> · <a href="#/privacy">Privacy &amp; limits</a> · <a href="#/guides/projects">Projects, organizations, and teams</a>.</p>
` };

PAGES["/api/errors"] = { title: "Errors", html: `
<h1>Errors</h1>
<p class="lede">Every failure is JSON, carries a machine-readable code, and comes back with a request id you can quote to support.</p>
<p>Two rules shape the error surface, and both exist so a caller never believes memory was written when it was not. <b>A refused write is never acceptance-shaped</b> — you get a non-2xx status, not a <code>200</code> with <code>ok: true</code>. And <b>an unrecognised parameter is an error, not a shrug</b> — a misspelled <code>usr_id</code> returns <code>400</code> naming the key, because silently dropping it is how somebody ships a multi-tenant app believing isolation worked. Three doors deliberately degrade rather than fail; they are listed below.</p>

<h2>The response shape</h2>
<p>Errors are a JSON object. <code>error</code> is always present. Most errors also carry <code>code</code> (the same value, for clients that read one field) and <code>message</code> (a sentence you can show a human). Anything else in the body is specific to that error and named in the tables below.</p>
<pre><button class="copy">Copy</button><code>{
  "error": "unknown_parameter",
  "message": "\\"usr_id\\" isn't a parameter of /v1/save. Did you mean \\"userId\\"?"
}</code></pre>
<p>Read <code>code</code> first and fall back to <code>error</code> — that is exactly what the SDKs do, and it stays correct for the handful of older endpoints where <code>error</code> holds a sentence rather than a slug (<code>{"error": "userId is required"}</code>, <code>{"error": "query is required"}</code>). Never branch on <code>message</code>; the wording is allowed to improve.</p>

<h2>Status codes</h2>
<table>
<tr><th>Status</th><th>Means</th><th>Do</th></tr>
<tr><td><code>400</code></td><td>The request body or a query parameter is wrong.</td><td>Fix the request. Retrying it unchanged fails identically.</td></tr>
<tr><td><code>401</code></td><td>No usable credential.</td><td>Check the key. The message often names what kind of secret you actually pasted.</td></tr>
<tr><td><code>403</code></td><td>Authenticated, but not allowed.</td><td>Read <code>code</code> or <code>capability</code> — scope, credential kind, and project role are three different refusals.</td></tr>
<tr><td><code>404</code></td><td>No such object in the memory space this credential resolves to.</td><td>Do not treat as "deleted" — a wrong <code>userId</code> also produces this.</td></tr>
<tr><td><code>409</code></td><td>State conflict: an idempotency key reused for different content, an archived object, an export still building.</td><td>Reconcile, then decide. Not a retry.</td></tr>
<tr><td><code>412</code></td><td>Your revision precondition is stale.</td><td>Re-read the object, review the change, retry with the new revision.</td></tr>
<tr><td><code>413</code></td><td>The serialized request exceeds the byte ceiling.</td><td>Split it. The body carries <code>limit</code> and <code>actual</code>.</td></tr>
<tr><td><code>422</code></td><td>The shape is valid JSON but violates a semantic contract (counts, characters, delivery metadata, terminal extraction failure).</td><td>Fix the content, or quarantine it. Never delete your durable copy on a 422.</td></tr>
<tr><td><code>428</code></td><td>A precondition is required and you sent none.</td><td>Send <code>If-Match</code> or <code>expectedRevision</code>.</td></tr>
<tr><td><code>429</code></td><td>Rate bucket, queue depth, or AI write quota.</td><td>Honour <code>retry-after</code>. See <a href="#/api/limits">Rate limits and quotas</a>.</td></tr>
<tr><td><code>500</code></td><td>Our fault, already reported on our side.</td><td>Retry once with backoff. Quote the request id if it persists.</td></tr>
<tr><td><code>503</code></td><td>A dependency we refuse to guess about — the AI quota was unreadable, or an episode write did not land.</td><td>Retry after the interval in <code>retry-after</code>.</td></tr>
</table>

<h2>Error codes</h2>
<p>Grouped by what went wrong. Branch on these values, not on wording.</p>
<h3>Request and parameters</h3>
<table>
<tr><th>Code</th><th>Status</th><th>What happened, and the fix</th></tr>
<tr><td><code>invalid_json</code></td><td>400</td><td>The body was not valid UTF-8 JSON, or not a single JSON object.</td></tr>
<tr><td><code>invalid_body</code></td><td>400</td><td>The body parsed but is an array or a scalar. Memory endpoints take one object.</td></tr>
<tr><td><code>unknown_parameter</code></td><td>400</td><td>A key that is not on that endpoint's list. The message names it and suggests the intended spelling when one is close. Known snake_case aliases (<code>user_id</code>, <code>idempotency_key</code>, <code>recall_scope</code> and friends) are rewritten to camelCase instead of refused.</td></tr>
<tr><td><code>conflicting_parameters</code></td><td>400</td><td>You sent both an alias and its canonical name (<code>user_id</code> <i>and</i> <code>userId</code>). Last-writer-wins would be a guess, so it is refused. Send one.</td></tr>
<tr><td><code>payload_too_large</code></td><td>400</td><td><code>content</code> over 120,000 characters, or <code>query</code> over 8,000. Split the save, or send it as <code>messages[]</code>.</td></tr>
<tr><td><code>request_too_large</code></td><td>413</td><td>The serialized body exceeds the endpoint's byte ceiling. Carries <code>limit</code>, <code>actual</code>, <code>unit: "bytes"</code>.</td></tr>
<tr><td><code>duplicate_query_parameter</code> · <code>unsupported_query_parameter</code></td><td>400</td><td>A query string that repeats a key, or uses one the route does not read.</td></tr>
<tr><td><code>source_time_not_enabled</code></td><td>400</td><td><code>sourceTime</code> is accepted by name but only honoured for accounts on the V3 timestamp contract. It is refused rather than silently ignored — accepted-then-ignored is the failure this whole layer exists to prevent.</td></tr>
</table>

<h3>Authentication and permissions</h3>
<table>
<tr><th>Code</th><th>Status</th><th>What happened, and the fix</th></tr>
<tr><td><code>unauthorized</code></td><td>401</td><td>No usable credential. If the value looked like the wrong <i>kind</i> of secret, <code>message</code> says which — a webhook signing secret, an MCP URL instead of its last path segment, an <code>sk-</code> key from another vendor, or something that is simply not an <code>itsuki_live_</code> key.</td></tr>
<tr><td><code>forbidden</code> · <code>code: insufficient_scope</code></td><td>403</td><td>The key is valid but lacks <code>memory:read</code> or <code>memory:write</code> for that route. Mint a key with the scope, or use the one that has it.</td></tr>
<tr><td><code>forbidden</code> · <code>code: token_not_allowed</code></td><td>403</td><td>The route refuses Bearer keys by design — the <code>/v1/actions/*</code> control routes and the candidate review routes are session-only. Standing configuration is stricter still: <code>/v1/webhooks</code> authenticates the session directly and answers a key with <code>401</code>.</td></tr>
<tr><td><code>forbidden</code> · <code>capability</code></td><td>403</td><td>Your project role lacks a named capability (for example <code>project.memory.delete</code>). The body names the capability and deliberately says nothing about who does hold it.</td></tr>
<tr><td><code>account_scope_required</code></td><td>400</td><td>An account-wide route was called with the legacy <code>x-api-key</code> lane, which writes under raw external ids and has no account relationship to roll up. Use a Bearer key or a session.</td></tr>
</table>
<div class="note"><b>An MCP link is not an API key.</b> Both start with <code>itsuki_live_</code>, but only a token created as an MCP link works in the URL path, and only an API key works in an <code>authorization</code> header. Paste one where the other belongs and the server tells you so by name rather than returning a bare <code>unauthorized</code>. See <a href="#/api/auth">Authentication &amp; keys</a>.</div>

<h3>Revisions and idempotency</h3>
<p>Safe updates are precondition-gated: you send the revision you read, and the server refuses to overwrite anything newer.</p>
<table>
<tr><th>Code</th><th>Status</th><th>What happened, and the fix</th></tr>
<tr><td><code>precondition_required</code></td><td>428</td><td>No <code>If-Match</code> and no <code>expectedRevision</code>, or an <code>If-Match</code> that is not a revision ETag. Send <code>If-Match: "r3"</code> (a <code>W/"r3"</code> form is also accepted).</td></tr>
<tr><td><code>wildcard_rejected</code></td><td>400</td><td><code>If-Match: *</code> would overwrite blindly. Send the exact current revision.</td></tr>
<tr><td><code>precondition_mismatch</code></td><td>400</td><td><code>If-Match</code> and <code>expectedRevision</code> name different revisions.</td></tr>
<tr><td><code>stale_revision</code></td><td>412</td><td>The memory changed since you read it. The body carries <code>current_revision</code>. Re-read, review the difference, retry.</td></tr>
<tr><td><code>idempotency_conflict</code></td><td>409</td><td>The same <code>idempotencyKey</code> was reused for different content. Carries <code>idempotency_key</code> and <code>source_packet_id</code>. Reusing a key for an unchanged retry is safe and returns the original result; reusing it for new content is always a conflict.</td></tr>
<tr><td><code>unrecognized_id</code> · <code>bad_request</code></td><td>400</td><td>The id is not a <code>node_</code>, <code>page_</code>, <code>slice_</code>, <code>event_</code>, or candidate id.</td></tr>
<tr><td><code>unsupported_kind</code></td><td>422</td><td>That kind of object does not support explicit updates.</td></tr>
<tr><td><code>invalid_field</code> · <code>invalid_content</code></td><td>400</td><td>A field that is not editable for that kind, or a value that is empty, the wrong type, too long, or outside the allowed set. Both name the offending <code>field</code>.</td></tr>
<tr><td><code>object_archived</code> · <code>unsupported_state</code> · <code>project_state_changed</code></td><td>409</td><td>The object is archived or suppressed, or the project state moved while your update was committing. Restore or reload, then retry.</td></tr>
</table>

<h3>Ingest contract</h3>
<p><code>POST /v1/ingest</code> validates against a published contract before it accepts anything, so a violation is atomic: nothing was queued.</p>
<pre><button class="copy">Copy</button><code>{
  "error": "ingest_message_characters_exceeded",
  "code": "ingest_message_characters_exceeded",
  "message": "messages[3].content exceeds 4000 Unicode characters.",
  "limit": 4000,
  "actual": 5122,
  "retryable": false,
  "unit": "unicode_code_points",
  "field": "messages[3].content",
  "messageIndex": 3,
  "limits": { "maxMessages": 30, "maxMessageCharacters": 4000,
              "maxTotalCharacters": 120000, "maxRequestBytes": 524288 }
}</code></pre>
<p>The family is <code>ingest_request_too_large</code> (413), plus <code>ingest_message_count_exceeded</code>, <code>ingest_total_characters_exceeded</code>, <code>ingest_message_characters_exceeded</code>, <code>invalid_ingest_message</code>, and <code>invalid_ingest_delivery_metadata</code> (all 422). Every one carries <code>retryable: false</code> and the full <code>limits</code> object, so a batching client can re-plan without a second round trip. Fetch <a href="#/api/limits">the limits</a> rather than copying those constants into your code.</p>
<p><code>extraction_failed_terminal</code> (422) is different: the request was well formed, and extraction of that exact content failed permanently after its bounded repairs. It is deliberately <i>not</i> acceptance-shaped so an outbox-style caller quarantines its durable copy instead of deleting it. It carries <code>job_id</code> and <code>source_packet_id</code>.</p>

<h3>Capacity</h3>
<table>
<tr><th>Code</th><th>Status</th><th>What happened, and the fix</th></tr>
<tr><td><code>too_many_requests</code></td><td>429</td><td>A rate bucket. Carries <code>bucket</code> and <code>retry_after_s</code>; headers carry <code>retry-after</code> and <code>ratelimit-limit</code>.</td></tr>
<tr><td><code>queue_full</code></td><td>429</td><td>Too much work is already in flight for this memory space. Carries <code>queue_depth</code> and <code>retry_after_s</code>. Back off; nothing was lost.</td></tr>
<tr><td><code>ai_quota_exhausted</code></td><td>429</td><td>The monthly AI-write quota is spent. Carries <code>capped: "monthly_ai"</code> and a <code>usage</code> block with <code>used</code>, <code>limit</code>, and <code>resets_at</code>.</td></tr>
<tr><td><code>ai_capacity_paused</code></td><td>429</td><td>A service-wide daily processing ceiling, not a limit on your account. Saves resume at 00:00 UTC.</td></tr>
<tr><td><code>ai_quota_unavailable</code></td><td>503</td><td>The quota could not be read, so the write was refused rather than guessed at. Nothing was saved. Retry shortly.</td></tr>
<tr><td><code>something_went_wrong</code></td><td>500</td><td>An unhandled failure. It is captured server-side automatically before the response leaves. Retry with backoff and quote the request id.</td></tr>
</table>

<h2>Failures that arrive as 200</h2>
<p>Three refusals are deliberately not HTTP errors. Handle them by reading the body, not the status.</p>
<h3>Recall under its rate bucket</h3>
<p>A rate-limited <code>POST /v1/recall</code> returns <code>200</code> with <code>ok: true</code>, an empty <code>context</code>, <code>count: 0</code>, and <code>recall_status: "rate_limited"</code>. Recall is a read inside somebody's chat loop; a hard error there breaks the turn for no benefit. If you treat "empty context" as "nothing is stored", check <code>recall_status</code> first.</p>
<h3>Capture under the AI quota on /v1/turn</h3>
<p><code>POST /v1/turn</code> stays <code>200</code> when the write quota is spent: recall still answers, and <code>collect</code> reports <code>ok: false</code> with <code>capped: "monthly_ai"</code> and the usage block. Refusing the whole request over a <i>write</i> quota would break the caller's loop for no saving.</p>
<h3>MCP tool refusals</h3>
<p>Over MCP, a refusal is a tool <i>result</i> with <code>isError: true</code> and the reason in <code>structuredContent</code> (<code>rate_limited</code>, <code>ai_quota_exhausted</code>, <code>insufficient_capability</code>). An HTTP 429 would tear down the connection and the model would never see why.</p>
<div class="warn"><b>A cancelled save is terminal, not transient.</b> If a confirmed delete erased the space while a save was processing, its job settles as <code>failed</code> with <code>cancelled_by_delete: true</code> and <code>outcome_reason: "cancelled_by_delete"</code>. Do not retry it — the barrier applies to the original work. Write the content again as a new save instead. See <a href="#/concepts/delete">Delete &amp; erasure</a>.</div>

<h2>Request ids</h2>
<p>Every response carries <code>x-request-id</code>. Send your own on the way in and it is echoed back; otherwise one is derived from Cloudflare's ray id, or minted.</p>
<pre><button class="copy">Copy</button><code>curl -i -X POST https://itsuki.app/v1/save \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -H "x-request-id: 018f3b7c9a2d4e6f8b1c5d7e9f0a2b3c" \\
  -d '{"content": "I started learning Kotlin this week."}'

# HTTP/2 200
# x-request-id: 018f3b7c9a2d4e6f8b1c5d7e9f0a2b3c</code></pre>
<p>A caller-supplied id is accepted only if it is a UUID, a ULID, or 16–64 hex characters, up to 80 characters total. Free-form header text is rejected and replaced, because a correlation field that accepts anything becomes a side channel for tokens, emails, and control characters. Under CORS, <code>x-request-id</code> is both an allowed request header and an exposed response header, so browser code can read it back.</p>
<p>Quote that id when you report a problem: it ties your failed call to the server-side capture without anyone reading your memory content. For your own triage first, <code>GET /v1/requests</code> returns per-request metadata — source, outcome, latency, counts, never text — and <code>GET /v1/jobs</code> returns the job ledger. See <a href="#/operate/observability">Monitoring &amp; diagnostics</a>.</p>

<h2>Retrying safely</h2>
<p>Retry on <code>429</code> and <code>5xx</code>. Do not retry <code>4xx</code> below <code>429</code> — the request will fail identically.</p>
<ul>
<li><b>Reads are always safe to retry.</b> <code>GET</code> routes and <code>POST /v1/recall</code> have no durable effect.</li>
<li><b>Writes are safe to retry only with an <code>idempotencyKey</code>.</b> The same key is processed at most once; an unchanged retry returns the original outcome. Without one, a retry after a timeout can produce a second save.</li>
<li><b>Honour <code>retry-after</code> over your own backoff</b> when it is present, and cap the total by your own deadline.</li>
</ul>
<p>Both SDKs already do this: writes retry only when you passed an <code>idempotencyKey</code>, reads always may, the delay is <code>retry-after</code> when present and exponential-with-jitter otherwise, and the whole sequence is bounded by one request budget (30 s and two retries by default in the JavaScript client). The thrown error exposes <code>status</code>, <code>code</code>, the parsed <code>body</code>, and the retry hint, so you rarely parse the JSON yourself.</p>
<pre><button class="copy">Copy</button><code>import { MemoryClient, MemoryAPIError } from "itsuki";

const memory = new MemoryClient({ apiKey: process.env.ITSUKI_API_KEY });

try {
  await memory.add("The pricing review moved to October.", {
    idempotencyKey: memory.newIdempotencyKey(),
  });
} catch (error) {
  if (error instanceof MemoryAPIError &amp;&amp; error.code === "ai_quota_exhausted") {
    // Terminal for this month. Queue it locally; do not spin.
    queue.hold(error.body.usage.resets_at);
  } else {
    throw error;
  }
}</code></pre>

<h2>Related</h2>
<ul>
<li><a href="#/api/limits">Rate limits and quotas</a> — the buckets, the AI budget, and the size bounds behind the 4xx codes above.</li>
<li><a href="#/api/rest">REST API reference</a> — the endpoints these errors come from.</li>
<li><a href="#/api/auth">Authentication &amp; keys</a> — scopes, key kinds, and rotation.</li>
<li><a href="#/operate/observability">Monitoring &amp; diagnostics</a> — jobs, packet status, and the account-wide health view.</li>
</ul>
