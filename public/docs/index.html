<h1>Errors</h1>
<p class="lede">Every failure is JSON, carries a machine-readable code, and comes back with a request id you can quote to support.</p>
<p>Two rules shape the error surface, and both exist so a caller never believes memory was written when it was not. <b>A refused write is never acceptance-shaped</b> — you get a non-2xx status, not a <code>200</code> with <code>ok: true</code>. And <b>an unrecognised parameter is an error, not a shrug</b> — a misspelled <code>usr_id</code> returns <code>400</code> naming the key, because silently dropping it is how somebody ships a multi-tenant app believing isolation worked. Three doors deliberately degrade rather than fail; they are listed below.</p>

<h2>The response shape</h2>
<p>Errors are a JSON object. <code>error</code> is always present. Most errors also carry <code>code</code> (the same value, for clients that read one field) and <code>message</code> (a sentence you can show a human). Anything else in the body is specific to that error and named in the tables below.</p>
<pre><button class="copy">Copy</button><code>{
  "error": "unknown_parameter",
  "message": "\\"usr_id\\" isn't a parameter of /v1/save. Did you mean \\"userId\\"?"
}</code></pre>
<p>Read <code>code</code> first and fall back to <code>error</code> — that is exactly what the SDKs do, and it stays correct for the handful of older endpoints where <code>error</code> holds a sentence rather than a slug (<code>{"error": "userId is required"}</code>, <code>{"error": "query is required"}</code>). Never branch on <code>message</code>; the wording is allowed to improve.</p>

<h2>Status codes</h2>
<table>
<tr><th>Status</th><th>Means</th><th>Do</th></tr>
<tr><td><code>400</code></td><td>The request body or a query parameter is wrong.</td><td>Fix the request. Retrying it unchanged fails identically.</td></tr>
<tr><td><code>401</code></td><td>No usable credential.</td><td>Check the key. The message often names what kind of secret you actually pasted.</td></tr>
<tr><td><code>403</code></td><td>Authenticated, but not allowed.</td><td>Read <code>code</code> or <code>capability</code> — scope, credential kind, and project role are three different refusals.</td></tr>
<tr><td><code>404</code></td><td>No such object in the memory space this credential resolves to.</td><td>Do not treat as "deleted" — a wrong <code>userId</code> also produces this.</td></tr>
<tr><td><code>409</code></td><td>State conflict: an idempotency key reused for different content, an archived object, an export still building.</td><td>Reconcile, then decide. Not a retry.</td></tr>
<tr><td><code>412</code></td><td>Your revision precondition is stale.</td><td>Re-read the object, review the change, retry with the new revision.</td></tr>
<tr><td><code>413</code></td><td>The serialized request exceeds the byte ceiling.</td><td>Split it. The body carries <code>limit</code> and <code>actual</code>.</td></tr>
<tr><td><code>422</code></td><td>The shape is valid JSON but violates a semantic contract (counts, characters, delivery metadata, terminal extraction failure).</td><td>Fix the content, or quarantine it. Never delete your durable copy on a 422.</td></tr>
<tr><td><code>428</code></td><td>A precondition is required and you sent none.</td><td>Send <code>If-Match</code> or <code>expectedRevision</code>.</td></tr>
<tr><td><code>429</code></td><td>Rate bucket, queue depth, or AI write quota.</td><td>Honour <code>retry-after</code>. See <a href="#/api/limits">Rate limits and quotas</a>.</td></tr>
<tr><td><code>500</code></td><td>Our fault, already reported on our side.</td><td>Retry once with backoff. Quote the request id if it persists.</td></tr>
<tr><td><code>503</code></td><td>A dependency we refuse to guess about — the AI quota was unreadable, or an episode write did not land.</td><td>Retry after the interval in <code>retry-after</code>.</td></tr>
</table>

<h2>Error codes</h2>
<p>Grouped by what went wrong. Branch on these values, not on wording.</p>
<h3>Request and parameters</h3>
<table>
<tr><th>Code</th><th>Status</th><th>What happened, and the fix</th></tr>
<tr><td><code>invalid_json</code></td><td>400</td><td>The body was not valid UTF-8 JSON, or not a single JSON object.</td></tr>
<tr><td><code>invalid_body</code></td><td>400</td><td>The body parsed but is an array or a scalar. Memory endpoints take one object.</td></tr>
<tr><td><code>unknown_parameter</code></td><td>400</td><td>A key that is not on that endpoint's list. The message names it and suggests the intended spelling when one is close. Known snake_case aliases (<code>user_id</code>, <code>idempotency_key</code>, <code>recall_scope</code> and friends) are rewritten to camelCase instead of refused.</td></tr>
<tr><td><code>conflicting_parameters</code></td><td>400</td><td>You sent both an alias and its canonical name (<code>user_id</code> <i>and</i> <code>userId</code>). Last-writer-wins would be a guess, so it is refused. Send one.</td></tr>
<tr><td><code>payload_too_large</code></td><td>400</td><td><code>content</code> over 120,000 characters, or <code>query</code> over 8,000. Split the save, or send it as <code>messages[]</code>.</td></tr>
<tr><td><code>request_too_large</code></td><td>413</td><td>The serialized body exceeds the endpoint's byte ceiling. Carries <code>limit</code>, <code>actual</code>, <code>unit: "bytes"</code>.</td></tr>
<tr><td><code>duplicate_query_parameter</code> · <code>unsupported_query_parameter</code></td><td>400</td><td>A query string that repeats a key, or uses one the route does not read.</td></tr>
<tr><td><code>source_time_not_enabled</code></td><td>400</td><td><code>sourceTime</code> is accepted by name but only honoured for accounts on the V3 timestamp contract. It is refused rather than silently ignored — accepted-then-ignored is the failure this whole layer exists to prevent.</td></tr>
</table>

<h3>Authentication and permissions</h3>
<table>
<tr><th>Code</th><th>Status</th><th>What happened, and the fix</th></tr>
<tr><td><code>unauthorized</code></td><td>401</td><td>No usable credential. If the value looked like the wrong <i>kind</i> of secret, <code>message</code> says which — a webhook signing secret, an MCP URL instead of its last path segment, an <code>sk-</code> key from another vendor, or something that is simply not an <code>itsuki_live_</code> key.</td></tr>
<tr><td><code>forbidden</code> · <code>code: insufficient_scope</code></td><td>403</td><td>The key is valid but lacks <code>memory:read</code> or <code>memory:write</code> for that route. Mint a key with the scope, or use the one that has it.</td></tr>
<tr><td><code>forbidden</code> · <code>code: token_not_allowed</code></td><td>403</td><td>The route refuses Bearer keys by design — the <code>/v1/actions/*</code> control routes and the candidate review routes are session-only. Standing configuration is stricter still: <code>/v1/webhooks</code> authenticates the session directly and answers a key with <code>401</code>.</td></tr>
<tr><td><code>forbidden</code> · <code>capability</code></td><td>403</td><td>Your project role lacks a named capability (for example <code>project.memory.delete</code>). The body names the capability and deliberately says nothing about who does hold it.</td></tr>
<tr><td><code>account_scope_required</code></td><td>400</td><td>An account-wide route was called with the legacy <code>x-api-key</code> lane, which writes under raw external ids and has no account relationship to roll up. Use a Bearer key or a session.</td></tr>
</table>
<div class="note"><b>An MCP link is not an API key.</b> Both start with <code>itsuki_live_</code>, but only a token created as an MCP link works in the URL path, and only an API key works in an <code>authorization</code> header. Paste one where the other belongs and the server tells you so by name rather than returning a bare <code>unauthorized</code>. See <a href="#/api/auth">Authentication &amp; keys</a>.</div>

<h3>Revisions and idempotency</h3>
<p>Safe updates are precondition-gated: you send the revision you read, and the server refuses to overwrite anything newer.</p>
<table>
<tr><th>Code</th><th>Status</th><th>What happened, and the fix</th></tr>
<tr><td><code>precondition_required</code></td><td>428</td><td>No <code>If-Match</code> and no <code>expectedRevision</code>, or an <code>If-Match</code> that is not a revision ETag. Send <code>If-Match: "r3"</code> (a <code>W/"r3"</code> form is also accepted).</td></tr>
<tr><td><code>wildcard_rejected</code></td><td>400</td><td><code>If-Match: *</code> would overwrite blindly. Send the exact current revision.</td></tr>
<tr><td><code>precondition_mismatch</code></td><td>400</td><td><code>If-Match</code> and <code>expectedRevision</code> name different revisions.</td></tr>
<tr><td><code>stale_revision</code></td><td>412</td><td>The memory changed since you read it. The body carries <code>current_revision</code>. Re-read, review the difference, retry.</td></tr>
<tr><td><code>idempotency_conflict</code></td><td>409</td><td>The same <code>idempotencyKey</code> was reused for different content. Carries <code>idempotency_key</code> and <code>source_packet_id</code>. Reusing a key for an unchanged retry is safe and returns the original result; reusing it for new content is always a conflict.</td></tr>
<tr><td><code>unrecognized_id</code> · <code>bad_request</code></td><td>400</td><td>The id is not a <code>node_</code>, <code>page_</code>, <code>slice_</code>, <code>event_</code>, or candidate id.</td></tr>
<tr><td><code>unsupported_kind</code></td><td>422</td><td>That kind of object does not support explicit updates.</td></tr>
<tr><td><code>invalid_field</code> · <code>invalid_content</code></td><td>400</td><td>A field that is not editable for that kind, or a value that is empty, the wrong type, too long, or outside the allowed set. Both name the offending <code>field</code>.</td></tr>
<tr><td><code>object_archived</code> · <code>unsupported_state</code> · <code>project_state_changed</code></td><td>409</td><td>The object is archived or suppressed, or the project state moved while your update was committing. Restore or reload, then retry.</td></tr>
</table>

<h3>Ingest contract</h3>
<p><code>POST /v1/ingest</code> validates against a published contract before it accepts anything, so a violation is atomic: nothing was queued.</p>
<pre><button class="copy">Copy</button><code>{
  "error": "ingest_message_characters_exceeded",
  "code": "ingest_message_characters_exceeded",
  "message": "messages[3].content exceeds 4000 Unicode characters.",
  "limit": 4000,
  "actual": 5122,
  "retryable": false,
  "unit": "unicode_code_points",
  "field": "messages[3].content",
  "messageIndex": 3,
  "limits": { "maxMessages": 30, "maxMessageCharacters": 4000,
              "maxTotalCharacters": 120000, "maxRequestBytes": 524288 }
}</code></pre>
<p>The family is <code>ingest_request_too_large</code> (413), plus <code>ingest_message_count_exceeded</code>, <code>ingest_total_characters_exceeded</code>, <code>ingest_message_characters_exceeded</code>, <code>invalid_ingest_message</code>, and <code>invalid_ingest_delivery_metadata</code> (all 422). Every one carries <code>retryable: false</code> and the full <code>limits</code> object, so a batching client can re-plan without a second round trip. Fetch <a href="#/api/limits">the limits</a> rather than copying those constants into your code.</p>
<p><code>extraction_failed_terminal</code> (422) is different: the request was well formed, and extraction of that exact content failed permanently after its bounded repairs. It is deliberately <i>not</i> acceptance-shaped so an outbox-style caller quarantines its durable copy instead of deleting it. It carries <code>job_id</code> and <code>source_packet_id</code>.</p>

<h3>Capacity</h3>
<table>
<tr><th>Code</th><th>Status</th><th>What happened, and the fix</th></tr>
<tr><td><code>too_many_requests</code></td><td>429</td><td>A rate bucket. Carries <code>bucket</code> and <code>retry_after_s</code>; headers carry <code>retry-after</code> and <code>ratelimit-limit</code>.</td></tr>
<tr><td><code>queue_full</code></td><td>429</td><td>Too much work is already in flight for this memory space. Carries <code>queue_depth</code> and <code>retry_after_s</code>. Back off; nothing was lost.</td></tr>
<tr><td><code>ai_quota_exhausted</code></td><td>429</td><td>The monthly AI-write quota is spent. Carries <code>capped: "monthly_ai"</code> and a <code>usage</code> block with <code>used</code>, <code>limit</code>, and <code>resets_at</code>.</td></tr>
<tr><td><code>ai_capacity_paused</code></td><td>429</td><td>A service-wide daily processing ceiling, not a limit on your account. Saves resume at 00:00 UTC.</td></tr>
<tr><td><code>ai_quota_unavailable</code></td><td>503</td><td>The quota could not be read, so the write was refused rather than guessed at. Nothing was saved. Retry shortly.</td></tr>
<tr><td><code>something_went_wrong</code></td><td>500</td><td>An unhandled failure. It is captured server-side automatically before the response leaves. Retry with backoff and quote the request id.</td></tr>
</table>

<h2>Failures that arrive as 200</h2>
<p>Three refusals are deliberately not HTTP errors. Handle them by reading the body, not the status.</p>
<h3>Recall under its rate bucket</h3>
<p>A rate-limited <code>POST /v1/recall</code> returns <code>200</code> with <code>ok: true</code>, an empty <code>context</code>, <code>count: 0</code>, and <code>recall_status: "rate_limited"</code>. Recall is a read inside somebody's chat loop; a hard error there breaks the turn for no benefit. If you treat "empty context" as "nothing is stored", check <code>recall_status</code> first.</p>
<h3>Capture under the AI quota on /v1/turn</h3>
<p><code>POST /v1/turn</code> stays <code>200</code> when the write quota is spent: recall still answers, and <code>collect</code> reports <code>ok: false</code> with <code>capped: "monthly_ai"</code> and the usage block. Refusing the whole request over a <i>write</i> quota would break the caller's loop for no saving.</p>
<h3>MCP tool refusals</h3>
<p>Over MCP, a refusal is a tool <i>result</i> with <code>isError: true</code> and the reason in <code>structuredContent</code> (<code>rate_limited</code>, <code>ai_quota_exhausted</code>, <code>insufficient_capability</code>). An HTTP 429 would tear down the connection and the model would never see why.</p>
<div class="warn"><b>A cancelled save is terminal, not transient.</b> If a confirmed delete erased the space while a save was processing, its job settles as <code>failed</code> with <code>cancelled_by_delete: true</code> and <code>outcome_reason: "cancelled_by_delete"</code>. Do not retry it — the barrier applies to the original work. Write the content again as a new save instead. See <a href="#/concepts/delete">Delete &amp; erasure</a>.</div>

<h2>Request ids</h2>
<p>Every response carries <code>x-request-id</code>. Send your own on the way in and it is echoed back; otherwise one is derived from Cloudflare's ray id, or minted.</p>
<pre><button class="copy">Copy</button><code>curl -i -X POST https://itsuki.app/v1/save \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -H "x-request-id: 018f3b7c9a2d4e6f8b1c5d7e9f0a2b3c" \\
  -d '{"content": "I started learning Kotlin this week."}'

# HTTP/2 200
# x-request-id: 018f3b7c9a2d4e6f8b1c5d7e9f0a2b3c</code></pre>
<p>A caller-supplied id is accepted only if it is a UUID, a ULID, or 16–64 hex characters, up to 80 characters total. Free-form header text is rejected and replaced, because a correlation field that accepts anything becomes a side channel for tokens, emails, and control characters. Under CORS, <code>x-request-id</code> is both an allowed request header and an exposed response header, so browser code can read it back.</p>
<p>Quote that id when you report a problem: it ties your failed call to the server-side capture without anyone reading your memory content. For your own triage first, <code>GET /v1/requests</code> returns per-request metadata — source, outcome, latency, counts, never text — and <code>GET /v1/jobs</code> returns the job ledger. See <a href="#/operate/observability">Monitoring &amp; diagnostics</a>.</p>

<h2>Retrying safely</h2>
<p>Retry on <code>429</code> and <code>5xx</code>. Do not retry <code>4xx</code> below <code>429</code> — the request will fail identically.</p>
<ul>
<li><b>Reads are always safe to retry.</b> <code>GET</code> routes and <code>POST /v1/recall</code> have no durable effect.</li>
<li><b>Writes are safe to retry only with an <code>idempotencyKey</code>.</b> The same key is processed at most once; an unchanged retry returns the original outcome. Without one, a retry after a timeout can produce a second save.</li>
<li><b>Honour <code>retry-after</code> over your own backoff</b> when it is present, and cap the total by your own deadline.</li>
</ul>
<p>Both SDKs already do this: writes retry only when you passed an <code>idempotencyKey</code>, reads always may, the delay is <code>retry-after</code> when present and exponential-with-jitter otherwise, and the whole sequence is bounded by one request budget (30 s and two retries by default in the JavaScript client). The thrown error exposes <code>status</code>, <code>code</code>, the parsed <code>body</code>, and the retry hint, so you rarely parse the JSON yourself.</p>
<pre><button class="copy">Copy</button><code>import { MemoryClient, MemoryAPIError } from "itsuki";

const memory = new MemoryClient({ apiKey: process.env.ITSUKI_API_KEY });

try {
  await memory.add("The design review moved to October.", {
    idempotencyKey: memory.newIdempotencyKey(),
  });
} catch (error) {
  if (error instanceof MemoryAPIError &amp;&amp; error.code === "ai_quota_exhausted") {
    // Terminal for this month. Queue it locally; do not spin.
    queue.hold(error.body.usage.resets_at);
  } else {
    throw error;
  }
}</code></pre>

<h2>Related</h2>
<ul>
<li><a href="#/api/limits">Rate limits and quotas</a> — the buckets, the AI budget, and the size bounds behind the 4xx codes above.</li>
<li><a href="#/api/rest">REST API reference</a> — the endpoints these errors come from.</li>
<li><a href="#/api/auth">Authentication &amp; keys</a> — scopes, key kinds, and rotation.</li>
<li><a href="#/operate/observability">Monitoring &amp; diagnostics</a> — jobs, packet status, and the account-wide health view.</li>
</ul>
` };

PAGES["/api/limits"] = { title: "Rate limits and quotas", html: `
<h1>Rate limits and quotas</h1>
<p class="lede">Six request buckets, one monthly AI-write quota, and a set of published input bounds — all readable from the API so you never hard-code them.</p>
<p>Itsuki bounds three different things, and it is worth keeping them separate in your head. <b>Rate buckets</b> stop a runaway loop. The <b>AI write quota</b> bounds how much inference one account can spend in a month. <b>Input bounds</b> stop a request that the extractor could not do anything useful with anyway. Each has its own error, its own recovery, and its own place to read the current numbers.</p>

<h2>Read the limits, don't copy them</h2>
<p><code>GET /v1/limits</code> needs no authentication and returns every published figure in one document. It is generated from the same constants the enforcement path reads, so the published number cannot drift from the enforced one.</p>
<pre><button class="copy">Copy</button><code>curl https://itsuki.app/v1/limits</code></pre>
<pre><button class="copy">Copy</button><code>{
  "ok": true,
  "schema": "itsuki.limits/v1",
  "rate": {
    "unit": "requests",
    "buckets": {
      "save": { "limit": 60, "period_s": 60,
                "applies_to": ["POST /v1/save", "POST /v1/turn",
                               "mcp:save_memory", "mcp:save_conversation"] }
    },
    "scope": "per credential, per project",
    "accuracy": "eventually consistent; protection, not accounting",
    "on_exceeded": { "http_status": 429, "headers": ["retry-after", "ratelimit-limit"] }
  },
  "ingest": { "limits": { "maxMessages": 30, "maxMessageCharacters": 4000,
                          "maxTotalCharacters": 120000, "maxRequestBytes": 524288 },
              "character_unit": "unicode_code_points",
              "request_encoding": "utf-8-json" },
  "ai": { "monthly_writes": 1000, "unit": "ai_writes", "period": "calendar_month_utc" }
}</code></pre>
<p><code>GET /v1/ingest/limits</code> returns the ingest half on its own, plus the ordered-delivery schema, for clients that only batch conversations. Both are unauthenticated so a client can plan its batching before it has a key.</p>

<h2>The six rate buckets</h2>
<table>
<tr><th>Bucket</th><th>Limit</th><th>Applies to</th></tr>
<tr><td><code>auth</code></td><td>10 / 60 s</td><td>Published as <code>/auth/*</code>: sign-in, sign-up, OAuth, email codes, password changes. A few adjacent security mutations — organization creation, invitation acceptance — share it. Keyed per IP as well as per actor.</td></tr>
<tr><td><code>save</code></td><td>60 / 60 s</td><td><code>POST /v1/save</code>, <code>POST /v1/turn</code>, and the MCP <code>save_memory</code> / <code>save_conversation</code> tools.</td></tr>
<tr><td><code>recall</code></td><td>120 / 60 s</td><td><code>POST /v1/recall</code> and the MCP <code>recall_memory</code> tool.</td></tr>
<tr><td><code>delete</code></td><td>30 / 60 s</td><td><code>DELETE /v1/memories</code> and <code>DELETE /v1/memories/:id</code>, plus the MCP delete tools. Tighter than saving on purpose: a loop that deletes is worse than a loop that saves.</td></tr>
<tr><td><code>import</code></td><td>300 / 60 s</td><td><code>POST /v1/ingest</code>. Bulk backfills are legitimate burst traffic; the monthly AI write quota — not this bucket — is what actually bounds inference.</td></tr>
<tr><td><code>read</code></td><td>240 / 60 s</td><td><code>GET /v1/memories</code>, <code>GET /v1/memories/:id</code>, and the MCP <code>list_memories</code> / <code>get_memory</code> / <code>whoami</code> tools. Reads cost database rows, not inference, so this is deliberately loose.</td></tr>
</table>
<h3>How a bucket is keyed</h3>
<p>A bucket describes the <b>authenticated actor and the project it is bound to</b> — the API key (or session) plus the managed project. It never includes the caller-selected <code>userId</code>. That is deliberate: if the sub-tenant id were part of the key, an SDK could rotate <code>userId</code> on every request and reset its own limit each time. One key serving a thousand end users shares one bucket.</p>
<div class="note"><b>These counters are protection, not accounting.</b> Cloudflare's rate limiting is eventually consistent, so the exact request at which a bucket trips is not deterministic. That is also why a 429 carries <code>ratelimit-limit</code> but no <code>ratelimit-remaining</code> or <code>ratelimit-reset</code> — publishing a remaining count we cannot compute would be a lie. Exact remaining figures exist only for the AI quota, which is counted in the database.</div>

<h2>What a 429 looks like</h2>
<pre><button class="copy">Copy</button><code>HTTP/2 429
retry-after: 60
ratelimit-limit: 60

{
  "error": "too_many_requests",
  "message": "Slow down a little — try again in a minute.",
  "retry_after_s": 60,
  "bucket": "save"
}</code></pre>
<p>Nothing was written. <code>bucket</code> tells you which limit you hit, so a client that saves and recalls in the same loop can slow down the half that is actually saturated.</p>
<p>Two other refusals share the 429 status and are worth distinguishing:</p>
<ul>
<li><code>queue_full</code> — up to 200 accepted-but-unfinished writes are allowed per memory space. Past that, new work is refused clearly rather than accepted invisibly. The body carries <code>queue_depth</code> and <code>retry_after_s</code> (30 s). This is backlog, not throttling: it clears as the queue drains, and <code>GET /v1/jobs</code> shows you what is in it.</li>
<li><code>ai_quota_exhausted</code> — the monthly AI budget below.</li>
</ul>

<h3>Recall is the exception: it degrades instead of failing</h3>
<div class="warn">A rate-limited <code>POST /v1/recall</code> returns <b>HTTP 200</b> with <code>ok: true</code>, an empty <code>context</code>, <code>count: 0</code>, and <code>recall_status: "rate_limited"</code>. Recall usually sits inside somebody's chat loop, where a hard error breaks the turn for no benefit. If your code reads "empty context" as "this user has no memory", check <code>recall_status</code> before you conclude anything.</div>

<h2>The AI write quota</h2>
<p>Rate buckets bound requests per minute. The AI write quota bounds <b>inference per month</b>, because inference is the part that scales with use.</p>
<table>
<tr><th>Property</th><th>Value</th></tr>
<tr><td>Unit</td><td><code>ai_writes</code> — one accepted write, however many model calls it took internally</td></tr>
<tr><td>Default allowance</td><td>1,000 per calendar month</td></tr>
<tr><td>Period</td><td>UTC calendar month; resets at 00:00 UTC on the 1st</td></tr>
<tr><td>Counted work</td><td>Saves and Playground chat</td></tr>
<tr><td>Not counted</td><td>Recall. Its inference share is small and the <code>recall</code> bucket already bounds it.</td></tr>
<tr><td>Identity</td><td>The authenticated <b>account</b>, not the memory subject — a rotated <code>userId</code> cannot reset the budget.</td></tr>
</table>
<p>Writes are the unit rather than tokens or neurons because a write count is exact, model-independent, and legible: "820 of 1,000 saves this month" means something to a person in a way that a token total does not.</p>
<h3>Reading your own usage</h3>
<pre><button class="copy">Copy</button><code>curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  "https://itsuki.app/v1/usage?range=30d"</code></pre>
<pre><button class="copy">Copy</button><code>{
  "ok": true,
  "totals": { "saves": 118, "recalls": 402, "memories": 94 },
  "quota": {
    "unit": "ai_writes",
    "used": 118,
    "limit": 1000,
    "remaining": 882,
    "period": "calendar_month_utc",
    "resets_at": "2026-09-01T00:00:00.000Z",
    "capped": false
  }
}</code></pre>
<p><code>GET /v1/limits</code> publishes the plan; <code>GET /v1/usage</code> publishes your consumption. The plan is public, so it needs no key; consumption is yours, so it does.</p>
<h3>What happens at the ceiling</h3>
<table>
<tr><th>Door</th><th>Behaviour</th></tr>
<tr><td><code>POST /v1/save</code>, <code>POST /v1/ingest</code></td><td><code>429</code> with <code>error: "ai_quota_exhausted"</code>, <code>capped: "monthly_ai"</code>, and a <code>usage</code> block carrying <code>used</code>, <code>limit</code>, and <code>resets_at</code>. Nothing was saved.</td></tr>
<tr><td><code>POST /v1/turn</code></td><td><code>200</code>. Recall still answers; <code>collect</code> reports <code>ok: false</code> with <code>capped: "monthly_ai"</code>. Refusing the whole request over a write quota would break the caller's chat loop for no saving.</td></tr>
<tr><td>MCP save tools</td><td>A tool result with <code>isError: true</code> and the reason as readable text, so the host model can relay it. The connection stays up.</td></tr>
</table>
<p>Two neighbouring states use the same status and mean different things:</p>
<ul>
<li><code>ai_capacity_paused</code> — a <b>service-wide</b> daily processing ceiling, not your account. Saves resume at 00:00 UTC. The wording is deliberately impersonal because nothing about it is specific to you.</li>
<li><code>ai_quota_unavailable</code> (<code>503</code>) — the quota could not be read, so the write was <b>refused rather than guessed at</b>. An unreadable quota means unbounded spend of unknown size, so this path fails closed. Nothing was saved; retry shortly.</li>
</ul>

<h2>Input size bounds</h2>
<h3>Conversation ingest — the published wire contract</h3>
<table>
<tr><th>Boundary</th><th>Limit</th><th>Violation</th></tr>
<tr><td>Messages in one request</td><td>30</td><td><code>422 ingest_message_count_exceeded</code></td></tr>
<tr><td>One message's <code>content</code></td><td>4,000 Unicode code points</td><td><code>422 ingest_message_characters_exceeded</code></td></tr>
<tr><td>Combined message content</td><td>120,000 Unicode code points</td><td><code>422 ingest_total_characters_exceeded</code></td></tr>
<tr><td>Complete serialized request</td><td>512 KiB of actual UTF-8 JSON</td><td><code>413 ingest_request_too_large</code></td></tr>
</table>
<p>Characters are counted as Unicode <i>code points</i>, not UTF-16 units, and the byte ceiling is measured on the real serialized body — neither can be bypassed with multibyte text or JSON escape sequences. Every violation is atomic: nothing was queued, and the response carries the full <code>limits</code> object so a batcher can re-plan in one pass.</p>
<h3>Other write doors</h3>
<table>
<tr><th>Boundary</th><th>Limit</th></tr>
<tr><td><code>content</code> on <code>POST /v1/save</code></td><td>120,000 characters — past this the extractor cannot do anything useful anyway</td></tr>
<tr><td><code>query</code> on <code>POST /v1/recall</code></td><td>8,000 characters — a recall query is a question, not a document</td></tr>
<tr><td>Serialized body on save, recall, and turn</td><td>512 KiB of UTF-8 JSON</td></tr>
</table>
<h3>Internal engine boundaries</h3>
<p>These are downstream safeguards, not fields on the limits endpoint. You cannot set them, but knowing they exist explains why a very large batch is reshaped rather than rejected:</p>
<table>
<tr><th>Boundary</th><th>Limit</th></tr>
<tr><td>One downstream extraction queue entry</td><td>20 messages and 12,000 Unicode code points</td></tr>
<tr><td>Complete serialized chat-model input</td><td>At most 24,576 UTF-8 bytes</td></tr>
</table>
<p>The model-input ceiling is a byte guard on the whole serialized input, derived from each model's documented context window minus reserves for output and the provider's chat template. When bounding is needed, older non-system turns give way first and every omission is labelled; the newest source material is preserved preferentially. Fixed prompt and schema data is never silently cut — if that alone cannot fit, the call fails before inference rather than sending a truncated instruction.</p>

<h2>Handling limits gracefully</h2>
<ol>
<li><b>Fetch <code>GET /v1/limits</code> once at startup</b> and size your batches from it. Constants copied into a client go stale silently; a fetched document does not.</li>
<li><b>Send an <code>idempotencyKey</code> on every write you might retry.</b> The same key is processed at most once, so a retry after a 429 or a timeout cannot produce a second save. Reusing a key for <i>different</i> content is a <code>409</code>, which is the check working.</li>
<li><b>Honour <code>retry-after</code>.</b> It is present on every 429 and on the 503 paths. Prefer it to your own backoff curve, and cap the whole sequence with your own deadline.</li>
<li><b>Separate throttling from exhaustion.</b> <code>too_many_requests</code> and <code>queue_full</code> clear in seconds. <code>ai_quota_exhausted</code> clears at the start of next month — spinning on it wastes round trips. Branch on <code>code</code>, hold the work, and use <code>resets_at</code>.</li>
<li><b>Watch the backlog, not just the errors.</b> <code>GET /v1/ops/overview</code> reports <code>backlog.depth</code> and <code>backlog.oldest_age_ms</code> across your whole account, so you can slow down before you hit <code>queue_full</code>.</li>
</ol>
<pre><button class="copy">Copy</button><code>import os, time
from itsuki import MemoryClient, MemoryAPIError

memory = MemoryClient(api_key=os.environ["ITSUKI_API_KEY"])

try:
    memory.add("The design review moved to October.",
               user_id="ada",
               idempotency_key=MemoryClient.new_idempotency_key())
except MemoryAPIError as error:
    if error.code == "ai_quota_exhausted":
        hold_until(error.body["usage"]["resets_at"])   # terminal this month
    elif error.status == 429:
        time.sleep(error.retry_after or 60)            # transient
    else:
        raise</code></pre>
<p>Both SDKs implement rule 2 and rule 3 for you: reads always retry, writes retry only when you passed an idempotency key, the delay comes from <code>retry-after</code> when the server sent one, and the whole sequence is bounded by a single request budget.</p>

<h2>Related</h2>
<ul>
<li><a href="#/api/errors">Errors</a> — every code above, with the body fields each one carries.</li>
<li><a href="#/api/rest">REST API reference</a> — the endpoints these limits apply to.</li>
<li><a href="#/operate/observability">Monitoring &amp; diagnostics</a> — backlog, stuck jobs, retries, and latency across your account.</li>
<li><a href="#/privacy">Privacy &amp; limits</a> — the short summary table.</li>
</ul>
` };

PAGES["/api/webhooks"] = { title: "Webhooks", html: `
<h1>Webhooks</h1>
<p class="lede">A signed POST to your endpoint when memory changes, so you can stop polling for work that finishes seconds after you accepted it.</p>
<p>Saving is asynchronous. <code>POST /v1/save</code> accepts your write and hands back a packet handle; extraction, enrichment and the graph write happen behind it. You can poll <code>GET /v1/packets/&lt;source_packet_id&gt;/status</code> or <code>GET /v1/jobs</code> and many integrations should — polling is simple and needs no public endpoint. A webhook is the better shape when you have somewhere for the news to land: a queue to feed, a cache to invalidate, a UI to refresh, an audit log to append to.</p>
<div class="note"><b>Webhooks are standing configuration, so they are session-only.</b> Creating, testing and deleting them requires a signed-in dashboard session with the <code>project.integrations.manage</code> capability; a Bearer API key gets <code>401</code>. That is deliberate — a leaked API key must not be able to point your memory events somewhere new. Reading the list needs <code>project.integrations.view</code>, and the <b>Webhooks</b> tab appears in the app only for roles that hold it.</div>

<h2>Create one</h2>
<p>In the app, open <b>Webhooks</b>, give it a name and an endpoint URL, choose the events, and submit. Over HTTP the same thing is <code>POST /v1/webhooks</code>:</p>
<pre><button class="copy">Copy</button><code>POST /v1/webhooks
{
  "name": "CRM sync",
  "url": "https://example.com/hooks/itsuki",
  "events": ["memory.added", "memory.enriched", "memory.failed"],
  "metadataOnly": false
}</code></pre>
<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>url</code></td><td>Required. HTTPS, no embedded credentials, no fragment, at most 2,048 characters.</td></tr>
<tr><td><code>name</code></td><td>Optional label, trimmed to 80 characters. Defaults to <code>Webhook</code>.</td></tr>
<tr><td><code>events</code></td><td>Optional. Any subset of the events below. Omit it — or send only unrecognised values — and you are subscribed to all of them.</td></tr>
<tr><td><code>metadataOnly</code></td><td>Optional. <code>true</code> strips everything that could carry the person's words: you get kind, counts and ids, never labels or text. <code>metadata_only</code> is accepted as a spelling.</td></tr>
</table>
<p>Any other key is refused with <code>400 unknown_webhook_field</code> naming it. The response is <code>201</code>:</p>
<pre><button class="copy">Copy</button><code>{
  "webhook": {
    "id": "wh_5f2b…",
    "name": "CRM sync",
    "display_url": "https://example.com/…",
    "events": ["memory.added", "memory.enriched", "memory.failed"],
    "metadata_only": false,
    "status": "active",
    "created_at": 1786144473072,
    "secret_hint": "whsec_ab1c…9f4c"
  },
  "secret": "whsec_…"
}</code></pre>
<div class="warn"><b>The signing secret appears exactly once</b>, in this response. Only a hint is stored for display afterwards. Lose it and you must delete the webhook and create a new one. You can have up to <b>10</b> active webhooks; the eleventh is refused with a message telling you to delete one first.</div>

<h2>Events</h2>
<table>
<tr><th>Event</th><th>Fires when</th></tr>
<tr><td><code>memory.added</code></td><td>A write landed and created something — nodes, details, events, or edges.</td></tr>
<tr><td><code>memory.updated</code></td><td>A write landed that only updated existing memories or superseded details.</td></tr>
<tr><td><code>memory.enriched</code></td><td>An accepted write reached its terminal state successfully. Exactly one lifecycle event per accepted write.</td></tr>
<tr><td><code>memory.failed</code></td><td>That same accepted write ended in failure instead. Never both.</td></tr>
<tr><td><code>memory.deleted</code></td><td>An object was deleted through <code>POST /v1/actions/delete-object</code>, or a memory space was cleared through <code>POST /v1/actions/delete-all</code>.</td></tr>
<tr><td><code>memory.categorized</code></td><td>A pending suggestion was promoted or merged into real memory.</td></tr>
</table>
<p><code>memory.added</code>/<code>memory.updated</code> and <code>memory.enriched</code>/<code>memory.failed</code> describe the same write from two angles: the first pair says what changed in the graph, the second says that the accepted job is finished. Subscribe to the lifecycle pair if you are tracking work you submitted; subscribe to the content pair if you are mirroring state.</p>
<div class="note"><b>Writes under a sub-tenant announce twice.</b> A save made with a <code>userId</code> fires to that memory space's webhooks <i>and</i> to the owning account's, because a derived sub-tenant owns no configuration of its own. Both deliveries carry the same event id, so a receiver that de-duplicates on <code>id</code> handles it correctly.</div>

<h2>The payload</h2>
<pre><button class="copy">Copy</button><code>POST /hooks/itsuki
content-type: application/json
user-agent: itsuki-webhooks/1.0
x-itsuki-event: memory.added
x-itsuki-webhook-id: wh_5f2b…
x-itsuki-signature: t=1786144473072,v1=9c1f…

{
  "id": "evt_2b6c…",
  "event": "memory.added",
  "created_at": 1786144473072,
  "metadata_only": false,
  "data": {
    "source": "ingest",
    "receipt_id": "rcp_…",
    "project_id": "atlas",
    "project_name": "Atlas",
    "counts": { "nodes": 1, "updated_nodes": 0, "slices": 2, "events": 1, "edges": 3 },
    "new_node_labels": ["Kotlin"]
  }
}</code></pre>
<p>The envelope — <code>id</code>, <code>event</code>, <code>created_at</code>, <code>metadata_only</code>, <code>data</code> — is the same for every event. Only <code>data</code> differs. <code>source</code> is the label the write carried (the <code>source</code> you sent on the request, or the door's own default), which is also what <code>DELETE /v1/memories?source=…</code> later filters on.</p>
<h3>Lifecycle payloads</h3>
<p><code>memory.enriched</code> and <code>memory.failed</code> carry ids and counts only, never memory content:</p>
<pre><button class="copy">Copy</button><code>{
  "job_id": "job_…",
  "source_packet_id": "sp_…",
  "receipt_id": "rcp_…",
  "status": "failed",
  "counts": null,
  "project_id": null,
  "project_name": null,
  "error": "extraction failed after bounded repairs"
}</code></pre>
<h3>Metadata-only mode</h3>
<p>With <code>metadataOnly: true</code>, <code>data</code> is reduced to a fixed set of non-content fields — <code>source</code>, <code>counts</code>, <code>receipt_id</code>, <code>job_id</code>, <code>source_packet_id</code>, <code>status</code>, <code>project_id</code> — and <code>metadata_only</code> in the envelope is <code>true</code>. Labels like <code>new_node_labels</code> never appear. Use it when the endpoint is a queue, a metrics pipe, or anything outside the trust boundary you already grant your memory.</p>

<h2>Verifying the signature</h2>
<p>Every delivery is signed with that webhook's own secret. The header is <code>x-itsuki-signature: t=&lt;milliseconds&gt;,v1=&lt;hex&gt;</code>, where the hex is an HMAC-SHA-256 over the string <code>&lt;t&gt;.&lt;raw body&gt;</code>.</p>
<pre><button class="copy">Copy</button><code>import crypto from "node:crypto";

// rawBody must be the exact bytes received — parse JSON only after verifying.
function verify(rawBody, header, secret, toleranceMs = 5 * 60 * 1000) {
  const parts = Object.fromEntries(
    String(header || "").split(",").map((kv) =&gt; kv.split("=")),
  );
  const t = Number(parts.t);
  if (!Number.isFinite(t)) return false;
  if (Math.abs(Date.now() - t) &gt; toleranceMs) return false;   // replay window

  const expected = crypto
    .createHmac("sha256", secret)
    .update(t + "." + rawBody)
    .digest("hex");

  const a = Buffer.from(expected, "utf8");
  const b = Buffer.from(String(parts.v1 || ""), "utf8");
  return a.length === b.length &amp;&amp; crypto.timingSafeEqual(a, b);
}</code></pre>
<ul>
<li><b>Verify before parsing.</b> Sign over the raw bytes; re-serializing the JSON changes them.</li>
<li><b>Compare in constant time.</b> A byte-by-byte comparison leaks the signature one character at a time.</li>
<li><b>Choose your own <code>t</code> tolerance.</b> The timestamp is signed so you <i>can</i> reject replays; Itsuki does not impose a window on your behalf, so pick one and enforce it.</li>
<li><b>De-duplicate on the envelope <code>id</code>.</b> Retries and sub-tenant fan-out both mean a receiver can legitimately see the same event id more than once.</li>
</ul>

<h2>Delivery and retries</h2>
<p>Delivery is asynchronous and can never affect the save that triggered it: the event row is written durably, then the HTTP attempt runs off the request path. A dead endpoint slows nothing down for the caller who saved.</p>
<table>
<tr><th>Property</th><th>Value</th></tr>
<tr><td>Attempts</td><td>3</td></tr>
<tr><td>Delays before each attempt</td><td>0 s, 5 s, 15 s</td></tr>
<tr><td>Per-attempt timeout</td><td>10 s</td></tr>
<tr><td>Success</td><td>Any 2xx. The delivery is marked <code>delivered</code> and stops.</td></tr>
<tr><td>Retried</td><td>Non-2xx responses, timeouts, and connection failures.</td></tr>
<tr><td>Not retried</td><td>A 3xx redirect. Your endpoint must be the exact registered origin, so a redirect ends the delivery — following it would forward the signature headers to a host you did not register.</td></tr>
</table>
<p>A delivery moves through <code>pending</code> → <code>dispatching</code> → <code>delivered</code> or <code>failed</code>. A background sweep runs every five minutes and re-dispatches rows still <code>pending</code>, and returns any row stuck in <code>dispatching</code> for more than two minutes back to <code>pending</code> — so a delivery is not lost if the isolate handling it died mid-flight. Once a delivery is marked <code>failed</code>, that is terminal: the sweep does not resurrect it, and there is no replay endpoint. Treat webhooks as a fast notification channel and <code>GET /v1/jobs</code> as the authoritative ledger.</p>
<p>The target URL is re-checked immediately before every attempt, not just at registration, and the webhook must still be active and belong to a live account. If either check fails the delivery stops with <code>webhook_inactive</code> or the URL problem as its error.</p>

<h2>Inspecting deliveries</h2>
<pre><button class="copy">Copy</button><code>GET /v1/webhooks                        # your active webhooks
GET /v1/webhooks/&lt;id&gt;/deliveries        # the 50 most recent, newest first
POST /v1/webhooks/&lt;id&gt;/test             # queue one synthetic memory.added
DELETE /v1/webhooks/&lt;id&gt;                # permanent</code></pre>
<pre><button class="copy">Copy</button><code>{
  "deliveries": [
    { "id": "whd_…", "event": "memory.added", "status": "delivered",
      "attempts": 1, "response_code": 200, "error": null,
      "created_at": 1786144473072, "delivered_at": 1786144473600 },
    { "id": "whd_…", "event": "memory.enriched", "status": "failed",
      "attempts": 3, "response_code": 502, "error": "endpoint answered 502",
      "created_at": 1786144100000, "delivered_at": null }
  ]
}</code></pre>
<p><code>error</code> is deliberately narrow: <code>endpoint answered &lt;code&gt;</code>, <code>delivery_timeout</code>, a URL-rule sentence, or the generic <code>delivery_failed</code>. Nothing from your endpoint's response body is stored or echoed.</p>
<p>The test delivery only works if the webhook is subscribed to <code>memory.added</code>; otherwise it answers <code>404 not_found</code> rather than inventing an event the webhook did not ask for. It carries an obvious synthetic payload (<code>source: "webhook_test"</code>, <code>new_node_labels: ["Webhook test"]</code>) so it can never be mistaken for a real memory.</p>

<h2>URL rules</h2>
<p>These are enforced when you register and again at every delivery attempt, because a rule checked only at registration is a rule that a later database edit can bypass.</p>
<table>
<tr><th>Rule</th><th>Why</th></tr>
<tr><td>HTTPS only</td><td>The payload can carry memory content.</td></tr>
<tr><td>No <code>user:pass@</code> in the URL</td><td>Credentials in a stored URL are credentials in a database row.</td></tr>
<tr><td>No fragment</td><td>A fragment is never sent, so accepting one would be silently misleading.</td></tr>
<tr><td>No private or internal addresses</td><td><code>localhost</code>, <code>.local</code>, <code>.internal</code>, RFC 1918 ranges, loopback, link-local (including cloud metadata), CGNAT, and IPv6 unique-local and loopback. Otherwise a registration turns the service into an internal-network probe.</td></tr>
<tr><td>Not <code>itsuki.app</code> or <code>*.workers.dev</code></td><td>A webhook that posts back into the API would loop.</td></tr>
<tr><td>1–2,048 characters</td><td>Bounded storage.</td></tr>
</table>
<p>A rejected URL returns <code>400 invalid_webhook</code> with the specific reason in <code>message</code>.</p>

<h2>What webhooks do not do</h2>
<p>Stated plainly, because designing around an assumption that turns out to be false is expensive:</p>
<ul>
<li><b>They are not a delete audit trail.</b> Only the two control actions listed above emit <code>memory.deleted</code>. The main <code>DELETE /v1/memories</code> route — the one to build on — does not. Use its response and <a href="#/concepts/delete">Delete &amp; erasure</a> for deletion accounting.</li>
<li><b>They are not ordered.</b> Each delivery retries on its own clock, so two events for the same memory can arrive out of order. Use <code>created_at</code> and the object's revision, not arrival order.</li>
<li><b>They are not exactly-once.</b> Retries and sub-tenant fan-out both duplicate. De-duplicate on the envelope <code>id</code>.</li>
<li><b>There is no replay endpoint.</b> A failed delivery stays failed. Reconcile from <code>GET /v1/jobs</code> or <code>GET /v1/receipts</code>.</li>
<li><b>The secret cannot be rotated in place.</b> Delete the webhook and create a new one.</li>
</ul>

<h2>Related</h2>
<ul>
<li><a href="#/operate/observability">Monitoring &amp; diagnostics</a> — the polling side: jobs, packet status, and account-wide health.</li>
<li><a href="#/api/errors">Errors</a> — including <code>unknown_webhook_field</code>, <code>invalid_webhook</code>, and why a Bearer key gets <code>401</code> here.</li>
<li><a href="#/concepts/receipts">Receipts &amp; rules</a> — what the counts in a <code>memory.added</code> payload actually mean.</li>
<li><a href="#/api/auth">Authentication &amp; keys</a> — why a <code>whsec_</code> secret is not an API key.</li>
</ul>
` };

<h1>FAQ</h1>
<p class="lede">The questions developers actually ask before they wire memory into something real, answered short, with a link to the page that goes deeper.</p>

<h2>Privacy and data</h2>

<h3>Is my memory used to train AI models?</h3>
<p>No — not ours, not anyone's. Content sent for inference is used to produce the response you asked for and nothing else. It is not a setting you have to find; it is how the service works. Read the full commitment on <a href="https://itsuki.app/ai-data" target="_blank" rel="noopener">AI &amp; your data</a>.</p>

<h3>Who else sees my content?</h3>
<p>All AI inference — extraction, embeddings, reranking, summaries, previews — runs on Cloudflare Workers AI, inside the same network that hosts the database. No separate AI vendor receives your content. Google and GitHub appear only as sign-in providers and never see memory. Operational metadata (sign-in events, save and recall counts, errors) is visible to the operator for support; memory content is not browsed. See <a href="#/privacy">Privacy &amp; limits</a>.</p>

<h3>Should I put secrets in memory?</h3>
<p>No. There is secret redaction before storage — it catches labelled credentials like <i>"api key is …"</i> or <i>"password: …"</i> and common key formats — but it is a safety net, not a guarantee. An unlabelled high-entropy string, or a passphrase made of ordinary words, can still be stored. Treat memory as a store you write to deliberately.</p>

<h2>How it behaves</h2>

<h3>What happens if extraction gets something wrong?</h3>
<p>You fix it, and the fix is recorded. Every save returns a <b>receipt</b> saying what was written, updated and skipped, so a wrong extraction is visible rather than silent. <code>PATCH /v1/memories/&lt;id&gt;</code> corrects the editable fields under a revision precondition, the previous content is retained as immutable history, and <code>POST /v1/memories/&lt;id&gt;/rollback</code> restores an earlier revision as a new forward revision. If a whole class of thing should never have been captured, change the extraction rules instead of playing whack-a-mole. See <a href="#/concepts/receipts">Receipts &amp; rules</a>.</p>

<h3>I just saved something and recall can't find it. Is it broken?</h3>
<p>Almost certainly not — extraction is asynchronous. <code>POST /v1/save</code> returns once the write is <i>accepted</i>, and enrichment continues behind a packet handle. Allow a few seconds, or stop guessing entirely: poll <code>GET /v1/packets/&lt;source_packet_id&gt;/status</code>, or subscribe to the <code>memory.enriched</code> and <code>memory.failed</code> events on <a href="#/api/webhooks">Webhooks</a>. "Accepted" and "enriched" are different states and the API never conflates them.</p>

<h3>How fast is recall?</h3>
<p>Faster than a save, and for a structural reason: recall never runs the extraction model. It embeds the query, runs several ranking lanes over rows already filtered by scope in SQL, and optionally reranks with a cross-encoder — no chat-model generation in the path. Saves are slower because their latency is dominated by that model call. We do not publish a single latency number; measure your own with <code>latency_ms.p50</code> and <code>p95</code> in <code>GET /v1/ops/overview</code>, described on <a href="#/operate/observability">Monitoring &amp; diagnostics</a>.</p>

<h3>Why is the recalled context so short?</h3>
<p>Because that is the product. The default context block is bounded at roughly 1,800 characters across at most six memories and four conversation pages. Memory should sharpen a prompt, not flood it — widening the block surfaces more evidence and makes the answer worse, which is the failure the bound exists to avoid. Ask a narrower question, or use <code>recallScope</code> to aim at one project.</p>

<h3>Will Claude or ChatGPT save automatically once I connect the MCP link?</h3>
<p>No. Over MCP, the host model decides when to call a tool; Itsuki provides the tools and cannot force a call. An installed connector is not proof that anything was saved. If you need a guaranteed write per turn, call <code>POST /v1/turn</code> from your own runtime and inspect its collect receipt and packet status. See <a href="#/api/mcp">MCP tools</a>.</p>

<h2>Architecture questions</h2>

<h3>How is this different from a vector database?</h3>
<p>A vector database stores embeddings of chunks and returns nearest neighbours. Itsuki stores <b>structured objects</b> — memories, details, dated events, conversation pages, and the edges between them — and uses vector search as one ranking lane among several, alongside lexical matching and graph expansion, then optionally reranks the fused list. The difference you feel is everything the structure makes possible: an object has a revision and a history you can roll back, a receipt explaining why it exists, a category, a scope, and a delete that means something. Recall also returns a prompt-ready <code>context</code> string rather than a list of chunks for you to assemble. See <a href="#/concepts/memory">How memory works</a>.</p>

<h3>How is this different from just replaying the transcript?</h3>
<p>Chat history is not memory. Messages are source material; Itsuki keeps the meaning that should outlive the conversation and drops the rest. That is why a save can legitimately store nothing — and why the receipt tells you what was skipped and why, rather than leaving you to guess.</p>

<h3>Can one API key serve many end users?</h3>
<p>Yes. Add <code>userId</code> to any call and each value gets an isolated memory space inside your account: nothing saved under one value is reachable from another, on save or on recall. The value is yours to pick and is hashed with your account id before it becomes a storage key, so the same string under two different API keys still resolves to two unrelated spaces. Note that a misspelled key is rejected, not ignored — <code>usr_id</code> returns a <code>400</code> naming it, because silently dropping it is how someone ships a multi-tenant app believing isolation worked.</p>

<h3>What is the difference between an API key and an MCP link?</h3>
<p>Both start with <code>itsuki_live_</code> and both are secrets. An API key goes in an <code>authorization: Bearer</code> header. An MCP link is a token created as a link and pasted as a URL, because that is what chat clients can carry. Paste one where the other belongs and the server says so by name. Details on <a href="#/api/auth">Authentication &amp; keys</a>.</p>

<h2>Deleting, keeping, and leaving</h2>

<h3>What actually happens when I delete?</h3>
<p>It depends on what you asked for. A delete that names a source or a time window is curation: it removes what matched, and work already in flight still lands afterwards. A <b>confirmed delete with no source and no window</b> is an erasure: it records a barrier timestamp, sweeps repeatedly until nothing new is arriving, and cancels accepted-but-uncommitted saves so they cannot reappear. Deletes preview by default and only <code>confirm=true</code> destroys. Full mechanics on <a href="#/concepts/delete">Delete &amp; erasure</a>.</p>

<h3>How long is my memory kept?</h3>
<p>Until you delete it. There is no default expiry. If you want one, retention policies are configurable per class — playground transcripts, source episodes, semantic memory, export blobs, webhook deliveries, operational records — each set independently in days, previewed before it applies. Security audit records are locked and cannot be shortened.</p>

<h3>Can I get everything out?</h3>
<p>Yes. <code>GET /v1/export</code> streams a complete JSON export of the memory space that credential and request resolve to. Note the boundary: it exports <i>that</i> space, not every sub-tenant space in the project. Keep exports of anything critical — this is an early product.</p>

<h2>Running it</h2>

<h3>What happens when I hit a limit?</h3>
<p>A rate bucket or a full queue returns <code>429</code> with <code>retry-after</code>; both clear in seconds. An exhausted monthly quota also returns <code>429</code>, but it is terminal until the month rolls over, so hold the work rather than spinning — the body carries <code>resets_at</code>. <code>POST /v1/turn</code> and recall deliberately degrade to <code>200</code> instead of failing, and say so in the body. Branch on <code>code</code>, never on <code>message</code>. See <a href="#/api/errors">Errors</a>.</p>

<h3>Can I self-host?</h3>
<p>The repository is public and Apache-2.0 licensed, and the whole service runs on Cloudflare — Workers, D1, Vectorize, Workers AI, Durable Objects — so a deployment is <code>npx wrangler d1 migrations apply</code> followed by <code>npx wrangler deploy</code> against your own account. It is not a packaged, supported distribution: you own the configuration, the model choices, the migrations, and the operational burden, and the hosted service is what the rest of these docs describe. The <a href="https://github.com/12ziyad/universal-memory-engine" target="_blank" rel="noopener">README</a> has the local-development and configuration steps.</p>

<h3>Something is behaving strangely. What do you need from me?</h3>
<p>The <code>x-request-id</code> from the failing response. Every response carries one, and it ties your call to the server-side capture without anyone reading your memory content. Every server error is already reported automatically on our side. Before you write in, <code>GET /v1/requests</code> and <code>GET /v1/jobs</code> often answer it themselves; if a Claude Code or Codex plugin is involved, run its doctor first. Then reach us at <a href="mailto:hello@itsuki.app">hello@itsuki.app</a>.</p>

<h2>Related</h2>
<ul>
<li><a href="#/quickstart">Quickstart</a> — zero to a working memory in about five minutes.</li>
<li><a href="#/concepts/memory">How memory works</a> · <a href="#/concepts/scope">Who memory belongs to</a> — the two concepts most of these answers rest on.</li>
<li><a href="#/api/rest">REST API reference</a> — every endpoint named above.</li>
<li><a href="#/privacy">Privacy &amp; limits</a> — the short version we hold ourselves to.</li>
</ul>
` };

<h1>POST /v1/save</h1>
<p class="lede">Write one durable fact, or a batch of conversation turns, and get back a receipt saying what was actually stored.</p>

<table>
<tr><th>Method</th><td><code>POST</code></td></tr>
<tr><th>Path</th><td><code>${ORIGIN}/v1/save</code></td></tr>
<tr><th>Auth</th><td>API key or MCP link as <code>Authorization: Bearer</code>, or a signed-in session</td></tr>
<tr><th>Scope</th><td><code>memory:write</code></td></tr>
<tr><th>Rate bucket</th><td><code>save</code> \u2014 60 requests per 60 seconds</td></tr>
<tr><th>Max body</th><td>524,288 bytes of serialized UTF-8 JSON</td></tr>
</table>

<div class="note"><b>Routes match exactly.</b> There is no trailing-slash tolerance and no prefix matching, so <code>/v1/save/</code> returns <code>404</code>.</div>

<h2>Two modes</h2>
<p>The <code>mode</code> field selects between them. Only the exact string <code>"conversation"</code> takes the conversation path \u2014 anything else, including a typo or an absent field, is a direct save. There is no error for an unrecognised mode, so check your spelling.</p>

<h3>Direct save</h3>
<p>You already know the fact. Send it as <code>content</code>.</p>
${codeBlock(`curl -X POST ${ORIGIN}/v1/save \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"content": "We chose Postgres for the new service."}'`, "terminal")}

<h3>Conversation</h3>
<p>You have chat turns and want ${PRODUCT.name} to decide what is worth keeping.</p>
${codeBlock(`curl -X POST ${ORIGIN}/v1/save \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{
    "mode": "conversation",
    "conversationId": "chat-42",
    "messages": [
      { "role": "user", "content": "We decided on Postgres for the new service." },
      { "role": "assistant", "content": "Noted - Postgres it is." }
    ]
  }'`, "terminal")}

<h2>Request fields</h2>
<h3>Direct save</h3>
<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>content</code></td><td>string</td><td>Yes</td><td>Must be non-empty after trimming. Maximum 120,000 characters.</td></tr>
<tr><td><code>recentContext</code></td><td>string</td><td>No</td><td>Surrounding context used only to resolve references like &ldquo;it&rdquo;. Never extracted as memory itself.</td></tr>
</table>
<p><code>messages</code>, <code>scope</code>, <code>n</code> and <code>topic</code> are ignored on this path.</p>

<h3>Conversation mode</h3>
<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>mode</code></td><td>string</td><td>Yes</td><td>Exactly <code>"conversation"</code>.</td></tr>
<tr><td><code>messages</code></td><td>array</td><td>Yes</td><td>Objects of <code>{ role, content }</code>, oldest first. Combined content is capped at 120,000 characters.</td></tr>
<tr><td><code>scope</code></td><td>string</td><td>No</td><td><code>full</code>, <code>lastN</code>, <code>topic</code> or <code>summary</code>. An unrecognised value is a silent no-op, not an error.</td></tr>
<tr><td><code>n</code></td><td>number</td><td>No</td><td>With <code>scope: "lastN"</code>, keeps the last <code>n</code> messages.</td></tr>
<tr><td><code>topic</code></td><td>string</td><td>No</td><td>Keeps assistant messages plus user messages mentioning the topic.</td></tr>
</table>

<h3>Accepted on both</h3>
<table>
<tr><th>Field</th><th>Type</th><th>Notes</th></tr>
<tr><td><code>userId</code></td><td>string</td><td>Selects an isolated memory space for one of your end users. See <a href="#/api/auth">Authentication &amp; keys</a>.</td></tr>
<tr><td><code>memoryScope</code></td><td>object</td><td><code>projectId</code> (\u2264 160 characters, no control characters) and <code>projectName</code> for provenance. Omit <code>projectId</code> for account-global writes.</td></tr>
<tr><td><code>conversationId</code></td><td>string</td><td>Groups turns. Re-sends with the same value converge onto one conversation page instead of making a new one each time.</td></tr>
<tr><td><code>threadId</code>, <code>sourceId</code></td><td>string</td><td>Your own provenance identifiers. <code>sourceId</code> also feeds the default idempotency key.</td></tr>
<tr><td><code>idempotencyKey</code></td><td>string</td><td>Safe retries. Derived from the content when you omit it.</td></tr>
<tr><td><code>source</code></td><td>string</td><td>Your own label, 1\u201364 characters, no control characters. This is the value <code>DELETE /v1/memories?source=\u2026</code> filters on.</td></tr>
</table>

<div class="note"><b>An unknown field is refused, never ignored.</b> Send <code>usr_id</code> and you get a <code>400</code> naming it and suggesting the nearest accepted field; if nothing is close, the message lists every field the endpoint accepts. Common alternate spellings such as <code>user_id</code> are accepted as aliases \u2014 but sending both an alias and its canonical name is a <code>400</code> as well, because the two could disagree.</div>

<h2>Response</h2>
<p>A direct save waits for the real extraction result before answering, so the body reports what was stored rather than merely that the request arrived.</p>
${outputBlock(`{
  "ok": true,
  "mode": "direct_save",
  "fired": true,
  "processing": false,
  "summary": "Saved: 2 fact(s) across 1 page.",
  "source_packet_id": "sp_9f2c1d4a",
  "receipt_id": "receipt_door_sp_9f2c1d4a",
  "counts": {
    "received": 1, "savedTotal": 4, "pages": 1, "nodes": 2,
    "slices": 2, "events": 1, "edges": 1, "candidates": 0, "skipped": 0
  },
  "memory_scope": { "project_id": null, "project_name": null }
}`)}

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>summary</code></td><td>A sentence safe to show a user. It never claims an acceptance that did not happen.</td></tr>
<tr><td><code>fired</code></td><td>Extraction actually ran.</td></tr>
<tr><td><code>processing</code></td><td><code>true</code> when the write was accepted but the final receipt had not landed inside the wait budget. Not a failure \u2014 poll the packet.</td></tr>
<tr><td><code>source_packet_id</code></td><td>The public handle for this write. Pass it to <code>GET /v1/packets/&lt;id&gt;/status</code>.</td></tr>
<tr><td><code>counts.savedTotal</code></td><td>Objects written. Zero is a legitimate outcome.</td></tr>
</table>

<div class="note"><b>A save that stores nothing is still a successful save.</b> Questions, small talk and repeats come back <code>ok: true</code> with <code>savedTotal: 0</code> and a reason such as <i>&ldquo;nothing durable here (chatter, a question, or a duplicate)&rdquo;</i>. Branch on the counts, not on the status code.</div>

<h3>Replays</h3>
<p>Resending an identical request with the same idempotency key returns <code>200</code> with <code>"duplicate": true</code> and an honest summary of what the <i>original</i> attempt did \u2014 including &ldquo;not saved&rdquo; if the first attempt skipped it.</p>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>unknown_parameter</code></td><td>A field the endpoint does not accept. The message names it.</td></tr>
<tr><td>400</td><td><code>conflicting_parameters</code></td><td>An alias and its canonical name were both sent.</td></tr>
<tr><td>400</td><td><code>invalid_json</code> / <code>invalid_body</code></td><td>Malformed JSON, or a body that is not a JSON object.</td></tr>
<tr><td>400</td><td><code>payload_too_large</code></td><td><code>content</code> or combined message content over 120,000 characters.</td></tr>
<tr><td>400</td><td><code>invalid_project_id</code></td><td><code>memoryScope.projectId</code> is not a string, is empty, has surrounding whitespace, or contains control characters.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential. The message hints at what you sent instead.</td></tr>
<tr><td>403</td><td><code>insufficient_scope</code></td><td>The key lacks <code>memory:write</code>, or your project role cannot write.</td></tr>
<tr><td>409</td><td><code>idempotency_conflict</code></td><td>The key is already bound to different content. Mint a new one.</td></tr>
<tr><td>413</td><td><code>request_too_large</code></td><td>The serialized body exceeds 524,288 bytes.</td></tr>
<tr><td>422</td><td><code>extraction_failed_terminal</code></td><td>Deliberately not acceptance-shaped, so a queueing client quarantines rather than discarding its durable copy.</td></tr>
<tr><td>429</td><td><code>too_many_requests</code></td><td>The <code>save</code> bucket tripped. Honour <code>retry-after</code>.</td></tr>
<tr><td>429</td><td><code>queue_full</code></td><td>Too many active jobs for this memory space. Retry after the hint.</td></tr>
<tr><td>500</td><td><code>something_went_wrong</code></td><td>Reported automatically on our side. Quote the <code>x-request-id</code>.</td></tr>
</table>
<p>Branch on <code>error</code>, never on <code>message</code> \u2014 the codes are contractual and the wording is not. Every response carries an <code>x-request-id</code>.</p>

${nextSteps([

	["#/api/errors", "Errors", "Every code and what to do about it."],
])}
` };

PAGES["/api/recall"] = { title: "POST /v1/recall", html: `
<h1>POST /v1/recall</h1>
<p class="lede">Ask a question and get back a compact context block \u2014 the same text a connected AI receives \u2014 plus the ranked items behind it.</p>

<table>
<tr><th>Method</th><td><code>POST</code></td></tr>
<tr><th>Path</th><td><code>${ORIGIN}/v1/recall</code></td></tr>
<tr><th>Auth</th><td>API key or MCP link as <code>Authorization: Bearer</code>, or a signed-in session</td></tr>
<tr><th>Scope</th><td><code>memory:read</code> (also satisfied by <code>memory:write</code>)</td></tr>
<tr><th>Rate bucket</th><td><code>recall</code> \u2014 120 requests per 60 seconds</td></tr>
<tr><th>Timing</th><td>Fully synchronous. Nothing is deferred.</td></tr>
</table>

<h2>Request</h2>
${codeBlock(`curl -X POST ${ORIGIN}/v1/recall \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"query": "what database did we choose?"}'`, "terminal")}

<table>
<tr><th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr>
<tr><td><code>query</code></td><td>string</td><td>Yes</td><td>A question, not a document. Maximum 8,000 characters. An empty string is accepted and returns no recall rather than an error.</td></tr>
<tr><td><code>limit</code></td><td>integer</td><td>No</td><td>Between 1 and 200. Must be a whole number \u2014 a float or a numeric string is rejected, never silently rounded or clamped.</td></tr>
<tr><td><code>recallScope</code></td><td>string</td><td>No</td><td><code>global</code> (default), <code>project_only</code>, or <code>project_then_global</code>. Any other value is an error.</td></tr>
<tr><td><code>memoryScope</code></td><td>object</td><td>Conditional</td><td>Carries <code>projectId</code>. Required when <code>recallScope</code> is not <code>global</code>.</td></tr>
<tr><td><code>userId</code></td><td>string</td><td>No</td><td>Reads one of your end users' isolated spaces instead of the account's own.</td></tr>
</table>

<div class="note"><b><code>limit</code> narrows; it does not widen.</b> On a standard account the value can only reduce what recall would have returned. That is why a response can come back with <code>limit_applied</code> lower than <code>limit_requested</code> \u2014 the plan for that query was already narrower than you asked for.</div>

<h2>Response</h2>
${outputBlock(`{
  "ok": true,
  "summary": "Found relevant memory.",
  "recall_status": "light_recall",
  "reason": "targeted_query",
  "context": "Postgres - decision\\n- chosen for the new service\\n",
  "count": 2,
  "items": [
    { "type": "node", "id": "node_7c", "label": "Postgres", "category": "decision", "score": 0.8421 },
    { "type": "page", "id": "page_2a", "title": "Service rewrite", "score": 0.5107 }
  ],
  "limit_requested": 5,
  "limit_applied": 5,
  "recall_scope": "global",
  "recall_latency_ms": 214,
  "processing_note": null
}`)}

<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>context</code></td><td>The compact block to paste into a prompt. This is the field most callers want.</td></tr>
<tr><td><code>items</code></td><td>The ranked shortlist behind the block, each with a score, if you would rather build your own presentation.</td></tr>
<tr><td><code>count</code></td><td>How many items matched. Zero is a normal answer.</td></tr>
<tr><td><code>recall_status</code></td><td>How hard recall worked: <code>no_recall</code>, <code>light_recall</code>, <code>update_mode</code>, <code>deep_recall</code>, or <code>rate_limited</code>.</td></tr>
<tr><td><code>reason</code></td><td>Why it chose that. <code>empty_query</code>, <code>smalltalk_or_self_contained</code>, <code>targeted_query</code>, <code>broad_profile_query</code>, and so on.</td></tr>
<tr><td><code>processing_note</code></td><td>Set when a recent save is still settling, so you can tell a user why something is missing. It is also appended to <code>context</code>.</td></tr>
</table>

<p>Richer objects ride along for callers that want them: <code>nodes</code> and <code>pages</code> carry the hydrated memories, with their details, dated events and relations.</p>

<h3>An empty answer is a success</h3>
<p>When nothing is relevant \u2014 or the question did not need memory at all \u2014 you get <code>200</code> with <code>context: ""</code>, <code>items: []</code>, <code>count: 0</code> and a summary saying so. Do not treat that as a failure; it is recall declining to pad your prompt.</p>

<h2>Rate limiting behaves differently here</h2>
<div class="warn"><b>Recall does not return <code>429</code>.</b> When the bucket trips you still get <code>200</code>, with <code>recall_status: "rate_limited"</code>, an empty <code>context</code> and a friendly summary \u2014 and no <code>retry-after</code> header. A read that fails should degrade a reply, not break it. If you are branching on status codes alone you will never notice; branch on <code>recall_status</code>.</div>
<p>The bucket is also keyed differently from the write endpoints: it counts against the memory space being read, so each of your end users gets their own allowance rather than sharing one.</p>

<h2>Your question is not stored</h2>
<p>Recall records that a lookup happened, but the query text itself is never persisted \u2014 the record is written content-free, with no preview and no message body. A question containing something private does not become a second durable copy of it.</p>

<h2>Errors</h2>
<table>
<tr><th>Status</th><th>Code</th><th>Cause</th></tr>
<tr><td>400</td><td><code>query is required</code></td><td><code>query</code> is missing or not a string.</td></tr>
<tr><td>400</td><td><code>invalid_limit</code></td><td>Not a whole number, or outside 1\u2013200.</td></tr>
<tr><td>400</td><td><code>invalid_recall_scope</code></td><td>Not one of the three accepted values.</td></tr>
<tr><td>400</td><td><code>project_id_required</code></td><td>A project scope was asked for without <code>memoryScope.projectId</code>.</td></tr>
<tr><td>400</td><td><code>payload_too_large</code></td><td><code>query</code> over 8,000 characters.</td></tr>
<tr><td>400</td><td><code>unknown_parameter</code></td><td>A field this endpoint does not accept. Note <code>sourceTime</code> is not one of them \u2014 a lookup has no write time.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>No usable credential.</td></tr>
<tr><td>403</td><td><code>insufficient_scope</code></td><td>The key or role cannot read this project.</td></tr>
<tr><td>413</td><td><code>request_too_large</code></td><td>Body over 524,288 bytes.</td></tr>
</table>
<p>On an error from the command layer the human-readable text is in <code>summary</code>, not <code>message</code>. Branch on <code>error</code> either way.</p>

<h2>Where to go next</h2>
${nextSteps([
	["#/api/save", "POST /v1/save", "Write the memory this reads back."],
	["#/concepts/retrieval", "How recall works", "The stages behind the ranking."],
	["#/guides/recall", "Recall memory", "The task guide, including scoping to a project."],
	["#/api/errors", "Errors", "Every code and what to do about it."],
