` };

/* ---------------------------------------------------------------- router */
function currentRoute() {
	const hash = location.hash.replace(/^#/, "") || "/";
	return PAGES[hash] ? hash : "/";
}

/* One ordered walk through the entire tree, used by the prev/next pager. The
   pager used to stop at the edge of an "area", so a reader who finished the
   last Get started page was told there was nothing after it. */
function allRoutes() {
	return NAV.flatMap((g) => g.items.map(([r]) => r));
}

function groupOfRoute(route) {
	return NAV.find((g) => g.items.some(([r]) => r === route)) ?? null;
}

/* Which rail sections the reader has collapsed. The section holding the page
   you are on is always expanded regardless of what is stored, so a stale
   preference can never hide the page you are reading. */
const COLLAPSE_KEY = "itsuki_docs_collapsed";

function collapsedSections() {
	try {
		const raw = JSON.parse(localStorage.getItem(COLLAPSE_KEY) ?? "[]");
		return new Set(Array.isArray(raw) ? raw : []);
	} catch { return new Set(); }
}

function storeCollapsed(set) {
	try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...set])); } catch {}
}

function slugify(text) {
	return String(text).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

/* The on-this-page rail is derived from what actually rendered, so it can
   never drift from the page the way a hand-maintained list would. */
function buildToc(main) {
	const rail = document.getElementById("tocRail");
	const heads = [...main.querySelectorAll("h2, h3")];
	if (heads.length < 2) { rail.innerHTML = ""; return; }
	const links = heads.map((h) => {
		if (!h.id) h.id = slugify(h.textContent);
		return `<a href="#${currentRoute()}" data-toc="${h.id}" class="${h.tagName === "H3" ? "h3" : ""}">${esc(h.textContent)}</a>`;
	}).join("");
	rail.innerHTML = `<div class="toc-inner"><div class="toc-title">On this page</div>${links}</div>`;
	rail.querySelectorAll("[data-toc]").forEach((link) => {
		link.addEventListener("click", (event) => {
			event.preventDefault();
			document.getElementById(link.dataset.toc)?.scrollIntoView({ behavior: "smooth", block: "start" });
		});
	});
	if (tocObserver) tocObserver.disconnect();
	tocObserver = new IntersectionObserver((entries) => {
		for (const entry of entries) {
			if (!entry.isIntersecting) continue;
			rail.querySelectorAll("[data-toc]").forEach((a) => a.classList.toggle("active", a.dataset.toc === entry.target.id));
		}
	}, { rootMargin: "-110px 0px -70% 0px" });
	heads.forEach((h) => tocObserver.observe(h));
}
let tocObserver = null;
/* Set by a search result, consumed by render() once the page has rendered.
   Declared here rather than beside the search code because render() runs at
   load, and a `let` read before its declaration throws. */
let pendingHeading = null;

/* Copy page hands the reader the whole page as markdown — the fastest way to
   put a doc into an AI assistant that is helping them integrate. */
function pageMarkdown(main) {
	const lines = [];
	const cell = (c) => c.textContent.trim().replace(/\|/g, "\\|").replace(/\s+/g, " ");
	/* Tables and callouts used to be skipped entirely, which meant every
	   parameter table - most of the value on a reference page - was silently
	   dropped from the copied markdown. */
	main.querySelectorAll("h1, h2, h3, p, li, pre, table, .note, .warn").forEach((el) => {
		if (el.closest("table") && el.tagName !== "TABLE") return;
		if (el.closest(".note, .warn") && !el.classList.contains("note") && !el.classList.contains("warn")) return;
		if (el.tagName === "TABLE") {
			const rows = [...el.querySelectorAll("tr")];
			if (!rows.length) return;
			const head = [...rows[0].children].map(cell);
			lines.push("", `| ${head.join(" | ")} |`, `| ${head.map(() => "---").join(" | ")} |`);
			rows.slice(1).forEach((r) => lines.push(`| ${[...r.children].map(cell).join(" | ")} |`));
			lines.push("");
			return;
		}
		if (el.classList.contains("note") || el.classList.contains("warn")) {
			const body = el.textContent.trim().replace(/\s+/g, " ");
			if (body) lines.push("", `> **${el.classList.contains("warn") ? "Warning" : "Note"}** ${body}`, "");
			return;
		}
		const text = el.tagName === "PRE" ? el.querySelector("code")?.textContent ?? "" : el.textContent.trim();
		if (!text) return;
		if (el.tagName === "H1") lines.push(`# ${text}`, "");
		else if (el.tagName === "H2") lines.push("", `## ${text}`, "");
		else if (el.tagName === "H3") lines.push("", `### ${text}`, "");
		else if (el.tagName === "LI") lines.push(`- ${text}`);
		else if (el.tagName === "PRE") lines.push("", "```", text, "```", "");
		else lines.push(text, "");
	});
	return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function renderNav(route) {
	const nav = document.getElementById("sideNav");
	const collapsed = collapsedSections();
	const openGroup = groupOfRoute(route);

	nav.innerHTML = NAV.map((g, i) => {
		const isOpen = g === openGroup || !collapsed.has(g.sec);
		const id = `navsec${i}`;
		const items = g.items.map(([r, l]) =>
			`<a href="#${r}" class="${r === route ? "active" : ""}">${esc(l)}</a>`).join("");
		return `<button type="button" class="sec" aria-expanded="${isOpen}" aria-controls="${id}" data-sec="${esc(g.sec)}">`
			+ `<svg class="chev" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
			+ `${esc(g.sec)}<span class="count">${g.items.length}</span></button>`
			+ `<div class="sec-items" id="${id}"${isOpen ? "" : " hidden"}>${items}</div>`;
	}).join("");

	nav.querySelectorAll(".sec").forEach((btn) => {
		btn.addEventListener("click", () => {
			const items = document.getElementById(btn.getAttribute("aria-controls"));
			const nowOpen = btn.getAttribute("aria-expanded") !== "true";
			btn.setAttribute("aria-expanded", String(nowOpen));
			items.hidden = !nowOpen;
			const set = collapsedSections();
			if (nowOpen) set.delete(btn.dataset.sec); else set.add(btn.dataset.sec);
			storeCollapsed(set);
		});
	});

	/* Keep the current page visible in a rail that is now taller than the
	   viewport, without yanking the whole window. */
	const active = nav.querySelector("a.active");
	if (active) {
		const top = active.offsetTop - nav.clientHeight / 2;
		nav.scrollTop = Math.max(0, top);
	}
}

function render() {
	const route = currentRoute();
	const page = PAGES[route];
	const group = groupOfRoute(route);

	const order = allRoutes();
	const at = order.indexOf(route);
	const link = (r, kind) => {
		if (!r || !PAGES[r]) return "<span></span>";
		const g = groupOfRoute(r);
		const l = g?.items.find(([rr]) => rr === r)?.[1] ?? PAGES[r].title;
		return `<a class="${kind}" href="#${r}"><small>${kind === "next" ? "Next" : "Previous"}</small>${esc(l)}</a>`;
	};

	const main = document.getElementById("page");
	main.innerHTML = `<div class="crumbs">${group ? `<b>${esc(group.sec)}</b>` : ""}</div>
		<div class="page-tools"><button type="button" id="copyPage">Copy page as markdown</button></div>`
		+ page.html
		+ `<div class="pager">${link(order[at - 1], "prev")}${link(order[at + 1], "next")}</div>`;

	document.title = route === "/" ? `${PRODUCT.name} Docs` : `${page.title} · ${PRODUCT.name} Docs`;

	main.querySelectorAll("table").forEach((table) => {
		if (table.parentElement?.classList.contains("table-scroll")) return;
		const wrap = document.createElement("div");
		wrap.className = "table-scroll";
		table.replaceWith(wrap);
		wrap.appendChild(table);
	});

	renderNav(route);
	buildToc(main);
	applyPendingHeading();
	const copy = document.getElementById("copyPage");
	if (copy) copy.addEventListener("click", () => {
		navigator.clipboard.writeText(pageMarkdown(main)).then(() => {
			copy.textContent = "Copied";
			setTimeout(() => { copy.textContent = "Copy page as markdown"; }, 1600);
		}).catch(() => { copy.textContent = "Copy failed"; });
	});

	document.body.classList.remove("nav-open");
	document.getElementById("searchResults").classList.remove("open");
	window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);
render();

/* ------------------------------------------------------------- copy btns */
document.addEventListener("click", (event) => {
	const btn = event.target.closest(".copy");
	if (!btn) return;
	const code = btn.parentElement.querySelector("code");
	navigator.clipboard.writeText(code ? code.textContent : "").then(() => {
		btn.textContent = "Copied";
		setTimeout(() => { btn.textContent = "Copy"; }, 1400);
	}).catch(() => {});
});

/* ---------------------------------------------------------------- search */
/* Stop words are dropped from the query so a natural question ("how do I
   rotate a key") matches on its content words rather than failing on "how". */
const STOP = new Set(["a","an","and","are","as","at","be","by","can","do","does","for","from","how",
	"i","in","is","it","its","me","my","of","on","or","that","the","to","use","what","when","where",
	"which","why","with","you","your"]);

const INDEX = Object.entries(PAGES).map(([route, page]) => {
	const raw = page.html.replace(/<[^>]+>/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<")
		.replace(/&gt;/g, ">").replace(/&mdash;/g, "\u2014").replace(/&rsquo;/g, "\u2019")
		.replace(/\s+/g, " ").trim();
	const headings = [...page.html.matchAll(/<h([23])[^>]*>([\s\S]*?)<\/h\1>/g)]
		.map((m) => m[2].replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").trim())
		.filter(Boolean);
	return { route, title: page.title, raw, lower: raw.toLowerCase(), headings,
		headingsLower: headings.map((h) => h.toLowerCase()) };
});

function slugifyText(text) {
	return String(text).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

const searchInput = document.getElementById("search");
const resultsBox = document.getElementById("searchResults");

function runSearch(query) {
	const terms = query.toLowerCase().split(/[^a-z0-9]+/).filter((t) => t && !STOP.has(t));
	if (!terms.length) return [];
	return INDEX.map((entry) => {
		const titleLower = entry.title.toLowerCase();
		/* Every term must appear somewhere on the page, so adding a word
		   narrows the result set instead of widening it. */
		if (!terms.every((t) => titleLower.includes(t) || entry.lower.includes(t))) return null;

		let score = 0;
		for (const t of terms) {
			if (titleLower.includes(t)) score += 6;
			if (entry.headingsLower.some((h) => h.includes(t))) score += 3;
			if (entry.lower.includes(t)) score += 1;
		}
		/* Prefer a heading that carries the most terms - that is the section
		   the reader actually wants, not just the page. */
		let best = null, bestHits = 0;
		entry.headingsLower.forEach((h, i) => {
			const hits = terms.filter((t) => h.includes(t)).length;
			if (hits > bestHits) { bestHits = hits; best = entry.headings[i]; }
		});

		const at = entry.lower.indexOf(terms[0]);
		return { entry, score, heading: best, at };
	}).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 8);
}

function snippetFor(entry, at, terms) {
	if (at < 0) return entry.raw.slice(0, 90);
	const from = Math.max(0, at - 34);
	let text = entry.raw.slice(from, at + 76);
	if (from > 0) text = "\u2026" + text;
	if (at + 76 < entry.raw.length) text += "\u2026";
	let out = esc(text);
	for (const t of terms) {
		out = out.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig"), "<mark>$1</mark>");
	}
	return out;
}

searchInput.addEventListener("input", () => {
	const q = searchInput.value.trim();
	if (q.length < 2) { resultsBox.classList.remove("open"); return; }
	const terms = q.toLowerCase().split(/[^a-z0-9]+/).filter((t) => t && !STOP.has(t));
	const hits = runSearch(q);
	resultsBox.innerHTML = hits.length
		? hits.map(({ entry, heading, at }) => {
			const target = heading ? ` data-head="${esc(slugifyText(heading))}"` : "";
			const where = heading ? `<i>${esc(heading)}</i>` : "";
			return `<a href="#${entry.route}"${target}><b>${esc(entry.title)}</b>${where}`
				+ `<small>${snippetFor(entry, at, terms)}</small></a>`;
		}).join("")
		: `<a href="#/"><small>No matches \u2014 try different words.</small></a>`;
	resultsBox.classList.add("open");
});

/* A result that names a heading scrolls to it once the page has rendered. */
resultsBox.addEventListener("click", (event) => {
	const link = event.target.closest("a[data-head]");
	if (!link) return;
	pendingHeading = link.dataset.head;
	if (location.hash.replace(/^#/, "") === link.getAttribute("href").slice(1)) {
		applyPendingHeading();
	}
});

function applyPendingHeading() {
	if (!pendingHeading) return;
	const el = document.getElementById(pendingHeading);
	pendingHeading = null;
	if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
document.addEventListener("click", (event) => {
	if (!event.target.closest(".searchbox")) resultsBox.classList.remove("open");
});
