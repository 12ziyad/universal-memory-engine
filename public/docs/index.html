<script>
const PRODUCT = { name: "Itsuki", pkg: "itsuki", tokenPrefix: "itsuki_live_" };
const ORIGIN = location.origin;

/* ---------------------------------------------------------------- nav */
const NAV = [
	{ sec: "Get started", items: [
		["/", "What is Itsuki?"],
		["/quickstart", "Quickstart (5 minutes)"],
	]},
	{ sec: "Connect a tool", items: [
		["/install/claude", "Claude"],
		["/install/chatgpt", "ChatGPT"],
		["/install/claude-code", "Claude Code (MCP)"],
		["/install/plugin", "Claude Code plugin"],
		["/install/cursor", "Cursor & other editors"],
	]},
	{ sec: "Build with the API", items: [
		["/api/rest", "REST API reference"],
		["/api/auth", "Authentication & keys"],
		["/api/mcp", "MCP tools"],
		["/sdk/python", "Python SDK"],
		["/sdk/js", "JavaScript SDK"],
	]},
	{ sec: "Concepts", items: [
		["/concepts/memory", "How memory works"],
		["/concepts/receipts", "Receipts & rules"],
	]},
	{ sec: "Trust", items: [
		["/privacy", "Privacy & limits"],
	]},
];

/* ---------------------------------------------------------------- helpers */
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const codeBlock = (text) => `<pre><button class="copy">Copy</button><code>${esc(text)}</code></pre>`;

/* ---------------------------------------------------------------- pages */
const PAGES = {};

PAGES["/"] = { title: "What is Itsuki?", html: `
<h1>What is Itsuki?</h1>
<p class="lede">One private memory, shared by every AI you use. Tell it once — Claude, ChatGPT, your editor, and your own apps all remember.</p>
<p>Itsuki (樹, "tree") is a personal memory engine. Tools you connect can <b>save</b> durable facts about you and <b>recall</b> them later. Memory is stored as a structured graph — memories, details, events, and the connections between them — that you can see, edit, and delete from your dashboard. Nothing is hidden inside an app you don't control.</p>
<h2>One engine, three doors</h2>
<table>
<tr><th>Door</th><th>Who it's for</th><th>How</th></tr>
<tr><td><b>MCP</b></td><td>AI chats &amp; editors (Claude, ChatGPT, Cursor…)</td><td>One private URL pasted into the client's connector settings</td></tr>
<tr><td><b>REST API</b></td><td>Your own apps, agents, and scripts</td><td>Bearer key + two main endpoints: save and recall</td></tr>
<tr><td><b>Dashboard</b></td><td>You</td><td>See the graph, review suggestions, set rules, read receipts</td></tr>
</table>
<p>All three doors read and write the <b>same</b> memory. There is exactly one engine behind them.</p>
<h2>What makes it different</h2>
<ul>
<li><b>You can see it.</b> Your memory is a living graph in your dashboard, not a black box.</li>
<li><b>Receipts for every write.</b> Each save produces a receipt: what was stored, what was skipped, and why.</li>
<li><b>Selective by design.</b> Itsuki stores durable facts, not chat logs. Your rules decide what's worth remembering.</li>
<li><b>Private by default.</b> No trackers, no ads, no training on your memory. <a href="#/privacy">Read the privacy page</a>.</li>
</ul>
<p>Ready? The <a href="#/quickstart">quickstart</a> takes about five minutes.</p>
` };

PAGES["/quickstart"] = { title: "Quickstart", html: `
<h1>Quickstart</h1>
<p class="lede">From zero to a working memory in about five minutes.</p>
<h2>1 · Create an account</h2>
<p>Sign up at <a href="${ORIGIN}" target="_blank" rel="noopener">${ORIGIN}</a> (free, email or Google).</p>
<h2>2 · Create a key</h2>
<p>In the app: <b>API Keys → Create API key</b>. The full key (<code>${PRODUCT.tokenPrefix}…</code>) is shown once — copy it somewhere safe.</p>
<h2>3 · Save a memory</h2>
${codeBlock(`curl -X POST ${ORIGIN}/v1/save \\
  -H "authorization: Bearer YOUR_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"content": "I started learning Kotlin this week."}'`)}
<p>The response is a <b>receipt</b> — what was saved and why. Extraction finishes in the background within a few seconds.</p>
<h2>4 · Recall it</h2>
${codeBlock(`curl -X POST ${ORIGIN}/v1/recall \\
  -H "authorization: Bearer YOUR_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"query": "what am I learning?"}'`)}
<p>The <code>context</code> field of the response is a compact text block — exactly what a connected AI receives.</p>
<h2>4b · Serving many end users</h2>
<p>Your API key is your account. Add <code>userId</code> and each of <i>your</i> end users gets an
<b>isolated memory space inside it</b> — nothing saved under one value is reachable from another,
on save or on recall.</p>
${codeBlock(`curl -X POST ${ORIGIN}/v1/save \\
  -H "authorization: Bearer YOUR_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"content": "Ada'"'"'s depot is in Porto.", "userId": "ada"}'`)}
<p>The SDKs take it per call — <code>memory.add("…", user_id="ada")</code> in Python,
<code>memory.add("…", { userId: "ada" })</code> in JavaScript — or once on the client.
The value is yours to pick (a user id, a tenant slug, an email); it is hashed with your account id
before it becomes a storage key, so two different API keys using the same string still get
different spaces.</p>
<div class="note"><b>Unknown parameters are rejected, not ignored.</b> A misspelled
<code>usr_id</code> returns <code>400</code> naming the offending key. Silently dropping it is how
somebody ships a multi-tenant app believing isolation worked.</div>
<h2>5 · Connect an AI chat</h2>
<p>Follow the guide for <a href="#/install/claude">Claude</a> or <a href="#/install/chatgpt">ChatGPT</a> — one URL, two minutes. After that, saying <i>"save this to ${PRODUCT.name.toLowerCase()}"</i> or asking <i>"what do you know about me?"</i> just works.</p>
<div class="note">Prefer clicking to curling? The <b>Playground</b> in the app does steps 3–4 with buttons.</div>
` };

PAGES["/install/claude"] = { title: "Connect Claude", html: `
<h1>Connect Claude</h1>
<p class="lede">Claude (claude.ai) supports custom connectors on every plan, including free.</p>
<div class="note"><b>Set up on a computer, not your phone.</b> The Claude mobile apps can't add connectors — configure once in a computer browser and it syncs to your phone automatically.</div>
<h2>Steps</h2>
<ol>
<li>In the Itsuki app, open <b>API Keys → Create MCP link</b> and copy your private URL (shown once): <code>${ORIGIN}/mcp/${PRODUCT.tokenPrefix}…</code></li>
<li>Open <a href="https://claude.ai/settings/connectors?modal=add-custom-connector" target="_blank" rel="noopener">claude.ai → Settings → Connectors → Add custom connector</a> (this link opens the dialog directly).</li>
<li>Name it <code>${PRODUCT.name.toLowerCase()}</code>, paste the URL, click <b>Add</b>.</li>
<li>In any chat: click the <b>+</b> (bottom-left) → <b>Connectors</b> → switch on <code>${PRODUCT.name.toLowerCase()}</code>. A saved connector stays off until you enable it in a chat — this step is the one everyone misses.</li>
</ol>
<h2>Try it</h2>
<p>Say: <i>"Save to ${PRODUCT.name.toLowerCase()}: I'm training for a half marathon."</i> Then in a new chat: <i>"What do you know about my training?"</i></p>
<h2>Troubleshooting</h2>
<ul>
<li><b>Connector missing in a chat</b> — enable it via <b>+</b> → Connectors (per-chat switch).</li>
<li><b>"Unauthorized"</b> — the key was revoked or rotated; create a fresh MCP link and update the URL.</li>
<li><b>Claude doesn't save automatically</b> — by design. The model decides when to call tools; ask it explicitly, or use the API for guaranteed capture.</li>
</ul>
` };

PAGES["/install/chatgpt"] = { title: "Connect ChatGPT", html: `
<h1>Connect ChatGPT</h1>
<p class="lede">ChatGPT supports custom MCP connectors on paid plans (Plus/Pro/Business), behind Developer mode.</p>
<div class="note">Set up on a computer. Nothing MCP-related appears anywhere until Developer mode is on.</div>
<h2>Steps</h2>
<ol>
<li>ChatGPT → <b>Settings → Connectors</b> (called <i>Plugins</i> in some builds) → <b>Advanced</b> → turn on <b>Developer mode</b>.</li>
<li>Back in Connectors, click <b>Create</b>. Name: <code>${PRODUCT.name.toLowerCase()}</code>. Description: <i>Personal memory — save and recall facts about me across chats.</i> (the model reads this when deciding to use it). URL: your MCP link from <b>API Keys → Create MCP link</b>.</li>
<li>In a new chat, enable Developer mode / <b>Add sources</b> and pick <code>${PRODUCT.name.toLowerCase()}</code> — a saved connector is off until selected in the chat.</li>
</ol>
<h2>Limits worth knowing</h2>
<ul>
<li>Free ChatGPT accounts can't add custom connectors at all.</li>
<li>Mobile can use the connector after desktop setup, with some write limits on OpenAI's side.</li>
</ul>
` };

PAGES["/install/claude-code"] = { title: "Claude Code (MCP)", html: `
<h1>Connect Claude Code</h1>
<p class="lede">One command. Your coding agent gets save, recall, and conversation capture.</p>
${codeBlock(`claude mcp add --transport http ${PRODUCT.name.toLowerCase()} ${ORIGIN}/mcp/YOUR_MCP_KEY`)}
<p>Replace <code>YOUR_MCP_KEY</code> with a fresh MCP link from <b>API Keys</b> (the full <code>${PRODUCT.tokenPrefix}…</code> value is shown once at creation).</p>
<div class="note"><b>MCP link ≠ API key.</b> Both start with <code>${PRODUCT.tokenPrefix}</code>, but only a token created as an <b>MCP link</b> works in the URL. An <b>API key</b> goes in a header instead — <code>${ORIGIN}/mcp</code> with <code>Authorization: Bearer &lt;key&gt;</code> — which is exactly what the <a href="#/install/plugin">Claude Code plugin</a> does for you. Paste an API key into the URL and the server will tell you so by name.</div>
<h2>What it gets</h2>
<table>
<tr><th>Tool</th><th>What it does</th></tr>
<tr><td><code>save_memory</code></td><td>Saves one explicit durable fact, returns a receipt</td></tr>
<tr><td><code>save_conversation</code></td><td>Captures scoped facts (or a whole-chat notes page) from several turns</td></tr>
<tr><td><code>recall_memory</code></td><td>Returns a compact context block of what's already known</td></tr>
</table>
<p>Then just tell it: <i>"save that decision to ${PRODUCT.name.toLowerCase()}"</i> or <i>"check ${PRODUCT.name.toLowerCase()} for context about this project"</i>.</p>
` };

PAGES["/install/plugin"] = { title: "Claude Code plugin", html: `
<h1>Claude Code plugin</h1>
<p class="lede">Install once, get memory across every session with lifecycle hooks — no manual tool calls.</p>
<h2>1. Set your key</h2>
<p>Create an API key in <b>API Keys</b>, then put it in your environment. This is the only variable the plugin needs:</p>
${codeBlock(`export ITSUKI_API_KEY=YOUR_KEY      # shell profile
setx ITSUKI_API_KEY YOUR_KEY            # Windows`)}
<p>Replace <code>YOUR_KEY</code> with the full <code>${PRODUCT.tokenPrefix}…</code> value (shown once at creation), then restart your shell so the variable is loaded. In cmd.exe, paste with right-click — Ctrl-V can insert a control character instead of pasting.</p>
<h2>2. Install</h2>
${codeBlock(`claude plugin marketplace add 12ziyad/universal-memory-engine
claude plugin install ${PRODUCT.pkg}@itsuki-plugins`)}
<h2>3. Verify</h2>
<p>In any Claude Code session, run <code>/itsuki:doctor</code>. It checks the key's shape, the network path, the hooks door, and the MCP door, and prints the exact fix for whichever fails. All four pass — you're done.</p>
<h2>What you get</h2>
<p>The three memory tools (<code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code>) plus two lifecycle hooks: project memory is loaded at session start, and what the session learned is saved at session end.</p>
<div class="note">One key, one variable — there is no MCP URL to configure. The plugin points at <code>${ORIGIN}/mcp</code> and sends your key as a Bearer header. If the key is missing or rejected, the plugin tells you at session start instead of failing quietly.</div>
` };

PAGES["/install/cursor"] = { title: "Cursor & other editors", html: `
<h1>Cursor, Codex &amp; other MCP editors</h1>
<p class="lede">Any MCP-capable client connects with the same URL.</p>
<h2>Cursor</h2>
<p>Add to <code>.cursor/mcp.json</code> (project) or <code>~/.cursor/mcp.json</code> (global):</p>
${codeBlock(`{
  "mcpServers": {
    "${PRODUCT.name.toLowerCase()}": { "url": "${ORIGIN}/mcp/YOUR_MCP_KEY" }
  }
}`)}
<h2>Codex / anything else</h2>
<p>Point the client's MCP server config at the same URL. Transport is Streamable HTTP; identity rides in the URL, so no extra headers are needed.</p>
<p>If your client prefers a fixed URL with header auth, that works too: point it at <code>${ORIGIN}/mcp</code> with no path token and send <code>Authorization: Bearer</code> plus an API key. Same server, same tools.</p>
<div class="note">Treat the MCP URL like a password: it IS your key. One key per tool means you can revoke one tool without touching the rest. And it must be an <b>MCP link</b>, created as such in API Keys — an API key in the URL is refused (API keys belong in the <code>Authorization: Bearer</code> header at <code>${ORIGIN}/mcp</code>).</div>
` };

PAGES["/api/rest"] = { title: "REST API reference", html: `
<h1>REST API reference</h1>
<p class="lede">Base URL: <code>${ORIGIN}</code> · JSON in, JSON out · Bearer auth.</p>
<h2>The two calls that matter</h2>
<h3>POST /v1/save — write memory</h3>
${codeBlock(`POST /v1/save
{ "content": "I started learning Kotlin this week." }

// or conversation mode:
{ "mode": "conversation",
  "conversationId": "chat-42",
  "messages": [
    { "role": "user", "content": "We decided on Postgres for the new service." },
    { "role": "assistant", "content": "Noted — Postgres it is." }
  ] }`)}
<p>Returns a <b>receipt</b>: <code>summary</code>, counts of what was written/updated/skipped, and a <code>receipt_id</code>. Extraction is asynchronous — allow a few seconds before recalling brand-new facts.</p>
<h3>POST /v1/recall — read memory</h3>
${codeBlock(`POST /v1/recall
{ "query": "what am I learning?" }

// response (abridged)
{ "count": 2,
  "context": "Kotlin (skill, state: active) - started learning this week…",
  "items": [ { "type": "node", "label": "Kotlin", "score": 7.9 } ] }`)}
<p><code>context</code> is the compact text block a connected AI receives. Empty string + <code>count: 0</code> means nothing relevant is stored.</p>
<h2>Everything else</h2>
<table>
<tr><th>Endpoint</th><th>What it does</th></tr>
<tr><td><code>POST /v1/turn</code></td><td>Recall + auto-capture in one call — send the latest chat messages, get context back while durable facts are collected. Needs write scope.</td></tr>
<tr><td><code>POST /v1/ingest</code></td><td>Bulk message ingestion with optional <code>flush: true</code> to force digestion.</td></tr>
<tr><td><code>GET /v1/graph</code></td><td>The full laid-out memory graph (nodes, details, events, edges, clusters).</td></tr>
<tr><td><code>GET /v1/status</code></td><td>Counts: memories, notes, details, events, pending suggestions.</td></tr>
<tr><td><code>GET /v1/usage?range=30d</code></td><td>Activity rollups: saves/recalls per day, by source, totals. Ranges 1d/7d/30d/all.</td></tr>
<tr><td><code>GET /v1/receipts?limit=50</code></td><td>Latest save/recall receipts.</td></tr>
<tr><td><code>GET /v1/export</code></td><td>Complete JSON export of your memory. Your data is never locked in.</td></tr>
<tr><td><code>GET/PUT /v1/rules</code></td><td>Read or update capture rules (what to remember / never remember).</td></tr>
</table>
<h2>Useful request fields</h2>
<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>idempotencyKey</code></td><td>Safe retries: the same key is processed at most once.</td></tr>
<tr><td><code>conversationId</code>, <code>threadId</code>, <code>sourceId</code></td><td>Provenance tracking; also used for de-duplication of re-sent chats.</td></tr>
<tr><td><code>userId</code></td><td><b>Sub-tenant selector.</b> Omit it to use the key owner's own memory. Pass any string to read/write a separate memory space derived from it — useful when your app serves multiple end users under one key.</td></tr>
</table>
<h2>Rate limits</h2>
<p>Writes (<code>/v1/save</code>, <code>/v1/turn</code>, <code>/v1/ingest</code>): 60/minute per user — a <code>429</code> includes a friendly message; honor <code>Retry-After</code> style backoff. Reads are not currently rate limited.</p>
<h2>Errors</h2>
<p>Errors are JSON: <code>{ "error": "code_or_message" }</code> with conventional status codes (400 invalid body, 401 unauthenticated, 403 wrong scope, 429 slow down, 5xx our fault — automatically reported on our side).</p>
` };

PAGES["/api/auth"] = { title: "Authentication & keys", html: `
<h1>Authentication &amp; keys</h1>
<p class="lede">Two kinds of key, one rule: secrets are shown once.</p>
<h2>API keys (Bearer)</h2>
${codeBlock(`authorization: Bearer ${PRODUCT.tokenPrefix}XXXXXXXX`)}
<p>Create in <b>API Keys → Create API key</b>. Use for the REST API and SDKs. Also accepted via the <code>x-uml-token</code> header (legacy name kept for compatibility).</p>
<h2>MCP links</h2>
<p><code>${ORIGIN}/mcp/&lt;key&gt;</code> — the key rides in the URL because that's what chat clients can carry. An MCP link IS a secret; treat it like a password.</p>
<h2>Scopes</h2>
<table>
<tr><th>Scope</th><th>Grants</th></tr>
<tr><td><code>memory:read</code></td><td>recall, graph, status, usage, receipts, export, read rules</td></tr>
<tr><td><code>memory:write</code></td><td>save, turn, ingest, write rules — implies read</td></tr>
</table>
<p>Default keys carry both. Create a read-only key by passing <code>"scopes": ["memory:read"]</code> when creating the token.</p>
<h2>Lifecycle</h2>
<ul>
<li><b>Shown once</b> — only a hash is stored server-side. Lose it → rotate.</li>
<li><b>Rotate</b> — revokes the old key and mints a fresh one with the same name.</li>
<li><b>Revoke</b> — immediate; revoked keys stay listed for audit and can never be used again.</li>
<li>Keys minted before the Itsuki rename (<code>uml_live_…</code>) keep working forever.</li>
</ul>
` };

PAGES["/api/mcp"] = { title: "MCP tools", html: `
<h1>MCP tools</h1>
<p class="lede">Server: <code>itsuki-memory</code> · Transport: Streamable HTTP · URL: <code>${ORIGIN}/mcp/&lt;key&gt;</code></p>
<h2>The three tools</h2>
<h3>save_memory</h3>
<p>Saves exactly one explicitly submitted durable fact. Input: <code>content</code> (required, the user's words), optional <code>recentContext</code> for resolving references like "it". Returns a final receipt — <i>Saved: 1 memory (Kotlin)…</i> — only after the write completes.</p>
<h3>save_conversation</h3>
<p>Captures several chat turns at once. Input: <code>messages[]</code> (oldest first), optional <code>scope</code> (<code>full</code> | <code>lastN</code> | <code>topic</code> | <code>summary</code>) and <code>contentScope.subject</code> for strict subject filtering. Only user-stated facts enter the graph; assistant content becomes notes, never facts, unless the user explicitly adopted it.</p>
<h3>recall_memory</h3>
<p>Input: <code>query</code>. The tool's text result IS the recalled context — the model can use it directly. Structured details ride along for clients that read them.</p>
<h2>Design guarantees</h2>
<ul>
<li>No write is ever claimed without a receipt.</li>
<li>The host model decides <i>when</i> to call tools — if you need guaranteed per-turn capture, use <code>POST /v1/turn</code> from your own code instead.</li>
</ul>
` };

PAGES["/concepts/memory"] = { title: "How memory works", html: `
<h1>How memory works</h1>
<p class="lede">Chat history is not memory. Memory is structured meaning.</p>
<h2>The pipeline</h2>
<ol>
<li><b>You tell it something</b> — through any door: a chat tool, the API, the Playground.</li>
<li><b>Extraction</b> — a model proposes durable facts from what you said. Small talk, questions, and noise are skipped.</li>
<li><b>Grounding</b> — every proposed fact must be traceable to your actual words. Facts the model can't ground are rejected, not stored.</li>
<li><b>The graph</b> — facts land as <b>memories</b> (things: Kotlin, Sarah, your project) with <b>details</b> (current truths) and <b>events</b> (things that happened), connected by edges and clustered by life area.</li>
<li><b>Latest truth wins</b> — new information supersedes old instead of piling up; superseded details stay in history.</li>
<li><b>Recall</b> — a query pulls the most relevant slice of the graph as a compact context block, bounded so it never floods a prompt.</li>
</ol>
<h2>Suggestions</h2>
<p>Weak or unclear signals don't enter the graph directly — they wait in <b>Memories → Suggestions</b> for you to keep or drop. Your memory stays yours to curate.</p>
<h2>Notes</h2>
<p>Whole-conversation captures become organized <b>notes</b> pages — condensed and searchable, without polluting the fact graph.</p>
` };

PAGES["/concepts/receipts"] = { title: "Receipts & rules", html: `
<h1>Receipts &amp; rules</h1>
<p class="lede">Trust needs proof and control. Receipts are the proof; rules are the control.</p>
<h2>Receipts</h2>
<p>Every save attempt produces a receipt: what was written, what was updated, what was skipped and why. They live in <b>History</b> and come back on every API save. A tool can never claim "saved!" without one — receipts are generated by the backend, not the model.</p>
${codeBlock(`{ "summary": "Saved: 1 memory (Kotlin), 1 detail. Skipped: 1 (question).",
  "receipt_id": "receipt_1a2b…",
  "receipt": { "outcome": "wrote", "saved": { "nodes": 1, "slices": 1 }, "skipped": 1 } }`)}
<h2>Rules</h2>
<p>In <b>Settings → What to remember</b> (or <code>PUT /v1/rules</code>):</p>
<ul>
<li><b>Custom instructions</b> — plain language: <i>"Always save exam progress. Never save jokes."</i></li>
<li><b>Includes / excludes</b> — topic lists; excludes always win.</li>
<li><b>Auto-capture</b> — whether conversational ingestion collects quietly or only on explicit request.</li>
</ul>
<p>Rules apply at the engine, so every door obeys them — MCP tools, API, SDK, and the app itself.</p>
` };

PAGES["/privacy"] = { title: "Privacy & limits", html: `
<h1>Privacy &amp; limits</h1>
<p class="lede">The short version we hold ourselves to: no selling data, no ads, no third-party trackers, no training on your memory.</p>
<h2>Privacy</h2>
<ul>
<li>Your memory belongs to you. Export everything anytime (<code>GET /v1/export</code>); delete everything anytime (Settings → danger zone). Deletion is immediate.</li>
<li>Site analytics are aggregate-only: no cookies, no visitor IDs, bot-filtered counts.</li>
<li>Operational metadata (sign-ins, save/recall counts, errors) is visible to the operator for support; memory <i>content</i> is not browsed.</li>
<li>Full details: <a href="${ORIGIN}/privacy" target="_blank" rel="noopener">Privacy Policy</a> · <a href="${ORIGIN}/terms" target="_blank" rel="noopener">Terms</a>.</li>

/* ---------------------------------------------------------------- router */
function currentRoute() {
	const hash = location.hash.replace(/^#/, "") || "/";
	return PAGES[hash] ? hash : "/";
}

function render() {
	const route = currentRoute();
	const page = PAGES[route];
	document.getElementById("page").innerHTML = page.html;
	document.title = route === "/" ? `${PRODUCT.name} Docs` : `${page.title} · ${PRODUCT.name} Docs`;
	const nav = document.getElementById("sideNav");
	nav.innerHTML = NAV.map((group) => `<div class="sec">${group.sec}</div>` +
		group.items.map(([r, label]) => `<a href="#${r}" class="${r === route ? "active" : ""}">${label}</a>`).join("")).join("");
	document.body.classList.remove("nav-open");
	document.getElementById("searchResults").classList.remove("open");
	window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);
render();

/* ------------------------------------------------------------- copy btns */
document.addEventListener("click", (event) => {
	const btn = event.target.closest(".copy");
	if (!btn) return;
	const code = btn.parentElement.querySelector("code");
	navigator.clipboard.writeText(code ? code.textContent : "").then(() => {
		btn.textContent = "Copied";
		setTimeout(() => { btn.textContent = "Copy"; }, 1400);
	}).catch(() => {});
});

/* ---------------------------------------------------------------- search */
const INDEX = Object.entries(PAGES).map(([route, page]) => ({
	route,
	title: page.title,
	text: page.html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").toLowerCase(),
}));

const searchInput = document.getElementById("search");
const resultsBox = document.getElementById("searchResults");
searchInput.addEventListener("input", () => {
	const q = searchInput.value.trim().toLowerCase();
	if (q.length < 2) { resultsBox.classList.remove("open"); return; }
	const hits = INDEX
		.map((entry) => {
			const inTitle = entry.title.toLowerCase().includes(q) ? 2 : 0;
			const at = entry.text.indexOf(q);
			return { entry, score: inTitle + (at >= 0 ? 1 : 0), at };
		})
		.filter((h) => h.score > 0)
		.sort((a, b) => b.score - a.score)
		.slice(0, 8);
	resultsBox.innerHTML = hits.length
		? hits.map(({ entry, at }) => {
			const snippet = at >= 0 ? entry.text.slice(Math.max(0, at - 30), at + 70) : "";
			return `<a href="#${entry.route}"><b>${entry.title}</b><small>…${snippet}…</small></a>`;
		}).join("")
		: `<a href="#/"><small>No matches — try different words.</small></a>`;
	resultsBox.classList.add("open");
});
document.addEventListener("click", (event) => {
	if (!event.target.closest(".searchbox")) resultsBox.classList.remove("open");
});
</script>
