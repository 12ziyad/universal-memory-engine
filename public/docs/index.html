<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Itsuki Docs</title>
<link rel="icon" href="/assets/brand/itsuki-bonsai-favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/assets/brand/itsuki-bonsai-favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/assets/brand/itsuki-bonsai-apple-180.png" />
<script src="/assets/theme-bootstrap.js"></script>
<style>
	/* Same self-hosted faces the app uses, same three subsets. The docs sat on
	   the system stack, so the product and the documentation for it were set in
	   two different typefaces. Subsets are unicode-range scoped so a stray glyph
	   cannot pull down a whole second file. */
	@font-face {
		font-family: "Fustat";
		src: url("/assets/fustat-latin-variable.woff2") format("woff2");
		font-weight: 200 800;
		font-style: normal;
		font-display: swap;
		unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC,
			U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
			U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
	}
	@font-face {
		font-family: "Fustat";
		src: url("/assets/fustat-latin-ext-variable.woff2") format("woff2");
		font-weight: 200 800;
		font-style: normal;
		font-display: swap;
		unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
			U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
			U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
			U+2C60-2C7F, U+A720-A7FF;
	}
	@font-face {
		font-family: "Geist Mono";
		src: url("/assets/geist-mono-400.woff2") format("woff2");
		font-weight: 400;
		font-style: normal;
		font-display: swap;
	}
	:root {
		color-scheme: light;
		--bg: #f2ebdd; --panel: #fbf8f1; --panel2: #eae0cf;
		--border: #d5c9b6; --border2: #b8aa94;
		--text: #15130f; --body-text: #3f392f; --muted: #514b42; --faint: #756e63; --accent: #a83f22;
		--clay: #c84f2a; --on-clay: #ffffff; --green: #19734d; --amber: #98621a; --red: #b53b31;
		--code-bg: #0c0b09; --code-text: #f1dfc8; --code-control: rgba(251,248,241,.1);
		--focus-ring: rgba(200,79,42,.34); --shadow: rgba(50,39,25,.12); --press-shadow: #15130f;
		--font-ui: "Fustat", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		--font-mono: "Geist Mono", ui-monospace, "JetBrains Mono", Consolas, monospace;
	}
	html[data-theme="dark"] {
		color-scheme: dark;
		--bg: #100f0c; --panel: #181612; --panel2: #211e19;
		--border: #373228; --border2: #554c3e;
		--text: #fbf8f1; --body-text: #ded4c4; --muted: #c8bca8; --faint: #a99f8f; --accent: #e38362;
		--clay: #d96642; --on-clay: #140f0c; --green: #66c99a; --amber: #d0a65e; --red: #ef8b7d;
		--code-bg: #090806; --code-text: #f1dfc8; --code-control: rgba(251,248,241,.1);
		--focus-ring: rgba(227,131,98,.42); --shadow: rgba(0,0,0,.34); --press-shadow: #e38362;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body { margin: 0; font: 15px/1.65 var(--font-ui);
		background: linear-gradient(90deg, transparent calc(50% - .5px), color-mix(in srgb, var(--text) 6%, transparent) 50%, transparent calc(50% + .5px)), var(--bg); color: var(--text); }
	button, input, select, textarea { font-family: var(--font-ui); }
	a { color: var(--accent); }
	::selection { background: color-mix(in srgb, var(--clay) 22%, var(--panel)); color: var(--text); }
	:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
	.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px;
		padding: 12px 22px; background: color-mix(in srgb, var(--panel) 92%, transparent); border-bottom: 1px solid var(--border); backdrop-filter: blur(18px); }
	.topbar .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px;
		color: var(--text); text-decoration: none; }
	.topbar .brand img { display: block; width: 28px; height: 28px; flex: 0 0 28px; }
	.topbar .brand img.brand-inverse { display: none; }
	html[data-theme="dark"] .topbar .brand img.brand-default { display: none; }
	html[data-theme="dark"] .topbar .brand img.brand-inverse { display: block; }
	.topbar .brand span { color: var(--faint); font-weight: 500; }
	.topbar input { flex: 1; max-width: 420px; padding: 8px 12px; border: 1px solid var(--border2);
		border-radius: 8px; font-size: 14px; outline: none; background: var(--bg); color: var(--text); }
	.topbar input::placeholder { color: var(--faint); }
	.topbar input:focus { border-color: var(--clay); box-shadow: 0 0 0 3px var(--focus-ring); }
	.topbar .app-link { position: relative; z-index: 0; margin-left: auto; color: var(--on-clay); font-size: 14px; font-weight: 600; text-decoration: none;
		transition: transform .15s ease; }
	.topbar .app-link::before { position: absolute; z-index: -1; inset: -5px -9px; content: ""; border: 1px solid var(--text);
		border-radius: 2px; background: var(--clay); box-shadow: 3px 3px 0 var(--press-shadow); transition: background .15s ease, box-shadow .15s ease, transform .15s ease; }
	.topbar .app-link:hover::before { background: var(--accent); }
	.topbar .app-link:active { transform: translate(3px, 3px); }
	.topbar .app-link:active::before { box-shadow: 0 0 0 var(--press-shadow); }
	.theme-toggle { position: fixed; right: 18px; bottom: 18px; z-index: 30; background: var(--panel); border: 1px solid var(--border2); border-radius: 8px;
		font-size: 12px; padding: 6px 10px; cursor: pointer; color: var(--text); transition: background .15s ease, border-color .15s ease, transform .15s ease; }
	.theme-toggle:hover { background: var(--panel2); border-color: var(--clay); }
	.theme-toggle:active { transform: translateY(2px); }
	.theme-toggle .theme-icon { color: var(--clay); }
	.theme-toggle .theme-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
	.layout { display: grid; grid-template-columns: 258px minmax(0, 1fr) 210px; max-width: 1440px; margin: 0 auto; }
	/* There used to be an "area" bar here that filtered the left rail to one
	   subject area at a time. It meant that from Get started you could not see
	   the API reference or Concepts at all, and three of its five tabs repeated
	   the section heading directly beneath them. The whole tree now lives in one
	   rail, so nothing is hidden behind a control the reader has to notice. */
	.search-results a i { display: block; font-style: normal; font-size: 12px; color: var(--accent); margin: 1px 0 2px; }
	.search-results a mark { background: color-mix(in srgb, var(--clay) 26%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
	/* On-this-page rail, built from the rendered h2/h3 of each page. */
	.toc { padding: 30px 16px 60px; font-size: 13px; }
	.toc-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
		color: var(--faint); margin-bottom: 10px; }
	.toc a { display: block; padding: 5px 0 5px 10px; border-left: 2px solid var(--border);
		color: var(--muted); text-decoration: none; line-height: 1.45; }
	.toc a:hover { color: var(--text); border-left-color: var(--border2); }
	.toc a.h3 { padding-left: 20px; font-size: 12.5px; }
	.toc a.active { color: var(--accent); border-left-color: var(--clay); font-weight: 600; }
	.toc-inner { position: sticky; top: 110px; max-height: calc(100vh - 130px); overflow-y: auto; }
	/* Copy page: the whole page as markdown, for pasting into an AI assistant. */
	.page-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
	.page-tools button { padding: 6px 11px; border: 1px solid var(--border2); border-radius: 8px;
		background: var(--panel); color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; }
	.page-tools button:hover { color: var(--text); border-color: var(--clay); }
	.crumbs { color: var(--faint); font-size: 12.5px; margin-bottom: 10px; }
	.crumbs b { color: var(--muted); font-weight: 600; }
	/* Prev/next pager so a reader can move through an area in order. */
	.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 54px 0 0;
		padding-top: 26px; border-top: 1px solid var(--border); }
	.pager a { display: block; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
		color: var(--text); text-decoration: none; }
	.pager a:hover { border-color: var(--clay); }
	.pager small { display: block; color: var(--faint); font-size: 11.5px; margin-bottom: 4px; }
	.pager .next { text-align: right; grid-column: 2; }
	/* A grid item's min-content width is its floor, so a long page title kept
	   the two-column pager wider than a phone screen. */
	.pager a { min-width: 0; overflow-wrap: anywhere; }
	@media (max-width: 560px) {
		.pager { grid-template-columns: minmax(0, 1fr); }
		.pager .next { grid-column: 1; text-align: left; }
	}
	main .note, main .warn { margin: 18px 0; padding: 13px 16px; border-radius: 10px; font-size: 14px; line-height: 1.65; }
	main .note { border: 1px solid var(--border2); background: var(--panel2); color: var(--body-text); }
	main .warn { border: 1px solid var(--amber); background: color-mix(in srgb, var(--amber) 10%, transparent); color: var(--body-text); }
	main h2 { scroll-margin-top: 120px; }
	main h3 { scroll-margin-top: 120px; }
	@media (max-width: 1180px) { .layout { grid-template-columns: 240px minmax(0, 1fr); } .toc { display: none; } }
	/* Sticky and self-scrolling. The rail used to scroll away with the page, so
	   on any long page the entire menu was off-screen. */
	nav.side { position: sticky; top: 57px; align-self: start; height: calc(100vh - 57px);
		overflow-y: auto; overscroll-behavior: contain; padding: 22px 14px 60px;
		border-right: 1px solid var(--border); scrollbar-width: thin; }
	nav.side .sec { display: flex; align-items: center; gap: 7px; width: 100%; margin-top: 16px;
		padding: 6px 10px; border: 0; border-radius: 8px; background: none; cursor: pointer;
		font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: .08em;
		text-transform: uppercase; color: var(--faint); text-align: left; }
	nav.side .sec:hover { color: var(--muted); background: var(--panel2); }
	nav.side .sec:first-child { margin-top: 0; }
	nav.side .sec .chev { flex: 0 0 9px; transition: transform .15s ease; }
	nav.side .sec[aria-expanded="false"] .chev { transform: rotate(-90deg); }
	nav.side .sec .count { margin-left: auto; font-size: 10px; font-weight: 600;
		letter-spacing: 0; color: var(--faint); opacity: .75; }
	nav.side .sec-items[hidden] { display: none; }
	nav.side a { display: block; padding: 7px 10px 7px 26px; border-radius: 8px; color: var(--muted);
		text-decoration: none; font-size: 14px; }
	nav.side a:hover { color: var(--text); background: var(--panel2); }
	nav.side a.active { color: var(--accent); background: color-mix(in srgb, var(--clay) 11%, transparent); font-weight: 600;
		box-shadow: inset 2px 0 0 var(--clay); }
	main { padding: 30px 40px 100px; min-width: 0; }
	main h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.01em; }
	main .lede { color: var(--muted); font-size: 16px; margin: 0 0 26px; }
	main h2 { font-size: 20px; margin: 34px 0 10px; }
	main h3 { font-size: 16px; margin: 24px 0 8px; }
	main p, main li { color: var(--body-text); }
	main b, main strong { color: var(--text); }
	main code { background: var(--panel2); border: 1px solid var(--border); border-radius: 5px;
		padding: 1px 6px; font-family: var(--font-mono); font-size: 13px; }
	main pre { position: relative; margin: 14px 0; padding: 16px; background: var(--code-bg); color: var(--code-text);
		border-radius: 12px; overflow-x: auto; font-family: var(--font-mono);
		font-size: 13px; line-height: 1.6; box-shadow: 6px 6px 0 var(--clay); }
	main pre code { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
	.copy { position: absolute; top: 8px; right: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600;
		background: var(--code-control); color: var(--code-text); border: 1px solid rgba(251,248,241,.2);
		border-radius: 7px; cursor: pointer; transition: transform .15s ease, background .15s ease; }
	.copy:hover { background: rgba(251,248,241,.18); }
	.copy:active { transform: translateY(2px); }
	/* A typed fence. A reader can tell at a glance what to copy and what to
	   compare their own result against. */
	main pre[data-label]::before { content: attr(data-label); position: absolute; top: 0; left: 16px;
		transform: translateY(-50%); padding: 2px 8px; border-radius: 20px;
		background: var(--panel2); border: 1px solid var(--border2); color: var(--faint);
		font-family: var(--font-ui); font-size: 10.5px; font-weight: 700;
		letter-spacing: .07em; text-transform: uppercase; }
	main pre.out { background: var(--panel); color: var(--body-text);
		border: 1px solid var(--border2); box-shadow: none; }
	main pre.out::before { background: var(--panel); }
	main pre[data-label] { margin-top: 24px; }
	/* Prerequisites: what you must already have, as a checklist you can fail
	   fast against rather than a sentence buried in the lede. */
	main .prereq { margin: 18px 0 26px; padding: 14px 18px 14px 16px; border-radius: 12px;
		border: 1px solid var(--border2); border-left: 3px solid var(--clay);
		background: color-mix(in srgb, var(--panel2) 60%, transparent); }
	main .prereq b { display: block; font-size: 11px; letter-spacing: .08em;
		text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
	main .prereq ul { margin: 0; padding-left: 20px; }
	main .prereq li { margin: 4px 0; }
	/* Numbered procedure. One action per step; the number is the countable
	   signal that a page is thorough. */
	main ol.steps { counter-reset: step; list-style: none; margin: 18px 0; padding: 0; }
	main ol.steps > li { counter-increment: step; position: relative; margin: 0 0 26px;
		padding: 0 0 0 42px; }
	main ol.steps > li::before { content: counter(step); position: absolute; left: 0; top: -2px;
		width: 27px; height: 27px; border-radius: 50%; background: var(--clay); color: var(--on-clay);
		font-size: 13px; font-weight: 700; display: grid; place-items: center; }
	main ol.steps > li > b:first-child { display: block; color: var(--text); font-size: 15.5px;
		margin: 3px 0 6px; }
	main ol.steps > li > p:first-of-type { margin-top: 0; }
	/* Next steps: one line each, so the end of a page is a door and not a wall. */
	main .next { display: grid; grid-template-columns: repeat(auto-fit, minmax(216px, 1fr));
		gap: 12px; margin: 18px 0; }
	main .next a { display: block; padding: 13px 15px; border: 1px solid var(--border);
		border-radius: 12px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; }
	main .next a:hover { border-color: var(--clay); }
	main .next a small { display: block; margin-top: 3px; color: var(--faint);
		font-weight: 400; font-size: 12.5px; line-height: 1.5; }
	/* A table cannot shrink below its min-content width, so on a narrow
	   screen it pushes the whole page sideways. Give it its own scroll
	   container instead - the page body must never scroll horizontally. */
	.table-scroll { overflow-x: auto; margin: 14px 0; }
	.table-scroll table { margin: 0; width: auto; min-width: 100%; }
	table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 14px 0; background: color-mix(in srgb, var(--panel) 72%, transparent); }
	th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
		color: var(--faint); padding: 8px 10px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--panel2) 72%, transparent); }
	td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
	.note { border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); border-radius: 10px;
		background: color-mix(in srgb, var(--amber) 8%, var(--panel)); padding: 12px 14px; margin: 14px 0; font-size: 14px; }
	.searchbox { position: relative; flex: 1; max-width: 420px; }
	.searchbox input { width: 100%; }
	.search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel);
		border: 1px solid var(--border2); border-radius: 10px; box-shadow: 0 8px 30px var(--shadow);
		max-height: 320px; overflow-y: auto; display: none; }
	.search-results.open { display: block; }
	.search-results a { display: block; padding: 10px 14px; text-decoration: none; color: var(--text);
		border-bottom: 1px solid var(--border); font-size: 14px; }
	.search-results a:last-child { border-bottom: 0; }
	.search-results a:hover { background: var(--panel2); }
	.search-results a small { display: block; color: var(--faint); }
	.menu-btn { display: none; background: var(--panel); border: 1px solid var(--border2); border-radius: 8px;
		font-size: 15px; padding: 6px 10px; cursor: pointer; color: var(--text); }
	@media (max-width: 860px) {
		.layout { grid-template-columns: minmax(0, 1fr); }
		nav.side { position: fixed; inset: 53px auto 0 0; width: 260px; background: var(--panel); z-index: 20;
			transform: translateX(-100%); transition: transform .18s ease; overflow-y: auto; }
		body.nav-open nav.side { transform: none; box-shadow: 0 0 40px var(--shadow); }
		.menu-btn { display: inline-block; }
		main { padding: 22px 18px 80px; }
		.theme-toggle { box-shadow: 0 8px 30px var(--shadow); }
		.theme-toggle .theme-label { display: none; }
	}
	@media (prefers-reduced-motion: reduce) {
		*, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
	}
</style>
</head>
<body>
<div class="topbar">
	<button class="menu-btn" onclick="document.body.classList.toggle('nav-open')">☰</button>
	<a class="brand" href="#/"><img class="brand-default" src="/assets/brand/itsuki-bonsai-mark.svg" alt="" /><img class="brand-inverse" src="/assets/brand/itsuki-bonsai-mark-inverse.svg" alt="" /> Itsuki <span>Docs</span></a>
	<div class="searchbox">
		<input id="search" placeholder="Search the docs…" autocomplete="off" />
		<div class="search-results" id="searchResults"></div>
	</div>
	<a class="app-link" href="/app" target="_blank" rel="noopener">Open Itsuki →</a>
</div>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="System appearance. Click to change theme."><span class="theme-icon" id="themeIcon" aria-hidden="true">◐</span> <span class="theme-label" id="themeLabel">System</span></button>
<div class="layout">
	<nav class="side" id="sideNav"></nav>
	<main id="page"></main>
	<aside class="toc" id="tocRail"></aside>
</div>

<script>
const PRODUCT = { name: "Itsuki", pkg: "itsuki", tokenPrefix: "itsuki_live_" };
const ORIGIN = location.origin;

/* --------------------------------------------------------------- theme */
const THEME_KEY = "itsuki_theme";
const THEME_ORDER = ["system", "light", "dark"];
const THEME_META = {
	system: { label: "System", icon: "◐" },
	light: { label: "Light", icon: "☀" },
	dark: { label: "Dark", icon: "☾" },
};
const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");

function docsThemePreference() {
	const fromPage = document.documentElement.dataset.themePreference;
	if (THEME_ORDER.includes(fromPage)) return fromPage;
	try {
		const stored = localStorage.getItem(THEME_KEY);
		if (THEME_ORDER.includes(stored)) return stored;
	} catch {}
	return "system";
}

function resolvedDocsTheme(preference) {
	return preference === "system" ? (themeMedia.matches ? "dark" : "light") : preference;
}

function syncDocsThemeControl(preference) {
	const meta = THEME_META[preference];
	const control = document.getElementById("themeToggle");
	document.getElementById("themeIcon").textContent = meta.icon;
	document.getElementById("themeLabel").textContent = meta.label;
	control.setAttribute("aria-label", `${meta.label} appearance. Click to change theme.`);
	control.title = `Appearance: ${meta.label}`;
}

function applyDocsTheme(preference, persist = false) {
	const safePreference = THEME_ORDER.includes(preference) ? preference : "system";
	document.documentElement.dataset.themePreference = safePreference;
	document.documentElement.dataset.theme = resolvedDocsTheme(safePreference);
	syncDocsThemeControl(safePreference);
	if (persist) {
		try { localStorage.setItem(THEME_KEY, safePreference); } catch {}
	}
}

document.getElementById("themeToggle").addEventListener("click", () => {
	const current = docsThemePreference();
	applyDocsTheme(THEME_ORDER[(THEME_ORDER.indexOf(current) + 1) % THEME_ORDER.length], true);
});
themeMedia.addEventListener("change", () => {
	if (docsThemePreference() === "system") applyDocsTheme("system");
});
window.addEventListener("storage", (event) => {
	if (event.key === THEME_KEY) applyDocsTheme(THEME_ORDER.includes(event.newValue) ? event.newValue : "system");
});
applyDocsTheme(docsThemePreference());

/* ---------------------------------------------------------------- nav */
const NAV = [
	{ sec: "Get started", items: [
		["/", "What is Itsuki?"],
		["/quickstart", "Quickstart"],
		["/faq", "FAQ"],
	]},
	/* Task-shaped: "I want to do X". Kept deliberately distinct from
	   "How it works", which explains the machinery behind the same words. */
	{ sec: "How-to guides", items: [
		["/guides/save", "Save memory"],
		["/guides/recall", "Recall memory"],
		["/guides/rules", "Control what gets remembered"],
		["/guides/versions", "Corrections & rollback"],
		["/guides/projects", "Projects & teams"],
		["/guides/export", "Export & delete"],
	]},
	/* One section for every client you point at the service. The old split
	   between "Connect a tool" and "Agent harnesses" put two agentic CLIs on
	   one side and three on the other. */
	{ sec: "Connect your tools", items: [

<h1>What is Itsuki?</h1>
<p class="lede">What Itsuki stores, how one sentence becomes a stored fact, and which of the three doors your project should use.</p>

<p>Itsuki (樹, "tree") is a memory service for AI tools. A connected tool <b>saves</b> durable facts about you and later <b>recalls</b> them, so the assistant you talk to tomorrow starts from what you told it today. What it keeps is not the conversation. It is a structured graph of memories, details, events and the connections between them, and every part of it is visible and editable in your dashboard.</p>

<h2>The problem it solves</h2>
<p>A model forgets everything between sessions. The usual repair is to keep the transcript and paste it back in. The prompt then grows without bound, corrections do not stick because the original wrong line is still sitting in the history, and nobody — including you — can say what the assistant actually believes about you.</p>
<p>Itsuki takes the opposite position: text goes in, a small set of durable facts comes out, and the transcript is not what gets recalled. Three consequences are worth knowing before you build on it.</p>
<ul>
<li><b>Most of what you send is deliberately not stored.</b> A save that stores nothing is a working save, not a failure.</li>
<li><b>Every write returns a receipt</b> naming what was stored, what was skipped, and why.</li>
<li><b>What is stored is a list of readable things you can correct</b> — labelled entities, dated events, individual details — not an opaque embedding you can only query.</li>
</ul>

<h2>One sentence, end to end</h2>
<p>Two facts in one line, saved over the REST door:</p>
${codeBlock(`curl -X POST ${ORIGIN}/v1/save \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"content": "I started boxing last month. My grandmother passed away in May."}'`, "terminal")}

${outputBlock(`{
  "ok": true,
  "mode": "direct_save",
  "summary": "Saved: 4 fact(s) across 1 page.",
  "source_packet_id": "sp_9f2c1d4a…",
  "receipt_id": "receipt_door_sp_9f2c1d4a…",
  "counts": { "received": 1, "savedTotal": 4, "nodes": 2, "events": 2, "skipped": 0 }
}`)}

<p>Four objects, not one blob of text. This is what those four are:</p>
<table>
<tr><th>Kind</th><th>What was written</th></tr>
<tr><td><b>Entity</b> (node)</td><td><code>Boxing</code> — category <code>skill</code>, state <code>active</code></td></tr>
<tr><td><b>Event</b></td><td>on <code>Boxing</code>, action <code>started</code></td></tr>
<tr><td><b>Entity</b> (node)</td><td><code>Grandmother</code> — category <code>family</code></td></tr>
<tr><td><b>Event</b></td><td>on <code>Grandmother</code>, action <code>passed_away</code>, importance <code>life_significant</code></td></tr>
</table>

<p>The state on <code>Boxing</code> was not guessed by a model. Events drive it: <code>started</code>, <code>resumed</code>, <code>joined</code> and <code>launched</code> put an entity in <code>active</code>; <code>stopped</code>, <code>left</code> and <code>passed_away</code> put it in <code>inactive</code>; <code>completed</code> and <code>achieved</code> make it <code>completed</code>. Ask about it later:</p>

${codeBlock(`curl -X POST ${ORIGIN}/v1/recall \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"query": "what sport am I doing?"}'`, "terminal")}

${outputBlock(`{
  "ok": true,
  "summary": "Found relevant memory.",
  "recall_status": "light_recall",
  "reason": "targeted_query",
  "context": "Boxing (skill, state: active) - started last month",
  "count": 1,
  "items": [
    { "type": "node", "id": "node_7c…", "label": "Boxing", "category": "skill", "score": 0.8421 }
  ]
}`)}

<p><code>context</code> is the point of the whole system: a compact plain-text block you paste straight into a prompt. <code>items</code> is the ranked shortlist behind it if you would rather render your own. Note what did <i>not</i> come back — the grandmother fact is stored and recallable, but it is not relevant to this question, so it is not in the context.</p>

<h2>Three ways in</h2>
<table>
<tr><th>Door</th><th>For</th><th>What it takes</th></tr>
<tr><td><b>MCP</b></td><td>AI chats and editors — Claude, ChatGPT, Cursor, Claude Code, and any MCP client</td><td>One private URL pasted into the client's connector settings, or an <code>Authorization: Bearer</code> key at <code>/mcp</code>. The door exposes eleven tools, among them <code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code>, <code>list_memories</code> and <code>whoami</code>.</td></tr>
<tr><td><b>REST API</b></td><td>Your own apps, agents and scripts</td><td>A Bearer key. Four endpoints do the work: <code>/v1/save</code>, <code>/v1/recall</code>, <code>/v1/turn</code> (recall and capture in one round trip), and <code>/v1/ingest</code> for whole conversations. First-party SDKs wrap them for Python and JavaScript.</td></tr>
<tr><td><b>Dashboard</b></td><td>You</td><td>A browser. <b>Memories</b> lists every stored object across three views — Memories, Sources, Suggestions — with an editor that keeps history and a Restore control. <b>Graph</b> draws it. <b>Requests</b> and <b>History</b> show what each write did.</td></tr>
</table>

<p>All three route through the same account, project and scope model, so a fact saved from Claude is recalled by your REST agent and shows up in the dashboard within seconds.</p>

<div class="warn"><b>A connected client is not proof of a save.</b> Over MCP, the host model decides when to call a tool. Itsuki tells it when to — the server hands every client an instruction ending "report exactly what the receipt says, and never claim something was saved without a receipt" — but the decision is still the client's. If you are not sure a save happened, look at <b>History</b>, whose subtitle states the contract plainly: <i>"A plain record of everything Itsuki saved, updated, or skipped — and when."</i></div>

<h2>What happens to your text</h2>
<p>The write path is the same for every door. In order:</p>
<ol class="steps">
<li><b>Secrets are stripped, before anything durable exists.</b><p>Scrubbing is the first content operation — ahead of the database row, the model and the vectors. It catches PEM private-key blocks, credentials inside URLs, query-string secrets, known key shapes (<code>sk-</code>, <code>ghp_</code>, <code>github_pat_</code>, AWS <code>AKIA</code>, Slack <code>xox…</code>, JWTs), bearer tokens in prose, high-entropy strings, and labelled values like <i>"password: …"</i>. Redaction <i>counts</i> ride onto the receipt; the values never do. It is deterministic pattern matching, not a model, and it is honest about its edge: an unlabelled passphrase of ordinary words is not caught, and personal information is not its job — that is what rules are for.</p></li>
<li><b>The raw text is preserved before anything judges it.</b><p>Every permitted message is written to a source episode at accept time, before the model is consulted. Preservation and promotion are separate on purpose: extraction declining to promote a fact no longer means the sentence is gone.</p></li>
<li><b>A job row is created before the response leaves.</b><p>The module states the invariant directly — a receipt without a job row is impossible by construction. The handle you get back is <code>source_packet_id</code>; poll <code>GET /v1/packets/&lt;id&gt;/status</code> with it to watch the write settle.</p></li>
<li><b>A model proposes. It never writes.</b><p>The extraction prompt opens: <i>"You extract durable, long-term MEMORY about the USER from their chat messages. You ONLY propose; a backend decides what is actually saved."</i> It may propose entities, events, details, edges, and weak "maybes" that go to a candidate queue rather than into memory.</p></li>
<li><b>The backend independently re-judges every proposal.</b><p>Keep, downgrade, or reject — per object, against confidence floors, junk rules and your own admission rules. An event whose subject entity the model forgot gets that entity auto-created rather than being dropped. Rejections are counted by reason and returned to you.</p></li>
<li><b>Approved objects commit in one atomic batch.</b><p>Behind a guard that re-checks for a deletion barrier, so a save already in flight can never resurrect something you erased while it ran. A background pass then refreshes summaries — revision-fenced, so it can never silently overwrite a correction you made by hand.</p></li>
</ol>

<h2>What recall does</h2>
<p>Reading is not a second conversation with a model. A recall makes one embedding call and, optionally, one reranker call. Nothing generative writes your answer.</p>
<ul>
<li><b>A gate decides whether to retrieve at all.</b> Smalltalk, an impersonal instruction like <i>"translate this"</i>, or an empty query returns <code>no_recall</code> — a normal <code>200</code> with <code>context: ""</code> and <code>count: 0</code>. A question is always treated as a recall signal and can never be gated off.</li>
<li><b>Five lanes run independently and are then fused.</b> Exact and alias matching, full-text search, vector similarity, two-hop graph expansion, and assertion-level ranking. Their ranked lists are combined by reciprocal rank fusion, deduplicated, and cut down to a diverse shortlist.</li>
<li><b>The context block is bounded on purpose.</b> A targeted query gets about 1,800 characters; a broad "what do you know about me" query gets 2,800; raising <code>limit</code> raises the budget up to a hard ceiling of 24,000. Memory should sharpen a prompt, not flood it.</li>
<li><b>A fact you just saved is findable immediately.</b> Text staged by a still-processing write is consulted before the search runs, and surfaces as a <i>Just saved (still being organized)</i> line.</li>
</ul>

<h2>What makes it different</h2>
<table>
<tr><th>Claim</th><th>The mechanism behind it</th></tr>
<tr><td>It stores facts, not chat logs</td><td>Entities carry a category from a fixed vocabulary (<code>person</code>, <code>family</code>, <code>skill</code>, <code>project</code>, <code>health</code>, <code>place</code>, <code>preference</code> and others); details and dated events hang off them; edges record stated relationships only, never mere co-mention.</td></tr>
<tr><td>Every write returns a receipt</td><td>A receipt carries the outcome, per-kind counts of what was created and reinforced, a histogram of skip reasons, and the full list of object ids created. <code>savedTotal: 0</code> with reason <i>"nothing durable here (chatter, a question, or a duplicate)"</i> is a legitimate, successful answer.</td></tr>
<tr><td>It will not claim a save that did not happen</td><td>Re-send identical content and you get the original verdict back, not a comfortable one. If the first attempt was skipped, the reply says so: <i>"Not saved — this exact content was sent before and skipped: &lt;reason&gt;."</i> The code names this as the one lie the product refuses to tell.</td></tr>
<tr><td>You can see and correct everything</td><td>Memories, Graph, Requests and History are all in the dashboard. Editing a memory keeps a version history with a Restore control, and an automatic pass can never silently revert a human edit.</td></tr>
<tr><td>Private by default</td><td>No ads, no third-party trackers, no training on your memory. <a href="#/privacy">Privacy &amp; limits</a> states the whole position, including where redaction stops.</td></tr>
</table>

<h2>Four behaviours that surprise people</h2>
<table>
<tr><th>What you see</th><th>Why</th></tr>
<tr><td><code>ok: true</code> with <code>savedTotal: 0</code></td><td>Nothing durable was in it. Questions, small talk and repeats are supposed to store nothing.</td></tr>
<tr><td>A fact saved seconds ago is missing from recall</td><td>Extraction runs in the background. The response carries <code>processing_note</code>: <i>"A recent save is still processing — some facts may not appear yet."</i></td></tr>
<tr><td><code>context: ""</code> on a perfectly good question</td><td>Either the gate declined to retrieve, or nothing scored high enough. Both are a <code>200</code>, never an error.</td></tr>
<tr><td>A connected chat client stored nothing</td><td>The host model chose not to call the tool. Check <b>History</b> — a save you cannot find a receipt for did not happen.</td></tr>
</table>

<p class="lede">Save your first memory from the command line, read it back, and learn how to tell whether it actually worked.</p>

${prereq([

PAGES["/install/claude"] = { title: "Connect Claude", html: `
<h1>Connect Claude</h1>
<p class="lede">Give Claude at claude.ai a memory that outlives the conversation — added once as a remote custom connector, switched on per chat, and verified by a tool call that reports exactly which memory space it is attached to.</p>

${prereq([
	`An ${PRODUCT.name} project you can create keys in. If your role cannot, the button on <b>Get started</b> is replaced by a note reading <i>"Your role cannot create project keys."</i> — see <a href="#/guides/projects">Projects &amp; teams</a>.`,
	`A Claude account. Remote custom connectors are a beta on Free, Pro, Max, Team and Enterprise, and a Free account is limited to one custom connector. Anthropic's <a href="https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp" target="_blank" rel="noopener">custom-connector guide</a> is the authority on current gating.`,
	`A computer browser. The Claude mobile apps cannot add a connector — add it once on a computer and it is there on your phone afterwards.`,
	`On Team or Enterprise, an Owner or Primary Owner: a custom connector is added for the whole organization, not per person.`,
])}

<h2>1 · Create the link and add the connector</h2>
<ol class="steps">
<li><b>Open Get started, then the Claude card.</b><p>In the left rail under <b>Setup</b>, choose <b>Get started</b>. The card is <b>Claude</b>, under the <b>AI Assistants</b> tab. Its first step is titled <i>Create your link</i>.</p></li>
<li><b>Click Create link, then copy the URL.</b><p>The dialog is headed <b>Create MCP link</b> and has one optional field, <b>Key name</b>. What comes back is labelled <b>Your MCP link</b> with the warning <i>"Copy it now. This MCP link won't be shown again."</i> Only a hash is kept on the server, so a lost link is replaced rather than recovered. Press <b>Close</b> when you have it — dismissing any other way gets you <i>"Use Close after you have copied this one-time secret."</i></p></li>
<li><b>Open Claude's connector settings.</b><p>In Claude, go to <b>Customize → Connectors → + → Add custom connector</b>. This <a href="https://claude.ai/settings/connectors?modal=add-custom-connector" target="_blank" rel="noopener">direct link</a> opens the same dialog.</p></li>
<li><b>Name it, paste the URL, click Add.</b><p>Name it <code>${PRODUCT.name.toLowerCase()}</code>. Paste the whole URL, including the token segment. There is no sign-in step and no OAuth prompt: the credential <i>is</i> the last path segment, which is exactly why the URL is a secret.</p></li>
<li><b>Switch it on inside a chat.</b><p>Start a new chat, click <b>+</b> at the bottom left, choose <b>Connectors</b>, and enable <code>${PRODUCT.name.toLowerCase()}</code>.</p></li>
</ol>

${codeBlock(`${ORIGIN}/mcp/${PRODUCT.tokenPrefix}your_link_here`, "mcp url")}

<div class="warn"><b>Step 5 is the one everybody misses.</b> A saved connector is inert until it is enabled in the chat you are actually typing in. If Claude answers "I don't have access to that" in a brand-new conversation, this is almost always why — not the link, not the key.</div>

<div class="note"><b>An MCP link is not an API key, even though they look identical.</b> Both are 32 random bytes behind an <code>${PRODUCT.tokenPrefix}</code> prefix; only a stored type field differs. The <b>API Keys</b> screen mints API keys only — it has no MCP button. MCP links come from <b>Get started</b>. The key table's <b>Type</b> column, reading <code>API</code> or <code>MCP</code>, is the only way to tell an existing one apart. See <a href="#/api/auth">Authentication &amp; keys</a>.</div>

<h2>2 · Verify the connection</h2>
<p>A successful add makes Claude list the connector with its tools — eleven of them. Do not stop there: ask for the identity tool, which answers the three questions a wrong setup gets wrong.</p>

${codeBlock(`Use the whoami tool and tell me what it says.`, "say this")}

${outputBlock(`Connected to Itsuki memory (server 0.7.0). Project: Personal. Scopes: memory:read, memory:write. Stored: 12 memories (9 facts, 3 pages), 24 events, 0 pending candidates.`, "Tool result")}

<p>Read it as three checks:</p>
<table>
<tr><th>Part</th><th>What it proves</th></tr>
<tr><td><b>Project</b></td><td>Which project this link is bound to. A link is permanently bound to the project it was created in and cannot read or write another. If the name is wrong, you made the link in the wrong project.</td></tr>
<tr><td><b>Scopes</b></td><td>What this connection may do. <code>memory:read</code> alone means Claude can recall but not save — the link's declared scopes are intersected with its creator's <i>current</i> project role on every request, so a role change narrows a live connector with nothing to revoke.</td></tr>
<tr><td><b>Stored</b></td><td>Live counts, straight from the database. Run it again after a save; if the numbers moved, the round trip works.</td></tr>
</table>

<div class="note">Opening the MCP URL in a browser proves nothing. The endpoint speaks MCP JSON-RPC over POST — a browser <code>GET</code> is not a meaningful test of the link. The <code>whoami</code> tool is.</div>

<h2>3 · Save one fact, then recall it in a new chat</h2>
<p>Recall across conversations is the whole point, so test it across two conversations. In the chat you just verified:</p>

${codeBlock(`Save this to ${PRODUCT.name.toLowerCase()}: I prefer concise project updates.`, "say this")}

<p>Claude may ask you to approve the write the first time. The tool answers with a receipt, and Claude relays it:</p>

${outputBlock(`Saved: 1 node (Project updates), 1 slice.`, "Tool result")}

<div class="note"><b>A receipt that says nothing was saved is a working save.</b> If you send a question, small talk, or something already stored, the receipt reads <code>Saved: 0. Reason: …</code> with the reason spelled out. ${PRODUCT.name} keeps durable facts, not transcripts. See <a href="#/concepts/receipts">Receipts</a>.</div>

<p>Now open a <b>new</b> chat, enable the connector there too, and ask:</p>

${codeBlock(`What project-update style do I prefer?`, "say this")}

<p>The tool hands Claude the recalled memory itself, not a status line, so the model can answer directly from it:</p>

${outputBlock(`Relevant memory for this user:

Project updates — preference
- prefers concise project updates`, "Tool result")}

<p>If the recall comes back empty seconds after the save, that is timing rather than failure: extraction finishes in the background. Ask again, or ask Claude to run <code>list_memories</code> to see what actually landed.</p>

<h2>What the connector gives Claude</h2>
<table>
<tr><th>Tool</th><th>What Claude uses it for</th></tr>
<tr><td><code>recall_memory</code></td><td>Meaning-based lookup. The tool's text result is the recalled context itself.</td></tr>
<tr><td><code>save_memory</code></td><td>One durable fact you stated, in your words.</td></tr>
<tr><td><code>save_conversation</code></td><td>Several turns at once, when a discussion produced lasting decisions.</td></tr>
<tr><td><code>list_memories</code> · <code>get_memory</code></td><td>Browse and open what is stored, newest first, without leaving the chat.</td></tr>
<tr><td><code>update_memory</code> · <code>memory_history</code> · <code>rollback_memory</code></td><td>Correct a memory against its exact current revision, read its history, restore an earlier revision as a new forward one.</td></tr>
<tr><td><code>delete_memory</code> · <code>delete_all_memories</code></td><td>Guarded erasure. Bulk deletion previews first and destroys nothing without an explicit confirmation.</td></tr>
<tr><td><code>whoami</code></td><td>Identity, scopes, bound project, live counts.</td></tr>
</table>
<p>Full input schemas are in <a href="#/api/mcp">MCP tools</a>. Deletion is a separate capability from writing: a connector whose creator is a project member, not an admin, gets <i>"Forbidden: your project role does not allow deleting memories."</i> even though the tools are listed.</p>

<h2>Make Claude reach for memory on its own</h2>
<p>${PRODUCT.name} never decides when a tool runs — the host model does. Tool descriptions are one lever; standing instructions in Claude are the other. Paste this into <b>Settings → Profile</b>, or into a Project's instructions to keep it scoped to that Project:</p>

${codeBlock(`You have an ${PRODUCT.name} memory tool. At the start of each conversation, call recall_memory to load what you already know about me. When I share something durable — a decision, preference, plan, person, or project — call save_memory without being asked. When a conversation produces lasting decisions or plans, call save_conversation with the relevant turns. Prefer sending my own words over your paraphrase. Never say you saved something unless you got the receipt back.`, "custom instructions")}

<p>This raises the odds; it is not a guarantee, and no connector can make one. If you need capture on every single turn, drive it from your own code with <code>POST /v1/turn</code> and read its receipt — see <a href="#/guides/save">Saving memory</a>.</p>

<h2>When it doesn't work</h2>
<table>
<tr><th>What you see</th><th>What it means</th><th>Fix</th></tr>
<tr><td><i>"That is an API key, not an MCP link…"</i></td><td>You pasted an API key into the connector URL. The server re-checks the token as an API key purely so it can name the mistake.</td><td>Mint an MCP link: <b>Get started → Claude → Create link</b>. API keys travel in an <code>Authorization: Bearer</code> header and never in a URL.</td></tr>
<tr><td><i>"That MCP link is revoked, expired, or not an MCP token."</i></td><td>The key behind the link was deleted, or the URL was truncated on the way in.</td><td>Create a fresh link and update the connector. Deleting a key stops it working immediately.</td></tr>
<tr><td>The connector is saved, but Claude has no memory tools in this chat</td><td>A saved connector stays off until enabled per chat.</td><td><b>+</b> → <b>Connectors</b> → switch on <code>${PRODUCT.name.toLowerCase()}</code>. Repeat in each new conversation.</td></tr>
<tr><td>No <b>Add custom connector</b> option</td><td>On Team and Enterprise, custom connectors are added for the organization, not by individual members.</td><td>An Owner or Primary Owner adds it. Everyone else then enables it per chat.</td></tr>
<tr><td>No connector settings at all, on a phone</td><td>The mobile apps cannot add connectors.</td><td>Add it in a computer browser once; it is then available on mobile.</td></tr>
<tr><td>Claude answers the question but never calls a tool</td><td>By design — the host model chooses when tools run.</td><td>Ask explicitly ("save that to ${PRODUCT.name.toLowerCase()}"), or add the standing instructions above.</td></tr>
<tr><td><i>"You're sending requests very quickly — wait a few seconds and try again."</i></td><td>A rate bucket tripped for this credential. It arrives as a readable sentence so the model can relay it rather than breaking the turn.</td><td>Wait, then retry. See <a href="#/api/limits">Rate limits</a>.</td></tr>
<tr><td><code>whoami</code> names a project you did not expect</td><td>The link is bound to the project it was created in, permanently.</td><td>Switch to the right project in the app, create a link there, and replace the connector's URL.</td></tr>
<tr><td><code>whoami</code> reports <code>Scopes: memory:read</code> only</td><td>The role of whoever created the link no longer permits writing, so the write tools refuse with <code>insufficient_scope</code>.</td><td>Restore the role, or have someone with write access create the link.</td></tr>
</table>

<div class="note"><b>Use one link per tool.</b> Each connector holding its own credential is the whole rotation story: delete one from <b>API Keys</b> and only that connector stops, with nothing else to reconfigure. Claude's UI, plan gating and beta status are Anthropic's to change — <a href="https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp" target="_blank" rel="noopener">their guide</a> is the authority if a screen here no longer matches.</div>

${nextSteps([
	["#/api/mcp", "MCP tools", "Every tool this connector exposes, with its inputs and guarantees."],
	["#/guides/rules", "Capture rules", "Decide what Itsuki is allowed to keep before Claude sends it."],
	["#/install/chatgpt", "Connect ChatGPT", "The same memory through a workspace MCP app."],
	["#/api/auth", "Authentication & keys", "Why an MCP link is not an API key, and what a role change narrows."],
])}
` };

PAGES["/install/chatgpt"] = { title: "Connect ChatGPT", html: `
<h1>Connect ChatGPT</h1>
<p class="lede">A custom MCP app in your ChatGPT workspace that saves durable facts to ${PRODUCT.name} as you talk and reads them back in a later chat.</p>

<div class="warn"><b>This is gated by OpenAI, not by ${PRODUCT.name}.</b> Full MCP write actions are a beta limited to ChatGPT Business and Enterprise/Edu on the web. Free, Plus and Pro accounts cannot run them, and a Pro custom app is read/fetch only. Custom MCP apps are web-only, and agent mode does not use them. Screen names and permissions move while a beta is open, so OpenAI's <a href="https://help.openai.com/en/articles/12584461-developer-mode-and-full-mcp-connectors-in-chatgpt-beta" target="_blank" rel="noopener">developer mode and full MCP connectors guide</a> is the authority for anything on their side of this page.</div>

<p>The read/fetch limit is worth understanding rather than working around. A read-only custom app expects a server to publish tools named <code>search</code> and <code>fetch</code>. ${PRODUCT.name}'s MCP server publishes eleven tools and none of them are those — the read side is <code>recall_memory</code>, <code>list_memories</code> and <code>get_memory</code>. So a read/fetch-only app connected here has nothing it knows how to call. The account-type requirement is a hard prerequisite, not a nicety.</p>

${prereq([
	`A ChatGPT workspace on <b>Business</b> or <b>Enterprise/Edu</b>, and workspace-admin access to it. Enabling developer mode and publishing an app are both admin actions.`,
	`An ${PRODUCT.name} account whose project role can create keys. If yours cannot, <b>Get started</b> shows <i>"Your role cannot create project keys."</i> where the button belongs — see <a href="#/guides/projects">Projects &amp; teams</a>.`,
	`A desktop browser for both halves. ChatGPT's mobile apps have no custom-app flow, and ${PRODUCT.name} shows an MCP link exactly once.`,
])}

<h2>Set it up</h2>
<ol class="steps">
<li><b>Open Get started, then the ChatGPT card.</b><p>In ${PRODUCT.name}'s left rail, under <b>Setup</b>, choose <b>Get started</b>. The catalog opens on <i>Connect ${PRODUCT.name} 樹 to your stack</i>. Select the <b>AI Assistants</b> tab, or type ChatGPT into <i>Search integrations…</i>, then open the <b>ChatGPT</b> card.</p></li>

<li><b>Create the MCP link from the card itself.</b><p>Step <b>03</b> of the card, <i>Create a custom MCP app</i>, carries a code block labelled <b>mcp url</b>. While that block still reads <code>${ORIGIN}/mcp/YOUR_MCP_KEY</code> it is deliberately not copyable: the copy icon is replaced by a <b>Create link</b> button, so nobody walks off with a string that cannot work. Click it, optionally fill in <b>Key name (optional)</b>, and click <b>Create</b>.</p></li>
</ol>

${outputBlock(`Your MCP link
${ORIGIN}/mcp/${PRODUCT.tokenPrefix}…

Copy it now. This MCP link won't be shown again.`, "What the dialog shows")}

<ol class="steps" start="3">
<li><b>Copy the link before you leave the page.</b><p>Only a hash of it is stored, so a lost link is replaced rather than recovered. While one is live the card carries a banner reading <i>"This one-time MCP link is visible in the setup below. Copy it before leaving this project; it cannot be retrieved again."</i> Treat the whole URL as a password — the credential is its last path segment.</p></li>

<li><b>Enable developer mode in ChatGPT.</b><p>A workspace admin, in a browser: <b>Settings → Apps → Advanced settings</b>. On Enterprise/Edu, developer access is granted first under <b>Permissions &amp; Roles</b>. Both are subject to workspace policy.</p></li>

<li><b>Create the custom MCP app.</b><p>From <b>Workspace settings → Apps → Create</b>. Name it <code>${PRODUCT.name.toLowerCase()}</code> and give it the link from step 2 as the MCP server URL. The credential rides inside that URL, so the app needs no separate authentication configured. Review the tool list and the write permissions ChatGPT shows you before continuing.</p></li>

<li><b>Publish it to the workspace.</b><p>Send the reviewed app through your workspace's approval step so members can install it.</p></li>

<li><b>Enable it in a new web chat.</b><p>A published app stays off until a chat turns it on — this is the step people skip. Start a fresh chat on the web and enable <code>${PRODUCT.name.toLowerCase()}</code>. Expect a confirmation prompt the first time a write action runs; approving it is what lets <code>save_memory</code> fire.</p></li>
</ol>

<div class="note"><b>There is a second door, if a URL-borne credential does not suit you.</b> The same server answers at the bare URL <code>${ORIGIN}/mcp</code> over OAuth: it publishes protected-resource metadata (RFC 9728), authorization-server metadata (RFC 8414), and dynamic client registration (RFC 7591), so a connector configured to <i>authorize</i> rather than to carry a secret can discover and register itself. You then approve the connection on an ${PRODUCT.name} consent screen, and the grant is re-intersected with your current project role on every request — a role change narrows it with nothing to revoke. The MCP link above is the route ${PRODUCT.name}'s own setup flow uses, and the one to try first.</div>

<h2>Verify the connection</h2>
<p>Ask for <code>whoami</code>. It is the one tool that answers without writing anything, and it reports what the connection actually resolved to rather than what you meant to configure.</p>

${codeBlock(`Use ${PRODUCT.name.toLowerCase()}'s whoami tool and show me the result.`, "say this")}

${outputBlock(`Connected to ${PRODUCT.name} memory (server 0.7.0). Project: Default project. Scopes: memory:read, memory:write. Stored: 12 memories (9 facts, 3 pages), 5 events, 0 pending candidates.`, "whoami result")}

<p>Read three things there. <b>Project</b> names the project this link is bound to and cannot leave. <b>Scopes</b> tells you whether the connection may write at all — without <code>memory:write</code> the save tools are not even advertised. The counts are live, so they are also your before-picture for the next step.</p>

<h2>Save one fact, then recall it</h2>
${codeBlock(`Save this to ${PRODUCT.name.toLowerCase()}: I prefer concise project updates.`, "say this")}

${outputBlock(`Saved: 1 node (Project updates), 1 slice.`, "save_memory result")}

<p>Now open a <b>different</b> chat with the app enabled. Recall across a chat boundary is the thing worth proving — a model repeating something from earlier in the same conversation proves nothing.</p>

${codeBlock(`What project-update style do I prefer?`, "say this")}

${outputBlock(`Relevant memory for this user:

Project updates — preference
- prefers concise ones`, "recall_memory result")}

<p>That text is not a summary of the recall — it <i>is</i> the recalled context, handed to the model as the tool's result. The structured payload rides alongside for clients that read it. Open <b>Memories</b> in the ${PRODUCT.name} app and the same fact is in the list.</p>

<div class="note"><b>A save that stores nothing is a working save.</b> If you say something that is chatter, a question, or a repeat of what is already stored, the tool answers <i>"Saved: 0. Reason: nothing durable here (chatter, a question, or a duplicate)."</i> That is the engine reading your text and deciding it held no lasting fact. It is information, not an error to retry.</div>

<h2>Make ChatGPT call the tools without being asked</h2>
<p>The host model decides when a tool runs. Nothing the server returns can force a call, and no wording on this page changes that. What you can do is ask for the behaviour up front — paste this into <b>Settings → Personalization → Custom instructions</b>. It is the same text the ChatGPT card offers in the app:</p>

${codeBlock(`You have an ${PRODUCT.name} memory tool. At the start of each conversation, call recall_memory to load what you already know about me. When I share something durable — a decision, preference, plan, person, or project — call save_memory without being asked. When a conversation produces lasting decisions or plans, call save_conversation with the relevant turns. Prefer sending my own words over your paraphrase. Never say you saved something unless you got the receipt back.`, "custom instructions")}

<p>If you need a call to happen on every single turn, do not ask a model for it. Call <code>POST /v1/turn</code> from your own code and inspect its receipt — see the <a href="#/api/rest">REST API reference</a>.</p>

<h2>What the app can call</h2>
<table>
<tr><th>Tool</th><th>What it does</th></tr>
<tr><td><code>save_memory</code></td><td>One durable fact, in your words. Returns a final receipt, not an acknowledgement.</td></tr>
<tr><td><code>save_conversation</code></td><td>Several turns at once, oldest first. A stable conversation id converges re-sends onto one page.</td></tr>
<tr><td><code>recall_memory</code></td><td>Search stored memory. The text result is the context itself.</td></tr>
<tr><td><code>whoami</code></td><td>Identity, scopes, bound project, live counts. The diagnostic above.</td></tr>
</table>
<p>Seven more — <code>list_memories</code>, <code>get_memory</code>, <code>update_memory</code>, <code>memory_history</code>, <code>rollback_memory</code>, <code>delete_memory</code>, <code>delete_all_memories</code> — are documented in <a href="#/api/mcp">MCP tools</a>. Write tools are advertised only to a connection whose scopes permit them, and the delete tools need the distinct delete capability rather than write. If ChatGPT lists only the read tools, the credential or your project role is read-only; the connection is not broken.</p>

<h2>When it doesn't work</h2>
<table>
<tr><th>What you see</th><th>What it means</th><th>Fix</th></tr>
<tr><td><code>That is an API key, not an MCP link.</code></td><td>You pasted a key from the <b>API Keys</b> screen. The URL door accepts MCP links only — the two secrets look identical, because both are random bytes behind the same <code>${PRODUCT.tokenPrefix}</code> prefix.</td><td>Mint the link from <b>Get started</b>, not from <b>API Keys</b>. See <a href="#/api/auth">Authentication &amp; keys</a>.</td></tr>
<tr><td><code>That MCP link is revoked, expired, or not an MCP token.</code></td><td>The link was deleted, or it belongs to a project this account no longer reaches.</td><td>Create a fresh link and update the app's server URL.</td></tr>
<tr><td><code>No credential. Authorize with OAuth, send Authorization: Bearer &lt;your API key&gt; to /mcp, or connect an MCP link URL.</code></td><td>The URL arrived as <code>${ORIGIN}/mcp</code> with nothing after it — usually a copy that stopped at the ellipsis in the dialog.</td><td>Paste the whole URL, including the token as its last path segment.</td></tr>
<tr><td><code>Forbidden: token lacks required scope.</code></td><td>The connection resolved, but not to write. Scopes are intersected with your <i>current</i> project role on every request, so a role change narrows a working link with no revocation involved.</td><td>Check <code>whoami</code>. If <code>Scopes</code> lists only <code>memory:read</code>, the fix is the role or the credential, not the app.</td></tr>
<tr><td><code>You're sending requests very quickly — wait a few seconds and try again.</code></td><td>A rate bucket tripped. This arrives as a tool <i>result</i>, deliberately: an HTTP error would tear down the MCP connection and the model would never see why.</td><td>Wait and repeat. See <a href="#/api/limits">Rate limits</a>.</td></tr>
<tr><td>The app is not in the chat's tool list</td><td>Publishing installs it; a chat still has to enable it. Agent mode does not use custom MCP apps at all.</td><td>Enable it in a fresh web chat. If it is missing everywhere, the workspace has not approved it.</td></tr>
<tr><td>ChatGPT talks about your memory but never calls a tool</td><td>The model chose not to. It can also claim a save it never made.</td><td>Ask explicitly, add the custom instructions above, and never trust a save you have no receipt for.</td></tr>
</table>

<h2>Where to go next</h2>
${nextSteps([
	["#/api/mcp", "MCP tools", "Every tool the app can call, and what each one accepts."],
	["#/api/auth", "Authentication & keys", "Why an API key in an MCP URL is refused, and what a scope really gates."],
	["#/guides/save", "Save memory properly", "What gets kept, what gets dropped, and what a receipt promises."],
	["#/install/claude", "Connect Claude", "The same kind of link, in Claude's custom connectors."],
])}
` };

PAGES["/install/claude-code"] = { title: "Connect Claude Code (MCP)", html: `
<h1>Connect Claude Code (MCP)</h1>
<p class="lede">One command puts the memory tools into every Claude Code session in a directory you choose, and you finish able to prove from the terminal that they are live.</p>

${prereq([
	`Claude Code on your PATH. Run <code>claude mcp add --help</code>: it must list <code>-t, --transport</code> with <code>http</code> among its values, which is the transport this page uses.`,
	`An ${PRODUCT.name} account at <a href="${ORIGIN}" target="_blank" rel="noopener">${ORIGIN}</a> whose project role can create keys. Without that capability the app shows <i>"Your role cannot create project keys."</i> where the button would be — see <a href="#/guides/projects">Projects &amp; teams</a>.`,
	`A decision about which credential to carry: an <b>MCP link</b> in the URL, or an <b>API key</b> in a header. <a href="#/api/auth">Authentication &amp; keys</a> explains the difference; both routes are on this page.`,
])}

<h2>MCP server, or the plugin?</h2>
<p>Both give Claude Code the same memory. They differ in what happens when you are not asking for it.</p>

<table>
<tr><th></th><th>This page — MCP server</th><th><a href="#/install/plugin">Claude Code plugin</a></th></tr>
<tr><td><b>Setup</b></td><td>One <code>claude mcp add</code> command</td><td><code>claude plugin marketplace add</code>, then <code>/plugin configure</code></td></tr>
<tr><td><b>Credential</b></td><td>An MCP link in the URL, or an API key in an <code>Authorization</code> header you type into the command</td><td>An API key you paste into a masked prompt; Claude keeps it in its own credential store and exports it only to plugin subprocesses</td></tr>
<tr><td><b>Node runtime</b></td><td>Not needed</td><td>Node 22 or 24 LTS, by absolute path</td></tr>
<tr><td><b>Automatic capture</b></td><td>None. Nothing is written unless the model calls a tool.</td><td>SessionEnd scrubs and queues what the session learned locally; the next SessionStart delivers it and loads project memory</td></tr>
<tr><td><b>Diagnostics</b></td><td><code>claude mcp list</code> and the <code>whoami</code> tool</td><td><code>/itsuki:doctor</code>, which checks files, hooks, outbox, key, network and the live tools</td></tr>
</table>

<p>If you want a session's outcomes captured without asking, use the plugin. If you want the tools and nothing else — a container, a shared machine, a directory you do not want lifecycle hooks in — stay here.</p>

<h2>Add the server</h2>

<ol class="steps">
<li><b>Mint an MCP link in the app.</b><p>In the left rail under <b>Setup</b>, open <b>Get started</b>, choose any client card, and click <b>Create link</b> on its first step (<i>"Create your link — Shown once. Save it."</i>). The field you copy from is labelled <b>Your MCP link</b> and holds the whole URL, not just the token. The <b>API Keys</b> screen has no <b>Create MCP link</b> button; that screen mints API keys only.</p></li>

<li><b>Copy it before you leave the page.</b><p>The app is explicit: <i>"Copy it now. This MCP link won't be shown again."</i> While the secret is on screen, a banner reads <i>"This one-time MCP link is visible in the setup below. Copy it before leaving this project; it cannot be retrieved again."</i> Only a hash is stored server-side, so a lost link is replaced, never recovered.</p></li>

<li><b>Register it from the directory you want it in.</b><p><code>claude mcp add</code> writes to the scope you are standing in, so run this from your project root.</p>
${codeBlock(`claude mcp add --transport http ${PRODUCT.name.toLowerCase()} ${ORIGIN}/mcp/${PRODUCT.tokenPrefix}your_link_here`, "terminal")}
${outputBlock(`Added HTTP MCP server ${PRODUCT.name.toLowerCase()} with URL: ${ORIGIN}/mcp/${PRODUCT.tokenPrefix}your_link_here to local config
File modified: /Users/you/.claude.json [project: /Users/you/code/your-app]`, "stdout")}
<p>Two things to read in that output. The URL is echoed <b>in full</b>, credential included — it is now in your scrollback and, depending on your shell, your history file. And <code>local</code> is the default scope, which is why the file line names both the config and the project it is tagged to.</p></li>

<li><b>Pick the scope on purpose.</b><p>Pass <code>-s</code> / <code>--scope</code> if <code>local</code> is not what you want. Claude Code describes the three itself:</p>
<table>
<tr><th>Scope</th><th>Claude Code calls it</th><th>Written to</th></tr>
<tr><td><code>local</code> (default)</td><td>Local config (private to you in this project)</td><td>Your user config, tagged with the current directory</td></tr>
<tr><td><code>user</code></td><td>User config (available in all your projects)</td><td>Your user config</td></tr>
<tr><td><code>project</code></td><td>Project config (shared via .mcp.json)</td><td><code>.mcp.json</code> in the current directory</td></tr>
</table>
<div class="warn"><b>Do not use <code>--scope project</code> with either credential.</b> <code>.mcp.json</code> is a file you commit, and both routes put a live secret in it — the MCP link is the URL, and the header form writes the key into the same file. Keep the server in <code>local</code> or <code>user</code> scope and let each person add their own. A key that reaches a repository has to be deleted in <b>API Keys</b>, not rotated.</div></li>

<li><b>Confirm the server is registered and healthy.</b><p>Still in the same directory. This command health-checks every configured server, so it is the fastest proof that the credential was accepted.</p>
${codeBlock(`claude mcp list`, "terminal")}
${outputBlock(`Checking MCP server health…

${PRODUCT.name.toLowerCase()}: ${ORIGIN}/mcp/${PRODUCT.tokenPrefix}your_link_here - ✔ Connected`, "stdout")}
<p><code>claude mcp get ${PRODUCT.name.toLowerCase()}</code> shows one server in detail; <code>claude mcp remove ${PRODUCT.name.toLowerCase()}</code> undoes the add.</p></li>

<li><b>Ask for the connection report inside a session.</b><p>Start a new Claude Code session and say this. The tools arrive named <code>mcp__${PRODUCT.name.toLowerCase()}__save_memory</code>, <code>mcp__${PRODUCT.name.toLowerCase()}__recall_memory</code> and so on — that prefixed form is also the name to use in a permission rule.</p>
${codeBlock(`use the ${PRODUCT.name.toLowerCase()} whoami tool and tell me what it reports`, "say this")}
${outputBlock(`Connected to ${PRODUCT.name} memory (server 0.7.0). Project: Personal. Scopes: memory:read, memory:write. Stored: 42 memories (31 facts, 11 pages), 18 events, 3 pending candidates.`, "whoami")}
<p>A live connection names the memory space it writes to, the scopes it actually holds, the project it is bound to, and current counts. If the counts move after you save something, the round trip works.</p></li>
</ol>

<h2>Save and recall something real</h2>
<p>Two turns prove the write path and the read path separately.</p>
${codeBlock(`save this to ${PRODUCT.name.toLowerCase()}: this repo deploys from the release branch, never from master`, "say this")}
<p>Then, in a <b>new</b> session in the same directory:</p>
${codeBlock(`what do you know about how this repo deploys?`, "say this")}
${outputBlock(`Relevant memory for this user:

release branch — deployment
- this repo deploys from it, never from master`, "recall_memory result")}
<p>That text block is the tool's entire result, by design: most MCP clients show the model only the <code>content</code> field, so <code>recall_memory</code> returns the recalled memory itself rather than a receipt describing it. The structured payload rides along for clients that read it.</p>

<div class="note"><b>Extraction is not instant.</b> A fact saved seconds ago may not be recallable yet. An empty recall is an honest success, not an error — it comes back with no context rather than a failure.</div>

<h2>Use an API key instead of a link</h2>
<p>Claude Code can send headers, so it does not need a path-token URL at all. Point it at the header door — <code>${ORIGIN}/mcp</code> with no token in the path — and supply an API key created in <b>API Keys</b>.</p>
${codeBlock(`claude mcp add --transport http ${PRODUCT.name.toLowerCase()} ${ORIGIN}/mcp \\
  --header "Authorization: Bearer ${PRODUCT.tokenPrefix}your_key_here"`, "terminal")}
${outputBlock(`Added HTTP MCP server ${PRODUCT.name.toLowerCase()} with URL: ${ORIGIN}/mcp to local config
Headers: {
  "Authorization": "[REDACTED]"
}
File modified: /Users/you/.claude.json [project: /Users/you/code/your-app]`, "stdout")}
<p>Same server, same tools. The difference worth knowing is in that output: header values whose name looks like a secret are printed as <code>[REDACTED]</code>, while a path-token URL is printed in full. If you care about what lands in your scrollback, prefer this route.</p>

<div class="note"><b>The two credentials are not symmetric.</b> An API key pasted into the <code>/mcp/&lt;token&gt;</code> URL is refused by name. An MCP link sent as <code>Authorization: Bearer</code> works — only the URL-path door is restricted to MCP-type credentials. Both secrets are the same shape, so the app's <b>Type</b> column, reading <code>API</code> or <code>MCP</code>, is the only way to tell which you are holding.</div>

<h2>What Claude Code gets</h2>
<p>Eleven tools are registered on the server. Your connection is shown a subset: write tools appear only when the credential carries <code>memory:write</code> <i>and</i> the creator's current project role still permits writing, and the delete tools require the separate delete capability, which write scope alone does not grant. A read-only key never sees a save tool it could only ever be refused.</p>

<table>
<tr><th>Tool</th><th>What it does</th><th>Shown when</th></tr>
<tr><td><code>recall_memory</code></td><td>Returns the compact context block for a query. The text result is the memory itself.</td><td>Always</td></tr>
<tr><td><code>save_memory</code></td><td>Saves one durable fact in the user's own words and returns a receipt.</td><td>Write</td></tr>
<tr><td><code>save_conversation</code></td><td>Captures several turns verbatim, oldest first. A stable <code>conversationId</code> converges every re-send onto one Conversation page.</td><td>Write</td></tr>
<tr><td><code>list_memories</code></td><td>Browses stored memories newest first and returns the ids the other tools accept. Substring filter, not semantic search.</td><td>Always</td></tr>
<tr><td><code>get_memory</code></td><td>One object by id, with its current text, history slices and dated events.</td><td>Always</td></tr>
<tr><td><code>whoami</code></td><td>Identity and health: memory space, scopes, bound project, live counts.</td><td>Always</td></tr>
<tr><td><code>update_memory</code></td><td>Corrects one memory against the exact revision you read. A stale revision is refused, never overwritten.</td><td>Write</td></tr>
<tr><td><code>rollback_memory</code></td><td>Restores an earlier revision as a new forward revision. History is never rewound.</td><td>Write</td></tr>
<tr><td><code>memory_history</code></td><td>One memory's bounded revision history, newest first, with snapshots.</td><td>Always</td></tr>
<tr><td><code>delete_memory</code></td><td>Permanently deletes one object by id.</td><td>Delete capability</td></tr>
<tr><td><code>delete_all_memories</code></td><td>Previews by default. Destroys only when explicitly confirmed.</td><td>Delete capability</td></tr>
</table>

<p><a href="#/api/mcp">MCP tools</a> documents every argument. If a tool you expected is absent, that is the gating above, not a broken install — <code>whoami</code> prints the scopes your connection actually resolved to.</p>

<h2>Make the calls happen without asking</h2>
<p>The host model decides when a tool runs; nothing on the server can force a call. Standing instructions are the only lever, so put them where Claude Code reads them every session — your <code>CLAUDE.md</code>, or your user-level instructions:</p>
${codeBlock(`You have an ${PRODUCT.name} memory tool. At the start of each session, call recall_memory to load what you already know about this project. When I state something durable — a decision, a constraint, a convention — call save_memory without being asked. When a session produces lasting decisions, call save_conversation with the relevant turns. Prefer my own words over your paraphrase. Never say you saved something unless you got the receipt back.`, "CLAUDE.md")}
<p>This raises the odds, not to certainty. If you need a guaranteed write per turn, call <a href="#/api/rest">the REST API</a> from your own code and read the receipt.</p>

<h2>When it doesn't work</h2>
<table>
<tr><th>What you see</th><th>What it means</th><th>Fix</th></tr>
<tr><td><i>That is an API key, not an MCP link. API keys authenticate at POST /mcp with an 'Authorization: Bearer &lt;key&gt;' header…</i></td><td>You pasted an API key into the URL. The server re-checks the token as an API key so it can name the mistake instead of sending you to regenerate a link that was never the problem.</td><td>Either mint an MCP link from <b>Get started</b>, or keep the key and use the <code>--header</code> form above.</td></tr>
<tr><td><i>That MCP link is revoked, expired, or not an MCP token.</i></td><td>The token in the URL is not a live MCP-type credential — deleted in <b>API Keys</b>, or truncated on copy.</td><td>Mint a fresh link and re-run <code>claude mcp add</code> after <code>claude mcp remove</code>.</td></tr>
<tr><td><i>That key is revoked or not valid. Create one at ${ORIGIN} under API keys…</i></td><td>The header door rejected the Bearer key.</td><td>Create a new API key in <b>API Keys</b>. Note the credential is the token alone — pasting the full <code>https://…</code> link into a Bearer header fails.</td></tr>
<tr><td><code>! Needs authentication</code> in <code>claude mcp list</code></td><td>A refused credential, not a missing login. The 401 carries an RFC 9728 <code>www-authenticate</code> challenge, which the client reads as an OAuth prompt.</td><td>Treat it as one of the three refusals above and re-check the URL you registered.</td></tr>
<tr><td><code>✘ Failed to connect — Server rejected the configured Authorization header (HTTP 401)</code></td><td>The header route with a key the server will not accept. Claude Code adds that OAuth fallback is disabled once <code>headers.Authorization</code> is set, so it will not retry another way.</td><td>Replace the key in the server entry, or remove and re-add it.</td></tr>
<tr><td><i>Warning: The command "…" looks like a URL, but is being interpreted as a stdio server as --transport was not specified.</i></td><td>You omitted <code>--transport http</code>, so Claude Code tried to run the URL as a local command.</td><td>Remove the entry and re-add it with <code>--transport http</code>.</td></tr>
<tr><td><i>Invalid scope: … Must be one of: local, user, project</i></td><td>A typo in <code>--scope</code>.</td><td>Use one of the three exact values.</td></tr>
<tr><td><i>You're sending requests very quickly — wait a few seconds and try again.</i></td><td>A rate bucket tripped. It arrives as an ordinary tool <i>result</i> carrying <code>error: "rate_limited"</code> and <code>retry_after_s: 60</code>, not as an HTTP 429 — so the session keeps working and the model can relay the sentence.</td><td>Pause the loop that caused it. See <a href="#/api/limits">Rate limits</a>.</td></tr>
<tr><td>No <code>save_</code> tools in the session</td><td>The credential lacks <code>memory:write</code>, or its creator's role no longer permits writing. Roles are re-resolved on every request, so a downgrade narrows an existing key with nothing to revoke.</td><td>Check <code>whoami</code>. If scopes read <code>memory:read</code> only, use a key with write scope.</td></tr>
<tr><td>No <code>delete_</code> tools in the session</td><td>Deletion is a distinct capability. A member who can write but not delete does not gain deletion through this door.</td><td>Nothing to fix unless deletion is intended — a project admin's key carries it.</td></tr>
<tr><td>Claude never calls the tools on its own</td><td>By design. The host decides when a tool runs.</td><td>Add the standing instructions above, or ask explicitly in the turn.</td></tr>
</table>

<h2>Where to go next</h2>
${nextSteps([
	["#/install/plugin", "Claude Code plugin", "The same tools plus lifecycle hooks, an outbox, and /itsuki:doctor."],
	["#/api/mcp", "MCP tools", "Every argument, every result shape, for all eleven tools."],
	["#/api/auth", "Authentication & keys", "Scopes, roles, and what happens when you mix the two credentials."],
	["#/guides/save", "Save memory properly", "What gets kept, what gets skipped, and how to read a receipt."],
])}
` };

PAGES["/install/plugin"] = { title: "Claude Code plugin", html: `
<h1>Claude Code plugin</h1>
<p class="lede">Lifecycle hooks attempt bounded recall at session start and queue scrubbed durable outcomes locally at session end.</p>
<h2>1. Install</h2>
<p>Claude Code itself can run without Node, but Itsuki's lifecycle hooks require a maintained <b>Node 22 or 24 LTS</b> runtime. Find its absolute executable path with <code>(Get-Command node).Source</code> in PowerShell or <code>command -v node</code> on macOS/Linux, and create an API key in <b>API Keys</b>.</p>
${codeBlock(`claude plugin marketplace add 12ziyad/universal-memory-engine
claude plugin install ${PRODUCT.pkg}@itsuki-plugins`)}
<p>In a Claude Code session, run <code>/plugin configure ${PRODUCT.pkg}@itsuki-plugins</code>. Select the absolute Node executable and paste the full <code>${PRODUCT.tokenPrefix}…</code> value only into the masked key prompt, then run <code>/reload-plugins</code>. You do not need to put the key in a shell profile or settings file, and hooks never resolve Node through a workspace-controlled <code>PATH</code>. The interactive configuration flow also avoids command-line quoting differences for Windows executable paths containing spaces.</p>
<h2>2. Verify</h2>
<p>In any Claude Code session, run <code>/itsuki:doctor</code>. It checks the installed files and hook configuration, protected local outbox, key, network path, REST door, and real MCP tools, then prints the exact fix for whichever fails.</p>
<h2>What you get</h2>
<p>The three memory tools (<code>save_memory</code>, <code>save_conversation</code>, <code>recall_memory</code>) plus two lifecycle hooks: SessionEnd scrubs and queues what the session learned <b>locally, with no network wait</b>; the next SessionStart attempts up to four due batches in order, then loads project memory.</p>
<p>New writes use ordered v2 delivery groups. Each ingest request holds at most 30 messages, 4,000 Unicode code points per message, 120,000 code points across message content, and 512 KiB for the complete serialized UTF-8 JSON body. Oversized logical messages are split at natural Unicode boundaries where possible and every segment is position-labelled; no content is silently dropped from the captured-and-scrubbed set.</p>
<div class="note"><b>The capture boundary is reported separately.</b> SessionEnd reads a bounded snapshot of the newest 80 eligible transcript records. If an older, malformed, or oversized record is omitted, or the transcript changes during the snapshot, each batch records <code>captureTruncated</code> / <code>truncationReason</code> metadata and the hook says so. This is different from the lossless splitting performed after capture.</div>
<div class="note"><b>Delivery states are explicit.</b> “Queued locally” means the protected local write completed. “Accepted” means the service durably created the source packet/job for that batch. Neither means terminal enrichment; packet/job status eventually reports <code>enriched</code> or <code>failed</code>. Offline and retryable failures stay queued with content-bound idempotency; later batches cannot overtake an earlier batch; rejected credentials pause delivery; permanent failures are retained for <code>/itsuki:doctor</code>.</div>
