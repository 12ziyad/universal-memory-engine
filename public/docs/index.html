<p>Create an <b>API key</b> in <b>API Keys</b> and set it as <code>ITSUKI_API_KEY</code>. This route is not MCP: the package talks to the same REST API the SDKs use, with the key in a header.</p>

<h2>A complete example</h2>
<pre><button class="copy">Copy</button><code>import os

from camel.agents import ChatAgent
from camel.memories import ChatHistoryMemory
from camel.memories.context_creators.score_based import ScoreBasedContextCreator
from camel.types import ModelType
from camel.utils import OpenAITokenCounter
from camel_itsuki import ItsukiStorage

assert os.environ.get("ITSUKI_API_KEY"), "ITSUKI_API_KEY is not set"

context_creator = ScoreBasedContextCreator(
    token_counter=OpenAITokenCounter(ModelType.GPT_4O_MINI),
    token_limit=4096,
)

storage = ItsukiStorage(user_id="user_42", agent_id="researcher")
memory = ChatHistoryMemory(context_creator, storage=storage, agent_id="researcher")

agent = ChatAgent("You are a research assistant.", memory=memory)

agent.step("I deploy on Fridays only.")
print(agent.step("When am I allowed to deploy?").msg.content)</code></pre>
<p>Every record the agent writes lands in the local mirror and, when <code>mirror_to_itsuki</code> is on (the default), is staged for extraction on the service. Extraction is asynchronous, so a fact stated in one step is not necessarily recallable in the next.</p>

<h3>Reading durable memory back</h3>
<p>The mirror is history. Durable, cross-session memory comes back through the context block, which returns a prompt-ready string — or an empty string when there is nothing.</p>
<pre><button class="copy">Copy</button><code>from camel_itsuki import ItsukiContextBlock

block = ItsukiContextBlock(user_id="user_42", client=storage.client)

context = block.retrieve("what is this project about?")
items = block.retrieve_items("deployment")   # raw items, for your own scoring</code></pre>
<p><code>retrieve</code> never raises: an agent that cannot reach its memory should answer with less context, not stop answering.</p>

<h2>Scoping memory per end user</h2>
<p><code>user_id</code> is the isolated memory space and it is required — the constructor refuses an empty one, because there is no safe default for whose memory this is. Construct one <code>ItsukiStorage</code> per end user from your own session data.</p>
<table>
<tr><th>Argument</th><th>Meaning</th></tr>
<tr><td><code>user_id</code></td><td>The memory space. Required.</td></tr>
<tr><td><code>agent_id</code></td><td>Attribution, and the mirror file's identity. Does not select a tenant.</td></tr>
<tr><td><code>project_id</code></td><td>Attribution; also switches recall to <code>project_then_global</code>.</td></tr>
<tr><td><code>mirror_path</code>, <code>max_records</code></td><td>Where the local history lives, and its ceiling (default 5,000).</td></tr>
<tr><td><code>mirror_to_itsuki</code></td><td>Set <code>False</code> for a purely local run. Default <code>True</code>.</td></tr>
<tr><td><code>allow_remote_clear</code></td><td>See below. Default <code>False</code>.</td></tr>
</table>

<h3>Multi-agent societies</h3>
<p>Give each agent its own <code>ItsukiStorage</code> with its own <code>agent_id</code>. Each gets its own mirror file and its own attribution, which is what keeps two agents in a society from reading each other's history. They can still share durable memory when they share a <code>user_id</code> — that is the point of the split.</p>

<h2>Deletion</h2>
<p><code>clear()</code> clears the <b>local</b> history only. Server-side memory is untouched unless you construct with <code>allow_remote_clear=True</code>. An agent restarting its chat history is not a user asking to be forgotten, and conflating the two is how an integration deletes somebody's memory by accident.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b><code>user_id is required</code></b> — deliberate. Pass your own stable id; the package will not invent one.</li>
<li><b>History reads back but nothing is ever recallable</b> — <code>mirror_to_itsuki=False</code>, or <code>ITSUKI_API_KEY</code> is not visible to the process. The local mirror works either way, which is why this failure is quiet.</li>
<li><b>Two agents see each other's history</b> — they share a <code>mirror_path</code>. Give each its own <code>agent_id</code>.</li>
<li><b>History looks truncated after a crash</b> — a partially written mirror is discarded rather than served as fact. Durable memory on the service is unaffected.</li>
<li><b><code>ImportError</code> from <code>camel.toolkits</code> mentioning <code>FastMCP</code></b> — an installed <code>mcp</code> 2.x clashing with CAMEL's imports. <code>pip install "mcp&lt;2"</code>.</li>
<li><b>Recall is empty right after a step</b> — extraction is asynchronous; allow a few seconds.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/integrations/native">Native packages</a> — the other frameworks with their own memory interface.</li>
<li><a href="#/sdk/python">Python SDK</a> — the client underneath this package.</li>
<li><a href="#/concepts/scope">Who memory belongs to</a> — sub-tenants and project scope.</li>
<li><a href="#/concepts/delete">Delete and erasure</a> — what removing memory really does.</li>
</ul>
` };

PAGES["/integrations/mastra"] = { title: "Mastra", html: `
<h1>Mastra</h1>
<p class="lede">Mastra gets Itsuki as processors: <code>mastra-itsuki</code> injects relevant memory before the model is called and captures the settled exchange after it, plus typed tools for when you want the model to decide.</p>

<h2>Two tiers</h2>
<p><b>Processors — automatic.</b> <code>itsuki.recall</code> is an input processor that looks up relevant memory and adds it as a system message before the model reads anything. <code>itsuki.capture</code> is an output processor that stores the exchange once the agent has actually answered. The model never has to decide to remember.</p>
<p><b>Tools — deliberate.</b> <code>itsuki.tools</code> gives the model <code>itsuki-search-memory</code>, <code>itsuki-save-memory</code>, <code>itsuki-list-memories</code> and <code>itsuki-get-memory</code>, for when you want an explicit "save that for later".</p>
<p>Use either, or both. Most applications want the processors; the tools are the escape hatch.</p>

<h2>Install</h2>
<pre><button class="copy">Copy</button><code>npm install mastra-itsuki</code></pre>
<p>Create an <b>API key</b> in <b>API Keys</b> and set <code>ITSUKI_API_KEY</code> in your <b>server</b> environment. The package has zero runtime dependencies and needs <code>@mastra/core</code> 1.59.0 or newer (below 2.0.0) on Node 22.13.0 or newer.</p>

<h2>A complete example</h2>
<pre><button class="copy">Copy</button><code>import { Agent } from "@mastra/core/agent";
import { createItsuki } from "mastra-itsuki";

const itsuki = createItsuki();

export const support = new Agent({
  id: "support",
  model: "openai/gpt-5.2",
  instructions: "You help customers.",
  inputProcessors: [itsuki.recall],
  outputProcessors: [itsuki.capture],
  tools: itsuki.tools,
});

await support.generate("I deploy on Fridays only.", {
  memory: { resource: "user_42", thread: "thread_9" },
});

const answer = await support.generate("When am I allowed to deploy?", {
  memory: { resource: "user_42", thread: "thread_9" },
});
console.log(answer.text);</code></pre>
<p>The second call recalls before the model runs, so the answer is informed without the model choosing to look. Extraction is asynchronous, which means two calls a second apart may not see each other yet — allow a few seconds when you are testing by hand.</p>

<h2>Scoping memory per end user</h2>
<p>Mastra already names both halves of the question, so the adapter reads them from the run rather than making you configure them twice.</p>
<table>
<tr><th>Mastra</th><th>Itsuki</th></tr>
<tr><td><code>resource</code></td><td>The memory space (<code>userId</code>)</td></tr>
<tr><td><code>thread</code></td><td>The conversation, and the de-duplication anchor</td></tr>
</table>
<p>For single-tenant apps, <code>createItsuki({ defaultUserId: "alex" })</code> covers runs that carry no resource. When neither exists the adapter <b>skips</b> rather than guessing — writing one person's memory into another person's space is not a failure worth risking to save a round trip.</p>
<p>Server-side code can override per run through Mastra's <code>RequestContext</code>:</p>
<pre><button class="copy">Copy</button><code>requestContext.set("itsuki.userId", "user_99");
requestContext.set("itsuki.conversationId", "thread_12");
requestContext.set("itsuki.projectId", "proj_shop");</code></pre>
<p><b>No tool takes a user id, a project id, or any other tenancy parameter.</b> A model that can name the memory space it writes to is a model that can be talked into writing somewhere else.</p>

<h2>Configuration</h2>
<pre><button class="copy">Copy</button><code>const itsuki = createItsuki({
  defaultUserId: "alex",       // only for runs with no resource
  projectId: "proj_shop",      // attribution; enables project-scoped recall
  recallScope: "project_then_global",
  maxContextChars: 4000,       // hard ceiling on injected memory
  maxItems: 10,                // hard ceiling on recalled items
  timeoutMs: 6000,             // budget for a recall, including retries
  captureTimeoutMs: 15000,
  onEvent: (event) =&gt; metrics.record(event),
});</code></pre>
<p><code>onEvent</code> carries counts, durations and error classes only — never message text, recalled memory, queries or keys. Use it to alarm on recall failures without piping user content into your telemetry.</p>

<h3>Deletion</h3>
<p>Off by default. <code>createItsuki({}, { enableDelete: true })</code> registers <code>itsuki-delete-memory</code>, which still refuses unless the call carries an explicit <code>confirmed: true</code>. Bulk deletion is not exposed to models at all.</p>

<h2>Behaviour under failure</h2>
<table>
<tr><th>Situation</th><th>What happens</th></tr>
<tr><td>Recall fails</td><td>The agent answers without memory. The run succeeds.</td></tr>
<tr><td>Capture fails</td><td>Nothing is stored. The answer is unaffected.</td></tr>
<tr><td>Run aborted</td><td>Nothing is captured.</td></tr>
<tr><td>Retry or re-run</td><td>The idempotency key is derived from the content, so the server keeps one memory.</td></tr>
<tr><td>Tool call fails</td><td>The model gets a readable error object, never an exception through the agent.</td></tr>
</table>
<p>Neither processor can fail a run: both wrap everything and degrade to a no-op.</p>

<h2>The MCP route</h2>
<p>If you want the tools without the processors, or you are already running an MCP client, connect with <code>@mastra/mcp</code> and an <b>MCP link</b> instead of an API key:</p>
<pre><button class="copy">Copy</button><code>npm install @mastra/mcp

import { MCPClient } from "@mastra/mcp";

const mcp = new MCPClient({
  servers: {
    itsuki: {
      url: new URL("https://itsuki.app/mcp"),
      requestInit: { headers: { Authorization: "Bearer YOUR_MCP_KEY" } },
    },
  },
});
const tools = await mcp.listTools();</code></pre>
<p>On this route the memory space is fixed by the credential — there is no per-run <code>resource</code> mapping.</p>

<h2>Migrating from <code>@mastra/mem0</code></h2>
<table>
<tr><th><code>@mastra/mem0</code></th><th>Here</th></tr>
<tr><td><code>mem0RememberTool</code></td><td><code>itsuki.tools.itsukiSearch</code>, or <code>itsuki.recall</code> for automatic lookup</td></tr>
<tr><td><code>mem0MemorizeTool</code></td><td><code>itsuki.tools.itsukiSave</code>, or <code>itsuki.capture</code> for automatic storage</td></tr>
<tr><td><code>user_id</code> in the tool call</td><td>The run's <code>resource</code> — never a tool argument</td></tr>
</table>

<h2>Troubleshooting</h2>
<ul>
<li><b>Nothing is recalled or captured, and no error</b> — the run carried no <code>resource</code> and no <code>defaultUserId</code> is set, so the adapter skipped. Pass <code>memory: { resource, thread }</code>.</li>
<li><b>Construction throws</b> — <code>ITSUKI_API_KEY</code> is missing. The adapter fails at construction rather than at the first model call, on purpose.</li>
<li><b>Recall is empty right after a save</b> — extraction is asynchronous; allow a few seconds.</li>
<li><b>Delete tool is missing</b> — it is off by default. Pass <code>{ enableDelete: true }</code> as the second argument.</li>
<li><b>Peer dependency errors</b> — <code>@mastra/core</code> must be 1.59.0 or newer and below 2.0.0.</li>
<li><b>401 on the MCP route</b> — an API key was pasted into the URL. MCP links go in the URL; API keys go in the header at <code>https://itsuki.app/mcp</code>.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/integrations/native">Native packages</a> — the other frameworks with their own memory interface.</li>
<li><a href="#/integrations/typescript">TypeScript frameworks</a> — the MCP client shapes.</li>
<li><a href="#/sdk/js">JavaScript SDK</a> — building your own loop instead.</li>
<li><a href="#/concepts/scope">Who memory belongs to</a> — sub-tenants and project scope.</li>
</ul>
` };

PAGES["/integrations/vercel-ai"] = { title: "Vercel AI SDK", html: `
<h1>Vercel AI SDK</h1>
<p class="lede"><code>ai-sdk-itsuki</code> is middleware, not a provider: it wraps the model you already use, injects relevant memory before the model reads anything, and captures each settled exchange after it.</p>

<h2>What it is, and what it is not</h2>
<p>This wraps your model. Your provider, your model id, your provider keys and your provider's behaviour are untouched — no provider SDKs are bundled and the package has zero runtime dependencies. Tool calls, structured output, streaming, usage, warnings and provider metadata pass through exactly as the provider produced them.</p>
<p>Two things are added: a system block containing relevant memory on the way in, and an observation of the settled exchange on the way out. The model never has to decide to look something up, which is the difference between this and a memory tool.</p>

<h2>Install</h2>
<pre><button class="copy">Copy</button><code>npm install ai-sdk-itsuki</code></pre>
<p>Create an <b>API key</b> in <b>API Keys</b> and set <code>ITSUKI_API_KEY</code> in your <b>server</b> environment. Requires <code>ai</code> 7.x as a peer and Node 22 or newer; it runs on Node, edge, and Workers, because it uses no Node built-ins.</p>

<h2>A complete example</h2>
<pre><button class="copy">Copy</button><code>import { openai } from "@ai-sdk/openai";
import { generateText } from "ai";
import { withItsuki } from "ai-sdk-itsuki";

const model = withItsuki(openai("gpt-5.2"), {
  userId: "user_42",
  conversationId: "thread_9",
});

await generateText({ model, prompt: "I deploy on Fridays only." });

const { text } = await generateText({
  model,
  prompt: "When am I allowed to deploy?",
});
console.log(text);</code></pre>
<p>The second call recalls first, so the answer is informed without a tool round trip. Extraction is asynchronous — two calls a second apart may not see each other yet.</p>

<h2>Scoping memory per end user</h2>
<p><code>userId</code> is required and has no default. There is no safe guess for "whose memory is this", and a silent default would put every end user's memories into one space.</p>
<p>One wrapped model can still serve many users. Pass overrides through the AI SDK's <code>providerOptions</code> channel — it comes from your server code, never from the model, and the <code>itsuki</code> namespace is stripped before the provider sees it.</p>
<pre><button class="copy">Copy</button><code>await generateText({
  model,
  prompt,
  providerOptions: {
    itsuki: { userId: "user_99", conversationId: "thread_12" },
  },
});</code></pre>
<p>Any stable string works. It is hashed with your account id before it becomes a storage key, so two accounts sending the same string still get different spaces. <a href="#/concepts/scope">Who memory belongs to</a> has the full model.</p>

<h2>Configuration</h2>
<pre><button class="copy">Copy</button><code>withItsuki(model, {
  userId: "user_42",            // required — your stable id for this end user
  conversationId: "thread_9",   // recommended — the de-duplication anchor
  projectId: "proj_shop",       // optional — enables project-scoped recall
  capture: "background",        // "background" | "blocking" | "off"
  recall: true,                 // false keeps capture and drops recall
  maxContextChars: 4000,        // hard ceiling on injected memory
  maxItems: 10,                 // hard ceiling on recalled items
  onEvent: (event) =&gt; metrics.record(event),
});</code></pre>
<p><code>onEvent</code> carries counts, durations and error classes only — never message text, recalled memory, queries or keys.</p>

<h3>Serverless</h3>
<p><code>capture: "background"</code> returns the response first and stages the write after. On a platform that freezes the function once the response is sent, hand the work to the platform so it survives:</p>
<pre><button class="copy">Copy</button><code>import { waitUntil } from "@vercel/functions";

withItsuki(model, { userId, waitUntil });</code></pre>
<p>Or use <code>capture: "blocking"</code>, which stages before returning at the cost of one round trip in the request path. On a freeze-after-response platform with neither, a background capture can be cut off mid-flight — which looks exactly like memory silently not working.</p>

<h2>Standalone helpers</h2>
<p>For applications that want the pieces rather than the automatic lifecycle. Unlike the middleware, these surface failures: a caller doing memory by hand should decide what an outage means for them.</p>
<pre><button class="copy">Copy</button><code>import { createItsuki } from "ai-sdk-itsuki";

const itsuki = createItsuki({ userId: "user_42" });

const block = await itsuki.retrieveMemories("what does the user like?");
const items = await itsuki.getMemories("preferences");
await itsuki.saveMemories([{ role: "user", content: "I prefer dark mode." }]);

// itsuki.wrap(model) applies the same configuration as middleware.</code></pre>

<h2>Behaviour under failure</h2>
<table>
<tr><th>Situation</th><th>What happens</th></tr>
<tr><td>Recall fails (network, 5xx, auth)</td><td>The model answers without memory. The turn succeeds.</td></tr>
<tr><td>Capture fails</td><td>Nothing is stored. The response is unaffected.</td></tr>
<tr><td>Run aborted, or stream errors</td><td>Nothing is captured — a half-spoken answer is not a settled exchange.</td></tr>
<tr><td>Rate limited</td><td><code>Retry-After</code> is honoured exactly, inside the call's time budget.</td></tr>
<tr><td>Retry or stream reconnect</td><td>The idempotency key is derived from the content, so the server keeps one memory.</td></tr>
</table>

<h2>Security notes</h2>
<ul>
<li>The API key travels only as an <code>Authorization</code> header, never in a URL, and redirects are refused so it cannot be replayed at another origin.</li>
<li>Constructing in a browser throws, because a key in a browser bundle is a published key.</li>
<li>Credentials in message text are redacted before capture, so a pasted key does not become a durable memory.</li>
<li>Recalled memory is injected inside explicit markers with a preamble labelling it as data, not instructions — the prompt-injection boundary for anything a previous session stored.</li>
<li>Recalled text the model repeats back is suppressed before capture, so memory cannot slowly convince itself of its own output.</li>
</ul>

<h2>The MCP route</h2>
<pre><button class="copy">Copy</button><code>npm install @ai-sdk/mcp

import { createMCPClient } from "@ai-sdk/mcp";

const mcpClient = await createMCPClient({
  transport: {
    type: "http",
    url: "https://itsuki.app/mcp",
    headers: { Authorization: "Bearer YOUR_MCP_KEY" },
  },
});
const tools = await mcpClient.tools(); // pass to generateText / streamText</code></pre>
<p>This hands the model memory tools it may or may not call, against one memory space fixed by the credential — no <code>userId</code> per call. Use an <b>MCP link</b> here, not an API key.</p>

<h2>Troubleshooting</h2>
<ul>
<li><b>Throws on construction in the browser</b> — intended. Wrap the model on your server; never ship the key.</li>
<li><b>Captures go missing on Vercel or Workers</b> — the function froze after the response. Pass <code>waitUntil</code>, or set <code>capture: "blocking"</code>.</li>
<li><b>Memory never appears in answers</b> — <code>userId</code> is missing, or <code>recall: false</code> is set. Check <code>onEvent</code>, which reports recall outcomes without content.</li>
<li><b>Recall is empty right after a save</b> — extraction is asynchronous; allow a few seconds.</li>
<li><b>Peer dependency errors</b> — the package targets <code>ai</code> 7.x and Node 22 or newer.</li>
<li><b>429</b> — writes are capped at 60 per minute per user; <code>Retry-After</code> is honoured inside the call's budget, and a sustained burst still needs backpressure on your side.</li>
</ul>

<h2>Related pages</h2>
<ul>
<li><a href="#/integrations/native">Native packages</a> — the other frameworks with their own memory interface.</li>
<li><a href="#/integrations/typescript">TypeScript frameworks</a> — the MCP client shapes.</li>
<li><a href="#/sdk/js">JavaScript SDK</a> — building your own loop instead.</li>
<li><a href="#/concepts/scope">Who memory belongs to</a> — sub-tenants and project scope.</li>
</ul>
` };

PAGES["/concepts/extraction"] = { title: "How extraction works", html: `
<h1>How extraction works</h1>
<p class="lede">A model proposes structure; code decides what is stored. Everything between those two sentences — chunking, three passes, the gates, and idempotency — exists to make that division safe.</p>
<p>Extraction is the part of Itsuki that turns messages into memories, details, events and connections. It runs after your write has already been accepted and preserved, and it never has the final word about what is stored.</p>

<h2>Why extraction is asynchronous</h2>
<p>A save is accepted and a durable job row is written <i>before</i> the response is returned. Extraction happens afterwards, in a queue owned by your account.</p>
<p>The alternative — holding the HTTP connection open until a model finishes — makes every save as slow as the slowest model call and turns a model timeout into a lost write. Instead:</p>
<ul>
<li>The response tells you the write was <b>accepted</b> and hands you a <code>source_packet_id</code>.</li>
<li>The job settles later on <code>enriched</code> or <code>failed</code>, and you can watch it with <code>GET /v1/packets/&lt;id&gt;/status</code> or <code>GET /v1/jobs</code>.</li>
<li>A user-commanded save may wait a bounded time for the real receipt before answering "captured, processing" — the default budget is about nine seconds. Extraction always finishes in the background regardless; the budget only bounds the response.</li>
</ul>
<p>Because of this, a fact you just wrote is not instantly a graph node. It <i>is</i> instantly recallable: the scrubbed text is staged at accept time, so a lookup seconds later answers with your own words, marked "Just saved (still being organized)". When the job settles, the staged rows stop matching and the graph answers instead.</p>
<div class="warn">Do not treat a <code>200</code> from <code>/v1/save</code> as proof that a node exists. It is proof the write was accepted and preserved. Inspect the packet or job status before asserting anything about the graph.</div>

<h2>Chunking happens in code, before the model</h2>
<p>One model call has a bounded output budget. A chunk whose facts do not fit comes back cut off mid-JSON, the parse fails, and a whole batch can end up writing nothing. So the split is decided deterministically, before the model sees anything.</p>
<table>
<tr><th>Bound</th><th>Value</th><th>Why</th></tr>
<tr><td>Messages per sub-chunk</td><td>8</td><td>Equal to the rescue ceiling below. A sub-chunk the rescue is not allowed to re-extract has no recovery path at all.</td></tr>
<tr><td>Characters per sub-chunk</td><td>6,000</td><td>Message count alone does not bound output — eight maximum-length messages are 32,000 characters of input.</td></tr>
<tr><td>Queue entry</td><td>20 messages · 12,000 characters</td><td>The upstream bound on one unit of fired work.</td></tr>
</table>
<p>The planner guarantees three properties, and verifies them on every real extraction rather than only in tests:</p>
<ul>
<li><b>Coverage</b> — every message of the accepted chunk lands in exactly one sub-chunk. Not most; every one.</li>
<li><b>Chronology</b> — sub-chunks are contiguous and ordered, and so are the messages inside them.</li>
<li><b>Replay</b> — the same chunk always produces the same sub-chunks with the same identities, so a retry re-derives the same work.</li>
</ul>
<p>A single oversized message is never cut in half. It becomes its own sub-chunk, because half a message carrying a provenance pointer to the whole is a lie about where the fact came from.</p>

<h2>What the model is shown</h2>
<p>The packet handed to the model has three clearly separated parts, and only one of them is a source of memory.</p>
<table>
<tr><th>Part</th><th>Role</th></tr>
<tr><td><code>new_slice</code></td><td>The messages being extracted. The <b>only</b> source of new memory.</td></tr>
<tr><td><code>bridge_context</code></td><td>Up to five earlier user messages, reference only — enough to resolve "this app" to a known memory.</td></tr>
<tr><td><code>assistant_context</code></td><td>Up to five recent assistant messages. Never learned as user memory.</td></tr>
<tr><td><code>existing_nodes</code></td><td>A shortlist of about ten memories you already have, so the model reuses them instead of inventing duplicates. Built from a keyword match plus a vector search; write-time matching is exact, so a global write may only reuse global memories.</td></tr>
</table>

<h2>Three passes, because relations need their own attention</h2>
<p>A single combined call spends its attention on facts and produces relations as an afterthought. So the work is split.</p>
<ol>
<li><b>Facts and entities.</b> The proposing call. Its stance is deliberately generous, because the gates are strict.</li>
<li><b>Relations only.</b> Code numbers the resolved entities 1..n for this one save — temporary row numbers, not database ids — and the model may cite only those numbers. An edge citing an unknown number is rejected, never repaired. That hard gate is what makes the generous first pass safe.</li>
<li><b>Reflexion.</b> A second look that may output only what the first two passes missed. New entities continue the numbering; nothing already found may be repeated.</li>
</ol>
<p>Each relation must carry <b>evidence</b>: a short quote copied word for word from the messages, naming both endpoints. The quote is verified against what was actually sent, whitespace- and case-normalised. A relation you cannot quote is a relation that is not written — that is what kills invented relations from mere co-mention.</p>
<p>Relation types are open but shaped (<code>SCREAMING_SNAKE_CASE</code>), and known types are direction-checked against endpoint kinds. A person <code>WORKS_AT</code> an organization; an organization cannot work anywhere, so that proposal is refused.</p>

<h2>The gates: the backend is the judge</h2>
<p>Every proposed object is independently judged keep, downgrade or reject. Processing order matters — memories first, so events, details and connections can attach to memories created in the same batch. The rules that decide durability are described in <a href="#/concepts/memory">How memory works</a>; the short version is that the gates reject junk, refuse ungrounded and stitched text, enforce your rules, and park weak signals rather than losing them.</p>
<p>Rejections are named and counted on the receipt, so "why didn't that save?" is a lookup rather than a guess.</p>

<h2>What a candidate is</h2>
<p>A candidate — shown as a <b>Suggestion</b> in the app — is the waiting room for a signal that is real but not yet durable. Weak maybes ("I might try tennis someday"), a label the model proposed with nothing attached to it, and low-confidence proposals all land here instead of being written or dropped.</p>
<p>A candidate stores its label, a strength (weak · medium · strong), a role guess, a mention count and the single source message that evidenced it. Repeating the same signal bumps the mention count rather than creating a second candidate, and a candidate whose label already matches a real memory is never created — the memory is reinforced instead.</p>
<p>Candidates are never used for explicit save commands, major life events, strong preferences, project rules, relationship facts, or corrections. Those are durable memory by definition.</p>
<div class="note">A user-commanded save does not create candidates at all. If you told Itsuki to remember something, parking it for review would be answering a different question than the one you asked.</div>

<h2>Idempotency: the same input never writes twice</h2>
<p>Identity is content-based, not request-based. Every accepted write becomes a <b>source packet</b> whose content hash covers the source type and mode, the conversation and thread ids, the resolved scope, ordered-delivery metadata, the caller's authoritative source time when supplied, and each message's role and content hash.</p>
<p>The uniqueness boundary is (account, idempotency key). If you send no key, one is derived from that content hash, so re-sending identical content converges on the same packet:</p>
<pre><button class="copy">Copy</button><code>POST /v1/ingest
{ "messages": [ … ], "idempotencyKey": "nightly-sync-2026-08-27" }

# same key + same content  -&gt; the original verdict, replayed
# same key + different content -&gt; 409 idempotency_conflict
# different content, no key    -&gt; a new packet</code></pre>
<p>A replay answers with the <b>original</b> verdict, and the wording follows it honestly. Content that was accepted earlier replays as "Already saved". Content the gates rejected earlier replays as "Not saved — this exact content was sent before and skipped", with the reason. When the original verdict cannot be read, the reply says only that the content was seen before and points you at the packet status. Claiming an acceptance that did not happen is the one thing this path will not do.</p>
<p>Beneath that, the extraction run itself is claimed exactly once. A run already <code>running</code> or <code>committing</code> answers <code>in_progress</code> with a retry hint rather than starting a second model call, and a run that finished is recovered from its stored outcome instead of being redone.</p>

<h2>When extraction fails</h2>
<table>
<tr><th>Outcome</th><th>What it means</th><th>What to do</th></tr>
<tr><td><code>wrote</code></td><td>The plan was approved and committed.</td><td>Nothing.</td></tr>
<tr><td><code>meaningful_no_write</code></td><td>The pass ran and found nothing durable — the receipt names why.</td><td>Nothing. This is a real answer, not an error.</td></tr>
<tr><td><code>llm_failed</code></td><td>The extractor returned nothing readable.</td><td>Retried automatically; the chunk is kept.</td></tr>
<tr><td><code>interrupted_unknown</code></td><td>Processing stopped after inference began. The model is deliberately not called again.</td><td>Re-send the content as a new write if you still want it.</td></tr>
<tr><td><code>cancelled_by_delete</code></td><td>A confirmed erasure covered this work while it was processing.</td><td>Do not retry — see <a href="#/concepts/delete">Delete &amp; erasure</a>.</td></tr>
</table>
<p>When a multi-message chunk fails to parse, a bounded <b>split rescue</b> re-extracts message by message. It refuses to start if the chunk alone would exceed the call ceiling, abandons once a few messages have failed, and reports what it actually cost on the receipt — <code>split_rescue_calls</code>, <code>split_rescue_dropped</code>, <code>split_rescue_aborted</code>. An invisible fan-out that spends dozens of calls and writes nothing is exactly the failure this accounting exists to surface.</p>

<h2>Related</h2>
<ul>
<li><a href="#/concepts/memory">How memory works</a> — the object types and the admission path.</li>
<li><a href="#/concepts/graph">The memory graph</a> — what the relation passes produce.</li>
<li><a href="#/concepts/receipts">Receipts &amp; rules</a> — reading the record extraction leaves behind.</li>
<li><a href="#/api/rest">REST API reference</a> — the ingest bounds and error codes.</li>
</ul>
` };

PAGES["/concepts/graph"] = { title: "The memory graph", html: `
<h1>The memory graph</h1>
<p class="lede">Memories are entities; connections are directed, evidenced, time-bounded relations between them. The graph exists so a question can be answered by walking from what you asked about to what actually holds the answer.</p>
<p>Flat facts answer the questions they literally contain. "Who works at the company I mentioned?" is not one of them: the answer lives in a memory whose own text shares nothing with the question. That is what the graph is for.</p>

<h2>Entities</h2>
<p>A memory (a <code>node_…</code>) is a durable thing. It carries a label, a category chosen by meaning from a fixed set, a lifecycle state, an optional rolled-up summary, aliases, and a cluster. Details (<code>slice_…</code>) and events (<code>event_…</code>) hang off it.</p>
<p>The single hardest problem here is deciding whether a proposed label is something you already have. Itsuki is <b>biased to split</b>, because a wrong split can be merged later while a wrong merge poisons summaries and history permanently. A merge happens only on:</p>
<ul>
<li>the model's explicit hint — an id from the shortlist it was shown;</li>
<li>an exact normalised label match, or an explicitly stated alias;</li>
<li>a high similarity score (0.85 and above) where the two labels share a category class <b>and</b> have no distinctive differing token.</li>
</ul>
<p>That last clause is the important one. "Meridian Freight" and "Meridian Labs" score high on shared tokens, but "Freight" and "Labs" are distinctive, so they never merge whatever the score says. Every non-exact merge is recorded on the receipt with its basis (<code>alias</code>, <code>similarity_0.91</code>), so contamination stays auditable.</p>

<h2>Clusters: life areas, not folders</h2>
<p>Each memory and conversation page is assigned a cluster deterministically from its label, category and text — Identity &amp; Career, Projects &amp; Systems, Skills &amp; Tech, Health &amp; Fitness, Life &amp; Family, Active Goals, and a general bucket for everything else. Clusters are how the graph view lays itself out, and at recall time they gently nudge ties. They never filter results: an earlier version used the top clusters as a filter and that could drop a correct multi-hop answer for living in the wrong area.</p>

<h2>How a connection forms</h2>
<p>Relations come from their own dedicated model pass, against a numbered entity list built in code. Each proposal then passes four checks before it is written.</p>
<table>
<tr><th>Check</th><th>Rule</th><th>Refusal</th></tr>
<tr><td>Endpoints</td><td>Both ends must resolve to entities on the numbered list for this save.</td><td><code>edge_unknown_entity_id</code> · <code>edge_endpoint_missing</code></td></tr>
<tr><td>Evidence</td><td>A quote copied word for word from the messages, containing a surface form of <b>both</b> endpoints.</td><td><code>edge_no_evidence</code> · <code>edge_evidence_not_verbatim</code> · <code>edge_evidence_missing_endpoint</code></td></tr>
<tr><td>Type</td><td><code>SCREAMING_SNAKE_CASE</code>. The vocabulary is open; novel types are allowed.</td><td><code>invalid_edge_type</code></td></tr>
<tr><td>Direction</td><td>Known types are checked against endpoint kinds. A person <code>WORKS_AT</code> an organization; an organization cannot.</td><td><code>edge_type_pair_mismatch</code></td></tr>
</table>
<p>Self-links and exact duplicates within one save are refused too. The evidence rule is what kills the most common invention: two entities appearing in the same sentence is not a relationship.</p>
<pre><button class="copy">Copy</button><code>{ "source_entity_id": 1,
  "target_entity_id": 4,
  "relation_type": "WORKS_AT",
  "fact": "Priya works at Meridian Labs",
  "evidence": "priya started at meridian labs on monday",
  "valid_at": "2026-09-01",
  "invalid_at": null }</code></pre>
<p>Re-stating a relationship you already have does not duplicate it. The existing connection is reinforced — its reinforcement count rises, which raises its weight during graph expansion — and the receipt reports it as a no-op rather than a new save.</p>

<h2>Connections have a validity window</h2>
<p>Every connection carries <code>valid_at</code> and <code>invalid_at</code>. Rows are never deleted to express change; windows close.</p>
<ul>
<li><b>Functional relations</b> hold one current target per source — you work at one place, live in one city, are married to one person. Writing a new <code>WORKS_AT</code> closes the previous employer's window automatically.</li>
<li><b>Corrections close windows too.</b> Relations lead the recall context, so retiring only the detail would leave a corrected relation still headlining the answer. When your message carries explicit obsoleting language, the named relation's window closes.</li>
<li><b>History stays queryable.</b> A closed connection is rendered with its end date — "Priya works at Meridian Labs (until 2026-09-01)" — and is only shown when the question is about the past.</li>
</ul>
<div class="note">Recall decides "is this about the past?" from the question's own words: <i>used to</i>, <i>previously</i>, <i>before</i>, <i>no longer</i>, <i>old job</i>, <i>last year</i>. "Where do I live?" sees only open windows; "Where did I use to live?" sees the closed ones too.</div>

<h2>How the graph is used at recall time</h2>
<p>Graph expansion is one of the ranked signals recall fuses. It runs after the other signals have produced <b>seeds</b> — memories matched by exact label, by lexical search, or by vector similarity — and then walks outward from them.</p>
<table>
<tr><th>Bound</th><th>Value</th></tr>
<tr><td>Hops</td><td>2</td></tr>
<tr><td>Neighbours per seed</td><td>10</td></tr>
<tr><td>Total additions</td><td>50 by default</td></tr>
<tr><td>Hop-2 weight</td><td>Half, so nearer context outranks farther</td></tr>
<tr><td>Windows walked</td><td>Active only, unless the question is about the past</td></tr>
</table>
<p>Relational words are resolved into seeds of their own. "My partner", "my sister", "my manager" name people the graph knows only by a proper label, so those words map to the relation types and categories that can hold them, plus a probe over stored facts like "Amara is my sister". Without that step, the most natural way to ask about your own people contributed no seeds at all.</p>
<p>Expansion is deterministic and bounded, and it makes no model calls. In the rendered context, a memory's relations lead its line, because a relation fact is usually the direct answer:</p>
<pre><button class="copy">Copy</button><code>Amara (person, state: active) - Amara works at Nova Systems; Amara is my sister; joined Nova Systems (2026-03-02)</code></pre>

<h2>Revisions</h2>
<p>Memories, conversation pages, details and events each carry a <code>revision</code>. It is the concurrency token for deterministic edits and the spine of history.</p>
<pre><button class="copy">Copy</button><code>GET   /v1/memories/&lt;id&gt;            # returns the object and its revision ETag
PATCH /v1/memories/&lt;id&gt;            # If-Match: "r3"  + idempotencyKey
GET   /v1/memories/&lt;id&gt;/history    # revisions, newest first
POST  /v1/memories/&lt;id&gt;/rollback   # toRevision + expectedRevision + idempotencyKey</code></pre>
<ul>
<li>An edit without a precondition is refused with <code>428</code>; a stale one with <code>412</code> and the current revision. A wildcard <code>If-Match</code> is refused outright.</li>
<li>The previous content is retained as an immutable revision. "Immutable" means the API never rewrites a revision in place — not that history outlives the object; deleting, purging or erasing the object removes its history too.</li>
<li>A rollback restores an earlier revision's content as a <b>new forward revision</b>. History is never rewound.</li>
<li>Automatic system changes bump the revision without appending a history row; the accumulated drift is captured lazily as one labelled snapshot the next time an explicit action needs the chain, so nothing invents historical authors or timestamps.</li>
</ul>

<h2>Reading and tidying the graph</h2>
<p><code>GET /v1/graph</code> returns the whole structure for one memory space: memories with all their details (current and superseded, each flagged) and events newest-first, plus connections and pending suggestions. It is what the graph view renders.</p>
<p>Two signed-in maintenance actions exist for when a graph has drifted:</p>
<table>
<tr><th>Action</th><th>What it does</th></tr>
<tr><td><code>POST /v1/actions/organize-clusters</code></td><td>Recomputes cluster assignment for memories and pages.</td></tr>
<tr><td><code>POST /v1/actions/repair-graph</code></td><td>Repairs page titles and evidence, reorganises clusters, and previews junk cleanup. Junk archiving needs an explicit confirmation, and relation backfill is preview-only on purpose — a repair pass must never invent connections.</td></tr>
</table>
<p>Both refuse API keys and require a signed-in session.</p>

<h2>Related</h2>
<ul>
<li><a href="#/concepts/extraction">How extraction works</a> — the relation pass that proposes connections.</li>
<li><a href="#/concepts/retrieval">How recall works</a> — where graph expansion sits among the ranking signals.</li>
<li><a href="#/concepts/memory">How memory works</a> — the object types and supersession.</li>
<li><a href="#/api/rest">REST API reference</a> — the update, history and rollback contracts in full.</li>
</ul>
` };

PAGES["/concepts/retrieval"] = { title: "How recall works", html: `
<h1>How recall works</h1>
<p class="lede">A query becomes a small, ranked, bounded block of text. Every step between is deterministic, and the only model call in the whole path is one embedding.</p>
<p>Recall is not search over a transcript. It decides whether memory is even relevant, gathers candidates from several independent signals, fuses their <i>rankings</i>, removes near-duplicates, and renders what fits inside a fixed character budget.</p>

<h2>First: should we look at all?</h2>
<p>A gate classifies the query before any retrieval happens. Refusing to look at all is a real answer and costs nothing.</p>
<table>
<tr><th>Mode</th><th>When</th><th>Result</th></tr>
<tr><td><code>no_recall</code></td><td>Empty query; greetings and small talk; a pure task request ("translate this", "refactor that")</td><td>Empty context, with a <code>reason</code></td></tr>
<tr><td><code>light_recall</code></td><td>The default: a targeted question, or an explicit "do you remember…"</td><td>8 items, ~1,800 characters</td></tr>
<tr><td><code>update_mode</code></td><td>"latest", "what changed", "actually", "no longer", "from now on"</td><td>10 items, ~2,400 characters, a wider event scan</td></tr>
<tr><td><code>deep_recall</code></td><td>Broad profile questions: "what do you know about me", "my projects", "my health"</td><td>14 items, ~2,800 characters</td></tr>
<tr><td><code>project_bootstrap</code></td><td>Sent as <code>recallMode</code> at session start</td><td>A deterministic listing — no similarity search</td></tr>
</table>
<p>A question is the strongest possible signal that memory should be consulted, so anything phrased as one bypasses the "is this just utility chatter?" classifier entirely. That classifier answers a different question — <i>is this a durable fact worth saving?</i> — for which a question is correctly never a fact. Reusing it on the read path once meant "When is Sarah's birthday?" never looked in memory even when the answer was stored.</p>
<p>The reverse case is handled too: "Remember that the deploy key rotated" is a <b>save</b> instruction, not a lookup, and is not answered from memory.</p>
<p><code>project_bootstrap</code> exists because opening a session is a lookup, not a question. A fixed sentence like "project decisions, conventions and architecture" shares no words with ordinary project memory, so similarity search finds nothing and the user is told their project is empty. Bootstrap instead lists that project's most salient and recent memory directly. Neither SDK exposes it as a typed option; send <code>recallMode: "project_bootstrap"</code> in the request body.</p>

<h2>Four ranked signals, fused</h2>
<p>Each signal produces its own ordered list. They are combined with reciprocal-rank fusion, so a signal that ranks something first contributes strongly regardless of how it scaled its own scores.</p>
<ol>
<li><b>Exact and alias lookup.</b> "What's my deploy command" must hit a memory labelled <i>deploy command</i> exactly, not approximately. Longer matched labels outrank shorter ones.</li>
<li><b>Lexical.</b> BM25 over a full-text index, with a keyword scan as its tail so objects that predate their search profile stay reachable. This is what catches rare terms a vector blurs.</li>
<li><b>Vector.</b> One embedding of the query against your memory vectors — the paraphrase signal, and the only model call recall makes.</li>
<li><b>Graph expansion.</b> Two hops out from the seeds the other signals matched, over active validity windows. See <a href="#/concepts/graph">The memory graph</a>.</li>
</ol>
<p>A fifth lane ranks the <b>assertions inside</b> candidate memories — individual details, events and relations — not just the memories themselves. Without it, a detail could earn its memory a place in the results and then vanish behind four unrelated siblings when only a handful of lines per memory get rendered.</p>
<p>After fusion, MMR selection removes near-duplicates so five phrasings of one fact are returned once, and cluster affinity nudges ties without ever filtering.</p>

<h2>Hybrid means lexical and vector, honestly</h2>
<p>The two lexical signals and the vector signal are complementary, and they fail in different ways. Vectors blur rare, distinctive terms; lexical search misses paraphrase. Fusing rankings rather than scores means neither has to be calibrated against the other.</p>
<div class="warn">Vector and BM25 are <b>disabled for project-filtered recall</b>. Node vectors and search profiles carry no project column, so a globally-limited top-K could be filled entirely by another project before the requested one is seen. Post-filtering that list would starve the project you asked about. Filtered modes use the already-filtered exact and keyword scan plus graph expansion instead. The response reports which signals actually ran: <code>vector_used</code>, <code>lexical_used</code>, <code>graph_expansion_used</code>.</div>

<h2>Why the payload is bounded</h2>
<p>Recall returns a compact text block, not a dump. The budget is a product decision: memory should sharpen a prompt, not flood it. Each mode has a character budget, a per-memory line-item ceiling, and a maximum number of memories and conversation pages.</p>
<p>An oversized single line is clipped to the remaining budget rather than dropped — a digest-heavy memory can produce one line longer than the whole budget, and breaking on it used to return an empty context while reporting matches.</p>
<pre><button class="copy">Copy</button><code>curl -X POST https://itsuki.app/v1/recall \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"query": "how does this project deploy?",
       "memoryScope": { "projectId": "atlas" },
       "recallScope": "project_then_global",
       "limit": 5 }'</code></pre>
<pre><button class="copy">Copy</button><code>{ "count": 3,
  "recall_mode": "light_recall",
  "reason": "targeted_query",
  "limit_requested": 5, "limit_applied": 5, "limit_mode": "depth",
  "context": "Atlas (project, state: active) - deploys via wrangler after tests pass…",
  "items": [ { "type": "node", "id": "node_…", "label": "Atlas", "score": 0.0312 } ],
  "vector_used": false, "lexical_used": true, "graph_expansion_used": true }</code></pre>
<p><code>context</code> is exactly what a connected model receives. <code>items</code> is the structured ranking for clients that want it, and <code>nodes</code> / <code>pages</code> carry the full objects. An empty <code>context</code> with <code>count: 0</code> means nothing relevant is stored — a real answer, not an error.</p>

<h2>The limit parameter</h2>
<p><code>limit</code> is a whole number between 1 and 200. It is validated, never clamped: a silent clamp is the same lie in a smaller font, so <code>0</code>, <code>7.5</code> and <code>500</code> all return <code>400 invalid_limit</code> naming the range.</p>
<p>Two budgets are kept separate. The <b>evidence budget</b> is how many items you get back and how much of the rendered context they may fill. The <b>internal candidate budget</b> is how many candidates each retrieval lane may generate before fusion — always bounded by fixed ceilings, never by the caller.</p>
<table>
<tr><th>Mode</th><th>Behaviour</th></tr>
<tr><td><code>depth</code></td><td><code>limit</code> raises both budgets, up to the hard ceilings, and widens the context allowance proportionally.</td></tr>
<tr><td><code>narrow</code></td><td><code>limit</code> may only reduce what the default path would have returned. Asking for 3 gets at most 3; asking for 200 gets the default maximum. No new retrieval work and no new spend.</td></tr>
</table>
<p>The response always reports both halves — <code>limit_requested</code>, <code>limit_applied</code>, <code>limit_mode</code>, <code>evidence_budget</code> — so what you asked for and what you got are never confused.</p>

<h2>How scope filters results</h2>
<p><code>recallScope</code> chooses which rows are eligible, and the filter is applied in SQL before ranking begins.</p>
<table>
<tr><th>Value</th><th>Reads</th></tr>
<tr><td><code>global</code> (default)</td><td>The whole memory space; project tags ignored.</td></tr>
<tr><td><code>project_only</code></td><td>Only rows tagged with the project id you sent.</td></tr>
<tr><td><code>project_then_global</code></td><td>That project's rows plus rows with no project. Never another project.</td></tr>
</table>
<p>Both project modes require <code>memoryScope.projectId</code>; without it the call fails with <code>project_id_required</code>. An unrecognised value fails with <code>invalid_recall_scope</code>. Sub-tenant isolation is a separate and stricter boundary — see <a href="#/concepts/scope">Who memory belongs to</a>.</p>

<h2>Read-your-writes</h2>
<p>Text you saved seconds ago has not finished becoming a graph yet. Recall consults the staging index first and leads the context with it:</p>
<pre><button class="copy">Copy</button><code>Just saved (still being organized): I started boxing this week, three sessions.</code></pre>
<p>This is checked <i>before</i> the empty-graph exit, so the very first save on a brand-new account is exactly the case that does not answer "I know nothing". The response sets <code>staged_used</code> and <code>staged_count</code>. Staging is a bridge, never a source of truth: once the write settles, the rows stop matching and the graph answers instead. Your exclude rules gate staging exactly as they gate the graph.</p>

<h2>What can go wrong</h2>
<table>
<tr><th>Symptom</th><th>Cause</th><th>Fix</th></tr>
<tr><td><code>count: 0</code> on something you know you saved</td><td>Usually scope: a project-tagged memory is not visible to a caller sending no project scope</td><td>Send the same <code>memoryScope.projectId</code>, or use <code>global</code></td></tr>
<tr><td>Empty context right after a save</td><td>Extraction has not settled; staging did not match the query's words</td><td>Check <code>GET /v1/packets/&lt;id&gt;/status</code> before concluding anything</td></tr>
<tr><td><code>invalid_limit</code></td><td><code>limit</code> is not a whole number in 1–200</td><td>Send an integer in range</td></tr>
<tr><td><code>recall_mode: "no_recall"</code></td><td>The gate classified the query as small talk or a pure task</td><td>Phrase it as a question about you</td></tr>
<tr><td>A friendly "give it a few seconds"</td><td>The per-user recall limiter</td><td>Back off briefly; this is a message, not an error</td></tr>
</table>
<div class="note">The query itself is never stored as memory. Its packet keeps a cryptographic identity and content-free routing metadata only, so a question containing private text does not become a second durable copy of it.</div>

<h2>Related</h2>
<ul>
<li><a href="#/concepts/graph">The memory graph</a> — graph expansion and validity windows.</li>
<li><a href="#/concepts/scope">Who memory belongs to</a> — tenancy versus project tagging.</li>
<li><a href="#/concepts/memory">How memory works</a> — what is in the graph to be found.</li>
<li><a href="#/api/rest">REST API reference</a> — the full request and response shape.</li>
</ul>
` };

PAGES["/guides/save"] = { title: "Save memory", html: `
<h1>Save memory</h1>
<p class="lede">How to write to Itsuki from your own code: the two write endpoints, when to use each, and how to prove afterwards that something actually landed.</p>

<h2>What a save actually is</h2>
<p>A save is not a log line. You submit text; the engine reads it, proposes durable facts, grounds each one in your actual words, and writes what survives into the graph as <b>memories</b>, <b>details</b>, and <b>events</b>. Small talk, questions, and chatter are dropped on purpose — see <a href="#/concepts/memory">How memory works</a>.</p>
<p>Two consequences follow, and both shape the code you write:</p>
<ul>
<li><b>A successful write does not mean a memory exists.</b> It means your content was accepted. Extraction runs in the background and may legitimately decide there was nothing durable in it.</li>
<li><b>You find out what happened from the receipt</b>, not from the HTTP status. Every write returns a receipt, and every accepted write returns a <code>source_packet_id</code> you can poll.</li>
</ul>

<h2>A single save</h2>
<p><code>POST /v1/save</code> with a <code>content</code> string is the simplest write. Use it when the user said one durable thing and you want that one thing remembered.</p>
<pre><button class="copy">Copy</button><code>curl -X POST https://itsuki.app/v1/save \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{
    "content": "I started learning Kotlin this week.",
    "idempotencyKey": "save-kotlin-2026-08-27-01"
  }'</code></pre>
<p>Send the user's own words. The extractor grounds facts against the text it receives, so a paraphrase you invented is weaker evidence than the sentence the person actually typed. If the sentence contains a pronoun that only makes sense in context ("I finally finished it"), pass the preceding turns as <code>recentContext</code> so references can be resolved.</p>

<h2>Saving a conversation</h2>
<p>There are two ways to hand over several messages, and they are not interchangeable.</p>
<h3>POST /v1/save with mode: "conversation"</h3>
<p>An <b>explicit</b> capture: "remember this conversation". It produces a Conversation page alongside any facts extracted from the turns.</p>
<pre><button class="copy">Copy</button><code>curl -X POST https://itsuki.app/v1/save \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{
    "mode": "conversation",
    "conversationId": "chat-42",
    "messages": [
      {"role": "user", "content": "We decided on Postgres for the new service."},
      {"role": "assistant", "content": "Noted - Postgres it is."}
    ]
  }'</code></pre>
<p>A stable <code>conversationId</code> matters here: re-sending the same conversation converges onto one Conversation page and advances it as a forward revision. Without it, every explicit save makes its own page.</p>
<h3>POST /v1/ingest</h3>
<p>Bounded, <b>ongoing</b> ingestion for an app that feeds Itsuki as the user talks. It is not an "explicit save" — it is a stream you keep pushing, digested when there is enough to digest. Add <code>"flush": true</code> to force digestion of whatever is held.</p>
<pre><button class="copy">Copy</button><code>curl -X POST https://itsuki.app/v1/ingest \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{
    "conversationId": "chat-42",
    "messages": [
      {"role": "user", "content": "Moving the standup to 9:30 from next Monday."}
    ],
    "flush": true
  }'</code></pre>
<p><code>/v1/ingest</code> enforces its own wire limits: 30 messages per request, 4,000 Unicode code points per message, 120,000 combined, and 512 KiB of serialized UTF-8 JSON. Do not hard-code those numbers — fetch <code>GET /v1/ingest/limits</code>, which returns exactly the values the server enforces. Over the byte limit is a machine-readable <code>413</code>; a count, character, or delivery-metadata violation is a <code>422</code>.</p>
<div class="note">If you want recall and capture in the same round trip — the usual shape for a chat loop — use <code>POST /v1/turn</code> instead. It recalls for the newest user message and feeds the turn into the capture lane, and its response carries both a <code>recall</code> and a <code>collect</code> block.</div>

<h2>Idempotency keys</h2>
<p>Every write accepts <code>idempotencyKey</code>. Its job is to make a retry safe: the same key with the same content is processed once and later attempts replay the first result instead of writing a second copy.</p>
<p>Two rules follow from how the key is stored:</p>
<ul>
<li><b>Same key, same content</b> → replay. You get the original receipt back, marked as a duplicate.</li>
<li><b>Same key, different content</b> → <code>409 idempotency_conflict</code>. The response names the key and the packet that already owns it. Mint a new key rather than mutating the old one.</li>
</ul>
<p>If you omit the key entirely, the server derives one from the content hash plus the conversation, thread, or session identifiers you sent. That still deduplicates identical re-sends, but a caller that controls its own keys can retry a network timeout without wondering whether the first attempt landed. Both SDKs expose a generator: <code>MemoryClient.newIdempotencyKey()</code> in JavaScript, <code>MemoryClient.new_idempotency_key()</code> in Python.</p>

<h2>What comes back</h2>
<p>A successful write returns a JSON object built around the receipt:</p>
<pre><button class="copy">Copy</button><code>{
  "ok": true,
  "mode": "direct_save",
  "source": "save_memory",
  "fired": true,
  "processing": true,
  "summary": "Accepted: memory extraction is processing.",
  "source_packet_id": "sp_...",
  "receipt_id": "receipt_...",
  "receipt": { "outcome": "accepted", "saved": { "nodes": 0, "slices": 0 }, "received": 1 },
  "counts": { "received": 1 }
}</code></pre>
<table>
<tr><th>Field</th><th>What it tells you</th></tr>
<tr><td><code>ok</code></td><td>The request was accepted. Not "a memory was created".</td></tr>
<tr><td><code>processing</code></td><td><code>true</code> means enrichment is still running in the background.</td></tr>
<tr><td><code>source_packet_id</code></td><td>The handle for that background work. Poll it to reach a terminal state.</td></tr>
<tr><td><code>receipt</code></td><td>What was written, updated, or skipped, with an <code>outcome</code> of <code>wrote</code>, <code>accepted</code>, or <code>ignored</code>.</td></tr>
<tr><td><code>receipt_id</code></td><td>The durable receipt, also listed by <code>GET /v1/receipts</code> and in the dashboard's History.</td></tr>
<tr><td><code>summary</code></td><td>One human sentence. Safe to show a user; never parse it.</td></tr>
</table>
<div class="warn">An <code>outcome</code> of <code>ignored</code> with the reason "nothing durable here" is a normal, successful result. It means the engine read your text and decided it held no lasting fact. Treat it as information, not as an error to retry.</div>

<h2>Verifying that it landed</h2>
<p>When <code>processing</code> is true, the write is not finished. Poll the packet until it reaches a terminal state — <code>enriched</code>, <code>failed</code>, or the legacy <code>completed</code>:</p>
<pre><button class="copy">Copy</button><code>curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  "https://itsuki.app/v1/packets/sp_.../status"</code></pre>
<p>The response is one job row: <code>status</code>, <code>attempts</code>, <code>counts</code> of nodes/slices/events/edges/pages written, <code>receipt_id</code>, and — when relevant — <code>cancelled_by_delete</code> and <code>outcome_reason</code>. Both SDKs wrap the loop:</p>
<pre><button class="copy">Copy</button><code>const receipt = await memory.add("I started learning Kotlin this week.", {
  idempotencyKey: memory.newIdempotencyKey(),
});
if (receipt.source_packet_id) {
  const job = await memory.waitFor(receipt.source_packet_id);
  console.log(job.status, job.counts);
}</code></pre>
<p><code>waitFor</code> polls until terminal and returns the last response with <code>timed_out: true</code> if it runs out of time — it does not throw. For a fleet-wide view of the same information, <code>GET /v1/jobs</code> lists accepted work and <a href="#/operate/observability">the ops overview</a> rolls it up per account.</p>

<h2>Scoping the write</h2>
<table>
<tr><th>Field</th><th>Effect</th></tr>
<tr><td><code>userId</code></td><td>Selects a sub-tenant memory space inside your account — one per end user of your product. Omit it to write to the key owner's own memory. Spaces are isolated: nothing written under one value is reachable from another.</td></tr>
<tr><td><code>memoryScope.projectId</code>, <code>memoryScope.projectName</code></td><td>Tags the write with a project. This is metadata inside the same memory space, not a separate tenant, and it is what <code>recallScope</code> later filters on.</td></tr>
<tr><td><code>conversationId</code>, <code>threadId</code>, <code>sourceId</code></td><td>Provenance, and the inputs to the derived idempotency key when you send none.</td></tr>
<tr><td><code>source</code></td><td>Your own 1–64 character label for the lane this write came from. It is what <code>DELETE /v1/memories?source=…</code> later matches on, so choose it deliberately.</td></tr>
<tr><td><code>captureDensity</code></td><td><code>standard</code> (selective, the default) or <code>dense</code> (keep every durable detail).</td></tr>
</table>
<p>See <a href="#/concepts/scope">Who memory belongs to</a> for the full isolation model.</p>

<h2>Common errors</h2>
<table>
<tr><th>Status</th><th>Error</th><th>What to do</th></tr>
<tr><td>400</td><td><code>unknown_parameter</code></td><td>A field name is wrong. The message names the offending key and suggests the closest real one. Unknown parameters are refused, never silently dropped.</td></tr>
<tr><td>400</td><td><code>content is required for a memory save</code></td><td>You sent no <code>content</code> and no <code>mode: "conversation"</code>.</td></tr>
<tr><td>401</td><td><code>unauthorized</code></td><td>Missing or wrong credential. If you pasted an MCP link, the key is only the last path segment.</td></tr>
<tr><td>403</td><td><code>insufficient_scope</code></td><td>The key is read-only. Writes need <code>memory:write</code>.</td></tr>
<tr><td>409</td><td><code>idempotency_conflict</code></td><td>That key already owns different content. Use a new key.</td></tr>
<tr><td>409</td><td><code>source_write_erased</code></td><td>A confirmed delete erased this scope while the write was in flight. Do not retry — write it again as new content. See <a href="#/concepts/delete">Delete &amp; erasure</a>.</td></tr>
<tr><td>413 / 422</td><td>ingest contract violation</td><td>Too many bytes, messages, or characters. Read <code>GET /v1/ingest/limits</code> and split the batch.</td></tr>
<tr><td>422</td><td><code>extraction_failed_terminal</code></td><td>This exact content failed extraction permanently. Quarantine your copy; do not delete it and do not retry unchanged.</td></tr>
<tr><td>429</td><td><code>queue_full</code></td><td>Backpressure. The body carries <code>retry_after_s</code>; honour it.</td></tr>
<tr><td>429</td><td>rate limit</td><td>Writes are limited to 60 per minute per user. Back off and retry.</td></tr>
</table>
<p>Next: <a href="#/guides/recall">read it back</a>, or <a href="#/guides/rules">decide what is allowed to be saved in the first place</a>.</p>
` };

PAGES["/guides/recall"] = { title: "Recall memory", html: `
<h1>Recall memory</h1>
<p class="lede">How to query stored memory, what the response contains, and how to put the result into a prompt without flooding it.</p>

<h2>What recall is for</h2>
<p>Recall answers one question: <i>what does this account already know that is relevant to what the user just said?</i> It is not a database scan and not full-text search over transcripts. It ranks the graph against your query and compiles the winning slice into a compact text block that is bounded so it cannot swamp a model's context window.</p>
<p>That block — the <code>context</code> field — is the whole point. Everything else in the response is there so you can explain, debug, or filter what you got.</p>

<h2>A first query</h2>
<pre><button class="copy">Copy</button><code>curl -X POST https://itsuki.app/v1/recall \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"query": "what am I learning?"}'</code></pre>
<p>Only <code>query</code> is required, and only <code>memory:read</code> scope is needed. In the SDKs:</p>
<pre><button class="copy">Copy</button><code>// JavaScript
const { context, count, items } = await memory.search("what am I learning?");

# Python
result = memory.search("what am I learning?")
print(result["context"])</code></pre>

<h2>Reading the response</h2>
<pre><button class="copy">Copy</button><code>{
  "ok": true,
  "summary": "Found relevant memory.",
  "context": "Kotlin (skill, state: active) - started learning this week...",
  "count": 2,
  "items": [
    { "type": "node", "id": "node_...", "label": "Kotlin",
      "category": "skill", "cluster": "learning",
      "project_id": null, "project_name": null, "score": 7.9 }
  ],
  "recall_mode": "light_recall",
  "recall_scope": "global",
  "recall_latency_ms": 412,
  "processing_note": null,
  "receipt_id": "receipt_..."
}</code></pre>
<table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><code>context</code></td><td>The compiled, prompt-ready text block. This is what a connected AI receives. An empty string with <code>count: 0</code> means nothing relevant is stored — a real answer, not an error.</td></tr>
<tr><td><code>count</code></td><td>How many entries went into the context.</td></tr>
<tr><td><code>items</code></td><td>One row per selected entry: <code>type</code> (<code>node</code> or <code>page</code>), <code>id</code>, label or title, cluster, project tags, and the ranking <code>score</code>. Use these ids with <code>GET /v1/memories/&lt;id&gt;</code> to show sources.</td></tr>
<tr><td><code>recall_mode</code></td><td>Which retrieval plan ran: <code>light_recall</code>, <code>deep_recall</code> (a broad profile question), <code>update_mode</code> (a "what changed recently" question), or <code>no_recall</code>.</td></tr>
<tr><td><code>recall_scope</code></td><td>The scope actually applied — <code>global</code> unless you asked otherwise.</td></tr>
<tr><td><code>processing_note</code></td><td>Set when a recent save is still being enriched. Read it before concluding "nothing was saved".</td></tr>
<tr><td><code>receipt_id</code></td><td>Recall is receipted too. Lookups appear in History with outcome <code>recalled</code> or <code>no_recall</code>.</td></tr>
</table>
<div class="note"><b><code>recall_mode: "no_recall"</code> is deliberate.</b> A gate skips the lookup for greetings, self-contained small talk, and impersonal utility requests ("write me a regex"). Nothing failed; personal memory was simply not relevant. The <code>reason</code> field says which rule fired.</div>

<h2>Using the context in a prompt</h2>
<p>Put the block in a system message, labelled, and say plainly that it may be empty. Do not interleave it with the user's turn, and do not reformat it — the compiler already bounds it (roughly 1,800 characters for a targeted query, up to about 2,800 for a broad one) and re-wrapping it just costs tokens.</p>
<pre><button class="copy">Copy</button><code>import { MemoryClient } from "itsuki";

const memory = new MemoryClient({ apiKey: process.env.ITSUKI_API_KEY });

async function answer(userMessage) {
  const { context, count } = await memory.search(userMessage, { userId: "alex" });

  const messages = [
    {
      role: "system",
      content: count
        ? \`What you already know about this user:\\n\${context}\\n\\n\` +
          "Use it when it is relevant. Do not read anything into it that is not written there."
        : "You have no stored memory about this user yet.",
    },
    { role: "user", content: userMessage },
  ];

  return callYourModel(messages);
}</code></pre>
<p>If you want the lookup and the capture of the same turn in one round trip, call <code>POST /v1/turn</code> instead: its response carries <code>recall</code> (the object above) and <code>collect</code> (what was captured), plus the <code>rules</code> that governed the decision.</p>

<h2>Scoping to one of your users</h2>
<p>Your API key is your account. Pass <code>userId</code> and the query runs inside that end user's isolated memory space:</p>
<pre><button class="copy">Copy</button><code>curl -X POST https://itsuki.app/v1/recall \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{"query": "what can I cook for dinner?", "userId": "alex"}'</code></pre>
<p>Pick the value yourself — a user id, a tenant slug, anything stable and opaque. It is hashed with your account id before it becomes a storage key, so two different accounts sending <code>"alex"</code> never touch the same memory. You can also bind it once on the client: <code>new MemoryClient({ apiKey, userId: "alex" })</code>.</p>
<div class="warn">A misspelled parameter is refused, not ignored. <code>usr_id</code> returns <code>400 unknown_parameter</code> naming the key. This is on purpose: silently dropping a tenant selector is how a multi-tenant app ships believing isolation worked.</div>

<h2>Narrowing to a project</h2>
<p>Projects are tags <i>inside</i> a memory space. <code>recallScope</code> chooses how they are used:</p>
<table>
<tr><th>Value</th><th>What it reads</th></tr>
<tr><td><code>global</code> (default)</td><td>The whole memory space; project tags ignored.</td></tr>
<tr><td><code>project_only</code></td><td>Only memory tagged with the project id you send.</td></tr>
<tr><td><code>project_then_global</code></td><td>That project first, then untagged account memory to fill the remaining budget.</td></tr>
</table>
<pre><button class="copy">Copy</button><code>curl -X POST https://itsuki.app/v1/recall \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{
    "query": "how does this project deploy?",
    "memoryScope": { "projectId": "atlas", "projectName": "Atlas" },
    "recallScope": "project_then_global"
  }'</code></pre>
<p>The two project modes require <code>memoryScope.projectId</code>; without it the call is refused with <code>project_id_required</code>. Neither mode ever reaches into a different project. If a plugin saved something in a project and your script cannot find it, that is almost always a scope question rather than a bug — see <a href="#/concepts/scope">Who memory belongs to</a>.</p>

<h2>Limits and depth</h2>
<p><code>limit</code> is the caller's evidence budget: a whole number between 1 and 200. The response reports both sides of the negotiation so you always know what you asked for and what you got: <code>limit_requested</code>, <code>limit_applied</code>, <code>limit_mode</code>, and <code>evidence_budget</code>.</p>
<pre><button class="copy">Copy</button><code>{"query": "everything about the Atlas migration", "limit": 25}</code></pre>
<p>Narrowing always works. Widening past what the standard plan would have produced is depth behaviour and only applies to accounts on that retrieval path, which is why <code>limit_applied</code> can come back lower than <code>limit_requested</code>. Reads are not currently rate limited by the same bucket as writes, but recall has its own per-user limiter; when it trips you get a friendly message with <code>recall_status: "rate_limited"</code> and an empty context, not an error.</p>

<h2>When recall returns nothing</h2>
<ol>
<li><b>Check <code>recall_mode</code>.</b> <code>no_recall</code> means the gate skipped the lookup for that phrasing. Ask a question, or phrase it about the user.</li>
<li><b>Check <code>processing_note</code>.</b> A save from moments ago may still be enriching. Poll its packet — see <a href="#/guides/save">Save memory</a>.</li>
<li><b>Check the scope.</b> Wrong <code>userId</code>, or <code>project_only</code> against a project with nothing in it, both return an honest empty result.</li>
<li><b>Check that anything was stored at all.</b> <code>GET /v1/status</code> returns live counts; <code>GET /v1/memories</code> lists what exists, newest first.</li>
</ol>

<h2>Common errors</h2>
<table>
<tr><th>Status</th><th>Error</th><th>What to do</th></tr>
<tr><td>400</td><td><code>query is required</code></td><td><code>query</code> must be a string.</td></tr>
<tr><td>400</td><td><code>invalid_limit</code></td><td><code>limit</code> must be a whole number between 1 and 200.</td></tr>
<tr><td>400</td><td><code>invalid_recall_scope</code></td><td><code>recallScope</code> must be <code>global</code>, <code>project_only</code>, or <code>project_then_global</code>.</td></tr>
<tr><td>400</td><td><code>project_id_required</code></td><td>A project mode needs <code>memoryScope.projectId</code>.</td></tr>
<tr><td>400</td><td><code>unknown_parameter</code></td><td>A field name is wrong; the message names it.</td></tr>
<tr><td>401 / 403</td><td><code>unauthorized</code>, <code>insufficient_scope</code></td><td>Recall needs a valid credential with <code>memory:read</code>.</td></tr>
<tr><td>409</td><td><code>idempotency_conflict</code></td><td>You reused an <code>idempotencyKey</code> for a different query. Recall rarely needs one at all.</td></tr>
</table>
<p>Related: <a href="#/api/rest">REST API reference</a> · <a href="#/guides/rules">Control what gets remembered</a> · <a href="#/concepts/memory">How memory works</a>.</p>
` };

PAGES["/guides/rules"] = { title: "Control what gets remembered", html: `
<h1>Control what gets remembered</h1>
<p class="lede">Rules are the policy layer over extraction: what may become memory, what never may, and how densely the engine captures. They are enforced in code, so every door obeys them.</p>

<h2>Why rules exist</h2>
<p>A memory system you cannot constrain is one you eventually stop trusting. Rules give you two different kinds of control, and it is worth knowing which is which:</p>
<ul>
<li><b>Guidance.</b> Your custom instructions and category names are injected into the extraction prompt. They steer the model.</li>
<li><b>Enforcement.</b> Includes and excludes are deterministic filters applied in code, before and after the model runs. A model that ignores your guidance still cannot write excluded content.</li>
</ul>
<p>Rules live at the engine, not at any one door, so an MCP client, the REST API, an SDK, and the dashboard all get the same decision.</p>

<h2>The rule fields</h2>
<table>
<tr><th>Field</th><th>Type</th><th>Effect</th></tr>
<tr><td><code>customInstructions</code></td><td>string, up to 2,000 characters</td><td>Plain language guidance in the extraction prompt: <i>"Always save exam progress. Never save jokes."</i></td></tr>
<tr><td><code>includes</code></td><td>up to 32 terms, 80 characters each</td><td>An allow-list. When non-empty, content must match at least one term to become memory.</td></tr>
<tr><td><code>excludes</code></td><td>up to 32 terms, 80 characters each</td><td>A deny-list. Content matching any term never becomes memory. <b>Excludes always win over includes.</b></td></tr>
<tr><td><code>customCategories</code></td><td>up to 16 entries of <code>{ name, description }</code></td><td>Your own filing categories, offered to the extractor alongside the built-in set. Filing metadata, never permission.</td></tr>
<tr><td><code>captureDefault</code></td><td><code>auto</code> | <code>graph_only</code></td><td><code>auto</code> allows whole Conversation pages. <code>graph_only</code> never builds them — facts only.</td></tr>
<tr><td><code>captureDensity</code></td><td><code>standard</code> | <code>dense</code></td><td><code>standard</code> is selective, high-precision capture (the default character of the product). <code>dense</code> lowers the gate and enumerates every durable detail.</td></tr>
<tr><td><code>autoCollect</code></td><td>boolean</td><td>Whether <code>POST /v1/turn</code> feeds the turn into the auto-capture lane. Turn it off and <code>/v1/turn</code> becomes recall-only.</td></tr>
</table>

<h2>How term matching works</h2>
<p>Terms are matched as whole words against the normalized text, not as substrings. <code>"art"</code> will not match "start" or "cartoon". Whitespace inside a term is flexible, so <code>"code review"</code> matches "code  review" too.</p>
<p>Includes behave as an <b>allow-list layered with AND across layers, OR within a layer</b>. In the ordinary single-layer case that is simply: match at least one include term, or the content is rejected with <code>outside_include_rules</code>. A managed project may add its own layer on top of an account's, and then content must satisfy both.</p>
<div class="warn">An empty <code>includes</code> list means "no allow-list" — everything is permitted except what <code>excludes</code> blocks. It does not mean "allow nothing". If you want to capture only two topics, list those two topics.</div>

<h2>Reading and writing rules</h2>
<p><code>GET /v1/rules</code> returns the current policy and its version token:</p>
<pre><button class="copy">Copy</button><code>curl -H "authorization: Bearer $ITSUKI_API_KEY" \\
  https://itsuki.app/v1/rules

{ "ok": true,
  "rules": { "customInstructions": "", "includes": [], "excludes": [],
             "customCategories": [], "captureDefault": "auto",
             "captureDensity": "standard", "autoCollect": true },
  "rules_version": "..." }</code></pre>
<p><code>PUT /v1/rules</code> writes them. The write is a <b>merge</b>: fields you omit keep their current values, so you can change one thing without restating the rest. Writing requires <code>memory:write</code> scope and, in a managed project, the <code>project.rules.edit</code> capability — project admins and organization owners/admins, not members or viewers.</p>
<div class="warn"><b>Rules writes are precondition-gated.</b> Send the <code>rules_version</code> you just read, as <code>expected_version</code> in the body or as an <code>If-Match</code> header. Omit both and the call is refused with <code>428 precondition_required</code>; send a stale one and it is refused rather than overwriting somebody else's newer policy. If you send both, they must agree.</div>
<pre><button class="copy">Copy</button><code>curl -X PUT https://itsuki.app/v1/rules \\
  -H "authorization: Bearer $ITSUKI_API_KEY" \\
  -H "content-type: application/json" \\
  -d '{
    "expected_version": "PASTE_THE_VERSION_FROM_GET",
    "rules": {
