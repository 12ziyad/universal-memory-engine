[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-itsuki"
version = "0.1.0"
description = "Itsuki memory for Google ADK: a native BaseMemoryService plus the automatic capture ADK does not ship."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Only 3.10-3.13 are CI-verified. 3.14 will be a tested bump, never an
# implicit claim.
requires-python = ">=3.10,<3.14"
# The floor is 2.5.0, not 2.0: that is the first release whose normal run path
# invokes after_run_callback under a run_error guard AND exposes
# on_run_error_callback, which is what makes capture and cleanup possible.
# The ceiling is the highest minor we actually test, because ADK ships
# breaking changes in minor releases.
dependencies = ["itsuki>=0.3,<0.4", "google-adk>=2.5,<2.8"]
keywords = ["google-adk", "adk", "memory", "ai", "agent", "llm", "itsuki"]

[project.urls]
Repository = "https://github.com/12ziyad/universal-memory-engine"
Documentation = "https://itsuki.app/docs/"
Issues = "https://github.com/12ziyad/universal-memory-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["adk_itsuki"]
artifacts = ["adk_itsuki/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["/adk_itsuki", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Generated by scripts/sync-kernel.mjs from packages/_kernel/py; checked there.
module = "adk_itsuki._kernel"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["itsuki.*", "google.adk.*", "google.genai.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["adk_itsuki.service", "adk_itsuki.plugin", "adk_itsuki.capture", "adk_itsuki.registry"]
disallow_subclassing_any = false
disallow_any_unimported = false
warn_return_any = false
