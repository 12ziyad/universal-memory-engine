[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-itsuki"
version = "0.1.0"
description = "Itsuki memory for Hermes Agent: bounded recall before each turn, exactly-once capture after each settled one."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# The host's own bound. This package only ever runs inside a Hermes venv, so
# claiming a wider range than the host supports would be a lie.
requires-python = ">=3.11,<3.14"
dependencies = ["itsuki>=0.3,<0.4"]
keywords = ["hermes", "hermes-agent", "memory", "ai", "agent", "llm", "itsuki"]

[project.urls]
Repository = "https://github.com/12ziyad/universal-memory-engine"
Documentation = "https://itsuki.app/docs/"
Issues = "https://github.com/12ziyad/universal-memory-engine/issues"

# Discovery route 1: entry point. Present on hosts new enough to scan it, inert
# on hermes-agent 0.19.0 (whose loader has no entry-point support at all).
# Route 2 - the directory deployment written by `hermes-itsuki install` - is
# what actually covers every supported host.
[project.entry-points."hermes_agent.memory_providers"]
itsuki = "hermes_itsuki:register"

[project.scripts]
hermes-itsuki = "hermes_itsuki.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hermes_itsuki"]
artifacts = ["hermes_itsuki/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["/hermes_itsuki", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.mypy]
python_version = "3.11"
strict = true
# The vendored kernel is generated from packages/_kernel/py by
# scripts/sync-kernel.mjs; its types are the shared copy's problem, and editing
# it here would be drift. The parity gate is what protects it.


[[tool.mypy.overrides]]
# The vendored kernel is generated by scripts/sync-kernel.mjs from
# packages/_kernel/py. Hand-fixing its annotations here would be exactly the
# drift the parity gate exists to prevent, so it is checked at its source.
module = "hermes_itsuki._kernel"
ignore_errors = true

[[tool.mypy.overrides]]
# agent.* ships no type information, so subclassing its ABC is necessarily Any.
module = ["agent.*", "itsuki.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "hermes_itsuki.provider"
disallow_subclassing_any = false
disallow_any_unimported = false
warn_return_any = false
