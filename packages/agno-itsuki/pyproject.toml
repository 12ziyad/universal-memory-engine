[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agno-itsuki"
version = "0.1.0"
description = "Itsuki memory tools for Agno agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["itsuki>=0.3,<0.4", "agno>=2.9,<3"]
keywords = ["agno", "memory", "ai", "agent", "llm", "itsuki"]

[project.urls]
Repository = "https://github.com/12ziyad/universal-memory-engine"
Documentation = "https://itsuki.app/docs/"
Issues = "https://github.com/12ziyad/universal-memory-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["agno_itsuki"]

[tool.hatch.build.targets.sdist]
include = ["/agno_itsuki", "/LICENSE", "/README.md", "/pyproject.toml"]
