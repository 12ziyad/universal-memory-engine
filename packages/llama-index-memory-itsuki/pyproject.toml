[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-memory-itsuki"
version = "0.1.0"
description = "Itsuki long-term memory block for LlamaIndex."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["itsuki>=0.3,<0.4", "llama-index-core>=0.14,<0.16"]
keywords = ["llamaindex", "llama-index", "memory", "ai", "agent", "llm", "itsuki"]

[project.urls]
Repository = "https://github.com/12ziyad/universal-memory-engine"
Documentation = "https://itsuki.app/docs/"
Issues = "https://github.com/12ziyad/universal-memory-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.hatch.build.targets.sdist]
include = ["/llama_index", "/LICENSE", "/README.md", "/pyproject.toml"]
