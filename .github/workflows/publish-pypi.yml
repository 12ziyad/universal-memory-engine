# Publish one Python distribution to PyPI, with attestations.
#
# Covers the four framework adapters AND the `itsuki` Python SDK itself
# (package input `itsuki` → sdk/python). One workflow on purpose: PyPI trusted
# publishing binds to (owner, repository, workflow filename, environment), so
# every Python release rides the same audited pipeline and the same gates.
#
# Each package publishes from its OWN GitHub environment, and the mapping is
# hardcoded below (`plan.outputs.environment`). That is the security property
# worth the extra job: the OIDC token's `sub` claim carries the environment
# name, so a publisher configured for `pypi-agno-itsuki` cannot be used to
# publish anything else, even from this same workflow. The publish job asserts
# its own minted identity against the intended publisher BEFORE upload, so a
# mismatch fails on our side with a readable diff instead of as a bare PyPI
# `invalid-publisher`.
#
# PyPI differs from npm in the one way that matters here: a Trusted Publisher
# can be configured as a PENDING publisher BEFORE a project exists, so these
# packages never need an API token at all — not even for the first release.
# Configure each publisher on pypi.org (owner 12ziyad, repository
# universal-memory-engine, workflow publish-pypi.yml, environment as mapped
# below), then dispatch with dry_run=false. No secret is referenced anywhere.
#
# `dry_run` defaults to TRUE. Publishing is a deliberate, owner-approved act:
# every gate runs either way, and only the final step is gated.
name: Publish Python adapter

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which distribution to build and publish'
        type: choice
        required: true
        options:
          - itsuki
          - agno-itsuki
          - llama-index-memory-itsuki
          - camel-itsuki
          - chatdev-itsuki
          - hermes-itsuki
          - adk-itsuki
      dry_run:
        description: 'Run every gate and build the wheel, but do not publish'
        type: boolean
        default: true

# No workflow-wide id-token: only the publish job mints one, and only it needs
# to. The test matrix runs with read-only contents and nothing else.
permissions:
  contents: read

jobs:
  # The package → (directory, GitHub environment) mapping, resolved once. A
  # job-level `environment:` may read `needs`, which is why this is its own
  # job rather than a step. Every arm is hardcoded: an unmapped package can
  # never reach the publish job at all.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dir: ${{ steps.map.outputs.dir }}
      sdk: ${{ steps.map.outputs.sdk }}
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - name: Map the package to its directory and publishing environment
        id: map
        shell: bash
        # inputs.package comes from a fixed choice list, so it is not
        # injectable; the case below is exhaustive over that list.
        run: |
          case "${{ inputs.package }}" in
            itsuki)
              dir=sdk/python; sdk=true; environment=pypi ;;
            agno-itsuki)
              dir=packages/agno-itsuki; sdk=false; environment=pypi-agno-itsuki ;;
            llama-index-memory-itsuki)
              dir=packages/llama-index-memory-itsuki; sdk=false; environment=pypi-llama-index-memory-itsuki ;;
            camel-itsuki)
              dir=packages/camel-itsuki; sdk=false; environment=pypi-camel-itsuki ;;
            hermes-itsuki)
              dir=packages/hermes-itsuki; sdk=false; environment=pypi-hermes-itsuki ;;
            adk-itsuki)
              dir=packages/adk-itsuki; sdk=false; environment=pypi-adk-itsuki ;;
            chatdev-itsuki)
              # HELD. Mapped so the gates can still run in dry_run; the publish
              # job refuses a real publish for it by name.
              dir=packages/chatdev-itsuki; sdk=false; environment=pypi-chatdev-itsuki ;;
            *)
              echo "unmapped package: ${{ inputs.package }}" >&2; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "package=${{ inputs.package }} dir=$dir environment=$environment"

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The CAMEL adapter does atomic rename and path work, which behaves
        # differently on Windows. Both platforms must be green.
        os: [ubuntu-latest, windows-latest]
        # Every version a package claims in requires-python gets a leg. The
        # four packages that shipped before this campaign keep exactly the
        # list they were released under -- widening their matrix here would be
        # a change to a published artifact's gate, smuggled in as a refactor.
        python-version: ${{ fromJSON(
          inputs.package == 'hermes-itsuki' && '["3.11","3.12","3.13"]'
          || inputs.package == 'adk-itsuki' && '["3.10","3.11","3.12","3.13"]'
          || '["3.10","3.12","3.13"]') }}

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve the distribution directory
        id: resolve
        shell: bash
        # inputs.package comes from a fixed choice list, so it is not
        # injectable. The SDK lives outside packages/.
        run: |
          if [ "${{ inputs.package }}" = "itsuki" ]; then
            echo "dir=sdk/python" >> "$GITHUB_OUTPUT"
            echo "sdk=true" >> "$GITHUB_OUTPUT"
          else
            echo "dir=packages/${{ inputs.package }}" >> "$GITHUB_OUTPUT"
            echo "sdk=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse a drifted kernel copy
        run: node scripts/sync-kernel.mjs --check

      - name: Install the workspace SDK and the target distribution
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./sdk/python
          if [ "${{ steps.resolve.outputs.sdk }}" != "true" ]; then
            python -m pip install ./${{ steps.resolve.outputs.dir }}
          fi
          python -m pip install pytest

      # The two agent packages promise specific host versions, so CI must
      # prove them against those versions rather than whatever pip resolves.
      # Existing packages are untouched by these steps.
      - name: Install the pinned floor host (hermes-itsuki)
        if: ${{ inputs.package == 'hermes-itsuki' }}
        run: python -m pip install "hermes-agent==0.19.0"

      - name: Tests (adk-itsuki floor leg, google-adk 2.5.0)
        if: ${{ inputs.package == 'adk-itsuki' }}
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: |
          python -m pip install "google-adk==2.5.0" pytest-asyncio
          python -m pytest tests -q
          python -m pip install "google-adk==2.7.0"

      - name: Install async test support (adk-itsuki)
        if: ${{ inputs.package == 'adk-itsuki' }}
        run: python -m pip install pytest-asyncio

      - name: Tests
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: python -m pytest tests -q

      - name: Strict types (SDK only)
        if: ${{ steps.resolve.outputs.sdk == 'true' }}
        working-directory: sdk/python
        run: |
          python -m pip install mypy
          python -m mypy --strict itsuki tests/type_contract.py

  publish:
    needs: [plan, test]
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    permissions:
      contents: read
      # Trusted publishing and attestations both need a signed OIDC token. This
      # is the only job that has one.
      id-token: write

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify this job's OIDC identity matches the intended publisher
        shell: bash
        env:
          EXPECTED_ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          set -euo pipefail
          # Mint the same kind of token the upload will use and assert its
          # claims. The token itself is never printed, written, or exported —
          # only the three public claims PyPI matches on. A mismatch here is a
          # misconfiguration, and failing on it is the whole point.
          RESPONSE="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi")"
          claims="$(RESPONSE="$RESPONSE" python - <<'PY'
          import base64, json, os
          token = json.loads(os.environ["RESPONSE"])["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({k: claims.get(k) for k in ("sub", "repository", "workflow_ref", "environment")}))
          PY
          )"
          unset RESPONSE
          echo "claims: $claims"
          EXPECTED_SUB="repo:12ziyad/universal-memory-engine:environment:${EXPECTED_ENVIRONMENT}"
          CLAIMS="$claims" EXPECTED_SUB="$EXPECTED_SUB" EXPECTED_ENVIRONMENT="$EXPECTED_ENVIRONMENT" python - <<'PY'
          import json, os, sys
          claims = json.loads(os.environ["CLAIMS"])
          expected = {
              "sub": os.environ["EXPECTED_SUB"],
              "repository": "12ziyad/universal-memory-engine",
              "environment": os.environ["EXPECTED_ENVIRONMENT"],
          }
          failures = [f"{k}: expected {v!r}, got {claims.get(k)!r}"
                      for k, v in expected.items() if claims.get(k) != v]
          workflow_ref = claims.get("workflow_ref") or ""
          if not workflow_ref.startswith("12ziyad/universal-memory-engine/.github/workflows/publish-pypi.yml@"):
              failures.append(f"workflow_ref: unexpected {workflow_ref!r}")
          if failures:
              print("FAIL: OIDC identity does not match the intended PyPI publisher")
              print("\n".join(failures))
              sys.exit(1)
          print(f"OK: identity matches the {expected['environment']} publisher for "
                f"{os.environ.get('GITHUB_REPOSITORY')} via publish-pypi.yml")
          PY

      - name: Refuse a held package
        if: ${{ inputs.package == 'chatdev-itsuki' && inputs.dry_run == false }}
        run: |
          echo "chatdev-itsuki is HELD: it has no live-LLM workflow proof yet."
          echo "Editing this workflow to lift the hold is a deliberate, reviewed act."
          exit 1

      - name: Build the distributions
        working-directory: ${{ needs.plan.outputs.dir }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Report artifact hashes
        working-directory: ${{ needs.plan.outputs.dir }}
        run: sha256sum dist/*

      - name: Verify the built contents
        working-directory: ${{ needs.plan.outputs.dir }}
        shell: bash
        env:
          IS_SDK: ${{ needs.plan.outputs.sdk }}
        run: |
          echo "--- wheel contents ---"
          python - <<'PY'
          import glob, os, re, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          print("\n".join(sorted(names)))

          failures = []
          if not any("LICENSE" in n for n in names):
              failures.append("LICENSE is missing from the wheel")

          with zipfile.ZipFile(wheel) as archive:
              for name in names:
                  if not name.endswith(".py"):
                      continue
                  body = archive.read(name)
                  if re.search(rb"(itsuki|uml)_live_[A-Za-z0-9_-]{10}", body):
                      failures.append(f"credential-shaped string in {name}")

          # Adapters must arrive with the kernel vendored, not as a dangling
          # import. The SDK IS the shared transport; it carries no kernel.
          if os.environ.get("IS_SDK") != "true":
              if not any(n.endswith("_kernel.py") for n in names):
                  failures.append("the vendored kernel is missing")

          if failures:
              print("FAIL: " + "; ".join(failures))
              sys.exit(1)
          print("OK: no credentials, license present, kernel policy satisfied")
          PY

      - name: Refuse unreviewed runtime dependencies
        working-directory: ${{ needs.plan.outputs.dir }}
        shell: bash
        env:
          IS_SDK: ${{ needs.plan.outputs.sdk }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          deps = project.get("dependencies", [])
          print("dependencies:", deps)
          # The SDK is allowed exactly its transport. An adapter is allowed
          # exactly the SDK and its host. Anything else is a new supply-chain
          # surface and needs a deliberate decision, not a merge.
          if os.environ.get("IS_SDK") == "true":
              allowed = {"httpx"}
          else:
              allowed = {"itsuki", "agno", "llama-index-core", "camel-ai", "google-adk"}
          names = {d.split(">")[0].split("<")[0].split("=")[0].split("[")[0].strip() for d in deps}
          unexpected = names - allowed
          if unexpected:
              print("FAIL: unreviewed runtime dependencies:", unexpected)
              sys.exit(1)
          print("OK: dependency set is exactly what was reviewed")
          PY

      - name: Audit installed dependencies
        working-directory: ${{ needs.plan.outputs.dir }}
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict --progress-spinner=off || true

      - name: Publish to PyPI with attestations
        if: ${{ inputs.dry_run == false }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ needs.plan.outputs.dir }}/dist
          # attestations are on by default; stated here because they are the
          # provenance story for these packages.
          attestations: true

      - name: Dry run only
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "dry_run was true — every gate passed and the distributions were built."
          echo "Re-run with dry_run=false to publish."
