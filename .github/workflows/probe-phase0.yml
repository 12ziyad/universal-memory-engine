# DISPOSABLE Phase-0 probe workflow — delete after evidence is captured.
#
# Owner-approved (2026-08-16) for isolated empirical probes only:
#   no secrets · contents: read only · no OIDC (id-token not requested)
#   no publishing, no deployment, no production Itsuki calls
#
# Everything runs inside the ephemeral GitHub runner. Memory traffic goes to a
# loopback stub; model traffic goes to a loopback OpenAI-compatible stub. No
# credentials of any kind are used or required.
name: probe-phase0

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Which probe set to run
        type: choice
        options: [opencode, antigravity, both]
        default: both

permissions:
  contents: read

jobs:
  opencode:
    if: ${{ inputs.probe == 'opencode' || inputs.probe == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Isolate (P0a) — pin every path under the runner workspace
        run: |
          set -eux
          ROOT="$RUNNER_TEMP/probe"
          mkdir -p "$ROOT"/{home,project/.opencode/plugin,logs,xdg/config,xdg/data,xdg/cache,xdg/state}
          echo "PROBE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PROBE_LOG_DIR=$ROOT/logs" >> "$GITHUB_ENV"
          # Runner HOME is already disposable; record its pre-state for the isolation diff.
          ls -la "$HOME" > "$ROOT/logs/home-before.txt" || true
          ls -la "$HOME/.config" > "$ROOT/logs/home-config-before.txt" 2>/dev/null || echo "(no ~/.config)" > "$ROOT/logs/home-config-before.txt"

      - name: Install pinned host + SDK
        run: |
          set -eux
          cd "$PROBE_ROOT"
          npm init -y >/dev/null
          npm install --no-audit --no-fund opencode-ai@1.18.18 @opencode-ai/sdk@1.18.18
          ./node_modules/.bin/opencode --version | tee "$PROBE_LOG_DIR/version.txt"

      - name: Write probe assets (plugin + loopback model stub + config)
        run: |
          set -eux
          cp .github/probe-assets/probe-plugin.ts "$PROBE_ROOT/project/.opencode/plugin/probe.ts"
          cp .github/probe-assets/stub-llm.mjs    "$PROBE_ROOT/stub-llm.mjs"
          cp .github/probe-assets/opencode.json   "$PROBE_ROOT/project/opencode.json"
          cp .github/probe-assets/driver.mjs      "$PROBE_ROOT/driver.mjs"

      - name: Start loopback model stub
        run: |
          set -eux
          cd "$PROBE_ROOT"
          nohup node stub-llm.mjs > "$PROBE_LOG_DIR/stub.out" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4141/v1/models >/dev/null && break
            sleep 1
          done
          curl -s http://127.0.0.1:4141/v1/models | head -c 200; echo

      - name: P0a — isolation diff after a bare host invocation
        run: |
          set -eux
          cd "$PROBE_ROOT/project"
          "$PROBE_ROOT/node_modules/.bin/opencode" --version >/dev/null 2>&1 || true
          { echo "== ~/.config/opencode"; ls -la "$HOME/.config/opencode" 2>&1 || true
            echo "== ~/.local/share/opencode"; ls -la "$HOME/.local/share/opencode" 2>&1 || true
            echo "== ~/.cache/opencode"; ls -la "$HOME/.cache/opencode" 2>&1 || true
          } | tee "$PROBE_LOG_DIR/p0a-paths.txt"

      - name: P1/P3/P4/P5/P13a/P14/P15 — headless runs + forced exit
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'
        run: |
          set -eux
          cd "$PROBE_ROOT/project"
          OC="$PROBE_ROOT/node_modules/.bin/opencode"

          # P1 + P3 + P4(success): one headless turn through `opencode run`.
          timeout 180 "$OC" run "PROBE_TURN_ONE: say hello briefly" \
            > "$PROBE_LOG_DIR/run1.out" 2>"$PROBE_LOG_DIR/run1.err" || echo "run1 exit=$?"

          # P4(error): force the stub to fail mid-turn.
          timeout 180 "$OC" run "PROBE_WANT_ERROR please fail" \
            > "$PROBE_LOG_DIR/run-err.out" 2>"$PROBE_LOG_DIR/run-err.err" || echo "run-err exit=$?"

          # P4(abort) + P14: kill the process mid-turn (slow stub), then inspect staging.
          timeout 60 "$OC" run "PROBE_WANT_SLOW long answer please" \
            > "$PROBE_LOG_DIR/run-slow.out" 2>"$PROBE_LOG_DIR/run-slow.err" &
          OCPID=$!
          sleep 12
          kill -9 $OCPID 2>/dev/null || true
          wait $OCPID 2>/dev/null || true
          echo "forced-exit done"

          # P5/P13a: inspect sessions via the SDK-backed driver (server mode).
          timeout 240 node "$PROBE_ROOT/driver.mjs" > "$PROBE_LOG_DIR/driver.out" 2>&1 || echo "driver exit=$?"

      - name: Collect evidence
        if: always()
        run: |
          set -eux
          cd "$PROBE_ROOT"
          mkdir -p out
          cp -r "$PROBE_LOG_DIR" out/logs || true
          # Hook trace is the primary artifact.
          [ -f "$PROBE_LOG_DIR/hooks.jsonl" ] && wc -l "$PROBE_LOG_DIR/hooks.jsonl" || echo "NO HOOK TRACE"
          [ -f "$PROBE_LOG_DIR/llm.jsonl" ] && cat "$PROBE_LOG_DIR/llm.jsonl" || echo "NO LLM TRACE"
          echo "===== hooks.jsonl (full) ====="
          cat "$PROBE_LOG_DIR/hooks.jsonl" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-probe-evidence
          path: ${{ env.PROBE_ROOT }}/out
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -rf "$PROBE_ROOT" || true

  antigravity:
    if: ${{ inputs.probe == 'antigravity' || inputs.probe == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Credential-free Antigravity CLI probes (P6/P10/P12 statics)
        run: |
          set -eux
          ROOT="$RUNNER_TEMP/agprobe"
          mkdir -p "$ROOT/logs" "$ROOT/plugin/skills/itsuki-doctor"
          echo "AG_ROOT=$ROOT" >> "$GITHUB_ENV"

          # Install path + version only. NO sign-in, NO turns, NO credentials.
          set +e
          curl -fsSL https://antigravity.google/cli/install.sh -o "$ROOT/install.sh"
          echo "install.sh fetch exit=$?" | tee "$ROOT/logs/fetch.txt"
          head -40 "$ROOT/install.sh" >> "$ROOT/logs/fetch.txt" 2>/dev/null
          bash "$ROOT/install.sh" > "$ROOT/logs/install.txt" 2>&1
          echo "install exit=$?" >> "$ROOT/logs/install.txt"
          set -e
          tail -30 "$ROOT/logs/install.txt" || true

          export PATH="$HOME/.local/bin:$PATH"
          set +e
          agy --version   > "$ROOT/logs/version.txt" 2>&1; echo "version exit=$?" >> "$ROOT/logs/version.txt"
          agy --help      > "$ROOT/logs/help.txt"    2>&1; echo "help exit=$?"    >> "$ROOT/logs/help.txt"
          agy plugin --help > "$ROOT/logs/plugin-help.txt" 2>&1; echo "exit=$?" >> "$ROOT/logs/plugin-help.txt"
          agy plugin list > "$ROOT/logs/plugin-list-before.txt" 2>&1; echo "exit=$?" >> "$ROOT/logs/plugin-list-before.txt"

          # P6/P12: install a minimal local plugin from a directory, observe the
          # resolved on-disk path and the enable/disable/uninstall lifecycle.
          cp -r .github/probe-assets/ag-plugin/. "$ROOT/plugin/"
          agy plugin install "$ROOT/plugin" > "$ROOT/logs/plugin-install.txt" 2>&1; echo "exit=$?" >> "$ROOT/logs/plugin-install.txt"
          agy plugin list    > "$ROOT/logs/plugin-list-after.txt" 2>&1; echo "exit=$?" >> "$ROOT/logs/plugin-list-after.txt"
          find "$HOME/.gemini" -maxdepth 4 -print > "$ROOT/logs/gemini-tree.txt" 2>&1 || true
          agy plugin disable itsuki-probe > "$ROOT/logs/plugin-disable.txt" 2>&1; echo "exit=$?" >> "$ROOT/logs/plugin-disable.txt"
          agy plugin enable  itsuki-probe > "$ROOT/logs/plugin-enable.txt"  2>&1; echo "exit=$?" >> "$ROOT/logs/plugin-enable.txt"
          agy plugin uninstall itsuki-probe > "$ROOT/logs/plugin-uninstall.txt" 2>&1; echo "exit=$?" >> "$ROOT/logs/plugin-uninstall.txt"
          find "$HOME/.gemini" -maxdepth 4 -print > "$ROOT/logs/gemini-tree-after.txt" 2>&1 || true
          set -e
          echo "== collected =="; ls -la "$ROOT/logs"
          for f in "$ROOT"/logs/*.txt; do echo "===== $f ====="; cat "$f"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antigravity-probe-evidence
          path: ${{ env.AG_ROOT }}/logs
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -rf "$AG_ROOT" || true
