# Publish the itsuki JavaScript SDK to npm, with provenance.
#
# The SDK predates the adapter workflows and was last published by hand; this
# closes that gap — release automation, provenance and gates identical in
# spirit to the audited adapter pipelines, so no artifact of this repository is
# ever published from a laptop again.
#
# Authentication, as with the adapters:
#   1. Trusted publishing (tokenless, preferred). `itsuki` already exists on
#      npm, so the owner can configure the Trusted Publisher for this workflow
#      BEFORE the 0.2.1 release — then no token is involved at all.
#   2. Otherwise a granular access token in NPM_TOKEN.
#
# `dry_run` defaults to TRUE. Publishing is a deliberate, owner-approved act:
# every gate below runs either way, and only the final step is gated.
name: Publish JS SDK

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The SDK is pure ESM with no runtime dependencies; the Windows leg
        # exists to prove the behavioural suite and the pack are portable.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm to a trusted-publishing-capable major
        run: npm install -g npm@11

      - name: Report toolchain
        run: |
          node --version
          npm --version

      - name: Install repository dev dependencies
        # The SDK's behavioural contract suite lives in the repository's own
        # test tree (test/sdk_js.spec.js), which is where it was audited.
        run: npm ci

      - name: Behavioural contract tests
        run: npx vitest run --config vitest.unit.config.mjs test/sdk_js.spec.js

      - name: Version gate
        working-directory: sdk/js
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "package.json version: $version"
          if [ "$version" != "0.2.1" ]; then
            echo "FAIL: expected 0.2.1 — bump this gate deliberately with the version"
            exit 1
          fi
          # Refuse to overwrite a published version: npm would reject it anyway,
          # but failing here keeps the error readable and pre-publish. Only the
          # publishing leg enforces this — during a real publish the ubuntu leg
          # publishes while the slower Windows leg is still testing, and the
          # sibling's own fresh publish then tripped this check (observed on the
          # 0.2.1 release run).
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && npm view "itsuki@$version" version >/dev/null 2>&1; then
            echo "FAIL: itsuki@$version already exists on the registry"
            exit 1
          fi
          echo "OK: version gate passed"

      - name: Refuse runtime dependencies
        working-directory: sdk/js
        shell: bash
        run: |
          node -e "const p=require('./package.json');const d={...(p.dependencies||{}),...(p.peerDependencies||{}),...(p.optionalDependencies||{})};console.log(JSON.stringify(d));if(Object.keys(d).length){console.error('FAIL: the SDK must have zero dependencies of any kind');process.exit(1)}"
          echo "OK: dependency-free"

      - name: Verify the packed contents
        working-directory: sdk/js
        shell: bash
        run: |
          npm pack --silent
          echo "--- tarball contents ---"
          tar -tzf itsuki-*.tgz | sort > tarball-contents.txt
          cat tarball-contents.txt
          echo "--- exactly the whitelisted files ship ---"
          printf '%s\n' package/LICENSE package/README.md package/index.d.ts package/index.js package/package.json | sort > expected-contents.txt
          if ! diff -u expected-contents.txt tarball-contents.txt; then
            echo "FAIL: tarball contents diverge from the whitelist"
            exit 1
          fi
          echo "OK: five files, nothing else"
          echo "--- refuse to ship secrets ---"
          if tar -xzOf itsuki-*.tgz | grep -qE '(itsuki|uml)_live_[A-Za-z0-9_-]{10}'; then
            echo "FAIL: a credential-shaped string is present in the tarball"
            exit 1
          fi
          echo "OK: no credential-shaped strings"
          echo "--- refuse to ship install hooks ---"
          if node -e "const s=require('./package.json').scripts||{};process.exit(['preinstall','install','postinstall'].some(k=>s[k])?1:0)"; then
            echo "OK: no install scripts"
          else
            echo "FAIL: package declares an install-time script"
            exit 1
          fi

      - name: Report artifact hash
        working-directory: sdk/js
        shell: bash
        run: sha256sum itsuki-*.tgz

      - name: Prove the packed bytes export the contract
        shell: bash
        # Install the tarball into a scratch project and run the SDK's own
        # installed-surface probe against the INSTALLED files — the same bytes
        # a user would get from the registry.
        run: |
          probe_dir=$(mktemp -d)
          cp sdk/js/itsuki-*.tgz "$probe_dir/"
          cd "$probe_dir"
          npm init -y >/dev/null 2>&1
          npm install --silent ./itsuki-*.tgz
          node "$GITHUB_WORKSPACE/sdk/js/test-d/tarball-probe.mjs" "$probe_dir/node_modules/itsuki/index.js"
          echo "OK: installed surface matches the contract"

      # Only one platform publishes; the other exists to prove portability.
      - name: Publish to npm with provenance
        if: ${{ inputs.dry_run == false && matrix.os == 'ubuntu-latest' }}
        working-directory: sdk/js
        run: npm publish --provenance --access public
        env:
          # Empty when trusted publishing is configured; npm then uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run only
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "dry_run was true — every gate passed and the tarball was built."
          echo "Re-run with dry_run=false to publish."
