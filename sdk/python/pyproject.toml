[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itsuki"
version = "0.1.0"
description = "Itsuki — one private memory for every AI. Official Python SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]
keywords = ["memory", "ai", "llm", "mcp", "agents", "itsuki"]

[project.urls]
Repository = "https://github.com/12ziyad/universal-memory-engine"

[tool.hatch.build.targets.wheel]
packages = ["itsuki"]
